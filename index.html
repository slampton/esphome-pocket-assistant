<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pocket Assistant Web Installer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #0d1117;
      color: #c9d1d9;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { color: #58a6ff; margin-bottom: 8px; }
    p { line-height: 1.6; color: #8b949e; }
    select {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 15px;
      margin: 20px 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pocket Assistant</h1>
    <p>Handheld ESPHome Voice Satellite & Media Controller for Home Assistant.</p>

    <label for="board-select"><strong>Choose Your Hardware:</strong></label>
    <select id="board-select" onchange="document.getElementById('installer').setAttribute('manifest', this.value)">
      <option value="manifest.json">Waveshare ESP32-S3-Touch-AMOLED-1.75C</option>
    </select>

    <div style="margin-top: 20px;">
      <esp-web-install-button id="installer" manifest="manifest.json"></esp-web-install-button>
    </div>

    <p style="font-size: 13px; margin-top: 25px;">
      Plug your Pocket Assistant into your computer with a USB-C data cable and open this page in Chrome or Edge.
    </p>
  </div>
</body>
</html>

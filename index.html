<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Assistant Web Installer</title>
    <script
      type="module"
      src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
    ></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0d1117;
        color: #c9d1d9;
        text-align: center;
        padding: 50px 20px;
        margin: 0;
      }
      .card {
        background-color: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        max-width: 520px;
        margin: 0 auto;
        padding: 40px 30px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
      h1 {
        color: #f0f6fc;
        margin-top: 0;
      }
      p {
        color: #8b949e;
        line-height: 1.6;
      }
      .install-container {
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pocket Assistant</h1>
      <p>Official firmware installer for the Waveshare ESP32-S3-Touch-AMOLED-1.75C.</p>
      <p>Connect your Pocket Assistant to your computer via USB (in Chrome or Edge) to install or update the latest release.</p>
      <div class="install-container">
        <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
      </div>
    </div>
  </body>
</html>

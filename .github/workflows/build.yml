name: Build & Deploy Web Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    tags: [ v* ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - file: pocket-assistant-1.75c.yaml
            name: pocket-assistant-175c
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware with ESPHome
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: ${{ matrix.target.file }}
          version: "2026.9.0"
          complete-manifest: true

      - name: Stage Web Files
        run: |
          mkdir -p public
          cp -r output/* public/
          cp index.html public/ || true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

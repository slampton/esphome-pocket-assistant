# Hardware Abstraction Layer (HAL): Waveshare 1.75C

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # ESP-IDF 5.5 replacement for CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      # ESPHome 2026.10 / ESP-IDF 5.5.6 PSRAM bus contention guardrails (prevents 512KB TCP / 512 RX buffer bloat)
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "128"
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      # Maximize ESP32-S3 L1 Data & Instruction Caches (64KB D-Cache / 64B line, 32KB I-Cache)
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Execute instructions and read-only data from 80MHz Octal PSRAM so micro_wake_word
      # and audio pipelines never stall during NVS flash writes
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      # Allocate mbedTLS buffers in PSRAM to preserve internal DMA SRAM
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
    advanced:
      enable_idf_experimental_features: true
      nvs_cache_in_psram: true
      flash_chip: gd


psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false


i2c:
  - id: bus_internal
    sda: GPIO15
    scl: GPIO14
    frequency: 400kHz
    scan: false


spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

# Dual Master I2S Buses (Multiplexed via GPIO Matrix to Physical Pins)


motion:
  - platform: qmi8658
    id: imu
    address: 0x6B
    accelerometer_range: 4G
    gyroscope_range: 2048DPS
    update_interval: 100ms


# On-Board Speaker Power Amplifier Enable (PA_EN: GPIO46)
switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON


# Physical Side Push-to-Talk / Action Button (GPIO0)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    name: "Boot Button"
    id: boot_button


# 1.75" 466x466 Circular AMOLED Display (CO5300 over 80MHz Quad-SPI)
display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    reset_pin: GPIO1
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6
      offset_height: 0
    brightness: 200
    update_interval: 1s


# Capacitive Touch Controller (CST9220 @ 30Hz over I2C bus_internal)
touchscreen:
  - platform: cst9220
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x5A
    interrupt_pin:
      number: GPIO11
      mode: INPUT_PULLUP
    reset_pin: GPIO2
    touch_timeout: 50ms
    update_interval: 33ms
    transform:
      mirror_x: true
      mirror_y: true

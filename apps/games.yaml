# ==============================================================================
# 🎮 Application: Motion Physics Games
# Real-time 20 FPS games (Marble Maze, Archery, Treat Catcher) powered by QMI8658
# ==============================================================================

switch:
  - platform: template
    name: "Show Games App"
    id: show_games_switch
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      then:
        - lambda: |-
            if (id(gui_page) == 3) {
              for (int i = 1; i <= 5; i++) {
                int next_p = (3 + i) % 5;
                bool ok = (next_p == 0 ? id(show_clock_switch).state :
                          (next_p == 1 ? id(show_stopwatch_switch).state :
                          (next_p == 2 ? id(show_music_switch).state :
                          (next_p == 3 ? id(show_games_switch).state : id(show_system_switch).state))));
                if (ok) {
                  id(gui_page) = next_p;
                  id(disp1).update();
                  break;
                }
              }
            }

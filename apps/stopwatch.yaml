# ==============================================================================
# ⏱️ Application: Precision Lap Stopwatch
# Millisecond accuracy, circular progress arc, dedicated tactile lap/reset controls
# ==============================================================================

switch:
  - platform: template
    name: "Show Stopwatch App"
    id: show_stopwatch_switch
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      then:
        - lambda: |-
            if (id(gui_page) == 1) {
              for (int i = 1; i <= 5; i++) {
                int next_p = (1 + i) % 5;
                bool ok = (next_p == 0 ? id(show_clock_switch).state :
                          (next_p == 1 ? id(show_stopwatch_switch).state :
                          (next_p == 2 ? id(show_music_switch).state :
                          (next_p == 3 ? id(show_games_switch).state : id(show_system_switch).state))));
                if (ok) {
                  id(gui_page) = next_p;
                  id(disp1).update();
                  break;
                }
              }
            }

  - platform: template
    name: "Stopwatch Mechanical Audio"
    id: stopwatch_sound_enabled
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# ==============================================================================
# ⚙️ Application: System Status & Diagnostic Dashboard
# Battery & Wi-Fi telemetry, charging indicator, brightness preset cycler, restart
# ==============================================================================

switch:
  - platform: template
    name: "Show System App"
    id: show_system_switch
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      then:
        - lambda: |-
            if (id(gui_page) == 4) {
              for (int i = 1; i <= 5; i++) {
                int next_p = (4 + i) % 5;
                bool ok = (next_p == 0 ? id(show_clock_switch).state :
                          (next_p == 1 ? id(show_stopwatch_switch).state :
                          (next_p == 2 ? id(show_music_switch).state :
                          (next_p == 3 ? id(show_games_switch).state : id(show_system_switch).state))));
                if (ok) {
                  id(gui_page) = next_p;
                  id(disp1).update();
                  break;
                }
              }
            }

select:
  - platform: template
    name: "Default Start App"
    id: default_start_app
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${default_start_app}
    options:
      - "Clock"
      - "Stopwatch"
      - "Music"
      - "Games"
      - "System"

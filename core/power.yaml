# ==============================================================================
# 🧭 Pocket Assistant: Power Management & Standby Subsystem
# Architecture: Three-Tier Power State Machine (Active, Standby, Hibernate)
# Target: Waveshare ESP32-S3-Touch-AMOLED-1.75C (AXP2101 PMIC @ 0x34)
# ==============================================================================

globals:
  - id: sleep_start_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: is_hibernating
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: hibernate_countdown_val
    type: int
    restore_value: no
    initial_value: '0'

  - id: display_power_state
    type: int
    restore_value: no
    initial_value: '0' # 0 = ACTIVE, 1 = SCREENSAVER, 2 = SCREEN_OFF / STANDBY

  - id: sleep_menu_page
    type: int
    restore_value: no
    initial_value: '1' # 1..2 (Page 1 & Page 2 of Sleep & Wake Submenu)

binary_sensor:
  - platform: template
    name: "USB Power Connected"
    id: usb_connected
    device_class: power
    entity_category: diagnostic

  - platform: template
    name: "Battery Charging"
    id: batt_charging
    device_class: battery_charging
    entity_category: diagnostic

  - platform: template
    name: "Pickup Detected"
    id: pickup_detected
    device_class: motion
    lambda: |-
      static uint32_t last_active_time = 0;
      static bool is_active = false;

      // When screen is off/standby and Pickup Wake is disabled (e.g. unplugged on battery with "Docked Only"),
      // the QMI8658 IMU is completely powered down (CTRL7 = 0x00) — keep pickup_detected false.
      if (id(display_power_state) != 0) {
        auto pw_mode = id(pickup_wake_mode).current_option();
        if (pw_mode == "Disabled" || (pw_mode == "Docked Only" && !id(usb_connected).state)) {
          is_active = false;
          return false;
        }
      }

      float dyn = id(motion_mag).state;
      if (isnan(dyn)) return false;

      // Dual-Threshold In-Hand Detection:
      // While screen is active, 0.040g maintains active hold so screen never sleeps in your hand.
      // While screen is sleeping/standby, 0.15g requires a deliberate pickup motion to wake.
      float thresh = (id(display_power_state) == 0) ? 0.040f : 0.15f;
      const uint32_t active_ms = (id(display_power_state) == 0) ? 3000 : 2000;
      uint32_t now_ms = millis();

      if (dyn > thresh) {
        is_active = true;
        last_active_time = now_ms;
      } else if (is_active) {
        if (now_ms - last_active_time >= active_ms) {
          is_active = false;
        }
      }
      return is_active;
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                auto mode = id(pickup_wake_mode).current_option();
                if (mode == "Disabled") return false;
                if (mode == "Docked Only" && !id(usb_connected).state) return false;
                return true;
            then:
              - if:
                  condition:
                    lambda: 'return id(display_power_state) != 0 || !id(display_brightness).current_values.is_on();'
                  then:
                    - script.execute: wake_to_active_state
                  else:
                    - script.execute: screen_sleep_timer
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(display_power_state) == 0;'
            then:
              - script.execute: screen_sleep_timer

sensor:
  - platform: template
    name: "Battery Level"
    id: batt_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      uint8_t reg = 0xA4;
      uint8_t pct = 0;
      if (id(bus_internal).write_readv(0x34, &reg, 1, &pct, 1) == esphome::i2c::ERROR_OK) {
        if (pct <= 100) {
          // Read hardware charge status from PMU Status 2 (REG 01H)
          uint8_t reg1 = 0x01;
          uint8_t stat1 = 0;
          bool is_chg_done = false;
          if (id(bus_internal).write_readv(0x34, &reg1, 1, &stat1, 1) == esphome::i2c::ERROR_OK) {
            uint8_t chg_state = stat1 & 0x07;
            if (chg_state == 4) is_chg_done = true; // State 4: Charge Done
          }

          // Calibrated 0..99% -> 0..100% scale:
          // The AXP2101 fuel gauge (REG 0xA4) natively settles at 99% across the normal
          // resting full-charge plateau (~4.11V-4.19V). Mapping 0..99 linearly to 0..100
          // allows the gauge to reach 100% naturally on the charger AND remain at 100%
          // after unplugging without artificial USB-only clamps or NVS boot overrides.
          float scaled = (pct >= 99 || is_chg_done)
                             ? 100.0f
                             : std::roundf((static_cast<float>(pct) * 100.0f) / 99.0f);

          static float filtered_pct = -1.0f;
          static uint32_t last_step_ms = 0;
          static uint32_t below_since_ms = 0;
          uint32_t now_ms = millis();

          // 1. Initial boot / wake seeding directly from calibrated hardware reading
          if (filtered_pct < 0.0f) {
            filtered_pct = scaled;
            last_step_ms = now_ms;
            below_since_ms = 0;
            return filtered_pct;
          }

          // 2. Rate-limited monotonic smoothing
          if (id(usb_connected).state) {
            below_since_ms = 0;
            if (is_chg_done || scaled >= 100.0f) {
              filtered_pct = 100.0f;
              last_step_ms = now_ms;
            } else if (scaled > filtered_pct) {
              filtered_pct = std::min(filtered_pct + 1.0f, scaled);
              last_step_ms = now_ms;
            } else if (scaled < filtered_pct - 3.0f && (now_ms - last_step_ms >= 30000U)) {
              filtered_pct = std::max(filtered_pct - 1.0f, scaled);
              last_step_ms = now_ms;
            }
          } else {
            // Discharging on battery: monotonic non-increasing with 45s sustained-drop debounce
            // so transient Wi-Fi/speaker load sags and charger unplug transitions never cause
            // instant 1%-per-5s step-downs.
            if (scaled < filtered_pct) {
              if (below_since_ms == 0) {
                below_since_ms = now_ms;
              }
              const uint32_t hold_ms = (filtered_pct - scaled >= 4.0f) ? 20000U : 45000U;
              if ((now_ms - below_since_ms >= hold_ms) && (now_ms - last_step_ms >= hold_ms)) {
                filtered_pct = std::max(filtered_pct - 1.0f, scaled);
                last_step_ms = now_ms;
                below_since_ms = now_ms;
              }
            } else {
              below_since_ms = 0;
            }
          }

          filtered_pct = std::max(0.0f, std::min(100.0f, filtered_pct));
          return filtered_pct;
        }
      }
      return {};

  - platform: template
    name: "Battery Voltage"
    id: batt_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      uint8_t reg = 0x34;
      uint8_t buf[2] = {0, 0};
      if (id(bus_internal).write_readv(0x34, &reg, 1, buf, 2) == esphome::i2c::ERROR_OK) {
        uint16_t mv = ((buf[0] & 0x3F) << 8) | buf[1];
        return (float)mv / 1000.0f;
      }
      return {};

button:
  - platform: template
    name: "Power: Enter Hibernate"
    id: enter_deep_sleep_btn
    icon: "mdi:sleep"
    entity_category: config
    on_press:
      - script.execute: enter_deep_sleep

  - platform: template
    name: "Power: Trigger Screensaver"
    id: trigger_screensaver_btn
    icon: "mdi:weather-night"
    entity_category: config
    on_press:
      - script.execute: trigger_screensaver_now

switch:
  - platform: template
    name: "Power: Instant Crown Hibernate"
    id: instant_crown_hibernate_switch
    entity_category: config
    icon: "mdi:lightning-bolt"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(instant_crown_hibernate_switch).publish_state(true);'
    turn_off_action:
      - lambda: 'id(instant_crown_hibernate_switch).publish_state(false);'

  - platform: template
    name: "Power: Docked Screensaver"
    id: docked_screensaver_switch
    icon: "mdi:power-sleep"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(docked_screensaver_switch).publish_state(true);'
    turn_off_action:
      - lambda: |-
          id(docked_screensaver_switch).publish_state(false);
          if (id(display_power_state) == 1) {
            id(turn_screen_off).execute();
          }

  - platform: template
    name: "Power: Prevent Hibernate"
    id: prevent_deep_sleep_switch
    entity_category: config
    icon: "mdi:sleep-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(prevent_deep_sleep_switch).publish_state(true);'
    turn_off_action:
      - lambda: 'id(prevent_deep_sleep_switch).publish_state(false);'

select:
  - platform: template
    name: "Display: Screen Off Timeout"
    id: display_off_timeout
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "15s"
    options:
      - "10s"
      - "15s"
      - "30s"
      - "1 min"
      - "2 min"
      - "Never"
    set_action:
      - lambda: |-
          id(screen_sleep_timer).execute();
          id(disp1).update();

  - platform: template
    name: "Power: Screensaver Timeout"
    id: screensaver_docked_timeout
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "5 min"
    options:
      - "10s"
      - "15s"
      - "30s"
      - "1 min"
      - "5 min"
      - "Never"
    set_action:
      - lambda: |-
          id(screen_sleep_timer).execute();
          id(disp1).update();

  - platform: template
    name: "Power: Hibernate Timeout"
    id: hibernate_timeout_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "10 min"
    options:
      - "5 min"
      - "10 min"
      - "15 min"
      - "30 min"
      - "Disabled"
    set_action:
      - lambda: |-
          id(disp1).update();

  - platform: template
    name: "Power: Motion Pickup Wake"
    id: pickup_wake_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Docked Only"
    options:
      - "Always On"
      - "Docked Only"
      - "Disabled"
    set_action:
      - lambda: |-
          id(disp1).update();

  - platform: template
    name: "Power: Touch Tap Wake"
    id: tap_wake_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Docked Only"
    options:
      - "Always On"
      - "Docked Only"
      - "Disabled"
    set_action:
      - lambda: |-
          id(disp1).update();

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Poll AXP2101 VBUS and battery charging telemetry (skip during active Voice Assistant to keep bus_internal quiet)
          if (!id(va_active) && !id(va_tts_received)) {
            uint8_t reg0 = 0x00;
            uint8_t stat0 = 0;
            bool vbus = id(usb_connected).state;
            if (id(bus_internal).write_readv(0x34, &reg0, 1, &stat0, 1) == esphome::i2c::ERROR_OK) {
              vbus = (stat0 & 0x20) != 0;
              if (!id(usb_connected).has_state() || id(usb_connected).state != vbus) {
                id(usb_connected).publish_state(vbus);
                // If unplugged while Docked Screensaver is running, transition immediately to Screen Off
                // so the 10 FPS screensaver never stays awake draining the battery.
                if (!vbus && id(display_power_state) == 1) {
                  id(turn_screen_off).execute();
                } else if (id(display_power_state) == 2) {
                  // If screen is currently off, sync QMI8658 IMU power state with new USB state
                  auto pw_mode = id(pickup_wake_mode).current_option();
                  bool pw_active = (pw_mode == "Always On") || (pw_mode == "Docked Only" && vbus);
                  uint8_t qmi_ctrl7[2] = {0x08, static_cast<uint8_t>(pw_active ? 0x01 : 0x00)};
                  id(bus_internal).write(0x6B, qmi_ctrl7, 2);
                }
              }
            }
            uint8_t reg1 = 0x01;
            uint8_t stat1 = 0;
            if (id(bus_internal).write_readv(0x34, &reg1, 1, &stat1, 1) == esphome::i2c::ERROR_OK) {
              uint8_t chg_dir = (stat1 >> 5) & 0x03;
              uint8_t chg_state = stat1 & 0x07;
              // Active charging: VBUS present, current flowing into battery (BatDir==1), and not charge-done (state < 4)
              bool is_charging = vbus && (chg_dir == 1) && (chg_state < 4);
              if (!id(batt_charging).has_state() || id(batt_charging).state != is_charging) {
                id(batt_charging).publish_state(is_charging);
              }
            }
          }

          // On-Board Wake Word (micro_wake_word) Power & Bus Supervisor:
          // Automatically arms/disarms micro_wake_word based on USB dock status, user mode
          // (Docked Only / Always On / Disabled), and shared I2S bus activity, while persisting
          // any Home Assistant wake word selection changes to NVS flash.
          esphome::voice_assistant::poll_and_persist_wake_words(id(va));
          static bool ww_model_initialized = false;
          if (!ww_model_initialized && millis() > 6000U && id(wifi_ctrl).is_connected()) {
            ww_model_initialized = true;
            id(apply_wake_word_sensitivities).execute();
            id(sync_wake_word_state).execute();
          } else if (millis() > 6500U && !id(va_active) && !id(va_tts_received)) {
            auto ww_mode = id(va_wake_word_mode).current_option();
            const bool ww_allowed = (ww_mode == "Always On") ||
                                    (ww_mode == "Docked Only" && id(usb_connected).state);
            const bool ww_busy = id(va).is_running() || !id(va_status_text).empty() ||
                                 id(announcement_mixing_input).is_running() ||
                                 (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                 id(alarm_ringing) || id(timer_ringing) || id(find_my_active) ||
                                 (id(active_game) > 0) || id(is_hibernating) || id(ota_in_progress) ||
                                 !id(wifi_ctrl).is_connected();
            const bool should_ww_run = ww_allowed && !ww_busy;
            if (should_ww_run != id(mww).is_running()) {
              id(sync_wake_word_state).execute();
            }
          }

          // Smart On-Demand BLE Fallback:
          // If the device is awake and configured Wi-Fi is unreachable after 15 seconds,
          // automatically enable BLE so Improv BLE can provision a new Wi-Fi SSID/AP.
          uint32_t now_1s_ms = millis();
          if (id(display_power_state) == 0 && !id(wifi_ctrl).is_connected() &&
              !id(ble_ctrl).is_active() && now_1s_ms > 15000U) {
            ESP_LOGI("ble", "Wi-Fi not connected after 15s: enabling BLE for Improv provisioning");
            id(ble_ctrl).enable();
          }

          // Delayed Background Firmware Update Check:
          // Never block boot or Hibernate wake at t=0. Check quietly after 90 seconds of uptime
          // (and every 6 hours thereafter) only when Wi-Fi is connected and audio/VA are idle.
          static uint32_t last_fw_check_ms = 0;
          if (now_1s_ms > 90000U && id(wifi_ctrl).is_connected() &&
              !id(va_active) && !id(va_tts_received) && !id(ota_in_progress) &&
              (id(pocket_music_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
              (last_fw_check_ms == 0 || (now_1s_ms - last_fw_check_ms >= 21600000U))) {
            last_fw_check_ms = now_1s_ms;
            id(check_firmware_update).execute();
          }

          // Priority 4: Configurable Inactivity Auto-Descent to Deep Sleep
          uint32_t hibernate_timeout_ms = 600000; // default 10 min
          auto st_opt = id(hibernate_timeout_mode).current_option();
          bool auto_sleep_enabled = true;
          if (st_opt == "5 min") hibernate_timeout_ms = 300000;
          else if (st_opt == "10 min") hibernate_timeout_ms = 600000;
          else if (st_opt == "15 min") hibernate_timeout_ms = 900000;
          else if (st_opt == "30 min") hibernate_timeout_ms = 1800000;
          else if (st_opt == "Disabled") auto_sleep_enabled = false;

          if (auto_sleep_enabled &&
              !id(is_hibernating) &&
              !id(prevent_deep_sleep_switch).state &&
              !id(display_brightness).current_values.is_on() &&
              !id(usb_connected).state &&
              !id(ota_in_progress) &&
              (id(pocket_music_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
              !id(stopwatch_running) &&
              !id(timer_running) &&
              !id(timer_ringing) &&
              !id(alarm_ringing) &&
              !id(find_my_active) &&
              !id(va).is_running() &&
              !id(va_tts_received) &&
              !id(announcement_mixing_input).is_running() &&
              (id(active_game) == 0) &&
              id(sleep_start_time) > 0 &&
              (millis() - id(sleep_start_time) >= hibernate_timeout_ms)) {
            ESP_LOGI("power", "Inactivity with screen off exceeded %s: starting hibernation countdown", st_opt.c_str());
            id(sleep_start_time) = 0;
            id(start_hibernation_countdown).execute();
          }

  - interval: 50ms
    then:
      - lambda: |-
          // High-refresh animation loop for active screensavers when docked:
          // Uses the universal audio-aware pacer (20 FPS when music idle, ~13.3 FPS during local Sendspin playback)
          if (id(display_power_state) == 1 && !id(va_active) && id(va_status_text).empty() && !id(is_hibernating)) {
            auto s_style = id(screensaver_style_select).current_option();
            if (s_style != "Ambient Clock" && s_style != "Screen Off") {
              const bool local_music_playing =
                  (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
              if (pocket_ui::should_step_ambient_anim(millis(), local_music_playing,
                                                      id(va_active) || !id(va_status_text).empty(),
                                                      id(alarm_ringing) || id(timer_ringing) || id(find_my_active))) {
                id(disp1).update();
                pocket_ui::record_ambient_frame_ms(millis());
              }
            }
          }

          // High-cadence 20 Hz poll for Top Crown Button (AXP2101 PEK Short/Long Press)
          uint8_t irq_reg = 0x49;
          uint8_t irq_val = 0;
          if (id(bus_internal).write_readv(0x34, &irq_reg, 1, &irq_val, 1) == esphome::i2c::ERROR_OK) {
            if (irq_val & 0x0C) {
              id(handle_crown_button_press).execute();
            }
          }

script:
  - id: handle_crown_button_press
    mode: restart
    then:
      - lambda: |-
          static uint32_t last_crown_press = 0;
          uint32_t now_c = millis();
          if (now_c - last_crown_press < 150) return;
          last_crown_press = now_c;

          // Read AXP2101 IRQ status for top button (PWR / PEK)
          uint8_t irq_reg = 0x49;
          uint8_t irq_val = 0;
          if (id(bus_internal).write_readv(0x34, &irq_reg, 1, &irq_val, 1) == esphome::i2c::ERROR_OK) {
            // Clear all pending IRQs (0x48, 0x49, 0x4A) to ensure GPIO3 returns HIGH
            uint8_t clr_all[2] = {0x48, 0xFF};
            id(bus_internal).write(0x34, clr_all, 2);
            clr_all[0] = 0x49;
            id(bus_internal).write(0x34, clr_all, 2);
            clr_all[0] = 0x4A;
            id(bus_internal).write(0x34, clr_all, 2);

            if (irq_val & 0x0C) {
              if (id(is_hibernating)) {
                if (id(hibernate_countdown_val) > 0) {
                  // Crown press aborts 5-second countdown immediately!
                  id(is_hibernating) = false;
                  id(hibernate_countdown_val) = 0;
                  id(wake_to_active_state).execute();
                }
                return;
              }
              bool is_long = (irq_val & 0x04) != 0;

              // Long press (1.5s hold) initiates instant or countdown hibernation
              if (is_long) {
                if (id(instant_crown_hibernate_switch).state) {
                  id(start_instant_hibernation).execute();
                } else {
                  id(start_hibernation_countdown).execute();
                }
                return;
              }

              // ALARM / TIMER RINGING INTERCEPTION:
              if (id(alarm_ringing)) {
                // Crown short click Snoozes alarm for 5 minutes (300 seconds)
                auto now = id(ha_time).now();
                if (now.is_valid()) {
                  id(alarm_snooze_until) = now.timestamp + 300;
                } else {
                  id(alarm_snooze_until) = (millis() / 1000) + 300;
                }
                id(alarm_ringing) = false;
                id(stop_alarm_sound).execute();
                id(disp1).update();
                id(screen_sleep_timer).execute();
                return;
              }
              if (id(timer_ringing) || id(find_my_active)) {
                // Crown short click Dismisses timer alarm or Find My Device beacon
                id(timer_ringing) = false;
                id(find_my_active) = false;
                id(stop_alarm_sound).execute();
                id(sync_display_brightness).execute();
                id(disp1).update();
                id(screen_sleep_timer).execute();
                return;
              }

              if (!id(display_brightness).current_values.is_on() || id(display_power_state) != 0) {
                id(wake_to_active_state).execute();
                return;
              }

              // Priority 1: Voice Assistant Active Cancellation
              if (id(va_active) || !id(va_status_text).empty()) {
                id(cancel_voice_assistant).execute();
                return;
              }

              id(screen_sleep_timer).execute();

              // Priority 2: In-App Sub-Modals / Overlays / Active Games (Contextual Back/Exit)
              if (id(gui_page) == 3 && id(active_game) > 0) {
                // In active game -> exit game back to Games Menu
                id(active_game) = 0;
                id(disp1).update();
                return;
              } else if (id(gui_page) == 2 && id(music_overlay_mode) > 0) {
                // In Music Menu overlay -> close overlay back to Now Playing player
                id(music_overlay_mode) = 0;
                id(music_hud_active) = true;
                id(music_hud_timer) = millis();
                id(disp1).update();
                return;
              } else if (id(gui_page) == 2 && id(music_hud_active)) {
                // In Full Screen / Letterbox Music HUD -> dismiss HUD back to clean art
                id(music_hud_active) = false;
                id(disp1).update();
                return;
              } else if (id(gui_page) == 4 && id(system_menu_mode) > 0) {
                // In System Submenu -> back out 1 level (or to Music Hub when opened from Page 2)
                if (id(system_menu_mode) == 12) {
                  id(system_menu_mode) = 11;
                } else if (id(system_menu_mode) == 5) {
                  id(system_menu_mode) = 3;
                } else if (id(audio_menu_parent_page) == 2 && id(system_menu_mode) == 9) {
                  id(gui_page) = 2;
                  id(music_overlay_mode) = 5;
                  id(audio_menu_parent_page) = 4;
                } else {
                  id(system_menu_mode) = 0;
                }
                id(disp1).update();
                return;
              } else if (id(gui_page) == 7 && id(remote_subpage) > 0) {
                // In Remote Subpage -> back out to main Remote interface
                id(remote_subpage) = 0;
                id(disp1).update();
                return;
              } else if (id(gui_page) == 8 && id(stuff_subpage) == 1 && pocket_ui::timer_view_slot() > 0) {
                pocket_ui::timer_view_slot() = 0;
                id(disp1).update();
                return;
              } else if (id(gui_page) == 8 && id(stuff_subpage) == 2 && id(alarm_edit_idx) > 0) {
                // In Alarm Editor -> back out to Alarm List
                id(alarm_edit_idx) = 0;
                id(disp1).update();
                return;
              } else if (id(gui_page) == 8 && id(stuff_subpage) == 3) {
                // Stopwatch (Tools Subpage 3): Physical tactile start/stop pusher with dwell latency compensation
                if (!id(stopwatch_running)) {
                  id(stopwatch_running) = true;
                  id(stopwatch_start_time) = millis() - id(stopwatch_elapsed_ms);
                  id(sleep_start_time) = 0;
                  id(display_brightness).turn_on().perform();
                } else {
                  id(stopwatch_running) = false;
                  uint32_t now_stop = millis();
                  uint32_t press_dwell_compensation = 200; // ms
                  if (now_stop - id(stopwatch_start_time) > press_dwell_compensation) {
                    id(stopwatch_elapsed_ms) = (now_stop - id(stopwatch_start_time)) - press_dwell_compensation;
                  } else {
                    id(stopwatch_elapsed_ms) = now_stop - id(stopwatch_start_time);
                  }
                }
                id(disp1).update();
                return;
              } else if (id(gui_page) == 8 && id(stuff_subpage) > 0) {
                // In Tools Micro-App (Timer, Alarms, Flashlight, Level, etc.) -> exit back to Tools Launcher Menu
                // If exiting Flashlight (subpage 5) or Alarms (subpage 2), restore normal scheduled brightness
                if (id(stuff_subpage) == 5 || id(stuff_subpage) == 2) {
                  id(sync_display_brightness).execute();
                }
                id(stuff_subpage) = 0;
                id(disp1).update();
                return;
              }

              // All other primary app screens (Clock Page 0, Music Page 2, Games Launcher Page 3, System Page 4):
              // Crown click puts device into Standby / turns off screen!
              id(turn_screen_off).execute();
              return;
            }
          }

  - id: trigger_screensaver_now
    mode: restart
    then:
      - lambda: |-
          auto s_style = id(screensaver_style_select).current_option();
          if (s_style == "Screen Off") {
            id(turn_screen_off).execute();
            return;
          }
          id(display_power_state) = 1; // SCREENSAVER
          id(sleep_start_time) = 0; // Inhibit deep sleep countdown while screensaver active
          id(display_brightness).turn_on().set_brightness(0.60f).perform(); // Screensaver locked at 60%
          id(disp1).update();

  - id: turn_screen_off
    mode: restart
    then:
      - lambda: |-
          id(display_power_state) = 2; // SCREEN_OFF
          id(sleep_start_time) = millis();
          id(display_brightness).turn_off().perform();
          const bool local_audio_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          // Power down speaker amp only when local music is not playing
          if (!local_audio_playing) {
            id(speaker_enable).turn_off();
          }
          // Power down QMI8658 Gyroscope; only keep Accelerometer active if Motion Pickup Wake
          // is enabled for the current power source ("Always On", or "Docked Only" while on USB).
          // When unplugged on battery with "Docked Only" or "Disabled", power down BOTH (CTRL7 = 0x00)!
          auto pw_mode = id(pickup_wake_mode).current_option();
          const bool pickup_wake_active = (pw_mode == "Always On") ||
                                          (pw_mode == "Docked Only" && id(usb_connected).state);
          uint8_t qmi_ctrl7[2] = {0x08, static_cast<uint8_t>(pickup_wake_active ? 0x01 : 0x00)};
          id(bus_internal).write(0x6B, qmi_ctrl7, 2);
          // On battery power, enable Wi-Fi modem sleep while screen is off only when local audio is not playing
          if (!id(usb_connected).state && !local_audio_playing) {
            extern int esp_wifi_set_ps(int type) __asm__("esp_wifi_set_ps");
            esp_wifi_set_ps(1); // 1: WIFI_PS_MIN_MODEM
          }

  - id: enter_standby_state
    mode: restart
    then:
      - lambda: |-
          auto s_style = id(screensaver_style_select).current_option();
          bool screensaver_allowed = id(usb_connected).state && 
                                     id(docked_screensaver_switch).state && 
                                     (s_style != "Screen Off");
          if (screensaver_allowed) {
            id(display_power_state) = 1; // SCREENSAVER
            id(sleep_start_time) = 0; // Inhibit deep sleep countdown while screensaver active
            id(display_brightness).turn_on().set_brightness(0.60f).perform(); // Screensaver locked at 60%
            if (s_style == "Ambient Clock") {
              id(disp1).update();
            }
          } else {
            id(turn_screen_off).execute();
          }

  - id: wake_to_active_state
    mode: restart
    then:
      - lambda: |-
          // Instantly boost Wi-Fi radio to full performance (zero sleep latency)
          extern int esp_wifi_set_ps(int type) __asm__("esp_wifi_set_ps");
          esp_wifi_set_ps(0); // 0: WIFI_PS_NONE

          pocket_ui::last_screen_wake_ms() = millis();
          id(sleep_start_time) = 0;
          id(display_power_state) = 0; // ACTIVE
          if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING && !id(speaker_enable).state) {
            id(speaker_enable).turn_on();
          }
          // Restore full QMI8658 6-Axis mode (Accelerometer + Gyroscope active)
          uint8_t qmi_full_on[2] = {0x08, 0x03}; // CTRL7: aEN=1, gEN=1
          id(bus_internal).write(0x6B, qmi_full_on, 2);
      - script.execute: sync_display_brightness
      - script.execute: screen_sleep_timer
      - component.update: disp1

  - id: start_instant_hibernation
    mode: restart
    then:
      - lambda: |-
          id(sleep_start_time) = 0;
          id(hibernate_countdown_val) = 0;
          id(is_hibernating) = true;
          id(active_game) = 0;
          id(display_power_state) = 0; // Force ACTIVE so confirmation displays when screen was sleeping
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - media_player.pause: pocket_music_player
      - audio_dac.mute_on: es8311_dac
      - switch.turn_off: speaker_enable
      - script.stop: screen_sleep_timer
      - light.turn_on: display_brightness
      - script.execute: sync_display_brightness
      - component.update: disp1
      - delay: 1000ms
      - script.execute: enter_deep_sleep

  - id: start_hibernation_countdown
    mode: restart
    then:
      - lambda: |-
          id(sleep_start_time) = 0;
          id(hibernate_countdown_val) = 5;
          id(is_hibernating) = true;
          id(active_game) = 0;
          id(display_power_state) = 0; // Force ACTIVE so countdown displays when screen was sleeping
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - media_player.pause: pocket_music_player
      - audio_dac.mute_on: es8311_dac
      - switch.turn_off: speaker_enable
      - script.stop: screen_sleep_timer
      - light.turn_on: display_brightness
      - script.execute: sync_display_brightness
      - component.update: disp1
      - repeat:
          count: 5
          then:
            - delay: 1000ms
            - if:
                condition:
                  lambda: 'return id(is_hibernating);'
                then:
                  - lambda: |-
                      if (id(hibernate_countdown_val) > 1) {
                        id(hibernate_countdown_val)--;
                        id(disp1).update();
                      }
            - if:
                condition:
                  lambda: 'return !id(is_hibernating);'
                then:
                  - script.stop: start_hibernation_countdown
      - if:
          condition:
            lambda: 'return id(is_hibernating);'
          then:
            - lambda: 'id(hibernate_countdown_val) = 0;'
            - script.execute: enter_deep_sleep

  - id: enter_deep_sleep
    mode: restart
    then:
      - lambda: |-
          id(sleep_start_time) = 0;
          id(hibernate_countdown_val) = 0;
          id(active_game) = 0;
          id(is_hibernating) = true;
          id(display_power_state) = 0; // Force ACTIVE so confirmation displays when screen was sleeping
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - media_player.pause: pocket_music_player
      - audio_dac.mute_on: es8311_dac
      - switch.turn_off: speaker_enable
      - script.stop: screen_sleep_timer
      - light.turn_on: display_brightness
      - script.execute: sync_display_brightness
      - component.update: disp1
      - lambda: |-
          // Wait for Top Crown Button (AXP2101 PEK) to be released (up to 3.0s) so PMIC does not immediately re-power on
          int guard = 0;
          while (guard < 150) {
            uint8_t clr_all[2] = {0x48, 0xFF};
            id(bus_internal).write(0x34, clr_all, 2);
            clr_all[0] = 0x49;
            id(bus_internal).write(0x34, clr_all, 2);
            clr_all[0] = 0x4A;
            id(bus_internal).write(0x34, clr_all, 2);

            uint8_t irq_c = 0x49;
            uint8_t val_c = 0;
            if (id(bus_internal).write_readv(0x34, &irq_c, 1, &val_c, 1) == esphome::i2c::ERROR_OK) {
              if ((val_c & 0x0C) == 0) {
                break;
              }
            }
            esp_rom_delay_us(20000);
            guard++;
          }
          esp_rom_delay_us(100000);
      - delay: 500ms  # Ensure visual confirmation is cleanly perceived
      - lambda: |-
          id(is_hibernating) = false;
          id(display_power_state) = 2; // Set SCREEN_OFF immediately prior to rail cutoff
      - light.turn_off: display_brightness
      - component.update: disp1  # Flush all-black frame to AMOLED panel
      - lambda: |-
          esphome::voice_assistant::clean_disconnect_api_before_hibernate(id(va));
      - delay: 250ms  # Flush QSPI black frame + TCP DisconnectRequest/FIN packet before 3.3V rail cut
      - safe_mode.mark_successful:
      - lambda: |-
          // =========================================================================
          // 🛑 ULTRA-LOW POWER HARDWARE SHUTDOWN & AXP2101 POWER-OFF (TIER 3 HIBERNATE)
          // Reduces quiescent current from ~5.9mA down to <40µA (<0.04mA)
          // =========================================================================

          // 1. Put QMI8658 6-Axis IMU into Power-Down Mode (CTRL7 = 0x00)
          uint8_t qmi_pwr_down[2] = {0x08, 0x00};
          id(bus_internal).write(0x6B, qmi_pwr_down, 2);

          // 2. Put ES8311 Audio DAC into Standby/Power-Down Mode
          uint8_t dac_sleep1[2] = {0x0D, 0xFF};
          uint8_t dac_sleep2[2] = {0x00, 0x80};
          id(bus_internal).write(0x18, dac_sleep1, 2);
          id(bus_internal).write(0x18, dac_sleep2, 2);

          // 3. Put ES7210 Audio ADC into Standby Mode
          uint8_t es7210_pwr[2] = {0x00, 0xFF};
          id(bus_internal).write(0x40, es7210_pwr, 2);

          // 4. Force Speaker Power Amplifier Enable (GPIO46) firmly LOW and hold
          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_46, 0);
          gpio_hold_en(GPIO_NUM_46);

          // 5. Force Display CS (GPIO12) firmly HIGH (deselected) and hold
          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 1);
          gpio_hold_en(GPIO_NUM_12);

          // 6. Put Display Controller (CO5300) into Hardware Reset (GPIO1 LOW) and hold
          gpio_set_direction(GPIO_NUM_1, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_1, 0);
          gpio_hold_en(GPIO_NUM_1);

          // 7. Put Touch Controller (CST9217) into Hardware Reset (GPIO2 LOW) and hold
          gpio_set_direction(GPIO_NUM_2, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_2, 0);
          gpio_hold_en(GPIO_NUM_2);

          // Enable deep sleep pad holds across all held GPIOs
          gpio_deep_sleep_hold_en();

          // 8. Flush all dirty NVS preferences (learned outgoing_connection target IP
          // and UI configuration selects) to flash BEFORE the AXP2101 cuts the 3.3V DCDC1 rail,
          // since hardware rail cutoff bypasses deep_sleep.enter's on_shutdown hooks.
          global_preferences->sync();

          // 9. Command AXP2101 PMIC to POWER OFF all system voltage rails (DCDC & LDOs)
          // Writing bit 0 of Register 0x10 (0x01) initiates immediate PMU hardware shutdown (<40µA).
          // Pressing the Top Crown Button (PEK) or plugging in USB power cold-boots the device cleanly.

          uint8_t axp_pwr_off[2] = {0x10, 0x01};
          id(bus_internal).write(0x34, axp_pwr_off, 2);

          // Fallback delay & deep sleep entry in case PMU shutdown takes a few ms or power remains via USB
          delay(100);
          esp_deep_sleep_start();

  - id: screen_sleep_timer
    mode: restart
    then:
      - delay: !lambda |-
          // When docked to USB power: use docked screensaver inactivity timeout
          if (id(usb_connected).state) {
            auto ss_to = id(screensaver_docked_timeout).current_option();
            if (ss_to == "10s") return 10000;
            if (ss_to == "15s") return 15000;
            if (ss_to == "30s") return 30000;
            if (ss_to == "1 min") return 60000;
            if (ss_to == "5 min") return 300000;
            if (ss_to == "Never") return 86400000; // 24 hours
            return 300000; // default 5m
          }
          // When on battery: use screen_off_timeout
          auto opt = id(display_off_timeout).current_option();
          if (opt == "10s") return 10000;
          if (opt == "15s") return 15000;
          if (opt == "30s") return 30000;
          if (opt == "1 min") return 60000;
          if (opt == "2 min") return 120000;
          if (opt == "Never") return 86400000;
          return 15000; // default 15s
      - if:
          condition:
            lambda: |-
              if (id(usb_connected).state) {
                if (id(screensaver_docked_timeout).current_option() == "Never") return false;
              } else {
                if (id(display_off_timeout).current_option() == "Never") return false;
              }
              // Keep display awake while Flashlight (subpage 5) or Bubble Level (subpage 7) is actively in use
              const bool active_tool_awake =
                  (id(gui_page) == 8 && (id(stuff_subpage) == 5 || id(stuff_subpage) == 7));
              // On battery power, screen sleep strictly honors display_off_timeout (default 15s)
              // regardless of remote playback status, protecting OLED panel and battery.
              // Local playback only inhibits Tier 3 deep sleep hibernation in the 1s watchdog loop.
              return !id(ota_in_progress) &&
                     !id(va).is_running() &&
                     !id(va_tts_received) &&
                     !id(announcement_mixing_input).is_running() &&
                     !id(stopwatch_running) &&
                     !id(timer_ringing) &&
                     !id(alarm_ringing) &&
                     !id(find_my_active) &&
                     !id(pickup_detected).state &&
                     !active_tool_awake &&
                     (id(active_game) == 0);
          then:
            - script.execute: enter_standby_state
          else:
            - if:
                condition:
                  lambda: |-
                    const bool active_tool_awake =
                        (id(gui_page) == 8 && (id(stuff_subpage) == 5 || id(stuff_subpage) == 7));
                    return (id(display_power_state) == 0) &&
                           !id(ota_in_progress) &&
                           !id(va).is_running() &&
                           !id(stopwatch_running) &&
                           !id(timer_ringing) &&
                           !id(alarm_ringing) &&
                           !id(find_my_active) &&
                           !active_tool_awake &&
                           (id(active_game) == 0);
                then:
                  - delay: 2s
                  - script.execute: screen_sleep_timer

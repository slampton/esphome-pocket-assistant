    entity_id: ${target_artist_sensor}
    on_value:
      then:
        - script.execute: throttled_disp_update

  - platform: homeassistant
    id: ha_track_album
    entity_id: ${target_album_sensor}
    on_value:
      then:
        - script.execute: throttled_disp_update

  - platform: homeassistant
    id: ha_target_media_type
    entity_id: ${target_media_type_sensor}
    on_value:
      then:
        - lambda: |-
            if (!x.empty() && x != "unknown" && x != "unavailable") {
              id(active_playback_media_type) = x;
            }
        - script.execute: throttled_disp_update

  - platform: homeassistant
    id: ha_target_art_url
    entity_id: ${target_art_url_sensor}
    on_value:
      then:
        - if:
            condition:
              lambda: 'return (x.empty() || x == "none" || x == "unknown" || x == "unavailable");'
            then:
              - script.stop: fetch_remote_art_debounced
              - lambda: |-
                  id(current_loaded_art_url) = "";
                  id(album_art_loaded) = false;
              - online_image.release: remote_album_art
              - script.execute: throttled_disp_update
            else:
              - if:
                  condition:
                    lambda: 'return (id(active_speaker_entity) != "${local_player_id}");'
                  then:
                    - script.execute: fetch_remote_art_debounced

  - platform: sendspin

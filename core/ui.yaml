                      id(rebuild_active_deck).execute();
                    } else if (item_idx == 3) {
                      id(show_remote_switch).toggle();
                      id(rebuild_active_deck).execute();
                    } else if (item_idx == 4) {
                      id(show_weather_switch).toggle();
                      id(rebuild_active_deck).execute();
                    } else if (item_idx == 5) {
                      id(show_games_switch).toggle();
                      id(rebuild_active_deck).execute();
                    } else if (item_idx == 6) {
                      id(show_stuff_switch).toggle();
                      id(rebuild_active_deck).execute();

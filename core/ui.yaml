  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: |-
              return (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_IDLE) && 
                     !id(va).is_running() && 
                     !id(va_tts_received) && 
                     !id(announcement_mixing_input).is_running();
          then:
            - audio_dac.mute_on: es8311_dac
            - switch.turn_off: speaker_enable
            - script.execute: route_i2s_to_mic

  - id: cancel_voice_assistant
    mode: restart
    then:
      - script.stop: va_tts_drain_and_finish
      - audio_dac.mute_on: es8311_dac
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 50
          duration: 0.1s
      - voice_assistant.stop:
      - lambda: |-
          esphome::voice_assistant::abort_voice_assistant(id(va));
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_vad_active) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
      - component.update: disp1
      - delay: 100ms
      - script.execute: resume_music_after_va
      - if:
          condition:
            binary_sensor.is_off: pickup_detected
          then:
            - script.execute: screen_sleep_timer
  - id: route_i2s_to_mic
    mode: restart
    then:
      - audio_dac.mute_on: es8311_dac
      - lambda: |-
          esp_rom_gpio_connect_out_signal(9, 26, false, false);   // GPIO9 -> I2S0 BCLK (signal 26)
          esp_rom_gpio_connect_out_signal(45, 27, false, false);  // GPIO45 -> I2S0 WS (signal 27)
          esp_rom_gpio_connect_out_signal(16, 23, false, false);  // GPIO16 -> I2S0 MCLK (signal 23)

  - id: route_i2s_to_spk
    mode: restart
    then:
      - lambda: |-
          esp_rom_gpio_connect_out_signal(9, 28, false, false);   // GPIO9 -> I2S1 BCLK (signal 28)
          esp_rom_gpio_connect_out_signal(45, 29, false, false);  // GPIO45 -> I2S1 WS (signal 29)
          esp_rom_gpio_connect_out_signal(16, 21, false, false);  // GPIO16 -> I2S1 MCLK (signal 21)
      - switch.turn_on: speaker_enable

  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: update_pocket_assistant
      - lambda: |-
          id(system_menu_mode) = 5;
          id(disp1).update();

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: update_pocket_assistant


  - id: menu_scroll_transition
    mode: restart
    then:
      - repeat:
          count: 4
          then:
            - lambda: |-
                id(menu_scroll_step)++;
                id(disp1).update();
            - delay: 28ms
      - delay: 30ms
      - lambda: |-
          id(menu_scroll_active) = false;
          if (id(gui_page) == 4 && id(system_menu_mode) == 1) {
            id(sleep_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 2 && id(music_overlay_mode) == 2) {
            id(music_category_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 3 && id(active_game) == 0) {
            id(game_carousel_idx) = id(menu_scroll_target_page);
          }
          id(menu_scroll_step) = 0;

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    reset_pin: GPIO1
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6
      offset_height: 0
    brightness: 200
    update_interval: 1s
    lambda: |-
      const int cx = 233;
      const int cy = 233;
      static constexpr float PI_F = 3.14159265358979323846f;

      // Universal Precomputed 60-Tick & 10-Tick Sine/Cosine LUTs (Shared across Clock, Stopwatch, Dial Gauges)
      static constexpr float DIAL_SIN[60] = {
        0.000000f, 0.104528f, 0.207912f, 0.309017f, 0.406737f, 0.500000f,
        0.587785f, 0.669131f, 0.743145f, 0.809017f, 0.866025f, 0.913545f,
        0.951057f, 0.978148f, 0.994522f, 1.000000f, 0.994522f, 0.978148f,
        0.951057f, 0.913545f, 0.866025f, 0.809017f, 0.743145f, 0.669131f,
        0.587785f, 0.500000f, 0.406737f, 0.309017f, 0.207912f, 0.104528f,
        0.000000f, -0.104528f, -0.207912f, -0.309017f, -0.406737f, -0.500000f,
        -0.587785f, -0.669131f, -0.743145f, -0.809017f, -0.866025f, -0.913545f,
        -0.951057f, -0.978148f, -0.994522f, -1.000000f, -0.994522f, -0.978148f,
        -0.951057f, -0.913545f, -0.866025f, -0.809017f, -0.743145f, -0.669131f,
        -0.587785f, -0.500000f, -0.406737f, -0.309017f, -0.207912f, -0.104528f
      };
      static constexpr float DIAL_COS[60] = {
        1.000000f, 0.994522f, 0.978148f, 0.951057f, 0.913545f, 0.866025f,
        0.809017f, 0.743145f, 0.669131f, 0.587785f, 0.500000f, 0.406737f,
        0.309017f, 0.207912f, 0.104528f, 0.000000f, -0.104528f, -0.207912f,
        -0.309017f, -0.406737f, -0.500000f, -0.587785f, -0.669131f, -0.743145f,
        -0.809017f, -0.866025f, -0.913545f, -0.951057f, -0.978148f, -0.994522f,
        -1.000000f, -0.994522f, -0.978148f, -0.951057f, -0.913545f, -0.866025f,
        -0.809017f, -0.743145f, -0.669131f, -0.587785f, -0.500000f, -0.406737f,
        -0.309017f, -0.207912f, -0.104528f, 0.000000f, 0.104528f, 0.207912f,
        0.309017f, 0.406737f, 0.500000f, 0.587785f, 0.669131f, 0.743145f,
        0.809017f, 0.866025f, 0.913545f, 0.951057f, 0.978148f, 0.994522f
      };
      static constexpr float SUB_SIN[10] = {
        0.000000f, 0.587785f, 0.951057f, 0.951057f, 0.587785f,
        0.000000f, -0.587785f, -0.951057f, -0.951057f, -0.587785f
      };
      static constexpr float SUB_COS[10] = {
        1.000000f, 0.809017f, 0.309017f, -0.309017f, -0.809017f,
        -1.000000f, -0.809017f, -0.309017f, 0.309017f, 0.809017f
      };

      // Precomputed 466-element static circular half-width table for AMOLED glass boundary clipping
      static int16_t CIRCLE_HW[466];
      static bool circle_hw_init = false;
      if (!circle_hw_init) {
        for (int y = 0; y < 466; y++) {
          int yd = abs(y - 233);
          CIRCLE_HW[y] = (yd >= 233) ? 0 : (int16_t)sqrtf((float)(54289 - yd * yd));
        }
        circle_hw_init = true;
      }

      // Reusable Clean Pill / Stadium Button Helper (Artifact-Free Outer/Inner Geometry)
      auto draw_pill_button = [&](int x1, int x2, int y_mid, int r, Color border_c, Color bg_c, const char* label, Color text_c, bool has_bullet) {
        // Outer filled pill in border color
        it.filled_circle(x1, y_mid, r, border_c);
        it.filled_circle(x2, y_mid, r, border_c);
        it.filled_rectangle(x1, y_mid - r, x2 - x1, 2 * r + 1, border_c);

        // Inner filled pill in background color (2px inset)
        it.filled_circle(x1, y_mid, r - 2, bg_c);
        it.filled_circle(x2, y_mid, r - 2, bg_c);
        it.filled_rectangle(x1, y_mid - (r - 2), x2 - x1, 2 * (r - 2) + 1, bg_c);

        // Perfectly centered text on midpoint of pill (x1 + x2) / 2 (zero bullet offset)
        int btn_cx = (x1 + x2) / 2;
        it.print(btn_cx, y_mid, id(font_small), text_c, TextAlign::CENTER, label);
      };

      // Hero Action Button Drawer with Bold Typography (size 26, weight 700)
      auto draw_hero_button = [&](int x1, int x2, int y_mid, int r, Color border_c, Color bg_c, const char* label, Color text_c) {
        it.filled_circle(x1, y_mid, r, border_c);
        it.filled_circle(x2, y_mid, r, border_c);
        it.filled_rectangle(x1, y_mid - r, x2 - x1, 2 * r + 1, border_c);

        it.filled_circle(x1, y_mid, r - 2, bg_c);
        it.filled_circle(x2, y_mid, r - 2, bg_c);
        it.filled_rectangle(x1, y_mid - (r - 2), x2 - x1, 2 * (r - 2) + 1, bg_c);

        int btn_cx = (x1 + x2) / 2;
        it.print(btn_cx, y_mid, id(font_btn_bold), text_c, TextAlign::CENTER, label);
      };

      // Standardized Centered < BACK Button Helper across all submenus (y = 408, r = 16, 106px wide, theme accent)
      auto draw_back_button = [&]() {
        draw_pill_button(180, 286, 408, 16, id(theme_primary), id(col_dark_gray), "< BACK", id(theme_primary), false);
      };

      // Semantic Version Comparison Helper (Rejects ESPHome 2026.x CalVer; strictly tests major.minor.patch)
      auto is_newer_semver = [](const std::string& lat_str, const std::string& cur_str) -> bool {
        if (lat_str.empty() || lat_str == "unavailable" || lat_str == "unknown") return false;
        std::string l = lat_str;
        if (!l.empty() && (l[0] == 'v' || l[0] == 'V')) l = l.substr(1);
        std::string c = cur_str;
        if (!c.empty() && (c[0] == 'v' || c[0] == 'V')) c = c.substr(1);
        if (l.rfind("202", 0) == 0) return false; // Reject ESPHome CalVer (2026.x)
        int l_maj = 0, l_min = 0, l_pat = 0;
        int c_maj = 0, c_min = 0, c_pat = 0;
        if (sscanf(l.c_str(), "%d.%d.%d", &l_maj, &l_min, &l_pat) < 2) return false;
        if (sscanf(c.c_str(), "%d.%d.%d", &c_maj, &c_min, &c_pat) < 2) return false;
        if (l_maj > c_maj) return true;
        if (l_maj < c_maj) return false;
        if (l_min > c_min) return true;
        if (l_min < c_min) return false;
        return l_pat > c_pat;
      };

      // ==========================================
      // GLOBAL OVERLAY: OTA FIRMWARE UPDATE IN PROGRESS (Always renders even if screen was off)
      // ==========================================
      if (id(ota_in_progress)) {
        it.fill(id(col_bg));

        // Outer bezel accent rings (Themed architectural track)
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(theme_primary));
        it.circle(cx, cy, 227, id(theme_primary));
        it.circle(cx, cy, 222, id(col_dark_gray));

        // Circular Bezel Gauge (Radius 214)
        // Recessed track
        it.circle(cx, cy, 216, id(col_dark_gray));
        it.circle(cx, cy, 215, id(col_dark_gray));
        it.circle(cx, cy, 214, id(col_dark_gray));
        it.circle(cx, cy, 213, id(col_dark_gray));

        // Solid progress arc fill up to current percentage (follows active Color Palette)
        int pct = id(ota_progress_pct);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        for (int i = 0; i <= pct; i++) {
          float rad = ((float)i / 100.0f) * 2.0f * 3.14159265f - 1.5707963f; // 12 o'clock top is -pi/2
          float c = cosf(rad);
          float s = sinf(rad);
          it.line(cx + (int)(212 * c), cy + (int)(212 * s), cx + (int)(218 * c), cy + (int)(218 * s), id(theme_secondary));
        }

        it.print(cx, cy - 60, id(font_date), id(theme_primary), TextAlign::CENTER, "FIRMWARE UPDATE");

        char prog_buf[32];
        snprintf(prog_buf, sizeof(prog_buf), "%d%%", pct);
        it.print(cx, cy + 8, id(font_time), id(col_white), TextAlign::CENTER, prog_buf);

        // Dynamic stage messaging
        const char* status_msg = "Preparing flash...";
        if (pct >= 99) {
          status_msg = "Rebooting device...";
        } else if (pct >= 85) {
          status_msg = "Verifying image...";
        } else if (pct >= 10) {
          status_msg = "Writing flash memory...";
        }
        it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, status_msg);
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: DOCKED SCREENSAVER (Mode 1)
      // ==========================================
      if (id(display_power_state) == 1) {
        it.fill(id(col_bg));

        std::string ss_style = std::string(id(screensaver_style_select).current_option().c_str());
        if (ss_style.empty()) ss_style = "Aurora Borealis";

        uint32_t now_ms = millis();
        auto now = id(ha_time).now();

        // --------------------------------------------------
        // STYLE 1: AMBIENT MINIMALIST CLOCK (Anti-Burn-In Drift)
        // --------------------------------------------------
        if (ss_style == "Ambient Clock") {
          int sec = now.is_valid() ? now.second : 0;
          int drift_x = (sec % 10) * 4 - 20;
          int drift_y = ((sec / 10) % 6) * 4 - 10;

          char amb_time[16];
          if (now.is_valid()) {
            if (id(is_24h_format)) {
              snprintf(amb_time, sizeof(amb_time), "%02d:%02d", now.hour, now.minute);
            } else {
              int h12 = now.hour % 12;
              if (h12 == 0) h12 = 12;
              snprintf(amb_time, sizeof(amb_time), "%d:%02d", h12, now.minute);
            }
            it.print(cx + drift_x, cy - 20 + drift_y, id(font_time), id(col_slate), TextAlign::CENTER, amb_time);
            it.strftime(cx + drift_x, cy + 45 + drift_y, id(font_small), id(col_dark_gray), TextAlign::CENTER, "%a, %b %d", now);
          } else {
            it.print(cx + drift_x, cy - 20 + drift_y, id(font_time), id(col_slate), TextAlign::CENTER, "--:--");
          }
          return;

        // --------------------------------------------------
        // STYLE 2: AURORA BOREALIS (Full-Bleed Organic Cosmic Ribbons)
        // --------------------------------------------------
        } else if (ss_style == "Aurora Borealis") {
          float t = now_ms * 0.0010f;

          // Full circular screen coverage (R = 228, edge-to-edge, zero static content)
          for (int x = 8; x <= 458; x += 2) {
            int dx = x - cx;
            int dx2 = dx * dx;
            if (dx2 >= 51984) continue; // 228^2
            int h_half = (int)sqrtf(51984.0f - (float)dx2);
            int y_min = cy - h_half;
            int y_max = cy + h_half;

            // Wave 1: Cosmic Violet / High-Altitude Mauve Ribbon
            int y1 = cy - 35 + (int)(sinf(x * 0.011f + t * 0.6f) * 55.0f + cosf(x * 0.006f - t * 0.35f) * 25.0f);
            int len1 = 55 + (int)(sinf(x * 0.024f + t * 1.2f) * 25.0f);
            for (int py = y1; py >= y1 - len1; py -= 2) {
              if (py >= y_min && py <= y_max) {
                float k = (float)(y1 - py) / (float)len1;
                it.draw_pixel_at(x, py, Color((uint8_t)(180.0f - 80.0f * k), (uint8_t)(30.0f - 15.0f * k), (uint8_t)(190.0f - 60.0f * k)));
              }
            }

            // Wave 2: Electric Cyan / Turquoise Ionosphere Ribbon
            int y2 = cy + 15 + (int)(sinf(x * 0.014f - t * 0.8f + 1.6f) * 60.0f + sinf(x * 0.008f + t * 0.5f) * 30.0f);
            int len2 = 65 + (int)(cosf(x * 0.028f - t * 1.5f) * 30.0f);
            for (int py = y2; py >= y2 - len2; py -= 2) {
              if (py >= y_min && py <= y_max) {
                float k = (float)(y2 - py) / (float)len2;
                it.draw_pixel_at(x, py, Color((uint8_t)(15.0f * (1.0f - k)), (uint8_t)(230.0f - 110.0f * k), (uint8_t)(240.0f - 70.0f * k)));
              }
            }

            // Wave 3: Emerald Jade Primary Aurora Curtain (Seamless gradient, NO white line)
            int y3 = cy + 65 + (int)(sinf(x * 0.017f + t * 1.0f + 3.1f) * 65.0f + cosf(x * 0.010f - t * 0.7f) * 35.0f);
            int len3 = 80 + (int)(sinf(x * 0.032f + t * 1.8f) * 35.0f);
            for (int py = y3; py >= y3 - len3; py -= 2) {
              if (py >= y_min && py <= y_max) {
                float k = (float)(y3 - py) / (float)len3;
                it.draw_pixel_at(x, py, Color((uint8_t)(25.0f * (1.0f - k)), (uint8_t)(235.0f - 120.0f * k), (uint8_t)(85.0f - 40.0f * k)));
              }
            }
          }
          return;

        // --------------------------------------------------
        // STYLE 3: 3D WARP-SPEED STARFIELD (Authentic Hyperspace Simulation)
        // --------------------------------------------------
        } else if (ss_style == "Starfield") {
          struct Star3D {
            float x, y, z;
          };
          static Star3D stars[90];
          static bool stars_init = false;
          static uint32_t star_seed = 123456789;

          auto star_rand = [&]() -> float {
            star_seed = star_seed * 1664525u + 1013904223u;
            return (float)(star_seed & 0xFFFF) / 65535.0f;
          };

          auto respawn_star = [&](int i, bool init_z) {
            float ang = star_rand() * 2.0f * PI_F;
            float dist = 40.0f + star_rand() * 650.0f;
            stars[i].x = cosf(ang) * dist;
            stars[i].y = sinf(ang) * dist;
            stars[i].z = init_z ? (30.0f + star_rand() * 950.0f) : (850.0f + star_rand() * 150.0f);
          };

          if (!stars_init) {
            for (int i = 0; i < 90; i++) {
              respawn_star(i, true);
            }
            stars_init = true;
          }

          float speed = 25.0f;
          for (int i = 0; i < 90; i++) {
            stars[i].z -= speed;

            float k = 230.0f / stars[i].z;
            int sx = cx + (int)(stars[i].x * k);
            int sy = cy + (int)(stars[i].y * k);

            int dx = sx - cx; int dy = sy - cy;
            if (stars[i].z <= 25.0f || (dx * dx + dy * dy) >= 51529) { // 227^2
              respawn_star(i, false);
              continue;
            }

            float prev_k = 230.0f / (stars[i].z + speed * 1.5f);
            int px = cx + (int)(stars[i].x * prev_k);
            int py = cy + (int)(stars[i].y * prev_k);

            if (stars[i].z > 650.0f) {
              it.draw_pixel_at(sx, sy, Color(80, 100, 130));
            } else if (stars[i].z > 350.0f) {
              it.line(px, py, sx, sy, Color(100, 180, 230));
              it.draw_pixel_at(sx, sy, Color(180, 220, 255));
            } else {
              it.line(px, py, sx, sy, Color(40, 180, 255));
              it.filled_circle(sx, sy, 2, Color(255, 255, 255));
            }
          }
          return;

        // --------------------------------------------------
        // STYLE 4: MATRIX CYBER RAIN (Full-Bleed Pre-Scattered Engine: 19 Columns, x: 17..449)
        // --------------------------------------------------
        } else if (ss_style == "Matrix Rain") {
          // Full-bleed edge-to-edge cyber rain: 31 streams across 19 columns (x: 17..449, zero flank void)
          static const int16_t MATRIX_X[31] = {
             17,  41,  65,  89,  89, 113, 113, 137, 137, 161,
            161, 185, 185, 209, 209, 233, 233, 257, 257, 281,
            281, 305, 305, 329, 329, 353, 353, 377, 401, 425,
            449
          };
          static const int16_t MATRIX_Y[31] = {
            340, 610, 150, 420,  20, 260, 680,  90, 510, 370,
            790, 180, 590,  40, 460, 290, 710, 120, 540, 390,
            810, 210, 630,  70, 480, 320, 740, 160, 580, 240,
            470
          };
          static const uint8_t MATRIX_SPD[31] = {
            132, 129, 124, 137, 108, 109, 126, 108, 123, 111,
            105, 123, 118, 125, 110, 120, 108, 122, 114, 102,
            134, 116, 112, 119, 122, 120, 137,  95, 108, 101,
             96
          };
          static const uint8_t MATRIX_LEN[31] = {
              9,  10,   8,  12,  12,  10,  13,  10,   8,   9,
              8,  12,   9,  10,  13,  11,   8,  11,   9,  13,
             13,  13,  11,   9,   8,  13,  11,  11,  12,  10,
             10
          };

          for (int i = 0; i < 31; i++) {
            int lead_y = (MATRIX_Y[i] + (int)((uint64_t)now_ms * (uint32_t)MATRIX_SPD[i] / 1000ULL)) % 820 - 120;
            int sx = MATRIX_X[i];
            int slen = MATRIX_LEN[i];

            for (int j = 0; j < slen; j++) {
              int gy = lead_y - j * 16;
              int dx = sx - cx; int dy = gy - cy;
              if (dx * dx + dy * dy < 51529 && gy > 10 && gy < 456) {
                if (j == 0) {
                  // Bold white lead droplet with neon green aura
                  it.filled_rectangle(sx - 3, gy - 5, 7, 11, Color(140, 255, 140));
                  it.filled_rectangle(sx - 2, gy - 4, 5, 9, Color(255, 255, 255));
                } else if (j <= 2) {
                  // Electric lime green upper trail
                  it.filled_rectangle(sx - 3, gy - 5, 6, 10, Color(40, 255, 80));
                  it.filled_rectangle(sx - 2, gy - 4, 4, 8, Color(160, 255, 180));
                } else if (j <= 5) {
                  // Emerald matrix green
                  it.filled_rectangle(sx - 2, gy - 4, 5, 8, Color(20, 200, 50));
                } else if (j <= 8) {
                  // Phosphor mid-green
                  it.filled_rectangle(sx - 2, gy - 3, 4, 6, Color(10, 130, 30));
                } else {
                  // Fading phosphor trail
                  it.filled_rectangle(sx - 1, gy - 2, 3, 4, Color(5, 65, 15));
                }
              }
            }
          }
          return;

        // --------------------------------------------------
        // STYLE 5: SOLAR FLARE (Pulsing Living Sun & Radiating Coronal Waves)
        // --------------------------------------------------
        } else if (ss_style == "Solar Flare") {
          float t = now_ms * 0.0015f;

          // Anti-burn-in orbital drift: solar anchor wanders smoothly by +/- 6px over a 30s cycle
          int scx = cx + (int)(sinf(t * 0.20f) * 6.0f);
          int scy = cy + (int)(cosf(t * 0.16f) * 6.0f);

          // Living solar core pulsation (r0 breathes between 56 and 68)
          float r0 = 62.0f + 6.0f * sinf(t * 1.5f);

          // 1. Radiating Coronal Mass Ejection Pulses (3 staggered expansion waves rippling outward to bezel)
          for (int w = 0; w < 3; w++) {
            float phase = fmodf((float)now_ms + (float)w * 950.0f, 2850.0f) / 2850.0f;
            int cme_r = (int)((r0 + 10.0f) + phase * (220.0f - (r0 + 10.0f)));
            float fade = 1.0f - phase;
            uint8_t c_red = (uint8_t)(220.0f * fade);
            uint8_t c_grn = (uint8_t)(90.0f * fade * fade);
            if (cme_r > (int)r0 + 10) {
              it.circle(scx, scy, cme_r, Color(c_red < 20 ? 20 : c_red, c_grn < 5 ? 5 : c_grn, 5));
              it.circle(scx, scy, cme_r - 2, Color((uint8_t)(c_red * 0.7f), (uint8_t)(c_grn * 0.7f), 2));
            }
          }

          // 2. Coronal Streamers (36 radial plasma rays modulated by harmonic waves)
          for (int i = 0; i < 36; i++) {
            float theta = i * (2.0f * PI_F / 36.0f);
            float sa = sinf(theta);
            float ca = cosf(theta);

            float L = 35.0f + 25.0f * sinf(theta * 4.0f + t * 2.4f) + 18.0f * cosf(theta * 7.0f - t * 1.8f) + 12.0f * sinf(theta * 11.0f + t * 3.2f);
            int in_x = scx + (int)((r0 + 4.0f) * ca);
            int in_y = scy + (int)((r0 + 4.0f) * sa);
            int mid_x = scx + (int)((r0 + 4.0f + L * 0.6f) * ca);
            int mid_y = scy + (int)((r0 + 4.0f + L * 0.6f) * sa);
            int out_x = scx + (int)((r0 + 4.0f + L) * ca);
            int out_y = scy + (int)((r0 + 4.0f + L) * sa);

            it.line(in_x, in_y, mid_x, mid_y, Color(225, 75, 10));
            it.line(mid_x, mid_y, out_x, out_y, Color(255, 185, 25));

            // Golden flare sparks at tip (NO WHITE)
            if (L > 65.0f) {
              it.draw_pixel_at(out_x, out_y, Color(255, 220, 45));
              it.draw_pixel_at(out_x + 1, out_y, Color(255, 180, 20));
            }
          }

          // 3. Magnetic Prominence Loops (Curved plasma arcs leaping out and returning)
          auto draw_prominence_loop = [&](float center_ang, float peak_r, float arc_span) {
            float prev_lx = 0, prev_ly = 0;
            for (int step = 0; step <= 8; step++) {
              float prog = (float)step / 8.0f;
              float cur_ang = center_ang - arc_span * 0.5f + arc_span * prog;
              float h_factor = 4.0f * prog * (1.0f - prog);
              float cur_r = (r0 + 6.0f) + (peak_r - (r0 + 6.0f)) * h_factor;
              float lx = scx + cur_r * cosf(cur_ang);
              float ly = scy + cur_r * sinf(cur_ang);
              if (step > 0) {
                it.line((int)prev_lx, (int)prev_ly, (int)lx, (int)ly, Color(255, 175, 25));
                it.line((int)prev_lx, (int)prev_ly + 1, (int)lx, (int)ly + 1, Color(220, 60, 5));
              }
              prev_lx = lx; prev_ly = ly;
            }
          };

          draw_prominence_loop(t * 0.5f, 155.0f + 20.0f * sinf(t * 1.4f), 0.55f);
          draw_prominence_loop(t * 0.5f + 2.2f, 175.0f + 25.0f * cosf(t * 1.1f), 0.70f);
          draw_prominence_loop(t * 0.5f + 4.3f, 145.0f + 18.0f * sinf(t * 1.9f), 0.50f);

          // 4. Redesigned Solar Body & Radiating Core (NO STATIC WHITE!)
          // Concentric breathing gradients strictly in yellow, orange, and crimson red
          it.filled_circle(scx, scy, (int)(r0 + 14.0f), Color(160, 25, 10));  // Chromosphere glow (Crimson)
          it.filled_circle(scx, scy, (int)(r0 + 4.0f),  Color(235, 80, 10));  // Fiery orange mantle
          it.filled_circle(scx, scy, (int)(r0 - 6.0f),  Color(255, 155, 20)); // Radiant golden-orange photosphere

          // Radiating Core Expansion Pulses (concentric waves rippling outward through the core)
          for (int cp = 0; cp < 2; cp++) {
            float cp_phase = fmodf(t * 0.9f + (float)cp * 0.5f, 1.0f);
            int cp_r = (int)(4.0f + cp_phase * (r0 - 12.0f));
            uint8_t cr = (uint8_t)(255.0f - 30.0f * cp_phase);
            uint8_t cg = (uint8_t)(210.0f * (1.0f - 0.55f * cp_phase));
            uint8_t cb = (uint8_t)(35.0f * (1.0f - cp_phase));
            it.filled_circle(scx, scy, cp_r, Color(cr, cg, cb));
          }

          // 5. Convection Granulation Vortices (Swirling solar granules in warm gold/orange)
          for (int k = 0; k < 4; k++) {
            float c_ang = t * 0.8f + k * (PI_F / 2.0f);
            float c_rad = 18.0f + 8.0f * sinf(t * 1.8f + (float)k);
            int vx = scx + (int)(cosf(c_ang) * c_rad);
            int vy = scy + (int)(sinf(c_ang) * c_rad);
            uint8_t gran_g = (uint8_t)(160.0f + 50.0f * sinf(t * 2.0f + (float)k));
            it.filled_circle(vx, vy, 8, Color(255, gran_g, 20));
          }

          // Absolute Center: Dynamic Pulsing Fusion Eye (Continuously shifts between gold, orange, and red)
          int eye_r = (int)(7.0f + 3.0f * sinf(t * 2.6f));
          uint8_t eye_g = (uint8_t)(120.0f + 70.0f * sinf(t * 2.2f));
          it.filled_circle(scx, scy, eye_r, Color(255, eye_g, 15));
          return;
        }
      }

      if (!id(display_brightness).current_values.is_on() || id(display_power_state) == 2) {
        it.fill(id(col_bg));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: HIBERNATION SHUTDOWN
      // ==========================================
      if (id(is_hibernating)) {
        it.fill(id(col_bg));
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(theme_primary));
        it.circle(cx, cy, 227, id(theme_primary));
        it.circle(cx, cy, 222, id(col_dark_gray));

        it.print(cx, cy - 65, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");

        char c_buf[16];
        if (id(hibernate_countdown_val) > 0) {
          snprintf(c_buf, sizeof(c_buf), "%d", id(hibernate_countdown_val));
          it.print(cx, cy + 5, id(font_chrono_time), id(theme_secondary), TextAlign::CENTER, c_buf);
          it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, "Tap screen to stay awake");
        } else {
          it.print(cx, cy + 20, id(font_small), id(col_slate), TextAlign::CENTER, "Shutting down...");
        }
        return;
      }

      auto now = id(ha_time).now();
      float batt = id(batt_level).state;

      // ==========================================
      // GLOBAL OVERLAY: VOICE ASSISTANT TAKEOVER
      // ==========================================
      if (id(va_active) || !id(va_status_text).empty()) {
        uint32_t now_ms = millis();
        bool is_speaking = id(va_tts_received);
        bool is_thinking = (!is_speaking && id(va_status_text) == "Thinking...");
        bool is_solaris = (std::string(id(va_visual_profile).current_option().c_str()) == "Solaris");

        // Profile-aware spectral gradient loop
        auto get_nuanced_radiation_color = [is_solaris](float t) -> Color {
          t = t - floorf(t);
          if (is_solaris) {
            // Solaris Spectral Loop: Emerald Green -> Sunburst Yellow -> Solar Orange -> Emerald Green
            if (t < 0.333f) {
              float k = t / 0.333f;
              return Color((uint8_t)(35.0f * (1.0f - k) + 255.0f * k),
                           (uint8_t)(210.0f * (1.0f - k) + 220.0f * k),
                           (uint8_t)(110.0f * (1.0f - k) + 30.0f * k));
            } else if (t < 0.667f) {
              float k = (t - 0.333f) / 0.334f;
              return Color((uint8_t)(255.0f * (1.0f - k) + 250.0f * k),
                           (uint8_t)(220.0f * (1.0f - k) + 100.0f * k),
                           (uint8_t)(30.0f * (1.0f - k) + 15.0f * k));
            } else {
              float k = (t - 0.667f) / 0.333f;
              return Color((uint8_t)(250.0f * (1.0f - k) + 35.0f * k),
                           (uint8_t)(100.0f * (1.0f - k) + 210.0f * k),
                           (uint8_t)(15.0f * (1.0f - k) + 110.0f * k));
            }
          } else {
            // Default Spectral Loop: Soft Cyan -> Royal Purple -> Pink/Magenta -> Soft Cyan
            if (t < 0.333f) {
              float k = t / 0.333f;
              return Color((uint8_t)(138.0f * k), (uint8_t)(229.0f * (1.0f - k) + 43.0f * k), (uint8_t)(255.0f * (1.0f - k) + 226.0f * k));
            } else if (t < 0.667f) {
              float k = (t - 0.333f) / 0.334f;
              return Color((uint8_t)(138.0f + 86.0f * k), (uint8_t)(43.0f + 21.0f * k), (uint8_t)(226.0f + 25.0f * k));
            } else {
              float k = (t - 0.667f) / 0.333f;
              return Color((uint8_t)(224.0f * (1.0f - k)), (uint8_t)(64.0f * (1.0f - k) + 229.0f * k), 255);
            }
          }
        };

        if (is_speaking) {
          // ====================================================
          // STATE 3: SPEAKING (TTS) — RADIATING EXPANDING HARMONIC BANDS
          // ====================================================
          for (int w = 0; w < 5; w++) {
            uint32_t wave_t = (now_ms + w * 400) % 2000;
            float progress = (float)wave_t / 2000.0f;
            int r_center = 36 + (int)(progress * 180.0f);

            float width_factor = sinf(progress * PI_F);
            int base_w = (w % 2 == 0) ? 7 : 4;
            int band_w = base_w + (int)(5.0f * width_factor);
            if (band_w < 3) band_w = 3;
            int half_w = band_w / 2;

            float wave_color_phase = (float)w * 0.20f + progress * 0.30f + (float)(now_ms % 4000) / 4000.0f;
            float fade = 1.0f - (progress * 0.45f);

            for (int d = -half_w; d <= half_w; d++) {
              int r_curr = r_center + d;
              if (r_curr < 34 || r_curr > 226) continue;

              float edge_dist = fabsf((float)d) / (float)(half_w + 1);
              float band_phase = wave_color_phase + (float)d * 0.02f;
              Color base_col = get_nuanced_radiation_color(band_phase);

              Color stroke_col;
              if (edge_dist < 0.35f) {
                stroke_col = Color(
                  (uint8_t)((base_col.red * 0.70f + 255.0f * 0.30f) * fade),
                  (uint8_t)((base_col.green * 0.70f + 255.0f * 0.30f) * fade),
                  (uint8_t)((base_col.blue * 0.70f + 255.0f * 0.30f) * fade)
                );
              } else {
                stroke_col = Color(
                  (uint8_t)(base_col.red * fade),
                  (uint8_t)(base_col.green * fade),
                  (uint8_t)(base_col.blue * fade)
                );
              }
              it.circle(cx, cy, r_curr, stroke_col);
            }
          }

          // Pulsing Acoustic Core (800ms rhythmic beat, matte layered depth with subtle shadow)
          float core_pulse = sinf((float)(now_ms % 800) * (2.0f * PI_F / 800.0f));
          int core_r = 22 + (int)(4.0f * core_pulse);

          Color aura_col = is_solaris ? Color(255, 220, 30) : get_nuanced_radiation_color((float)(now_ms % 3000) / 3000.0f);
          Color body_col = is_solaris ? Color(250, 100, 15) : get_nuanced_radiation_color((float)(now_ms % 3000) / 3000.0f + 0.33f);

          it.filled_circle(cx, cy + 3, core_r + 4, id(col_dark_gray)); // drop shadow
          it.circle(cx, cy, core_r + 4, aura_col);
          it.circle(cx, cy, core_r + 3, aura_col);
          it.circle(cx, cy, core_r + 2, aura_col);
          it.filled_circle(cx, cy, core_r, body_col);

          if (core_r > 6) {
            Color inner_tone = is_solaris ? Color(255, 220, 30) : Color(
              (uint8_t)(body_col.red * 0.82f + 35),
              (uint8_t)(body_col.green * 0.82f + 35),
              (uint8_t)(body_col.blue * 0.82f + 35)
            );
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

        } else if (is_thinking) {
          // ====================================================
          // STATE 2: THINKING — EXPANDED QUANTUM / SOLAR CONSTELLATION
          // ====================================================
          it.circle(cx, cy, 68, id(col_dark_gray));
          it.circle(cx, cy, 114, id(col_dark_gray));

          float spin_cw = (float)(now_ms % 1100) * (2.0f * PI_F / 1100.0f);
          float spin_ccw = -(float)(now_ms % 1100) * (2.0f * PI_F / 1100.0f);

          Color inner_star_col = is_solaris ? Color(255, 220, 30) : id(col_cyan);
          Color outer_star_col = is_solaris ? Color(35, 210, 110) : id(col_purple);
          Color outer_star_body = is_solaris ? Color(35, 210, 110) : id(col_magenta);
          Color outer_star_aura = is_solaris ? Color(255, 220, 30) : id(col_purple);
          Color text_col = is_solaris ? Color(255, 220, 30) : id(col_cyan);

          // Inner CW orbit stars (4-point sparkle tips at r=68)
          for (int i = 0; i < 4; i++) {
            float ang = spin_cw + i * (PI_F / 2.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)(68.0f * c_node);
            int ny = cy + (int)(68.0f * s_node);
            it.horizontal_line(nx - 4, ny, 9, inner_star_col);
            it.vertical_line(nx, ny - 4, 9, inner_star_col);
            it.filled_circle(nx, ny, 3, inner_star_col);
            it.filled_circle(nx, ny, 1, id(col_white));
          }

          // Outer CCW orbit stars (4-point sparkle tips at r=114)
          for (int i = 0; i < 4; i++) {
            float ang = spin_ccw + i * (PI_F / 2.0f) + (PI_F / 4.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)(114.0f * c_node);
            int ny = cy + (int)(114.0f * s_node);
            it.horizontal_line(nx - 5, ny, 11, outer_star_col);
            it.vertical_line(nx, ny - 5, 11, outer_star_col);
            it.filled_circle(nx, ny, 4, outer_star_body);
            it.filled_circle(nx, ny, 2, outer_star_aura);
            it.filled_circle(nx, ny, 1, id(col_white));
          }

          // Cognitive Pulse Core
          float pulse = sinf((float)(now_ms % 600) * (2.0f * PI_F / 600.0f));
          int core_r = 24 + (int)(5.0f * pulse);

          Color core_ring_col = is_solaris ? Color(255, 220, 30) : id(col_purple);
          Color core_fill_col = is_solaris ? Color(250, 100, 15) : id(col_cyan);

          it.filled_circle(cx, cy + 3, core_r + 4, id(col_dark_gray)); // drop shadow
          it.circle(cx, cy, core_r + 5, core_ring_col);
          it.circle(cx, cy, core_r + 4, core_ring_col);
          it.circle(cx, cy, core_r + 3, core_ring_col);
          it.filled_circle(cx, cy, core_r, core_fill_col);

          if (core_r > 6) {
            Color inner_tone = is_solaris ? Color(255, 220, 30) : Color(30, 200, 230);
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

          it.print(cx, 401, id(font_small), text_col, TextAlign::CENTER, "Thinking...");

        } else {
          // ====================================================
          // STATE 1: LISTENING — ROBUST ATTENTIVE LIVING CORE
          // ====================================================
          float vad_boost = id(va_vad_active) ? 6.0f : 0.0f;
          float pulse = sinf((float)(now_ms % 1600) * (2.0f * PI_F / 1600.0f));

          Color outer_halo_col = is_solaris ? Color(35, 210, 110) : id(col_purple);
          Color mid_ring_col = is_solaris ? Color(255, 220, 30) : id(col_light_blue);
          Color mid_ring_inner = is_solaris ? Color(255, 220, 30) : id(col_cyan);
          Color sat_col = is_solaris ? Color(255, 220, 30) : id(col_cyan);
          Color sat_aura = is_solaris ? Color(255, 220, 30) : id(col_light_blue);
          Color core_aura_col = is_solaris ? Color(255, 220, 30) : id(col_purple);
          Color core_ring_col = is_solaris ? Color(255, 220, 30) : id(col_light_blue);
          Color core_fill_col = is_solaris ? Color(250, 100, 15) : id(col_cyan);
          Color text_col = is_solaris ? Color(255, 220, 30) : id(col_cyan);

          // 1. Broad Outer Attentive Halo (r=118..126)
          int outer_halo_r = 118 + (int)(8.0f * pulse + vad_boost);
          it.circle(cx, cy, outer_halo_r + 1, id(col_dark_gray));
          it.circle(cx, cy, outer_halo_r, outer_halo_col);
          it.circle(cx, cy, outer_halo_r - 1, outer_halo_col);

          // 2. Harmonic Acoustic Wave Ring (r=74..82)
          int mid_ring_r = 74 + (int)(5.0f * pulse + vad_boost * 0.5f);
          it.circle(cx, cy, mid_ring_r + 1, id(col_dark_gray));
          it.circle(cx, cy, mid_ring_r, mid_ring_col);
          it.circle(cx, cy, mid_ring_r - 1, mid_ring_inner);

          // 3. 4 Orbital Satellites revolving at 3.2s pace at r=mid_ring_r
          float orbit_ang = (float)(now_ms % 3200) * (2.0f * PI_F / 3200.0f);
          for (int i = 0; i < 4; i++) {
            float ang = orbit_ang + i * (PI_F / 2.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)((float)mid_ring_r * c_node);
            int ny = cy + (int)((float)mid_ring_r * s_node);
            it.horizontal_line(nx - 3, ny, 7, sat_aura);
            it.vertical_line(nx, ny - 3, 7, sat_aura);
            it.filled_circle(nx, ny, 4, sat_col);
            it.filled_circle(nx, ny, 2, id(col_white));
          }

          // 4. Robust Living Core (core_r = 26..37 with VAD boost)
          int core_r = 26 + (int)(5.0f * pulse + vad_boost);
          int aura_r = 44 + (int)(8.0f * pulse + vad_boost * 1.2f);

          it.circle(cx, cy, aura_r + 2, id(col_dark_gray));
          it.circle(cx, cy, aura_r + 1, core_aura_col);
          it.circle(cx, cy, aura_r, core_aura_col);
          it.circle(cx, cy, aura_r - 1, core_aura_col);

          it.filled_circle(cx, cy + 3, core_r + 4, id(col_dark_gray)); // drop shadow
          it.circle(cx, cy, core_r + 4, core_ring_col);
          it.circle(cx, cy, core_r + 3, core_ring_col);
          it.circle(cx, cy, core_r + 2, core_ring_col);
          it.filled_circle(cx, cy, core_r, core_fill_col);

          if (core_r > 6) {
            Color inner_tone = is_solaris ? Color(255, 220, 30) : Color(30, 200, 230);
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

          const char *status_str = id(va_status_text).empty() ? "Listening..." : id(va_status_text).c_str();
          it.print(cx, 401, id(font_small), text_col, TextAlign::CENTER, status_str);
        }
        return;
      }



      // ==========================================
      // PAGE 0: WATCH FACE (HIGH-CONTRAST MODERN DIAL)
      // ==========================================
      if (id(gui_page) == 0) {
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(col_slate));
        it.circle(cx, cy, 222, id(col_dark_gray));

        if (!now.is_valid()) {
          it.print(cx, cy - 10, id(font_date), id(col_slate), TextAlign::CENTER, "Connecting...");
        } else {
          int hour = now.hour;
          int min = now.minute;
          int sec = now.second;

          if (id(clock_face_digital)) {
            // Perimeter bezel ticks
            for (int i = 0; i < 60; i++) {
              float s = DIAL_SIN[i];
              float c = DIAL_COS[i];
              if (i % 5 == 0) {
                it.line(cx + (int)(212 * s), cy - (int)(212 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_slate));
              } else {
                it.line(cx + (int)(216 * s), cy - (int)(216 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_gray));
              }
            }
            // Highlight active second tick in theme primary (enlarged +25% in length & width for crisp visibility)
            int sec_idx = sec % 60;
            float s_sec = DIAL_SIN[sec_idx];
            float c_sec = DIAL_COS[sec_idx];
            float perp_x = -c_sec;
            float perp_y = -s_sec;
            for (int w = -1; w <= 1; w++) {
              int x1 = cx + (int)(205.0f * s_sec + w * perp_x);
              int y1 = cy - (int)(205.0f * c_sec - w * perp_y);
              int x2 = cx + (int)(220.0f * s_sec + w * perp_x);
              int y2 = cy - (int)(220.0f * c_sec - w * perp_y);
              it.line(x1, y1, x2, y2, id(theme_primary));
            }

            // Date Header: "MON, SEP 28" (Theme Primary)
            it.strftime(cx, 130, id(font_date), id(theme_primary), TextAlign::CENTER, "%a, %b %d", now);

            // Giant Bold Digital Time: "10:45" (12h) or "14:45" (24h)
            char dig_buf[16];
            if (id(is_24h_format)) {
              snprintf(dig_buf, sizeof(dig_buf), "%02d:%02d", now.hour, now.minute);
            } else {
              int h12 = now.hour % 12;
              if (h12 == 0) h12 = 12;
              snprintf(dig_buf, sizeof(dig_buf), "%d:%02d", h12, now.minute);
            }
            it.print(cx, 205, id(font_time), id(col_white), TextAlign::CENTER, dig_buf);

            // AM/PM & Seconds Pill: (Theme Secondary)
            char sec_buf[16];
            if (id(is_24h_format)) {
              snprintf(sec_buf, sizeof(sec_buf), "SEC  •  %02ds", sec);
            } else {
              snprintf(sec_buf, sizeof(sec_buf), "%s  •  %02ds", now.hour >= 12 ? "PM" : "AM", sec);
            }
            it.print(cx, 262, id(font_small), id(theme_secondary), TextAlign::CENTER, sec_buf);

            // Battery telemetry in cyan with charging bolt / battery gauge (standardized to y = 380, static across faces)
            if (!isnan(batt)) {
              char batt_str[16];
              snprintf(batt_str, sizeof(batt_str), "%.0f%%", batt);
              int text_x = cx + 8;
              it.print(text_x, 380, id(font_small), id(theme_primary), TextAlign::CENTER, batt_str);
              int bx = text_x - (batt >= 100.0f ? 36 : 28);
              int by = 380;
              if (id(batt_charging).state) {
                it.filled_triangle(bx + 3, by - 9, bx - 3, by, bx + 1, by, id(col_gold));
                it.filled_triangle(bx - 1, by, bx + 2, by, bx - 2, by + 9, id(col_gold));
              } else {
                it.filled_rectangle(bx - 2, by - 9, 4, 2, id(col_green));
                it.rectangle(bx - 5, by - 7, 10, 16, id(col_green));
                int fill_h = (int)std::max(1.0f, std::min(12.0f, (batt / 100.0f) * 12.0f));
                it.filled_rectangle(bx - 3, (by + 7) - fill_h, 6, fill_h, id(col_green));
              }
            }
          } else {
            // Modernized Dial Markers: Refined perimeter bezel ticks with 6 o'clock pip sanctuary
        for (int i = 0; i < 60; i++) {
          if (i == 30) continue; // 6 o'clock pip sanctuary: omitted to frame carousel pips cleanly
          float s = DIAL_SIN[i];
          float c = DIAL_COS[i];

          if (i % 5 == 0) {
            it.line(cx + (int)(212 * s), cy - (int)(212 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_slate));
          } else {
            it.line(cx + (int)(216 * s), cy - (int)(216 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_gray));
          }
        }

        // Formatted date (Theme Primary) and digital time complication (uniform slate gray)
        it.strftime(cx, 104, id(font_date), id(theme_primary), TextAlign::CENTER, "%a, %b %d", now);
        char time_buf[16];
        if (id(is_24h_format)) {
          snprintf(time_buf, sizeof(time_buf), "%02d:%02d", now.hour, now.minute);
        } else {
          int h12 = now.hour % 12;
          if (h12 == 0) h12 = 12;
          snprintf(time_buf, sizeof(time_buf), "%d:%02d %s", h12, now.minute, now.hour >= 12 ? "pm" : "am");
        }
        it.print(cx, 305, id(font_date), id(col_slate), TextAlign::CENTER, time_buf);

        // Battery percentage in cyan in all states; golden charging bolt appears on left when plugged in
        if (!isnan(batt)) {
          char batt_str[16];
          snprintf(batt_str, sizeof(batt_str), "%.0f%%", batt);
          int text_x = cx + 8;
          it.print(text_x, 380, id(font_small), id(theme_primary), TextAlign::CENTER, batt_str);
          int bx = text_x - (batt >= 100.0f ? 36 : 28);
          int by = 380;
          if (id(batt_charging).state) {
            // Golden Charging Lightning Bolt (18px total height)
            it.filled_triangle(bx + 3, by - 9, bx - 3, by, bx + 1, by, id(col_gold));
            it.filled_triangle(bx - 1, by, bx + 2, by, bx - 2, by + 9, id(col_gold));
          } else {
            // Crisp Green Vertical Battery Icon (18px total height)
            it.filled_rectangle(bx - 2, by - 9, 4, 2, id(col_green)); // Terminal pip
            it.rectangle(bx - 5, by - 7, 10, 16, id(col_green)); // Outer body
            int fill_h = (int)std::max(1.0f, std::min(12.0f, (batt / 100.0f) * 12.0f));
            it.filled_rectangle(bx - 3, (by + 7) - fill_h, 6, fill_h, id(col_green)); // Bottom-up fill
          }
        }

        float h_angle = ((hour % 12) + min / 60.0f + sec / 3600.0f) * (2.0f * PI_F / 12.0f);
        float m_angle = (min + sec / 60.0f) * (2.0f * PI_F / 60.0f);
        float s_angle = sec * (2.0f * PI_F / 60.0f);

        // Hour Hand: Bold White Sword Hand (base width 14px, length 88px)
        {
          float sin_h, cos_h;
          sincosf(h_angle, &sin_h, &cos_h);
          it.filled_triangle(cx - (int)(7.0f * cos_h), cy - (int)(7.0f * sin_h),
                             cx + (int)(7.0f * cos_h), cy + (int)(7.0f * sin_h),
                             cx + (int)(88.0f * sin_h), cy - (int)(88.0f * cos_h),
                             id(col_white));
        }

        // Minute Hand: Slender Slate Gray Sword Hand (base width 8px, length 148px)
        {
          float sin_m, cos_m;
          sincosf(m_angle, &sin_m, &cos_m);
          it.filled_triangle(cx - (int)(4.0f * cos_m), cy - (int)(4.0f * sin_m),
                             cx + (int)(4.0f * cos_m), cy + (int)(4.0f * sin_m),
                             cx + (int)(148.0f * sin_m), cy - (int)(148.0f * cos_m),
                             id(col_slate));
        }

        // Second Hand: Bold Red Needle (length 168px) with 4px circular counterweight
        {
          float sin_s, cos_s;
          sincosf(s_angle, &sin_s, &cos_s);
          int tip_x = cx + (int)(168.0f * sin_s);
          int tip_y = cy - (int)(168.0f * cos_s);
          int tail_x = cx - (int)(30.0f * sin_s);
          int tail_y = cy + (int)(30.0f * cos_s);
          it.line(tail_x, tail_y, tip_x, tip_y, id(col_red));
          it.filled_circle(tail_x, tail_y, 4, id(col_red));
        }

        // Center Pinion Cap (White ring, red center pip)
        it.filled_circle(cx, cy, 7, id(col_white));
        it.filled_circle(cx, cy, 4, id(col_red));
        it.filled_circle(cx, cy, 2, id(col_dark_gray));
        }
      }

      // ==========================================
      // PAGE 1: VINTAGE 1970 HEUER SWISS CHRONOMETER
      // High-Contrast Aged Parchment Dial, Dual Silver & Black Bezels,
      // 1/10s High-Speed Spinning Subdial, Bold Arrow Hand & Large Digital Readout
      // ==========================================
      } else if (id(gui_page) == 1) {
        // Outer Triple Bezel: Silver Outer Ring -> Black Band -> Inner Silver Accent Ring
        it.circle(cx, cy, 230, id(col_silver));
        it.circle(cx, cy, 229, id(col_silver));
        it.circle(cx, cy, 228, id(col_black));
        it.circle(cx, cy, 227, id(col_black));
        it.circle(cx, cy, 226, id(col_black));
        it.circle(cx, cy, 225, id(col_black));
        it.circle(cx, cy, 224, id(col_silver));
        it.circle(cx, cy, 223, id(col_silver));

        // Authentic 1970s Vintage Aged Parchment / Warm Opaline Off-White Dial
        it.filled_circle(cx, cy, 222, Color(216, 206, 184));

        // Outer Chapter Track Boundaries (Bold double ring)
        it.circle(cx, cy, 220, id(col_black));
        it.circle(cx, cy, 219, id(col_black));
        it.circle(cx, cy, 192, id(col_black));
        it.circle(cx, cy, 191, id(col_black));

        // Precision Perimeter Chapter Ring (Fast LUT Lookups: Zero Transcendental Calls)
        for (int s = 0; s < 60; s++) {
          float t_sin = DIAL_SIN[s];
          float t_cos = DIAL_COS[s];
          
          if (s % 5 == 0) {
            // Major 5-Second Bar: 3px wide, prominent solid black
            float perp_x = -t_cos;
            float perp_y = t_sin;
            int x1 = cx + (int)(191.0f * t_sin);
            int y1 = cy - (int)(191.0f * t_cos);
            int x2 = cx + (int)(220.0f * t_sin);
            int y2 = cy - (int)(220.0f * t_cos);
            it.line(x1, y1, x2, y2, id(col_black));
            it.line(x1 + (int)perp_x, y1 + (int)perp_y, x2 + (int)perp_x, y2 + (int)perp_y, id(col_black));
            it.line(x1 - (int)perp_x, y1 - (int)perp_y, x2 - (int)perp_x, y2 - (int)perp_y, id(col_black));
          } else {
            // Standard 1-Second Tick: 2px wide from r=204 to r=220
            int x1 = cx + (int)(204.0f * t_sin);
            int y1 = cy - (int)(204.0f * t_cos);
            int x2 = cx + (int)(220.0f * t_sin);
            int y2 = cy - (int)(220.0f * t_cos);
            it.line(x1, y1, x2, y2, id(col_black));
            it.line(x1 + 1, y1, x2 + 1, y2, id(col_black));
          }
        }

        // Bold Perimeter Numerals (0..55: Fast LUT Lookups, with standard 0 at 12 o'clock)
        for (int s = 0; s <= 55; s += 5) {
          float t_sin = DIAL_SIN[s];
          float t_cos = DIAL_COS[s];
          char num_str[8];
          snprintf(num_str, sizeof(num_str), "%d", s);
          it.print(cx + (int)(170.0f * t_sin), cy - (int)(170.0f * t_cos),
                   id(font_small), id(col_black), TextAlign::CENTER, num_str);
        }

        uint32_t total_ms = id(stopwatch_running) ? (millis() - id(stopwatch_start_time)) : id(stopwatch_elapsed_ms);
        int mins = (total_ms / 60000) % 60;
        int secs = (total_ms / 1000) % 60;
        int tenths = (total_ms / 100) % 10;

        // ----------------------------------------------------
        // 12 O'CLOCK SUB-DIAL: 1/10-SECOND HIGH-SPEED SPINNER (ENLARGED r=50)
        // ----------------------------------------------------
        const int sub_cx = cx;
        const int sub_cy = 140;
        const int sub_r = 50;

        // Recessed subdial with subtle authentic mechanical depth shading
        it.filled_circle(sub_cx, sub_cy, sub_r - 2, Color(208, 198, 176));
        it.circle(sub_cx, sub_cy, sub_r, id(col_black));
        it.circle(sub_cx, sub_cy, sub_r - 1, id(col_black));
        it.circle(sub_cx, sub_cy, sub_r - 2, id(col_silver));

        // 10 Tenths Ticks (0..9: Fast SUB_SIN/COS LUT Lookups)
        for (int i = 0; i < 10; i++) {
          float s_i = SUB_SIN[i];
          float c_i = SUB_COS[i];
          int r_in = (i % 2 == 0) ? (sub_r - 10) : (sub_r - 6);
          it.line(sub_cx + (int)(r_in * s_i), sub_cy - (int)(r_in * c_i),
                  sub_cx + (int)((sub_r - 2) * s_i), sub_cy - (int)((sub_r - 2) * c_i), id(col_black));
          if (i % 2 == 0) {
            it.line(sub_cx + (int)(r_in * s_i) + 1, sub_cy - (int)(r_in * c_i),
                    sub_cx + (int)((sub_r - 2) * s_i) + 1, sub_cy - (int)((sub_r - 2) * c_i), id(col_black));
          }
        }

        // Subdial Markings: 0, 2, 4, 6, 8 (Fast SUB_SIN/COS LUT Lookups)
        for (int i = 0; i < 10; i += 2) {
          float s_i = SUB_SIN[i];
          float c_i = SUB_COS[i];
          char sub_num[4];
          snprintf(sub_num, sizeof(sub_num), "%d", i);
          it.print(sub_cx + (int)(28.0f * s_i), sub_cy - (int)(28.0f * c_i),
                   id(font_small), id(col_black), TextAlign::CENTER, sub_num);
        }

        it.print(sub_cx, sub_cy + 14, id(font_micro), id(col_slate), TextAlign::CENTER, "1/10 SEC");

        // High-Speed 1/10s Spinning Needle (2px bold racing red, 1 revolution per 1000ms!)
        float sub_angle = ((total_ms % 1000) / 1000.0f) * (2.0f * PI_F);
        float sub_sin, sub_cos;
        sincosf(sub_angle, &sub_sin, &sub_cos);
        int sub_tip_x = sub_cx + (int)(38.0f * sub_sin);
        int sub_tip_y = sub_cy - (int)(38.0f * sub_cos);
        int sub_tail_x = sub_cx - (int)(9.0f * sub_sin);
        int sub_tail_y = sub_cy + (int)(9.0f * sub_cos);
        it.line(sub_tail_x, sub_tail_y, sub_tip_x, sub_tip_y, id(col_red));
        it.line(sub_tail_x + 1, sub_tail_y, sub_tip_x + 1, sub_tip_y, id(col_red));
        it.filled_circle(sub_cx, sub_cy, 4, id(col_black));
        it.filled_circle(sub_cx, sub_cy, 2, id(col_silver));

        // ----------------------------------------------------
        // CHRONOMETER DIGITAL READOUT (Large, Bold, High-Legibility)
        // ----------------------------------------------------
        char chrono_buf[32];
        snprintf(chrono_buf, sizeof(chrono_buf), "%02d:%02d.%d", mins, secs, tenths);
        it.print(cx, 248, id(font_chrono_time), id(col_black), TextAlign::CENTER, chrono_buf);

        // Display lap time readout if recorded (centered at y=272, well clear of pushers)
        if (id(stopwatch_lap_ms) > 0) {
          int l_mins = (id(stopwatch_lap_ms) / 60000) % 60;
          int l_secs = (id(stopwatch_lap_ms) / 1000) % 60;
          int l_tenths = (id(stopwatch_lap_ms) / 100) % 10;
          char lap_buf[32];
          snprintf(lap_buf, sizeof(lap_buf), "SPLIT  %02d:%02d.%d", l_mins, l_secs, l_tenths);
          it.print(cx, 272, id(font_small), id(theme_secondary), TextAlign::CENTER, lap_buf);
        }

        // ----------------------------------------------------
        // SPLIT-SECOND (RATTRAPANTE) GHOST HAND (FREEZES AT LAP)
        // ----------------------------------------------------
        if (id(stopwatch_lap_ms) > 0) {
          float lap_angle = ((id(stopwatch_lap_ms) % 60000) / 60000.0f) * (2.0f * PI_F);
          float l_sin, l_cos;
          sincosf(lap_angle, &l_sin, &l_cos);
          it.line(cx, cy, cx + (int)(150.0f * l_sin), cy - (int)(150.0f * l_cos), id(theme_secondary));
          it.circle(cx + (int)(154.0f * l_sin), cy - (int)(154.0f * l_cos), 4, id(theme_secondary));
        }

        // ----------------------------------------------------
        // MAIN CENTRAL ARROW HAND (CLASSIC 1970 HEUER BOLD CHRONOGRAPH)
        // ----------------------------------------------------
        float chrono_angle = ((total_ms % 60000) / 60000.0f) * (2.0f * PI_F);
        float s_sin, s_cos;
        sincosf(chrono_angle, &s_sin, &s_cos);

        int tip_x = cx + (int)(174.0f * s_sin);
        int tip_y = cy - (int)(174.0f * s_cos);
        int arr_base_x = cx + (int)(148.0f * s_sin);
        int arr_base_y = cy - (int)(148.0f * s_cos);
        int tail_x = cx - (int)(36.0f * s_sin);
        int tail_y = cy + (int)(36.0f * s_cos);

        // True perpendicular vector (Rotated 90 deg clockwise from radial vector)
        // v = (s_sin, -s_cos) -> perp = (s_cos, s_sin). Dot product = 0.00 at all 360 degrees!
        float perp_x = s_cos;
        float perp_y = s_sin;
        // Constant 16px wide arrowhead base (8px each side), 24px long spearhead
        int left_x = arr_base_x + (int)(8.0f * perp_x);
        int left_y = arr_base_y + (int)(8.0f * perp_y);
        int right_x = arr_base_x - (int)(8.0f * perp_x);
        int right_y = arr_base_y - (int)(8.0f * perp_y);

        // Main shaft: 3px solid black chronometer pointer
        it.line(tail_x, tail_y, arr_base_x, arr_base_y, id(col_black));
        it.line(tail_x + (int)perp_x, tail_y + (int)perp_y, arr_base_x + (int)perp_x, arr_base_y + (int)perp_y, id(col_black));
        it.line(tail_x - (int)perp_x, tail_y - (int)perp_y, arr_base_x - (int)perp_x, arr_base_y - (int)perp_y, id(col_black));

        // Classic bold arrowhead
        it.filled_triangle(tip_x, tip_y, left_x, left_y, right_x, right_y, id(col_black));

        // Teardrop counter-weight tail: 8px radius
        it.filled_circle(tail_x, tail_y, 8, id(col_black));
        it.circle(tail_x, tail_y, 8, id(col_silver));
        it.filled_circle(tail_x, tail_y, 3, id(col_silver));

        // Multi-tier Center Pinion Arbor Cap
        it.filled_circle(cx, cy, 9, id(col_silver));
        it.circle(cx, cy, 9, id(col_black));
        it.filled_circle(cx, cy, 6, id(col_black));
        it.filled_circle(cx, cy, 2, id(col_silver));

        // ----------------------------------------------------
        // ENLARGED DUAL PUSHERS: LAP & RESET (Optimized: y=328, x=179 & 287)
        // 22px clear of 25 & 35, and 18px clear of SPLIT readout
        // ----------------------------------------------------
        const int btn_y = 328;
        const int btn_lap_x = 179;
        const int btn_rst_x = 287;

        // LAP Button (Inboard radius 38px, diameter 76px)
        it.filled_circle(btn_lap_x, btn_y, 38, id(col_dark_gray));
        it.circle(btn_lap_x, btn_y, 38, id(col_black));
        it.circle(btn_lap_x, btn_y, 37, id(col_silver));
        it.print(btn_lap_x, btn_y, id(font_small), id(col_white), TextAlign::CENTER, "LAP");

        // RESET Button (Inboard radius 38px, diameter 76px)
        it.filled_circle(btn_rst_x, btn_y, 38, id(col_dark_gray));
        it.circle(btn_rst_x, btn_y, 38, id(col_black));
        it.circle(btn_rst_x, btn_y, 37, id(theme_secondary));
        it.print(btn_rst_x, btn_y, id(font_small), id(col_white), TextAlign::CENTER, "RESET");

      // ==========================================
      // PAGE 2: MUSIC PLAYER & MULTI-ROOM EXPANSION
      // ==========================================
      } else if (id(gui_page) == 2) {
        // Pixel-accurate dynamic text truncation using font_small measurement across all music views
        auto fit_text_to_width = [&](const std::string &str, int max_w) -> std::string {
          if (str.empty()) return "";
          int w = 0, x_off = 0, base = 0, text_h = 0;
          id(font_small)->measure(str.c_str(), &w, &x_off, &base, &text_h);
          if (w <= max_w) return str;

          std::string cur = str;
          if (cur.length() > 32) {
            while (cur.length() > 30) {
              while (!cur.empty() && (static_cast<unsigned char>(cur.back()) & 0xC0) == 0x80) cur.pop_back();
              if (!cur.empty()) cur.pop_back();
            }
          }
          while (!cur.empty()) {
            std::string test_str = cur + "..";
            id(font_small)->measure(test_str.c_str(), &w, &x_off, &base, &text_h);
            if (w <= max_w) return test_str;
            while (!cur.empty() && (static_cast<unsigned char>(cur.back()) & 0xC0) == 0x80) cur.pop_back();
            if (!cur.empty()) cur.pop_back();
          }
          return "..";
        };

        if (id(music_overlay_mode) == 0) {
          // --------------------------------------------------
          // VIEW 0: NOW PLAYING MUSIC PLAYER
          // --------------------------------------------------
          std::string art_mode = id(music_fullscreen_art_mode).current_option();
          if (art_mode.empty()) art_mode = "Full Screen";
          bool is_compact = (art_mode == "Compact");
          bool is_letterbox = (art_mode == "Letterbox");

          std::string overlay_mode = id(music_overlay_style).current_option();
          if (overlay_mode.empty()) overlay_mode = "Art Only";

          bool always_visible = is_compact || (overlay_mode == "Always Visible");
          bool show_meta_always = always_visible || (overlay_mode == "Art + Metadata");

          bool show_controls = always_visible || id(music_hud_active);
          bool show_metadata = show_meta_always || id(music_hud_active);

          // Title & Active Speaker Indicator: Rendered only on Compact View (Full Screen & Letterbox overlays rendered post-art in show_controls)
          if (is_compact) {
            it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "MUSIC");
          }

          bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
          bool is_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                            (id(ha_target_state).state == "playing");

          std::string spk_label = id(active_speaker_name);
          bool is_feedback = (millis() - id(music_feedback_timer) < 1800 && !id(music_action_feedback).empty());
          if (is_feedback) {
            spk_label = id(music_action_feedback);
          } else if (millis() < 4000) {
            spk_label = "CONNECTING...";
          }
          if (is_compact) {
            it.print(cx, 74, id(font_small), is_feedback ? id(theme_primary) : ((is_remote && millis() >= 4000) ? id(theme_secondary) : id(col_slate)), TextAlign::CENTER, spk_label.c_str());
          }

          const int art_center_y = 212;

          bool has_art = false;
          esphome::image::Image *target_art = nullptr;
          if (is_remote) {
            // Remote playback: Strictly display remote_album_art when synced to HA target art URL
            // Never fall back to local album_art, preventing stale local artwork from lingering during remote control
            if (!id(ha_target_art_url).state.empty() && id(ha_target_art_url).state != "none" &&
                id(current_loaded_art_url) == id(ha_target_art_url).state && id(remote_album_art).get_width() > 0) {
              target_art = id(remote_album_art);
              has_art = true;
            }
          } else {
            // Local playback: Display local album_art
            if (id(album_art).get_width() > 0) {
              target_art = id(album_art);
              has_art = true;
            }
          }

          // Dedicated Loading Screen on Initial Boot / Art Ingestion (never blocks active playback controls)
          bool is_loading = !has_art && !is_playing && (millis() < 15000 || (is_remote && (id(ha_target_state).state.empty() || id(ha_target_state).state == "unavailable" || id(ha_target_state).state == "unknown" || (!id(ha_target_art_url).state.empty() && id(ha_target_art_url).state != "none" && id(current_loaded_art_url) != id(ha_target_art_url).state))));

          if (is_loading) {
            // Elegant loading screen with animated vinyl orbit
            it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "MUSIC");

            // Vinyl silhouette
            it.filled_circle(cx, 195, 64, id(col_dark_gray));
            it.circle(cx, 195, 64, id(col_black));
            it.circle(cx, 195, 63, id(col_gray));
            it.circle(cx, 195, 48, id(col_black));
            it.circle(cx, 195, 32, id(col_black));
            it.filled_circle(cx, 195, 12, id(theme_primary));

            // Animated orbit dot
            float spin_a = (millis() % 2000) * (2.0f * PI_F / 2000.0f);
            it.filled_circle(cx + (int)(74.0f * cosf(spin_a)), 195 + (int)(74.0f * sinf(spin_a)), 4, id(theme_secondary));

            it.print(cx, 290, id(font_small), id(col_white), TextAlign::CENTER, "LOADING MUSIC...");
            std::string load_status = "Connecting to Music Assistant...";
            if (!id(active_speaker_name).empty() && id(active_speaker_name) != "None") {
              load_status = id(active_speaker_name);
            }
            it.print(cx, 318, id(font_small), id(theme_secondary), TextAlign::CENTER, load_status.c_str());
            return;
          }

          bool rendered_art = false;
          if (has_art && target_art != nullptr) {
            const uint16_t *src_data = reinterpret_cast<const uint16_t *>(target_art->get_data_start());
            int src_w = target_art->get_width();
            int src_h = target_art->get_height();

            if (src_data != nullptr && src_w > 0 && src_h > 0) {
              rendered_art = true;
              if (is_compact) {
                // Compact mode: Downscale 466x466 to 216x216 centered at (cx - 108, 104)
                int step_x = (src_w << 12) / 216;
                int step_y = (src_h << 12) / 216;
                int curr_y = 0;
                for (int y = 0; y < 216; y++) {
                  int sy = curr_y >> 12;
                  curr_y += step_y;
                  const uint16_t *src_row = src_data + sy * src_w;
                  int py = 104 + y;
                  int curr_x = 0;
                  for (int x = 0; x < 216; x++) {
                    uint16_t p = src_row[curr_x >> 12];
                    uint8_t r = (p & 0xF800) >> 8;
                    uint8_t g = (p & 0x07E0) >> 3;
                    uint8_t b = (p & 0x001F) << 3;
                    it.draw_pixel_at(125 + x, py, Color(r, g, b));
                    curr_x += step_x;
                  }
                }
              } else {
                // Full Screen & Letterbox: Direct Row-Major Pointer Reads with CIRCLE_HW clipping
                int start_y = is_letterbox ? 60 : 0;
                int end_y = is_letterbox ? 385 : 466;
                if (src_w == 466 && src_h == 466) {
                  for (int y = start_y; y < end_y; y++) {
                    int hw = CIRCLE_HW[y];
                    int start_x = cx - hw;
                    int end_x = cx + hw;
                    const uint16_t *src_row = src_data + y * 466;
                    for (int x = start_x; x <= end_x; x++) {
                      uint16_t p = src_row[x];
                      uint8_t r = (p & 0xF800) >> 8;
                      uint8_t g = (p & 0x07E0) >> 3;
                      uint8_t b = (p & 0x001F) << 3;
                      it.draw_pixel_at(x, y, Color(r, g, b));
                    }
                  }
                } else {
                  int step_x = (src_w << 12) / 466;
                  int step_y = (src_h << 12) / 466;
                  int curr_y = start_y * step_y;
                  for (int y = start_y; y < end_y; y++) {
                    int sy = curr_y >> 12;
                    curr_y += step_y;
                    const uint16_t *src_row = src_data + sy * src_w;
                    int hw = CIRCLE_HW[y];
                    int start_x = cx - hw;
                    int end_x = cx + hw;
                    for (int x = start_x; x <= end_x; x++) {
                      uint16_t p = src_row[(x * step_x) >> 12];
                      uint8_t r = (p & 0xF800) >> 8;
                      uint8_t g = (p & 0x07E0) >> 3;
                      uint8_t b = (p & 0x001F) << 3;
                      it.draw_pixel_at(x, y, Color(r, g, b));
                    }
                  }
                }

                // Scrim handling based on HUD and Metadata visibility
                if (id(music_hud_active)) {
                  // Full 50% Translucent Dither Scrim across art canvas when controls are summoned
                  for (int y = start_y; y < end_y; y++) {
                    int hw = CIRCLE_HW[y];
                    int start_x = cx - hw;
                    if ((start_x + y) % 2 != 0) start_x++;
                    int end_x = cx + hw;
                    for (int x = start_x; x <= end_x; x += 2) {
                      it.draw_pixel_at(x, y, id(col_black));
                    }
                  }
                } else if (show_metadata) {
                  // Subtle bottom metadata scrim when metadata is set to always show without controls
                  int scrim_end = is_letterbox ? 385 : 395;
                  for (int y = 320; y < scrim_end; y++) {
                    int hw = CIRCLE_HW[y];
                    int start_x = cx - hw;
                    if ((start_x + y) % 2 != 0) start_x++;
                    int end_x = cx + hw;
                    for (int x = start_x; x <= end_x; x += 2) {
                      it.draw_pixel_at(x, y, id(col_black));
                    }
                  }
                }
              }
            }
          }

          if (!rendered_art) {
            // High-contrast Vinyl Disc with Remote Audio Badge centered at (cx, 212)
            it.filled_circle(cx, art_center_y, 80, id(col_dark_gray));
            it.circle(cx, art_center_y, 80, is_remote ? id(theme_secondary) : id(theme_primary));
            it.circle(cx, art_center_y, 64, id(col_bg));
            it.circle(cx, art_center_y, 48, id(col_dark_gray));
            it.circle(cx, art_center_y, 32, id(col_bg));
            it.filled_circle(cx, art_center_y, 16, is_remote ? id(theme_secondary) : id(theme_primary));
          }

          if (show_controls) {
            // Full Screen & Letterbox: Top-Center Active Speaker Name Overlay (rendered post-art & post-scrim)
            if (!is_compact) {
              std::string spk_top = id(active_speaker_name);
              if (spk_top.empty() || spk_top == "None") spk_top = "${friendly_name}";
              spk_top = fit_text_to_width(spk_top, 260);
              // 1px subtle drop shadow ensures razor-sharp legibility over underlying art highlights
              it.print(cx + 1, 65, id(font_small), id(col_black), TextAlign::CENTER, spk_top.c_str());
              it.print(cx, 64, id(font_small), id(col_white), TextAlign::CENTER, spk_top.c_str());
            }

            // Flank Control Buttons in High-Contrast Dark Gray Circular Capsules (Radius 18)
            // Mode-aware placement: compact mode keeps buttons wide (102, 364) to clear 216x216 art;
            // Full Screen & Letterbox position buttons at (124, 342) for comfortable thumb reach with 57px Play gap
            const int prev_btn_x = is_compact ? 102 : 124;
            const int next_btn_x = is_compact ? 364 : 342;
            const int left_flank_x = 71;   // Inward ergonomic shift (+10px from 61, clearing curved glass bezel fringe)
            const int right_flank_x = 395; // Inward ergonomic shift (-10px from 405, symmetrical 162px from cx=233)
            Color btn_rim_col = is_compact ? id(col_black) : id(col_gray);

            // Reusable Vector Glyph Renderers with Shadow Offsets (ox, oy)
            auto draw_speaker_glyph = [&](int ox, int oy, Color c) {
              int sx = left_flank_x + ox;
              int sy = 140 + oy;
              it.filled_rectangle(sx - 8, sy - 4, 4, 9, c);
              it.filled_triangle(sx - 6, sy, sx + 1, sy - 8, sx + 1, sy + 8, c);
              it.filled_rectangle(sx - 5, sy - 4, 6, 9, c);
              it.line(sx + 4, sy - 4, sx + 6, sy, c);
              it.line(sx + 6, sy, sx + 4, sy + 4, c);
              it.line(sx + 8, sy - 7, sx + 11, sy, c);
              it.line(sx + 11, sy, sx + 8, sy + 7, c);
            };

            bool is_speech_media = (id(active_playback_media_type) == "podcast" || 
                                    id(active_playback_media_type) == "podcast_episode" || 
                                    id(active_playback_media_type) == "audiobook");

            auto draw_skip_back_glyph = [&](int ox, int oy, Color c) {
              int px = prev_btn_x + ox;
              int py = art_center_y + oy;
              it.filled_triangle(px - 9, py - 9, px - 3, py - 14, px - 3, py - 4, c);
              it.horizontal_line(px - 3, py - 9, 10, c);
              it.line(px + 7, py - 9, px + 10, py - 6, c);
              it.vertical_line(px + 10, py - 6, 6, c);
              it.print(px, py + 4, id(font_micro), c, TextAlign::CENTER, "-10");
            };

            auto draw_skip_fwd_glyph = [&](int ox, int oy, Color c) {
              int nx = next_btn_x + ox;
              int ny = art_center_y + oy;
              it.filled_triangle(nx + 9, ny - 9, nx + 3, ny - 14, nx + 3, ny - 4, c);
              it.horizontal_line(nx - 7, ny - 9, 10, c);
              it.line(nx - 7, ny - 9, nx - 10, ny - 6, c);
              it.vertical_line(nx - 10, ny - 6, 6, c);
              it.print(nx, ny + 4, id(font_micro), c, TextAlign::CENTER, "+30");
            };

            auto draw_prev_glyph = [&](int ox, int oy, Color c) {
              int px = prev_btn_x + ox;
              int py = art_center_y + oy;
              it.filled_rectangle(px - 14, py - 10, 3, 21, c);
              it.filled_triangle(px - 8, py, px + 6, py - 10, px + 6, py + 10, c);
            };

            auto draw_library_glyph = [&](int ox, int oy, Color c) {
              int lx = left_flank_x + ox;
              int ly = 286 + oy;
              for (int dy : {-4, 0, 4}) {
                it.filled_rectangle(lx - 7, ly + dy, 14, 2, c);
              }
            };

            auto draw_vol_up_glyph = [&](int ox, int oy, Color c) {
              int vx = right_flank_x + ox;
              int vy = 140 + oy;
              it.filled_rectangle(vx - 7, vy - 1, 15, 3, c);
              it.filled_rectangle(vx - 1, vy - 7, 3, 15, c);
            };

            auto draw_next_glyph = [&](int ox, int oy, Color c) {
              int nx = next_btn_x + ox;
              int ny = art_center_y + oy;
              it.filled_triangle(nx + 8, ny, nx - 6, ny - 10, nx - 6, ny + 10, c);
              it.filled_rectangle(nx + 11, ny - 10, 3, 21, c);
            };

            auto draw_vol_dn_glyph = [&](int ox, int oy, Color c) {
              int vx = right_flank_x + ox;
              int vy = 284 + oy;
              it.filled_rectangle(vx - 7, vy - 1, 15, 3, c);
            };

            if (is_compact) {
              // Compact View: Traditional Solid Dark Gray Circular Capsules (Radius 18) Flanking 216x216 Art
              it.filled_circle(left_flank_x, 140, 18, id(col_dark_gray));
              it.circle(left_flank_x, 140, 18, id(col_black));
              draw_speaker_glyph(0, 0, id(col_white));

              it.filled_circle(prev_btn_x, art_center_y, 18, id(col_dark_gray));
              it.circle(prev_btn_x, art_center_y, 18, id(col_black));
              if (is_speech_media) {
                draw_skip_back_glyph(0, 0, id(col_white));
              } else {
                draw_prev_glyph(0, 0, id(col_white));
              }

              it.filled_circle(left_flank_x, 286, 18, id(col_dark_gray));
              it.circle(left_flank_x, 286, 18, id(col_black));
              draw_library_glyph(0, 0, id(col_white));

              it.filled_circle(right_flank_x, 140, 18, id(col_dark_gray));
              it.circle(right_flank_x, 140, 18, id(col_black));
              draw_vol_up_glyph(0, 0, id(col_white));

              it.filled_circle(next_btn_x, art_center_y, 18, id(col_dark_gray));
              it.circle(next_btn_x, art_center_y, 18, id(col_black));
              if (is_speech_media) {
                draw_skip_fwd_glyph(0, 0, id(col_white));
              } else {
                draw_next_glyph(0, 0, id(col_white));
              }

              it.filled_circle(right_flank_x, 284, 18, id(col_dark_gray));
              it.circle(right_flank_x, 284, 18, id(col_black));
              draw_vol_dn_glyph(0, 0, id(col_white));
            } else {
              // Full Screen & Letterbox: Modern Floating YouTube-Style Vector Glyphs with 1px Drop Shadows
              // Eliminates heavy dark circular backing; lets the album art breathe with razor-sharp contrast
              draw_speaker_glyph(1, 1, id(col_black));
              draw_speaker_glyph(0, 0, id(col_white));

              if (is_speech_media) {
                draw_skip_back_glyph(1, 1, id(col_black));
                draw_skip_back_glyph(0, 0, id(col_white));
              } else {
                draw_prev_glyph(1, 1, id(col_black));
                draw_prev_glyph(0, 0, id(col_white));
              }

              draw_library_glyph(1, 1, id(col_black));
              draw_library_glyph(0, 0, id(col_white));

              draw_vol_up_glyph(1, 1, id(col_black));
              draw_vol_up_glyph(0, 0, id(col_white));

              if (is_speech_media) {
                draw_skip_fwd_glyph(1, 1, id(col_black));
                draw_skip_fwd_glyph(0, 0, id(col_white));
              } else {
                draw_next_glyph(1, 1, id(col_black));
                draw_next_glyph(0, 0, id(col_white));
              }

              draw_vol_dn_glyph(1, 1, id(col_black));
              draw_vol_dn_glyph(0, 0, id(col_white));
            }

            // Center Hero Play/Pause Button: High-Contrast Dark Gray Circular Capsule (Radius 34)
            // Displays Play badge ▶ when paused, and Pause badge ❚❚ when playing across all 3 art modes
            it.filled_circle(cx, art_center_y, 34, id(col_dark_gray));
            it.circle(cx, art_center_y, 34, id(col_black));
            if (!is_compact) it.circle(cx, art_center_y, 33, btn_rim_col);

            if (!is_playing) {
              // Play Badge ▶
              it.filled_triangle(cx - 7, art_center_y - 15, cx - 7, art_center_y + 15, cx + 15, art_center_y, id(theme_primary));
            } else {
              // Pause Badge ❚❚ (Two distinct vertical bars centered with 6px spacing)
              it.filled_rectangle(cx - 9, art_center_y - 13, 6, 26, id(theme_primary));
              it.filled_rectangle(cx + 3, art_center_y - 13, 6, 26, id(theme_primary));
            }

          }

          if (show_metadata) {
            // Real-time track progress calculation
            float dur = id(ha_media_duration).state;
            float current_pos = id(music_pos_base);
            if (is_playing && id(music_pos_sync_time) > 0) {
              current_pos += (millis() - id(music_pos_sync_time)) / 1000.0f;
            }
            float prog = 0.0f;
            if (!isnan(dur) && dur > 0.0f) {
              prog = current_pos / dur;
              if (prog < 0.0f) prog = 0.0f;
              if (prog > 1.0f) prog = 1.0f;
            }

            // Perimeter continuous track playback progress arc (r = 224, 2px continuous stroke)
            if (prog > 0.005f) {
              float end_a = prog * 2.0f * PI_F;
              float step = 0.035f;
              for (float a = 0.0f; a < end_a; a += step) {
                float next_a = std::min(a + step, end_a);
                float s1, c1, s2, c2;
                sincosf(a, &s1, &c1);
                sincosf(next_a, &s2, &c2);
                it.line(cx + (int)(224.0f * s1), cy - (int)(224.0f * c1),
                        cx + (int)(224.0f * s2), cy - (int)(224.0f * c2), id(theme_secondary));
                it.line(cx + (int)(225.0f * s1), cy - (int)(225.0f * c1),
                        cx + (int)(225.0f * s2), cy - (int)(225.0f * c2), id(theme_secondary));
              }
            }

            // Track Title, Artist, Album extraction (dynamic Home Assistant priority when remote)
            std::string title = "";
            std::string artist = "";
            std::string album = "";

            if (is_remote) {
              title = id(ha_track_title).state;
              artist = id(ha_track_artist).state;
              album = id(ha_track_album).state;
            } else {
              title = id(track_title).state;
              if (title.empty() || title == "None") title = id(ha_track_title).state;
              artist = id(track_artist).state;
              if (artist.empty() || artist == "None") artist = id(ha_track_artist).state;
              album = id(track_album).state;
              if (album.empty() || album == "None") album = id(ha_track_album).state;
            }

            if (title.empty() || title == "None") title = is_playing ? "Playing Audio" : "Idle";
            if (title.length() > 24) title = title.substr(0, 22) + "...";

            // Uncrowded metadata layout below album art (y = 336, 358, 378) with drop shadow in full screen/letterbox
            bool has_shadow = !is_compact && has_art;
            if (has_shadow) {
              it.print(cx + 1, 336 + 1, id(font_small), id(col_black), TextAlign::CENTER, title.c_str());
            }
            it.print(cx, 336, id(font_small), id(col_white), TextAlign::CENTER, title.c_str());
            if (!artist.empty() && artist != "None") {
              if (artist.length() > 26) artist = artist.substr(0, 24) + "...";
              if (has_shadow) {
                it.print(cx + 1, 358 + 1, id(font_small), id(col_black), TextAlign::CENTER, artist.c_str());
              }
              it.print(cx, 358, id(font_small), id(theme_secondary), TextAlign::CENTER, artist.c_str());
            }
            if (!album.empty() && album != "None") {
              if (album.length() > 28) album = album.substr(0, 26) + "...";
              if (has_shadow) {
                it.print(cx + 1, 378 + 1, id(font_small), id(col_black), TextAlign::CENTER, album.c_str());
              }
              it.print(cx, 378, id(font_small), id(col_slate), TextAlign::CENTER, album.c_str());
            }

            // Right Flank Volume HUD Overlay: Centered between Volume Up (+) and Volume Down (-) at (405, 212)
            if (millis() - id(vol_hud_timer) < 1800) {
              int v_pct = (int)std::round(id(pocket_music_player).volume * 100.0f);
              char v_buf[16];
              snprintf(v_buf, sizeof(v_buf), "%d%%", v_pct);
              it.filled_circle(405, art_center_y, 22, id(col_black));
              it.circle(405, art_center_y, 22, id(theme_primary));
              it.print(405, art_center_y, id(font_small), id(col_white), TextAlign::CENTER, v_buf);
            }
          }

        } else if (id(music_overlay_mode) == 1) {
          // --------------------------------------------------
          // LEVEL 1: SPEAKERS BROWSER (Direct 5-Slot Speaker Inventory)
          // Standardized Title at y = 50, Slots 1-5 at y = 104, 162, 220, 278, 336, < BACK at y = 408
          // --------------------------------------------------
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "SPEAKERS");

          auto draw_speaker_card = [&](int y_mid, const std::string &name, const std::string &id_str, bool is_act) {
            if (name.empty()) return;
            bool is_current = (is_act || id_str == id(active_speaker_entity));
            Color border_c = is_current ? id(theme_primary) : id(theme_secondary);
            Color txt_c = is_current ? id(theme_primary) : id(col_white);

            it.filled_circle(110, y_mid, 18, border_c);
            it.filled_circle(356, y_mid, 18, border_c);
            it.filled_rectangle(110, y_mid - 18, 246, 37, border_c);

            it.filled_circle(110, y_mid, 16, id(col_dark_gray));
            it.filled_circle(356, y_mid, 16, id(col_dark_gray));
            it.filled_rectangle(110, y_mid - 16, 246, 33, id(col_dark_gray));

            if (is_current) {
              it.filled_circle(114, y_mid, 6, id(theme_primary));
            } else {
              it.circle(114, y_mid, 5, id(col_slate));
            }

            std::string disp_name = fit_text_to_width(name, 218);
            it.print(130, y_mid, id(font_small), txt_c, TextAlign::CENTER_LEFT, disp_name.c_str());
          };

          // Standardized Card Pitch = 58px (y = 104, 162, 220, 278, 336, 5 slots)
          draw_speaker_card(104, id(slot_1_name), id(slot_1_id), id(slot_1_active));
          draw_speaker_card(162, id(slot_2_name), id(slot_2_id), id(slot_2_active));
          draw_speaker_card(220, id(slot_3_name), id(slot_3_id), id(slot_3_active));
          draw_speaker_card(278, id(slot_4_name), id(slot_4_id), id(slot_4_active));
          draw_speaker_card(336, id(slot_5_name), id(slot_5_id), id(slot_5_active));

          // Option 1 Right-Flank Vertical Chevrons (▲ Up at y=162, ▼ Down at y=278)
          // Always visible in continuous wrap-around carousel mode
          if (id(music_browse_total_pages) > 1) {
            it.filled_rectangle(395, 140, 71, 160, id(col_bg));
            // Up chevron (▲) at x = 415, y = 162
            it.line(415 - 8, 162 + 4, 415, 162 - 4, id(theme_secondary));
            it.line(415 - 8, 162 + 5, 415, 162 - 3, id(theme_secondary));
            it.line(415 + 8, 162 + 4, 415, 162 - 4, id(theme_secondary));
            it.line(415 + 8, 162 + 5, 415, 162 - 3, id(theme_secondary));

            // Down chevron (▼) at x = 415, y = 278
            it.line(415 - 8, 278 - 4, 415, 278 + 4, id(theme_secondary));
            it.line(415 - 8, 278 - 3, 415, 278 + 5, id(theme_secondary));
            it.line(415 + 8, 278 - 4, 415, 278 + 4, id(theme_secondary));
            it.line(415 + 8, 278 - 3, 415, 278 + 5, id(theme_secondary));
          }

          // Bottom Back to Player (Standardized at y = 408, r = 16)
          draw_back_button();

        } else if (id(music_overlay_mode) == 2) {
          // --------------------------------------------------
          // LEVEL 2: LIBRARY CATEGORIES SUBMENU (Continuous 7-Item Vertical Scroll Architecture)
          // Standardized Title at y = 50, Slots 1-5 at y = 104, 162, 220, 278, 336, < BACK at y = 408, Dots at y = 440
          // Model A: 4-Step Eased 116px (2-Pill) Dynamic Scroll Animation with Clean Viewport Masking
          // Option 1: Right-Flank Vertical Chevrons (▲ Up at y=162 on Page 2, ▼ Down at y=278 on Page 1)
          // Narrowed Pill Width: x1 = 150, x2 = 316 (Calibrated from AUDIOBOOKS padding)
          // --------------------------------------------------
          static const int SCROLL_EASE_116[5] = {0, 25, 63, 99, 116};

          int current_offset = 0;
          if (id(menu_scroll_active)) {
            int cur_step = id(menu_scroll_step);
            if (cur_step < 0) cur_step = 0;
            if (cur_step > 4) cur_step = 4;
            int shift = SCROLL_EASE_116[cur_step];
            if (id(menu_scroll_dir) == 1) {
              // Scrolling Down: offset moves from 0 to 116
              current_offset = shift;
            } else {
              // Scrolling Up: offset moves from 116 down to 0
              current_offset = 116 - shift;
            }
          } else {
            current_offset = (id(music_category_page) == 2) ? 116 : 0;
          }

          auto draw_library_item = [&](int idx, int y) {
            const char* label = "";
            if (idx == 0) label = "FAVORITES";
            else if (idx == 1) label = "PLAYLISTS";
            else if (idx == 2) label = "ARTISTS";
            else if (idx == 3) label = "ALBUMS";
            else if (idx == 4) label = "PODCASTS";
            else if (idx == 5) label = "RADIO";
            else if (idx == 6) label = "AUDIOBOOKS";
            draw_pill_button(150, 316, y, 18, id(theme_secondary), id(col_dark_gray), label, id(col_white), false);
          };

          for (int i = 0; i < 7; i++) {
            int y = 104 + i * 58 - current_offset;
            if (y >= 50 && y <= 390) {
              draw_library_item(i, y);
            }
          }

          // Clean Viewport Masks: clip scrolling pills outside y in [75, 370]
          it.filled_rectangle(0, 0, 466, 75, id(col_bg));
          it.filled_rectangle(0, 370, 466, 96, id(col_bg));

          // Standardized Centered Title at y = 50
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "LIBRARY");

          // Standardized Centered < BACK Button at y = 408 (r = 16)
          draw_back_button();

          // Stationary Pagination Dots nestled at bottom curve y = 440
          int current_dot_page = id(menu_scroll_active) ? id(menu_scroll_target_page) : id(music_category_page);
          int dot1_r = (current_dot_page == 1) ? 3 : 2;
          int dot2_r = (current_dot_page == 2) ? 3 : 2;
          Color dot1_c = (current_dot_page == 1) ? id(theme_primary) : id(col_slate);
          Color dot2_c = (current_dot_page == 2) ? id(theme_primary) : id(col_slate);
          it.filled_circle(226, 440, dot1_r, dot1_c);
          it.filled_circle(240, 440, dot2_r, dot2_c);

          // Option 1 Right-Flank Vertical Chevrons (▲ Up at y=162 on Page 2, ▼ Down at y=278 on Page 1)
          int active_chevron_page = id(menu_scroll_active) ? id(menu_scroll_target_page) : id(music_category_page);
          if (active_chevron_page == 1) {
            // Page 1: Down chevron (▼) at x = 415, y = 278 (Slot 4 level)
            it.line(415, 283, 407, 275, id(theme_secondary));
            it.line(415, 282, 407, 274, id(theme_secondary));
            it.line(415, 283, 423, 275, id(theme_secondary));
            it.line(415, 282, 423, 274, id(theme_secondary));
          } else {
            // Page 2: Up chevron (▲) at x = 415, y = 162 (Slot 2 level)
            it.line(415, 157, 407, 165, id(theme_secondary));
            it.line(415, 158, 407, 166, id(theme_secondary));
            it.line(415, 157, 423, 165, id(theme_secondary));
            it.line(415, 158, 423, 166, id(theme_secondary));
          }

        } else if (id(music_overlay_mode) == 3) {
          // --------------------------------------------------
          // LEVEL 3: ITEM BROWSER (Dual Inline Play/Browse Cards - 5 Slots)
          // --------------------------------------------------
          bool is_spk = (id(selected_category_mode) == "speakers" || id(selected_category_mode) == "speaker_takeover");
          bool is_podcast_list = (id(selected_category_mode) == "podcast");
          bool is_drill = (id(selected_category_mode) == "artist" || id(selected_category_mode) == "album" || id(selected_category_mode) == "artist_albums");

          // Standardized Category/Item Title at y = 50 (matching OS standard)
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, id(selected_category_title).c_str());

          // Using shared fit_text_to_width defined at page 2 scope

          // Dual-Action or Unified Slot Drawer
          auto draw_slot_card = [&](int y_mid, const std::string &name, const std::string &id_str, const std::string &mtype, bool is_act) {
            if (name.empty()) return;

            if (is_drill) {
              // ----------------------------------------------
              // DRILLABLE ITEM: DUAL INLINE BUTTONS (PLAY ▶ + BROWSE >)
              // Shifted 16px left (play center 82, body 138..357) to clear right-flank chevrons at x=415
              // ----------------------------------------------
              // Left Discrete Circular Play Button (center 82, y_mid, radius 18)
              it.filled_circle(82, y_mid, 18, id(col_dark_gray));
              it.circle(82, y_mid, 18, id(theme_primary));
              it.filled_triangle(79, y_mid - 6, 79, y_mid + 6, 88, y_mid, id(theme_primary));

              // Right Card Body with Name and > Drilldown Chevron (x: 120..375, r = 18 matching standard pill height)
              it.filled_circle(138, y_mid, 18, id(theme_secondary));
              it.filled_circle(357, y_mid, 18, id(theme_secondary));
              it.filled_rectangle(138, y_mid - 18, 219, 37, id(theme_secondary));

              it.filled_circle(138, y_mid, 16, id(col_dark_gray));
              it.filled_circle(357, y_mid, 16, id(col_dark_gray));
              it.filled_rectangle(138, y_mid - 16, 219, 33, id(col_dark_gray));

              // Dynamic pixel measurement: max 196px width (stops 10px before hamburger icon at x=350)
              std::string disp_name = fit_text_to_width(name, 196);
              it.print(144, y_mid, id(font_small), id(col_white), TextAlign::CENTER_LEFT, disp_name.c_str());

              // Drilldown Hamburger Icon [ ☰ ] on right end (x: 350..363)
              for (int dy : {-4, 0, 4}) {
                it.filled_rectangle(350, y_mid + dy, 13, 2, id(theme_secondary));
              }
            } else if (is_podcast_list) {
              // ----------------------------------------------
              // PODCAST SERIES ITEM: SUBMENU / DRILLDOWN ONLY (NO DIRECT PLAY)
              // Standardized GUI pill geometry (110..356, r = 18) with Hamburger Icon [ ☰ ] on right
              // ----------------------------------------------
              Color bg_c = id(col_dark_gray);
              Color border_c = id(theme_secondary);
              Color txt_c = id(col_white);

              it.filled_circle(110, y_mid, 18, border_c);
              it.filled_circle(356, y_mid, 18, border_c);
              it.filled_rectangle(110, y_mid - 18, 246, 37, border_c);

              it.filled_circle(110, y_mid, 16, bg_c);
              it.filled_circle(356, y_mid, 16, bg_c);
              it.filled_rectangle(110, y_mid - 16, 246, 33, bg_c);

              // Dynamic pixel measurement: max 196px width (stops cleanly before hamburger icon at x=336)
              std::string disp_name = fit_text_to_width(name, 196);
              it.print(126, y_mid, id(font_small), txt_c, TextAlign::CENTER_LEFT, disp_name.c_str());

              // Drilldown Hamburger Icon [ ☰ ] on right end (x: 336..349)
              for (int dy : {-4, 0, 4}) {
                it.filled_rectangle(336, y_mid + dy, 13, 2, id(theme_secondary));
              }
            } else {
              // ----------------------------------------------
              // REGULAR / PLAYABLE ITEM: STANDARD GUI-WIDTH UNIFIED CARD (110..356, r = 18)
              // ----------------------------------------------
              Color bg_c = id(col_dark_gray);
              Color border_c = is_act ? id(theme_primary) : id(theme_secondary);
              Color txt_c = is_act ? id(theme_primary) : id(col_white);

              // Standardized GUI pill geometry matching Library & System menus
              it.filled_circle(110, y_mid, 18, border_c);
              it.filled_circle(356, y_mid, 18, border_c);
              it.filled_rectangle(110, y_mid - 18, 246, 37, border_c);

              it.filled_circle(110, y_mid, 16, bg_c);
              it.filled_circle(356, y_mid, 16, bg_c);
              it.filled_rectangle(110, y_mid - 16, 246, 33, bg_c);

              if (is_spk) {
                if (is_act || id_str == id(active_speaker_entity)) {
                  it.filled_circle(114, y_mid, 6, id(theme_primary));
                } else {
                  it.circle(114, y_mid, 5, id(col_slate));
                }
              } else {
                Color icon_c = (mtype == "radio") ? id(theme_secondary) : id(theme_primary);
                it.filled_triangle(108, y_mid - 6, 108, y_mid + 6, 118, y_mid, icon_c);
              }

              // Dynamic pixel measurement: max 218px width (stops cleanly before right cap at x=350)
              std::string disp_name = fit_text_to_width(name, 218);
              it.print(130, y_mid, id(font_small), txt_c, TextAlign::CENTER_LEFT, disp_name.c_str());
            }
          };

          // Standardized Card Pitch = 58px (y = 104, 162, 220, 278, 336, 5 slots)
          draw_slot_card(104, id(slot_1_name), id(slot_1_id), id(slot_1_type), id(slot_1_active));
          draw_slot_card(162, id(slot_2_name), id(slot_2_id), id(slot_2_type), id(slot_2_active));
          draw_slot_card(220, id(slot_3_name), id(slot_3_id), id(slot_3_type), id(slot_3_active));
          draw_slot_card(278, id(slot_4_name), id(slot_4_id), id(slot_4_type), id(slot_4_active));
          draw_slot_card(336, id(slot_5_name), id(slot_5_id), id(slot_5_type), id(slot_5_active));

          // Option 1 Right-Flank Vertical Chevrons (▲ Up at y=162, ▼ Down at y=278)
          // Always visible in continuous wrap-around carousel mode
          if (id(music_browse_total_pages) > 1) {
            it.filled_rectangle(395, 140, 71, 160, id(col_bg));
            // Up chevron (▲) at x = 415, y = 162
            it.line(415 - 8, 162 + 4, 415, 162 - 4, id(theme_secondary));
            it.line(415 - 8, 162 + 5, 415, 162 - 3, id(theme_secondary));
            it.line(415 + 8, 162 + 4, 415, 162 - 4, id(theme_secondary));
            it.line(415 + 8, 162 + 5, 415, 162 - 3, id(theme_secondary));

            // Down chevron (▼) at x = 415, y = 278
            it.line(415 - 8, 278 - 4, 415, 278 + 4, id(theme_secondary));
            it.line(415 - 8, 278 - 3, 415, 278 + 5, id(theme_secondary));
            it.line(415 + 8, 278 - 4, 415, 278 + 4, id(theme_secondary));
            it.line(415 + 8, 278 - 3, 415, 278 + 5, id(theme_secondary));
          }

          // Standardized Centered < BACK Button at y = 408 (r = 16)
          draw_back_button();

          // Pagination Page Indicator nestled at y = 440
          if (id(music_browse_total_pages) > 1) {
            char pg_buf[16];
            snprintf(pg_buf, sizeof(pg_buf), "%d / %d", id(music_browse_page), id(music_browse_total_pages));
            it.print(cx, 440, id(font_micro), id(col_slate), TextAlign::CENTER, pg_buf);
          }
        } else if (id(music_overlay_mode) == 4) {
          // --------------------------------------------------
          // LEVEL 4: SPEAKER ACTION SHEET (Contextual Actions for Target Speaker)
          // --------------------------------------------------
          std::string spk_title = id(target_speaker_name);
          if (spk_title.empty()) spk_title = "SPEAKER";
          std::string fitted_title = fit_text_to_width(spk_title, 240);
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, fitted_title.c_str());

          bool is_current = (id(target_speaker_id) == id(active_speaker_entity));
          if (is_current) {
            it.print(cx, 76, id(font_small), id(theme_secondary), TextAlign::CENTER, "CURRENTLY CONTROLLING");
            bool is_remote = (id(target_speaker_id) != "${local_player_id}");
            if (is_remote) {
              draw_pill_button(110, 356, 142, 18, id(theme_secondary), id(col_dark_gray), "TRANSFER TO LOCAL", id(col_white), false);
              draw_pill_button(110, 356, 200, 18, id(theme_secondary), id(col_dark_gray), "UNJOIN AUDIO", id(col_white), false);
              draw_pill_button(110, 356, 258, 18, id(theme_secondary), id(col_dark_gray), "STOP PLAYBACK", id(col_white), false);
            } else {
              draw_pill_button(110, 356, 160, 18, id(theme_secondary), id(col_dark_gray), "UNJOIN AUDIO", id(col_white), false);
              draw_pill_button(110, 356, 230, 18, id(theme_secondary), id(col_dark_gray), "STOP PLAYBACK", id(col_white), false);
            }
          } else {
            it.print(cx, 76, id(font_small), id(col_slate), TextAlign::CENTER, "SPEAKER ACTIONS");
            draw_pill_button(110, 356, 130, 18, id(theme_secondary), id(col_dark_gray), "TRANSFER QUEUE", id(col_white), false);
            draw_pill_button(110, 356, 188, 18, id(theme_secondary), id(col_dark_gray), "CONTROL ONLY", id(col_white), false);
            draw_pill_button(110, 356, 246, 18, id(theme_secondary), id(col_dark_gray), "JOIN AUDIO", id(col_white), false);
            draw_pill_button(110, 356, 304, 18, id(theme_secondary), id(col_dark_gray), "UNJOIN / DETACH", id(col_white), false);
          }

          // Bottom Back Button (y = 408) -> Returns to Speakers Browser
          draw_back_button();
        }

      // ==========================================
      // PAGE 3: GAMES SUITE (LAUNCHER & 3 GAMES)
      // ==========================================
      } else if (id(gui_page) == 3) {
        // Read real-time accelerometer / gyroscope tilt angles
        float roll = id(imu_roll).state;
        float raw_pitch = id(imu_pitch).state;
        if (isnan(roll)) roll = 0.0f;
        if (isnan(raw_pitch)) raw_pitch = 0.0f;

        // Dynamic Tare / Auto-Zero on Game Launch:
        // Whatever angle the user is holding the device at when launching the game is calibrated as neutral flat.
        static float zero_pitch = -45.0f;
        static float zero_roll = 0.0f;

        // Clean Game Reset and Calibration on State Entry
        static int prev_game_state = 0;
        bool game_just_entered = false;
        if (id(active_game) != prev_game_state) {
          prev_game_state = id(active_game);
          game_just_entered = true;
          if (id(active_game) > 0) {
            zero_pitch = raw_pitch;
            zero_roll = roll;
          }
        }

        // Relative tilt deltas from dynamic calibrated starting posture:
        float pitch_delta = raw_pitch - zero_pitch;
        float roll_delta = roll - zero_roll;

        // ----------------------------------------------------
        // STATE 0: GAMES MENU LAUNCHER (Vertical Slot Machine Carousel)
        // ----------------------------------------------------
        if (id(active_game) == 0) {
          // Clean Capsule Drawer Lambda
          auto draw_capsule = [&](int x1, int x2, int y_mid, int r, Color border_c, Color bg_c) {
            it.filled_circle(x1, y_mid, r, border_c);
            it.filled_circle(x2, y_mid, r, border_c);
            it.filled_rectangle(x1, y_mid - r, x2 - x1, 2 * r + 1, border_c);

            it.filled_circle(x1, y_mid, r - 2, bg_c);
            it.filled_circle(x2, y_mid, r - 2, bg_c);
            it.filled_rectangle(x1, y_mid - (r - 2), x2 - x1, 2 * (r - 2) + 1, bg_c);
          };

          // Individual Game Icon Renderer (Position-Independent)
          auto draw_game_icon = [&](int g_idx, int icon_x, int icon_y) {
            if (g_idx == 0) {
              // ------------------------------------------------------------------
              // GAME 0: MARBLES
              // ------------------------------------------------------------------
              it.filled_circle(icon_x, icon_y, 52, Color(18, 24, 28));
              it.circle(icon_x, icon_y, 52, id(col_slate));
              it.circle(icon_x, icon_y, 51, id(col_slate));
              it.circle(icon_x, icon_y, 46, Color(30, 40, 48));

              it.filled_circle(icon_x, icon_y, 15, id(col_black));
              it.circle(icon_x, icon_y, 15, Color(45, 55, 65));
              it.circle(icon_x, icon_y, 14, Color(45, 55, 65));

              for (int a = 0; a < 4; a++) {
                float sa = a * 1.570796f;
                it.line(icon_x + (int)(cosf(sa) * 18.0f), icon_y + (int)(sinf(sa) * 18.0f),
                        icon_x + (int)(cosf(sa + 0.8f) * 40.0f), icon_y + (int)(sinf(sa + 0.8f) * 40.0f), Color(35, 45, 55));
              }

              auto draw_marble_3d = [&](int mx, int my, int r, Color base_c, Color hi_c) {
                it.filled_circle(mx + 2, my + 3, r, Color(10, 12, 14));
                it.filled_circle(mx, my, r, base_c);
                it.circle(mx, my, r, id(col_white));
                it.circle(mx - 1, my - 1, r - 2, hi_c);
                it.filled_circle(mx - r / 3, my - r / 3, 2, id(col_white));
              };
              draw_marble_3d(icon_x - 24, icon_y - 18, 13, id(col_red), Color(255, 138, 128));
              draw_marble_3d(icon_x + 22, icon_y - 22, 12, id(col_cyan), Color(180, 255, 255));
              draw_marble_3d(icon_x - 20, icon_y + 22, 11, id(col_green), Color(185, 246, 202));
              draw_marble_3d(icon_x + 24, icon_y + 18, 13, id(col_gold), Color(255, 245, 157));
              draw_marble_3d(icon_x + 2, icon_y - 31, 10, id(col_magenta), Color(248, 187, 208));

            } else if (g_idx == 1) {
              // ------------------------------------------------------------------
              // GAME 1: ARCHERY
              // ------------------------------------------------------------------
              it.line(icon_x - 52, icon_y - 50, icon_x - 52, icon_y + 50, id(col_silver));
              for (int i = -50; i <= 50; i++) {
                int curve = (int)(17.0f * (1.0f - ((float)i / 50.0f) * ((float)i / 50.0f)));
                int bx = icon_x - 52 + curve;
                int by = icon_y + i;
                it.draw_pixel_at(bx, by, id(col_warm_gold));
                it.draw_pixel_at(bx + 1, by, id(col_gold));
                it.draw_pixel_at(bx + 2, by, id(col_warm_gold));
              }
              it.filled_rectangle(icon_x - 36, icon_y - 8, 5, 17, id(col_slate));

              int tx = icon_x + 8, ty = icon_y;
              it.filled_circle(tx, ty, 45, id(col_white));
              it.circle(tx, ty, 45, id(col_gray));
              it.filled_circle(tx, ty, 36, Color(20, 20, 20));
              it.circle(tx, ty, 36, id(col_slate));
              it.filled_circle(tx, ty, 27, id(col_cyan));
              it.circle(tx, ty, 27, Color(0, 180, 210));
              it.filled_circle(tx, ty, 18, id(col_red));
              it.circle(tx, ty, 18, Color(180, 20, 20));
              it.filled_circle(tx, ty, 10, id(col_gold));
              it.circle(tx, ty, 10, id(col_warm_gold));
              it.filled_circle(tx, ty, 4, id(col_red));
              it.draw_pixel_at(tx, ty, id(col_white));

              it.line(icon_x - 42, icon_y + 39, tx, ty, id(col_white));
              it.line(icon_x - 41, icon_y + 40, tx + 1, ty + 1, id(col_slate));
              it.line(icon_x - 48, icon_y + 35, icon_x - 40, icon_y + 43, id(col_red));
              it.line(icon_x - 46, icon_y + 45, icon_x - 38, icon_y + 37, id(col_gold));
              it.line(tx + 4, ty - 8, tx + 8, ty - 12, id(col_gold));
              it.line(tx + 8, ty + 4, tx + 14, ty + 6, id(col_gold));
              it.line(tx - 6, ty - 8, tx - 10, ty - 12, id(col_gold));

            } else if (g_idx == 2) {
              // ------------------------------------------------------------------
              // GAME 2: BREAKOUT
              // ------------------------------------------------------------------
              int b_w = 26, b_h = 11, gap_x = 4, gap_y = 5;
              int start_bx = icon_x - (int)(2.0f * b_w + 1.5f * gap_x);
              int start_by = icon_y - 46;
              Color row_c[3] = {id(col_gold), id(col_cyan), id(col_orange)};
              Color row_hi[3] = {Color(255, 245, 157), Color(180, 255, 255), Color(255, 183, 77)};
              for (int r = 0; r < 3; r++) {
                for (int c = 0; c < 4; c++) {
                  if (r == 1 && c == 2) {
                    int bx = start_bx + c * (b_w + gap_x) + b_w / 2;
                    int by = start_by + r * (b_h + gap_y) + b_h / 2;
                    it.filled_rectangle(bx - 10, by - 6, 6, 4, row_c[r]);
                    it.filled_rectangle(bx + 4, by - 8, 5, 5, row_hi[r]);
                    it.filled_rectangle(bx - 6, by + 4, 5, 5, row_c[r]);
                    it.filled_rectangle(bx + 5, by + 3, 6, 4, row_hi[r]);
                    it.filled_circle(bx, by, 2, id(col_white));
                    continue;
                  }
                  int bx = start_bx + c * (b_w + gap_x);
                  int by = start_by + r * (b_h + gap_y);
                  it.filled_rectangle(bx, by, b_w, b_h, row_c[r]);
                  it.rectangle(bx, by, b_w, b_h, Color(20, 20, 20));
                  it.line(bx + 1, by + 1, bx + b_w - 2, by + 1, row_hi[r]);
                  it.line(bx + 1, by + 1, bx + 1, by + b_h - 2, row_hi[r]);
                }
              }

              int ball_x = icon_x + 8, ball_y = icon_y + 5;
              it.filled_circle(ball_x - 10, ball_y + 16, 3, Color(60, 50, 20));
              it.filled_circle(ball_x - 4, ball_y + 9, 4, Color(140, 110, 30));
              it.filled_circle(ball_x, ball_y, 6, id(col_gold));
              it.circle(ball_x, ball_y, 6, id(col_white));
              it.filled_circle(ball_x - 2, ball_y - 2, 2, id(col_white));

              int pad_y = icon_y + 42, pad_w = 64;
              it.filled_circle(icon_x - pad_w / 2 + 6, pad_y + 6, 6, id(theme_primary));
              it.filled_circle(icon_x + pad_w / 2 - 6, pad_y + 6, 6, id(theme_primary));
              it.filled_rectangle(icon_x - pad_w / 2 + 6, pad_y, pad_w - 12, 13, id(theme_primary));
              it.circle(icon_x - pad_w / 2 + 6, pad_y + 6, 6, id(col_white));
              it.circle(icon_x + pad_w / 2 - 6, pad_y + 6, 6, id(col_white));
              it.line(icon_x - pad_w / 2 + 6, pad_y, icon_x + pad_w / 2 - 6, pad_y, id(col_white));
              it.line(icon_x - pad_w / 2 + 6, pad_y + 12, icon_x + pad_w / 2 - 6, pad_y + 12, id(col_white));
              it.filled_rectangle(icon_x - pad_w / 2 + 16, pad_y + 4, pad_w - 32, 5, id(col_white));

            } else {
              // ------------------------------------------------------------------
              // GAME 3: CHOMP FOR KIDS
              // ------------------------------------------------------------------
              int mx = icon_x - 18, my = icon_y, mr = 42;
              it.filled_circle(mx, my, mr, id(col_cyan));
              it.filled_triangle(mx, my, mx + 48, my - 28, mx + 48, my + 28, id(col_bg));

              for (int deg = 35; deg <= 325; deg++) {
                float rad = deg * 0.0174533f;
                it.draw_pixel_at(mx + (int)(cosf(rad) * mr), my + (int)(sinf(rad) * mr), id(col_white));
                it.draw_pixel_at(mx + (int)(cosf(rad) * (mr - 1)), my + (int)(sinf(rad) * (mr - 1)), id(col_white));
              }
              int m_top_x = mx + (int)(cosf(35.0f * 0.0174533f) * mr);
              int m_top_y = my + (int)(sinf(35.0f * 0.0174533f) * mr);
              int m_bot_x = mx + (int)(cosf(325.0f * 0.0174533f) * mr);
              int m_bot_y = my + (int)(sinf(325.0f * 0.0174533f) * mr);
              it.line(mx, my, m_top_x, m_top_y, id(col_white));
              it.line(mx + 1, my, m_top_x + 1, m_top_y, id(col_white));
              it.line(mx, my, m_bot_x, m_bot_y, id(col_white));
              it.line(mx + 1, my, m_bot_x + 1, m_bot_y, id(col_white));

              it.filled_triangle(mx + 8, my - 20, mx + 17, my - 11, mx + 20, my - 22, id(col_white));
              it.filled_triangle(mx + 8, my + 20, mx + 17, my + 11, mx + 20, my + 22, id(col_white));

              int ex = mx + 2, ey = my - 20;
              it.filled_circle(ex, ey, 12, id(col_white));
              it.circle(ex, ey, 12, id(col_dark_gray));
              it.filled_circle(ex + 4, ey - 1, 6, id(col_black));
              it.filled_circle(ex + 5, ey - 2, 2, id(col_white));

              it.filled_circle(mx - 8, my + 12, 6, Color(0, 180, 200));

              int t1_x = icon_x + 24, t1_y = my - 2;
              it.filled_circle(t1_x, t1_y, 8, id(col_red));
              it.circle(t1_x, t1_y, 8, id(col_white));
              it.line(t1_x - 4, t1_y - 9, t1_x + 4, t1_y - 9, id(col_green));
              it.draw_pixel_at(t1_x, t1_y - 11, id(col_green));
              it.draw_pixel_at(t1_x - 3, t1_y - 1, id(col_gold));
              it.draw_pixel_at(t1_x + 3, t1_y - 1, id(col_gold));
              it.draw_pixel_at(t1_x, t1_y + 4, id(col_gold));

              int t2_x = icon_x + 52, t2_y = my - 22;
              it.filled_circle(t2_x, t2_y, 5, id(col_gold));
              it.circle(t2_x, t2_y, 5, id(col_white));
              it.line(t2_x, t2_y - 9, t2_x, t2_y + 9, id(col_gold));
              it.line(t2_x - 9, t2_y, t2_x + 9, t2_y, id(col_gold));

              int t3_x = icon_x + 50, t3_y = my + 22;
              it.filled_circle(t3_x, t3_y, 7, id(col_magenta));
              it.circle(t3_x, t3_y, 7, id(col_white));
              it.line(t3_x - 12, t3_y - 4, t3_x - 6, t3_y, id(col_magenta));
              it.line(t3_x - 12, t3_y + 4, t3_x - 6, t3_y, id(col_magenta));
              it.line(t3_x + 12, t3_y - 4, t3_x + 6, t3_y, id(col_magenta));
              it.line(t3_x + 12, t3_y + 4, t3_x + 6, t3_y, id(col_magenta));
            }
          };

          // Full Game Card Composite (Icon + Title + High Score)
          auto draw_game_card = [&](int g_idx, int icon_x, int icon_y, int text_center_x, int title_y, int score_y) {
            const char* title = "MARBLES";
            int score = id(high_score_marbles);
            if (g_idx == 0) {
              title = "MARBLES";
              score = id(high_score_marbles);
            } else if (g_idx == 1) {
              title = "ARCHERY";
              score = id(high_score_archery);
            } else if (g_idx == 2) {
              title = "BREAKOUT";
              score = id(high_score_breakout);
            } else {
              title = "CHOMP FOR KIDS";
              score = id(high_score_chomp);
            }

            // 1. Game Icon at (icon_x, icon_y)
            if (icon_y >= 40 && icon_y <= 380) {
              draw_game_icon(g_idx, icon_x, icon_y);
            }

            // 2. Game Title at (text_center_x, title_y)
            if (title_y >= 75 && title_y <= 275) {
              it.print(text_center_x, title_y, id(font_btn_bold), id(col_white), TextAlign::CENTER, title);
            }

            // 3. High Score at (text_center_x, score_y)
            if (score_y >= 75 && score_y <= 275) {
              char sc_buf[32];
              if (score > 0) snprintf(sc_buf, sizeof(sc_buf), "HIGH SCORE: %d", score);
              else snprintf(sc_buf, sizeof(sc_buf), "HIGH SCORE: --");
              it.print(text_center_x, score_y, id(font_small), id(col_gold), TextAlign::CENTER, sc_buf);
            }
          };

          int icon_cx = 110;
          int card_cy = 220;
          int text_cx = 285;
          int base_title_y = 200;
          int base_score_y = 240;

          static const int16_t SCROLL_EASE_174[5] = {0, 38, 95, 148, 174};

          if (id(menu_scroll_active)) {
            int step = id(menu_scroll_step);
            if (step > 4) step = 4;
            int offset = SCROLL_EASE_174[step];
            int dir = id(menu_scroll_dir);

            int out_shift = -dir * offset;
            int in_shift = dir * (174 - offset);

            int out_idx = id(game_carousel_idx);
            int in_idx = id(menu_scroll_target_page);

            draw_game_card(out_idx, icon_cx, card_cy + out_shift, text_cx, base_title_y + out_shift, base_score_y + out_shift);
            draw_game_card(in_idx, icon_cx, card_cy + in_shift, text_cx, base_title_y + in_shift, base_score_y + in_shift);
          } else {
            draw_game_card(id(game_carousel_idx), icon_cx, card_cy, text_cx, base_title_y, base_score_y);
          }

          // Top Viewport Mask (ensures pure AMOLED black behind Title)
          it.filled_rectangle(0, 0, 466, 76, id(col_bg));
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "GAMES");

          // Bottom Viewport Mask (ensures pure AMOLED black behind PLAY button)
          it.filled_rectangle(0, 280, 466, 186, id(col_bg));

          // Taller Action Button: "PLAY" at y = 352 (r = 22, height = 44px, font_btn_bold)
          draw_capsule(cx - 55, cx + 55, 352, 22, id(theme_primary), id(col_dark_gray));
          it.print(cx, 352, id(font_btn_bold), id(col_white), TextAlign::CENTER, "PLAY");

          // Right Flank Navigation Chevrons: Option 1 Vertical Chevrons (x = 415, Up at 162, Down at 278)
          // Always visible in true continuous carousel mode
          it.filled_rectangle(395, 140, 71, 160, id(col_bg));

          // Up Chevron (▲ at 415, 162)
          it.line(415 - 8, 162 + 4, 415, 162 - 4, id(theme_secondary));
          it.line(415 - 8, 162 + 5, 415, 162 - 3, id(theme_secondary));
          it.line(415 + 8, 162 + 4, 415, 162 - 4, id(theme_secondary));
          it.line(415 + 8, 162 + 5, 415, 162 - 3, id(theme_secondary));

          // Down Chevron (▼ at 415, 278)
          it.line(415 - 8, 278 - 4, 415, 278 + 4, id(theme_secondary));
          it.line(415 - 8, 278 - 3, 415, 278 + 5, id(theme_secondary));
          it.line(415 + 8, 278 - 4, 415, 278 + 4, id(theme_secondary));
          it.line(415 + 8, 278 - 3, 415, 278 + 5, id(theme_secondary));

        // ----------------------------------------------------
        // GAME 1: MARBLES (CENTER HOLE CHALLENGE)
        // ----------------------------------------------------
        } else if (id(active_game) == 1) {
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "MARBLES");

          struct SimBall {
            float x, y, vx, vy, r;
            int col_idx;
            bool sunk;
          };
          static SimBall balls[5] = {
            {233.0f - 60.0f, 233.0f - 50.0f, 0.0f, 0.0f, 20.0f, 0, false},
            {233.0f + 50.0f, 233.0f - 40.0f, 0.0f, 0.0f, 18.0f, 1, false},
            {233.0f - 45.0f, 233.0f + 60.0f, 0.0f, 0.0f, 16.0f, 2, false},
            {233.0f + 55.0f, 233.0f + 45.0f, 0.0f, 0.0f, 14.0f, 3, false},
            {233.0f + 75.0f, 233.0f, 0.0f, 0.0f, 12.0f, 4, false}
          };

          static uint32_t round_start_ms = 0;
          static uint32_t last_sink_ms = 0;
          static int game_score = 0;
          static bool round_over = false;
          static bool is_new_high = false;
          static float shockwave_r = -1.0f;
          static float shockwave_x = 233.0f;
          static float shockwave_y = 233.0f;

          // Fresh Game Reset when entering from menu
          if (game_just_entered) {
            balls[0] = {233.0f - 60.0f, 233.0f - 50.0f, 0.0f, 0.0f, 20.0f, 0, false};
            balls[1] = {233.0f + 50.0f, 233.0f - 40.0f, 0.0f, 0.0f, 18.0f, 1, false};
            balls[2] = {233.0f - 45.0f, 233.0f + 60.0f, 0.0f, 0.0f, 16.0f, 2, false};
            balls[3] = {233.0f + 55.0f, 233.0f + 45.0f, 0.0f, 0.0f, 14.0f, 3, false};
            balls[4] = {233.0f + 75.0f, 233.0f, 0.0f, 0.0f, 12.0f, 4, false};
            round_start_ms = millis();
            last_sink_ms = 0;
            game_score = 0;
            round_over = false;
            is_new_high = false;
            shockwave_r = -1.0f;
          }

          // 45-Second Round Timer
          int elapsed_sec = (int)((millis() - round_start_ms) / 1000);
          int time_remaining = 45 - elapsed_sec;
          if (time_remaining < 0) time_remaining = 0;

          // Center Hole Target with Swirling Event Horizon
          it.circle(cx, cy, 34, id(col_dark_gray));
          it.circle(cx, cy, 30, id(col_slate));
          it.circle(cx, cy, 29, id(col_white));
          it.circle(cx, cy, 28, id(col_white));
          it.filled_circle(cx, cy, 25, id(col_bg));

          // Swirling accretion streaks
          float swirl = ((millis() / 25) % 360) * (PI_F / 180.0f);
          for (int s = 0; s < 4; s++) {
            float sa = swirl + s * (PI_F * 0.5f);
            float c_sa, s_sa;
            sincosf(sa, &s_sa, &c_sa);
            it.line(cx + (int)(c_sa * 26.0f), cy + (int)(s_sa * 26.0f),
                    cx + (int)(c_sa * 32.0f), cy + (int)(s_sa * 32.0f), id(col_slate));
          }

          // Touch Scatter Impulse / Button Pop
          if (id(marble_touch_x) >= 0.0f || id(game_btn_pressed)) {
            float tx = (id(marble_touch_x) >= 0.0f) ? id(marble_touch_x) : cx;
            float ty = (id(marble_touch_y) >= 0.0f) ? id(marble_touch_y) : cy;
            id(marble_touch_x) = -1.0f;
            id(game_btn_pressed) = false;

            if (round_over) {
              balls[0] = {233.0f - 60.0f, 233.0f - 50.0f, 0.0f, 0.0f, 20.0f, 0, false};
              balls[1] = {233.0f + 50.0f, 233.0f - 40.0f, 0.0f, 0.0f, 18.0f, 1, false};
              balls[2] = {233.0f - 45.0f, 233.0f + 60.0f, 0.0f, 0.0f, 16.0f, 2, false};
              balls[3] = {233.0f + 55.0f, 233.0f + 45.0f, 0.0f, 0.0f, 14.0f, 3, false};
              balls[4] = {233.0f + 75.0f, 233.0f, 0.0f, 0.0f, 12.0f, 4, false};
              round_start_ms = millis();
              last_sink_ms = 0;
              game_score = 0;
              round_over = false;
              is_new_high = false;
              shockwave_r = -1.0f;
            } else {
              shockwave_x = tx; shockwave_y = ty; shockwave_r = 12.0f;
              for (int i = 0; i < 5; i++) {
                if (balls[i].sunk) continue;
                float tdx = balls[i].x - tx;
                float tdy = balls[i].y - ty;
                float tdist = sqrtf(tdx * tdx + tdy * tdy);
                if (tdist < 22.0f) {
                  float rnd_angle = ((float)(i * 72 + (millis() % 360))) * (PI_F / 180.0f);
                  float s_rnd, c_rnd;
                  sincosf(rnd_angle, &s_rnd, &c_rnd);
                  balls[i].vx += c_rnd * 650.0f;
                  balls[i].vy += s_rnd * 650.0f;
                } else {
                  float blast = 500.0f + (700.0f / (tdist * 0.08f + 1.0f));
                  if (blast > 800.0f) blast = 800.0f;
                  balls[i].vx += (tdx / tdist) * blast;
                  balls[i].vy += (tdy / tdist) * blast;
                }
              }
            }
          }

          if (shockwave_r >= 0.0f) {
            it.circle((int)shockwave_x, (int)shockwave_y, (int)shockwave_r, id(col_gold));
            it.circle((int)shockwave_x, (int)shockwave_y, (int)shockwave_r + 2, id(col_cyan));
            shockwave_r += 26.0f;
            if (shockwave_r > 190.0f) shockwave_r = -1.0f;
          }

          const float dt = 0.05f;
          const float friction = 0.985f;
          const float bounce = 0.82f;
          const float arena_r = 208.0f;

          float ax = roll_delta * 30.0f;
          float ay = -pitch_delta * 30.0f;
          if (ax > 650.0f) ax = 650.0f; if (ax < -650.0f) ax = -650.0f;
          if (ay > 650.0f) ay = 650.0f; if (ay < -650.0f) ay = -650.0f;

          int sunk_count = 0;
          if (!round_over) {
            for (int i = 0; i < 5; i++) {
              if (balls[i].sunk) { sunk_count++; continue; }

              float dx = balls[i].x - cx;
              float dy = balls[i].y - cy;
              float dist_hole = sqrtf(dx * dx + dy * dy);

              if (dist_hole < 25.0f) {
                balls[i].sunk = true;
                balls[i].x = -999.0f;
                balls[i].y = -999.0f;
                balls[i].vx = 0.0f;
                balls[i].vy = 0.0f;
                sunk_count++;

                int pts = 200;
                if (last_sink_ms > 0 && (millis() - last_sink_ms < 3500)) {
                  pts += 150;
                }
                last_sink_ms = millis();
                game_score += pts;
                continue;
              }

              if (dist_hole < 65.0f && dist_hole >= 25.0f) {
                float vortex = (65.0f - dist_hole) * 10.0f;
                balls[i].vx -= (dx / dist_hole) * vortex * dt;
                balls[i].vy -= (dy / dist_hole) * vortex * dt;
              }

              balls[i].vx = (balls[i].vx + ax * dt) * friction;
              balls[i].vy = (balls[i].vy + ay * dt) * friction;
              balls[i].x += balls[i].vx * dt;
              balls[i].y += balls[i].vy * dt;

              float cur_dx = balls[i].x - cx;
              float cur_dy = balls[i].y - cy;
              float cur_dist = sqrtf(cur_dx * cur_dx + cur_dy * cur_dy);
              float max_dist = arena_r - balls[i].r;
              if (cur_dist > max_dist && cur_dist > 0.001f) {
                float nx = cur_dx / cur_dist;
                float ny = cur_dy / cur_dist;
                balls[i].x = cx + nx * max_dist;
                balls[i].y = cy + ny * max_dist;
                float v_dot_n = balls[i].vx * nx + balls[i].vy * ny;
                if (v_dot_n > 0.0f) {
                  balls[i].vx -= (1.0f + bounce) * v_dot_n * nx;
                  balls[i].vy -= (1.0f + bounce) * v_dot_n * ny;
                }
              }
            }

            for (int i = 0; i < 5; i++) {
              if (balls[i].sunk) continue;
              for (int j = i + 1; j < 5; j++) {
                if (balls[j].sunk) continue;
                float cdx = balls[j].x - balls[i].x;
                float cdy = balls[j].y - balls[i].y;
                float cdist = sqrtf(cdx * cdx + cdy * cdy);
                float min_dist = balls[i].r + balls[j].r;
                if (cdist < min_dist && cdist > 0.001f) {
                  float overlap = min_dist - cdist;
                  float cnx = cdx / cdist; float cny = cdy / cdist;
                  balls[i].x -= cnx * overlap * 0.5f; balls[i].y -= cny * overlap * 0.5f;
                  balls[j].x += cnx * overlap * 0.5f; balls[j].y += cny * overlap * 0.5f;
                  float kx = balls[i].vx - balls[j].vx;
                  float ky = balls[i].vy - balls[j].vy;
                  float p = cnx * kx + cny * ky;
                  balls[i].vx -= p * cnx * bounce;
                  balls[i].vy -= p * cny * bounce;
                  balls[j].vx += p * cnx * bounce;
                  balls[j].vy += p * cny * bounce;
                }
              }
            }

            if (sunk_count >= 5 || time_remaining <= 0) {
              round_over = true;
              if (sunk_count >= 5) {
                game_score += time_remaining * 35;
              }
              if (game_score > id(high_score_marbles)) {
                id(high_score_marbles) = game_score;
                is_new_high = true;
              }
            }
          } else {
            for (int i = 0; i < 5; i++) { if (balls[i].sunk) sunk_count++; }
          }

          Color cols[5] = {id(col_gold), id(col_cyan), id(col_green), id(col_red), id(col_orange)};
          for (int i = 0; i < 5; i++) {
            if (balls[i].sunk) continue;
            int bx = (int)balls[i].x; int by = (int)balls[i].y; int br = (int)balls[i].r;

            // Glass shader: drop shadow
            int sh_x = (int)(ax * 0.012f);
            int sh_y = (int)(ay * 0.012f);
            it.filled_circle(bx + sh_x, by + sh_y, br, id(col_dark_gray));

            // Sphere body
            it.filled_circle(bx, by, br, cols[balls[i].col_idx]);

            // Spherical rim
            it.circle(bx, by, br, id(col_bg));
            it.circle(bx, by, br - 1, id(col_dark_gray));

            // Specular glint
            it.filled_circle(bx - (br / 3), by - (br / 3), (br / 3), id(col_white));

            // Ambient bounce crescent
            it.filled_circle(bx + (br / 4), by + (br / 4), (br / 5), id(col_white));
          }

          char hud_buf[48];
          snprintf(hud_buf, sizeof(hud_buf), "Sunk: %d/5  •  %ds  •  %d", sunk_count, time_remaining, game_score);
          it.print(cx, 84, id(font_small), time_remaining < 10 ? id(col_red) : id(col_gold), TextAlign::CENTER, hud_buf);

          if (round_over) {
            it.filled_circle(cx, cy, 115, id(col_bg));
            it.circle(cx, cy, 115, is_new_high ? id(col_gold) : id(theme_secondary));
            it.circle(cx, cy, 113, is_new_high ? id(col_gold) : id(theme_secondary));

            if (is_new_high) {
              it.print(cx, 160, id(font_date), id(col_gold), TextAlign::CENTER, "NEW HIGH SCORE!");
            } else if (sunk_count >= 5) {
              it.print(cx, 160, id(font_date), id(col_cyan), TextAlign::CENTER, "ALL SUNK!");
            } else {
              it.print(cx, 160, id(font_date), id(col_red), TextAlign::CENTER, "TIME'S UP!");
            }

            char score_str[32];
            snprintf(score_str, sizeof(score_str), "Score: %d", game_score);
            it.print(cx, 202, id(font_date), id(col_white), TextAlign::CENTER, score_str);

            char best_str[32];
            snprintf(best_str, sizeof(best_str), "Best: %d", id(high_score_marbles));
            it.print(cx, 235, id(font_small), id(col_gold), TextAlign::CENTER, best_str);

            it.print(cx, 275, id(font_small), id(col_cyan), TextAlign::CENTER, "[ TAP TO REPLAY ]");
          }

          it.print(cx, 385, id(font_small), id(col_slate), TextAlign::CENTER, "Roll to Center Hole • Tap Pop");
          it.print(cx, 408, id(font_small), id(col_gray), TextAlign::CENTER, "[ Click Top to Exit ]");

        // ----------------------------------------------------
        // GAME 2: ARCHERY (TILT AIM & TARGET PRACTICE)
        // ----------------------------------------------------
        } else if (id(active_game) == 2) {
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "ARCHERY");

          static int arch_score = 0;
          static int arrows_left = 10;
          static float target_x = 233.0f;
          static float target_y = 165.0f;
          static float target_step = 0.0f;
          static float arrow_x = -1.0f;
          static float arrow_y = -1.0f;
          static float arrow_vx = 0.0f;
          static float arrow_vy = 0.0f;
          static float wind_speed = 0.0f;
          static std::string hit_feedback = "";
          static uint32_t feedback_timer = 0;
          static bool round_over = false;
          static bool is_new_high = false;

          if (game_just_entered) {
            arch_score = 0;
            arrows_left = 10;
            arrow_y = -1.0f;
            wind_speed = 0.0f;
            hit_feedback = "";
            round_over = false;
            is_new_high = false;
          }

          // Dynamic 2D Swaying Target (Horizontal sweep ±95px, vertical bobbing ±26px)
          target_step += 0.04f;
          target_x = cx + sinf(target_step) * 95.0f;
          target_y = 165.0f + cosf(target_step * 1.4f) * 26.0f;

          // 3D Shaded Target Rings with Drop Shadow (Balanced tournament radii: 34, 25, 18, 11, 5.5)
          it.filled_circle((int)target_x, (int)target_y + 3, 34, id(col_dark_gray));
          it.filled_circle((int)target_x, (int)target_y, 34, id(col_white));
          it.circle((int)target_x, (int)target_y, 34, id(col_dark_gray));
          it.filled_circle((int)target_x, (int)target_y, 25, id(col_black));
          it.circle((int)target_x, (int)target_y, 25, id(col_slate));
          it.filled_circle((int)target_x, (int)target_y, 18, id(col_cyan));
          it.filled_circle((int)target_x, (int)target_y, 11, id(col_red));
          it.filled_circle((int)target_x, (int)target_y, 5, id(col_gold));

          // Player Aim Reticle
          float ax = cx + roll_delta * 6.5f;
          float ay = 165.0f - pitch_delta * 6.5f;
          if (ax < 65.0f) ax = 65.0f; if (ax > 401.0f) ax = 401.0f;
          if (ay < 65.0f) ay = 65.0f; if (ay > 370.0f) ay = 370.0f;

          // Gentle Crosswind: Drifts smoothly between -5.5 and +5.5 mph (fair & skill-based)
          wind_speed = sinf((float)millis() * 0.0006f) * 5.5f;

          // Shoot Trigger (Button or Tap)
          if (id(game_btn_pressed) || id(marble_touch_x) >= 0.0f) {
            id(game_btn_pressed) = false;
            id(marble_touch_x) = -1.0f;

            if (round_over) {
              arch_score = 0;
              arrows_left = 10;
              arrow_y = -1.0f;
              hit_feedback = "";
              round_over = false;
              is_new_high = false;
            } else if (arrow_y < 0.0f && arrows_left > 0) {
              arrow_x = cx;
              arrow_y = 370.0f;
              // Aim vector towards player reticle + initial trajectory
              float launch_dx = ax - cx;
              float launch_dy = ay - 370.0f;
              float launch_len = sqrtf(launch_dx * launch_dx + launch_dy * launch_dy);
              float speed = 380.0f; // Flight speed in px/s
              arrow_vx = (launch_dx / launch_len) * speed;
              arrow_vy = (launch_dy / launch_len) * speed;
              arrows_left--;
            }
          }

          // In-Flight Arrow Physics with Balanced Wind Drift & Faux-3D Scaling
          if (arrow_y >= 0.0f) {
            const float dt_arrow = 0.05f;
            // Crosswind deflects the arrow with calibrated gentle force (7.5x instead of 16x)
            arrow_vx += wind_speed * 7.5f * dt_arrow;
            arrow_x += arrow_vx * dt_arrow;
            arrow_y += arrow_vy * dt_arrow;

            float progress = (370.0f - arrow_y) / 205.0f;
            if (progress < 0.0f) progress = 0.0f; if (progress > 1.0f) progress = 1.0f;
            int arrow_len = (int)(22.0f - progress * 11.0f);

            it.line((int)arrow_x, (int)arrow_y, (int)arrow_x, (int)(arrow_y + arrow_len), id(col_gold));
            it.filled_circle((int)arrow_x, (int)arrow_y, progress > 0.6f ? 2 : 3, id(col_white));

            // Check if arrow has reached the target plane y
            if (arrow_y <= target_y + 6.0f) {
              float dist_hit = sqrtf((arrow_x - target_x) * (arrow_x - target_x) +
                                     (arrow_y - target_y) * (arrow_y - target_y));
              if (dist_hit <= 5.5f) {
                hit_feedback = "BULLSEYE! +10"; arch_score += 10;
              } else if (dist_hit <= 11.0f) {
                hit_feedback = "RED RING! +7"; arch_score += 7;
              } else if (dist_hit <= 18.0f) {
                hit_feedback = "BLUE RING! +5"; arch_score += 5;
              } else if (dist_hit <= 25.0f) {
                hit_feedback = "BLACK RING! +3"; arch_score += 3;
              } else if (dist_hit <= 34.0f) {
                hit_feedback = "WHITE! +1"; arch_score += 1;
              } else {
                hit_feedback = "MISS!";
              }
              feedback_timer = millis();
              arrow_y = -1.0f;

              if (arrows_left <= 0) {
                round_over = true;
                if (arch_score > id(high_score_archery)) {
                  id(high_score_archery) = arch_score;
                  is_new_high = true;
                }
              }
            }
          }

          it.circle((int)ax, (int)ay, 14, id(col_cyan));
          it.line((int)ax - 18, (int)ay, (int)ax + 18, (int)ay, id(col_cyan));
          it.line((int)ax, (int)ay - 18, (int)ax, (int)ay + 18, id(col_cyan));

          char wind_buf[32];
          if (fabsf(wind_speed) < 1.2f) {
            snprintf(wind_buf, sizeof(wind_buf), "WIND: CALM");
          } else if (wind_speed > 0) {
            snprintf(wind_buf, sizeof(wind_buf), "WIND: %.0f >", wind_speed);
          } else {
            snprintf(wind_buf, sizeof(wind_buf), "< WIND: %.0f", -wind_speed);
          }

          char hud_buf[48];
          snprintf(hud_buf, sizeof(hud_buf), "Arrows: %d/10  •  %s  •  %d", arrows_left, wind_buf, arch_score);
          it.print(cx, 84, id(font_small), id(col_gold), TextAlign::CENTER, hud_buf);

          if (!hit_feedback.empty() && (millis() - feedback_timer < 1400) && !round_over) {
            it.print(cx, 260, id(font_date), id(col_gold), TextAlign::CENTER, hit_feedback.c_str());
          }

          if (round_over) {
            it.filled_circle(cx, cy, 115, id(col_bg));
            it.circle(cx, cy, 115, is_new_high ? id(col_gold) : id(theme_secondary));
            it.circle(cx, cy, 113, is_new_high ? id(col_gold) : id(theme_secondary));

            if (is_new_high) {
              it.print(cx, 160, id(font_date), id(col_gold), TextAlign::CENTER, "NEW HIGH SCORE!");
            } else {
              it.print(cx, 160, id(font_date), id(col_cyan), TextAlign::CENTER, "MATCH COMPLETE");
            }

            char score_str[32];
            snprintf(score_str, sizeof(score_str), "Score: %d / 100", arch_score);
            it.print(cx, 202, id(font_date), id(col_white), TextAlign::CENTER, score_str);

            char best_str[32];
            snprintf(best_str, sizeof(best_str), "Best: %d", id(high_score_archery));
            it.print(cx, 235, id(font_small), id(col_gold), TextAlign::CENTER, best_str);

            it.print(cx, 275, id(font_small), id(col_cyan), TextAlign::CENTER, "[ TAP TO REPLAY ]");
          }

          it.print(cx, 385, id(font_small), id(col_slate), TextAlign::CENTER, "Tilt Aim • Tap Screen to Fire");
          it.print(cx, 408, id(font_small), id(col_gray), TextAlign::CENTER, "[ Click Top to Exit ]");

        // ----------------------------------------------------
        // ----------------------------------------------------
        // GAME 3: BREAKOUT (CIRCULAR ARC PADDLE & BRICK BREAKER)
        // ----------------------------------------------------
        } else if (id(active_game) == 3) {
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "BREAKOUT");

          struct BreakoutBrick {
            int x, y, w, h;
            int row;
            bool alive;
          };
          static BreakoutBrick bricks[12] = {
            // Row 0: Gold (150 pts)
            {140, 125, 38, 14, 0, true}, {190, 125, 38, 14, 0, true}, {240, 125, 38, 14, 0, true}, {290, 125, 38, 14, 0, true},
            // Row 1: Cyan (100 pts)
            {140, 150, 38, 14, 1, true}, {190, 150, 38, 14, 1, true}, {240, 150, 38, 14, 1, true}, {290, 150, 38, 14, 1, true},
            // Row 2: Orange (50 pts)
            {140, 175, 38, 14, 2, true}, {190, 175, 38, 14, 2, true}, {240, 175, 38, 14, 2, true}, {290, 175, 38, 14, 2, true}
          };

          static float ball_x = cx;
          static float ball_y = 345.0f;
          static float ball_vx = 0.0f;
          static float ball_vy = 0.0f;
          static bool ball_launched = false;
          static int lives_left = 3;
          static int bo_score = 0;
          static bool round_over = false;
          static bool is_new_high = false;
          static uint32_t bo_spark_timer = 0;
          static int bo_spark_x = -1;
          static int bo_spark_y = -1;

          static float smooth_paddle_x = 233.0f;

          if (game_just_entered) {
            for (int b = 0; b < 12; b++) bricks[b].alive = true;
            ball_x = cx; ball_y = 345.0f;
            ball_vx = 0.0f; ball_vy = 0.0f;
            ball_launched = false;
            lives_left = 3;
            bo_score = 0;
            round_over = false;
            is_new_high = false;
            bo_spark_x = -1;
            smooth_paddle_x = cx;
          }

          // Paddle Physics: Exponential Moving Average (EMA) smoothing eliminates raw IMU jitter and jerking
          float raw_target_x = cx + roll_delta * 8.2f;
          if (raw_target_x < 65.0f) raw_target_x = 65.0f;
          if (raw_target_x > 401.0f) raw_target_x = 401.0f;

          // 32% lerp per 50ms frame produces butter-smooth glide with zero lag
          smooth_paddle_x += (raw_target_x - smooth_paddle_x) * 0.32f;
          float paddle_x = smooth_paddle_x;
          int paddle_y = 356;
          int paddle_w = 58;
          int paddle_h = 10;

          // Touch Trigger: Launch Ball or Replay
          if (id(marble_touch_x) >= 0.0f || id(game_btn_pressed)) {
            id(marble_touch_x) = -1.0f;
            id(game_btn_pressed) = false;

            if (round_over) {
              for (int b = 0; b < 12; b++) bricks[b].alive = true;
              ball_x = cx; ball_y = 345.0f;
              ball_vx = 0.0f; ball_vy = 0.0f;
              ball_launched = false;
              lives_left = 3;
              bo_score = 0;
              round_over = false;
              is_new_high = false;
            } else if (!ball_launched) {
              // Launch ball upward angled by tilt
              ball_vx = roll_delta * 5.0f;
              if (fabsf(ball_vx) < 30.0f) ball_vx = 45.0f;
              ball_vy = -175.0f;
              ball_launched = true;
            }
          }

          const float dt_bo = 0.05f;
          int bricks_remaining = 0;
          for (int b = 0; b < 12; b++) { if (bricks[b].alive) bricks_remaining++; }

          if (!round_over) {
            if (!ball_launched) {
              // Ball rests on paddle
              ball_x = paddle_x;
              ball_y = paddle_y - 10.0f;
            } else {
              ball_x += ball_vx * dt_bo;
              ball_y += ball_vy * dt_bo;

              // Circular Arena Boundary Reflection (r = 208px)
              float b_dx = ball_x - cx;
              float b_dy = ball_y - cy;
              float b_dist = sqrtf(b_dx * b_dx + b_dy * b_dy);
              if (b_dist > 203.0f && ball_y < 355.0f) {
                float bnx = b_dx / b_dist;
                float bny = b_dy / b_dist;
                float v_dot = ball_vx * bnx + ball_vy * bny;
                if (v_dot > 0.0f) {
                  ball_vx -= 2.0f * v_dot * bnx;
                  ball_vy -= 2.0f * v_dot * bny;
                }
              }

              // Paddle Reflection
              if (ball_y >= (float)(paddle_y - 8) && ball_y <= (float)(paddle_y + 6) && ball_vy > 0.0f) {
                if (fabsf(ball_x - paddle_x) <= (paddle_w * 0.55f)) {
                  float offset = (ball_x - paddle_x) / (paddle_w * 0.5f);
                  ball_vx = offset * 210.0f;
                  ball_vy = -180.0f;
                  bo_spark_x = (int)ball_x; bo_spark_y = (int)ball_y; bo_spark_timer = millis();
                }
              }

              // Brick Collisions
              for (int b = 0; b < 12; b++) {
                if (!bricks[b].alive) continue;
                if (fabsf(ball_x - (float)bricks[b].x) < (float)(bricks[b].w / 2 + 5) &&
                    fabsf(ball_y - (float)bricks[b].y) < (float)(bricks[b].h / 2 + 5)) {
                  bricks[b].alive = false;
                  ball_vy = -ball_vy;
                  int pts = (bricks[b].row == 0 ? 150 : (bricks[b].row == 1 ? 100 : 50));
                  bo_score += pts;
                  bo_spark_x = bricks[b].x; bo_spark_y = bricks[b].y; bo_spark_timer = millis();
                  break;
                }
              }

              // Ball Lost Below Paddle Gate
              if (ball_y > 390.0f) {
                lives_left--;
                ball_launched = false;
                if (lives_left <= 0) {
                  round_over = true;
                  if (bo_score > id(high_score_breakout)) {
                    id(high_score_breakout) = bo_score;
                    is_new_high = true;
                  }
                }
              }

              // Win Condition: All Bricks Cleared
              if (bricks_remaining == 0) {
                round_over = true;
                bo_score += lives_left * 250; // Lives bonus
                if (bo_score > id(high_score_breakout)) {
                  id(high_score_breakout) = bo_score;
                  is_new_high = true;
                }
              }
            }
          }

          // Draw Bricks
          Color row_cols[3] = {id(col_gold), id(col_cyan), id(col_orange)};
          for (int b = 0; b < 12; b++) {
            if (!bricks[b].alive) continue;
            int rx = bricks[b].x - (bricks[b].w / 2);
            int ry = bricks[b].y - (bricks[b].h / 2);
            it.filled_rectangle(rx, ry, bricks[b].w, bricks[b].h, row_cols[bricks[b].row]);
            it.rectangle(rx, ry, bricks[b].w, bricks[b].h, id(col_white));
          }

          // Draw Paddle (Rounded Capsule in Theme Primary with White Core)
          it.filled_circle((int)(paddle_x - (paddle_w / 2) + 5), paddle_y, 5, id(theme_primary));
          it.filled_circle((int)(paddle_x + (paddle_w / 2) - 5), paddle_y, 5, id(theme_primary));
          it.filled_rectangle((int)(paddle_x - (paddle_w / 2) + 5), paddle_y - 5, paddle_w - 10, 10, id(theme_primary));
          it.rectangle((int)(paddle_x - (paddle_w / 2) + 5), paddle_y - 5, paddle_w - 10, 10, id(col_white));

          // Draw Ball
          it.filled_circle((int)ball_x, (int)ball_y, 6, id(col_gold));
          it.filled_circle((int)ball_x, (int)ball_y, 3, id(col_white));

          // Brick Impact Sparkle
          if (bo_spark_x >= 0 && (millis() - bo_spark_timer < 300)) {
            it.circle(bo_spark_x, bo_spark_y, 8, id(col_white));
            it.circle(bo_spark_x, bo_spark_y, 14, id(col_gold));
          }

          // Top HUD: Balls Left • Bricks Left • Score
          char bo_hud[48];
          snprintf(bo_hud, sizeof(bo_hud), "Balls: %d/3  •  Bricks: %d  •  %d", lives_left, bricks_remaining, bo_score);
          it.print(cx, 84, id(font_small), id(col_gold), TextAlign::CENTER, bo_hud);

          // Game Over Scoreboard Overlay
          if (round_over) {
            it.filled_circle(cx, cy, 115, id(col_bg));
            it.circle(cx, cy, 115, is_new_high ? id(col_gold) : id(theme_secondary));
            it.circle(cx, cy, 113, is_new_high ? id(col_gold) : id(theme_secondary));

            if (is_new_high) {
              it.print(cx, 160, id(font_date), id(col_gold), TextAlign::CENTER, "NEW HIGH SCORE!");
            } else if (bricks_remaining == 0) {
              it.print(cx, 160, id(font_date), id(col_cyan), TextAlign::CENTER, "ALL CLEARED!");
            } else {
              it.print(cx, 160, id(font_date), id(col_red), TextAlign::CENTER, "GAME OVER");
            }

            char score_str[32];
            snprintf(score_str, sizeof(score_str), "Score: %d", bo_score);
            it.print(cx, 202, id(font_date), id(col_white), TextAlign::CENTER, score_str);

            char best_str[32];
            snprintf(best_str, sizeof(best_str), "Best: %d", id(high_score_breakout));
            it.print(cx, 235, id(font_small), id(col_gold), TextAlign::CENTER, best_str);

            it.print(cx, 275, id(font_small), id(col_cyan), TextAlign::CENTER, "[ TAP TO REPLAY ]");
          } else if (!ball_launched) {
            it.print(cx, 260, id(font_small), id(col_cyan), TextAlign::CENTER, "[ Tap Screen to Launch ]");
          }

          it.print(cx, 385, id(font_small), id(col_slate), TextAlign::CENTER, "Tilt to Steer Paddle • Bounce Ball");
          it.print(cx, 408, id(font_small), id(col_gray), TextAlign::CENTER, "[ Click Top to Exit ]");

        // GAME 4: CHOMP (Kids) (FEED THE HUNGRY MONSTER)
        // ----------------------------------------------------
        } else {
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "CHOMP FOR KIDS");

          static int treat_score = 0;
          static float treat_x = cx + 60.0f;
          static float treat_y = cy - 60.0f;
          static float treat_vx = 0.0f;
          static float treat_vy = 0.0f;
          static uint32_t chomp_timer = 0;
          static int treat_color_idx = 0;

          if (game_just_entered) {
            treat_score = 0;
            treat_x = cx + 60.0f;
            treat_y = cy - 60.0f;
            treat_vx = 0.0f;
            treat_vy = 0.0f;
            chomp_timer = 0;
          }

          if (id(marble_touch_x) >= 0.0f || id(game_btn_pressed)) {
            id(marble_touch_x) = -1.0f;
            id(game_btn_pressed) = false;
            treat_vx += (treat_x > cx ? 160.0f : -160.0f);
            treat_vy -= 220.0f;
          }

          const float dt = 0.05f;
          float ax = roll_delta * 28.0f;
          float ay = -pitch_delta * 28.0f;
          if (ax > 650.0f) ax = 650.0f; if (ax < -650.0f) ax = -650.0f;
          if (ay > 650.0f) ay = 650.0f; if (ay < -650.0f) ay = -650.0f;

          treat_vx = (treat_vx + ax * dt) * 0.98f;
          treat_vy = (treat_vy + ay * dt) * 0.98f;
          treat_x += treat_vx * dt;
          treat_y += treat_vy * dt;

          float t_dx = treat_x - cx;
          float t_dy = treat_y - cy;
          float t_dist = sqrtf(t_dx * t_dx + t_dy * t_dy);
          float max_t_dist = 208.0f - 14.0f;
          if (t_dist > max_t_dist && t_dist > 0.001f) {
            float nx = t_dx / t_dist; float ny = t_dy / t_dist;
            treat_x = cx + nx * max_t_dist;
            treat_y = cy + ny * max_t_dist;
            float v_dot_n = treat_vx * nx + treat_vy * ny;
            if (v_dot_n > 0.0f) {
              treat_vx -= 1.8f * v_dot_n * nx;
              treat_vy -= 1.8f * v_dot_n * ny;
            }
          }

          float dist_to_mouth = sqrtf((treat_x - cx) * (treat_x - cx) + (treat_y - cy) * (treat_y - cy));
          bool mouth_open = (dist_to_mouth < 85.0f);

          if (dist_to_mouth < 24.0f) {
            treat_score++;
            chomp_timer = millis();
            if (treat_score > id(high_score_chomp)) {
              id(high_score_chomp) = treat_score;
            }
            treat_color_idx = (treat_color_idx + 1) % 4;
            float spawn_angle = ((treat_score * 77) % 360) * (PI_F / 180.0f);
            float s_sp, c_sp;
            sincosf(spawn_angle, &s_sp, &c_sp);
            treat_x = cx + s_sp * 160.0f;
            treat_y = cy - c_sp * 160.0f;
            treat_vx = 0.0f; treat_vy = 0.0f;
          }

          bool is_chomping = (millis() - chomp_timer < 500);

          it.filled_circle(cx, cy + 3, 34, id(col_dark_gray));
          it.filled_circle(cx, cy, 34, id(col_light_blue));
          it.circle(cx, cy, 34, id(col_white));

          float eye_dx = (treat_x - cx) / (dist_to_mouth + 1.0f) * 4.0f;
          float eye_dy = (treat_y - cy) / (dist_to_mouth + 1.0f) * 4.0f;
          it.filled_circle(cx - 11, cy - 10, 8, id(col_white));
          it.filled_circle(cx + 11, cy - 10, 8, id(col_white));
          it.filled_circle(cx - 11 + (int)eye_dx, cy - 10 + (int)eye_dy, 4, id(col_dark_gray));
          it.filled_circle(cx + 11 + (int)eye_dx, cy - 10 + (int)eye_dy, 4, id(col_dark_gray));

          if (is_chomping) {
            it.line(cx - 16, cy + 12, cx, cy + 19, id(col_white));
            it.line(cx, cy + 19, cx + 16, cy + 12, id(col_white));
            it.print(cx, 160, id(font_date), id(col_gold), TextAlign::CENTER, "CHOMP! *");
            it.filled_circle(cx - 18, cy + 8, 2, id(col_gold));
            it.filled_circle(cx + 18, cy + 8, 2, id(col_cyan));
            it.filled_circle(cx, cy + 26, 2, id(col_orange));
          } else if (mouth_open) {
            it.filled_circle(cx, cy + 12, 14, id(col_red));
            it.circle(cx, cy + 12, 14, id(col_white));
            it.line(cx - 6, cy + 2, cx - 3, cy + 7, id(col_white));
            it.line(cx - 3, cy + 7, cx, cy + 2, id(col_white));
            it.line(cx, cy + 2, cx + 3, cy + 7, id(col_white));
            it.line(cx + 3, cy + 7, cx + 6, cy + 2, id(col_white));
          } else {
            it.line(cx - 12, cy + 12, cx, cy + 17, id(col_dark_gray));
            it.line(cx, cy + 17, cx + 12, cy + 12, id(col_dark_gray));
          }

          Color t_cols[4] = {id(col_red), id(col_gold), id(col_cyan), id(col_orange)};
          it.filled_circle((int)treat_x, (int)treat_y, 14, t_cols[treat_color_idx]);
          it.circle((int)treat_x, (int)treat_y, 14, id(col_white));
          it.filled_circle((int)treat_x - 4, (int)treat_y - 4, 4, id(col_white));

          char t_buf[48];
          snprintf(t_buf, sizeof(t_buf), "Treats: %d  •  Best: %d", treat_score, id(high_score_chomp));
          it.print(cx, 84, id(font_small), id(col_gold), TextAlign::CENTER, t_buf);

          it.print(cx, 385, id(font_small), id(col_slate), TextAlign::CENTER, "Tilt to Roll Treat into Mouth");
          it.print(cx, 408, id(font_small), id(col_gray), TextAlign::CENTER, "[ Click Top to Exit ]");
        }
      // ==========================================
      // PAGE 4: SYSTEM (STATUS & CONTROLS - RUST HIGHLIGHT)
      // ==========================================
      } else if (id(gui_page) == 4) {
        char buf[64];

        if (id(system_menu_mode) == 0) {
          // --------------------------------------------------
          // VIEW 0: MAIN SYSTEM OBSERVATIONAL DASHBOARD (2x3 Grid)
          // --------------------------------------------------
          // Top Header: Pure iconic "SYSTEM" title (Theme Primary, standardized at y=50)
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "SYSTEM");

          // Upper Zone: Pocket Assistant Version / Update badge (elevated to y=86 for comfortable 36px title buffer)
          bool has_update = id(ha_firmware_update_status).state == "ON";
          std::string lat_v = id(ha_firmware_latest_version).state;
          if (has_update) {
            snprintf(buf, sizeof(buf), "Update Ready: v%s >", lat_v.empty() ? "3.6.x" : lat_v.c_str());
            it.print(cx, 86, id(font_small), id(col_gold), TextAlign::CENTER, buf);
          } else {
            it.print(cx, 86, id(font_small), id(col_white), TextAlign::CENTER, "Pocket Assistant v${version}");
          }

          // Center Zone: Buffered 2x3 Grid with Standardized Pill Height (r = 20) & 24px Center Gap
          // Center Zone: Buffered 2x3 Grid centered across horizon (y = 150, 210, 270)
          // Row 1: Display > (Left: x 69..221) | Clock > (Right: x 245..397) at y = 150
          draw_pill_button(89, 201, 150, 20, id(theme_secondary), id(col_dark_gray), "Display >", id(col_white), false);
          draw_pill_button(265, 377, 150, 20, id(theme_secondary), id(col_dark_gray), "Clock >", id(col_white), false);

          // Row 2: Sleep & Wake > (Left: x 69..221) | Audio > (Right: x 245..397) at y = 210 (Screen Horizon)
          draw_pill_button(89, 201, 210, 20, id(theme_secondary), id(col_dark_gray), "Sleep & Wake >", id(col_white), false);
          draw_pill_button(265, 377, 210, 20, id(theme_secondary), id(col_dark_gray), "Audio >", id(col_white), false);

          // Row 3: Actions > (Left: x 69..221) | Info > (Right: x 245..397) at y = 270
          draw_pill_button(89, 201, 270, 20, id(theme_secondary), id(col_dark_gray), "Actions >", id(col_white), false);
          draw_pill_button(265, 377, 270, 20, id(theme_secondary), id(col_dark_gray), "Info >", id(col_white), false);

          // Lower Zone: Battery and Time (y = 333, y = 374 - vertically centered at y=333)
          char b_main[32];
          snprintf(b_main, sizeof(b_main), "Battery: %.0f%%", batt);
          if (id(batt_charging).state) {
            const char *chg_str = " • Charging";
            int w_main = 0, w_chg = 0, x_off = 0, base = 0, text_h = 0;
            id(font_small)->measure(b_main, &w_main, &x_off, &base, &text_h);
            id(font_small)->measure(chg_str, &w_chg, &x_off, &base, &text_h);
            int total_w = w_main + w_chg;
            int start_x = cx - total_w / 2;
            it.print(start_x, 333, id(font_small), id(theme_primary), TextAlign::CENTER_LEFT, b_main);
            it.print(start_x + w_main, 333, id(font_small), id(theme_secondary), TextAlign::CENTER_LEFT, chg_str);
          } else {
            it.print(cx, 333, id(font_small), id(theme_primary), TextAlign::CENTER, b_main);
          }

          if (now.is_valid()) {
            char t_buf[16];
            if (id(is_24h_format)) {
              snprintf(t_buf, sizeof(t_buf), "%02d:%02d", now.hour, now.minute);
            } else {
              int h12 = now.hour % 12;
              if (h12 == 0) h12 = 12;
              snprintf(t_buf, sizeof(t_buf), "%d:%02d %s", h12, now.minute, now.hour >= 12 ? "PM" : "AM");
            }
            it.print(cx, 374, id(font_date), id(col_white), TextAlign::CENTER, t_buf);
          }

        } else if (id(system_menu_mode) == 1) {
          // --------------------------------------------------
          // VIEW 1: SLEEP & WAKE SUBMENU (Continuous 8-Item Vertical Scroll Architecture)
          // Standard title at y = 50, Slots 1-5 at y = 104, 162, 220, 278, 336, < BACK at y = 408, Dots at y = 440
          // Model A: 4-Step Eased 174px (3-Pill) High-Cadence Snap-Slide Animation (~125ms) with Clean Viewport Masking
          // Option 1: Right-Flank Vertical Chevrons (▲ Up at y=162 on Page 2, ▼ Down at y=278 on Page 1)
          // --------------------------------------------------
          static const int SCROLL_EASE_174[5] = {0, 38, 95, 148, 174};

          int current_offset = 0;
          if (id(menu_scroll_active)) {
            int cur_step = id(menu_scroll_step);
            if (cur_step < 0) cur_step = 0;
            if (cur_step > 4) cur_step = 4;
            int shift = SCROLL_EASE_174[cur_step];
            if (id(menu_scroll_dir) == 1) {
              // Scrolling Down: offset moves from 0 to 174
              current_offset = shift;
            } else {
              // Scrolling Up: offset moves from 174 down to 0
              current_offset = 174 - shift;
            }
          } else {
            current_offset = (id(sleep_menu_page) == 2) ? 174 : 0;
          }

          static char sleep_labels[8][32];
          static uint32_t last_sleep_label_time = 0;
          if (!id(menu_scroll_active) || millis() - last_sleep_label_time > 1000) {
            snprintf(sleep_labels[0], sizeof(sleep_labels[0]), "Motion: %s", id(pickup_wake_mode).current_option().c_str());
            snprintf(sleep_labels[1], sizeof(sleep_labels[1]), "Tap: %s", id(tap_wake_mode).current_option().c_str());
            snprintf(sleep_labels[2], sizeof(sleep_labels[2]), "Screensaver: %s", id(docked_screensaver_switch).state ? "On" : "Off");
            std::string s_style = id(screensaver_style_select).current_option();
            const char* short_s = (s_style == "Aurora Borealis") ? "Aurora" :
                                  ((s_style == "Matrix Rain") ? "Matrix" :
                                  ((s_style == "Solar Flare") ? "Solar" : s_style.c_str()));
            snprintf(sleep_labels[3], sizeof(sleep_labels[3]), "Style: %s", short_s);
            snprintf(sleep_labels[4], sizeof(sleep_labels[4]), "Dock Inact: %s", id(screensaver_docked_timeout).current_option().c_str());
            snprintf(sleep_labels[5], sizeof(sleep_labels[5]), "Screen Off: %s", id(display_off_timeout).current_option().c_str());
            snprintf(sleep_labels[6], sizeof(sleep_labels[6]), "Stay Awake: %s", id(prevent_deep_sleep_switch).state ? "On" : "Off");
            snprintf(sleep_labels[7], sizeof(sleep_labels[7]), "Auto-Hibernate: %s", id(sleep_timeout_mode).current_option().c_str());
            last_sleep_label_time = millis();
          }

          auto draw_sleep_item = [&](int idx, int y) {
            draw_pill_button(110, 356, y, 18, id(theme_secondary), id(col_dark_gray), sleep_labels[idx], id(col_white), false);
          };

          for (int i = 0; i < 8; i++) {
            int y = 104 + i * 58 - current_offset;
            if (y >= 50 && y <= 390) {
              draw_sleep_item(i, y);
            }
          }

          // Clean Viewport Masks: clip scrolling pills outside y in [75, 370]
          it.filled_rectangle(0, 0, 466, 75, id(col_bg));
          it.filled_rectangle(0, 370, 466, 96, id(col_bg));

          // Stationary Title at y = 50
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "SLEEP & WAKE");

          // Stationary Submenu < BACK Button nestled lower at y = 408 (r = 16) with generous 34px buffer below Slot 5
          draw_pill_button(180, 286, 408, 16, id(theme_primary), id(col_dark_gray), "< BACK", id(theme_primary), false);

          // Stationary Pagination Dots nestled at bottom curve y = 440
          int current_dot_page = id(menu_scroll_active) ? id(menu_scroll_target_page) : id(sleep_menu_page);
          int dot1_r = (current_dot_page == 1) ? 3 : 2;
          int dot2_r = (current_dot_page == 2) ? 3 : 2;
          Color dot1_c = (current_dot_page == 1) ? id(theme_primary) : id(col_slate);
          Color dot2_c = (current_dot_page == 2) ? id(theme_primary) : id(col_slate);
          it.filled_circle(226, 440, dot1_r, dot1_c);
          it.filled_circle(240, 440, dot2_r, dot2_c);

          // Option 1 Right-Flank Vertical Chevrons (▲ Up at y=162 on Page 2, ▼ Down at y=278 on Page 1)
          // Displayed immediately for target direction so there is zero latency or delay
          int active_chevron_page = id(menu_scroll_active) ? id(menu_scroll_target_page) : id(sleep_menu_page);
          if (active_chevron_page == 1) {
            // Page 1: Down chevron (▼) at x = 415, y = 278 (Slot 4 level)
            it.line(415, 283, 407, 275, id(theme_secondary));
            it.line(415, 282, 407, 274, id(theme_secondary));
            it.line(415, 283, 423, 275, id(theme_secondary));
            it.line(415, 282, 423, 274, id(theme_secondary));
          } else {
            // Page 2: Up chevron (▲) at x = 415, y = 162 (Slot 2 level)
            it.line(415, 157, 407, 165, id(theme_secondary));
            it.line(415, 158, 407, 166, id(theme_secondary));
            it.line(415, 157, 423, 165, id(theme_secondary));
            it.line(415, 158, 423, 166, id(theme_secondary));
          }

        } else if (id(system_menu_mode) == 2) {
          // --------------------------------------------------
          // VIEW 2: DISPLAY SUBMENU (Gold Standard 60px Pitch)

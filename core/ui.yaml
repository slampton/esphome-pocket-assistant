http_request:
  id: http_client
  verify_ssl: false
  timeout: 15s

image:
  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: 466x466
    source: album
    current_image:
      id: album_art
    on_image_display:
      - lambda: 'id(album_art_loaded) = true;'
      - script.execute: throttled_disp_update

  - platform: online_image
    id: remote_album_art
    format: JPEG
    type: RGB565
    resize: 466x466
    url: "${initial_art_url}"
    on_download_finished:
      - lambda: |-
          id(current_loaded_art_url) = id(ha_target_art_url).state;
          id(album_art_loaded) = true;
      - script.execute: throttled_disp_update


output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      - lambda: |-
          if (state <= 0.01f) {
            id(disp1).set_brightness(0);
          } else {
            // Perceptual Gamma Mapping: Calibrated for AMOLED emission threshold (~90 hardware floor)
            float clamped = std::max(0.0f, std::min(1.0f, state));
            float hw = 90.0f + 165.0f * powf(clamped, 1.6f);
            uint8_t bri_byte = (uint8_t)std::max(0.0f, std::min(255.0f, roundf(hw)));
            id(disp1).set_brightness(bri_byte);
          }


light:
  - platform: monochromatic
    id: display_brightness
    name: "Display"
    output: backlight_brightness
    default_transition_length: 0s
    initial_state:
      brightness: 90%
    restore_mode: ALWAYS_ON


select:
  - platform: template
    name: "Remote: TV Platform Profile"
    id: tv_remote_profile
    icon: "mdi:television-box"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${tv_remote_profile}
    options:
      - "Android TV / Fire TV / Bravia"
      - "Apple TV"
      - "Roku"
      - "LG webOS"
      - "Custom"
    set_action:
      - lambda: |-
          id(remote_profile_user_set) = true;
          id(tv_remote_profile).publish_state(x);
          if (id(display_power_state) == 0 && millis() > 3000) id(disp1).update();

  - platform: template
    name: "Voice: Visual Profile"
    id: va_visual_profile
    icon: "mdi:palette-swatch-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Nebula"
    options:
      - "Nebula"
      - "Solaris"
    set_action:
      - lambda: |-
          id(va_visual_profile).publish_state(x);
          id(disp1).update();

  - platform: template
    name: "Weather: Condition Simulation"
    id: weather_sim_condition
    icon: "mdi:weather-partly-cloudy"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Live (Home Assistant)"
    options:
      - "Live (Home Assistant)"

                  } else if (slot_idx == 1) {
                    static uint32_t last_alert_vol_tap = 0;
                    if (now_sys - last_alert_vol_tap > TOUCH_DEBOUNCE_RAPID) {
                      last_alert_vol_tap = now_sys;
                      float cur_a_f = id(alert_volume).state;
                      int cur_a = (std::isnan(cur_a_f) || cur_a_f < 20.0f) ? 70 : (int)std::round(cur_a_f);
                      int nxt_a = (int)step_wrap_range((float)cur_a, 10.0f, 50.0f, 100.0f);
                      id(alert_volume).make_call().set_value((float)nxt_a).perform();
                      id(disp1).update();
                    }
                    return;
                  } else if (slot_idx == 2) {
                    if (now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sys_action_tap = now_sys;
                      int cur_sz = (int)std::round(id(volume_step_size).state);
                      int nxt_sz = (cur_sz < 5) ? 5 : ((cur_sz < 10) ? 10 : 2);
                      id(volume_step_size).make_call().set_value((float)nxt_sz).perform();
                      id(disp1).update();

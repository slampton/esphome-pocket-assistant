                }

                // Modern Stepper Cards Row: y in [292..358] (x = 89, 185, 281, 377)
                if (touch.y >= 292 && touch.y <= 358) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_stuff_tap = now_stuff;
                    if (!s.running && !s.paused) {

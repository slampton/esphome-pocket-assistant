                    } else if (touch.x >= 150 && touch.x <= 316) {
                      // Reset Card
                      s.running = false;
                      s.paused = false;
                      s.remaining_sec = s.duration_sec;
                      pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
                      id(disp1).update();
                      return;
                    }
                  }
                }

                // Readout Tap to reset slot to default (5m / 10m / 15m) & clear custom voice label: y in [110..175]
                if (touch.y >= 110 && touch.y <= 175 && touch.x >= 140 && touch.x <= 326) {
                  if (!s.running && !s.paused) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_stuff_tap = now_stuff;
                      s.name = "";
                      s.id = "";
                      s.duration_sec = (s_idx + 1) * 300;
                      s.remaining_sec = s.duration_sec;
                      pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
                      id(disp1).update();
                    }
                  }
                  return;
                }

              } else if (id(stuff_subpage) == 2) {
                // ----------------------------------------------------
                // SUBPAGE 2: 3-SLOT ALARMS LANDING PAGE & EDITOR VIEW
                // ----------------------------------------------------
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    if (id(alarm_edit_idx) > 0) {
                      id(alarm_edit_idx) = 0;
                    } else {
                      id(stuff_subpage) = 0;
                    }
                    id(disp1).update();
                  }
                  return;
                }

                if (id(alarm_edit_idx) == 0) {
                  // 3-Alarm Landing Page: Cards at y = 122 (85..160), 210 (173..247), 298 (261..336)
                  int card_i = 0;
                  if (touch.y >= 85 && touch.y <= 168) card_i = 1;
                  else if (touch.y >= 176 && touch.y <= 268) card_i = 2;
                  else if (touch.y >= 276 && touch.y <= 368) card_i = 3;

                  if (card_i >= 1 && touch.x >= 70 && touch.x <= 396) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_stuff_tap = now_stuff;
                      if (id(alarm_snooze_until) > 0 && (id(alarm_ringing_idx) == card_i || id(alarm_ringing_idx) == 0)) {
                        id(alarm_snooze_until) = 0;
                        id(disp1).update();
                        return;
                      }
                      if (touch.x >= 298) {
                        if (card_i == 1) {
                          id(alarm1_enabled) = !id(alarm1_enabled);
                          if (!id(alarm1_enabled) && id(alarm_ringing_idx) <= 1) id(alarm_snooze_until) = 0;
                        } else if (card_i == 2) {
                          id(alarm2_enabled) = !id(alarm2_enabled);
                          if (!id(alarm2_enabled) && id(alarm_ringing_idx) == 2) id(alarm_snooze_until) = 0;
                        } else {
                          id(alarm3_enabled) = !id(alarm3_enabled);
                          if (!id(alarm3_enabled) && id(alarm_ringing_idx) == 3) id(alarm_snooze_until) = 0;

                  - homeassistant.action:
                      action: music_assistant.play_media
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'
                        media_id: !lambda 'return id(slot_3_id).c_str();'
                        media_type: !lambda |-
                          if (id(selected_category_mode) == "artist") return "artist";
                          if (id(selected_category_mode) == "album" || id(selected_category_mode) == "artist_albums") return "album";
                          return id(slot_3_type).c_str();
                  - delay: 800ms
                  - lambda: |-
                      id(music_overlay_mode) = 0;
                  - component.update: disp1


  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: |-
              return (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_IDLE) && 
                     !id(va).is_running() && 
                     !id(va_tts_received) && 
                     !id(announcement_mixing_input).is_running();
          then:
            - audio_dac.mute_on: es8311_dac
            - script.execute: route_i2s_to_mic
            - component.update: disp1

  - id: screen_sleep_timer
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            lambda: |-
              return !id(va).is_running() && 
                     !id(va_tts_received) && 
                     !id(announcement_mixing_input).is_running() && 
                     (id(pocket_music_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) && 
                     !id(stopwatch_running) &&
                     (id(gui_page) != 1) &&
                     !id(pickup_detected).state &&
                     (id(active_game) == 0) &&
                     (id(gui_page) != 3 || !id(usb_connected).state);
          then:
            - lambda: 'id(sleep_start_time) = millis();'
            - light.turn_off: display_brightness

  - id: cancel_voice_assistant
    then:
      - audio_dac.mute_on: es8311_dac
      - lambda: |-
          esphome::voice_assistant::abort_voice_assistant(id(va));
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
      - voice_assistant.stop:
      - speaker.stop: va_speaker
      - speaker.stop: announcement_mixing_input
      - component.update: disp1
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 0.1s
      - delay: 100ms
      - if:
          condition:
            media_player.is_idle: pocket_music_player
          then:
            - script.execute: route_i2s_to_mic
      - if:
          condition:
            binary_sensor.is_off: pickup_detected
          then:
            - script.execute: screen_sleep_timer

  - id: route_i2s_to_mic
    then:
      - lambda: |-
          esp_rom_gpio_connect_out_signal(9, 26, false, false);   // GPIO9 -> I2S0 BCLK (signal 26)
          esp_rom_gpio_connect_out_signal(45, 27, false, false);  // GPIO45 -> I2S0 WS (signal 27)
          esp_rom_gpio_connect_out_signal(16, 23, false, false);  // GPIO16 -> I2S0 MCLK (signal 23)

  - id: route_i2s_to_spk
    then:
      - lambda: |-
          esp_rom_gpio_connect_out_signal(9, 28, false, false);   // GPIO9 -> I2S1 BCLK (signal 28)
          esp_rom_gpio_connect_out_signal(45, 29, false, false);  // GPIO45 -> I2S1 WS (signal 29)
          esp_rom_gpio_connect_out_signal(16, 21, false, false);  // GPIO16 -> I2S1 MCLK (signal 21)


display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 40MHz
    reset_pin: GPIO1
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6
      offset_height: 0
    brightness: 200
    update_interval: 1s
    lambda: |-
      const int cx = 233;
      const int cy = 233;

      // Reusable Clean Pill / Stadium Button Helper (Artifact-Free Outer/Inner Geometry)
      auto draw_pill_button = [&](int x1, int x2, int y_mid, int r, Color border_c, Color bg_c, const char* label, Color text_c, bool has_bullet) {
        // Outer filled pill in border color
        it.filled_circle(x1, y_mid, r, border_c);
        it.filled_circle(x2, y_mid, r, border_c);
        it.filled_rectangle(x1, y_mid - r, x2 - x1, 2 * r + 1, border_c);

        // Inner filled pill in background color (2px inset)
        it.filled_circle(x1, y_mid, r - 2, bg_c);
        it.filled_circle(x2, y_mid, r - 2, bg_c);
        it.filled_rectangle(x1, y_mid - (r - 2), x2 - x1, 2 * (r - 2) + 1, bg_c);

        // Optional bullet point on left
        if (has_bullet) {
          it.filled_circle(x1 - 4, y_mid, 5, border_c);
        }

        // Vertically centered text exactly on y_mid
        it.print(cx + (has_bullet ? 6 : 0), y_mid, id(font_small), text_c, TextAlign::CENTER, label);
      };

      // ==========================================
      // GLOBAL OVERLAY: OTA FIRMWARE UPDATE IN PROGRESS (Always renders even if screen was off)
      // ==========================================
      if (id(ota_in_progress)) {
        it.fill(id(col_bg));
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(col_rust));
        it.circle(cx, cy, 227, id(col_rust));
        it.circle(cx, cy, 222, id(col_dark_gray));

        it.print(cx, cy - 50, id(font_date), id(col_rust), TextAlign::CENTER, "FIRMWARE UPDATE");
        char prog_buf[32];
        snprintf(prog_buf, sizeof(prog_buf), "%d%%", id(ota_progress_pct));
        it.print(cx, cy + 10, id(font_time), id(col_white), TextAlign::CENTER, prog_buf);
        return;
      }

      if (!id(display_brightness).current_values.is_on()) {
        it.fill(id(col_bg));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: HIBERNATION SHUTDOWN
      // ==========================================
      if (id(is_hibernating)) {
        it.fill(id(col_bg));
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(col_rust));
        it.circle(cx, cy, 227, id(col_rust));
        it.circle(cx, cy, 222, id(col_dark_gray));

        it.print(cx, cy - 20, id(font_date), id(col_rust), TextAlign::CENTER, "HIBERNATING...");
        it.print(cx, cy + 20, id(font_small), id(col_slate), TextAlign::CENTER, "Release button to sleep");
        return;
      }

      static constexpr float PI_F = 3.14159265358979323846f;
      auto now = id(ha_time).now();
      float batt = id(batt_level).state;

      // ==========================================
      // GLOBAL OVERLAY: VOICE ASSISTANT TAKEOVER (v3.0.0 LIVING AI ENGINE)
      // ==========================================
      if (id(va_active) || !id(va_status_text).empty()) {
        uint32_t now_ms = millis();
        bool is_speaking = id(va_tts_received);
        bool is_thinking = (!is_speaking && id(va_status_text) == "Thinking...");

        // Strict Blue-Purple-Pink Spectral Gradient Helper (Zero yellow, green, or red)
        auto get_nuanced_radiation_color = [](float t) -> Color {
          t = t - floorf(t);
          if (t < 0.333f) {
            float k = t / 0.333f;
            return Color((uint8_t)(138.0f * k), (uint8_t)(229.0f * (1.0f - k) + 43.0f * k), (uint8_t)(255.0f * (1.0f - k) + 226.0f * k));
          } else if (t < 0.667f) {
            float k = (t - 0.333f) / 0.334f;
            return Color((uint8_t)(138.0f + 86.0f * k), (uint8_t)(43.0f + 21.0f * k), (uint8_t)(226.0f + 25.0f * k));
          } else {
            float k = (t - 0.667f) / 0.333f;
            return Color((uint8_t)(224.0f * (1.0f - k)), (uint8_t)(64.0f * (1.0f - k) + 229.0f * k), 255);
          }
        };

        if (is_speaking) {
          // ====================================================
          // STATE 3: SPEAKING (TTS) — RADIATING EXPANDING HARMONIC BANDS
          // ====================================================
          // 5 Out-of-phase expanding radiating bands (2000ms cycle) with dynamic thickness and gradient blending
          // Stripped of secondary echo/ripple artifacts for clean, bold, smooth radiating rings
          for (int w = 0; w < 5; w++) {
            uint32_t wave_t = (now_ms + w * 400) % 2000;
            float progress = (float)wave_t / 2000.0f; // 0.0 -> 1.0 radial expansion
            int r_center = 36 + (int)(progress * 180.0f);

            // Dynamic Band Width: swells from 4px near core up to 8-12px in mid-burst, tapering near perimeter
            float width_factor = sinf(progress * PI_F);
            int base_w = (w % 2 == 0) ? 7 : 4;
            int band_w = base_w + (int)(5.0f * width_factor);
            if (band_w < 3) band_w = 3;
            int half_w = band_w / 2;

            // Spectral phase across the blue-purple-pink loop
            float wave_color_phase = (float)w * 0.20f + progress * 0.30f + (float)(now_ms % 4000) / 4000.0f;

            // Draw clean gradient-shaded pillowed band
            for (int d = -half_w; d <= half_w; d++) {
              int r_curr = r_center + d;
              if (r_curr < 34 || r_curr > 226) continue;

              float edge_dist = fabsf((float)d) / (float)(half_w + 1);
              float band_phase = wave_color_phase + (float)d * 0.02f;
              Color base_col = get_nuanced_radiation_color(band_phase);

              Color stroke_col;
              if (edge_dist < 0.35f) {
                // Subtle bright center crest
                stroke_col = Color(
                  (uint8_t)(base_col.red * 0.75f + 255.0f * 0.25f),
                  (uint8_t)(base_col.green * 0.75f + 255.0f * 0.25f),
                  (uint8_t)(base_col.blue * 0.75f + 255.0f * 0.25f)
                );
              } else {
                stroke_col = base_col;
              }
              it.circle(cx, cy, r_curr, stroke_col);
            }
          }

          // Pulsing Acoustic Core (800ms rhythmic beat, matte layered depth with subtle shadow, zero white specular spots)
          float core_pulse = sinf((float)(now_ms % 800) * (2.0f * PI_F / 800.0f));
          int core_r = 20 + (int)(4.0f * core_pulse);

          Color aura_col = get_nuanced_radiation_color((float)(now_ms % 3000) / 3000.0f);
          Color body_col = get_nuanced_radiation_color((float)(now_ms % 3000) / 3000.0f + 0.33f);

          it.filled_circle(cx, cy + 2, core_r + 3, id(col_dark_gray)); // subtle drop shadow
          it.circle(cx, cy, core_r + 3, aura_col);
          it.circle(cx, cy, core_r + 2, aura_col);
          it.filled_circle(cx, cy, core_r, body_col);

          if (core_r > 6) {
            Color inner_tone = Color(
              (uint8_t)(body_col.red * 0.82f + 35),
              (uint8_t)(body_col.green * 0.82f + 35),
              (uint8_t)(body_col.blue * 0.82f + 35)
            );
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

        } else if (is_thinking) {
          // ====================================================
          // STATE 2: THINKING — THE QUANTUM COGNITIVE ENGINE
          // ====================================================
          it.circle(cx, cy, 52, id(col_dark_gray));
          it.circle(cx, cy, 74, id(col_dark_gray));

          float spin_cw = (float)(now_ms % 900) * (2.0f * PI_F / 900.0f);
          float spin_ccw = -(float)(now_ms % 900) * (2.0f * PI_F / 900.0f);

          // Inner CW orbit nodes (Cyan)
          for (int i = 0; i < 3; i++) {
            float ang = spin_cw + i * (2.0f * PI_F / 3.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)(52.0f * c_node);
            int ny = cy + (int)(52.0f * s_node);
            it.filled_circle(nx, ny, 4, id(col_cyan));
            it.filled_circle(nx, ny, 2, id(col_white));
          }

          // Outer CCW orbit nodes (Magenta / Purple)
          for (int i = 0; i < 3; i++) {
            float ang = spin_ccw + i * (2.0f * PI_F / 3.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)(74.0f * c_node);
            int ny = cy + (int)(74.0f * s_node);
            it.filled_circle(nx, ny, 4, id(col_magenta));
            it.filled_circle(nx, ny, 2, id(col_purple));
          }

          // Cognitive Pulse Core - Consistent Matte Layered Depth (NO shiny white specular 3D spot!)
          float pulse = sinf((float)(now_ms % 600) * (2.0f * PI_F / 600.0f));
          int core_r = 20 + (int)(4.0f * pulse);

          it.filled_circle(cx, cy + 2, core_r + 3, id(col_dark_gray)); // subtle drop shadow
          it.circle(cx, cy, core_r + 4, id(col_purple));
          it.circle(cx, cy, core_r + 3, id(col_purple));
          it.filled_circle(cx, cy, core_r, id(col_cyan));

          if (core_r > 6) {
            Color inner_tone = Color(30, 200, 230); // Soft diffuse inner definition
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

          it.print(cx, cy + 105, id(font_small), id(col_cyan), TextAlign::CENTER, "Thinking...");

        } else {
          // ====================================================
          // STATE 1: LISTENING — THE LIVING ATTENTIVE CORE
          // ====================================================
          it.circle(cx, cy, 56, id(col_dark_gray));

          // 3 Orbital Satellites gently revolving at a graceful 3.6s pace
          float orbit_ang = (float)(now_ms % 3600) * (2.0f * PI_F / 3600.0f);
          for (int i = 0; i < 3; i++) {
            float ang = orbit_ang + i * (2.0f * PI_F / 3.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)(56.0f * c_node);
            int ny = cy + (int)(56.0f * s_node);
            it.filled_circle(nx, ny, 3, id(col_light_blue));
            it.filled_circle(nx, ny, 1, id(col_white));
          }

          // Organic 1.6-second Breathing Core and Aura - Consistent Matte Layered Depth (NO shiny white specular 3D spot!)
          float pulse = sinf((float)(now_ms % 1600) * (2.0f * PI_F / 1600.0f));
          int core_r = 20 + (int)(5.0f * pulse);
          int aura_r = 36 + (int)(8.0f * pulse);

          it.circle(cx, cy, aura_r + 2, id(col_dark_gray));
          it.circle(cx, cy, aura_r, id(col_purple));
          it.circle(cx, cy, aura_r - 1, id(col_purple));

          it.filled_circle(cx, cy + 2, core_r + 3, id(col_dark_gray)); // subtle drop shadow
          it.circle(cx, cy, core_r + 3, id(col_light_blue));
          it.circle(cx, cy, core_r + 2, id(col_light_blue));
          it.filled_circle(cx, cy, core_r, id(col_cyan));

          if (core_r > 6) {
            Color inner_tone = Color(30, 200, 230); // Soft diffuse inner definition
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

          const char *status_str = id(va_status_text).empty() ? "Listening..." : id(va_status_text).c_str();
          it.print(cx, cy + 95, id(font_small), id(col_cyan), TextAlign::CENTER, status_str);
        }
        return;
      }

      // ==========================================
      // PAGE 0: WATCH FACE (HIGH-CONTRAST MODERN DIAL)
      // ==========================================
      if (id(gui_page) == 0) {
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(col_slate));
        it.circle(cx, cy, 222, id(col_dark_gray));

        if (!now.is_valid()) {
          it.print(cx, cy - 10, id(font_date), id(col_slate), TextAlign::CENTER, "Connecting...");
          return;
        }

        int hour = now.hour;
        int min = now.minute;
        int sec = now.second;

        // Dial markers: 60 ticks (major 5-min in slate, individual minutes in medium gray)
        // Priority 2: Precomputed 60-tick sine/cosine LUT - eliminates 120 transcendental float calls/frame
        static const float DIAL_SIN[60] = {
          0.000000f, 0.104528f, 0.207912f, 0.309017f, 0.406737f, 0.500000f,
          0.587785f, 0.669131f, 0.743145f, 0.809017f, 0.866025f, 0.913545f,
          0.951057f, 0.978148f, 0.994522f, 1.000000f, 0.994522f, 0.978148f,
          0.951057f, 0.913545f, 0.866025f, 0.809017f, 0.743145f, 0.669131f,
          0.587785f, 0.500000f, 0.406737f, 0.309017f, 0.207912f, 0.104528f,
          0.000000f, -0.104528f, -0.207912f, -0.309017f, -0.406737f, -0.500000f,
          -0.587785f, -0.669131f, -0.743145f, -0.809017f, -0.866025f, -0.913545f,
          -0.951057f, -0.978148f, -0.994522f, -1.000000f, -0.994522f, -0.978148f,
          -0.951057f, -0.913545f, -0.866025f, -0.809017f, -0.743145f, -0.669131f,
          -0.587785f, -0.500000f, -0.406737f, -0.309017f, -0.207912f, -0.104528f
        };
        static const float DIAL_COS[60] = {
          1.000000f, 0.994522f, 0.978148f, 0.951057f, 0.913545f, 0.866025f,
          0.809017f, 0.743145f, 0.669131f, 0.587785f, 0.500000f, 0.406737f,
          0.309017f, 0.207912f, 0.104528f, 0.000000f, -0.104528f, -0.207912f,
          -0.309017f, -0.406737f, -0.500000f, -0.587785f, -0.669131f, -0.743145f,
          -0.809017f, -0.866025f, -0.913545f, -0.951057f, -0.978148f, -0.994522f,
          -1.000000f, -0.994522f, -0.978148f, -0.951057f, -0.913545f, -0.866025f,
          -0.809017f, -0.743145f, -0.669131f, -0.587785f, -0.500000f, -0.406737f,
          -0.309017f, -0.207912f, -0.104528f, 0.000000f, 0.104528f, 0.207912f,
          0.309017f, 0.406737f, 0.500000f, 0.587785f, 0.669131f, 0.743145f,
          0.809017f, 0.866025f, 0.913545f, 0.951057f, 0.978148f, 0.994522f
        };
        for (int i = 0; i < 60; i++) {
          float s = DIAL_SIN[i];
          float c = DIAL_COS[i];

          if (i % 5 == 0) {
            int r_in = (i % 15 == 0) ? 198 : 206;
            it.line(cx + (int)(r_in * s), cy - (int)(r_in * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_slate));
            it.line(cx + (int)(r_in * s) + 1, cy - (int)(r_in * c), cx + (int)(220 * s) + 1, cy - (int)(220 * c), id(col_slate));
          } else {
            it.line(cx + (int)(214 * s), cy - (int)(214 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_gray));
          }
        }

        // 12-Hour formatted date and digital time (single-digit hours drop leading zero)
        it.strftime(cx, 145, id(font_date), id(col_slate), TextAlign::CENTER, "%a, %b %d", now);
        int h12 = now.hour % 12;
        if (h12 == 0) h12 = 12;
        char time_buf[16];
        snprintf(time_buf, sizeof(time_buf), "%d:%02d %s", h12, now.minute, now.hour >= 12 ? "PM" : "AM");
        it.print(cx, 305, id(font_digital_time), id(col_slate), TextAlign::CENTER, time_buf);

        // Battery percentage in cyan in all states; golden charging bolt appears on left when plugged in
        if (!isnan(batt)) {
          char batt_str[16];
          snprintf(batt_str, sizeof(batt_str), "%.0f%%", batt);
          if (id(batt_charging).state) {
            int text_x = cx + 8;
            it.print(text_x, 380, id(font_small), id(col_cyan), TextAlign::CENTER, batt_str);
            int bx = text_x - (batt >= 100.0f ? 36 : 28);
            int by = 380;
            it.filled_triangle(bx + 3, by - 8, bx - 3, by, bx + 1, by, id(col_gold));
            it.filled_triangle(bx - 1, by, bx + 2, by, bx - 2, by + 8, id(col_gold));
          } else {
            it.print(cx, 380, id(font_small), id(col_cyan), TextAlign::CENTER, batt_str);
          }
        }

        float h_angle = ((hour % 12) + min / 60.0f + sec / 3600.0f) * (2.0f * PI_F / 12.0f);
        float m_angle = (min + sec / 60.0f) * (2.0f * PI_F / 60.0f);
        float s_angle = sec * (2.0f * PI_F / 60.0f);

        // Hour Hand: Bold White Sword Hand (base width 14px, length 88px)
        {
          float sin_h, cos_h;
          sincosf(h_angle, &sin_h, &cos_h);
          it.filled_triangle(cx - (int)(7.0f * cos_h), cy - (int)(7.0f * sin_h),
                             cx + (int)(7.0f * cos_h), cy + (int)(7.0f * sin_h),
                             cx + (int)(88.0f * sin_h), cy - (int)(88.0f * cos_h),
                             id(col_white));
        }

        // Minute Hand: Slender Slate Gray Sword Hand (base width 8px, length 148px)
        {
          float sin_m, cos_m;
          sincosf(m_angle, &sin_m, &cos_m);
          it.filled_triangle(cx - (int)(4.0f * cos_m), cy - (int)(4.0f * sin_m),
                             cx + (int)(4.0f * cos_m), cy + (int)(4.0f * sin_m),
                             cx + (int)(148.0f * sin_m), cy - (int)(148.0f * cos_m),
                             id(col_slate));
        }

        // Second Hand: Modern Red Needle (length 168px) with 4px circular red counterweight
        {
          float sin_s, cos_s;
          sincosf(s_angle, &sin_s, &cos_s);
          int tip_x = cx + (int)(168.0f * sin_s);
          int tip_y = cy - (int)(168.0f * cos_s);
          int tail_x = cx - (int)(30.0f * sin_s);
          int tail_y = cy + (int)(30.0f * cos_s);
          it.line(tail_x, tail_y, tip_x, tip_y, id(col_red));
          it.filled_circle(tail_x, tail_y, 4, id(col_red));
        }

        // Center Pinion Cap (White ring, red center pip)
        it.filled_circle(cx, cy, 7, id(col_white));
        it.filled_circle(cx, cy, 4, id(col_red));
        it.filled_circle(cx, cy, 2, id(col_dark_gray));

      // ==========================================
      // PAGE 1: VINTAGE 1970 HEUER SWISS CHRONOMETER
      // High-Contrast Aged Parchment Dial, Dual Silver & Black Bezels,
      // 1/10s High-Speed Spinning Subdial, Bold Arrow Hand & Large Digital Readout
      // ==========================================
      } else if (id(gui_page) == 1) {
        // Outer Triple Bezel: Silver Outer Ring -> Black Band -> Inner Silver Accent Ring
        it.circle(cx, cy, 230, id(col_silver));
        it.circle(cx, cy, 229, id(col_silver));
        it.circle(cx, cy, 228, id(col_black));
        it.circle(cx, cy, 227, id(col_black));
        it.circle(cx, cy, 226, id(col_black));
        it.circle(cx, cy, 225, id(col_black));
        it.circle(cx, cy, 224, id(col_silver));
        it.circle(cx, cy, 223, id(col_silver));

        // Authentic 1970s Vintage Aged Parchment / Warm Opaline Off-White Dial
        it.filled_circle(cx, cy, 222, Color(216, 206, 184));

        // Outer Chapter Track Boundaries (Bold double ring)
        it.circle(cx, cy, 220, id(col_black));
        it.circle(cx, cy, 219, id(col_black));
        it.circle(cx, cy, 192, id(col_black));
        it.circle(cx, cy, 191, id(col_black));

        // Precision Perimeter Chapter Ring (Bold 3px Major 5s bars, 2px Minor 1s ticks)
        for (int s = 0; s < 60; s++) {
          float a = s * (2.0f * PI_F / 60.0f);
          float t_sin, t_cos;
          sincosf(a, &t_sin, &t_cos);
          
          if (s % 5 == 0) {
            // Major 5-Second Bar: 3px wide, prominent solid black
            float perp_x = -t_cos;
            float perp_y = t_sin;
            int x1 = cx + (int)(191.0f * t_sin);
            int y1 = cy - (int)(191.0f * t_cos);
            int x2 = cx + (int)(220.0f * t_sin);
            int y2 = cy - (int)(220.0f * t_cos);
            it.line(x1, y1, x2, y2, id(col_black));
            it.line(x1 + (int)perp_x, y1 + (int)perp_y, x2 + (int)perp_x, y2 + (int)perp_y, id(col_black));
            it.line(x1 - (int)perp_x, y1 - (int)perp_y, x2 - (int)perp_x, y2 - (int)perp_y, id(col_black));
          } else {
            // Standard 1-Second Tick: 2px wide from r=204 to r=220
            int x1 = cx + (int)(204.0f * t_sin);
            int y1 = cy - (int)(204.0f * t_cos);
            int x2 = cx + (int)(220.0f * t_sin);
            int y2 = cy - (int)(220.0f * t_cos);
            it.line(x1, y1, x2, y2, id(col_black));
            it.line(x1 + 1, y1, x2 + 1, y2, id(col_black));
          }
        }

        // Bold Perimeter Numerals (5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55 - 60 omitted for STOPWATCH)
        for (int s = 5; s <= 55; s += 5) {
          float a = s * (2.0f * PI_F / 60.0f);
          float t_sin, t_cos;
          sincosf(a, &t_sin, &t_cos);
          char num_str[8];
          snprintf(num_str, sizeof(num_str), "%d", s);
          it.print(cx + (int)(170.0f * t_sin), cy - (int)(170.0f * t_cos),
                   id(font_digital_time), id(col_black), TextAlign::CENTER, num_str);
        }

        // Vintage Title at Top: STOPWATCH (clean, non-overlapping)
        it.print(cx, 66, id(font_small), id(col_black), TextAlign::CENTER, "STOPWATCH");

        uint32_t total_ms = id(stopwatch_running) ? (millis() - id(stopwatch_start_time)) : id(stopwatch_elapsed_ms);
        int mins = (total_ms / 60000) % 60;
        int secs = (total_ms / 1000) % 60;
        int tenths = (total_ms / 100) % 10;

        // ----------------------------------------------------
        // 12 O'CLOCK SUB-DIAL: 1/10-SECOND HIGH-SPEED SPINNER (ENLARGED r=50)
        // ----------------------------------------------------
        const int sub_cx = cx;
        const int sub_cy = 140;
        const int sub_r = 50;

        // Recessed subdial with subtle authentic mechanical depth shading
        it.filled_circle(sub_cx, sub_cy, sub_r - 2, Color(208, 198, 176));
        it.circle(sub_cx, sub_cy, sub_r, id(col_black));
        it.circle(sub_cx, sub_cy, sub_r - 1, id(col_black));
        it.circle(sub_cx, sub_cy, sub_r - 2, id(col_silver));

        // 10 Tenths Ticks (0..9) with bold major bars
        for (int i = 0; i < 10; i++) {
          float a = i * (2.0f * PI_F / 10.0f);
          float s_i, c_i;
          sincosf(a, &s_i, &c_i);
          int r_in = (i % 2 == 0) ? (sub_r - 10) : (sub_r - 6);
          it.line(sub_cx + (int)(r_in * s_i), sub_cy - (int)(r_in * c_i),
                  sub_cx + (int)((sub_r - 2) * s_i), sub_cy - (int)((sub_r - 2) * c_i), id(col_black));
          if (i % 2 == 0) {
            it.line(sub_cx + (int)(r_in * s_i) + 1, sub_cy - (int)(r_in * c_i),
                    sub_cx + (int)((sub_r - 2) * s_i) + 1, sub_cy - (int)((sub_r - 2) * c_i), id(col_black));
          }
        }

        // Subdial Markings: 0, 2, 4, 6, 8 (Bold font_small size 20)
        for (int i = 0; i < 10; i += 2) {
          float a = i * (2.0f * PI_F / 10.0f);
          float s_i, c_i;
          sincosf(a, &s_i, &c_i);
          char sub_num[4];
          snprintf(sub_num, sizeof(sub_num), "%d", i);
          it.print(sub_cx + (int)(28.0f * s_i), sub_cy - (int)(28.0f * c_i),
                   id(font_small), id(col_black), TextAlign::CENTER, sub_num);
        }

        it.print(sub_cx, sub_cy + 14, id(font_micro), id(col_slate), TextAlign::CENTER, "1/10 SEC");

        // High-Speed 1/10s Spinning Needle (2px bold racing red, 1 revolution per 1000ms!)
        float sub_angle = ((total_ms % 1000) / 1000.0f) * (2.0f * PI_F);
        float sub_sin, sub_cos;
        sincosf(sub_angle, &sub_sin, &sub_cos);
        int sub_tip_x = sub_cx + (int)(38.0f * sub_sin);
        int sub_tip_y = sub_cy - (int)(38.0f * sub_cos);
        int sub_tail_x = sub_cx - (int)(9.0f * sub_sin);
        int sub_tail_y = sub_cy + (int)(9.0f * sub_cos);
        it.line(sub_tail_x, sub_tail_y, sub_tip_x, sub_tip_y, id(col_red));
        it.line(sub_tail_x + 1, sub_tail_y, sub_tip_x + 1, sub_tip_y, id(col_red));
        it.filled_circle(sub_cx, sub_cy, 4, id(col_black));
        it.filled_circle(sub_cx, sub_cy, 2, id(col_silver));

        // ----------------------------------------------------
        // CHRONOMETER DIGITAL READOUT (Large, Bold, High-Legibility)
        // ----------------------------------------------------
        char chrono_buf[32];
        snprintf(chrono_buf, sizeof(chrono_buf), "%02d:%02d.%d", mins, secs, tenths);
        it.print(cx, 248, id(font_chrono_time), id(col_black), TextAlign::CENTER, chrono_buf);

        // Display lap time readout if recorded (centered at y=272, well clear of pushers)
        if (id(stopwatch_lap_ms) > 0) {
          int l_mins = (id(stopwatch_lap_ms) / 60000) % 60;
          int l_secs = (id(stopwatch_lap_ms) / 1000) % 60;
          int l_tenths = (id(stopwatch_lap_ms) / 100) % 10;
          char lap_buf[32];
          snprintf(lap_buf, sizeof(lap_buf), "SPLIT  %02d:%02d.%d", l_mins, l_secs, l_tenths);
          it.print(cx, 272, id(font_small), id(col_rust), TextAlign::CENTER, lap_buf);
        }

        // ----------------------------------------------------
        // SPLIT-SECOND (RATTRAPANTE) GHOST HAND (FREEZES AT LAP)
        // ----------------------------------------------------
        if (id(stopwatch_lap_ms) > 0) {
          float lap_angle = ((id(stopwatch_lap_ms) % 60000) / 60000.0f) * (2.0f * PI_F);
          float l_sin, l_cos;
          sincosf(lap_angle, &l_sin, &l_cos);
          it.line(cx, cy, cx + (int)(150.0f * l_sin), cy - (int)(150.0f * l_cos), id(col_rust));
          it.circle(cx + (int)(154.0f * l_sin), cy - (int)(154.0f * l_cos), 4, id(col_rust));
        }

        // ----------------------------------------------------
        // MAIN CENTRAL ARROW HAND (CLASSIC 1970 HEUER BOLD CHRONOGRAPH)
        // ----------------------------------------------------
        float chrono_angle = ((total_ms % 60000) / 60000.0f) * (2.0f * PI_F);
        float s_sin, s_cos;
        sincosf(chrono_angle, &s_sin, &s_cos);

        int tip_x = cx + (int)(174.0f * s_sin);
        int tip_y = cy - (int)(174.0f * s_cos);
        int arr_base_x = cx + (int)(148.0f * s_sin);
        int arr_base_y = cy - (int)(148.0f * s_cos);
        int tail_x = cx - (int)(36.0f * s_sin);
        int tail_y = cy + (int)(36.0f * s_cos);

        // True perpendicular vector (Rotated 90 deg clockwise from radial vector)
        // v = (s_sin, -s_cos) -> perp = (s_cos, s_sin). Dot product = 0.00 at all 360 degrees!
        float perp_x = s_cos;
        float perp_y = s_sin;
        // Constant 16px wide arrowhead base (8px each side), 24px long spearhead
        int left_x = arr_base_x + (int)(8.0f * perp_x);
        int left_y = arr_base_y + (int)(8.0f * perp_y);
        int right_x = arr_base_x - (int)(8.0f * perp_x);
        int right_y = arr_base_y - (int)(8.0f * perp_y);

        // Main shaft: 3px solid black chronometer pointer
        it.line(tail_x, tail_y, arr_base_x, arr_base_y, id(col_black));
        it.line(tail_x + (int)perp_x, tail_y + (int)perp_y, arr_base_x + (int)perp_x, arr_base_y + (int)perp_y, id(col_black));
        it.line(tail_x - (int)perp_x, tail_y - (int)perp_y, arr_base_x - (int)perp_x, arr_base_y - (int)perp_y, id(col_black));

        // Classic bold arrowhead
        it.filled_triangle(tip_x, tip_y, left_x, left_y, right_x, right_y, id(col_black));

        // Teardrop counter-weight tail: 8px radius
        it.filled_circle(tail_x, tail_y, 8, id(col_black));
        it.circle(tail_x, tail_y, 8, id(col_silver));
        it.filled_circle(tail_x, tail_y, 3, id(col_silver));

        // Multi-tier Center Pinion Arbor Cap
        it.filled_circle(cx, cy, 9, id(col_silver));
        it.circle(cx, cy, 9, id(col_black));
        it.filled_circle(cx, cy, 6, id(col_black));
        it.filled_circle(cx, cy, 2, id(col_silver));

        // ----------------------------------------------------
        // ENLARGED DUAL PUSHERS: LAP & RESET (Optimized: y=328, x=179 & 287)
        // 22px clear of 25 & 35, and 18px clear of SPLIT readout
        // ----------------------------------------------------
        const int btn_y = 328;
        const int btn_lap_x = 179;
        const int btn_rst_x = 287;

        // LAP Button (Inboard radius 38px, diameter 76px)
        it.filled_circle(btn_lap_x, btn_y, 38, id(col_dark_gray));
        it.circle(btn_lap_x, btn_y, 38, id(col_black));
        it.circle(btn_lap_x, btn_y, 37, id(col_silver));
        it.print(btn_lap_x, btn_y, id(font_small), id(col_white), TextAlign::CENTER, "LAP");

        // RESET Button (Inboard radius 38px, diameter 76px)
        it.filled_circle(btn_rst_x, btn_y, 38, id(col_dark_gray));
        it.circle(btn_rst_x, btn_y, 38, id(col_black));
        it.circle(btn_rst_x, btn_y, 37, id(col_rust));
        it.print(btn_rst_x, btn_y, id(font_small), id(col_white), TextAlign::CENTER, "RESET");

      // ==========================================
      // PAGE 2: MUSIC PLAYER & MULTI-ROOM EXPANSION
      // ==========================================
      } else if (id(gui_page) == 2) {
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(col_green));
        it.circle(cx, cy, 227, id(col_green));
        it.circle(cx, cy, 222, id(col_dark_gray));

        if (id(music_overlay_mode) == 0) {
          // --------------------------------------------------
          // VIEW 0: NOW PLAYING MUSIC PLAYER
          // --------------------------------------------------
          // Modern Volume Buttons: Symmetrical Top Caret (VOL ▲) & Bottom Caret (VOL ▼)
          it.filled_triangle(cx, 30, cx - 8, 40, cx + 8, 40, id(col_gold));
          it.print(cx, 56, id(font_small), id(col_slate), TextAlign::CENTER, "VOL");

          it.print(cx, 82, id(font_date), id(col_green), TextAlign::CENTER, "MUSIC");

          bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
          bool is_playing = false;
          if (is_remote) {
            is_playing = (id(ha_target_state).state == "playing");
          } else {
            is_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          }

          // Active Speaker Indicator
          std::string spk_label = "[" + id(active_speaker_name) + "]";
          it.print(cx, 102, id(font_small), is_remote ? id(col_cyan) : id(col_gray), TextAlign::CENTER, spk_label.c_str());

          bool has_art = (!is_remote && id(album_art).get_width() > 0);
          if (has_art) {
            it.image(cx - 100, 122, id(album_art));
          } else {
            // High-contrast Vinyl Disc with Remote Audio Badge
            it.filled_circle(cx, 222, 75, id(col_dark_gray));
            it.circle(cx, 222, 75, is_remote ? id(col_cyan) : id(col_green));
            it.circle(cx, 222, 60, id(col_bg));
            it.circle(cx, 222, 45, id(col_dark_gray));
            it.circle(cx, 222, 30, id(col_bg));
            it.filled_circle(cx, 222, 16, is_remote ? id(col_cyan) : id(col_green));
          }

          // Track Navigation Buttons: Previous Track (◀◀) Left, Next Track (▶▶) Right (Naked Enlarged Double Chevrons)
          it.filled_triangle(101, 222, 111, 211, 111, 233, id(col_white));
          it.filled_triangle(113, 222, 123, 211, 123, 233, id(col_white));

          it.filled_triangle(353, 222, 343, 211, 343, 233, id(col_white));
          it.filled_triangle(365, 222, 355, 211, 355, 233, id(col_white));

          // Paused state frosted scrim overlay with borderless bold green Play badge ▶
          if (!is_playing) {
            it.filled_circle(cx, 222, 34, id(col_dark_gray));
            it.filled_triangle(cx - 7, 222 - 15, cx - 7, 222 + 15, cx + 15, 222, id(col_green));
          }

          // High-contrast Volume HUD (Configurable Position: Left, Right, or Hidden)
          std::string v_pos = id(vol_display_position).current_option();
          if (v_pos != "Hidden" && (millis() - id(vol_hud_timer) < 1800)) {
            int v_pct = (int)std::round(id(pocket_music_player).volume * 100.0f);
            char v_buf[16];
            snprintf(v_buf, sizeof(v_buf), "%d%%", v_pct);
            bool on_left = (v_pos != "Right");
            int hud_x = on_left ? (cx - 32) : (cx + 32);
            TextAlign align = on_left ? TextAlign::CENTER_RIGHT : TextAlign::CENTER_LEFT;
            if (id(vol_hud_direction) >= 0) {
              // Top Caret (VOL ▲): y = 35
              it.print(hud_x, 35, id(font_digital_time), id(col_white), align, v_buf);
            } else {
              // Bottom Caret (VOL ▼): y = 431
              it.print(hud_x, 431, id(font_digital_time), id(col_white), align, v_buf);
            }
          }

          // Real-time track progress calculation
          float dur = id(ha_media_duration).state;
          float current_pos = id(music_pos_base);
          if (is_playing && id(music_pos_sync_time) > 0) {
            current_pos += (millis() - id(music_pos_sync_time)) / 1000.0f;
          }
          float prog = 0.0f;
          if (!isnan(dur) && dur > 0.0f) {
            prog = current_pos / dur;
            if (prog < 0.0f) prog = 0.0f;
            if (prog > 1.0f) prog = 1.0f;
          }

          // Perimeter track position beads (soft light slate gray, non-blooming)
          float max_angle = prog * 2.0f * PI_F;
          for (float a = 0.0f; a < max_angle; a += 0.12f) {
            float sa, ca;
            sincosf(a, &sa, &ca);
            int px = cx + (int)(216.0f * sa);
            int py = cy - (int)(216.0f * ca);
            it.filled_circle(px, py, 3, id(col_slate));
          }

          // Track Title, Artist, Album extraction (dynamic Home Assistant priority when remote)
          std::string title = "";
          std::string artist = "";
          std::string album = "";

          if (is_remote) {
            title = id(ha_track_title).state;
            artist = id(ha_track_artist).state;
            album = id(ha_track_album).state;
          } else {
            title = id(track_title).state;
            if (title.empty() || title == "None") title = id(ha_track_title).state;
            artist = id(track_artist).state;
            if (artist.empty() || artist == "None") artist = id(ha_track_artist).state;
            album = id(track_album).state;
            if (album.empty() || album == "None") album = id(ha_track_album).state;
          }

          if (title.empty() || title == "None") title = is_playing ? "Playing Audio" : "Idle";
          if (title.length() > 24) title = title.substr(0, 22) + "...";

          if (has_art) {
            it.print(cx, 348, id(font_small), id(col_white), TextAlign::CENTER, title.c_str());
            if (!artist.empty() && artist != "None") {
              if (artist.length() > 26) artist = artist.substr(0, 24) + "...";
              it.print(cx, 375, id(font_small), id(col_orange), TextAlign::CENTER, artist.c_str());
            }
          } else {
            it.print(cx, 335, id(font_date), id(col_white), TextAlign::CENTER, title.c_str());
            if (!artist.empty() && artist != "None") {
              if (artist.length() > 26) artist = artist.substr(0, 24) + "...";
              it.print(cx, 365, id(font_small), id(col_orange), TextAlign::CENTER, artist.c_str());
            }
            if (!album.empty() && album != "None") {
              if (album.length() > 28) album = album.substr(0, 26) + "...";
              it.print(cx, 388, id(font_small), id(col_slate), TextAlign::CENTER, album.c_str());
            }
          }

          // Bottom Volume Down Caret Button
          it.print(cx, 408, id(font_small), id(col_slate), TextAlign::CENTER, "VOL");
          it.filled_triangle(cx, 436, cx - 8, 426, cx + 8, 426, id(col_gold));

        } else if (id(music_overlay_mode) == 1) {
          // --------------------------------------------------
          // LEVEL 1: TOP-LEVEL SELECTION MENU (3 Cards, 1 Page)
          // --------------------------------------------------
          it.print(cx, 82, id(font_date), id(col_green), TextAlign::CENTER, "MUSIC MENU");

          draw_pill_button(140, 326, 155, 22, id(col_green), id(col_dark_gray), "SPEAKER HANDOFF", id(col_white), true);
          draw_pill_button(140, 326, 235, 22, id(col_cyan), id(col_dark_gray), "SPEAKER TAKEOVER", id(col_white), true);
          draw_pill_button(140, 326, 315, 22, id(col_gold), id(col_dark_gray), "BROWSE LIBRARY", id(col_white), true);

          // Bottom Back to Player
          draw_pill_button(180, 286, 395, 18, id(col_dark_gray), id(col_dark_gray), "[ BACK ]", id(col_slate), false);

        } else if (id(music_overlay_mode) == 2) {
          // --------------------------------------------------
          // LEVEL 2: LIBRARY CATEGORIES SUBMENU (3 per page)
                // Card 1 (y: 105..175, x: 65..401)
                if (touch.y >= 105 && touch.y < 175 && touch.x >= 65 && touch.x <= 401) {
                  if (id(music_category_page) == 1) {
                    id(selected_category_mode) = "favorites";
                    id(selected_category_title) = "FAVORITES";
                  } else if (id(music_category_page) == 2) {
                    id(selected_category_mode) = "album";
                    id(selected_category_title) = "ALBUMS";
                  } else if (id(music_category_page) == 3) {
                    id(selected_category_mode) = "podcast";
                    id(selected_category_title) = "PODCASTS";
                  }
                  id(music_browse_page) = 1;
                  id(music_overlay_mode) = 3; // Open Level 3 Item Browser
                  id(slot_1_name) = "Loading...";
                  id(slot_1_id) = "";
                  id(slot_2_name) = "";
                  id(slot_2_id) = "";
                  id(slot_3_name) = "";
                  id(slot_3_id) = "";
                  id(music_browse_total_pages) = 1;
                  id(music_browse_has_prev) = false;
                  id(music_browse_has_next) = false;
                  id(disp1).update();
                  id(fetch_music_browse).execute();
                // Card 2 (y: 175..250, x: 65..401)
                } else if (touch.y >= 175 && touch.y < 250 && touch.x >= 65 && touch.x <= 401) {
                  if (id(music_category_page) == 1) {
                    id(selected_category_mode) = "playlist";
                    id(selected_category_title) = "PLAYLISTS";
                  } else if (id(music_category_page) == 2) {
                    id(selected_category_mode) = "track";
                    id(selected_category_title) = "TRACKS";
                  } else if (id(music_category_page) == 3) {
                    id(selected_category_mode) = "audiobook";
                    id(selected_category_title) = "AUDIOBOOKS";
                  }
                  id(music_browse_page) = 1;
                  id(music_overlay_mode) = 3;
                  id(slot_1_name) = "Loading...";
                  id(slot_1_id) = "";
                  id(slot_2_name) = "";
                  id(slot_2_id) = "";
                  id(slot_3_name) = "";
                  id(slot_3_id) = "";
                  id(music_browse_total_pages) = 1;
                  id(music_browse_has_prev) = false;
                  id(music_browse_has_next) = false;
                  id(disp1).update();
                  id(fetch_music_browse).execute();
                // Card 3 (y: 250..325, x: 65..401)
                } else if (touch.y >= 250 && touch.y < 325 && touch.x >= 65 && touch.x <= 401) {
                  if (id(music_category_page) == 1) {
                    id(selected_category_mode) = "artist";
                    id(selected_category_title) = "ARTISTS";
                  } else if (id(music_category_page) == 2) {
                    id(selected_category_mode) = "radio";
                    id(selected_category_title) = "RADIO";
                  }
                  if (id(music_category_page) <= 2) {
                    id(music_browse_page) = 1;
                    id(music_overlay_mode) = 3;
                    id(slot_1_name) = "Loading...";
                    id(slot_1_id) = "";
                    id(slot_2_name) = "";
                    id(slot_2_id) = "";
                    id(slot_3_name) = "";
                    id(slot_3_id) = "";
                    id(music_browse_total_pages) = 1;
                    id(music_browse_has_prev) = false;
                    id(music_browse_has_next) = false;
                    id(disp1).update();
                    id(fetch_music_browse).execute();
                  }
                // Left Arrow (Prev Category Page): x: 65..155, y: 325..380
                } else if (touch.x >= 65 && touch.x <= 155 && touch.y >= 325 && touch.y <= 380) {
                  if (id(music_category_page) > 1) {
                    id(music_category_page)--;
                    id(disp1).update();
                  }
                // Right Arrow (Next Category Page): x: 311..401, y: 325..380
                } else if (touch.x >= 311 && touch.x <= 401 && touch.y >= 325 && touch.y <= 380) {
                  if (id(music_category_page) < 3) {
                    id(music_category_page)++;

      - delay: 200ms
      - lambda: |-
          id(music_overlay_mode) = 0;
          id(music_hud_active) = true;
          id(music_hud_timer) = millis();
      - component.update: disp1

  - id: select_music_slot
    mode: restart
    then:
      - delay: 0ms
      - if:
          condition:
            lambda: 'return id(selected_category_mode) == "speakers";'
          then:
            - lambda: |-
                id(music_action_feedback) = "Transferring -> " + id(selected_slot_name);
                id(music_feedback_timer) = millis();
                if (id(active_speaker_entity) == "${local_player_id}" && id(selected_slot_id) != "${local_player_id}") {
                  if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
                    auto call = id(pocket_music_player).make_call();
                    call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_PAUSE);
                    call.perform();
                  }
                }
            - homeassistant.action:
                action: music_assistant.transfer_queue
                data:
                  entity_id: !lambda 'return id(selected_slot_id).c_str();'
                  source_player: !lambda 'return id(active_speaker_entity).c_str();'
                  auto_play: !lambda |-
                    bool source_playing = false;
                    if (id(active_speaker_entity) == "${local_player_id}") {
                      source_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
                    } else {
                      source_playing = (id(ha_target_state).state == "playing");
                    }
                    return source_playing ? "true" : "false";
            - lambda: |-
                if (id(selected_slot_id).rfind("media_player.", 0) == 0) {
                  if (id(active_speaker_entity) != id(selected_slot_id) && !id(active_speaker_entity).empty()) {
                    id(last_speaker_entity) = id(active_speaker_entity);
                  }
                  id(active_speaker_entity) = id(selected_slot_id);
                  id(active_speaker_name) = id(selected_slot_name);
                  id(music_action_feedback) = "Active: " + id(selected_slot_name);
                } else {
                  ESP_LOGW("ui", "Rejecting non-media_player speaker slot: %s", id(selected_slot_id).c_str());
                  id(music_action_feedback) = "Invalid Speaker";
                }
                id(music_feedback_timer) = millis();
            - homeassistant.action:
                action: input_text.set_value
                data:
                  entity_id: ${active_speaker_helper}
                  value: !lambda 'return id(active_speaker_entity).c_str();'
            - if:
                condition:
                  lambda: 'return (id(active_speaker_entity) != "${local_player_id}");'
                then:
                  - lambda: 'id(current_loaded_art_url) = "";'
            - if:
                condition:
                  lambda: 'return id(active_speaker_entity) == "${local_player_id}";'
                then:
                  - lambda: 'id(current_loaded_art_url) = "";'
                  - online_image.release: remote_album_art
            - component.update: disp1
            - delay: 200ms
            - lambda: |-
                id(music_overlay_mode) = 0;
            - component.update: disp1
          else:

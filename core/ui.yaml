              // Chocolate Chip Cookie right in front of the hungry mouth
              render_chomp_treat(it, icon_x + 32, icon_y - 16, 0,
                                 id(col_white), id(col_red), id(col_gold), id(col_cyan),
                                 id(col_green), id(col_magenta), id(col_bg));
              // Strawberry below right
              render_chomp_treat(it, icon_x + 42, icon_y + 20, 1,
                                 id(col_white), id(col_red), id(col_gold), id(col_cyan),
                                 id(col_green), id(col_magenta), id(col_bg));
            } else if (g_idx == 4) {
              // ------------------------------------------------------------------
              // GAME 4: ASTEROIDS — Vector Starship, Space Rocks & Alien UFO
              // ------------------------------------------------------------------
              it.filled_circle(icon_x, icon_y, 52, Color(12, 16, 24));
              it.circle(icon_x, icon_y, 52, id(col_slate));
              it.circle(icon_x, icon_y, 51, id(col_slate));

              // Stardust background dots
              it.draw_pixel_at(icon_x + 35, icon_y - 30, id(col_silver));
              it.draw_pixel_at(icon_x - 35, icon_y + 30, id(col_silver));
              it.draw_pixel_at(icon_x + 30, icon_y + 35, id(col_white));

              // Large & Small vector asteroids via shared primitive
              render_asteroids_rock(it, icon_x + 17.0f, icon_y - 12.0f, 19.0f, 0, 0.3f, id(col_white), id(col_dark_gray));
              render_asteroids_rock(it, icon_x + 26.0f, icon_y + 22.0f, 9.0f, 1, 1.1f, id(col_silver), id(col_dark_gray));

              // Mini Alien UFO Flying Saucer in upper-left sector
              render_asteroids_ufo(it, icon_x - 20, icon_y - 22, 0.78f, 0,
                                   id(col_white), id(col_cyan), id(col_magenta), id(col_green), id(col_gold));

              // Vector Player Starship aiming at -45 deg + Photon Torpedo Blast
              int sx = icon_x - 16, sy = icon_y + 18;
              render_asteroids_ship(it, sx, sy, -0.785398f, 0.95f, true,
                                    id(col_white), id(col_silver), id(theme_secondary), id(col_orange));
              it.filled_circle(sx + 16, sy - 16, 2, id(col_white));
              it.line(sx + 16, sy - 16, sx + 11, sy - 11, id(theme_secondary));
            }
          };

          // Full Game Card Composite (Icon + Title + High Score)
          auto draw_game_card = [&](int g_idx, int icon_x, int icon_y, int text_center_x, int title_y, int score_y) {
            const char* title = "MARBLES";
            int score = id(high_score_marbles);
            if (g_idx == 0) {
              title = "MARBLES";
              score = id(high_score_marbles);
            } else if (g_idx == 1) {
              title = "ARCHERY";
              score = id(high_score_archery);
            } else if (g_idx == 2) {
              title = "BREAKOUT";
              score = id(high_score_breakout);
            } else if (g_idx == 3) {
              title = "CHOMP FOR KIDS";
              score = id(high_score_chomp);
            } else {
              title = "ASTEROIDS";
              score = id(high_score_asteroids);
            }

            // 1. Game Icon at (icon_x, icon_y)
            if (icon_y >= 40 && icon_y <= 380) {
              draw_game_icon(g_idx, icon_x, icon_y);
            }

            // 2. Game Title at (text_center_x, title_y)
            if (title_y >= 140 && title_y <= 295) {
              it.print(text_center_x, title_y, id(font_btn_bold), id(col_white), TextAlign::CENTER, title);
            }

            // 3. High Score at (text_center_x, score_y)
            if (score_y >= 140 && score_y <= 295) {
              char sc_buf[32];
              if (score > 0) snprintf(sc_buf, sizeof(sc_buf), "HIGH SCORE: %d", score);
              else snprintf(sc_buf, sizeof(sc_buf), "HIGH SCORE: --");
              it.print(text_center_x, score_y, id(font_small), id(col_gold), TextAlign::CENTER, sc_buf);
            }
          };

          int icon_cx = 110;
          int card_cy = 220;
          int text_cx = 285;
          int base_title_y = 200;
          int base_score_y = 240;

          if (id(menu_scroll_active)) {
            int step = id(menu_scroll_step);
            if (step > 4) step = 4;
            int offset = SHARED_SCROLL_EASE_174[step];
            int dir = id(menu_scroll_dir);

            int out_shift = -dir * offset;
            int in_shift = dir * (174 - offset);

            int out_idx = id(game_carousel_idx);
            int in_idx = id(menu_scroll_target_page);

            draw_game_card(out_idx, icon_cx, card_cy + out_shift, text_cx, base_title_y + out_shift, base_score_y + out_shift);
            draw_game_card(in_idx, icon_cx, card_cy + in_shift, text_cx, base_title_y + in_shift, base_score_y + in_shift);
          } else {
            draw_game_card(id(game_carousel_idx), icon_cx, card_cy, text_cx, base_title_y, base_score_y);
          }

          // Top Viewport Mask (lines up with apex of upper chevron at y = 158)
          it.filled_rectangle(0, 0, 466, 158, id(col_bg));
          it.print(cx, 96, id(font_games_title), id(theme_primary), TextAlign::CENTER, "GAMES");

          // Bottom Viewport Mask (lines up with apex of lower chevron at y = 282)
          it.filled_rectangle(0, 282, 466, 184, id(col_bg));

          // Taller Action Button: "PLAY" moved up 3px to y = 349 (r = 22, height = 44px, font_btn_bold)
          draw_hero_button(cx - 55, cx + 55, 349, 22, id(theme_primary), id(col_dark_gray), "PLAY", id(col_white));

          // Standardized Right-Flank Vertical Chevrons (x = 415, Up at 162, Down at 278)
          // Always visible in true continuous carousel mode
          draw_right_flank_chevrons(true, true);

        // ----------------------------------------------------
        // GAME 1: MARBLES (ARCADE WAVE & DIAMOND BUMPER CHALLENGE)
        // ----------------------------------------------------
        } else if (id(active_game) == 1) {
          render_game_marbles(
              it, cx, cy, millis(), game_just_entered, roll_delta, pitch_delta,
              id(marble_touch_x), id(marble_touch_y), id(game_btn_pressed), id(high_score_marbles),
              id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_white), id(col_gold), id(col_cyan), id(col_green),
              id(col_red), id(col_orange), id(col_magenta), id(col_slate), id(col_gray), id(col_dark_gray));

        // ----------------------------------------------------
        // GAME 2: ARCHERY (ARCADE ROUNDS, RECURVE BOW & PINNED ARROWS)
        // ----------------------------------------------------
        } else if (id(active_game) == 2) {
          render_game_archery(
              it, cx, cy, millis(), game_just_entered, roll_delta, pitch_delta,
              id(marble_touch_x), id(game_btn_pressed), id(high_score_archery),
              id(font_date), id(font_small), id(theme_secondary),
              id(col_bg), id(col_white), id(col_black), id(col_gold),

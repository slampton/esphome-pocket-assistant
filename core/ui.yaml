    id: imu_pitch
    internal: true

  - platform: qmi8658
    name: "IMU Temperature"
    id: imu_temp
    entity_category: diagnostic
    filters:
      - delta: 0.5

  - platform: template
    name: "Dynamic Motion Delta"
    id: motion_mag
    unit_of_measurement: "g"
    accuracy_decimals: 3
    update_interval: 200ms
    internal: true
    lambda: |-
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;
      if (isnan(x) || isnan(y) || isnan(z)) return NAN;

      static float grav_x = 0.0f;
      static float grav_y = 0.0f;
      static float grav_z = 1.0f;
      const float alpha = 0.08f;
      grav_x = (1.0f - alpha) * grav_x + alpha * x;
      grav_y = (1.0f - alpha) * grav_y + alpha * y;
      grav_z = (1.0f - alpha) * grav_z + alpha * z;

      float dx = x - grav_x;
      float dy = y - grav_y;
      float dz = z - grav_z;
      float delta = sqrtf(dx*dx + dy*dy + dz*dz);

      // Shake-to-trigger detection for Coin Flip (subpage 3) and Dice Roll (subpage 4)
      if (id(gui_page) == 8 && id(display_power_state) == 0) {
        static uint32_t last_shake_time = 0;
        uint32_t now_m = millis();
        if (delta > 0.45f && (now_m - last_shake_time > 800)) {
          last_shake_time = now_m;
          if (id(stuff_subpage) == 8 && !id(coin_anim_active)) {
            id(coin_anim_active) = true;
            id(coin_anim_start_ms) = now_m;
            id(coin_side) = (esp_random() % 2);
            id(disp1).update();
          } else if (id(stuff_subpage) == 4 && !id(dice_anim_active)) {
            id(dice_anim_active) = true;
            id(dice_anim_start_ms) = now_m;
            id(dice_val_d6) = (esp_random() % 6) + 1;
            id(dice_val_d6_2) = (esp_random() % 6) + 1;
            id(disp1).update();
          }
        }
      }

      return delta;



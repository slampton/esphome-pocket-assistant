interval:
  - interval: 5min
    then:
      - script.execute: sync_display_brightness
  - interval: 60min
    then:
      - lambda: |-
          // Priority 1: Periodic thermal drift compensation for RTC slow clock
          extern uint32_t rtc_clk_cal(int cal_clk, uint32_t slow_clk_cycles) __asm__("rtc_clk_cal");
          uint32_t cal_val = rtc_clk_cal(0, 1024);
          ESP_LOGD("rtc_cal", "Periodic RTC slow clock calibration: %lu", (unsigned long)cal_val);

  - interval: 100ms
    then:
      - lambda: |-
          // Active Update Check animation refresh
          if (id(gui_page) == 4 && id(system_menu_mode) == 5 && id(update_check_state) > 0 && !id(va_active) && id(va_status_text).empty()) {
            id(disp1).update();
          }

          // Music Overlay HUD Auto-Dismissal (5.0s timeout in Full Screen / Letterbox)
          if (id(gui_page) == 2 && id(music_overlay_mode) == 0 && id(music_hud_active)) {
            if (millis() - id(music_hud_timer) >= 5000) {
              id(music_hud_active) = false;
              id(disp1).update();
            }
          }

          // Smooth animation refresh while Music loading screen is active
          if (id(gui_page) == 2 && id(music_overlay_mode) == 0 && !id(album_art_loaded) && (millis() < 15000 || !id(current_loaded_art_url).empty()) && !id(va_active) && id(va_status_text).empty()) {
            id(disp1).update();
          }

          // Dynamic display update for Stopwatch (150ms = ~6.7 FPS: smooth mechanical sweep, 77% CPU idle window for touch)
          if (id(display_brightness).current_values.is_on()) {
            if (id(gui_page) == 1 && id(stopwatch_running) && !id(va_active) && id(va_status_text).empty()) {


              static uint32_t last_chrono_disp_update = 0;
              uint32_t now_chrono_ms = millis();
              if (now_chrono_ms - last_chrono_disp_update >= 150) {
                last_chrono_disp_update = now_chrono_ms;
                id(disp1).update();
              }
            }

          }

  - interval: 50ms
    then:
      - lambda: |-
          // 20 FPS high-refresh physics loop exclusively for active games
          if (id(display_brightness).current_values.is_on() && id(gui_page) == 3 && id(active_game) > 0 && !id(va_active) && id(va_status_text).empty()) {
            id(disp1).update();
          }

          // High-refresh fluid Voice Assistant loop
          // While Listening/Thinking: 50ms (20 FPS) fluid organic breathing (speaker silent, zero DMA contention)
          // While Speaking: precisely paced by va_speech_anim_interval (default 100ms, safe floor 75ms, restore_value enabled)
          if (id(va_active) || !id(va_status_text).empty()) {
            static uint32_t last_va_anim_time = 0;
            static bool prev_tts_active = false;
            uint32_t now_va_ms = millis();

            // Smooth state transition: When speech starts, reserve quiet bus air for DAC unmute and first syllables
            if (id(va_tts_received) != prev_tts_active) {
              prev_tts_active = id(va_tts_received);
              last_va_anim_time = now_va_ms;
              return;
            }

            uint32_t cadence = 50;
            if (id(va_tts_received)) {
              cadence = (uint32_t)id(va_speech_anim_interval).state;
              if (cadence < 75) cadence = 75;
            }
            if (now_va_ms - last_va_anim_time >= cadence) {
              last_va_anim_time = now_va_ms;
              id(disp1).update();
            }
          }

          // Dynamic Atmospheric Motion Wallpaper with Asymmetric Audio-Protected Cadence
          // Active particle animation loop: 100ms (10 FPS) for falling precipitation (rain/snow/sleet/lightning) and star twinkle
          // Static weather conditions (sunny, partly cloudy, cloudy, overcast) run on default 1s display cadence with near-zero CPU load
          if (id(display_brightness).current_values.is_on() && id(display_power_state) == 0 && id(gui_page) == 5 && id(sky_weather_subpage) == 0 && !id(va_active) && id(va_status_text).empty()) {
            std::string c_cond = id(ha_weather_condition).state;
            std::string s_opt = std::string(id(weather_sim_condition).current_option().c_str());
            if (!s_opt.empty() && s_opt != "Live (Home Assistant)") {
              if (s_opt == "Clear Night") c_cond = "clear-night";
              else if (s_opt.find("Rain") != std::string::npos) c_cond = "rainy";
              else if (s_opt.find("Snow") != std::string::npos) c_cond = "snowy";
              else if (s_opt.find("Thunderstorm") != std::string::npos) c_cond = "lightning-rainy";
              else if (s_opt.find("Partly") != std::string::npos) c_cond = "partlycloudy";
              else if (s_opt.find("Cloudy") != std::string::npos) c_cond = "cloudy";
              else c_cond = "sunny";
            }
            std::string s_sun = id(ha_sun_state).state;
            bool is_night_time = (s_sun == "below_horizon" || c_cond == "clear-night" || c_cond == "clearnight" || (c_cond.find("night") != std::string::npos));
            bool has_motion = (c_cond.find("rain") != std::string::npos ||
                               c_cond.find("pouring") != std::string::npos ||
                               c_cond.find("drizzle") != std::string::npos ||
                               c_cond.find("snow") != std::string::npos ||
                               c_cond.find("sleet") != std::string::npos ||
                               c_cond.find("lightning") != std::string::npos ||
                               c_cond.find("thunder") != std::string::npos ||
                               (is_night_time && (c_cond == "clear-night" || c_cond == "clearnight")));
            if (has_motion) {
              static uint32_t last_weather_disp_update = 0;
              uint32_t now_w_ms = millis();
              bool audio_busy = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                id(va_active) || !id(va_status_text).empty() ||
                                id(alarm_ringing) || id(timer_ringing);
              uint32_t target_cadence = id(va_tts_received) ? 500 : (audio_busy ? 300 : 100);
              if (now_w_ms - last_weather_disp_update >= target_cadence) {
                last_weather_disp_update = now_w_ms;
                id(disp1).update();
              }
            }
          }

  - interval: 250ms
    then:
      - lambda: |-
          // ------------------------------------------------------------------
          // COUNTDOWN TIMER TICK & ALERT TRIGGER
          // ------------------------------------------------------------------
          if (id(timer_running)) {
            uint32_t now_ms = millis();
            if (now_ms >= id(timer_target_ms)) {
              id(timer_running) = false;
              id(timer_paused) = false;
              id(timer_remaining_sec) = 0;
              id(timer_ringing) = true;
              id(gui_page) = 6;
              id(timer_alarm_subpage) = 0;
              id(wake_to_active_state).execute();
              id(play_alarm_sound).execute();
              id(disp1).update();
              ESP_LOGI("timer", "Countdown timer expired! Firing alert.");
            } else {
              int rem = (id(timer_target_ms) - now_ms + 999) / 1000;
              if (rem != id(timer_remaining_sec)) {
                id(timer_remaining_sec) = rem;
                if (!id(va_active) && id(va_status_text).empty()) {
                  if (id(gui_page) == 6 && id(timer_alarm_subpage) == 0 && id(display_power_state) == 0) {
                    id(disp1).update();
                  }
                }
              }
            }
          }

          // Periodic display refresh during active alarm or timer ringing
          if ((id(alarm_ringing) || id(timer_ringing)) && id(display_power_state) == 0) {
            if (!id(va_active) && id(va_status_text).empty()) {
              id(disp1).update();
            }
          }


  - interval: 1s
    then:
      - lambda: |-
          // ------------------------------------------------------------------
          // ALARM ENGINE: SCHEDULE EVALUATION & SNOOZE CHECK
          // ------------------------------------------------------------------
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            uint32_t now_epoch = now.timestamp;

            // 1. Snooze expiration check
            if (id(alarm_snooze_until) > 0 && now_epoch >= id(alarm_snooze_until)) {
              id(alarm_snooze_until) = 0;
              id(alarm_ringing) = true;
              id(gui_page) = 6;
              id(timer_alarm_subpage) = 1;
              id(wake_to_active_state).execute();
              id(play_alarm_sound).execute();
              id(disp1).update();
              ESP_LOGI("alarm", "Snoozed alarm firing now!");
              return;
            }

            // 2. Regular scheduled alarms check (on second == 0)
            if (now.second == 0 && now.minute != id(alarm_last_fired_min)) {
              auto check_alarm = [&](int a_hr, int a_min, bool a_en, int a_rec, int a_num) -> bool {
                if (!a_en) return false;
                if (now.hour != a_hr || now.minute != a_min) return false;
                // Recurrence: 0=Daily, 1=Weekdays, 2=Weekends, 3=Once
                // ESPHome ESPTime::day_of_week: 1=SUN, 2=MON, ..., 6=FRI, 7=SAT
                if (a_rec == 1) { // Weekdays
                  if (now.day_of_week < 2 || now.day_of_week > 6) return false;
                } else if (a_rec == 2) { // Weekends
                  if (now.day_of_week != 1 && now.day_of_week != 7) return false;
                }
                return true;
              };

              bool triggered = false;
              int trig_idx = 0;
              if (check_alarm(id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled), id(alarm1_recurrence), 1)) {
                triggered = true;
                trig_idx = 1;
                if (id(alarm1_recurrence) == 3) id(alarm1_enabled) = false; // Once: auto-disable
              } else if (check_alarm(id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled), id(alarm2_recurrence), 2)) {
                triggered = true;
                trig_idx = 2;
                if (id(alarm2_recurrence) == 3) id(alarm2_enabled) = false; // Once: auto-disable
              }

              if (triggered) {
                id(alarm_last_fired_min) = now.minute;
                id(alarm_ringing) = true;
                id(alarm_ringing_idx) = trig_idx;
                id(gui_page) = 6;
                id(timer_alarm_subpage) = 1;
                id(wake_to_active_state).execute();
                id(play_alarm_sound).execute();
                id(disp1).update();
                ESP_LOGI("alarm", "Alarm %d triggered! Ringing started.", trig_idx);
              }
            }
          }




            }

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: pocket_wifi_signal
    update_interval: 60s

  - platform: motion
    motion_id: imu
    type: acceleration_x
    name: "Accel X"
    id: accel_x
    internal: true
  - platform: motion
    motion_id: imu
    type: acceleration_y
    name: "Accel Y"
    id: accel_y
    internal: true
  - platform: motion
    motion_id: imu
    type: acceleration_z
    name: "Accel Z"
    id: accel_z
    internal: true
  - platform: motion
    motion_id: imu
    type: roll
    name: "Roll"
    id: imu_roll
    internal: true
  - platform: motion
    motion_id: imu
    type: pitch
    name: "Pitch"
    id: imu_pitch
    internal: true

  - platform: qmi8658
    name: "IMU Temperature"
    id: imu_temp
    entity_category: diagnostic
    filters:
      - delta: 0.5

  - platform: template
    name: "Dynamic Motion Delta"
    id: motion_mag
    unit_of_measurement: "g"
    accuracy_decimals: 3
    update_interval: 200ms
    internal: true
    lambda: |-
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;
      if (isnan(x) || isnan(y) || isnan(z)) return NAN;

      // Gravity low-pass filter (alpha = 0.20 absorbs static tilt quickly within ~500ms)
      static float grav_x = 0.0f;
      static float grav_y = 0.0f;
      static float grav_z = 1.0f;
      const float alpha = 0.20f;
      grav_x = (1.0f - alpha) * grav_x + alpha * x;
      grav_y = (1.0f - alpha) * grav_y + alpha * y;
      grav_z = (1.0f - alpha) * grav_z + alpha * z;

      float dx = x - grav_x;
      float dy = y - grav_y;
      float dz = z - grav_z;
      float delta = sqrtf(dx*dx + dy*dy + dz*dz);
      float planar_dyn = sqrtf(dx*dx + dy*dy);

      // Omnidirectional Natural Shake Detection for Tools Suite (Page 8)
      // Effortless, natural shake response calibrated with lighter actuation thresholds:
      // Triggers easily on gentle wrist snaps (planar flick >= 0.46g, or vertical dip / 3D shake >= 0.49g),
      // while alpha=0.20 filter and 1200ms lockout prevent false triggers from tilts and table set-downs.
      if (id(gui_page) == 8 && id(display_power_state) == 0) {
        static uint32_t last_shake_time = 0;
        uint32_t now_m = millis();

        bool is_deliberate_shake = (planar_dyn >= 0.46f || delta >= 0.49f);

        if (is_deliberate_shake && (now_m - last_shake_time > 1200)) {
          last_shake_time = now_m;
          if (id(stuff_subpage) == 8 && !id(coin_anim_active)) {
            id(coin_anim_active) = true;
            id(coin_anim_start_ms) = now_m;
            id(coin_side) = (esp_random() % 2);
          } else if (id(stuff_subpage) == 4 && !id(dice_anim_active)) {
            id(dice_anim_active) = true;
            id(dice_anim_start_ms) = now_m;
            id(dice_val_d6) = (esp_random() % 6) + 1;
            id(dice_val_d6_2) = (esp_random() % 6) + 1;
          }
        }
      }

      return delta;



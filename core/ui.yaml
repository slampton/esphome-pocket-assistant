    lambda: 'return id(alarm_ringing) || id(timer_ringing);'
    entity_category: diagnostic
    icon: "mdi:alarm-bell"
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    name: "Boot Button"
    id: boot_button
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(is_locked);'
            then:
              - lambda: |-
                  static uint32_t last_btn_press = 0;
                  uint32_t now = millis();
                  if (now - last_btn_press < 150) return;
                  last_btn_press = now;
              - if:
                  condition:
                    lambda: 'return id(active_game) > 0;'
                  then:
                    - lambda: 'id(game_btn_pressed) = true;'
                  else:
                    - if:
                        condition:
                          lambda: |-
                            return id(va_active) || !id(va_status_text).empty();
                        then:
                          - script.execute: cancel_voice_assistant
                        else:
                          - lambda: |-
                              // If waking from screen-off or standby, check Assist Screen Wake preference
                              if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
                                if (id(va_wake_screen_switch).state) {
                                  id(wake_to_active_state).execute();
                                }
                              } else {
                                id(screen_sleep_timer).execute();
                              }
                          - script.execute: pause_all_music
                          - delay: 150ms
                          - script.execute: route_i2s_to_mic
                          - lambda: 'id(va_tts_received) = false;'
                          - voice_assistant.start:


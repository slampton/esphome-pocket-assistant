              int pad_x = icon_x - 4, pad_y = icon_y + 26, pad_w = 42, pad_h = 8;
              render_breakout_paddle(it, pad_x, pad_y, pad_w, pad_h, id(theme_primary), id(col_white));

              // Ball rebounding upward off the paddle toward the shattering brick
              int ball_x = icon_x + 9, ball_y = icon_y + 5;
              it.filled_circle(pad_x + 2, pad_y - 6, 2, Color(65, 52, 18));
              it.filled_circle(pad_x + 6, pad_y - 11, 3, Color(120, 95, 25));
              it.filled_circle(ball_x - 3, ball_y + 5, 4, Color(185, 145, 35));
              it.filled_circle(ball_x, ball_y, 5, id(col_gold));
              it.circle(ball_x, ball_y, 5, id(col_white));
              it.filled_circle(ball_x - 2, ball_y - 2, 1, id(col_white));

            } else if (g_idx == 3) {
              // ------------------------------------------------------------------
              // GAME 3: CHOMP FOR KIDS — Cute Cookie-Monster Friend & 3 Treats
              // ------------------------------------------------------------------
              render_chomp_monster(it, icon_x - 16, icon_y + 4, 34, 0.85f, -0.15f,
                                   true, false, false, 0,

                // Hero Button (Start / Pause / Resume): y in [228..284], x in [140..326]
                if (touch.y >= 228 && touch.y <= 284 && touch.x >= 140 && touch.x <= 326) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    if (!id(timer_running) && !id(timer_paused)) {
                      id(timer_running) = true;
                      id(timer_paused) = false;
                      id(timer_remaining_sec) = id(timer_duration_sec);
                      id(timer_target_ms) = millis() + (id(timer_duration_sec) * 1000);
                      id(disp1).update();
                    } else if (id(timer_running)) {
                      id(timer_running) = false;
                      id(timer_paused) = true;
                      id(timer_remaining_sec) = (id(timer_target_ms) > millis()) ? ((id(timer_target_ms) - millis() + 999) / 1000) : 0;
                      id(disp1).update();
                    } else if (id(timer_paused)) {
                      id(timer_running) = true;
                      id(timer_paused) = false;
                      id(timer_target_ms) = millis() + (id(timer_remaining_sec) * 1000);
                      id(disp1).update();
                    }
                  }
                  return;
                }

                // Quick Stepper Row: y in [295..348] (Rapid 100ms debounce + contiguous horizontal partitions)
                if (touch.y >= 295 && touch.y <= 348) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_stuff_tap = now_stuff;
                    if (!id(timer_running) && !id(timer_paused)) {
                      if (touch.x >= 40 && touch.x <= 132) {
                        id(timer_duration_sec) = clamp(id(timer_duration_sec) - 300, 60, 3600);
                        id(timer_remaining_sec) = id(timer_duration_sec);
                        id(disp1).update();
                        return;
                      } else if (touch.x >= 133 && touch.x <= 225) {
                        id(timer_duration_sec) = clamp(id(timer_duration_sec) - 60, 60, 3600);
                        id(timer_remaining_sec) = id(timer_duration_sec);
                        id(disp1).update();
                        return;
                      } else if (touch.x >= 241 && touch.x <= 333) {
                        id(timer_duration_sec) = clamp(id(timer_duration_sec) + 60, 60, 3600);
                        id(timer_remaining_sec) = id(timer_duration_sec);
                        id(disp1).update();
                        return;
                      } else if (touch.x >= 334 && touch.x <= 426) {
                        id(timer_duration_sec) = clamp(id(timer_duration_sec) + 300, 60, 3600);
                        id(timer_remaining_sec) = id(timer_duration_sec);
                        id(disp1).update();
                        return;
                      }
                    } else {
                      // Reset Button (x in 150..316)
                      if (touch.x >= 150 && touch.x <= 316) {
                        id(timer_running) = false;
                        id(timer_paused) = false;
                        id(timer_remaining_sec) = id(timer_duration_sec);
                        id(disp1).update();
                      }
                      return;
                    }
                  }
                }

                // Readout Tap to reset default 5m: y in [120..178], x in [140..326]
                if (touch.y >= 120 && touch.y <= 178 && touch.x >= 140 && touch.x <= 326) {
                  if (!id(timer_running) && !id(timer_paused)) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_stuff_tap = now_stuff;
                      id(timer_duration_sec) = 300;
                      id(timer_remaining_sec) = 300;
                      id(disp1).update();
                    }
                  }
                  return;
                }

              } else if (id(stuff_subpage) == 2) {
                // ----------------------------------------------------
                // SUBPAGE 2: ALARMS TOUCH HANDLING
                // ----------------------------------------------------
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    if (id(alarm_edit_idx) > 0) {
                      id(alarm_edit_idx) = 0; // Exit editor back to alarm list
                    } else {
                      id(stuff_subpage) = 0;  // Exit alarm list back to Tools menu
                    }
                    id(disp1).update();
                  }
                  return;
                }

                if (id(alarm_edit_idx) == 0) {
                  // Alarm list view:
                  // Snooze dismiss tap if snoozed
                  if (id(alarm_snooze_until) > 0 && (id(alarm_ringing_idx) == 1 || id(alarm_ringing_idx) == 0)) {
                    if (touch.y >= 110 && touch.y <= 202 && touch.x >= 50 && touch.x <= 385) {
                      if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_stuff_tap = now_stuff;
                        id(alarm_snooze_until) = 0;
                        id(disp1).update();
                      }
                      return;
                    }
                  }
                  if (id(alarm_snooze_until) > 0 && id(alarm_ringing_idx) == 2) {
                    if (touch.y >= 216 && touch.y <= 308 && touch.x >= 50 && touch.x <= 385) {
                      if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_stuff_tap = now_stuff;
                        id(alarm_snooze_until) = 0;
                        id(disp1).update();
                      }
                      return;
                    }
                  }

                  // Alarm 1 Card: y in [110..202] (centered at y=156)
                  if (touch.y >= 110 && touch.y <= 202 && touch.x >= 50 && touch.x <= 385) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_stuff_tap = now_stuff;
                      if (touch.x >= 310) {
                        id(alarm1_enabled) = !id(alarm1_enabled);
                        if (!id(alarm1_enabled) && id(alarm_ringing_idx) <= 1) id(alarm_snooze_until) = 0;
                      } else {
                        id(alarm_edit_idx) = 1;
                      }
                      id(disp1).update();
                    }
                    return;
                  }

                  // Alarm 2 Card: y in [216..308] (centered at y=262)
                  if (touch.y >= 216 && touch.y <= 308 && touch.x >= 50 && touch.x <= 385) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_stuff_tap = now_stuff;
                      if (touch.x >= 310) {
                        id(alarm2_enabled) = !id(alarm2_enabled);
                        if (!id(alarm2_enabled) && id(alarm_ringing_idx) == 2) id(alarm_snooze_until) = 0;
                      } else {
                        id(alarm_edit_idx) = 2;
                      }
                      id(disp1).update();
                    }
                    return;
                  }
                } else {
                  // Alarm editor view:
                  int edit_idx = id(alarm_edit_idx);
                  int& cur_h = (edit_idx == 2) ? id(alarm2_hour) : id(alarm1_hour);
                  int& cur_m = (edit_idx == 2) ? id(alarm2_minute) : id(alarm1_minute);
                  int& cur_rec = (edit_idx == 2) ? id(alarm2_recurrence) : id(alarm1_recurrence);

                  // Hour / Minute Steppers: y in [205..265] (Rapid 100ms debounce)
                  if (touch.y >= 205 && touch.y <= 265) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_RAPID) {
                      last_stuff_tap = now_stuff;
                      if (touch.x >= 80 && touch.x <= 145) {
                        cur_h = (cur_h - 1 + 24) % 24;
                        id(disp1).update();
                        return;
                      } else if (touch.x >= 146 && touch.x <= 212) {
                        cur_h = (cur_h + 1) % 24;
                        id(disp1).update();
                        return;
                      } else if (touch.x >= 254 && touch.x <= 318) {
                        cur_m = (cur_m - 5 + 60) % 60;
                        id(disp1).update();
                        return;
                      } else if (touch.x >= 319 && touch.x <= 386) {
                        cur_m = (cur_m + 5) % 60;
                        id(disp1).update();
                        return;
                      }
                    }
                  }

                  // Recurrence Pill: y in [275..320], x in [100..366]
                  if (touch.y >= 275 && touch.y <= 320 && touch.x >= 100 && touch.x <= 366) {
                    if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_stuff_tap = now_stuff;
                      cur_rec = (cur_rec + 1) % 4;
                      id(disp1).update();
                    }
                    return;
                  }
                }

              } else if (id(stuff_subpage) == 3) {
                // ----------------------------------------------------
                // SUBPAGE 3: STOPWATCH TOUCH HANDLING
                // ----------------------------------------------------
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    id(disp1).update();
                  }
                  return;
                }

                static uint32_t last_dial_tap = 0;
                static uint32_t last_lap_tap = 0;
                static uint32_t last_rst_tap = 0;
                uint32_t now_chrono_tap = millis();

                if (touch.y >= 280 && touch.y < 385) {
                  if (touch.x < 233) {
                    // LAP Action (Lower-left quadrant)
                    if (now_chrono_tap - last_lap_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_lap_tap = now_chrono_tap;
                      if (id(stopwatch_running)) {
                        id(stopwatch_lap_ms) = now_chrono_tap - id(stopwatch_start_time);
                      } else if (id(stopwatch_elapsed_ms) > 0) {
                        id(stopwatch_lap_ms) = id(stopwatch_elapsed_ms);
                      }
                      id(disp1).update();
                    }
                    return;
                  } else {
                    // RESET Action (Lower-right quadrant)
                    if (now_chrono_tap - last_rst_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_rst_tap = now_chrono_tap;
                      id(stopwatch_running) = false;
                      id(stopwatch_elapsed_ms) = 0;
                      id(stopwatch_lap_ms) = 0;
                      id(disp1).update();
                    }
                    return;
                  }
                } else if (touch.y >= 45 && touch.y < 280 && touch.x >= 65 && touch.x <= 401) {
                  // Upper Dial: START / STOP Toggle
                  if (now_chrono_tap - last_dial_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_dial_tap = now_chrono_tap;
                    if (!id(stopwatch_running)) {
                      id(stopwatch_running) = true;
                      id(stopwatch_start_time) = now_chrono_tap - id(stopwatch_elapsed_ms);
                      id(sleep_start_time) = 0;
                    } else {
                      id(stopwatch_running) = false;
                      id(stopwatch_elapsed_ms) = now_chrono_tap - id(stopwatch_start_time);
                    }
                    id(disp1).update();
                  }
                  return;
                }

              } else if (id(stuff_subpage) == 4) {
                // ----------------------------------------------------
                // SUBPAGE 4: DICE ROLL TOUCH HANDLING (ALWAYS DUAL D6)
                // ----------------------------------------------------
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    id(disp1).update();
                  }
                  return;
                }
                if (touch.y >= 385) return; // Chin guard: lower display taps never trigger accidental roll
                if (!id(dice_anim_active)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(dice_anim_active) = true;
                    id(dice_anim_start_ms) = millis();
                    id(dice_val_d6) = (esp_random() % 6) + 1;
                    id(dice_val_d6_2) = (esp_random() % 6) + 1;
                  }
                }

              } else if (id(stuff_subpage) == 5) {
                // ----------------------------------------------------
                // SUBPAGE 5: FLASHLIGHT TOUCH HANDLING (WHITE TORCH ONLY)
                // ----------------------------------------------------
                // Any tap anywhere on the screen exits back to Tools launcher
                if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_stuff_tap = now_stuff;
                  id(stuff_subpage) = 0;
                  id(sync_display_brightness).execute();
                  id(disp1).update();
                }
                return;

              } else if (id(stuff_subpage) == 6) {
                // ----------------------------------------------------
                // SUBPAGE 6: CALCULATOR TOUCH HANDLING
                // ----------------------------------------------------
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    // Auto-reset calculator state upon exit
                    id(calc_entry) = "0";
                    id(calc_history) = "";
                    id(calc_prev_val) = 0.0f;
                    id(calc_op) = 0;
                    id(calc_new_entry) = true;
                    id(disp1).update();
                  }
                  return;
                }
                // Keypad grid hit-testing (Seamless Partitioning & Rapid 100ms Debounce for Fast Entry)
                if (touch.x >= 78 && touch.x <= 388 && touch.y >= 112 && touch.y <= 384) {
                  int c = (touch.x < 157) ? 0 : ((touch.x < 233) ? 1 : ((touch.x < 309) ? 2 : 3));
                  int r = (touch.y < 165) ? 0 : ((touch.y < 219) ? 1 : ((touch.y < 273) ? 2 : ((touch.y < 327) ? 3 : 4)));

                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_stuff_tap = now_stuff;

                    auto compute_op = [](double a, double b, int op) -> double {
                      if (op == 1) return a + b;
                      if (op == 2) return a - b;
                      if (op == 3) return a * b;
                      if (op == 4) return (b != 0.0) ? (a / b) : NAN;
                      return b;
                    };

                    auto op_to_str = [](int op) -> const char* {
                      if (op == 1) return "+";
                      if (op == 2) return "-";
                      if (op == 3) return "x";
                      if (op == 4) return "/";
                      return "";
                    };

                    auto format_calc_num = [](double v) -> std::string {
                      if (std::isnan(v) || std::isinf(v)) return "Error";
                      char b[32];
                      if (std::abs(v - std::round(v)) < 1e-7 && std::abs(v) < 1e9) {
                        snprintf(b, sizeof(b), "%lld", (long long)std::round(v));
                        return std::string(b);
                      }
                      snprintf(b, sizeof(b), "%.8g", v);
                      return std::string(b);
                    };

                    if (r == 0 && c == 0) { // C
                      id(calc_entry) = "0";
                      id(calc_history) = "";
                      id(calc_prev_val) = 0.0f;
                      id(calc_op) = 0;
                      id(calc_new_entry) = true;
                    } else if (r == 0 && c == 1) { // ±
                      if (id(calc_entry) != "0" && id(calc_entry) != "Error") {
                        if (id(calc_entry)[0] == '-') id(calc_entry) = id(calc_entry).substr(1);
                        else id(calc_entry) = "-" + id(calc_entry);
                      }
                    } else if (r == 0 && c == 2) { // %
                      double cur = std::atof(id(calc_entry).c_str());
                      if (id(calc_op) == 1 || id(calc_op) == 2) { // Tip or discount
                        double pct_val = (double)id(calc_prev_val) * (cur / 100.0);
                        id(calc_entry) = format_calc_num(pct_val);
                        id(calc_new_entry) = false;
                      } else {
                        double pct_val = cur / 100.0;
                        id(calc_entry) = format_calc_num(pct_val);
                        id(calc_new_entry) = true;
                      }
                    } else if (r == 4 && c == 2) { // DEL
                      if (!id(calc_new_entry) && id(calc_entry) != "Error") {
                        if (id(calc_entry).length() > 1) {
                          id(calc_entry).pop_back();
                          if (id(calc_entry) == "-") id(calc_entry) = "0";
                        } else {
                          id(calc_entry) = "0";
                        }
                      }
                    } else if (c == 3) { // Operators: /, x, -, +, =
                      int new_op = 0;
                      if (r == 0) new_op = 4; // /
                      else if (r == 1) new_op = 3; // x
                      else if (r == 2) new_op = 2; // -
                      else if (r == 3) new_op = 1; // +
                      else if (r == 4) new_op = 5; // =

                      double cur = id(calc_entry).empty() ? (double)id(calc_prev_val) : std::atof(id(calc_entry).c_str());

                      if (new_op == 5) { // =
                        if (id(calc_op) != 0) {
                          std::string operand_str = id(calc_entry).empty() ? format_calc_num(cur) : id(calc_entry);
                          id(calc_history) = format_calc_num(id(calc_prev_val)) + " " + op_to_str(id(calc_op)) + " " + operand_str + " =";
                          double res = compute_op(id(calc_prev_val), cur, id(calc_op));
                          id(calc_entry) = format_calc_num(res);
                          id(calc_op) = 0;
                          id(calc_new_entry) = true;
                        }
                      } else { // Binary op (+, -, x, /)
                        if (id(calc_op) != 0 && !id(calc_new_entry) && !id(calc_entry).empty()) {
                          double res = compute_op(id(calc_prev_val), cur, id(calc_op));
                          id(calc_prev_val) = (float)res;
                        } else if (!id(calc_entry).empty()) {
                          id(calc_prev_val) = (float)cur;
                        }
                        id(calc_op) = new_op;
                        id(calc_new_entry) = true;
                        id(calc_history) = format_calc_num(id(calc_prev_val)) + " " + op_to_str(id(calc_op));
                        id(calc_entry) = format_calc_num(id(calc_prev_val)); // Keep operand visible while operator key highlights
                      }
                    } else if (r == 4 && c == 1) { // .
                      if (id(calc_new_entry) || id(calc_entry).empty()) {
                        id(calc_entry) = "0.";
                        id(calc_new_entry) = false;
                      } else if (id(calc_entry).find('.') == std::string::npos) {
                        id(calc_entry) += ".";
                      }
                    } else {
                      // Digits (0..9)
                      char digit = '0';
                      if (r == 4 && c == 0) digit = '0';
                      else if (r == 3 && c == 0) digit = '1';
                      else if (r == 3 && c == 1) digit = '2';
                      else if (r == 3 && c == 2) digit = '3';
                      else if (r == 2 && c == 0) digit = '4';
                      else if (r == 2 && c == 1) digit = '5';
                      else if (r == 2 && c == 2) digit = '6';
                      else if (r == 1 && c == 0) digit = '7';
                      else if (r == 1 && c == 1) digit = '8';
                      else if (r == 1 && c == 2) digit = '9';

                      if (id(calc_new_entry) || id(calc_entry).empty()) {
                        id(calc_entry) = std::string(1, digit);
                        id(calc_new_entry) = false;
                      } else {
                        if (id(calc_entry) == "0") id(calc_entry) = std::string(1, digit);
                        else if (id(calc_entry).length() < 9) id(calc_entry) += digit;
                      }
                    }

                    id(disp1).update();
                  }
                  return;
                }

              } else if (id(stuff_subpage) == 7) {
                // ----------------------------------------------------
                // SUBPAGE 7: BUBBLE LEVEL TOUCH HANDLING
                // ----------------------------------------------------
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    id(disp1).update();
                  }
                  return;
                }

              } else if (id(stuff_subpage) == 8) {
                // ----------------------------------------------------
                // SUBPAGE 8: COIN FLIP TOUCH HANDLING
                // ----------------------------------------------------
                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(stuff_subpage) = 0;
                    id(disp1).update();
                  }
                  return;
                }
                if (touch.y >= 385) return; // Chin guard: lower display taps never trigger accidental flip
                if (!id(coin_anim_active)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    id(coin_anim_active) = true;
                    id(coin_anim_start_ms) = millis();
                    id(coin_side) = (esp_random() % 2);
                  }
                }
              }
            }

    on_release:
      then:
        - lambda: |-
            id(hud_wake_finger_released) = true;
            ESP_LOGI("touch", "<<< Touch Released (page=%d)", id(gui_page));


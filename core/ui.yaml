                    if (now_sys - last_audio_vol_tap > TOUCH_DEBOUNCE_RAPID) {
                      last_audio_vol_tap = now_sys;
                      float new_vol = step_wrap_range(id(pocket_music_player).volume, 0.10f, 0.10f, 0.90f);

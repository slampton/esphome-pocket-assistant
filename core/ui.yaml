          snprintf(pg_buf, sizeof(pg_buf), "%d / %d", cur + 1, total);
          draw_pg = true;
        }

        if (draw_pg && pg_buf[0] != '\0') {
          it.print(cx + 1, 424 + 1, id(font_small), id(col_black), TextAlign::CENTER, pg_buf);
          it.print(cx, 424, id(font_small), id(col_white), TextAlign::CENTER, pg_buf);
        }
      }



touchscreen:
  - platform: cst9220
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x5A
    interrupt_pin:
      number: GPIO11
      mode: INPUT_PULLUP
    reset_pin: GPIO2
    touch_timeout: 50ms
    update_interval: 33ms
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            ESP_LOGI("touch", ">>> Touch Down: x=%d y=%d page=%d", touch.x, touch.y, id(gui_page));
            if (id(is_hibernating)) {
              if (id(hibernate_countdown_val) > 0) {
                // Touch on glass aborts 5-second countdown only (instant hibernate is unabortable)
                id(is_hibernating) = false;
                id(hibernate_countdown_val) = 0;
                id(wake_to_active_state).execute();
              }
              return;
            }
            // Rate-limit sleep timer reset to avoid restarting script 60x/sec during drags
            static uint32_t last_touch_activity = 0;
            uint32_t now_touch = millis();
            if (now_touch - last_touch_activity > 1000) {
              last_touch_activity = now_touch;
              id(screen_sleep_timer).execute(); // Activity watchdog reset on valid touch
            }
            // Standby Wake Handling: Guarded by tap_wake_mode (Always On, Docked Only, Disabled)
            if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
              std::string tw_mode = std::string(id(tap_wake_mode).current_option().c_str());
              if (tw_mode == "Disabled") return;
              if (tw_mode == "Docked Only" && !id(usb_connected).state) return;

              id(wake_to_active_state).execute();
              return;
            }

            // Voice Assistant Modal Takeover Interception & Tap to Cancel
            // Completely blocks touch events from leaking through to underlying page (e.g. media play/pause)
            if (id(va_active) || !id(va_status_text).empty()) {
              id(cancel_voice_assistant).execute();
              return;
            }

            // Alarm / Timer Ringing Takeover Interception: Dismiss / Snooze
            if (id(alarm_ringing) || id(timer_ringing)) {
              if (id(alarm_ringing)) {
                // SNOOZE button: y in [270..320], x in [110..356]
                if (touch.y >= 270 && touch.y <= 320 && touch.x >= 110 && touch.x <= 356) {
                  auto now = id(ha_time).now();
                  if (now.is_valid()) {
                    id(alarm_snooze_until) = now.timestamp + 300;
                  } else {
                    id(alarm_snooze_until) = (millis() / 1000) + 300;
                  }
                  id(alarm_ringing) = false;
                  id(stop_alarm_sound).execute();
                  id(disp1).update();
                  return;
                }
                // DISMISS button: y in [345..395], x in [120..346]
                if (touch.y >= 345 && touch.y <= 395 && touch.x >= 120 && touch.x <= 346) {
                  id(alarm_ringing) = false;
                  id(stop_alarm_sound).execute();
                  id(disp1).update();
                  return;
                }
              } else if (id(timer_ringing)) {
                // DISMISS button: y in [305..355], x in [110..356]
                if (touch.y >= 305 && touch.y <= 355 && touch.x >= 110 && touch.x <= 356) {
                  id(timer_ringing) = false;
                  id(stop_alarm_sound).execute();
                  id(disp1).update();
                  return;
                }
              }
              return;
            }

            // ==========================================
            // STANDARDIZED TOUCH TIMING & HIT-TESTING HIERARCHY (33ms / 30 Hz)
            // ==========================================
            constexpr uint32_t TOUCH_DEBOUNCE_RAPID   = 100; // ms: Rapid steppers (Volume, Timer +/-5m, Alarm steppers)
            constexpr uint32_t TOUCH_DEBOUNCE_BUTTON  = 150; // ms: Standard interactive buttons, pills, toggles, back navigation
            constexpr uint32_t TOUCH_DEBOUNCE_WAKE    = 180; // ms: Settling lockout absorbing trailing wake taps
            constexpr uint32_t TOUCH_DEBOUNCE_DISMISS = 200; // ms: Intentional overlay / HUD dismissal debounce
            constexpr uint32_t TOUCH_DEBOUNCE_SCROLL  = 250; // ms: Page transitions & wrap-around chevrons
            constexpr uint32_t TOUCH_GUARD_DISMISS    = 250; // ms: Minimum post-wake delay before dismissal

            auto is_back_button = [](const auto &t) -> bool {
              return (t.y >= 385 && t.y <= 445 && t.x >= 80 && t.x <= 386);
            };

            auto get_5slot_index = [](const auto &t, int x_min, int x_max) -> int {
              if (t.x < x_min || t.x > x_max) return -1;
              if (t.y >= 75  && t.y <= 133) return 0;
              if (t.y >= 134 && t.y <= 191) return 1;
              if (t.y >= 192 && t.y <= 249) return 2;
              if (t.y >= 250 && t.y <= 307) return 3;
              if (t.y >= 308 && t.y <= 374) return 4;
              return -1;
            };

            // Standardized Value Stepper & Clamping Helpers (Category 4)
            auto step_clamp = [](auto val, auto delta, auto min_val, auto max_val) {
              auto res = val + delta;
              if (res < min_val) return min_val;
              if (res > max_val) return max_val;
              return res;
            };

            auto step_wrap = [](int val, int delta, int count) -> int {
              if (count <= 0) return 0;
              int res = (val + delta) % count;
              if (res < 0) res += count;
              return res;
            };

            auto step_wrap_1based = [](int val, int delta, int count) -> int {
              if (count <= 1) return 1;
              int zero_based = (val - 1 + delta) % count;
              if (zero_based < 0) zero_based += count;
              return zero_based + 1;
            };

            auto step_wrap_range = [](auto val, auto delta, auto min_val, auto max_val) {
              auto next = val + delta;
              if (next > max_val + 0.001f) return min_val;
              if (next < min_val - 0.001f) return max_val;
              return next;
            };

            auto cycle_option = [](const std::string &cur, const std::vector<std::string> &opts) -> std::string {
              for (size_t i = 0; i < opts.size(); i++) {
                if (opts[i] == cur) return opts[(i + 1) % opts.size()];
              }
              return opts.empty() ? "" : opts[0];
            };

            static uint32_t last_back_tap = 0;

            // Helper lambda resolving active app slot indices from user deck configuration
            auto get_slot = [](int idx) -> int {
              if (idx == 0) return id(deck_slot_0);
              if (idx == 1) return id(deck_slot_1);
              if (idx == 2) return id(deck_slot_2);
              if (idx == 3) return id(deck_slot_3);
              if (idx == 4) return id(deck_slot_4);
              if (idx == 5) return id(deck_slot_5);
              if (idx == 6) return id(deck_slot_6);
              if (idx == 7) return id(deck_slot_7);
              if (idx == 8) return id(deck_slot_8);
              return 0;
            };

            // ==========================================
            // UNIVERSAL BOTTOM NAVIGATION TOUCH HANDLER
            // Paged submenus: y >= 399 with zero dead zone (x < 233 is Left, x >= 233 is Right).
            //   The < BACK button occupies y <= 398, eliminating all cross-talk!
            // Main App Deck: y >= 400 universally across all primary pages (0..6),
            //   establishing a clean 66px deck navigation hit zone (y: 400..465) around chevrons at y=424.
            // ==========================================
            bool is_deck_nav = !(id(gui_page) == 4 && id(system_menu_mode) > 0) &&
                               !(id(gui_page) == 3 && id(active_game) > 0) &&
                               !(id(gui_page) == 2 && id(music_overlay_mode) > 0) &&
                               !(id(gui_page) == 6 && id(alarm_edit_idx) > 0) &&
                               !(id(gui_page) == 7 && id(remote_subpage) > 0) &&
                               !(id(gui_page) == 8 && id(stuff_subpage) > 0) &&
                               !(id(alarm_ringing) || id(timer_ringing)) &&
                               !(id(gui_page) == 0 && !id(ha_time).now().is_valid());

            if (is_deck_nav) {
              int deck_y_thresh = 400;
              if (touch.y >= deck_y_thresh) {
                // App Deck Navigation: Full-width zero-deadzone deck flip with TOUCH_DEBOUNCE_BUTTON debounce
                static uint32_t last_deck_flip = 0;
                uint32_t now_flip = millis();
                if (now_flip - last_deck_flip > TOUCH_DEBOUNCE_BUTTON) {
                  last_deck_flip = now_flip;
                  int total = id(active_deck_size);
                  if (total > 1) {
                    if (touch.x < 233) {
                      int prev_idx = (id(current_deck_index) - 1 + total) % total;
                      id(current_deck_index) = prev_idx;
                      id(gui_page) = get_slot(prev_idx);
                    } else {
                      int next_idx = (id(current_deck_index) + 1) % total;
                      id(current_deck_index) = next_idx;
                      id(gui_page) = get_slot(next_idx);
                    }
                    ESP_LOGI("touch", "Deck Navigation: x=%d y=%d new_page=%d", touch.x, touch.y, id(gui_page));
                    id(music_overlay_mode) = 0; id(system_menu_mode) = 0; id(active_game) = 0;
                    id(sleep_menu_page) = 1; id(display_menu_page) = 1; id(deck_menu_page) = 1; id(audio_menu_page) = 1; id(menu_scroll_active) = false;
                    id(music_hud_active) = false; id(remote_subpage) = 0; id(stuff_subpage) = 0; id(stuff_menu_page) = 0;
                    id(disp1).update();
                  }
                }
                return;
              }
            }

            // Edge tap support for one-handed navigation in Browse Library, Speakers & Item Browser (Right-Flank Chevrons)
            if (id(gui_page) == 2 && id(music_overlay_mode) >= 1 && id(music_overlay_mode) <= 3 && touch.y >= 70 && touch.y <= 374) {
              if (touch.x < 75) {
                return; // Left flank has no chevrons in vertical navigation
              } else if (touch.x >= 375) {
                if (id(music_overlay_mode) == 2) {
                  if (id(menu_scroll_active)) return;
                  static uint32_t last_cat_scroll = 0;
                  uint32_t now_s = millis();
                  if (now_s - last_cat_scroll > TOUCH_DEBOUNCE_SCROLL) {
                    last_cat_scroll = now_s;
                    if (id(music_category_page) == 1) {
                      // Page 1: Scroll Down by 2 items (116px) to reveal Page 2
                      id(menu_scroll_active) = true;
                      id(menu_scroll_dir) = 1;
                      id(menu_scroll_target_page) = 2;
                      id(menu_scroll_step) = 0;
                      id(menu_scroll_transition).execute();
                    } else if (id(music_category_page) == 2) {
                      // Page 2: Scroll Up by 2 items (116px) to reveal Page 1
                      id(menu_scroll_active) = true;
                      id(menu_scroll_dir) = -1;
                      id(menu_scroll_target_page) = 1;
                      id(menu_scroll_step) = 0;
                      id(menu_scroll_transition).execute();
                    }
                  }
                  return;
                } else if (id(music_overlay_mode) == 1 || id(music_overlay_mode) == 3) {
                  if (id(music_browse_total_pages) > 1) {
                    static uint32_t last_browse_scroll = 0;
                    uint32_t now_s = millis();
                    if (now_s - last_browse_scroll > TOUCH_DEBOUNCE_SCROLL) {
                      last_browse_scroll = now_s;
                      id(music_browse_page) = step_wrap_1based(id(music_browse_page), (touch.y < 220) ? -1 : 1, id(music_browse_total_pages));
                      id(fetch_music_browse).execute();
                      id(disp1).update();
                    }
                  }
                  return;
                }
              }
            }

            // Page 0: Clock Face - Tap center/digital time complication to toggle 12h/24h on the fly
            if (id(gui_page) == 0 && id(ha_time).now().is_valid()) {
              static uint32_t last_clock_tap = 0;
              uint32_t now_c = millis();
              if (touch.x >= 100 && touch.x <= 366 && touch.y >= 180 && touch.y <= 330) {
                if (now_c - last_clock_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_clock_tap = now_c;
                  id(is_24h_format) = !id(is_24h_format);
                  auto call = id(time_format_select).make_call();
                  call.set_option(id(is_24h_format) ? "24-Hour" : "12-Hour (AM/PM)");
                  call.perform();
                  id(disp1).update();
                }
                return;
              }
            }

            // Page 1: Stopwatch Zero-Deadzone Ergonomic Touch Routing
            // --------------------------------------------------------
            // 1. Lower Left Quadrant (y in [280..399], x < 233): LAP Button
            //    Full-coverage quadrant centered around LAP pusher at (176, 332)
            // 2. Lower Right Quadrant (y in [280..399], x >= 233): RESET Button
            //    Full-coverage quadrant centered around RESET pusher at (290, 332)
            // 3. Upper 70% Dial Surface (y < 280): START / STOP Action
            //    Enormous 280px tall by 466px wide dial target with snappy 100ms debounce
            // 4. Bottom Footer (y >= 400): Handled by Deck Navigation
            // Completely eliminates the 19,440-pixel dead zone and the y:385..399 gap!
            if (id(gui_page) == 1) {
              id(gui_page) = 8;
              id(stuff_subpage) = 3;
              id(disp1).update();
              return;
            } else if (id(gui_page) == 2) {
              if (id(music_overlay_mode) == 0) {
                // ----------------------------------------------------
                // Normal Player Mode (Dedicated Radial Geometry & Clean HUD Dismissal)
                // ----------------------------------------------------
                // 1. Direct Header Tap Zone: Tapping Title / Speaker Name directly opens Music Hub
                // Active even when HUD is dormant, delivering instant 1-tap navigation
                if (touch.x >= 100 && touch.x <= 366 && touch.y <= 85) {
                  static uint32_t last_hdr_tap = 0;
                  uint32_t now_hdr = millis();
                  if (now_hdr - last_hdr_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_hdr_tap = now_hdr;
                    id(music_overlay_mode) = 5; // Open Music Hub Submenu
                    ESP_LOGI("touch", "Page 2 Header Tap -> Music Hub: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }

                std::string art_mode = id(music_fullscreen_art_mode).current_option();
                const int prev_btn_x = 124;
                const int next_btn_x = 342;
                const int left_flank_x = 71;
                const int right_flank_x = 395;
                const int btn_y_top = 140;
                const int btn_y_mid = 233;
                const int btn_y_vol_dn = 326;

                std::string overlay_mode = id(music_overlay_style).current_option();
                if (overlay_mode.empty()) overlay_mode = "Art Only";
                bool hud_enabled = (overlay_mode != "Always Visible");

                static uint32_t hud_just_woken_time = 0;

                // CASE A: HUD is enabled but currently dormant (hidden)
                if (hud_enabled && !id(music_hud_active)) {
                  // Any tap on the glass when dormant solely wakes and reveals the HUD overlay.
                  // Play/pause and transport controls must NEVER be activated while dormant.
                  id(music_hud_active) = true;
                  id(music_hud_timer) = millis();
                  hud_just_woken_time = millis();
                  id(hud_wake_finger_released) = false;
                  ESP_LOGI("touch", "Page 2 Wake HUD: x=%d y=%d", touch.x, touch.y);
                  id(disp1).update();
                  return;
                }

                // CASE B: HUD is active (controls displayed) OR Compact view (controls always visible)

                // Physical Release-Gated Wake Settling Guard:
                // Absorbs trailing contact packets from the wake tap while the finger is still held down.
                // Once the finger lifts (hud_wake_finger_released == true), intentional second taps are accepted
                // with a minimal 50ms contact-settling window, eliminating dropped quick taps.
                if (hud_enabled && (!id(hud_wake_finger_released) || (millis() - hud_just_woken_time < 50))) {
                  ESP_LOGI("touch", "Page 2 Wake settling guard absorbed: dt=%lums released=%d x=%d y=%d",
                           (unsigned long)(millis() - hud_just_woken_time), id(hud_wake_finger_released), touch.x, touch.y);
                  return;
                }

                // -----------------------------------------------------------------
                // 1. Center Hero Play/Pause Button (x in [179..287], y in [150..274])
                // -----------------------------------------------------------------
                if (touch.x >= 179 && touch.x <= 287 && touch.y >= 150 && touch.y <= 274) {
                  static uint32_t last_pp_tap = 0;
                  uint32_t now_pp = millis();
                  if (now_pp - last_pp_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_pp_tap = now_pp;
                    bool is_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                                      (id(ha_target_state).state == "playing");
                    id(music_action_feedback) = is_playing ? "Pausing..." : "Playing...";
                    id(music_feedback_timer) = now_pp;
                    id(music_hud_timer) = now_pp;
                    ESP_LOGI("touch", "Page 2 Play/Pause: x=%d y=%d is_playing=%d", touch.x, touch.y, is_playing);
                    id(toggle_ha_music).execute();
                    id(disp1).update();
                  }
                  return;
                }

                // -----------------------------------------------------------------
                // 2. RIGHT FLANK & NEXT TRACK TOUCH ZONES
                // Symmetrical Equatorial Corridor Architecture:
                // Next Track (▶|) / +30s Skip centered at (342, 233) claims the ENTIRE right equatorial
                // horizontal band (x in [270..455], y in [180..285]).
                // Volume Up (+) is strictly confined to the upper quadrant (y in [70..179], x >= 270).
                // Volume Down (-) is strictly confined to the lower quadrant (y in [286..415], x >= 270).
                // This 105px vertical equatorial buffer guarantees that taps at or near +30s Skip
                // can NEVER leak into Volume Up or Volume Down, regardless of finger drift or broad contact.
                // -----------------------------------------------------------------
                // Next Track (▶|) / +30s Skip: Full-Width Right Equatorial Band
                if (touch.x >= 270 && touch.x <= 455 && touch.y >= 180 && touch.y <= 285) {
                  static uint32_t last_next_tap = 0;
                  uint32_t now_tap = millis();
                  if (now_tap - last_next_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_next_tap = now_tap;
                    bool is_speech_media = (id(active_playback_media_type) == "podcast" || 
                                            id(active_playback_media_type) == "podcast_episode" || 
                                            id(active_playback_media_type) == "audiobook");
                    if (is_speech_media) {
                      id(music_skip_fwd_30).execute();
                    } else {
                      id(music_action_feedback) = "Next Track >>";
                      id(music_next_track).execute();
                    }
                    id(music_feedback_timer) = now_tap;
                    id(music_hud_timer) = now_tap;
                    ESP_LOGI("touch", "Page 2 Next Track / Skip: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }

                // Volume Up (+): Strictly Upper-Right Quadrant centered at (395, 140)
                if (touch.x >= 270 && touch.y >= 70 && touch.y < 180) {
                  static uint32_t last_vol_up_tap = 0;
                  uint32_t now_vol_tap = millis();
                  if (now_vol_tap - last_vol_up_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_vol_up_tap = now_vol_tap;
                    id(music_hud_timer) = now_vol_tap;
                    int v_step = (int)id(volume_step_size).state;
                    int v_cur = (int)std::round(id(pocket_music_player).volume * 100.0f);
                    id(music_action_feedback) = "Volume: " + to_string(std::min(100, v_cur + v_step)) + "%";
                    id(music_feedback_timer) = now_vol_tap;
                    ESP_LOGI("touch", "Page 2 Volume Up: x=%d y=%d vol=%d%%", touch.x, touch.y, std::min(100, v_cur + v_step));
                    id(music_vol_up).execute();
                    id(disp1).update();
                  }
                  return;
                }

                // Volume Down (-): Strictly Lower-Right Quadrant centered at (395, 326)
                if (touch.x >= 270 && touch.y > 285 && touch.y < 415) {
                  static uint32_t last_vol_dn_tap = 0;
                  uint32_t now_vol_tap = millis();
                  if (now_vol_tap - last_vol_dn_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_vol_dn_tap = now_vol_tap;
                    id(music_hud_timer) = now_vol_tap;
                    int v_step = (int)id(volume_step_size).state;
                    int v_cur = (int)std::round(id(pocket_music_player).volume * 100.0f);
                    id(music_action_feedback) = "Volume: " + to_string(std::max(0, v_cur - v_step)) + "%";
                    id(music_feedback_timer) = now_vol_tap;
                    ESP_LOGI("touch", "Page 2 Volume Down: x=%d y=%d vol=%d%%", touch.x, touch.y, std::max(0, v_cur - v_step));
                    id(music_vol_down).execute();
                    id(disp1).update();
                  }
                  return;
                }

                // -----------------------------------------------------------------
                // 3. LEFT FLANK: Optional Speaker & Library Shortcuts & Previous Track
                // Symmetrical with Right Flank: Outer flank (x <= 95) dedicated to shortcuts when enabled,
                // Inner button (x in [96..180], y in [190..275]) captures Prev Track at (124, 233).
                // -----------------------------------------------------------------
                // Optional Speaker Shortcut: Upper-Left Quadrant
                if (id(music_show_speaker_shortcut).state && 
                    ((touch.x <= 95 && touch.y < 233 && touch.y >= 70) || 
                     (touch.x > 95 && touch.x <= 180 && touch.y < 190 && touch.y >= 70))) {
                  static uint32_t last_sc_spk_tap = 0;
                  uint32_t now_sc = millis();
                  if (now_sc - last_sc_spk_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sc_spk_tap = now_sc;
                    id(selected_category_mode) = "speakers";
                    id(selected_category_title) = "SPEAKERS";
                    id(music_browse_page) = 1;
                    id(music_overlay_mode) = 1; // Open Speakers Browser directly
                    id(fetch_music_browse).execute();
                    ESP_LOGI("touch", "Page 2 Left Flank Shortcut -> Speakers Browser: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }

                // Optional Library Shortcut: Lower-Left Quadrant
                if (id(music_show_library_shortcut).state && 
                    ((touch.x <= 95 && touch.y >= 233 && touch.y < 415) || 
                     (touch.x > 95 && touch.x <= 180 && touch.y > 275 && touch.y < 415))) {
                  static uint32_t last_sc_lib_tap = 0;
                  uint32_t now_sc = millis();
                  if (now_sc - last_sc_lib_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sc_lib_tap = now_sc;
                    id(music_category_page) = 1;
                    id(menu_scroll_active) = false;
                    id(menu_scroll_step) = 0;
                    id(music_overlay_mode) = 2; // Open Library Categories directly
                    ESP_LOGI("touch", "Page 2 Left Flank Shortcut -> Library Categories: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }

                // Previous Track (|◀) / -10s Replay: Middle-Left Horizon centered at (124, 233)
                bool prev_hit = (id(music_show_speaker_shortcut).state || id(music_show_library_shortcut).state) ?
                                (touch.x > 95 && touch.x <= 180 && touch.y >= 190 && touch.y <= 275) :
                                (touch.x <= 180 && touch.y >= 150 && touch.y <= 316);
                if (prev_hit) {
                  static uint32_t last_prev_tap = 0;
                  uint32_t now_tap = millis();
                  if (now_tap - last_prev_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_prev_tap = now_tap;
                    bool is_speech_media = (id(active_playback_media_type) == "podcast" || 
                                            id(active_playback_media_type) == "podcast_episode" || 
                                            id(active_playback_media_type) == "audiobook");
                    if (is_speech_media) {
                      id(music_skip_back_10).execute();
                    } else {
                      id(music_action_feedback) = "<< Prev Track";
                      id(music_prev_track).execute();
                    }
                    id(music_feedback_timer) = now_tap;
                    id(music_hud_timer) = now_tap;
                    ESP_LOGI("touch", "Page 2 Prev Track / Replay: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }

                // -----------------------------------------------------------------
                // 5. INTENTIONAL HUD DISMISSAL (Full Screen / Letterbox only)
                // Expanded 146px-wide central corridor (x in [160..306]) above and below controls
                // Protected by a calibrated 250ms wake settling threshold and 200ms tap debounce
                // -----------------------------------------------------------------
                if (hud_enabled && id(music_hud_active)) {
                  if (touch.x >= 160 && touch.x <= 306 && (touch.y < 150 || (touch.y > 274 && touch.y < 400))) {
                    if (millis() - id(music_hud_timer) >= TOUCH_GUARD_DISMISS) {
                      static uint32_t last_dismiss_tap = 0;
                      uint32_t now_dis = millis();
                      if (now_dis - last_dismiss_tap > TOUCH_DEBOUNCE_DISMISS) {
                        last_dismiss_tap = now_dis;
                        id(music_hud_active) = false;
                        ESP_LOGI("touch", "Page 2 HUD Dismissed: x=%d y=%d dt=%lums", touch.x, touch.y, (unsigned long)(millis() - id(music_hud_timer)));
                        id(disp1).update();
                      }
                    } else {
                      ESP_LOGI("touch", "Page 2 HUD Dismiss lockout (dt=%lums < 250ms): x=%d y=%d", (unsigned long)(millis() - id(music_hud_timer)), touch.x, touch.y);
                    }
                  } else {
                    ESP_LOGI("touch", "Page 2 Ignored non-control tap: x=%d y=%d", touch.x, touch.y);
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 5) {
                // ----------------------------------------------------
                // Subpage 5: Music Hub Touch Navigation
                // ----------------------------------------------------
                uint32_t now_hub = millis();
                // Universal Back Button at y = 408 (handled via is_back_button)
                if (is_back_button(touch)) {
                  static uint32_t last_hub_back = 0;
                  if (now_hub - last_hub_back > TOUCH_DEBOUNCE_BUTTON) {
                    last_hub_back = now_hub;
                    id(music_overlay_mode) = 0; // Return to Now Playing view
                    id(music_hud_active) = true;
                    id(music_hud_timer) = now_hub;
                    ESP_LOGI("touch", "Music Hub -> Back to Player: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }

                // Pill 1: Speakers > (y in [118..162], x in [120..346], center y = 140)
                if (touch.y >= 118 && touch.y <= 162 && touch.x >= 120 && touch.x <= 346) {
                  static uint32_t last_hub_spk = 0;
                  if (now_hub - last_hub_spk > TOUCH_DEBOUNCE_BUTTON) {
                    last_hub_spk = now_hub;
                    id(selected_category_mode) = "speakers";
                    id(selected_category_title) = "SPEAKERS";
                    id(music_browse_page) = 1;
                    id(music_overlay_mode) = 1; // Open Speakers Browser
                    id(fetch_music_browse).execute();
                    ESP_LOGI("touch", "Music Hub -> Speakers Browser: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }

                // Pill 2: Library > (y in [178..222], x in [120..346], center y = 200)
                if (touch.y >= 178 && touch.y <= 222 && touch.x >= 120 && touch.x <= 346) {
                  static uint32_t last_hub_lib = 0;
                  if (now_hub - last_hub_lib > TOUCH_DEBOUNCE_BUTTON) {
                    last_hub_lib = now_hub;
                    id(music_category_page) = 1;
                    id(menu_scroll_active) = false;
                    id(menu_scroll_step) = 0;
                    id(music_overlay_mode) = 2; // Open Library Categories
                    ESP_LOGI("touch", "Music Hub -> Library Categories: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }

                // Pill 3: Audio Settings > (y in [268..312], x in [120..346], center y = 290)
                if (touch.y >= 268 && touch.y <= 312 && touch.x >= 120 && touch.x <= 346) {
                  static uint32_t last_hub_set = 0;
                  if (now_hub - last_hub_set > TOUCH_DEBOUNCE_BUTTON) {
                    last_hub_set = now_hub;
                    id(gui_page) = 4;
                    id(system_menu_mode) = 7;
                    id(audio_menu_parent_page) = 2;
                    id(audio_menu_page) = 1;
                    id(menu_scroll_active) = false;
                    ESP_LOGI("touch", "Music Hub -> Audio Settings: x=%d y=%d", touch.x, touch.y);
                    id(disp1).update();
                  }
                  return;
                }
                return;

              } else if (id(music_overlay_mode) == 1) {
                // ----------------------------------------------------
                // LEVEL 1: SPEAKERS BROWSER (Direct 5-Slot Speaker Inventory)
                // ----------------------------------------------------
                // Central Speaker Slots 1..5 Tap -> Opens Contextual Action Sheet (mode 4)
                static uint32_t last_spk_slot_tap = 0;
                uint32_t now_spk = millis();
                int slot_idx = get_5slot_index(touch, 85, 370);
                if (slot_idx >= 0) {
                  if (now_spk - last_spk_slot_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_spk_slot_tap = now_spk;
                    std::string picked_id = "";
                    std::string picked_name = "";
                    if (slot_idx == 0 && !id(slot_1_name).empty()) {
                      picked_id = id(slot_1_id);
                      picked_name = id(slot_1_name);
                    } else if (slot_idx == 1 && !id(slot_2_name).empty()) {
                      picked_id = id(slot_2_id);
                      picked_name = id(slot_2_name);
                    } else if (slot_idx == 2 && !id(slot_3_name).empty()) {
                      picked_id = id(slot_3_id);
                      picked_name = id(slot_3_name);
                    } else if (slot_idx == 3 && !id(slot_4_name).empty()) {
                      picked_id = id(slot_4_id);
                      picked_name = id(slot_4_name);
                    } else if (slot_idx == 4 && !id(slot_5_name).empty()) {
                      picked_id = id(slot_5_id);
                      picked_name = id(slot_5_name);
                    }

                    if (!picked_id.empty()) {
                      id(target_speaker_id) = picked_id;
                      id(target_speaker_name) = picked_name;
                      id(music_overlay_mode) = 4; // Open Speaker Action Sheet
                      id(disp1).update();
                    }
                  }
                  return;
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Player View
                if (is_back_button(touch)) {
                  if (now_spk - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_spk;
                    id(music_overlay_mode) = 5; // Return to Music Hub
                    id(music_hud_active) = true;
                    id(music_hud_timer) = millis();
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 2) {
                // ----------------------------------------------------
                // LEVEL 2: LIBRARY CATEGORIES SUBMENU (Continuous 7-Item Vertical Scroll Architecture)
                // ----------------------------------------------------
                if (id(menu_scroll_active)) return;

                // Reusable Item Action Dispatcher for all 7 library categories
                auto trigger_library_item = [&](int idx) {
                  if (idx == 0) {
                    id(selected_category_mode) = "favorites";
                    id(selected_category_title) = "FAVORITES";
                  } else if (idx == 1) {
                    id(selected_category_mode) = "playlist";
                    id(selected_category_title) = "PLAYLISTS";
                  } else if (idx == 2) {
                    id(selected_category_mode) = "artist";
                    id(selected_category_title) = "ARTISTS";
                    id(drilldown_artist_page) = 1;
                  } else if (idx == 3) {
                    id(selected_category_mode) = "album";
                    id(selected_category_title) = "ALBUMS";
                    id(drilldown_album_page) = 1;
                  } else if (idx == 4) {
                    id(selected_category_mode) = "podcast";
                    id(selected_category_title) = "PODCASTS";
                  } else if (idx == 5) {
                    id(selected_category_mode) = "radio";
                    id(selected_category_title) = "RADIO";
                  } else if (idx == 6) {
                    id(selected_category_mode) = "audiobook";
                    id(selected_category_title) = "AUDIOBOOKS";
                  }
                  id(slot_1_name) = "Loading...";
                  id(slot_1_id) = "";
                  id(slot_2_name) = "";
                  id(slot_2_id) = "";
                  id(slot_3_name) = "";
                  id(slot_3_id) = "";
                  id(slot_4_name) = "";
                  id(slot_4_id) = "";
                  id(slot_5_name) = "";
                  id(slot_5_id) = "";
                  id(music_browse_page) = 1;
                  id(music_overlay_mode) = 3; // Open Level 3 Item Browser
                  id(fetch_music_browse).execute();
                };

                // Central Button Hit-Testing (x: 85..370 across Slots 1-5, narrowed pills)
                static uint32_t last_cat_slot_tap = 0;
                uint32_t now_cat = millis();
                int slot_idx = get_5slot_index(touch, 85, 370);
                if (slot_idx >= 0) {
                  if (now_cat - last_cat_slot_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_cat_slot_tap = now_cat;
                    // Page 1: item_idx = slot_idx (items 0..4: Favorites, Playlists, Artists, Albums, Podcasts)
                    // Page 2: item_idx = slot_idx + 2 (items 2..6: Artists, Albums, Podcasts, Radio, Audiobooks)
                    int item_idx = (id(music_category_page) == 1) ? slot_idx : (slot_idx + 2);
                    trigger_library_item(item_idx);
                  }
                  return;
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Player View
                if (is_back_button(touch)) {
                  if (now_cat - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_cat;
                    id(music_overlay_mode) = 5; // Return to Music Hub
                    id(music_category_page) = 1;
                    id(menu_scroll_active) = false;
                    id(menu_scroll_step) = 0;
                    id(music_hud_active) = true;
                    id(music_hud_timer) = millis();
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 3) {
                // ----------------------------------------------------
                // LEVEL 3: ITEM BROWSER (Standardized 58px Pitch, 5 Slots)
                // ----------------------------------------------------
                bool is_drill = (id(selected_category_mode) == "artist" || id(selected_category_mode) == "album" || id(selected_category_mode) == "artist_albums");
                bool is_podcast_list = (id(selected_category_mode) == "podcast");

                static uint32_t last_item_slot_tap = 0;
                uint32_t now_item = millis();

                // Central 5 Slots Hit-Testing via Universal get_5slot_index (x: 45..370)
                int slot_idx = get_5slot_index(touch, 45, 370);
                if (slot_idx >= 0) {
                  if (now_item - last_item_slot_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_item_slot_tap = now_item;
                    int slot_num = slot_idx + 1;
                    std::string s_id = (slot_num == 1) ? id(slot_1_id) :
                                       (slot_num == 2) ? id(slot_2_id) :
                                       (slot_num == 3) ? id(slot_3_id) :
                                       (slot_num == 4) ? id(slot_4_id) : id(slot_5_id);
                    std::string s_name = (slot_num == 1) ? id(slot_1_name) :
                                         (slot_num == 2) ? id(slot_2_name) :
                                         (slot_num == 3) ? id(slot_3_name) :
                                         (slot_num == 4) ? id(slot_4_name) : id(slot_5_name);
                    if (!s_id.empty()) {
                      if (is_podcast_list) {
                        id(drilldown_album_id) = s_id;
                        id(drilldown_album_name) = s_name;
                        id(drilldown_album_page) = id(music_browse_page);
                        id(drilldown_parent_mode) = "podcast";
                        id(selected_category_mode) = "podcast_episodes";
                        id(selected_category_title) = s_name;
                        id(music_browse_page) = 1;
                        id(fetch_music_browse).execute();
                      } else if (is_drill && touch.x <= 118) {
                        id(selected_music_slot) = slot_num;
                        id(selected_slot_name) = s_name;
                        id(selected_slot_id) = s_id;
                        id(selected_slot_type) = (slot_num == 1) ? id(slot_1_type) :
                                                 (slot_num == 2) ? id(slot_2_type) :
                                                 (slot_num == 3) ? id(slot_3_type) :
                                                 (slot_num == 4) ? id(slot_4_type) : id(slot_5_type);
                        id(play_music_slot).execute();
                      } else if (is_drill && touch.x > 118) {
                        if (id(selected_category_mode) == "artist") {
                          id(drilldown_artist_name) = s_name;
                          id(drilldown_artist_page) = id(music_browse_page);
                          id(selected_category_mode) = "artist_albums";
                          id(selected_category_title) = s_name;
                          id(music_browse_page) = 1;
                          id(fetch_music_browse).execute();
                        } else {
                          id(drilldown_album_id) = s_id;
                          id(drilldown_album_name) = s_name;
                          id(drilldown_album_page) = id(music_browse_page);
                          id(drilldown_parent_mode) = id(selected_category_mode);
                          id(selected_category_mode) = "album_tracks";
                          id(selected_category_title) = s_name;
                          id(music_browse_page) = 1;
                          id(fetch_music_browse).execute();
                        }
                      } else {
                        id(selected_music_slot) = slot_num;
                        id(selected_slot_name) = s_name;
                        id(selected_slot_id) = s_id;
                        id(selected_slot_type) = (slot_num == 1) ? id(slot_1_type) :
                                                 (slot_num == 2) ? id(slot_2_type) :
                                                 (slot_num == 3) ? id(slot_3_type) :
                                                 (slot_num == 4) ? id(slot_4_type) : id(slot_5_type);
                        id(select_music_slot).execute();
                      }
                    }
                  }
                  return;
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Level 2 Categories
                if (is_back_button(touch)) {
                  if (now_item - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_item;
                    if (id(selected_category_mode) == "album_tracks" || id(selected_category_mode) == "podcast_episodes") {
                      id(selected_category_mode) = id(drilldown_parent_mode).empty() ? "album" : id(drilldown_parent_mode);
                      id(selected_category_title) = (id(selected_category_mode) == "podcast") ? "PODCASTS" : ((id(selected_category_mode) == "artist_albums") ? id(drilldown_artist_name) : "ALBUMS");
                      id(music_browse_page) = std::max(1, id(drilldown_album_page));
                      id(fetch_music_browse).execute();
                    } else if (id(selected_category_mode) == "artist_albums") {
                      id(selected_category_mode) = "artist";
                      id(selected_category_title) = "ARTISTS";
                      id(music_browse_page) = std::max(1, id(drilldown_artist_page));
                      id(fetch_music_browse).execute();
                    } else if (id(selected_category_mode) == "speakers" || id(selected_category_mode) == "speaker_takeover") {
                      id(music_overlay_mode) = 1; // Return to Speakers Browser
                    } else {
                      id(drilldown_artist_page) = 1;
                      id(drilldown_album_page) = 1;
                      // Preserve active music_category_page scroll position across category visits
                      id(menu_scroll_active) = false;
                      id(menu_scroll_step) = 0;
                      id(music_overlay_mode) = 2; // Return to Library Categories Submenu
                    }
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 4) {
                // ----------------------------------------------------
                // LEVEL 4: SPEAKER ACTION SHEET TOUCH HANDLERS
                // ----------------------------------------------------
                static uint32_t last_sheet_tap = 0;
                uint32_t now_sheet = millis();
                bool is_current = (id(target_speaker_id) == id(active_speaker_entity));
                if (!is_current) {
                  // Pill 1: TRANSFER QUEUE (y: 100..159, x: 85..370, center y = 130)
                  if (touch.y >= 100 && touch.y <= 159 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_transfer_to_target).execute();
                    }
                    return;
                  // Pill 2: CONTROL ONLY (y: 160..217, x: 85..370, center y = 188)
                  } else if (touch.y >= 160 && touch.y <= 217 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_control_target).execute();
                    }
                    return;
                  // Pill 3: JOIN AUDIO (y: 218..275, x: 85..370, center y = 246)
                  } else if (touch.y >= 218 && touch.y <= 275 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_join_target).execute();
                    }
                    return;
                  // Pill 4: UNJOIN / DETACH (y: 276..350, x: 85..370, center y = 304)
                  } else if (touch.y >= 276 && touch.y <= 350 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_unjoin_target).execute();
                    }
                    return;
                  }
                } else {
                  bool is_remote = (id(target_speaker_id) != "${local_player_id}");
                  if (is_remote) {
                    // Pill 1: TRANSFER TO LOCAL (y: 110..170, x: 85..370, center y = 142)
                    if (touch.y >= 110 && touch.y <= 170 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(target_speaker_id) = "${local_player_id}";
                        id(target_speaker_name) = "${friendly_name}";
                        id(speaker_transfer_to_target).execute();
                      }
                      return;
                    // Pill 2: UNJOIN AUDIO (y: 171..228, x: 85..370, center y = 200)
                    } else if (touch.y >= 171 && touch.y <= 228 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(speaker_unjoin_target).execute();
                      }
                      return;
                    // Pill 3: STOP PLAYBACK (y: 229..295, x: 85..370, center y = 258)
                    } else if (touch.y >= 229 && touch.y <= 295 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(toggle_ha_music).execute();
                        id(music_overlay_mode) = 0;
                        id(disp1).update();
                      }
                      return;
                    }
                  } else {
                    // Pill 1: UNJOIN AUDIO (y: 120..194, x: 85..370, center y = 160)
                    if (touch.y >= 120 && touch.y <= 194 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(speaker_unjoin_target).execute();
                      }
                      return;
                    // Pill 2: STOP PLAYBACK (y: 195..275, x: 85..370, center y = 230)
                    } else if (touch.y >= 195 && touch.y <= 275 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(toggle_ha_music).execute();
                        id(music_overlay_mode) = 0;
                        id(disp1).update();
                      }
                      return;
                    }
                  }
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Speakers Browser
                if (is_back_button(touch)) {
                  if (now_sheet - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_sheet;
                    id(music_overlay_mode) = 1;
                    id(disp1).update();
                  }
                  return;
                }
              }
            // Page 3: Games Menu Launcher or Active Game Touch Action
            } else if (id(gui_page) == 3) {
              if (id(active_game) == 0) {
                if (id(menu_scroll_active)) {
                  ESP_LOGI("touch", "Page 3 Tap dropped: carousel animating (step=%d)", id(menu_scroll_step));
                  return;
                }

                // 1. Right-Flank Navigation Chevrons: Edge tap for Carousel (x >= 375, y: 70..365)
                if (touch.x >= 375 && touch.y >= 70 && touch.y <= 365) {
                  static uint32_t last_game_scroll = 0;
                  uint32_t now_gs = millis();
                  if (now_gs - last_game_scroll > TOUCH_DEBOUNCE_SCROLL) {
                    last_game_scroll = now_gs;
                    int dir = (touch.y < 220) ? -1 : 1;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = dir;
                    id(menu_scroll_target_page) = step_wrap(id(game_carousel_idx), dir, 4);
                    id(menu_scroll_step) = 0;
                    ESP_LOGI("touch", "Page 3 Game Chevron: x=%d y=%d dir=%d target=%d", touch.x, touch.y, dir, id(menu_scroll_target_page));
                    id(menu_scroll_transition).execute();
                  }
                  return;
                }

                // 2. Left flank grip discard
                if (touch.x < 75) {
                  return;
                }

                // 3. Center Card & PLAY Button Tap: Launch Selected Game (x: 75..374, y: 140..390)
                if (touch.x >= 75 && touch.x < 375 && touch.y >= 140 && touch.y <= 390) {
                  static uint32_t last_game_launch_tap = 0;
                  uint32_t now_gl = millis();
                  if (now_gl - last_game_launch_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_game_launch_tap = now_gl;
                    id(active_game) = id(game_carousel_idx) + 1; // 0->1 (Marbles), 1->2 (Archery), 2->3 (Breakout), 3->4 (Chomp)
                    ESP_LOGI("touch", "Page 3 Launch Game: x=%d y=%d game=%d", touch.x, touch.y, id(active_game));
                    if (id(active_game) > 0) {
                      // Pause background music and mute DAC for dedicated game resources
                      if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
                        auto call = id(pocket_music_player).make_call();
                        call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_PAUSE);
                        call.perform();
                        id(toggle_ha_music).execute();
                        id(es8311_dac).set_mute_on();
                      }
                    }
                    id(disp1).update();
                  }
                  return;
                }
              } else {
                // Active game touch action (pop marble / fire arrow / pop treat) - UNTHROTTLED 30 Hz STREAMING
                id(marble_touch_x) = touch.x;
                id(marble_touch_y) = touch.y;
                id(game_btn_pressed) = true;
                id(disp1).update();
              }
            // Page 4: System (Telemetry Dashboard vs Settings vs Confirmation vs Update)
            } else if (id(gui_page) == 4) {
              auto is_newer_semver = [](const std::string& lat_str, const std::string& cur_str) -> bool {
                if (lat_str.empty() || lat_str == "unavailable" || lat_str == "unknown") return false;
                std::string l = lat_str;
                if (!l.empty() && (l[0] == 'v' || l[0] == 'V')) l = l.substr(1);
                std::string c = cur_str;
                if (!c.empty() && (c[0] == 'v' || c[0] == 'V')) c = c.substr(1);
                if (l.rfind("202", 0) == 0) return false; // Reject ESPHome CalVer (2026.x)
                if (l == c) return false;
                int l_maj = 0, l_min = 0, l_pat = 0;
                int c_maj = 0, c_min = 0, c_pat = 0;
                sscanf(l.c_str(), "%d.%d.%d", &l_maj, &l_min, &l_pat);
                sscanf(c.c_str(), "%d.%d.%d", &c_maj, &c_min, &c_pat);
                if (l_maj != c_maj) return l_maj > c_maj;
                if (l_min != c_min) return l_min > c_min;
                return l_pat > c_pat;
              };

              static uint32_t last_sys_action_tap = 0;
              uint32_t now_sys = millis();

              if (id(system_menu_mode) == 0) {

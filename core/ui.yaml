script:
  - id: apply_default_start_page
    then:
      - lambda: |-
          std::string def_app = std::string(id(default_start_app).current_option().c_str());
          int init_p = 0;
          if (def_app == "Stopwatch") init_p = 1;
          else if (def_app == "Music") init_p = 2;
          else if (def_app == "Games") init_p = 3;
          else if (def_app == "System") init_p = 4;
          bool ok = (init_p == 0 ? id(show_clock_switch).state :
                    (init_p == 1 ? id(show_stopwatch_switch).state :
                    (init_p == 2 ? id(show_music_switch).state :
                    (init_p == 3 ? id(show_games_switch).state : id(show_system_switch).state))));
          if (!ok) {
            for (int p = 0; p < 5; p++) {
              bool en = (p == 0 ? id(show_clock_switch).state :
                        (p == 1 ? id(show_stopwatch_switch).state :
                        (p == 2 ? id(show_music_switch).state :
                        (p == 3 ? id(show_games_switch).state : id(show_system_switch).state))));
              if (en) { init_p = p; break; }
            }
          }
          id(gui_page) = init_p;
  - id: boot_button_hold_timer
    mode: restart
    then:
      - delay: 1000ms
      - if:
          condition:
            binary_sensor.is_on: boot_button
          then:
            - lambda: 'id(boot_hold_triggered) = true;'
            - script.execute: enter_deep_sleep

  - id: enter_deep_sleep
    mode: restart
    then:
      - lambda: |-
          id(is_locked) = true;
          id(active_game) = 0;
          id(is_hibernating) = true;
      - voice_assistant.stop:
      - media_player.pause: pocket_music_player
      - audio_dac.mute_on: es8311_dac
      - switch.turn_off: speaker_enable
      - script.stop: screen_sleep_timer
      - light.turn_on:
          id: display_brightness
          brightness: 90%
      - component.update: disp1
      - lambda: |-
          // Keep "HIBERNATING..." on screen while user is holding button (up to 3.0s)
          int guard = 0;
          while (gpio_get_level(GPIO_NUM_0) == 0 && guard < 200) {
            esp_rom_delay_us(15000); // 15ms * 200 = 3.0s max wait for user to lift finger
            guard++;
          }
          // Clean debounce delay after user releases finger
          esp_rom_delay_us(150000); // 150ms
      - delay: 500ms  # Ensure visual confirmation is cleanly perceived
      - lambda: |-
          id(is_hibernating) = false;
      - light.turn_off: display_brightness
      - component.update: disp1  # Flush all-black frame to AMOLED panel
      - delay: 250ms  # Ensure QSPI frame buffer and brightness 0 are fully flushed before CPU sleep
      - lambda: |-
          // =========================================================================
          // 🛑 ULTRA-LOW POWER PERIPHERAL SHUTDOWN & PAD RETENTION FOR DEEP SLEEP
          // Reduces deep sleep baseline current from ~24mA to <100µA (<0.1mA)
          // =========================================================================

          // 1. Put QMI8658 6-Axis IMU into Power-Down Mode (CTRL7 = 0x00)
          // Shuts off accelerometer and gyroscope MEMS circuitry (saves ~2.0mA)
          uint8_t qmi_pwr_down[2] = {0x08, 0x00};
          id(bus_internal).write(0x6B, qmi_pwr_down, 2);

          // 2. Put ES8311 Audio DAC into Standby/Power-Down Mode (saves ~1.0mA)
          uint8_t dac_sleep1[2] = {0x0D, 0xFF};
          uint8_t dac_sleep2[2] = {0x00, 0x80};
          id(bus_internal).write(0x18, dac_sleep1, 2);
          id(bus_internal).write(0x18, dac_sleep2, 2);

          // 3. Put ES7210 Audio ADC into Standby Mode (saves ~0.8mA)
          uint8_t es7210_pwr[2] = {0x00, 0xFF};
          id(bus_internal).write(0x40, es7210_pwr, 2);

          // 4. Force Speaker Power Amplifier Enable (GPIO46) firmly LOW and hold it
          // Prevents the amp enable line from floating into an active state in sleep (saves ~4.0mA)
          gpio_set_direction(GPIO_NUM_46, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_46, 0);
          gpio_hold_en(GPIO_NUM_46);

          // 5. Force Display CS (GPIO12) firmly HIGH (deselected) and hold it
          // Prevents floating QSPI bus leakage into panel controller (saves ~1.0mA)
          gpio_set_direction(GPIO_NUM_12, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_12, 1);
          gpio_hold_en(GPIO_NUM_12);

          // 6. Put Display Controller (CO5300) into Hardware Reset (GPIO1 LOW) and hold it
          // Fully powers down internal AMOLED charge pumps, DC-DC boosters & oscillators (saves ~14.0mA)
          gpio_set_direction(GPIO_NUM_1, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_1, 0);
          gpio_hold_en(GPIO_NUM_1);

          // 7. Put Touch Controller (CST9217) into Hardware Reset (GPIO2 LOW) and hold it
          // Stops capacitive matrix scanning (saves ~2.0mA)
          gpio_set_direction(GPIO_NUM_2, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_2, 0);
          gpio_hold_en(GPIO_NUM_2);

          // 8. Latch all held pad states across the deep sleep cycle
          gpio_deep_sleep_hold_en();
      - deep_sleep.enter: deep_sleep_ctrl

  - id: lock_device
    mode: restart
    then:
      - script.execute: enter_deep_sleep
  - id: unlock_device
    mode: restart
    then:
      - lambda: |-
          id(is_locked) = false;
          id(apply_default_start_page).execute();
          id(sleep_start_time) = 0;
      - light.turn_on: display_brightness
      - component.update: disp1
      - script.execute: screen_sleep_timer

  - id: music_vol_up
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(active_speaker_entity) == "${local_player_id}";'
          then:
            - lambda: |-
                float step = id(volume_step_size).state / 100.0f;
                if (std::isnan(step) || step <= 0.0f) step = 0.02f;
                float cur = id(pocket_music_player).volume;
                if (std::isnan(cur) || cur <= 0.0f) cur = 0.70f;
                float new_vol = std::min(0.90f, cur + step);
                id(pocket_music_player).make_call().set_volume(new_vol).perform();
          else:
            - homeassistant.action:
                action: media_player.volume_up
                data:
                  entity_id: !lambda 'return id(active_speaker_entity).c_str();'

  - id: music_vol_down
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(active_speaker_entity) == "${local_player_id}";'
          then:
            - lambda: |-
                float step = id(volume_step_size).state / 100.0f;
                if (std::isnan(step) || step <= 0.0f) step = 0.02f;
                float cur = id(pocket_music_player).volume;
                if (std::isnan(cur) || cur <= 0.0f) cur = 0.70f;
                float new_vol = std::max(0.10f, cur - step);
                id(pocket_music_player).make_call().set_volume(new_vol).perform();
          else:
            - homeassistant.action:

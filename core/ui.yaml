              } else if (id(system_menu_mode) == 2) {
                // Mode 2: Display & Clock Submenu (5 Spacious Cards)
                // Card 1: Auto-Brightness Mode Cycler (y: 80..125, x: 100..366)
                if (touch.y >= 80 && touch.y <= 125 && touch.x >= 100 && touch.x <= 366) {
                  std::string cur = std::string(id(auto_brightness_mode).current_option().c_str());
                  std::string nxt = "Disabled";
                  if (cur == "Disabled") nxt = "Sun Synchronized";
                  else if (cur == "Sun Synchronized") nxt = "Time Schedule";
                  else nxt = "Disabled";
                  auto call = id(auto_brightness_mode).make_call();
                  call.set_option(nxt);
                  call.perform();
                  id(disp1).update();
                // Card 2: Brightness Preset Cycler (y: 130..175, x: 100..366)
                } else if (touch.y >= 130 && touch.y <= 175 && touch.x >= 100 && touch.x <= 366) {
                  std::string cur = std::string(id(display_brightness_preset).current_option().c_str());
                  std::string nxt = "90%";
                  if (cur == "60%") nxt = "70%";
                  else if (cur == "70%") nxt = "80%";
                  else if (cur == "80%") nxt = "90%";
                  else if (cur == "90%") nxt = "100%";
                  else nxt = "60%";
                  auto call = id(display_brightness_preset).make_call();
                  call.set_option(nxt);
                  call.perform();
                  id(sync_display_brightness).execute();
                  id(disp1).update();
                // Card 3: Clock Face Style Cycler (y: 180..225, x: 100..366)
                } else if (touch.y >= 180 && touch.y <= 225 && touch.x >= 100 && touch.x <= 366) {
                  id(clock_face_digital) = !id(clock_face_digital);
                  auto call = id(clock_face_style).make_call();
                  call.set_option(id(clock_face_digital) ? "Modern Digital (Bold)" : "Modern Roman (Analog)");
                  call.perform();
                  id(disp1).update();
                // Card 4: Time Format Cycler (y: 230..275, x: 100..366)
                } else if (touch.y >= 230 && touch.y <= 275 && touch.x >= 100 && touch.x <= 366) {
                  id(is_24h_format) = !id(is_24h_format);
                  auto call = id(time_format_select).make_call();
                  call.set_option(id(is_24h_format) ? "24-Hour" : "12-Hour (AM/PM)");
                  call.perform();
                  id(disp1).update();
                // Card 5: Color Palette Cycler (y: 280..325, x: 100..366)
                } else if (touch.y >= 280 && touch.y <= 325 && touch.x >= 100 && touch.x <= 366) {
                  std::string cur = std::string(id(theme_palette_select).current_option().c_str());
                  std::string nxt = "Steel & Silver";
                  if (cur == "Steel & Silver") nxt = "Pink & Gray";
                  else if (cur == "Pink & Gray") nxt = "Blue & Gold";
                  else if (cur == "Blue & Gold" || cur == "Default Classic") nxt = "Green & Gold";
                  else if (cur == "Green & Gold") nxt = "Steel & Silver";
                  auto call = id(theme_palette_select).make_call();
                  call.set_option(nxt);
                  call.perform();
                  id(disp1).update();
                // Standardized < BACK (y: 350..400, x: 120..346)
                } else if (touch.y >= 350 && touch.y <= 400 && touch.x >= 120 && touch.x <= 346) {
                  id(system_menu_mode) = 0; // Return to Main Telemetry Dashboard
                  id(disp1).update();
                }
              } else if (id(system_menu_mode) == 3) {
                // Mode 3: Power Actions Submenu (Spacious 75px Pitch)
                // Card 1: Hibernate Now (y: 105..155, x: 100..366)
                if (touch.y >= 105 && touch.y <= 155 && touch.x >= 100 && touch.x <= 366) {
                  id(start_hibernation_countdown).execute();
                // Card 2: Auto-Sleep Timeout Cycler (y: 180..230, x: 100..366)
                } else if (touch.y >= 180 && touch.y <= 230 && touch.x >= 100 && touch.x <= 366) {
                  std::string cur = std::string(id(sleep_timeout_mode).current_option().c_str());
                  std::string nxt = "5 min";
                  if (cur == "5 min") nxt = "10 min";
                  else if (cur == "10 min") nxt = "15 min";
                  else if (cur == "15 min") nxt = "30 min";
                  else if (cur == "30 min") nxt = "Disabled";
                  else if (cur == "Disabled") nxt = "5 min";
                  auto call = id(sleep_timeout_mode).make_call();
                  call.set_option(nxt);
                  call.perform();
                  id(disp1).update();
                // Card 3: Restart Device (y: 215..255, x: 100..366)
                } else if (touch.y >= 215 && touch.y <= 255 && touch.x >= 100 && touch.x <= 366) {
                  id(system_menu_mode) = 4; // Open Confirmation Dialog
                  id(disp1).update();
                // Card 4: Software Update (y: 270..315, x: 100..366)
                } else if (touch.y >= 270 && touch.y <= 315 && touch.x >= 100 && touch.x <= 366) {
                  id(system_menu_mode) = 5; // Open Software Update Screen
                  id(disp1).update();
                // Standardized < BACK (y: 350..400, x: 120..346)
                } else if (touch.y >= 350 && touch.y <= 400 && touch.x >= 120 && touch.x <= 346) {
                  id(system_menu_mode) = 0; // Return to Main Telemetry Dashboard
                  id(disp1).update();
                }
                            } else if (id(system_menu_mode) == 4) {
                // Mode 4: Restart Confirmation Dialog
                if (touch.y >= 195 && touch.y <= 265) {
                  if (touch.x >= 90 && touch.x <= 225) {
                    // Cancel -> return to Power Options
                    id(system_menu_mode) = 3;
                    id(disp1).update();
                  } else if (touch.x >= 240 && touch.x <= 375) {
                    // Confirm Restart
                    id(restart_button).press();
                  }
                }
              } else if (id(system_menu_mode) == 5) {
                // Mode 5: Software Update Screen
                // Action Button: Update Now or Check for Updates (y: 190..240, x: 100..366)
                if (touch.y >= 190 && touch.y <= 240 && touch.x >= 100 && touch.x <= 366) {
                  std::string lat_v = id(ha_firmware_latest_version).state;
                  bool has_update = is_newer_semver(lat_v, "${version}");
                  if (has_update) {
                    id(system_menu_mode) = 6; // Open Update Confirmation Dialog
                    id(disp1).update();
                  } else if (id(update_check_state) == 0) {
                    // Start interactive checking sequence
                    id(update_check_state) = 1;
                    id(update_check_timer) = millis();
                    id(check_firmware_update).execute();
                    id(disp1).update();
                  }
                // Standardized < BACK (y: 350..400, x: 120..346)
                } else if (touch.y >= 350 && touch.y <= 400 && touch.x >= 120 && touch.x <= 346) {
                  id(update_check_state) = 0; // Reset checking state
                  id(system_menu_mode) = 0; // Return to Main Telemetry Dashboard
                  id(disp1).update();
                }
              } else if (id(system_menu_mode) == 6) {
                // Mode 6: Update Confirmation Dialog
                if (touch.y >= 210 && touch.y <= 270) {
                  if (touch.x >= 90 && touch.x <= 225) {
                    // Cancel -> return to Software Update Screen
                    id(system_menu_mode) = 5;
                    id(disp1).update();
                  } else if (touch.x >= 240 && touch.x <= 375) {
                    // Confirm Install -> trigger update and arm OTA overlay
                    id(trigger_firmware_update).execute();
                  }
                }
              } else if (id(system_menu_mode) == 7) {
                // Mode 7: Audio & Media Submenu
                // Card 1: Full-Screen Album Art Style cycler (y: 90..130, x: 100..366)
                if (touch.y >= 90 && touch.y <= 130 && touch.x >= 100 && touch.x <= 366) {
                  std::string cur_mode = std::string(id(music_fullscreen_art_mode).current_option().c_str());
                  std::string nxt_mode = "Full Bleed";
                  if (cur_mode == "Full Bleed") {
                    nxt_mode = "Letterbox";
                  } else if (cur_mode == "Letterbox") {
                    nxt_mode = "Disabled";
                  } else {
                    nxt_mode = "Full Bleed";
                  }
                  auto call = id(music_fullscreen_art_mode).make_call();
                  call.set_option(nxt_mode);
                  call.perform();
                  id(disp1).update();
                // Card 2: Controls Overlay Toggle (y: 145..185, x: 100..366)
                } else if (touch.y >= 145 && touch.y <= 185 && touch.x >= 100 && touch.x <= 366) {
                  id(music_controls_overlay_switch).toggle();
                  id(disp1).update();
                // Card 3: Speaker Volume Step (y: 200..240, x: 100..366)
                } else if (touch.y >= 200 && touch.y <= 240 && touch.x >= 100 && touch.x <= 366) {
                  float v = id(pocket_music_player).volume + 0.10f;
                  if (v > 1.05f) v = 0.20f;
                  auto call = id(pocket_music_player).make_call();
                  call.set_volume(v);
                  call.perform();
                  id(disp1).update();
                // Card 4: Speaker Target Jump to Music Menu (y: 255..295, x: 100..366)
                } else if (touch.y >= 255 && touch.y <= 295 && touch.x >= 100 && touch.x <= 366) {
                  id(gui_page) = 2;
                  id(music_overlay_mode) = 1;
                  id(system_menu_mode) = 0;
                  id(disp1).update();
                // Standardized < BACK (y: 350..400, x: 120..346)
                } else if (touch.y >= 350 && touch.y <= 400 && touch.x >= 120 && touch.x <= 346) {
                  id(system_menu_mode) = 0; // Return to Main Telemetry Dashboard
                  id(disp1).update();
                }
              }
            }
        - script.execute: screen_sleep_timer


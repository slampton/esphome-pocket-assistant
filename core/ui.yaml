          float lap_angle = ((id(stopwatch_lap_ms) % 60000) / 60000.0f) * (2.0f * PI_F);
          float l_sin, l_cos;
          sincosf(lap_angle, &l_sin, &l_cos);
          it.line(cx, cy, cx + (int)(154.0f * l_sin), cy - (int)(154.0f * l_cos), id(col_red));
          it.line(cx + 1, cy, cx + (int)(154.0f * l_sin) + 1, cy - (int)(154.0f * l_cos), id(col_red));
          it.circle(cx + (int)(158.0f * l_sin), cy - (int)(158.0f * l_cos), 4, id(col_red));
        }

        // ----------------------------------------------------
        // MAIN CENTRAL ARROW HAND (CLASSIC 1970 HEUER BOLD CHRONOGRAPH)

                    id(system_menu_mode) = 0;
                    id(disp1).update();
                  }
                  return;
                }
              }
            } else if (id(gui_page) == 5) {
              // Page 5: Sky & Weather 4-View Suite Touch Routing (Single Icon Row & Right Chevrons)
              static uint32_t last_weather_touch = 0;
              uint32_t now_w_touch = millis();

              // Zone 1: Right-Flank Navigation Chevrons (x >= 370, y: 70..365)
              if (is_right_chevron_zone(touch)) {
                if (now_w_touch - last_weather_touch > TOUCH_DEBOUNCE_SCROLL) {
                  last_weather_touch = now_w_touch;
                  int dir = (touch.y < 220) ? -1 : 1;
                  id(sky_weather_subpage) = step_wrap(id(sky_weather_subpage), dir, 4);
                  ESP_LOGI("touch", "Page 5 Chevron Tap: dir=%d new_subpage=%d", dir, id(sky_weather_subpage));
                  id(disp1).update();
                }
                return;
              }

              // Zone 2: Single Row of 4 Transparent Vector Icon Buttons (y: 315..385, centered on y = 352, x < 370)
              if (touch.y >= 315 && touch.y <= 385 && touch.x < 370) {
                if (now_w_touch - last_weather_touch > TOUCH_DEBOUNCE_BUTTON) {
                  last_weather_touch = now_w_touch;
                  int target = 0;
                  if (touch.x < 158) target = 0;
                  else if (touch.x < 233) target = 1;
                  else if (touch.x < 308) target = 2;
                  else target = 3;

                  if (id(sky_weather_subpage) != target) {
                    id(sky_weather_subpage) = target;
                    ESP_LOGI("touch", "Page 5 Icon Tap: x=%d target=%d", touch.x, target);
                    id(disp1).update();
                  }
                }
                return;
              }

              // Zone 3: Interactive Upper-Right Celestial Icon Shortcut (x >= 280, y <= 159)
              // Generous zero-deadzone envelope covering entire upper-right quadrant from bezel (y~29px) inward
              if (id(sky_weather_subpage) == 0 && touch.x >= 280 && touch.y <= 159) {
                if (now_w_touch - last_weather_touch > TOUCH_DEBOUNCE_BUTTON) {
                  last_weather_touch = now_w_touch;
                  std::string s_state = id(ha_sun_state).state;
                  std::string cond = id(ha_weather_condition).state;
                  bool is_night = (s_state == "below_horizon" || cond == "clear-night" || cond == "clearnight" || (cond.find("night") != std::string::npos));
                  apply_weather_sim_override(id(weather_sim_condition).current_option(), cond, is_night);
                  int target = is_night ? 3 : 2;
                  ESP_LOGI("touch", "Page 5 Celestial Shortcut: x=%d y=%d target=%d is_night=%d", touch.x, touch.y, target, is_night);
                  if (id(sky_weather_subpage) != target) {
                    id(sky_weather_subpage) = target;
                    id(disp1).update();
                  }
                }
                return;
              }
            } else if (id(gui_page) == 7) {
              // ==============================================================================
              // PAGE 7: UNIVERSAL TV & MEDIA REMOTE CONTROL (MULTI-DEVICE SETTINGS & D-PAD)
              // ==============================================================================
              static uint32_t last_remote_btn_tap = 0;
              uint32_t now_rem = millis();
              const std::string rem_ents[4] = {
                "${tv_remote_entity}", "${tv_remote_entity_2}",
                "${tv_remote_entity_3}", "${tv_remote_entity_4}"
              };
              const std::string rem_names[4] = {
                id(remote_slot_0_name), id(remote_slot_1_name),
                id(remote_slot_2_name), id(remote_slot_3_name)
              };

              if (id(remote_subpage) == 1) {
                // Subpage 1: SETTINGS (Master Toggle Power + Up to 4 Preconfigured Devices)
                // 1. Master Toggle Power Pill at y = 104 (Always controls tv_remote_power_entity)
                if (touch.x >= 100 && touch.x <= 366 && touch.y >= 80 && touch.y <= 130) {
                  if (now_rem - last_remote_btn_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_remote_btn_tap = now_rem;
                    id(remote_send_key).execute(9, -1);
                    id(disp1).update();
                  }
                  return;
                }

                // 2. Configured Device Rows (y = 162, 220, 278, 336)
                int valid_slots[4] = {0, 0, 0, 0};
                int valid_count = pocket_ui::collect_configured_remote_slots(rem_ents, valid_slots);
                for (int row = 0; row < valid_count; row++) {
                  int y_mid = 162 + row * 58;
                  if (touch.y >= y_mid - 24 && touch.y <= y_mid + 24) {
                    int s_idx = valid_slots[row];
                    // 2A. Device Selection Pill (Uniform width: outer edges 92..324 across all rows)
                    if (touch.x >= 90 && touch.x <= 328) {
                      if (now_rem - last_remote_btn_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_remote_btn_tap = now_rem;
                        id(active_remote_slot) = s_idx;
                        id(remote_profile_user_set) = false;
                        std::string d_name = rem_names[s_idx].empty()
                                                 ? pocket_ui::format_remote_entity_fallback(rem_ents[s_idx])

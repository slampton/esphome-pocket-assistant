                then:
                  - lambda: |-
                      if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
                        auto call = id(pocket_music_player).make_call();
                        call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_PAUSE);
                        call.perform();
                      }
                      if (id(active_speaker_entity) != id(slot_3_id) && !id(active_speaker_entity).empty()) { id(last_speaker_entity) = id(active_speaker_entity); } id(active_speaker_entity) = id(slot_3_id);
                      id(active_speaker_name) = id(slot_3_name);
                      id(music_action_feedback) = "Controlling: " + id(slot_3_name);
                      id(music_feedback_timer) = millis();
                  - homeassistant.action:
                      action: input_text.set_value
                      data:
                        entity_id: ${active_speaker_helper}
                        value: !lambda 'return id(active_speaker_entity).c_str();'
                  - component.update: disp1
                  - delay: 600ms
                  - lambda: |-
                      id(music_overlay_mode) = 0;
                  - component.update: disp1
                else:
                  - lambda: |-
                      id(music_action_feedback) = "Playing: " + id(slot_3_name);
                      id(music_feedback_timer) = millis();
                  - homeassistant.action:
                      action: music_assistant.play_media
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'
                        media_id: !lambda 'return id(slot_3_id).c_str();'
                        media_type: !lambda |-
                          if (id(selected_category_mode) == "artist") return "artist";
                          if (id(selected_category_mode) == "album" || id(selected_category_mode) == "artist_albums") return "album";
                          return id(slot_3_type).c_str();
                  - delay: 800ms
                  - lambda: |-
                      id(music_overlay_mode) = 0;
                  - component.update: disp1


  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: |-
              return (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_IDLE) && 
                     !id(va).is_running() && 
                     !id(va_tts_received) && 
                     !id(announcement_mixing_input).is_running();
          then:
            - audio_dac.mute_on: es8311_dac
            - script.execute: route_i2s_to_mic
            - component.update: disp1

  - id: screen_sleep_timer
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            lambda: |-
              return !id(va).is_running() && 
                     !id(va_tts_received) && 
                     !id(announcement_mixing_input).is_running() && 
                     (id(pocket_music_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) && 
                     !id(stopwatch_running) &&
                     (id(gui_page) != 1) &&
                     !id(pickup_detected).state &&
                     (id(active_game) == 0) &&
                     (id(gui_page) != 3 || !id(usb_connected).state);
          then:
            - script.execute: enter_standby_state

  - id: cancel_voice_assistant
    then:
      - audio_dac.mute_on: es8311_dac
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 50
          duration: 0.1s
      - voice_assistant.stop:
      - speaker.stop: va_speaker
      - speaker.stop: announcement_mixing_input
      - lambda: |-
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
      - component.update: disp1
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 0.1s
      - delay: 100ms
      - if:
          condition:
            media_player.is_idle: pocket_music_player
          then:
            - script.execute: route_i2s_to_mic
      - if:
          condition:
            binary_sensor.is_off: pickup_detected
          then:
            - script.execute: screen_sleep_timer

  - id: route_i2s_to_mic
    then:
      - audio_dac.mute_on: es8311_dac
      - delay: 30ms
      - lambda: |-
          esp_rom_gpio_connect_out_signal(9, 26, false, false);   // GPIO9 -> I2S0 BCLK (signal 26)
          esp_rom_gpio_connect_out_signal(45, 27, false, false);  // GPIO45 -> I2S0 WS (signal 27)
          esp_rom_gpio_connect_out_signal(16, 23, false, false);  // GPIO16 -> I2S0 MCLK (signal 23)

  - id: route_i2s_to_spk
    then:
      - lambda: |-
          esp_rom_gpio_connect_out_signal(9, 28, false, false);   // GPIO9 -> I2S1 BCLK (signal 28)
          esp_rom_gpio_connect_out_signal(45, 29, false, false);  // GPIO45 -> I2S1 WS (signal 29)
          esp_rom_gpio_connect_out_signal(16, 21, false, false);  // GPIO16 -> I2S1 MCLK (signal 21)
      - switch.turn_on: speaker_enable
      - audio_dac.mute_off: es8311_dac

  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: update_pocket_assistant
      - lambda: |-
          id(system_menu_mode) = 5;
          id(disp1).update();

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: update_pocket_assistant


display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 40MHz
    reset_pin: GPIO1
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6
      offset_height: 0
    brightness: 200
    update_interval: 1s
    lambda: |-
      const int cx = 233;
      const int cy = 233;

      // Reusable Clean Pill / Stadium Button Helper (Artifact-Free Outer/Inner Geometry)
      auto draw_pill_button = [&](int x1, int x2, int y_mid, int r, Color border_c, Color bg_c, const char* label, Color text_c, bool has_bullet) {
        // Outer filled pill in border color
        it.filled_circle(x1, y_mid, r, border_c);
        it.filled_circle(x2, y_mid, r, border_c);
        it.filled_rectangle(x1, y_mid - r, x2 - x1, 2 * r + 1, border_c);

        // Inner filled pill in background color (2px inset)
        it.filled_circle(x1, y_mid, r - 2, bg_c);
        it.filled_circle(x2, y_mid, r - 2, bg_c);
        it.filled_rectangle(x1, y_mid - (r - 2), x2 - x1, 2 * (r - 2) + 1, bg_c);

        // Perfectly centered text on midpoint of pill (x1 + x2) / 2 (zero bullet offset)
        int btn_cx = (x1 + x2) / 2;
        it.print(btn_cx, y_mid, id(font_small), text_c, TextAlign::CENTER, label);
      };

      // Semantic Version Comparison Helper (Rejects ESPHome 2026.x CalVer; strictly tests major.minor.patch)
      auto is_newer_semver = [](const std::string& lat_str, const std::string& cur_str) -> bool {
        if (lat_str.empty() || lat_str == "unavailable" || lat_str == "unknown") return false;
        std::string l = lat_str;
        if (!l.empty() && (l[0] == 'v' || l[0] == 'V')) l = l.substr(1);
        std::string c = cur_str;
        if (!c.empty() && (c[0] == 'v' || c[0] == 'V')) c = c.substr(1);
        if (l.rfind("202", 0) == 0) return false; // Reject ESPHome CalVer (2026.x)
        int l_maj = 0, l_min = 0, l_pat = 0;
        int c_maj = 0, c_min = 0, c_pat = 0;
        if (sscanf(l.c_str(), "%d.%d.%d", &l_maj, &l_min, &l_pat) < 2) return false;
        if (sscanf(c.c_str(), "%d.%d.%d", &c_maj, &c_min, &c_pat) < 2) return false;
        if (l_maj > c_maj) return true;
        if (l_maj < c_maj) return false;
        if (l_min > c_min) return true;
        if (l_min < c_min) return false;
        return l_pat > c_pat;
      };

      // ==========================================
      // GLOBAL OVERLAY: OTA FIRMWARE UPDATE IN PROGRESS (Always renders even if screen was off)
      // ==========================================
      if (id(ota_in_progress)) {
        it.fill(id(col_bg));

        // Outer bezel accent rings (Themed architectural track)
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(theme_primary));
        it.circle(cx, cy, 227, id(theme_primary));
        it.circle(cx, cy, 222, id(col_dark_gray));

        // Circular Bezel Gauge (Radius 214)
        // Recessed track
        it.circle(cx, cy, 216, id(col_dark_gray));
        it.circle(cx, cy, 215, id(col_dark_gray));
        it.circle(cx, cy, 214, id(col_dark_gray));
        it.circle(cx, cy, 213, id(col_dark_gray));

        // Solid progress arc fill up to current percentage (follows active Color Palette)
        int pct = id(ota_progress_pct);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        for (int i = 0; i <= pct; i++) {
          float rad = ((float)i / 100.0f) * 2.0f * 3.14159265f - 1.5707963f; // 12 o'clock top is -pi/2
          float c = cosf(rad);
          float s = sinf(rad);
          it.line(cx + (int)(212 * c), cy + (int)(212 * s), cx + (int)(218 * c), cy + (int)(218 * s), id(theme_secondary));
        }

        it.print(cx, cy - 60, id(font_date), id(theme_primary), TextAlign::CENTER, "FIRMWARE UPDATE");

        char prog_buf[32];
        snprintf(prog_buf, sizeof(prog_buf), "%d%%", pct);
        it.print(cx, cy + 8, id(font_time), id(col_white), TextAlign::CENTER, prog_buf);

        // Dynamic stage messaging
        const char* status_msg = "Preparing flash...";
        if (pct >= 99) {
          status_msg = "Rebooting device...";
        } else if (pct >= 85) {
          status_msg = "Verifying image...";
        } else if (pct >= 10) {
          status_msg = "Writing flash memory...";
        }
        it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, status_msg);
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: DOCKED SCREENSAVER (Mode 1)
      // ==========================================
      if (id(display_power_state) == 1) {
        it.fill(id(col_bg));

        auto now = id(ha_time).now();
        int sec = now.is_valid() ? now.second : 0;

        // AMOLED Burn-in Prevention: Drift center position based on minute
        int drift_x = (sec % 10) * 4 - 20;
        int drift_y = ((sec / 10) % 6) * 4 - 10;

        // Ambient Minimalist Clock
        char amb_time[16];
        if (now.is_valid()) {
          if (id(is_24h_format)) {
            snprintf(amb_time, sizeof(amb_time), "%02d:%02d", now.hour, now.minute);
          } else {
            int h12 = now.hour % 12;
            if (h12 == 0) h12 = 12;
            snprintf(amb_time, sizeof(amb_time), "%d:%02d", h12, now.minute);
          }
          it.print(cx + drift_x, cy - 20 + drift_y, id(font_time), id(col_slate), TextAlign::CENTER, amb_time);

          it.strftime(cx + drift_x, cy + 45 + drift_y, id(font_small), id(col_dark_gray), TextAlign::CENTER, "%a, %b %d", now);
        } else {
          it.print(cx + drift_x, cy - 20 + drift_y, id(font_time), id(col_slate), TextAlign::CENTER, "--:--");
        }
        return;
      }

      if (!id(display_brightness).current_values.is_on() || id(display_power_state) == 2) {
        it.fill(id(col_bg));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: HIBERNATION SHUTDOWN
      // ==========================================
      if (id(is_hibernating)) {
        it.fill(id(col_bg));
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(theme_primary));
        it.circle(cx, cy, 227, id(theme_primary));
        it.circle(cx, cy, 222, id(col_dark_gray));

        it.print(cx, cy - 65, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");

        char c_buf[16];
        if (id(hibernate_countdown_val) > 0) {
          snprintf(c_buf, sizeof(c_buf), "%d", id(hibernate_countdown_val));
          it.print(cx, cy + 5, id(font_chrono_time), id(theme_secondary), TextAlign::CENTER, c_buf);
          it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, "Tap screen to stay awake");
        } else {
          it.print(cx, cy + 20, id(font_small), id(col_slate), TextAlign::CENTER, "Shutting down...");
        }
        return;
      }

      static constexpr float PI_F = 3.14159265358979323846f;
      auto now = id(ha_time).now();
      float batt = id(batt_level).state;

      // ==========================================
      // GLOBAL OVERLAY: VOICE ASSISTANT TAKEOVER (v3.0.0 LIVING AI ENGINE)
      // ==========================================
      if (id(va_active) || !id(va_status_text).empty()) {
        uint32_t now_ms = millis();
        bool is_speaking = id(va_tts_received);
        bool is_thinking = (!is_speaking && id(va_status_text) == "Thinking...");

        // Strict Blue-Purple-Pink Spectral Gradient Helper (Zero yellow, green, or red)
        auto get_nuanced_radiation_color = [](float t) -> Color {
          t = t - floorf(t);
          if (t < 0.333f) {
            float k = t / 0.333f;
            return Color((uint8_t)(138.0f * k), (uint8_t)(229.0f * (1.0f - k) + 43.0f * k), (uint8_t)(255.0f * (1.0f - k) + 226.0f * k));
          } else if (t < 0.667f) {
            float k = (t - 0.333f) / 0.334f;
            return Color((uint8_t)(138.0f + 86.0f * k), (uint8_t)(43.0f + 21.0f * k), (uint8_t)(226.0f + 25.0f * k));
          } else {
            float k = (t - 0.667f) / 0.333f;
            return Color((uint8_t)(224.0f * (1.0f - k)), (uint8_t)(64.0f * (1.0f - k) + 229.0f * k), 255);
          }
        };

        if (is_speaking) {
          // ====================================================
          // STATE 3: SPEAKING (TTS) — RADIATING EXPANDING HARMONIC BANDS
          // ====================================================
          // 5 Out-of-phase expanding radiating bands (2000ms cycle) with dynamic thickness and gradient blending
          // Stripped of secondary echo/ripple artifacts for clean, bold, smooth radiating rings
          for (int w = 0; w < 5; w++) {
            uint32_t wave_t = (now_ms + w * 400) % 2000;
            float progress = (float)wave_t / 2000.0f; // 0.0 -> 1.0 radial expansion
            int r_center = 36 + (int)(progress * 180.0f);

            // Dynamic Band Width: swells from 4px near core up to 8-12px in mid-burst, tapering near perimeter
            float width_factor = sinf(progress * PI_F);
            int base_w = (w % 2 == 0) ? 7 : 4;
            int band_w = base_w + (int)(5.0f * width_factor);
            if (band_w < 3) band_w = 3;
            int half_w = band_w / 2;

            // Spectral phase across the blue-purple-pink loop
            float wave_color_phase = (float)w * 0.20f + progress * 0.30f + (float)(now_ms % 4000) / 4000.0f;

            // Draw clean gradient-shaded pillowed band
            for (int d = -half_w; d <= half_w; d++) {
              int r_curr = r_center + d;
              if (r_curr < 34 || r_curr > 226) continue;

              float edge_dist = fabsf((float)d) / (float)(half_w + 1);
              float band_phase = wave_color_phase + (float)d * 0.02f;
              Color base_col = get_nuanced_radiation_color(band_phase);

              Color stroke_col;
              if (edge_dist < 0.35f) {
                // Subtle bright center crest
                stroke_col = Color(
                  (uint8_t)(base_col.red * 0.75f + 255.0f * 0.25f),
                  (uint8_t)(base_col.green * 0.75f + 255.0f * 0.25f),
                  (uint8_t)(base_col.blue * 0.75f + 255.0f * 0.25f)
                );
              } else {
                stroke_col = base_col;
              }
              it.circle(cx, cy, r_curr, stroke_col);
            }
          }

          // Pulsing Acoustic Core (800ms rhythmic beat, matte layered depth with subtle shadow, zero white specular spots)
          float core_pulse = sinf((float)(now_ms % 800) * (2.0f * PI_F / 800.0f));
          int core_r = 20 + (int)(4.0f * core_pulse);

          Color aura_col = get_nuanced_radiation_color((float)(now_ms % 3000) / 3000.0f);
          Color body_col = get_nuanced_radiation_color((float)(now_ms % 3000) / 3000.0f + 0.33f);

          it.filled_circle(cx, cy + 2, core_r + 3, id(col_dark_gray)); // subtle drop shadow
          it.circle(cx, cy, core_r + 3, aura_col);
          it.circle(cx, cy, core_r + 2, aura_col);
          it.filled_circle(cx, cy, core_r, body_col);

          if (core_r > 6) {
            Color inner_tone = Color(
              (uint8_t)(body_col.red * 0.82f + 35),
              (uint8_t)(body_col.green * 0.82f + 35),
              (uint8_t)(body_col.blue * 0.82f + 35)
            );
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

        } else if (is_thinking) {
          // ====================================================
          // STATE 2: THINKING — THE QUANTUM COGNITIVE ENGINE
          // ====================================================
          it.circle(cx, cy, 52, id(col_dark_gray));
          it.circle(cx, cy, 74, id(col_dark_gray));

          float spin_cw = (float)(now_ms % 900) * (2.0f * PI_F / 900.0f);
          float spin_ccw = -(float)(now_ms % 900) * (2.0f * PI_F / 900.0f);

          // Inner CW orbit nodes (Cyan)
          for (int i = 0; i < 3; i++) {
            float ang = spin_cw + i * (2.0f * PI_F / 3.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)(52.0f * c_node);
            int ny = cy + (int)(52.0f * s_node);
            it.filled_circle(nx, ny, 4, id(col_cyan));
            it.filled_circle(nx, ny, 2, id(col_white));
          }

          // Outer CCW orbit nodes (Magenta / Purple)
          for (int i = 0; i < 3; i++) {
            float ang = spin_ccw + i * (2.0f * PI_F / 3.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)(74.0f * c_node);
            int ny = cy + (int)(74.0f * s_node);
            it.filled_circle(nx, ny, 4, id(col_magenta));
            it.filled_circle(nx, ny, 2, id(col_purple));
          }

          // Cognitive Pulse Core - Consistent Matte Layered Depth (NO shiny white specular 3D spot!)
          float pulse = sinf((float)(now_ms % 600) * (2.0f * PI_F / 600.0f));
          int core_r = 20 + (int)(4.0f * pulse);

          it.filled_circle(cx, cy + 2, core_r + 3, id(col_dark_gray)); // subtle drop shadow
          it.circle(cx, cy, core_r + 4, id(col_purple));
          it.circle(cx, cy, core_r + 3, id(col_purple));
          it.filled_circle(cx, cy, core_r, id(col_cyan));

          if (core_r > 6) {
            Color inner_tone = Color(30, 200, 230); // Soft diffuse inner definition
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

          it.print(cx, cy + 105, id(font_small), id(col_cyan), TextAlign::CENTER, "Thinking...");

        } else {
          // ====================================================
          // STATE 1: LISTENING — THE LIVING ATTENTIVE CORE
          // ====================================================
          it.circle(cx, cy, 56, id(col_dark_gray));

          // 3 Orbital Satellites gently revolving at a graceful 3.6s pace
          float orbit_ang = (float)(now_ms % 3600) * (2.0f * PI_F / 3600.0f);
          for (int i = 0; i < 3; i++) {
            float ang = orbit_ang + i * (2.0f * PI_F / 3.0f);
            float s_node, c_node;
            sincosf(ang, &s_node, &c_node);
            int nx = cx + (int)(56.0f * c_node);
            int ny = cy + (int)(56.0f * s_node);
            it.filled_circle(nx, ny, 3, id(col_light_blue));
            it.filled_circle(nx, ny, 1, id(col_white));
          }

          // Organic 1.6-second Breathing Core and Aura - Consistent Matte Layered Depth (NO shiny white specular 3D spot!)
          float pulse = sinf((float)(now_ms % 1600) * (2.0f * PI_F / 1600.0f));
          int core_r = 20 + (int)(5.0f * pulse);
          int aura_r = 36 + (int)(8.0f * pulse);

          it.circle(cx, cy, aura_r + 2, id(col_dark_gray));
          it.circle(cx, cy, aura_r, id(col_purple));
          it.circle(cx, cy, aura_r - 1, id(col_purple));

          it.filled_circle(cx, cy + 2, core_r + 3, id(col_dark_gray)); // subtle drop shadow
          it.circle(cx, cy, core_r + 3, id(col_light_blue));
          it.circle(cx, cy, core_r + 2, id(col_light_blue));
          it.filled_circle(cx, cy, core_r, id(col_cyan));

          if (core_r > 6) {
            Color inner_tone = Color(30, 200, 230); // Soft diffuse inner definition
            it.circle(cx, cy - 1, core_r - 3, inner_tone);
          }

          const char *status_str = id(va_status_text).empty() ? "Listening..." : id(va_status_text).c_str();
          it.print(cx, cy + 95, id(font_small), id(col_cyan), TextAlign::CENTER, status_str);
        }
        return;
      }

      // ==========================================
      // GLOBAL BOTTOM NAVIGATION BAR (Fixed Anchors & Centered Page Counter)
      // ==========================================
      if (id(active_deck_size) > 1 && !id(is_hibernating) && !id(ota_in_progress) && !id(va_active) && id(va_status_text).empty() && id(display_power_state) == 0 && id(system_menu_mode) == 0 && !(id(gui_page) == 3 && id(active_game) > 0) && !(id(gui_page) == 2 && id(music_overlay_mode) == 1)) {
        // Universal Left & Right fixed navigation anchors (Pixel-perfect vector chevrons matching preferred '>' size)
        // Left Anchor (<): 9px wide, 15px tall, 2px stroke
        it.line(165 + 4, 424 - 7, 165 - 4, 424, id(theme_secondary));
        it.line(165 + 5, 424 - 7, 165 - 3, 424, id(theme_secondary));
        it.line(165 + 4, 424 + 7, 165 - 4, 424, id(theme_secondary));
        it.line(165 + 5, 424 + 7, 165 - 3, 424, id(theme_secondary));

        // Right Anchor (>): 9px wide, 15px tall, 2px stroke (exact mirror geometry)
        it.line(301 - 4, 424 - 7, 301 + 4, 424, id(theme_secondary));
        it.line(301 - 5, 424 - 7, 301 + 3, 424, id(theme_secondary));
        it.line(301 - 4, 424 + 7, 301 + 4, 424, id(theme_secondary));
        it.line(301 - 5, 424 + 7, 301 + 3, 424, id(theme_secondary));

        std::string cnt_mode = std::string(id(page_counter_mode).current_option().c_str());
        if (cnt_mode.empty()) cnt_mode = "Always";

        bool show_in_music = (cnt_mode == "Always" || cnt_mode == "Music Only");
        bool show_in_deck = (cnt_mode == "Always" || cnt_mode == "System Only");

        if (id(gui_page) == 2 && id(music_overlay_mode) == 2) {
          // In Browse Library categories: show category page (e.g. "1 / 3")
          if (show_in_music) {
            char pg_buf[16];
            snprintf(pg_buf, sizeof(pg_buf), "%d / 3", id(music_category_page));
            it.print(cx, 424, id(font_small), id(col_slate), TextAlign::CENTER, pg_buf);
          }
        } else if (id(gui_page) == 2 && id(music_overlay_mode) == 3) {
          // In Item Browser: show item browse page (e.g. "1 / 21")
          if (show_in_music) {
            char pg_buf[16];
            snprintf(pg_buf, sizeof(pg_buf), "%d / %d", id(music_browse_page), id(music_browse_total_pages));
            it.print(cx, 424, id(font_small), id(col_slate), TextAlign::CENTER, pg_buf);
          }
        } else {
          // App Deck indicator: centered page readout (e.g. "1 / 5", "2 / 5")
          if (show_in_deck) {
            int total = id(active_deck_size);
            int cur = id(current_deck_index);
            char pg_buf[16];
            snprintf(pg_buf, sizeof(pg_buf), "%d / %d", cur + 1, total);
            it.print(cx, 424, id(font_small), id(col_slate), TextAlign::CENTER, pg_buf);
          }
        }
      }

      // ==========================================
      // PAGE 0: WATCH FACE (HIGH-CONTRAST MODERN DIAL)
      // ==========================================
      if (id(gui_page) == 0) {
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(col_slate));
        it.circle(cx, cy, 222, id(col_dark_gray));

        if (!now.is_valid()) {
          it.print(cx, cy - 10, id(font_date), id(col_slate), TextAlign::CENTER, "Connecting...");
          return;
        }

        int hour = now.hour;
        int min = now.minute;
        int sec = now.second;

        // Priority 2: Precomputed 60-tick sine/cosine LUT - eliminates 120 transcendental float calls/frame
        static constexpr float DIAL_SIN[60] = {
          0.000000f, 0.104528f, 0.207912f, 0.309017f, 0.406737f, 0.500000f,
          0.587785f, 0.669131f, 0.743145f, 0.809017f, 0.866025f, 0.913545f,
          0.951057f, 0.978148f, 0.994522f, 1.000000f, 0.994522f, 0.978148f,
          0.951057f, 0.913545f, 0.866025f, 0.809017f, 0.743145f, 0.669131f,
          0.587785f, 0.500000f, 0.406737f, 0.309017f, 0.207912f, 0.104528f,
          0.000000f, -0.104528f, -0.207912f, -0.309017f, -0.406737f, -0.500000f,
          -0.587785f, -0.669131f, -0.743145f, -0.809017f, -0.866025f, -0.913545f,
          -0.951057f, -0.978148f, -0.994522f, -1.000000f, -0.994522f, -0.978148f,
          -0.951057f, -0.913545f, -0.866025f, -0.809017f, -0.743145f, -0.669131f,
          -0.587785f, -0.500000f, -0.406737f, -0.309017f, -0.207912f, -0.104528f
        };
        static constexpr float DIAL_COS[60] = {
          1.000000f, 0.994522f, 0.978148f, 0.951057f, 0.913545f, 0.866025f,
          0.809017f, 0.743145f, 0.669131f, 0.587785f, 0.500000f, 0.406737f,
          0.309017f, 0.207912f, 0.104528f, 0.000000f, -0.104528f, -0.207912f,
          -0.309017f, -0.406737f, -0.500000f, -0.587785f, -0.669131f, -0.743145f,
          -0.809017f, -0.866025f, -0.913545f, -0.951057f, -0.978148f, -0.994522f,
          -1.000000f, -0.994522f, -0.978148f, -0.951057f, -0.913545f, -0.866025f,
          -0.809017f, -0.743145f, -0.669131f, -0.587785f, -0.500000f, -0.406737f,
          -0.309017f, -0.207912f, -0.104528f, 0.000000f, 0.104528f, 0.207912f,
          0.309017f, 0.406737f, 0.500000f, 0.587785f, 0.669131f, 0.743145f,
          0.809017f, 0.866025f, 0.913545f, 0.951057f, 0.978148f, 0.994522f
        };

        if (id(clock_face_digital)) {
          // Perimeter bezel ticks
          for (int i = 0; i < 60; i++) {
            float s = DIAL_SIN[i];
            float c = DIAL_COS[i];
            if (i % 5 == 0) {
              it.line(cx + (int)(212 * s), cy - (int)(212 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_slate));
            } else {
              it.line(cx + (int)(216 * s), cy - (int)(216 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_gray));
            }
          }
          // Highlight active second tick in theme primary
          float s_sec = DIAL_SIN[sec % 60];
          float c_sec = DIAL_COS[sec % 60];
          it.line(cx + (int)(208 * s_sec), cy - (int)(208 * c_sec), cx + (int)(220 * s_sec), cy - (int)(220 * c_sec), id(theme_primary));
          it.line(cx + (int)(208 * s_sec) + 1, cy - (int)(208 * c_sec), cx + (int)(220 * s_sec) + 1, cy - (int)(220 * c_sec), id(theme_primary));

          // Date Header: "MON, SEP 28" (Theme Primary)
          it.strftime(cx, 130, id(font_date), id(theme_primary), TextAlign::CENTER, "%a, %b %d", now);

          // Giant Bold Digital Time: "10:45" (12h) or "14:45" (24h)
          char dig_buf[16];
          if (id(is_24h_format)) {
            snprintf(dig_buf, sizeof(dig_buf), "%02d:%02d", now.hour, now.minute);
          } else {
            int h12 = now.hour % 12;
            if (h12 == 0) h12 = 12;
            snprintf(dig_buf, sizeof(dig_buf), "%d:%02d", h12, now.minute);
          }
          it.print(cx, 205, id(font_time), id(col_white), TextAlign::CENTER, dig_buf);

          // AM/PM & Seconds Pill: (Theme Secondary)
          char sec_buf[16];
          if (id(is_24h_format)) {
            snprintf(sec_buf, sizeof(sec_buf), "SEC  •  %02ds", sec);
          } else {
            snprintf(sec_buf, sizeof(sec_buf), "%s  •  %02ds", now.hour >= 12 ? "PM" : "AM", sec);
          }
          it.print(cx, 262, id(font_small), id(theme_secondary), TextAlign::CENTER, sec_buf);

          // Battery telemetry in cyan with charging bolt / battery gauge
          if (!isnan(batt)) {
            char batt_str[16];
            snprintf(batt_str, sizeof(batt_str), "%.0f%%", batt);
            int text_x = cx + 8;
            it.print(text_x, 340, id(font_small), id(theme_primary), TextAlign::CENTER, batt_str);
            int bx = text_x - (batt >= 100.0f ? 36 : 28);
            int by = 340;
            if (id(batt_charging).state) {
              it.filled_triangle(bx + 3, by - 9, bx - 3, by, bx + 1, by, id(col_gold));
              it.filled_triangle(bx - 1, by, bx + 2, by, bx - 2, by + 9, id(col_gold));
            } else {
              it.filled_rectangle(bx - 2, by - 9, 4, 2, id(col_green));
              it.rectangle(bx - 5, by - 7, 10, 16, id(col_green));
              int fill_h = (int)std::max(1.0f, std::min(12.0f, (batt / 100.0f) * 12.0f));
              it.filled_rectangle(bx - 3, (by + 7) - fill_h, 6, fill_h, id(col_green));
            }
          }
          return;
        }

        // Modernized Dial Markers: Refined perimeter bezel ticks with 6 o'clock pip sanctuary
        for (int i = 0; i < 60; i++) {
          if (i == 30) continue; // 6 o'clock pip sanctuary: omitted to frame carousel pips cleanly
          float s = DIAL_SIN[i];
          float c = DIAL_COS[i];

          if (i % 5 == 0) {
            it.line(cx + (int)(212 * s), cy - (int)(212 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_slate));
          } else {
            it.line(cx + (int)(216 * s), cy - (int)(216 * c), cx + (int)(220 * s), cy - (int)(220 * c), id(col_gray));
          }
        }

        // Formatted date (white) and digital time complication (uniform slate gray)
        it.strftime(cx, 145, id(font_date), id(col_white), TextAlign::CENTER, "%a, %b %d", now);
        char time_buf[16];
        if (id(is_24h_format)) {
          snprintf(time_buf, sizeof(time_buf), "%02d:%02d", now.hour, now.minute);
        } else {
          int h12 = now.hour % 12;
          if (h12 == 0) h12 = 12;
          snprintf(time_buf, sizeof(time_buf), "%d:%02d %s", h12, now.minute, now.hour >= 12 ? "pm" : "am");
        }
        it.print(cx, 305, id(font_small), id(col_slate), TextAlign::CENTER, time_buf);

        // Battery percentage in cyan in all states; golden charging bolt appears on left when plugged in
        if (!isnan(batt)) {
          char batt_str[16];
          snprintf(batt_str, sizeof(batt_str), "%.0f%%", batt);
          int text_x = cx + 8;
          it.print(text_x, 380, id(font_small), id(theme_primary), TextAlign::CENTER, batt_str);
          int bx = text_x - (batt >= 100.0f ? 36 : 28);
          int by = 380;
          if (id(batt_charging).state) {
            // Golden Charging Lightning Bolt (18px total height)
            it.filled_triangle(bx + 3, by - 9, bx - 3, by, bx + 1, by, id(col_gold));
            it.filled_triangle(bx - 1, by, bx + 2, by, bx - 2, by + 9, id(col_gold));
          } else {
            // Crisp Green Vertical Battery Icon (18px total height)
            it.filled_rectangle(bx - 2, by - 9, 4, 2, id(col_green)); // Terminal pip
            it.rectangle(bx - 5, by - 7, 10, 16, id(col_green)); // Outer body
            int fill_h = (int)std::max(1.0f, std::min(12.0f, (batt / 100.0f) * 12.0f));
            it.filled_rectangle(bx - 3, (by + 7) - fill_h, 6, fill_h, id(col_green)); // Bottom-up fill
          }
        }

        float h_angle = ((hour % 12) + min / 60.0f + sec / 3600.0f) * (2.0f * PI_F / 12.0f);
        float m_angle = (min + sec / 60.0f) * (2.0f * PI_F / 60.0f);
        float s_angle = sec * (2.0f * PI_F / 60.0f);

        // Hour Hand: Bold White Sword Hand (base width 14px, length 88px)
        {
          float sin_h, cos_h;
          sincosf(h_angle, &sin_h, &cos_h);
          it.filled_triangle(cx - (int)(7.0f * cos_h), cy - (int)(7.0f * sin_h),
                             cx + (int)(7.0f * cos_h), cy + (int)(7.0f * sin_h),
                             cx + (int)(88.0f * sin_h), cy - (int)(88.0f * cos_h),
                             id(col_white));
        }

        // Minute Hand: Slender Slate Gray Sword Hand (base width 8px, length 148px)
        {
          float sin_m, cos_m;
          sincosf(m_angle, &sin_m, &cos_m);
          it.filled_triangle(cx - (int)(4.0f * cos_m), cy - (int)(4.0f * sin_m),
                             cx + (int)(4.0f * cos_m), cy + (int)(4.0f * sin_m),
                             cx + (int)(148.0f * sin_m), cy - (int)(148.0f * cos_m),
                             id(col_slate));
        }

        // Second Hand: Dynamic Theme Needle (length 168px) with 4px circular counterweight
        {
          float sin_s, cos_s;
          sincosf(s_angle, &sin_s, &cos_s);
          int tip_x = cx + (int)(168.0f * sin_s);
          int tip_y = cy - (int)(168.0f * cos_s);
          int tail_x = cx - (int)(30.0f * sin_s);
          int tail_y = cy + (int)(30.0f * cos_s);
          it.line(tail_x, tail_y, tip_x, tip_y, id(theme_secondary));
          it.filled_circle(tail_x, tail_y, 4, id(theme_secondary));
        }

        // Center Pinion Cap (White ring, themed center pip)
        it.filled_circle(cx, cy, 7, id(col_white));
        it.filled_circle(cx, cy, 4, id(theme_secondary));
        it.filled_circle(cx, cy, 2, id(col_dark_gray));

      // ==========================================
      // PAGE 1: VINTAGE 1970 HEUER SWISS CHRONOMETER
      // High-Contrast Aged Parchment Dial, Dual Silver & Black Bezels,
      // 1/10s High-Speed Spinning Subdial, Bold Arrow Hand & Large Digital Readout
      // ==========================================
      } else if (id(gui_page) == 1) {
        // Outer Triple Bezel: Silver Outer Ring -> Black Band -> Inner Silver Accent Ring
        it.circle(cx, cy, 230, id(col_silver));
        it.circle(cx, cy, 229, id(col_silver));
        it.circle(cx, cy, 228, id(col_black));
        it.circle(cx, cy, 227, id(col_black));
        it.circle(cx, cy, 226, id(col_black));
        it.circle(cx, cy, 225, id(col_black));
        it.circle(cx, cy, 224, id(col_silver));
        it.circle(cx, cy, 223, id(col_silver));

        // Authentic 1970s Vintage Aged Parchment / Warm Opaline Off-White Dial
        it.filled_circle(cx, cy, 222, Color(216, 206, 184));

        // Outer Chapter Track Boundaries (Bold double ring)
        it.circle(cx, cy, 220, id(col_black));
        it.circle(cx, cy, 219, id(col_black));
        it.circle(cx, cy, 192, id(col_black));
        it.circle(cx, cy, 191, id(col_black));

        // Precision Perimeter Chapter Ring (Bold 3px Major 5s bars, 2px Minor 1s ticks)
        for (int s = 0; s < 60; s++) {
          float a = s * (2.0f * PI_F / 60.0f);
          float t_sin, t_cos;
          sincosf(a, &t_sin, &t_cos);
          
          if (s % 5 == 0) {
            // Major 5-Second Bar: 3px wide, prominent solid black
            float perp_x = -t_cos;
            float perp_y = t_sin;
            int x1 = cx + (int)(191.0f * t_sin);
            int y1 = cy - (int)(191.0f * t_cos);
            int x2 = cx + (int)(220.0f * t_sin);
            int y2 = cy - (int)(220.0f * t_cos);
            it.line(x1, y1, x2, y2, id(col_black));
            it.line(x1 + (int)perp_x, y1 + (int)perp_y, x2 + (int)perp_x, y2 + (int)perp_y, id(col_black));
            it.line(x1 - (int)perp_x, y1 - (int)perp_y, x2 - (int)perp_x, y2 - (int)perp_y, id(col_black));
          } else {
            // Standard 1-Second Tick: 2px wide from r=204 to r=220
            int x1 = cx + (int)(204.0f * t_sin);
            int y1 = cy - (int)(204.0f * t_cos);
            int x2 = cx + (int)(220.0f * t_sin);
            int y2 = cy - (int)(220.0f * t_cos);
            it.line(x1, y1, x2, y2, id(col_black));
            it.line(x1 + 1, y1, x2 + 1, y2, id(col_black));
          }
        }

        // Bold Perimeter Numerals (5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55 - 60 omitted for STOPWATCH)
        for (int s = 5; s <= 55; s += 5) {
          float a = s * (2.0f * PI_F / 60.0f);
          float t_sin, t_cos;
          sincosf(a, &t_sin, &t_cos);
          char num_str[8];
          snprintf(num_str, sizeof(num_str), "%d", s);
          it.print(cx + (int)(170.0f * t_sin), cy - (int)(170.0f * t_cos),
                   id(font_small), id(col_black), TextAlign::CENTER, num_str);
        }

        // Vintage Title at Top: STOPWATCH (clean, non-overlapping)
        it.print(cx, 66, id(font_small), id(col_black), TextAlign::CENTER, "STOPWATCH");

        uint32_t total_ms = id(stopwatch_running) ? (millis() - id(stopwatch_start_time)) : id(stopwatch_elapsed_ms);
        int mins = (total_ms / 60000) % 60;
        int secs = (total_ms / 1000) % 60;
        int tenths = (total_ms / 100) % 10;

        // ----------------------------------------------------
        // 12 O'CLOCK SUB-DIAL: 1/10-SECOND HIGH-SPEED SPINNER (ENLARGED r=50)
        // ----------------------------------------------------
        const int sub_cx = cx;
        const int sub_cy = 140;
        const int sub_r = 50;

        // Recessed subdial with subtle authentic mechanical depth shading
        it.filled_circle(sub_cx, sub_cy, sub_r - 2, Color(208, 198, 176));
        it.circle(sub_cx, sub_cy, sub_r, id(col_black));
        it.circle(sub_cx, sub_cy, sub_r - 1, id(col_black));
        it.circle(sub_cx, sub_cy, sub_r - 2, id(col_silver));

        // 10 Tenths Ticks (0..9) with bold major bars
        for (int i = 0; i < 10; i++) {
          float a = i * (2.0f * PI_F / 10.0f);
          float s_i, c_i;
          sincosf(a, &s_i, &c_i);
          int r_in = (i % 2 == 0) ? (sub_r - 10) : (sub_r - 6);
          it.line(sub_cx + (int)(r_in * s_i), sub_cy - (int)(r_in * c_i),
                  sub_cx + (int)((sub_r - 2) * s_i), sub_cy - (int)((sub_r - 2) * c_i), id(col_black));
          if (i % 2 == 0) {
            it.line(sub_cx + (int)(r_in * s_i) + 1, sub_cy - (int)(r_in * c_i),
                    sub_cx + (int)((sub_r - 2) * s_i) + 1, sub_cy - (int)((sub_r - 2) * c_i), id(col_black));
          }
        }

        // Subdial Markings: 0, 2, 4, 6, 8 (Bold font_small size 20)
        for (int i = 0; i < 10; i += 2) {
          float a = i * (2.0f * PI_F / 10.0f);
          float s_i, c_i;
          sincosf(a, &s_i, &c_i);
          char sub_num[4];
          snprintf(sub_num, sizeof(sub_num), "%d", i);
          it.print(sub_cx + (int)(28.0f * s_i), sub_cy - (int)(28.0f * c_i),
                   id(font_small), id(col_black), TextAlign::CENTER, sub_num);
        }

        it.print(sub_cx, sub_cy + 14, id(font_micro), id(col_slate), TextAlign::CENTER, "1/10 SEC");

        // High-Speed 1/10s Spinning Needle (2px bold racing red, 1 revolution per 1000ms!)
        float sub_angle = ((total_ms % 1000) / 1000.0f) * (2.0f * PI_F);
        float sub_sin, sub_cos;
        sincosf(sub_angle, &sub_sin, &sub_cos);
        int sub_tip_x = sub_cx + (int)(38.0f * sub_sin);
        int sub_tip_y = sub_cy - (int)(38.0f * sub_cos);
        int sub_tail_x = sub_cx - (int)(9.0f * sub_sin);
        int sub_tail_y = sub_cy + (int)(9.0f * sub_cos);
        it.line(sub_tail_x, sub_tail_y, sub_tip_x, sub_tip_y, id(col_red));
        it.line(sub_tail_x + 1, sub_tail_y, sub_tip_x + 1, sub_tip_y, id(col_red));
        it.filled_circle(sub_cx, sub_cy, 4, id(col_black));
        it.filled_circle(sub_cx, sub_cy, 2, id(col_silver));

        // ----------------------------------------------------
        // CHRONOMETER DIGITAL READOUT (Large, Bold, High-Legibility)
        // ----------------------------------------------------
        char chrono_buf[32];
        snprintf(chrono_buf, sizeof(chrono_buf), "%02d:%02d.%d", mins, secs, tenths);
        it.print(cx, 248, id(font_chrono_time), id(col_black), TextAlign::CENTER, chrono_buf);

        // Display lap time readout if recorded (centered at y=272, well clear of pushers)
        if (id(stopwatch_lap_ms) > 0) {
          int l_mins = (id(stopwatch_lap_ms) / 60000) % 60;
          int l_secs = (id(stopwatch_lap_ms) / 1000) % 60;
          int l_tenths = (id(stopwatch_lap_ms) / 100) % 10;
          char lap_buf[32];
          snprintf(lap_buf, sizeof(lap_buf), "SPLIT  %02d:%02d.%d", l_mins, l_secs, l_tenths);
          it.print(cx, 272, id(font_small), id(theme_secondary), TextAlign::CENTER, lap_buf);
        }

        // ----------------------------------------------------
        // SPLIT-SECOND (RATTRAPANTE) GHOST HAND (FREEZES AT LAP)
        // ----------------------------------------------------
        if (id(stopwatch_lap_ms) > 0) {
          float lap_angle = ((id(stopwatch_lap_ms) % 60000) / 60000.0f) * (2.0f * PI_F);
          float l_sin, l_cos;
          sincosf(lap_angle, &l_sin, &l_cos);
          it.line(cx, cy, cx + (int)(150.0f * l_sin), cy - (int)(150.0f * l_cos), id(theme_secondary));
          it.circle(cx + (int)(154.0f * l_sin), cy - (int)(154.0f * l_cos), 4, id(theme_secondary));
        }

        // ----------------------------------------------------
        // MAIN CENTRAL ARROW HAND (CLASSIC 1970 HEUER BOLD CHRONOGRAPH)
        // ----------------------------------------------------
        float chrono_angle = ((total_ms % 60000) / 60000.0f) * (2.0f * PI_F);
        float s_sin, s_cos;
        sincosf(chrono_angle, &s_sin, &s_cos);

        int tip_x = cx + (int)(174.0f * s_sin);
        int tip_y = cy - (int)(174.0f * s_cos);
        int arr_base_x = cx + (int)(148.0f * s_sin);
        int arr_base_y = cy - (int)(148.0f * s_cos);
        int tail_x = cx - (int)(36.0f * s_sin);
        int tail_y = cy + (int)(36.0f * s_cos);

        // True perpendicular vector (Rotated 90 deg clockwise from radial vector)
        // v = (s_sin, -s_cos) -> perp = (s_cos, s_sin). Dot product = 0.00 at all 360 degrees!
        float perp_x = s_cos;
        float perp_y = s_sin;
        // Constant 16px wide arrowhead base (8px each side), 24px long spearhead
        int left_x = arr_base_x + (int)(8.0f * perp_x);
        int left_y = arr_base_y + (int)(8.0f * perp_y);
        int right_x = arr_base_x - (int)(8.0f * perp_x);
        int right_y = arr_base_y - (int)(8.0f * perp_y);

        // Main shaft: 3px solid black chronometer pointer
        it.line(tail_x, tail_y, arr_base_x, arr_base_y, id(col_black));
        it.line(tail_x + (int)perp_x, tail_y + (int)perp_y, arr_base_x + (int)perp_x, arr_base_y + (int)perp_y, id(col_black));
        it.line(tail_x - (int)perp_x, tail_y - (int)perp_y, arr_base_x - (int)perp_x, arr_base_y - (int)perp_y, id(col_black));

        // Classic bold arrowhead
        it.filled_triangle(tip_x, tip_y, left_x, left_y, right_x, right_y, id(col_black));

        // Teardrop counter-weight tail: 8px radius
        it.filled_circle(tail_x, tail_y, 8, id(col_black));
        it.circle(tail_x, tail_y, 8, id(col_silver));
        it.filled_circle(tail_x, tail_y, 3, id(col_silver));

        // Multi-tier Center Pinion Arbor Cap
        it.filled_circle(cx, cy, 9, id(col_silver));
        it.circle(cx, cy, 9, id(col_black));
        it.filled_circle(cx, cy, 6, id(col_black));
        it.filled_circle(cx, cy, 2, id(col_silver));

        // ----------------------------------------------------
        // ENLARGED DUAL PUSHERS: LAP & RESET (Optimized: y=328, x=179 & 287)
        // 22px clear of 25 & 35, and 18px clear of SPLIT readout
        // ----------------------------------------------------
        const int btn_y = 328;
        const int btn_lap_x = 179;
        const int btn_rst_x = 287;

        // LAP Button (Inboard radius 38px, diameter 76px)
        it.filled_circle(btn_lap_x, btn_y, 38, id(col_dark_gray));
        it.circle(btn_lap_x, btn_y, 38, id(col_black));
        it.circle(btn_lap_x, btn_y, 37, id(col_silver));
        it.print(btn_lap_x, btn_y, id(font_small), id(col_white), TextAlign::CENTER, "LAP");

        // RESET Button (Inboard radius 38px, diameter 76px)
        it.filled_circle(btn_rst_x, btn_y, 38, id(col_dark_gray));
        it.circle(btn_rst_x, btn_y, 38, id(col_black));
        it.circle(btn_rst_x, btn_y, 37, id(theme_secondary));
        it.print(btn_rst_x, btn_y, id(font_small), id(col_white), TextAlign::CENTER, "RESET");

      // ==========================================
      // PAGE 2: MUSIC PLAYER & MULTI-ROOM EXPANSION
      // ==========================================
      } else if (id(gui_page) == 2) {
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(theme_primary));
        it.circle(cx, cy, 227, id(theme_primary));
        it.circle(cx, cy, 222, id(col_dark_gray));

        if (id(music_overlay_mode) == 0) {
          // --------------------------------------------------
          // VIEW 0: NOW PLAYING MUSIC PLAYER
          // --------------------------------------------------
          // Elevated Title baseline (y = 54) & Buffered Active Speaker Indicator (y = 80)
          it.print(cx, 54, id(font_date), id(theme_primary), TextAlign::CENTER, "MUSIC");

          bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
          bool is_playing = false;
          if (is_remote) {
            is_playing = (id(ha_target_state).state == "playing");
          } else {
            is_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          }

          std::string spk_label = "[" + id(active_speaker_name) + "]";
          it.print(cx, 80, id(font_small), is_remote ? id(theme_secondary) : id(col_slate), TextAlign::CENTER, spk_label.c_str());

          // Perfectly Centered Album Art: 216x216 centered across horizontal centerline (cx = 233, art_center_y = 212), spans y = 104 to 320
          const int art_center_y = 212;
          const int art_top_y = 104;
          const int art_w = 216;

          bool has_art = false;
          esphome::image::Image *target_art = nullptr;
          if (is_remote) {
            has_art = (id(remote_album_art).get_width() > 0);
            if (has_art) {
              target_art = id(remote_album_art);
            } else if (id(album_art).get_width() > 0) {
              has_art = true;
              target_art = id(album_art);
            }
          } else {
            has_art = (id(album_art).get_width() > 0);
            if (has_art) {
              target_art = id(album_art);
            } else if (id(remote_album_art).get_width() > 0) {
              has_art = true;
              target_art = id(remote_album_art);
            }
          }

          std::string art_mode = std::string(id(music_fullscreen_art_mode).current_option().c_str());
          bool is_fs_active = (art_mode != "Disabled") && has_art;
          bool is_full_bleed = (art_mode == "Full Bleed") && has_art;
          bool is_letterbox = (art_mode == "Letterbox") && has_art;
          bool show_overlay = id(music_controls_overlay_switch).state || !is_fs_active;

          auto draw_scaled_art = [&](esphome::image::Image *img, int dst_x, int dst_y, int dst_w, int dst_h) {
            if (img == nullptr || img->get_width() == 0 || img->get_height() == 0) return;
            int src_w = img->get_width();
            int src_h = img->get_height();
            if (src_w == dst_w && src_h == dst_h) {
              it.image(dst_x, dst_y, img);
              return;
            }
            // High-speed fixed-point integer scaling (replaces 46,656 divisions/frame with bitshifts)
            int step_x = (src_w << 12) / dst_w;
            int step_y = (src_h << 12) / dst_h;
            int curr_y = 0;
            for (int dy = 0; dy < dst_h; dy++) {
              int sy = curr_y >> 12;
              curr_y += step_y;
              int curr_x = 0;
              for (int dx = 0; dx < dst_w; dx++) {
                int sx = curr_x >> 12;
                curr_x += step_x;
                it.draw_pixel_at(dst_x + dx, dst_y + dy, img->get_pixel(sx, sy));
              }
            }
          };

          if (is_fs_active) {
            // ====================================================
            // FULL-SCREEN ALBUM ART CANVAS (Edge-to-Edge 466x466)
            // ====================================================
            draw_scaled_art(target_art, 0, 0, 466, 466);

            // In Letterbox mode: Solid black matte bars at top (y: 0..60) and bottom (y: 385..466); zero overlay on image!
            if (is_letterbox) {
              for (int y = 0; y < 60; y++) {
                int y_d = abs(y - cy);
                int hw = (int)sqrtf((float)(54289 - y_d * y_d));
                it.horizontal_line(cx - hw, y, 2 * hw + 1, id(col_black));
              }
              for (int y = 385; y < 466; y++) {
                int y_d = abs(y - cy);
                int hw = (int)sqrtf((float)(54289 - y_d * y_d));
                it.horizontal_line(cx - hw, y, 2 * hw + 1, id(col_black));
              }
            }
          } else {
            // ====================================================
            // CLASSIC FRAMED 216x216 ALBUM ART & VINYL DISC (Disabled)
            // ====================================================
            if (has_art) {
              draw_scaled_art(target_art, cx - art_w / 2, art_top_y, art_w, art_w);
            } else {
              // High-contrast Vinyl Disc with Remote Audio Badge centered at (cx, 212)
              it.filled_circle(cx, art_center_y, 80, id(col_dark_gray));
              it.circle(cx, art_center_y, 80, is_remote ? id(theme_secondary) : id(theme_primary));
              it.circle(cx, art_center_y, 64, id(col_bg));
              it.circle(cx, art_center_y, 48, id(col_dark_gray));
              it.circle(cx, art_center_y, 32, id(col_bg));
              it.filled_circle(cx, art_center_y, 16, is_remote ? id(theme_secondary) : id(theme_primary));
            }
          }

          if (show_overlay) {
            Color flank_btn_col = is_fs_active ? id(theme_secondary) : id(col_white);

            // Left Flank (x: 91..113): Previous Track (◀◀) centered on horizon (y = 212, exactly 12px gap from art)
            if (is_fs_active) {
              it.filled_triangle(91 + 1, art_center_y + 1, 101 + 1, art_center_y - 10, 101 + 1, art_center_y + 12, id(col_black));
              it.filled_triangle(103 + 1, art_center_y + 1, 113 + 1, art_center_y - 10, 113 + 1, art_center_y + 12, id(col_black));
            }
            it.filled_triangle(91, art_center_y, 101, art_center_y - 11, 101, art_center_y + 11, flank_btn_col);
            it.filled_triangle(103, art_center_y, 113, art_center_y - 11, 113, art_center_y + 11, flank_btn_col);

            // Right Flank (x: 353..375): Next Track (▶▶) centered on horizon (y = 212, exactly 12px gap from art)
            if (is_fs_active) {
              it.filled_triangle(363 + 1, art_center_y + 1, 353 + 1, art_center_y - 10, 353 + 1, art_center_y + 12, id(col_black));
              it.filled_triangle(375 + 1, art_center_y + 1, 365 + 1, art_center_y - 10, 365 + 1, art_center_y + 12, id(col_black));
            }
            it.filled_triangle(363, art_center_y, 353, art_center_y - 11, 353, art_center_y + 11, flank_btn_col);
            it.filled_triangle(375, art_center_y, 365, art_center_y - 11, 365, art_center_y + 11, flank_btn_col);

            // Right Flank Volume Up (+): centered at x = 405, y = 140 (bumped 13px right for distinct column separation)
            if (is_fs_active) {
              it.filled_rectangle(405 - 7 + 1, 140 - 1 + 1, 15, 3, id(col_black));
              it.filled_rectangle(405 - 1 + 1, 140 - 7 + 1, 3, 15, id(col_black));
            }
            it.filled_rectangle(405 - 7, 140 - 1, 15, 3, flank_btn_col);
            it.filled_rectangle(405 - 1, 140 - 7, 3, 15, flank_btn_col);

            // Right Flank Volume Down (-): centered at x = 405, y = 284 (bumped 13px right, 36px buffer from metadata)
            if (is_fs_active) {
              it.filled_rectangle(405 - 7 + 1, 284 - 1 + 1, 15, 3, id(col_black));
            }
            it.filled_rectangle(405 - 7, 284 - 1, 15, 3, flank_btn_col);

            // Left Flank Menu Button (☰): centered at x = 61, y = 284 (exact bilateral mirror to Volume Down at x = 405)
            for (int dy : {-4, 0, 4}) {
              if (is_fs_active) {
                it.filled_rectangle(61 - 7 + 1, 284 + dy + 1, 14, 2, id(col_black));
              }
              it.filled_rectangle(61 - 7, 284 + dy, 14, 2, flank_btn_col);
            }

            // Paused state frosted scrim overlay with borderless Play badge ▶
            if (!is_playing) {
              it.filled_circle(cx, art_center_y, 34, id(col_dark_gray));
              it.filled_triangle(cx - 7, art_center_y - 15, cx - 7, art_center_y + 15, cx + 15, art_center_y, id(theme_primary));
            }

            // Real-time track progress calculation
            float dur = id(ha_media_duration).state;
            float current_pos = id(music_pos_base);
            if (is_playing && id(music_pos_sync_time) > 0) {
              current_pos += (millis() - id(music_pos_sync_time)) / 1000.0f;
            }
            float prog = 0.0f;
            if (!isnan(dur) && dur > 0.0f) {
              prog = current_pos / dur;
              if (prog < 0.0f) prog = 0.0f;
              if (prog > 1.0f) prog = 1.0f;
            }

            // Perimeter continuous track playback progress arc (r = 224, 2px continuous stroke)
            if (prog > 0.005f) {
              float end_a = prog * 2.0f * PI_F;
              float step = 0.035f;
              for (float a = 0.0f; a < end_a; a += step) {
                float next_a = std::min(a + step, end_a);
                float s1, c1, s2, c2;
                sincosf(a, &s1, &c1);
                sincosf(next_a, &s2, &c2);
                it.line(cx + (int)(224.0f * s1), cy - (int)(224.0f * c1),
                        cx + (int)(224.0f * s2), cy - (int)(224.0f * c2), id(theme_secondary));
                it.line(cx + (int)(225.0f * s1), cy - (int)(225.0f * c1),
                        cx + (int)(225.0f * s2), cy - (int)(225.0f * c2), id(theme_secondary));
              }
            }

            // Track Title, Artist, Album extraction (dynamic Home Assistant priority when remote)
            std::string title = "";
            std::string artist = "";
            std::string album = "";

            if (is_remote) {
              title = id(ha_track_title).state;
              artist = id(ha_track_artist).state;
              album = id(ha_track_album).state;
            } else {
              title = id(track_title).state;
              if (title.empty() || title == "None") title = id(ha_track_title).state;
              artist = id(track_artist).state;
              if (artist.empty() || artist == "None") artist = id(ha_track_artist).state;
              album = id(track_album).state;
              if (album.empty() || album == "None") album = id(ha_track_album).state;
            }

            if (title.empty() || title == "None") title = is_playing ? "Playing Audio" : "Idle";
            if (title.length() > 24) title = title.substr(0, 22) + "...";

            // Uniform 50% Translucent Dithered Gray Scrim over metadata (y: 320..395 for Full Bleed, y: 320..385 for Letterbox)
            // Strictly guarded by show_overlay: when Overlay is OFF, zero scrim is rendered in both Full Bleed & Letterbox!
            // Optimized with direct x += 2 stepping to eliminate 50% of loop iterations and branch tests
            if (is_fs_active) {
              int scrim_end_y = is_letterbox ? 385 : 395;
              for (int y = 320; y < scrim_end_y; y++) {
                int y_d = abs(y - cy);
                int hw = (int)sqrtf((float)(54289 - y_d * y_d));
                int start_x = cx - hw;
                if ((start_x + y) % 2 != 0) start_x++;
                int end_x = cx + hw;
                for (int x = start_x; x <= end_x; x += 2) {
                  it.draw_pixel_at(x, y, id(col_black));
                }
              }
            }

            // Uncrowded metadata layout below album art (y = 336, 358, 378) with drop shadow
            it.print(cx + 1, 336 + 1, id(font_small), id(col_black), TextAlign::CENTER, title.c_str());
            it.print(cx, 336, id(font_small), id(col_white), TextAlign::CENTER, title.c_str());
            if (!artist.empty() && artist != "None") {
              if (artist.length() > 26) artist = artist.substr(0, 24) + "...";
              it.print(cx + 1, 358 + 1, id(font_small), id(col_black), TextAlign::CENTER, artist.c_str());
              it.print(cx, 358, id(font_small), id(theme_secondary), TextAlign::CENTER, artist.c_str());
            }
            if (!album.empty() && album != "None") {
              if (album.length() > 28) album = album.substr(0, 26) + "...";
              it.print(cx + 1, 378 + 1, id(font_small), id(col_black), TextAlign::CENTER, album.c_str());
              it.print(cx, 378, id(font_small), id(col_slate), TextAlign::CENTER, album.c_str());
            }
          } else {
            // Clean Art Mode: Paused state play badge ▶ only (for visual playback feedback)
            if (!is_playing) {
              it.filled_circle(cx, art_center_y, 34, id(col_dark_gray));
              it.filled_triangle(cx - 7, art_center_y - 15, cx - 7, art_center_y + 15, cx + 15, art_center_y, id(theme_primary));
            }
          }

          // Universal Fixed-Anchor Bottom Navigation (Overlaid on full-screen art with high-contrast shadow)
          if (is_fs_active) {
            // Left Chevron (<) with shadow
            it.line(165 + 5, 424 - 6, 165 - 3, 425, id(col_black));
            it.line(165 + 5, 424 + 8, 165 - 3, 425, id(col_black));
            it.line(165 + 4, 424 - 7, 165 - 4, 424, id(theme_secondary));
            it.line(165 + 5, 424 - 7, 165 - 3, 424, id(theme_secondary));
            it.line(165 + 4, 424 + 7, 165 - 4, 424, id(theme_secondary));
            it.line(165 + 5, 424 + 7, 165 - 3, 424, id(theme_secondary));

            // Right Chevron (>) with shadow
            it.line(301 - 3, 424 - 6, 301 + 5, 425, id(col_black));
            it.line(301 - 3, 424 + 8, 301 + 5, 425, id(col_black));
            it.line(301 - 4, 424 - 7, 301 + 4, 424, id(theme_secondary));
            it.line(301 - 5, 424 - 7, 301 + 3, 424, id(theme_secondary));
            it.line(301 - 4, 424 + 7, 301 + 4, 424, id(theme_secondary));
            it.line(301 - 5, 424 + 7, 301 + 3, 424, id(theme_secondary));

            std::string cnt_mode = std::string(id(page_counter_mode).current_option().c_str());
            if (cnt_mode.empty()) cnt_mode = "Always";
            bool show_in_deck = (cnt_mode == "Always" || cnt_mode == "System Only");
            if (show_in_deck) {
              int total = id(active_deck_size);
              int cur = id(current_deck_index);
              char pg_buf[16];
              snprintf(pg_buf, sizeof(pg_buf), "%d / %d", cur + 1, total);
              it.print(cx + 1, 424 + 1, id(font_small), id(col_black), TextAlign::CENTER, pg_buf);
              it.print(cx, 424, id(font_small), id(col_white), TextAlign::CENTER, pg_buf);
            }
          }

          // Prominent Center Volume HUD Overlay: Borderless solid black circle (always floats on top when adjusted)
          if (millis() - id(vol_hud_timer) < 1800) {
            int v_pct = (int)std::round(id(pocket_music_player).volume * 100.0f);
            char v_buf[16];
            snprintf(v_buf, sizeof(v_buf), "%d%%", v_pct);
            it.filled_circle(cx, art_center_y, 44, id(col_black));
            it.print(cx, art_center_y, id(font_chrono_time), id(col_white), TextAlign::CENTER, v_buf);
          }

        } else if (id(music_overlay_mode) == 1) {
          // --------------------------------------------------
          // LEVEL 1: TOP-LEVEL SELECTION MENU (Aligned with Browse Library)
          // --------------------------------------------------
          it.print(cx, 80, id(font_date), id(theme_primary), TextAlign::CENTER, "MUSIC MENU");

          // Cards aligned exactly with Browse Library (y = 140, 215, 290, r = 22)
          draw_pill_button(140, 326, 140, 22, id(theme_secondary), id(col_dark_gray), "SPEAKER HANDOFF", id(col_white), true);
          draw_pill_button(140, 326, 215, 22, id(theme_secondary), id(col_dark_gray), "SPEAKER TAKEOVER", id(col_white), true);
          draw_pill_button(140, 326, 290, 22, id(theme_secondary), id(col_dark_gray), "BROWSE LIBRARY", id(col_white), true);

          // Bottom Back to Player (Aligned at y = 375)
          draw_pill_button(150, 316, 375, 18, id(col_dark_gray), id(col_dark_gray), "< BACK", id(theme_secondary), false);

        } else if (id(music_overlay_mode) == 2) {
          // --------------------------------------------------
          // LEVEL 2: LIBRARY CATEGORIES SUBMENU (3 per page)
          // --------------------------------------------------
          // Standardized Title at y = 80 (aligned with Music/Games/System)
          it.print(cx, 80, id(font_date), id(theme_primary), TextAlign::CENTER, "BROWSE LIBRARY");

          if (id(music_category_page) == 1) {
            // Page 1: Favorites, Playlists, Artists (expanded pitch = 75px, 31px gaps)
            draw_pill_button(140, 326, 140, 22, id(theme_secondary), id(col_dark_gray), "FAVORITES", id(col_white), true);
            draw_pill_button(140, 326, 215, 22, id(theme_secondary), id(col_dark_gray), "PLAYLISTS", id(col_white), true);
            draw_pill_button(140, 326, 290, 22, id(theme_secondary), id(col_dark_gray), "ARTISTS", id(col_white), true);
          } else if (id(music_category_page) == 2) {
            // Page 2: Albums, Tracks, Radio (expanded pitch = 75px, 31px gaps)
            draw_pill_button(140, 326, 140, 22, id(theme_secondary), id(col_dark_gray), "ALBUMS", id(col_white), true);
            draw_pill_button(140, 326, 215, 22, id(theme_secondary), id(col_dark_gray), "TRACKS", id(col_white), true);
            draw_pill_button(140, 326, 290, 22, id(theme_secondary), id(col_dark_gray), "RADIO", id(col_white), true);
          } else if (id(music_category_page) == 3) {
            // Page 3: Podcasts, Audiobooks (expanded pitch = 75px, 31px gaps)
            draw_pill_button(140, 326, 140, 22, id(theme_secondary), id(col_dark_gray), "PODCASTS", id(col_white), true);
            draw_pill_button(140, 326, 215, 22, id(theme_secondary), id(col_dark_gray), "AUDIOBOOKS", id(col_white), true);
          }

          // Standardized Centered < BACK Button at y = 352 (Bottom navigation bar at y = 428 handles paging)
          draw_pill_button(150, 316, 375, 18, id(col_dark_gray), id(col_dark_gray), "< BACK", id(theme_secondary), false);
        } else if (id(music_overlay_mode) == 3) {
          // --------------------------------------------------
          // LEVEL 3: ITEM BROWSER (Dual Inline Play/Browse Cards)
          // --------------------------------------------------
          bool is_spk = (id(selected_category_mode) == "speakers" || id(selected_category_mode) == "speaker_takeover");
          bool is_drill = (id(selected_category_mode) == "artist" || id(selected_category_mode) == "album" || id(selected_category_mode) == "artist_albums");

          // Standardized Centered Category/Item Title at y = 80
          it.print(cx, 80, id(font_date), id(theme_primary), TextAlign::CENTER, id(selected_category_title).c_str());

          // Dual-Action or Unified Slot Drawer
          auto draw_slot_card = [&](int y_mid, const std::string &name, const std::string &id_str, const std::string &mtype, bool is_act) {
            if (name.empty()) return;

            if (is_drill) {
              // ----------------------------------------------
              // DRILLABLE ITEM: DUAL INLINE BUTTONS (PLAY ▶ + BROWSE >)
              // ----------------------------------------------
              // Left Discrete Circular Play Button (center 98, y_mid, radius 18)
              it.filled_circle(98, y_mid, 18, id(col_dark_gray));
              it.circle(98, y_mid, 18, id(theme_primary));
              it.filled_triangle(95, y_mid - 6, 95, y_mid + 6, 104, y_mid, id(theme_primary));

              // Right Card Body with Name and > Drilldown Chevron (x: 132..395)
              it.filled_circle(154, y_mid, 22, id(theme_secondary));
              it.filled_circle(373, y_mid, 22, id(theme_secondary));
              it.filled_rectangle(154, y_mid - 22, 219, 45, id(theme_secondary));

              it.filled_circle(154, y_mid, 20, id(col_dark_gray));
              it.filled_circle(373, y_mid, 20, id(col_dark_gray));
              it.filled_rectangle(154, y_mid - 20, 219, 41, id(col_dark_gray));

              std::string disp_name = name;
              if (disp_name.length() > 18) disp_name = disp_name.substr(0, 16) + "..";
              it.print(258, y_mid, id(font_small), id(col_white), TextAlign::CENTER, disp_name.c_str());

              // Drilldown Chevron [ > ] on right end
              it.print(372, y_mid, id(font_small), id(theme_secondary), TextAlign::CENTER, ">");
            } else {
              // ----------------------------------------------
              // REGULAR / PLAYABLE ITEM: FULL-WIDTH UNIFIED CARD
              // ----------------------------------------------
              Color bg_c = id(col_dark_gray);
              Color border_c = is_act ? id(theme_primary) : id(theme_secondary);
              Color txt_c = is_act ? id(theme_primary) : id(col_white);

              it.filled_circle(140, y_mid, 22, border_c);
              it.filled_circle(326, y_mid, 22, border_c);
              it.filled_rectangle(140, y_mid - 22, 186, 45, border_c);

              it.filled_circle(140, y_mid, 20, bg_c);
              it.filled_circle(326, y_mid, 20, bg_c);
              it.filled_rectangle(140, y_mid - 20, 186, 41, bg_c);

              if (is_spk) {
                if (is_act || id_str == id(active_speaker_entity)) {
                  it.filled_circle(136, y_mid, 6, id(theme_primary));
                } else {
                  it.circle(136, y_mid, 5, id(col_slate));
                }
              } else {
                Color icon_c = (mtype == "radio") ? id(theme_secondary) : id(theme_primary);
                it.filled_triangle(132, y_mid - 6, 132, y_mid + 6, 142, y_mid, icon_c);
              }

              std::string disp_name = name;
              if (disp_name.length() > 22) disp_name = disp_name.substr(0, 20) + "..";
              it.print(cx + 6, y_mid, id(font_small), txt_c, TextAlign::CENTER, disp_name.c_str());
            }
          };

          // Expanded Card Pitch = 75px (y = 140, 215, 290, 31px gaps)
          draw_slot_card(140, id(slot_1_name), id(slot_1_id), id(slot_1_type), id(slot_1_active));
          draw_slot_card(215, id(slot_2_name), id(slot_2_id), id(slot_2_type), id(slot_2_active));
          draw_slot_card(290, id(slot_3_name), id(slot_3_id), id(slot_3_type), id(slot_3_active));

          // Pagination Arrows & Status (y = 352) - Carousel Wrap-Around Active
          // Standardized Centered < BACK Button at y = 352 (Bottom navigation bar at y = 428 handles paging)
          draw_pill_button(150, 316, 375, 18, id(col_dark_gray), id(col_dark_gray), "< BACK", id(theme_secondary), false);
        }

      // ==========================================
      // PAGE 3: GAMES SUITE (LAUNCHER & 3 GAMES)
      // ==========================================
      } else if (id(gui_page) == 3) {
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 228, id(theme_primary));
        it.circle(cx, cy, 227, id(theme_primary));
        it.circle(cx, cy, 222, id(col_dark_gray));

        // Read real-time accelerometer / gyroscope tilt angles
        float roll = id(imu_roll).state;
        float raw_pitch = id(imu_pitch).state;
        if (isnan(roll)) roll = 0.0f;
        if (isnan(raw_pitch)) raw_pitch = 0.0f;

        // Dynamic Tare / Auto-Zero on Game Launch:
        // Whatever angle the user is holding the device at when launching the game is calibrated as neutral flat.
        static float zero_pitch = -45.0f;
        static float zero_roll = 0.0f;

        // Clean Game Reset and Calibration on State Entry
        static int prev_game_state = 0;
        bool game_just_entered = false;
        if (id(active_game) != prev_game_state) {
          prev_game_state = id(active_game);
          game_just_entered = true;
          if (id(active_game) > 0) {
            zero_pitch = raw_pitch;
            zero_roll = roll;
          }
        }

        // Relative tilt deltas from dynamic calibrated starting posture:
        float pitch_delta = raw_pitch - zero_pitch;
        float roll_delta = roll - zero_roll;

        // ----------------------------------------------------
        // STATE 0: GAMES MENU LAUNCHER
        // ----------------------------------------------------
        if (id(active_game) == 0) {
          // Elevated Title aligned with Music & System at y = 54
          it.print(cx, 54, id(font_date), id(theme_primary), TextAlign::CENTER, "GAMES");

          // Card 1: Marbles
          draw_pill_button(140, 326, 127, 22, id(theme_secondary), id(col_dark_gray), "MARBLES", id(col_white), true);

          // Card 2: Archery
          draw_pill_button(140, 326, 207, 22, id(theme_secondary), id(col_dark_gray), "ARCHERY", id(col_white), true);

          // Card 3: Treat Catcher
          draw_pill_button(140, 326, 287, 22, id(theme_secondary), id(col_dark_gray), "TREAT CATCHER", id(col_white), true);

        // ----------------------------------------------------
        // GAME 1: MARBLES (CENTER HOLE CHALLENGE)
        // ----------------------------------------------------
        } else if (id(active_game) == 1) {
          it.print(cx, 65, id(font_small), id(theme_secondary), TextAlign::CENTER, "MARBLES");

          struct SimBall {
            float x, y, vx, vy, r;
            int col_idx;
            bool sunk;
          };
          static SimBall balls[5] = {
            {233.0f - 60.0f, 233.0f - 50.0f, 0.0f, 0.0f, 20.0f, 0, false}, // Gold
            {233.0f + 50.0f, 233.0f - 40.0f, 0.0f, 0.0f, 18.0f, 1, false}, // Cyan
            {233.0f - 45.0f, 233.0f + 60.0f, 0.0f, 0.0f, 16.0f, 2, false}, // Green
            {233.0f + 55.0f, 233.0f + 45.0f, 0.0f, 0.0f, 14.0f, 3, false}, // Red
            {233.0f + 75.0f, 233.0f, 0.0f, 0.0f, 12.0f, 4, false}          // Orange
          };

          static uint32_t win_timer = 0;
          static float shockwave_r = -1.0f;
          static float shockwave_x = 233.0f;
          static float shockwave_y = 233.0f;

          // Fresh Game Reset when entering from menu
          if (game_just_entered) {
            balls[0] = {233.0f - 60.0f, 233.0f - 50.0f, 0.0f, 0.0f, 20.0f, 0, false};
            balls[1] = {233.0f + 50.0f, 233.0f - 40.0f, 0.0f, 0.0f, 18.0f, 1, false};
            balls[2] = {233.0f - 45.0f, 233.0f + 60.0f, 0.0f, 0.0f, 16.0f, 2, false};
            balls[3] = {233.0f + 55.0f, 233.0f + 45.0f, 0.0f, 0.0f, 14.0f, 3, false};
            balls[4] = {233.0f + 75.0f, 233.0f, 0.0f, 0.0f, 12.0f, 4, false};
            win_timer = 0;
            shockwave_r = -1.0f;
          }

          // Center Hole Target (Crisp high-contrast double-ring white bezel around deep black pocket)
          it.circle(cx, cy, 30, id(col_slate));
          it.circle(cx, cy, 29, id(col_white));
          it.circle(cx, cy, 28, id(col_white));
          it.circle(cx, cy, 27, id(col_slate));
          it.filled_circle(cx, cy, 26, id(col_bg));
          it.circle(cx, cy, 14, id(col_dark_gray));

          // Touch Scatter Impulse / Button Pop (Robust, Anti-Freeze)
          if (id(marble_touch_x) >= 0.0f || id(game_btn_pressed)) {
            float tx = (id(marble_touch_x) >= 0.0f) ? id(marble_touch_x) : cx;
            float ty = (id(marble_touch_y) >= 0.0f) ? id(marble_touch_y) : cy;
            id(marble_touch_x) = -1.0f;
            id(game_btn_pressed) = false;
            shockwave_x = tx; shockwave_y = ty; shockwave_r = 12.0f;

            for (int i = 0; i < 5; i++) {
              if (balls[i].sunk) continue;
              float tdx = balls[i].x - tx;
              float tdy = balls[i].y - ty;
              float tdist = sqrtf(tdx * tdx + tdy * tdy);

              // If tapped directly on or near the marble, pop it outward with random scatter angle
              if (tdist < 20.0f) {
                float rnd_angle = ((float)(i * 72 + (millis() % 360))) * (PI_F / 180.0f);
                float s_rnd, c_rnd;
                sincosf(rnd_angle, &s_rnd, &c_rnd);
                balls[i].vx += c_rnd * 650.0f;
                balls[i].vy += s_rnd * 650.0f;
              } else {
                float blast = 500.0f + (700.0f / (tdist * 0.08f + 1.0f));
                if (blast > 800.0f) blast = 800.0f;
                balls[i].vx += (tdx / tdist) * blast;
                balls[i].vy += (tdy / tdist) * blast;
              }
            }
          }

          if (shockwave_r >= 0.0f) {
            it.circle((int)shockwave_x, (int)shockwave_y, (int)shockwave_r, id(col_gold));
            it.circle((int)shockwave_x, (int)shockwave_y, (int)shockwave_r + 2, id(col_cyan));
            shockwave_r += 26.0f;
            if (shockwave_r > 190.0f) shockwave_r = -1.0f;
          }

          const float dt = 0.05f;
          const float friction = 0.985f;
          const float bounce = 0.82f;
          const float arena_r = 208.0f;

          // Dynamic Tare: Symmetrical, responsive motion relative to starting posture
          float ax = roll_delta * 30.0f;
          float ay = -pitch_delta * 30.0f;
          if (ax > 650.0f) ax = 650.0f; if (ax < -650.0f) ax = -650.0f;
          if (ay > 650.0f) ay = 650.0f; if (ay < -650.0f) ay = -650.0f;

          int sunk_count = 0;
          for (int i = 0; i < 5; i++) {
            if (balls[i].sunk) { sunk_count++; continue; }

            float dx = balls[i].x - cx;
            float dy = balls[i].y - cy;
            float dist_hole = sqrtf(dx * dx + dy * dy);

            // Sunk cleanly into hole (expanded to full hole radius 26px, moved off-screen)
            if (dist_hole < 26.0f) {
              balls[i].sunk = true;
              balls[i].x = -999.0f;
              balls[i].y = -999.0f;
              balls[i].vx = 0.0f;
              balls[i].vy = 0.0f;
              sunk_count++;
              continue;
            }

            // Gentle suction vortex when approaching hole (26px to 65px)
            if (dist_hole < 65.0f && dist_hole >= 26.0f) {
              float vortex = (65.0f - dist_hole) * 9.0f;
              balls[i].vx -= (dx / dist_hole) * vortex * dt;
              balls[i].vy -= (dy / dist_hole) * vortex * dt;
            }

            balls[i].vx = (balls[i].vx + ax * dt) * friction;
            balls[i].vy = (balls[i].vy + ay * dt) * friction;
            balls[i].x += balls[i].vx * dt;
            balls[i].y += balls[i].vy * dt;

            // Arena boundary reflection (recalculates position delta cleanly)
            float cur_dx = balls[i].x - cx;
            float cur_dy = balls[i].y - cy;
            float cur_dist = sqrtf(cur_dx * cur_dx + cur_dy * cur_dy);
            float max_dist = arena_r - balls[i].r;
            if (cur_dist > max_dist && cur_dist > 0.001f) {
              float nx = cur_dx / cur_dist;
              float ny = cur_dy / cur_dist;
              balls[i].x = cx + nx * max_dist;
              balls[i].y = cy + ny * max_dist;
              float v_dot_n = balls[i].vx * nx + balls[i].vy * ny;
              if (v_dot_n > 0.0f) {
                balls[i].vx -= (1.0f + bounce) * v_dot_n * nx;
                balls[i].vy -= (1.0f + bounce) * v_dot_n * ny;
              }
            }
          }

          // Ball-to-ball collisions for un-sunk marbles
          for (int i = 0; i < 5; i++) {
            if (balls[i].sunk) continue;
            for (int j = i + 1; j < 5; j++) {
              if (balls[j].sunk) continue;
              float cdx = balls[j].x - balls[i].x;
              float cdy = balls[j].y - balls[i].y;
              float cdist = sqrtf(cdx * cdx + cdy * cdy);
              float min_dist = balls[i].r + balls[j].r;
              if (cdist < min_dist && cdist > 0.001f) {
                float overlap = min_dist - cdist;
                float cnx = cdx / cdist; float cny = cdy / cdist;
                balls[i].x -= cnx * overlap * 0.5f; balls[i].y -= cny * overlap * 0.5f;
                balls[j].x += cnx * overlap * 0.5f; balls[j].y += cny * overlap * 0.5f;
                float kx = balls[i].vx - balls[j].vx;
                float ky = balls[i].vy - balls[j].vy;
                float p = cnx * kx + cny * ky;
                balls[i].vx -= p * cnx * bounce;
                balls[i].vy -= p * cny * bounce;
                balls[j].vx += p * cnx * bounce;
                balls[j].vy += p * cny * bounce;
              }
            }
          }

          // Render active marbles
          Color cols[5] = {id(col_gold), id(col_cyan), id(col_green), id(col_red), id(col_orange)};
          for (int i = 0; i < 5; i++) {
            if (balls[i].sunk) continue;
            int bx = (int)balls[i].x; int by = (int)balls[i].y; int br = (int)balls[i].r;
            it.filled_circle(bx, by, br, cols[balls[i].col_idx]);
            it.circle(bx, by, br, id(col_white));
            it.filled_circle(bx - (br / 3), by - (br / 3), br / 3, id(col_white));
          }

          char status_buf[32];
          snprintf(status_buf, sizeof(status_buf), "Sunk: %d / 5", sunk_count);
          it.print(cx, 90, id(font_small), id(col_gold), TextAlign::CENTER, status_buf);

          if (sunk_count >= 5) {
            if (win_timer == 0) win_timer = millis();
            it.print(cx, 160, id(font_date), id(col_gold), TextAlign::CENTER, "SUCCESS! ***");
            it.print(cx, 300, id(font_small), id(col_cyan), TextAlign::CENTER, "All Marbles Sunk!");
            // Auto respawn after 2.5 seconds
            if (millis() - win_timer > 2500) {
              win_timer = 0;
              balls[0] = {233.0f - 60.0f, 233.0f - 50.0f, 0.0f, 0.0f, 20.0f, 0, false};
              balls[1] = {233.0f + 50.0f, 233.0f - 40.0f, 0.0f, 0.0f, 18.0f, 1, false};
              balls[2] = {233.0f - 45.0f, 233.0f + 60.0f, 0.0f, 0.0f, 16.0f, 2, false};
              balls[3] = {233.0f + 55.0f, 233.0f + 45.0f, 0.0f, 0.0f, 14.0f, 3, false};
              balls[4] = {233.0f + 75.0f, 233.0f, 0.0f, 0.0f, 12.0f, 4, false};
            }
          }

          it.print(cx, 385, id(font_small), id(col_slate), TextAlign::CENTER, "Roll into Center Hole • Tap Pop");
          it.print(cx, 408, id(font_small), id(col_gray), TextAlign::CENTER, "[ Click Top to Exit ]");

        // ----------------------------------------------------
        // GAME 2: ARCHERY (TILT AIM & TARGET PRACTICE)
        // ----------------------------------------------------
        } else if (id(active_game) == 2) {
          it.print(cx, 65, id(font_small), id(theme_secondary), TextAlign::CENTER, "ARCHERY");

          static int arch_score = 0;
          static int shots_fired = 0;
          static float target_x = 233.0f;
          static float target_step = 0.0f;
          static float arrow_x = -1.0f;
          static float arrow_y = -1.0f;
          static float arrow_target_x = 233.0f;
          static float arrow_target_y = 165.0f;
          static std::string hit_feedback = "";
          static uint32_t feedback_timer = 0;

          // Fresh Game Reset when entering from menu
          if (game_just_entered) {
            arch_score = 0;
            shots_fired = 0;
            arrow_y = -1.0f;
            hit_feedback = "";
          }

          // Target drifts horizontally across upper-middle zone (y = 165px)
          target_step += 0.04f;
          target_x = cx + sinf(target_step) * 90.0f;
          float target_y = 165.0f;

          // Render Target Rings (outer r=36, cyan r=26, red r=16, gold r=8)
          it.filled_circle((int)target_x, (int)target_y, 36, id(col_white));
          it.circle((int)target_x, (int)target_y, 36, id(col_dark_gray));
          it.filled_circle((int)target_x, (int)target_y, 26, id(col_cyan));
          it.filled_circle((int)target_x, (int)target_y, 16, id(col_red));
          it.filled_circle((int)target_x, (int)target_y, 8, id(col_gold));

          // Aim Crosshair: Auto-centered on target at start; smooth aiming relative to posture
          float ax = cx + roll_delta * 6.5f;
          float ay = 165.0f - pitch_delta * 6.5f;
          if (ax < 65.0f) ax = 65.0f; if (ax > 401.0f) ax = 401.0f;
          if (ay < 65.0f) ay = 65.0f; if (ay > 370.0f) ay = 370.0f;

          // Shoot Trigger (Button or Tap)
          if (id(game_btn_pressed) || id(marble_touch_x) >= 0.0f) {
            id(game_btn_pressed) = false;
            id(marble_touch_x) = -1.0f;
            if (arrow_y < 0.0f) { // only one arrow in flight at a time
              arrow_x = cx;
              arrow_y = 370.0f;
              arrow_target_x = ax;
              arrow_target_y = ay;
              shots_fired++;
            }
          }

          // Arrow flight simulation
          if (arrow_y >= 0.0f) {
            float adx = arrow_target_x - arrow_x;
            float ady = arrow_target_y - arrow_y;
            arrow_x += adx * 0.35f;
            arrow_y += ady * 0.35f;

            // Draw arrow
            it.line((int)arrow_x, (int)arrow_y, (int)arrow_x, (int)arrow_y + 18, id(col_gold));
            it.filled_circle((int)arrow_x, (int)arrow_y, 3, id(col_white));

            if (fabsf(arrow_y - arrow_target_y) < 6.0f) {
              // Arrow arrived at target plane: evaluate hit
              float dist_hit = sqrtf((arrow_target_x - target_x) * (arrow_target_x - target_x) +
                                     (arrow_target_y - target_y) * (arrow_target_y - target_y));
              if (dist_hit < 9.0f) {
                hit_feedback = "BULLSEYE! +10"; arch_score += 10;
              } else if (dist_hit < 18.0f) {
                hit_feedback = "RED RING! +5"; arch_score += 5;
              } else if (dist_hit < 28.0f) {
                hit_feedback = "BLUE RING! +3"; arch_score += 3;
              } else if (dist_hit < 38.0f) {
                hit_feedback = "WHITE! +1"; arch_score += 1;
              } else {
                hit_feedback = "MISS!";
              }
              feedback_timer = millis();
              arrow_y = -1.0f; // Arrow spent
            }
          }

          // Draw Reticle
          it.circle((int)ax, (int)ay, 14, id(col_cyan));
          it.line((int)ax - 18, (int)ay, (int)ax + 18, (int)ay, id(col_cyan));
          it.line((int)ax, (int)ay - 18, (int)ax, (int)ay + 18, id(col_cyan));

          char score_buf[32];
          snprintf(score_buf, sizeof(score_buf), "Score: %d  (Shots: %d)", arch_score, shots_fired);
          it.print(cx, 90, id(font_small), id(col_gold), TextAlign::CENTER, score_buf);

          if (!hit_feedback.empty() && (millis() - feedback_timer < 1400)) {
            it.print(cx, 280, id(font_date), id(col_gold), TextAlign::CENTER, hit_feedback.c_str());
          }

          it.print(cx, 385, id(font_small), id(col_slate), TextAlign::CENTER, "Tilt Aim • Tap Screen to Fire");
          it.print(cx, 408, id(font_small), id(col_gray), TextAlign::CENTER, "[ Click Top to Exit ]");

        // ----------------------------------------------------
        // GAME 3: TREAT CATCHER (FEED THE HUNGRY MONSTER)
        // ----------------------------------------------------
        } else {
          it.print(cx, 65, id(font_small), id(theme_secondary), TextAlign::CENTER, "TREAT CATCHER");

          static int treat_score = 0;
          static float treat_x = cx + 60.0f;
          static float treat_y = cy - 60.0f;
          static float treat_vx = 0.0f;
          static float treat_vy = 0.0f;
          static uint32_t chomp_timer = 0;
          static int treat_color_idx = 0;

          // Fresh Game Reset when entering from menu
          if (game_just_entered) {
            treat_score = 0;
            treat_x = cx + 60.0f;
            treat_y = cy - 60.0f;
            treat_vx = 0.0f;
            treat_vy = 0.0f;
            chomp_timer = 0;
          }

          // Tap to pop treat
          if (id(marble_touch_x) >= 0.0f || id(game_btn_pressed)) {
            id(marble_touch_x) = -1.0f;
            id(game_btn_pressed) = false;
            treat_vx += (treat_x > cx ? 160.0f : -160.0f);
            treat_vy -= 220.0f; // pop up!
          }

          const float dt = 0.05f;
          // Dynamic Tare: Symmetrical, responsive roll relative to starting posture
          float ax = roll_delta * 28.0f;
          float ay = -pitch_delta * 28.0f;
          if (ax > 650.0f) ax = 650.0f; if (ax < -650.0f) ax = -650.0f;
          if (ay > 650.0f) ay = 650.0f; if (ay < -650.0f) ay = -650.0f;

          treat_vx = (treat_vx + ax * dt) * 0.98f;
          treat_vy = (treat_vy + ay * dt) * 0.98f;
          treat_x += treat_vx * dt;
          treat_y += treat_vy * dt;

          // Circular Arena Boundary Reflection
          float t_dx = treat_x - cx;
          float t_dy = treat_y - cy;
          float t_dist = sqrtf(t_dx * t_dx + t_dy * t_dy);
          float max_t_dist = 208.0f - 14.0f;
          if (t_dist > max_t_dist && t_dist > 0.001f) {
            float nx = t_dx / t_dist; float ny = t_dy / t_dist;
            treat_x = cx + nx * max_t_dist;
            treat_y = cy + ny * max_t_dist;
            float v_dot_n = treat_vx * nx + treat_vy * ny;
            if (v_dot_n > 0.0f) {
              treat_vx -= 1.8f * v_dot_n * nx;
              treat_vy -= 1.8f * v_dot_n * ny;
            }
          }

          // Creature Face at Center (cx, cy)
          float dist_to_mouth = sqrtf((treat_x - cx) * (treat_x - cx) + (treat_y - cy) * (treat_y - cy));
          bool mouth_open = (dist_to_mouth < 85.0f);

          // Chomp detection
          if (dist_to_mouth < 24.0f) {
            treat_score++;
            chomp_timer = millis();
            // Respawn treat on perimeter
            treat_color_idx = (treat_color_idx + 1) % 4;
            float spawn_angle = ((treat_score * 77) % 360) * (PI_F / 180.0f);
            float s_sp, c_sp;
            sincosf(spawn_angle, &s_sp, &c_sp);
            treat_x = cx + s_sp * 160.0f;
            treat_y = cy - c_sp * 160.0f;
            treat_vx = 0.0f; treat_vy = 0.0f;
          }

          bool is_chomping = (millis() - chomp_timer < 500);

          // Draw Creature Body
          it.filled_circle(cx, cy, 32, id(col_green));
          it.circle(cx, cy, 32, id(col_white));

          // Eyes follow treat
          float eye_dx = (treat_x - cx) / (dist_to_mouth + 1.0f) * 3.0f;
          float eye_dy = (treat_y - cy) / (dist_to_mouth + 1.0f) * 3.0f;
          it.filled_circle(cx - 10, cy - 10, 7, id(col_white));
          it.filled_circle(cx + 10, cy - 10, 7, id(col_white));
          it.filled_circle(cx - 10 + (int)eye_dx, cy - 10 + (int)eye_dy, 3, id(col_dark_gray));
          it.filled_circle(cx + 10 + (int)eye_dx, cy - 10 + (int)eye_dy, 3, id(col_dark_gray));

          // Animated Mouth
          if (is_chomping) {
            // Happy closed chomp smile
            it.line(cx - 14, cy + 12, cx, cy + 18, id(col_white));
            it.line(cx, cy + 18, cx + 14, cy + 12, id(col_white));
            it.print(cx, 160, id(font_date), id(col_gold), TextAlign::CENTER, "CHOMP!");
          } else if (mouth_open) {
            // Wide open mouth ready to eat
            it.filled_circle(cx, cy + 12, 12, id(col_bg));
            it.circle(cx, cy + 12, 12, id(col_red));
          } else {
            // Gentle smiling line
            it.line(cx - 10, cy + 12, cx, cy + 16, id(col_dark_gray));
            it.line(cx, cy + 16, cx + 10, cy + 12, id(col_dark_gray));
          }

          // Draw Treat
          Color t_cols[4] = {id(col_red), id(col_gold), id(col_cyan), id(col_orange)};
          it.filled_circle((int)treat_x, (int)treat_y, 14, t_cols[treat_color_idx]);
          it.circle((int)treat_x, (int)treat_y, 14, id(col_white));
          it.filled_circle((int)treat_x - 4, (int)treat_y - 4, 4, id(col_white));

          char t_buf[32];
          snprintf(t_buf, sizeof(t_buf), "Treats Eaten: %d", treat_score);
          it.print(cx, 90, id(font_small), id(col_gold), TextAlign::CENTER, t_buf);

          it.print(cx, 385, id(font_small), id(col_slate), TextAlign::CENTER, "Tilt to Roll Treat into Mouth");
          it.print(cx, 408, id(font_small), id(col_gray), TextAlign::CENTER, "[ Click Top to Exit ]");
        }
      // ==========================================
      // PAGE 4: SYSTEM (STATUS & CONTROLS - RUST HIGHLIGHT)
      // ==========================================
      } else if (id(gui_page) == 4) {
        // Minimalist Edge-to-Edge Definition: Subtle perimeter bezel guide
        it.circle(cx, cy, 230, id(col_dark_gray));
        it.circle(cx, cy, 222, id(col_dark_gray));

        char buf[64];

        if (id(system_menu_mode) == 0) {
          // --------------------------------------------------
          // VIEW 0: MAIN SYSTEM OBSERVATIONAL DASHBOARD
          // --------------------------------------------------
          // Top Header: Pure iconic "SYSTEM" title (Theme Primary)
          it.print(cx, 56, id(font_date), id(theme_primary), TextAlign::CENTER, "SYSTEM");

          // Upper Zone: Technical Telemetry & Firmware
          // Line 1: Wi-Fi Signal & IP (Green)
          float sig = id(pocket_wifi_signal).state;
          std::string ip_str = id(pocket_ip_address).state;
          if (ip_str.empty()) ip_str = "Connecting...";
          snprintf(buf, sizeof(buf), "Wi-Fi: %.0f dBm | %s", sig, ip_str.c_str());
          it.print(cx, 92, id(font_small), id(col_green), TextAlign::CENTER, buf);

          // Line 2: Temperature & IMU (Theme Secondary)
          float temp_c = id(imu_temp).state;
          float r_val = id(imu_roll).state;
          float p_val = id(imu_pitch).state;
          snprintf(buf, sizeof(buf), "Temp: %.1fC | R:%.0f P:%.0f", temp_c, r_val, p_val);
          it.print(cx, 118, id(font_small), id(theme_secondary), TextAlign::CENTER, buf);

          // Line 3: Pocket Assistant Version / Update badge (Theme Primary / Gold)
          bool has_update = id(ha_firmware_update_status).state == "ON";
          std::string lat_v = id(ha_firmware_latest_version).state;
          if (has_update) {
            snprintf(buf, sizeof(buf), "Update Ready: v%s >", lat_v.empty() ? "3.6.x" : lat_v.c_str());
            it.print(cx, 144, id(font_small), id(col_gold), TextAlign::CENTER, buf);
          } else {
            it.print(cx, 144, id(font_small), id(theme_primary), TextAlign::CENTER, "Pocket Assistant v${version}");
          }

          // Center Zone: Buffered 2x2 Grid with Submenu-Consistent Pill Height (r = 20) & 24px Center Gap
          // Row 1: Display & Clock (Left: x 69..221) | Sleep & Wake (Right: x 245..397) at y = 188
          draw_pill_button(89, 201, 188, 20, id(theme_secondary), id(col_dark_gray), "Display >", id(col_white), false);
          draw_pill_button(265, 377, 188, 20, id(theme_secondary), id(col_dark_gray), "Sleep & Wake >", id(col_white), false);

          // Row 2: Audio & Media (Left: x 69..221) | System Actions (Right: x 245..397) at y = 248
          draw_pill_button(89, 201, 248, 20, id(theme_secondary), id(col_dark_gray), "Audio >", id(col_white), false);
          draw_pill_button(265, 377, 248, 20, id(theme_secondary), id(col_dark_gray), "Actions >", id(col_white), false);

          // Lower Zone: Battery, Date, and Prominent Clock nestled comfortably in the lower sanctuary
          float v_batt = id(batt_voltage).state;
          char b_main[32];
          snprintf(b_main, sizeof(b_main), "Battery: %.0f%% (%.2fV)", batt, v_batt);
          if (id(batt_charging).state) {
            int w_main = (strlen(b_main) >= 21) ? 202 : 191;
            int start_x = cx - (w_main + 105) / 2;
            it.print(start_x, 308, id(font_small), id(theme_primary), TextAlign::LEFT, b_main);
            it.print(start_x + w_main, 308, id(font_small), id(theme_secondary), TextAlign::LEFT, " • Charging");
          } else {
            it.print(cx, 308, id(font_small), id(theme_primary), TextAlign::CENTER, b_main);
          }

          if (now.is_valid()) {
            it.strftime(cx, 336, id(font_small), id(col_slate), TextAlign::CENTER, "%a, %b %d", now);

            // Prominent Time readout (y = 374, nestled cleanly above bottom navigation)
            char t_buf[16];
            if (id(is_24h_format)) {
              snprintf(t_buf, sizeof(t_buf), "%02d:%02d", now.hour, now.minute);
            } else {
              int h12 = now.hour % 12;
              if (h12 == 0) h12 = 12;
              snprintf(t_buf, sizeof(t_buf), "%d:%02d %s", h12, now.minute, now.hour >= 12 ? "PM" : "AM");
            }
            it.print(cx, 374, id(font_date), id(col_white), TextAlign::CENTER, t_buf);
          }

        } else if (id(system_menu_mode) == 1) {
          // --------------------------------------------------
          // VIEW 1: SLEEP & WAKE SUBMENU
          // --------------------------------------------------
          it.print(cx, 56, id(font_date), id(theme_primary), TextAlign::CENTER, "SLEEP & WAKE");

          // Button 1: Motion Wake Cycler (y = 120)
          char m_buf[32];
          std::string cur_m = std::string(id(pickup_wake_mode).current_option().c_str());
          snprintf(m_buf, sizeof(m_buf), "Motion: %s", cur_m.c_str());
          draw_pill_button(110, 356, 120, 20, id(theme_secondary), id(col_dark_gray), m_buf, id(col_white), false);

          // Button 2: Tap Wake Cycler (y = 175)
          char t_buf[32];
          std::string cur_t = std::string(id(tap_wake_mode).current_option().c_str());
          snprintf(t_buf, sizeof(t_buf), "Tap: %s", cur_t.c_str());
          draw_pill_button(110, 356, 175, 20, id(theme_secondary), id(col_dark_gray), t_buf, id(col_white), false);

          // Button 3: Docked Screensaver Toggle (y = 230)
          std::string ss_label = id(docked_screensaver_switch).state ? "Screensaver: On" : "Screensaver: Off";
          draw_pill_button(110, 356, 230, 20, id(theme_secondary), id(col_dark_gray), ss_label.c_str(), id(col_white), false);

          // Button 4: Stay Awake Mode (y = 285)
          std::string ps_label = id(prevent_deep_sleep_switch).state ? "Stay Awake: On" : "Stay Awake: Off";
          draw_pill_button(110, 356, 285, 20, id(theme_secondary), id(col_dark_gray), ps_label.c_str(), id(col_white), false);

          // Bottom Button: Standardized < BACK (y = 375)
          draw_pill_button(150, 316, 375, 18, id(col_slate), id(col_dark_gray), "< BACK", id(col_slate), false);

        } else if (id(system_menu_mode) == 2) {
          // --------------------------------------------------
          // VIEW 2: DISPLAY & CLOCK SUBMENU (Spacious 50px Pitch)
          // --------------------------------------------------
          it.print(cx, 56, id(font_date), id(theme_primary), TextAlign::CENTER, "DISPLAY & CLOCK");

          // Button 1: Auto-Brightness Mode Cycler (y = 100, r = 18)
          std::string ab_mode = std::string(id(auto_brightness_mode).current_option().c_str());
          char ab_buf[32];
          snprintf(ab_buf, sizeof(ab_buf), "Auto-Bri: %s", ab_mode == "Sun Synchronized" ? "Sun" : (ab_mode == "Time Schedule" ? "Sched" : "Off"));
          draw_pill_button(110, 356, 100, 18, id(theme_secondary), id(col_dark_gray), ab_buf, id(col_white), false);

          // Button 2: Manual / Day Brightness Preset Cycler (y = 150, r = 18)
          char b_buf[32];
          std::string bri_p = std::string(id(display_brightness_preset).current_option().c_str());
          if (bri_p.empty()) bri_p = "90%";
          snprintf(b_buf, sizeof(b_buf), "Brightness: %s", bri_p.c_str());
          draw_pill_button(110, 356, 150, 18, id(theme_secondary), id(col_dark_gray), b_buf, id(col_white), false);

          // Button 3: Clock Face Style Cycler (y = 200, r = 18)
          std::string cf_label = id(clock_face_digital) ? "Clock Face: Digital" : "Clock Face: Analog";
          draw_pill_button(110, 356, 200, 18, id(theme_secondary), id(col_dark_gray), cf_label.c_str(), id(col_white), false);

          // Button 4: Time Format Cycler (y = 250, r = 18)
          std::string tf_label = id(is_24h_format) ? "Format: 24-Hour" : "Format: 12-Hour";
          draw_pill_button(110, 356, 250, 18, id(theme_secondary), id(col_dark_gray), tf_label.c_str(), id(col_white), false);

          // Button 5: Color Palette Cycler (y = 300, r = 18)
          char th_buf[32];
          std::string th_p = std::string(id(theme_palette_select).current_option().c_str());
          if (th_p == "Default Classic") th_p = "Blue & Gold";
          snprintf(th_buf, sizeof(th_buf), "Palette: %s", th_p.c_str());
          draw_pill_button(110, 356, 300, 18, id(theme_secondary), id(col_dark_gray), th_buf, id(col_white), false);

          // Bottom Button: Standardized < BACK (y = 375, r = 18)
          draw_pill_button(150, 316, 375, 18, id(col_slate), id(col_dark_gray), "< BACK", id(col_slate), false);

        } else if (id(system_menu_mode) == 3) {
          // --------------------------------------------------
          // VIEW 3: SYSTEM ACTIONS SUBMENU
          // --------------------------------------------------
          it.print(cx, 56, id(font_date), id(theme_primary), TextAlign::CENTER, "SYSTEM ACTIONS");

          // Button 1: Hibernate Now (y = 120, r = 18)
          draw_pill_button(110, 356, 120, 18, id(theme_secondary), id(col_dark_gray), "Hibernate Now", id(col_white), false);

          // Button 2: Auto-Sleep Timeout Cycler (y = 175, r = 18)
          char s_buf[32];
          std::string cur_s = std::string(id(sleep_timeout_mode).current_option().c_str());
          snprintf(s_buf, sizeof(s_buf), "Auto-Sleep: %s", cur_s.c_str());
          draw_pill_button(110, 356, 175, 18, id(theme_secondary), id(col_dark_gray), s_buf, id(col_white), false);

          // Button 3: Restart Device (y = 230, r = 18)
          draw_pill_button(110, 356, 230, 18, id(col_red), id(col_dark_gray), "Restart Device", id(col_white), false);

          // Button 4: Software Update (y = 285, r = 18)
          draw_pill_button(110, 356, 285, 18, id(theme_secondary), id(col_dark_gray), "Software Update >", id(col_white), false);

          // Bottom Button: Standardized < BACK (y = 375, r = 18)
          draw_pill_button(150, 316, 375, 18, id(col_slate), id(col_dark_gray), "< BACK", id(col_slate), false);

                } else if (id(system_menu_mode) == 4) {
          // --------------------------------------------------
          // VIEW 4: RESTART CONFIRMATION DIALOG
          // --------------------------------------------------
          it.print(cx, 130, id(font_date), id(theme_primary), TextAlign::CENTER, "RESTART?");

          // Cancel Button (Left, Gray Pill - compact 110px width, spans x: 105..215)
          draw_pill_button(125, 195, 230, 20, id(col_slate), id(col_dark_gray), "Cancel", id(col_white), false);

          // Confirm Restart Button (Right, Red Pill - compact 110px width, spans x: 251..361)
          draw_pill_button(271, 341, 230, 20, id(col_red), id(col_dark_gray), "Restart", id(col_white), false);

        } else if (id(system_menu_mode) == 5) {
          // --------------------------------------------------
          // VIEW 5: SOFTWARE UPDATE SCREEN
          // --------------------------------------------------
          it.print(cx, 54, id(font_date), id(theme_primary), TextAlign::CENTER, "UPDATE");

          // Version Information
          char cur_buf[32];
          snprintf(cur_buf, sizeof(cur_buf), "Installed: v%s", "${version}");
          it.print(cx, 95, id(font_small), id(col_slate), TextAlign::CENTER, cur_buf);

          std::string lat_v = id(ha_firmware_latest_version).state;
          bool has_update = is_newer_semver(lat_v, "${version}");

          // Manage checking state timer transitions
          if (id(update_check_state) == 1) {
            // After 1500ms of checking, transition to Checked
            if (millis() - id(update_check_timer) > 1500) {
              id(update_check_state) = has_update ? 0 : 2;
              id(update_check_timer) = millis();
            }
          } else if (id(update_check_state) == 2) {
            // After 3500ms of showing "No updates available", revert to Idle
            if (millis() - id(update_check_timer) > 3500) {
              id(update_check_state) = 0;
            }
          }

          if (has_update) {
            char lat_buf[32];
            snprintf(lat_buf, sizeof(lat_buf), "Available: v%s", lat_v.empty() ? "3.5.x" : lat_v.c_str());
            it.print(cx, 125, id(font_small), id(theme_secondary), TextAlign::CENTER, lat_buf);

            // Summary / Changelog highlight
            std::string summ = id(ha_firmware_release_summary).state;
            if (summ.empty() || summ == "unavailable" || summ == "unknown") {
              summ = "Firmware update ready.";
            }
            if (summ.length() > 32) summ = summ.substr(0, 29) + "...";
            it.print(cx, 160, id(font_small), id(col_white), TextAlign::CENTER, summ.c_str());

            // Action Button: Update Now (y_mid = 215, r = 20)
            draw_pill_button(110, 356, 215, 20, id(theme_primary), id(col_dark_gray), "Update Now", id(theme_secondary), true);
          } else {
            char lat_buf[32];
            snprintf(lat_buf, sizeof(lat_buf), "Latest: v%s", "${version}");
            it.print(cx, 125, id(font_small), id(theme_secondary), TextAlign::CENTER, lat_buf);

            if (id(update_check_state) == 1) {
              it.print(cx, 160, id(font_small), id(theme_secondary), TextAlign::CENTER, "Checking Home Assistant...");
              draw_pill_button(110, 356, 215, 20, id(theme_primary), id(col_dark_gray), "Checking...", id(theme_secondary), true);
            } else if (id(update_check_state) == 2) {
              it.print(cx, 160, id(font_small), id(col_slate), TextAlign::CENTER, "No updates available");
              draw_pill_button(110, 356, 215, 20, id(theme_secondary), id(col_dark_gray), "Up to date", id(col_white), false);
            } else {
              it.print(cx, 160, id(font_small), id(col_slate), TextAlign::CENTER, "Firmware is up to date");
              draw_pill_button(110, 356, 215, 20, id(theme_primary), id(col_dark_gray), "Check for Updates", id(col_white), true);
            }
          }

          // Back Button: Standardized < BACK (y = 375, r = 18)
          draw_pill_button(150, 316, 375, 18, id(col_slate), id(col_dark_gray), "< BACK", id(col_slate), false);

        } else if (id(system_menu_mode) == 6) {
          // --------------------------------------------------
          // VIEW 6: UPDATE CONFIRMATION DIALOG
          // --------------------------------------------------
          it.print(cx, 100, id(font_date), id(theme_primary), TextAlign::CENTER, "INSTALL UPDATE?");

          it.print(cx, 145, id(font_small), id(col_white), TextAlign::CENTER, "Download & flash firmware");
          it.print(cx, 175, id(font_small), id(theme_secondary), TextAlign::CENTER, "Keep device powered on");

          // Cancel Button (Left, Gray Pill, spans x: 105..215, y_mid = 240, r = 20)
          draw_pill_button(125, 195, 240, 20, id(col_slate), id(col_dark_gray), "Cancel", id(col_white), false);

          // Confirm Install Button (Right, Primary Pill, spans x: 251..361, y_mid = 240, r = 20)
          draw_pill_button(271, 341, 240, 20, id(theme_primary), id(col_dark_gray), "Install", id(col_white), false);

        } else if (id(system_menu_mode) == 7) {
          // --------------------------------------------------
          // VIEW 7: AUDIO & MEDIA SUBMENU
          // --------------------------------------------------
          it.print(cx, 56, id(font_date), id(theme_primary), TextAlign::CENTER, "AUDIO & MEDIA");

          // Button 1: Full-Screen Album Art Style cycler (y = 110, r = 18)
          std::string cur_mode = std::string(id(music_fullscreen_art_mode).current_option().c_str());
          char fs_label[32];
          if (cur_mode == "Full Bleed") {
            snprintf(fs_label, sizeof(fs_label), "Full Art: Full Bleed");
          } else if (cur_mode == "Letterbox") {
            snprintf(fs_label, sizeof(fs_label), "Full Art: Letterbox");
          } else {
            snprintf(fs_label, sizeof(fs_label), "Full Art: Disabled");
          }
          draw_pill_button(110, 356, 110, 18, id(theme_secondary), id(col_dark_gray), fs_label, id(col_white), false);

          // Button 2: Controls Overlay Toggle (y = 165, r = 18)
          std::string ovl_label = id(music_controls_overlay_switch).state ? "Controls Overlay: On" : "Controls Overlay: Off";
          draw_pill_button(110, 356, 165, 18, id(theme_secondary), id(col_dark_gray), ovl_label.c_str(), id(col_white), false);

          // Button 3: Hardware Speaker Volume (y = 220, r = 18)
          char spk_vol[32];
          int v_cur = (int)std::round(id(pocket_music_player).volume * 100.0f);
          snprintf(spk_vol, sizeof(spk_vol), "Speaker Vol: %d%%", v_cur);
          draw_pill_button(110, 356, 220, 18, id(theme_secondary), id(col_dark_gray), spk_vol, id(col_white), false);

          // Button 4: Active Speaker Target (y = 275, r = 18)
          std::string spk_target = "Speaker: " + id(active_speaker_name);
          if (spk_target.length() > 24) spk_target = spk_target.substr(0, 22) + "..";
          draw_pill_button(110, 356, 275, 18, id(theme_secondary), id(col_dark_gray), spk_target.c_str(), id(col_white), false);

          // Bottom Button: Standardized < BACK (y = 375, r = 18)
          draw_pill_button(150, 316, 375, 18, id(col_slate), id(col_dark_gray), "< BACK", id(col_slate), false);
        }
      }


touchscreen:
  - platform: cst9220
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x5A
    interrupt_pin: GPIO11
    reset_pin: GPIO2
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            if (id(is_locked)) return; // Block all touch events in pocket
            if (id(is_hibernating)) {
              // Touch on glass immediately aborts hibernation countdown
              id(is_hibernating) = false;
              id(hibernate_countdown_val) = 0;
              id(sleep_start_time) = millis();
              id(screen_sleep_timer).execute();
              id(disp1).update();
              return;
            }
            id(screen_sleep_timer).execute(); // Activity watchdog reset on every valid touch
            // Standby Wake Handling: Guarded by tap_wake_mode (Always On, Docked Only, Disabled)
            if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
              std::string tw_mode = std::string(id(tap_wake_mode).current_option().c_str());
              if (tw_mode == "Disabled") return;
              if (tw_mode == "Docked Only" && !id(usb_connected).state) return;

              id(wake_to_active_state).execute();
              return;
            }

            // Voice Assistant Modal Takeover Interception & Tap to Cancel
            // Completely blocks touch events from leaking through to underlying page (e.g. media play/pause)
            if (id(va_active) || !id(va_status_text).empty()) {
              id(cancel_voice_assistant).execute();
              return;
            }

            // ==========================================
            // UNIVERSAL BOTTOM NAVIGATION TOUCH HANDLER (y >= 385)
            // ==========================================
            // When in Modal Music Menu (gui_page == 2 && music_overlay_mode == 1):
            // Fall through so [ RETURN ] button (y: 370..425, x: 140..326) receives touch.
            if (touch.y >= 405 && !(id(gui_page) == 2 && id(music_overlay_mode) == 1)) {
              if (touch.x < 205) {
                // Bottom-Left Navigation (<): Page Back / Previous
                if (id(gui_page) == 2 && id(music_overlay_mode) == 2) {
                  // Browse Library Category Carousel (3 pages)
                  id(music_category_page) = (id(music_category_page) == 1) ? 3 : (id(music_category_page) - 1);
                  id(disp1).update();
                  return;
                } else if (id(gui_page) == 2 && id(music_overlay_mode) == 3) {
                  // Item Browser Pagination (e.g. Artists 1..21)
                  if (id(music_browse_total_pages) > 1) {
                    if (id(music_browse_page) > 1) {
                      id(music_browse_page)--;
                    } else {
                      id(music_browse_page) = id(music_browse_total_pages);
                    }
                    id(fetch_music_browse).execute();
                    id(disp1).update();
                  }
                  return;
                } else {
                  // App Deck: Previous App in Deck
                  bool allow_deck_flip = !(id(gui_page) == 4 && id(system_menu_mode) > 0) &&
                                         !(id(gui_page) == 3 && id(active_game) > 0) &&
                                         !(id(gui_page) == 2 && id(music_overlay_mode) > 0);
                  if (allow_deck_flip) {
                    int total = id(active_deck_size);
                    if (total > 1) {
                      auto get_slot = [](int idx) -> int {
                        if (idx == 0) return id(deck_slot_0);
                        if (idx == 1) return id(deck_slot_1);
                        if (idx == 2) return id(deck_slot_2);
                        if (idx == 3) return id(deck_slot_3);
                        if (idx == 4) return id(deck_slot_4);
                        return 0;
                      };
                      int prev_idx = (id(current_deck_index) - 1 + total) % total;
                      id(current_deck_index) = prev_idx;
                      id(gui_page) = get_slot(prev_idx);

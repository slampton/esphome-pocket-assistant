  - platform: homeassistant
    id: ha_target_volume
    entity_id: ${target_vol_sensor}
    on_value:
      then:
        - lambda: |-
            if (!std::isnan(x) && x >= 0.0f && x <= 1.0f) {
              id(pocket_music_player).volume = x;
            }

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: pocket_wifi_signal
    update_interval: 60s

  - platform: motion
    motion_id: imu
    type: acceleration_x
    name: "Accel X"

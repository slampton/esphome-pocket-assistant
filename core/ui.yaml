                  id(remote_send_key).execute(8, act_slot);
                  id(disp1).update();
                }
                return;
              }
            // Page 8: Tools Suite (Launcher, Bubble Level, Flashlight, Coin, Dice, Tip Calc)
            } else if (id(gui_page) == 8) {
              static uint32_t last_stuff_tap = 0;
              uint32_t now_stuff = millis();

              if (id(stuff_subpage) == 0) {
                // ----------------------------------------------------
                // SUBPAGE 0: TOOLS LAUNCHER (2-Page 4+4 Icon Grid Hit Testing)

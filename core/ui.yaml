                // ----------------------------------------------------
                auto *slots = pocket_ui::timer_slots();
                int &view_idx = pocket_ui::timer_view_slot();

                if (is_back_button(touch)) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_stuff_tap = now_stuff;
                    if (view_idx > 0) {
                      view_idx = 0; // Back from Single-Timer Detail to 3-Timer Landing Page
                    } else {
                      id(stuff_subpage) = 0; // Back from Landing Page to Tools Launcher
                    }
                    id(disp1).update();
                  }
                  return;
                }

                if (view_idx == 0) {
                  // 3-Timer Landing Page: Cards at y = 122 (85..160), 210 (173..247), 298 (261..336)
                  int card_i = -1;
                  if (touch.y >= 85 && touch.y <= 168) card_i = 0;
                  else if (touch.y >= 176 && touch.y <= 268) card_i = 1;
                  else if (touch.y >= 276 && touch.y <= 368) card_i = 2;

                  if (card_i >= 0 && touch.x >= 70 && touch.x <= 396) {

                      } else if (touch.x >= 233 && touch.x < 329) {
                        s.duration_sec = clamp(s.duration_sec + 60, 60, 3600);
                      } else if (touch.x >= 329 && touch.x <= 421) {
                        s.duration_sec = clamp(s.duration_sec + 300, 60, 3600);
                      }
                      s.remaining_sec = s.duration_sec;
                      pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
                      id(disp1).update();

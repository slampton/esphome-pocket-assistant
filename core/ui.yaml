                  else if (cur_so == "1 min") nxt_so = "2 min";
                  else if (cur_so == "2 min") nxt_so = "Never";
                  else if (cur_so == "Never") nxt_so = "10s";
                  auto call = id(display_off_timeout).make_call();
                  call.set_option(nxt_so);
                  call.perform();
                  id(disp1).update();
                // Standardized generous < BACK Button at y = 408 (y >= 340, x: 80..386)
                } else if (touch.y >= 340 && touch.x >= 80 && touch.x <= 386) {
                  id(system_menu_mode) = 0; // Return to Main System Dashboard
                  id(disp1).update();
                }
              } else if (id(system_menu_mode) == 3) {
                // Mode 3: Actions Submenu (Standardized 60px Pitch, 16px Elevation)
                // Card 1: Hibernate Now (y: 79..132, x: 90..376, pill at y=104)
                if (touch.y >= 79 && touch.y <= 132 && touch.x >= 90 && touch.x <= 376) {
                  id(start_hibernation_countdown).execute();
                // Card 2: Auto-Sleep Timeout Cycler (y: 139..192, x: 90..376, pill at y=164)
                } else if (touch.y >= 139 && touch.y <= 192 && touch.x >= 90 && touch.x <= 376) {
                  std::string cur = std::string(id(sleep_timeout_mode).current_option().c_str());
                  std::string nxt = "5 min";
                  if (cur == "5 min") nxt = "10 min";
                  else if (cur == "10 min") nxt = "15 min";
                  else if (cur == "15 min") nxt = "30 min";
                  else if (cur == "30 min") nxt = "Disabled";
                  else if (cur == "Disabled") nxt = "5 min";
                  auto call = id(sleep_timeout_mode).make_call();
                  call.set_option(nxt);
                  call.perform();
                  id(disp1).update();
                // Card 3: Restart Device (y: 199..252, x: 90..376, pill at y=224)
                } else if (touch.y >= 199 && touch.y <= 252 && touch.x >= 90 && touch.x <= 376) {
                  id(system_menu_mode) = 4; // Open Confirmation Dialog
                  id(disp1).update();
                // Card 4: Software Update (y: 259..314, x: 90..376, pill at y=284)
                } else if (touch.y >= 259 && touch.y <= 314 && touch.x >= 90 && touch.x <= 376) {
                  id(system_menu_mode) = 5; // Open Software Update Screen
                  id(disp1).update();
                // Standardized generous < BACK Button at y = 408 (y >= 340, x: 80..386)
                } else if (touch.y >= 340 && touch.x >= 80 && touch.x <= 386) {
                  id(system_menu_mode) = 0; // Return to Main System Dashboard
                  id(disp1).update();
                }
              } else if (id(system_menu_mode) == 4) {
                // Mode 4: Restart Confirmation Dialog
                if (touch.y >= 195 && touch.y <= 265) {
                  if (touch.x >= 90 && touch.x <= 225) {
                    // Cancel -> return to Power Options
                    id(system_menu_mode) = 3;
                    id(disp1).update();
                  } else if (touch.x >= 240 && touch.x <= 375) {
                    // Confirm Restart
                    id(restart_button).press();
                  }
                }
              } else if (id(system_menu_mode) == 5) {
                // Mode 5: Software Update Screen
                // Action Button: Update Now or Check for Updates (y: 190..240, x: 100..366)
                if (touch.y >= 190 && touch.y <= 240 && touch.x >= 100 && touch.x <= 366) {
                  std::string lat_v = id(ha_firmware_latest_version).state;
                  bool has_update = is_newer_semver(lat_v, "${version}");
                  if (has_update) {
                    id(system_menu_mode) = 6; // Open Update Confirmation Dialog
                    id(disp1).update();
                  } else if (id(update_check_state) == 0) {
                    // Start interactive checking sequence
                    id(update_check_state) = 1;
                    id(update_check_timer) = millis();
                    id(check_firmware_update).execute();
                    id(disp1).update();
                  }
                // Standardized generous < BACK Button at y = 408 (y >= 340, x: 80..386)
                } else if (touch.y >= 340 && touch.x >= 80 && touch.x <= 386) {
                  id(update_check_state) = 0; // Reset checking state
                  id(system_menu_mode) = 0; // Return to Main System Dashboard
                  id(disp1).update();
                }
              } else if (id(system_menu_mode) == 6) {
                // Mode 6: Update Confirmation Dialog
                if (touch.y >= 210 && touch.y <= 270) {
                  if (touch.x >= 90 && touch.x <= 225) {
                    // Cancel -> return to Software Update Screen
                    id(system_menu_mode) = 5;
                    id(disp1).update();
                  } else if (touch.x >= 240 && touch.x <= 375) {
                    // Confirm Install -> trigger update and arm OTA overlay
                    id(trigger_firmware_update).execute();
                  }
                }
              } else if (id(system_menu_mode) == 7) {
                // Mode 7: Audio Submenu (Standardized 58px Pitch, 5 Slots)
                // Card 1: Album Art Style Cycler (y: 75..133, x: 75..395, pill at y=104)
                if (touch.y >= 75 && touch.y <= 133 && touch.x >= 75 && touch.x <= 395) {
                  std::string cur_mode = id(music_fullscreen_art_mode).current_option();
                  std::string nxt_mode = "Letterbox";
                  if (cur_mode == "Full Screen") nxt_mode = "Letterbox";
                  else if (cur_mode == "Letterbox") nxt_mode = "Compact";
                  else nxt_mode = "Full Screen";
                  auto call = id(music_fullscreen_art_mode).make_call();
                  call.set_option(nxt_mode);
                  call.perform();
                  id(disp1).update();
                // Card 2: Music Overlay Style Cycler (y: 134..191, x: 75..395, pill at y=162)
                } else if (touch.y >= 134 && touch.y <= 191 && touch.x >= 75 && touch.x <= 395) {
                  std::string cur_ov = id(music_overlay_style).current_option();
                  std::string nxt_ov = "Art + Metadata";
                  if (cur_ov == "Art Only") nxt_ov = "Art + Metadata";
                  else if (cur_ov == "Art + Metadata") nxt_ov = "Always Visible";
                  else nxt_ov = "Art Only";
                  auto call = id(music_overlay_style).make_call();
                  call.set_option(nxt_ov);
                  call.perform();
                  id(disp1).update();
                // Card 3: Hardware Speaker Volume Step (y: 192..249, x: 75..395, pill at y=220)
                } else if (touch.y >= 192 && touch.y <= 249 && touch.x >= 75 && touch.x <= 395) {
                  float cur_vol = id(pocket_music_player).volume;
                  float new_vol = cur_vol + 0.10f;
                  if (new_vol > 0.90f) new_vol = 0.10f;
                  id(pocket_music_player).volume = new_vol;
                  id(pocket_music_player).make_call().set_volume(new_vol).perform();
                  id(disp1).update();
                // Card 4: Independent Alert Volume Step (y: 250..307, x: 75..395, pill at y=278)
                } else if (touch.y >= 250 && touch.y <= 307 && touch.x >= 75 && touch.x <= 395) {
                  float cur_a_f = id(alert_volume).state;
                  int cur_a = (std::isnan(cur_a_f) || cur_a_f < 20.0f) ? 80 : (int)std::round(cur_a_f);
                  int nxt_a = cur_a + 10;
                  if (nxt_a > 100) nxt_a = 50;
                  auto call = id(alert_volume).make_call();
                  call.set_value((float)nxt_a);
                  call.perform();
                  id(disp1).update();
                // Card 5: Voice Assistant Screen Wake Toggle (y: 308..365, x: 75..395, pill at y=336)
                } else if (touch.y >= 308 && touch.y <= 365 && touch.x >= 75 && touch.x <= 395) {
                  id(va_wake_screen_switch).toggle();
                  id(disp1).update();
                // Standardized generous < BACK Button at y = 408 (y >= 366, x: 80..386)
                } else if (touch.y >= 366 && touch.x >= 80 && touch.x <= 386) {
                  id(system_menu_mode) = 0; // Return to Main System Dashboard
                  id(disp1).update();
                }
              } else if (id(system_menu_mode) == 8) {
                // Mode 8: System Info Submenu
                // Standardized generous < BACK Button at y = 408 (y >= 340, x: 80..386)
                if (touch.y >= 340 && touch.x >= 80 && touch.x <= 386) {
                  id(system_menu_mode) = 0; // Return to Main System Dashboard
                  id(disp1).update();
                } else {
                  id(disp1).update(); // Tap anywhere else to refresh telemetry
                }
              } else if (id(system_menu_mode) == 9) {
                // Mode 9: Clock & Time Submenu (Standardized 60px Pitch, 16px Elevation)
                // Card 1: Clock Face Style Cycler (y: 79..134, x: 90..376, pill at y=104)
                if (touch.y >= 79 && touch.y <= 134 && touch.x >= 90 && touch.x <= 376) {
                  id(clock_face_digital) = !id(clock_face_digital);
                  auto call = id(clock_face_style).make_call();
                  call.set_option(id(clock_face_digital) ? "Modern Digital (Bold)" : "Modern Roman (Analog)");
                  call.perform();
                  id(disp1).update();
                // Card 2: Time Format Cycler (y: 139..194, x: 90..376, pill at y=164)
                } else if (touch.y >= 139 && touch.y <= 194 && touch.x >= 90 && touch.x <= 376) {
                  id(is_24h_format) = !id(is_24h_format);
                  auto call = id(time_format_select).make_call();
                  call.set_option(id(is_24h_format) ? "24-Hour" : "12-Hour (AM/PM)");
                  call.perform();
                  id(disp1).update();
                // Card 3: Time Sync Status (y: 199..254, x: 90..376, pill at y=224)
                } else if (touch.y >= 199 && touch.y <= 254 && touch.x >= 90 && touch.x <= 376) {
                  id(disp1).update();
                // Standardized generous < BACK Button at y = 408 (y >= 340, x: 80..386)
                } else if (touch.y >= 340 && touch.x >= 80 && touch.x <= 386) {
                  id(system_menu_mode) = 0; // Return to Main System Dashboard
                  id(disp1).update();
                }
              }
            } else if (id(gui_page) == 5) {
              // Page 5: Sky & Weather 4-View Suite Touch Routing (2x2 Bottom Grid & Celestial Shortcut)
              static uint32_t last_weather_touch = 0;
              uint32_t now_w_touch = millis();

              // Zone 1: Row 1 of 2x2 Grid (y: 266..325) -> Current (Left) | Forecast (Right)
              if (touch.y >= 266 && touch.y <= 325) {
                if (now_w_touch - last_weather_touch > 120) {
                  last_weather_touch = now_w_touch;
                  int target = (touch.x < 233) ? 0 : 1;
                  if (id(sky_weather_subpage) != target) {
                    id(sky_weather_subpage) = target;
                    id(disp1).update();
                  }
                }
                return;
              }
              // Zone 2: Row 2 of 2x2 Grid (y: 326..399) -> Sun (Left) | Moon (Right)
              // Generous downward thumb cushion (+23px into black area below pill y=376)
              if (touch.y >= 326 && touch.y <= 399) {
                if (now_w_touch - last_weather_touch > 120) {
                  last_weather_touch = now_w_touch;
                  int target = (touch.x < 233) ? 2 : 3;
                  if (id(sky_weather_subpage) != target) {
                    id(sky_weather_subpage) = target;
                    id(disp1).update();
                  }
                }
                return;
              }
              // Zone 3: Interactive Upper-Right Celestial Icon Shortcut (x: 305..390, y: 44..119)
              if (id(sky_weather_subpage) == 0 && touch.x >= 305 && touch.x <= 390 && touch.y >= 44 && touch.y <= 119) {
                if (now_w_touch - last_weather_touch > 120) {
                  last_weather_touch = now_w_touch;
                  std::string s_state = id(ha_sun_state).state;
                  std::string cond = id(ha_weather_condition).state;
                  bool is_night = (s_state == "below_horizon" || cond == "clear-night" || cond == "clearnight" || (cond.find("night") != std::string::npos));
                  std::string sim_opt = std::string(id(weather_sim_condition).current_option().c_str());
                  if (!sim_opt.empty() && sim_opt != "Live (Home Assistant)") {
                    if (sim_opt.find("(Night)") != std::string::npos || sim_opt == "Clear Night") is_night = true;
                    else if (sim_opt.find("(Day)") != std::string::npos || sim_opt == "Sunny / Clear Day" || sim_opt == "Windy" || sim_opt == "Pouring / Heavy Rain") is_night = false;
                  }
                  int target = is_night ? 3 : 2;
                  if (id(sky_weather_subpage) != target) {
                    id(sky_weather_subpage) = target;
                    id(disp1).update();
                  }
                }
                return;
              }
              // Zone 4: Central Screen Tap (y: 50..265) -> Cycles sequentially through all views (0 -> 1 -> 2 -> 3 -> 0)
              if (touch.y >= 50 && touch.y <= 265) {
                if (now_w_touch - last_weather_touch > 180) {
                  last_weather_touch = now_w_touch;
                  id(sky_weather_subpage) = (id(sky_weather_subpage) + 1) % 4;
                  id(disp1).update();
                }
                return;
              }
            } else if (id(gui_page) == 6) {
              // ----------------------------------------------------------------
              // PAGE 6: TIMER & ALARM TOUCH ROUTING (v1.1 OVERHAUL)
              // ----------------------------------------------------------------
              // Zone 1: Standardized In-App 2-Pill Navigation (y: 326..399) -> Timer (Left) | Alarm (Right)
              // Generous downward thumb cushion (+23px into black area below pill y=376)
              if (id(alarm_edit_idx) == 0 && touch.y >= 326 && touch.y <= 399) {
                static uint32_t last_ta_sub_touch = 0;
                uint32_t now_ta = millis();
                if (now_ta - last_ta_sub_touch > 120) {
                  last_ta_sub_touch = now_ta;
                  int target = (touch.x < 233) ? 0 : 1;
                  if (id(timer_alarm_subpage) != target) {
                    id(timer_alarm_subpage) = target;
                    id(disp1).update();
                  }
                }
                return;
              }

              if (id(timer_alarm_subpage) == 0) {
                // ==============================================================
                // SUBPAGE 0: COUNTDOWN TIMER TOUCH
                // ==============================================================
                // Zone 2: Centered Hero Button (START / PAUSE / RESUME) (y: 188..240, button at y=214)
                if (touch.y >= 202 && touch.y <= 254 && touch.x >= 125 && touch.x <= 341) {
                  if (!id(timer_running) && !id(timer_paused)) {
                    // START
                    id(timer_running) = true;
                    id(timer_paused) = false;
                    id(timer_remaining_sec) = id(timer_duration_sec);
                    id(timer_target_ms) = millis() + (id(timer_duration_sec) * 1000);
                    id(disp1).update();
                    return;
                  } else if (id(timer_running)) {
                    // PAUSE
                    id(timer_running) = false;
                    id(timer_paused) = true;
                    id(timer_remaining_sec) = (id(timer_target_ms) > millis()) ? ((id(timer_target_ms) - millis() + 999) / 1000) : 0;
                    id(disp1).update();
                    return;
                  } else if (id(timer_paused)) {
                    // RESUME
                    id(timer_running) = true;
                    id(timer_paused) = false;
                    id(timer_target_ms) = millis() + (id(timer_remaining_sec) * 1000);
                    id(disp1).update();
                    return;
                  }
                }

                // Zone 3: Adjustment Pills or Reset with natural gap spacing (y: 258..301, pills at y=278)
                if (touch.y >= 272 && touch.y <= 315) {
                  if (!id(timer_running) && !id(timer_paused)) {
                    if (touch.x >= 40 && touch.x <= 133) {
                      // -5m (span 48..126)
                      id(timer_duration_sec) = std::max(60, id(timer_duration_sec) - 300);
                      id(timer_remaining_sec) = id(timer_duration_sec);
                      id(disp1).update();
                      return;
                    } else if (touch.x >= 134 && touch.x <= 220) {
                      // -1m (span 140..204)
                      id(timer_duration_sec) = std::max(60, id(timer_duration_sec) - 60);
                      id(timer_remaining_sec) = id(timer_duration_sec);
                      id(disp1).update();
                      return;
                    } else if (touch.x >= 246 && touch.x <= 333) {
                      // +1m (span 262..326)
                      id(timer_duration_sec) = std::min(3600, id(timer_duration_sec) + 60);
                      id(timer_remaining_sec) = id(timer_duration_sec);
                      id(disp1).update();
                      return;
                    } else if (touch.x >= 334 && touch.x <= 426) {
                      // +5m (span 340..418)
                      id(timer_duration_sec) = std::min(3600, id(timer_duration_sec) + 300);
                      id(timer_remaining_sec) = id(timer_duration_sec);
                      id(disp1).update();
                      return;
                    }
                  } else {
                    // RESET pill while running or paused
                    if (touch.x >= 150 && touch.x <= 316) {
                      id(timer_running) = false;
                      id(timer_paused) = false;
                      id(timer_remaining_sec) = id(timer_duration_sec);
                      id(disp1).update();
                      return;
                    }
                  }
                }

                // Zone 4: Tap digits to reset duration to default 5m when stopped (y: 66..146, x: 120..346)
                if (!id(timer_running) && !id(timer_paused) && touch.y >= 80 && touch.y <= 160 && touch.x >= 120 && touch.x <= 346) {
                  if (id(timer_duration_sec) != 300) {
                    id(timer_duration_sec) = 300;
                    id(timer_remaining_sec) = 300;
                    id(disp1).update();
                    return;
                  }
                }
              } else {
                // ==============================================================
                // SUBPAGE 1: ALARM MANAGER TOUCH
                // ==============================================================
                if (id(alarm_edit_idx) == 0) {
                  // Alarm 1 Touch Interception (If Alarm 1 is snoozed, tapping dismisses snooze without altering schedule)
                  if (id(alarm_snooze_until) > 0 && (id(alarm_ringing_idx) == 1 || id(alarm_ringing_idx) == 0)) {
                    if (touch.y >= 84 && touch.y <= 176 && touch.x >= 50 && touch.x <= 385) {
                      id(alarm_snooze_until) = 0;
                      id(disp1).update();
                      return;
                    }
                  } else {
                    // Alarm 1 Toggle Switch (x: 305..385, y: 93..153)
                    if (touch.y >= 93 && touch.y <= 153 && touch.x >= 305 && touch.x <= 385) {
                      id(alarm1_enabled) = !id(alarm1_enabled);
                      id(disp1).update();
                      return;
                    }
                    // Alarm 1 Card Area -> Enter Editor (x: 50..304, y: 84..176)
                    if (touch.y >= 84 && touch.y <= 176 && touch.x >= 50 && touch.x <= 304) {
                      id(alarm_edit_idx) = 1;
                      id(disp1).update();
                      return;
                    }
                  }

                  // Alarm 2 Touch Interception (If Alarm 2 is snoozed, tapping dismisses snooze without altering schedule)
                  if (id(alarm_snooze_until) > 0 && id(alarm_ringing_idx) == 2) {
                    if (touch.y >= 194 && touch.y <= 286 && touch.x >= 50 && touch.x <= 385) {
                      id(alarm_snooze_until) = 0;
                      id(disp1).update();
                      return;
                    }
                  } else {
                    // Alarm 2 Toggle Switch (x: 305..385, y: 203..263)
                    if (touch.y >= 203 && touch.y <= 263 && touch.x >= 305 && touch.x <= 385) {
                      id(alarm2_enabled) = !id(alarm2_enabled);
                      id(disp1).update();
                      return;
                    }
                    // Alarm 2 Card Area -> Enter Editor (x: 50..304, y: 194..286)
                    if (touch.y >= 194 && touch.y <= 286 && touch.x >= 50 && touch.x <= 304) {
                      id(alarm_edit_idx) = 2;
                      id(disp1).update();
                      return;
                    }
                  }

                  // Tapping the snooze countdown text at y = 302 also dismisses snooze
                  if (id(alarm_snooze_until) > 0 && touch.y >= 287 && touch.y <= 321 && touch.x >= 80 && touch.x <= 386) {
                    id(alarm_snooze_until) = 0;
                    id(disp1).update();
                    return;
                  }
                } else {
                  // Alarm Editor Touch Controls
                  int edit_idx = id(alarm_edit_idx);
                  int& cur_h = (edit_idx == 2) ? id(alarm2_hour) : id(alarm1_hour);
                  int& cur_m = (edit_idx == 2) ? id(alarm2_minute) : id(alarm1_minute);
                  int& cur_rec = (edit_idx == 2) ? id(alarm2_recurrence) : id(alarm1_recurrence);

                  // Hour & Minute Steppers (y: 211..256, matching buttons at center line y=233)
                  if (touch.y >= 211 && touch.y <= 256) {
                    if (touch.x >= 75 && touch.x <= 145) {
                      cur_h = (cur_h + 23) % 24;
                      id(disp1).update();
                      return;
                    } else if (touch.x >= 146 && touch.x <= 225) {
                      cur_h = (cur_h + 1) % 24;
                      id(disp1).update();
                      return;
                    }
                    if (touch.x >= 245 && touch.x <= 320) {
                      cur_m = (cur_m + 55) % 60;
                      id(disp1).update();
                      return;
                    } else if (touch.x >= 321 && touch.x <= 395) {
                      cur_m = (cur_m + 5) % 60;
                      id(disp1).update();
                      return;
                    }
                  }

                  // Recurrence Selector Button (y: 271..326, x: 100..366, matching pill at y=296)
                  if (touch.y >= 271 && touch.y <= 326 && touch.x >= 100 && touch.x <= 366) {
                    cur_rec = (cur_rec + 1) % 4;
                    id(disp1).update();
                    return;
                  }

                  // Standardized System < BACK Button at y = 408 (generous chin-to-bezel touch zone y >= 340, x: 80..386)
                  if (touch.y >= 340 && touch.x >= 80 && touch.x <= 386) {
                    id(alarm_edit_idx) = 0;
                    if (edit_idx == 1) id(alarm1_enabled) = true;
                    if (edit_idx == 2) id(alarm2_enabled) = true;
                    id(disp1).update();
                    return;
                  }
                }
              }
            }
        - script.execute: screen_sleep_timer


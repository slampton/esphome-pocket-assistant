                      last_stuff_tap = now_stuff;
                      auto &s = slots[card_i];
                      if (touch.x >= 298) {
                        // 1-Tap Play / Pause Toggle directly from Landing Page!
                        if (!s.running && !s.paused) {
                          s.running = true;
                          s.paused = false;
                          s.remaining_sec = s.duration_sec;
                          s.target_ms = now_stuff + static_cast<uint32_t>(s.duration_sec) * 1000U;
                        } else if (s.running) {
                          s.running = false;
                          s.paused = true;
                          s.remaining_sec = (s.target_ms > now_stuff) ? static_cast<int>((s.target_ms - now_stuff + 999U) / 1000U) : 0;
                        } else {
                          s.running = true;
                          s.paused = false;
                          s.target_ms = now_stuff + static_cast<uint32_t>(s.remaining_sec) * 1000U;
                        }
                        pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
                      } else {
                        // Open Single-Timer Detail / Editor View for this slot
                        view_idx = card_i + 1;
                      }
                      id(disp1).update();
                    }
                    return;
                  }
                  return;
                }

                // Single-Timer Detail View (view_idx == 1..3)
                int s_idx = (view_idx >= 1 && view_idx <= 3) ? (view_idx - 1) : 0;
                auto &s = slots[s_idx];


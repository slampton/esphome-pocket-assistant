                if (id(stuff_menu_page) == 0) {
                  // PAGE 1: 4 ICONS (Timer, Alarms, Flashlight, Calculator)
                  if (touch.y >= 85 && touch.y < 221) {
                    if (touch.x <= 230) target_subpage = 1; // Timer
                    else if (touch.x > 230 && touch.x < 370) target_subpage = 2; // Alarms
                  } else if (touch.y >= 221 && touch.y <= 385) {
                    if (touch.x <= 230) target_subpage = 5; // Flashlight
                    else if (touch.x > 230 && touch.x < 370) target_subpage = 6; // Calculator
                  }
                } else {
                  // PAGE 2: 4 ICONS (Stopwatch, Dice Roll, Level, Coin Flip)
                  if (touch.y >= 85 && touch.y < 221) {
                    if (touch.x <= 230) target_subpage = 3; // Stopwatch
                    else if (touch.x > 230 && touch.x < 370) target_subpage = 4; // Dice Roll
                  } else if (touch.y >= 221 && touch.y <= 385) {
                    if (touch.x <= 230) target_subpage = 7; // Level
                    else if (touch.x > 230 && touch.x < 370) target_subpage = 8; // Coin Flip
                  }
                }

                if (target_subpage > 0) {
                  if (now_stuff - last_stuff_tap > TOUCH_DEBOUNCE_BUTTON) {

script:

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          std::string p = std::string(id(theme_palette_select).current_option().c_str());
          if (p == "Steel & Silver") {
            id(theme_primary) = Color(107, 142, 158);  // Soft Steel Ice Blue #6B8E9E
            id(theme_secondary) = Color(192, 192, 192);// Brushed Silver #C0C0C0
          } else if (p == "Pink & Gray") {
            id(theme_primary) = Color(168, 120, 132);  // Muted Ash Pink #A87884 (faint, gray undertones)
            id(theme_secondary) = Color(192, 192, 192);// Brushed Silver / Gray #C0C0C0
          } else if (p == "Green & Gold") {
            id(theme_primary) = Color(66, 116, 83);    // Heritage Sage Green #427453
            id(theme_secondary) = Color(197, 155, 39); // Chrono Mustard Gold #C59B27
          } else {
            // Blue & Gold (Default Classic): Steel Slate Blue + Chrono Gold
            id(theme_primary) = Color(69, 110, 138);   // #456E8A Steel Cyan
            id(theme_secondary) = Color(197, 155, 39); // #C59B27 Vintage Gold
          }
          if (id(display_power_state) == 0) id(disp1).update();

  - id: rebuild_active_deck
    mode: restart
    then:
      - lambda: |-
          struct AppEntry {
            int page_id;
            float rank;
            bool enabled;
          };

          AppEntry pool[5] = {
            {0, id(app_order_clock).state, id(show_clock_switch).state},
            {1, id(app_order_stopwatch).state, id(show_stopwatch_switch).state},
            {2, id(app_order_music).state, id(show_music_switch).state},
            {3, id(app_order_games).state, id(show_games_switch).state},
            {4, id(app_order_system).state, id(show_system_switch).state}
          };

          // Stable bubble sort by user-configured position rank (1..10)
          for (int i = 0; i < 4; i++) {
            for (int j = 0; j < 4 - i; j++) {
              if (pool[j].rank > pool[j + 1].rank) {
                AppEntry tmp = pool[j];
                pool[j] = pool[j + 1];
                pool[j + 1] = tmp;
              }
            }
          }

          int count = 0;
          for (int i = 0; i < 5; i++) {
            if (pool[i].enabled) {
              if (count == 0) id(deck_slot_0) = pool[i].page_id;
              else if (count == 1) id(deck_slot_1) = pool[i].page_id;
              else if (count == 2) id(deck_slot_2) = pool[i].page_id;
              else if (count == 3) id(deck_slot_3) = pool[i].page_id;
              else if (count == 4) id(deck_slot_4) = pool[i].page_id;
              count++;
            }
          }

          if (count == 0) {
            id(deck_slot_0) = 0;
            count = 1;
          }
          id(active_deck_size) = count;

          auto get_slot = [](int idx) -> int {
            if (idx == 0) return id(deck_slot_0);
            if (idx == 1) return id(deck_slot_1);
            if (idx == 2) return id(deck_slot_2);
            if (idx == 3) return id(deck_slot_3);
            if (idx == 4) return id(deck_slot_4);
            return 0;
          };

          // Preserve active page if still enabled, else snap to first slot
          bool found = false;
          for (int i = 0; i < count; i++) {
            if (get_slot(i) == id(gui_page)) {
              found = true;
              id(current_deck_index) = i;
              break;
            }
          }
          if (!found) {
            id(current_deck_index) = 0;
            id(gui_page) = id(deck_slot_0);
            id(disp1).update();
          }
  - id: sync_display_brightness
    mode: restart
    then:
      - lambda: |-
          auto parse_bri = [](const std::string& opt) -> float {
            if (opt == "60%") return 0.60f;
            if (opt == "70%") return 0.70f;
            if (opt == "80%") return 0.80f;
            if (opt == "90%") return 0.90f;
            if (opt == "100%") return 1.00f;
            return 0.90f;
          };

          float b_target = 0.90f;
          std::string mode = std::string(id(auto_brightness_mode).current_option().c_str());

          if (mode == "Sun Synchronized") {
            std::string sun = id(ha_sun_state).state;
            bool is_night = (sun == "below_horizon");
            std::string opt = is_night ? std::string(id(night_brightness_preset).current_option().c_str())
                                       : std::string(id(day_brightness_preset).current_option().c_str());
            b_target = parse_bri(opt);
          } else if (mode == "Time Schedule") {
            auto now = id(ha_time).now();
            int day_h = (int)id(day_start_hour).state;
            int night_h = (int)id(night_start_hour).state;
            bool is_day = true;
            if (now.is_valid()) {
              if (day_h < night_h) {
                is_day = (now.hour >= day_h && now.hour < night_h);
              } else {
                is_day = (now.hour >= day_h || now.hour < night_h);
              }
            }
            std::string opt = is_day ? std::string(id(day_brightness_preset).current_option().c_str())
                                     : std::string(id(night_brightness_preset).current_option().c_str());
            b_target = parse_bri(opt);
          } else {
            std::string opt = std::string(id(display_brightness_preset).current_option().c_str());
            b_target = parse_bri(opt);
          }

          // CENTRAL POWER ARBITRATION INVARIANT:
          if (id(display_power_state) == 0) { // ACTIVE
            id(display_brightness).turn_on().set_brightness(b_target).perform();
          } else if (id(display_power_state) == 1) { // SCREENSAVER
            id(display_brightness).turn_on().set_brightness(0.60f).perform(); // Screensaver locked at 60%
          }


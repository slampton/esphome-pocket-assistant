interval:
  - interval: 5min
    then:
      - script.execute: sync_display_brightness
  - interval: 60min
    then:
      - lambda: |-
          // Priority 1: Periodic thermal drift compensation for RTC slow clock
          extern uint32_t rtc_clk_cal(int cal_clk, uint32_t slow_clk_cycles) __asm__("rtc_clk_cal");
          uint32_t cal_val = rtc_clk_cal(0, 1024);
          ESP_LOGD("rtc_cal", "Periodic RTC slow clock calibration: %lu", (unsigned long)cal_val);

  - interval: 10s
    then:
      - lambda: |-
          uint8_t reg0 = 0x00;
          uint8_t stat0 = 0;
          bool vbus = false;
          if (id(bus_internal).write_readv(0x34, &reg0, 1, &stat0, 1) == esphome::i2c::ERROR_OK) {
            vbus = (stat0 & 0x20) != 0;
            id(usb_connected).publish_state(vbus);
          }
          uint8_t reg1 = 0x01;
          uint8_t stat1 = 0;
          if (id(bus_internal).write_readv(0x34, &reg1, 1, &stat1, 1) == esphome::i2c::ERROR_OK) {
            uint8_t chg = (stat1 >> 5) & 0x03;
            id(batt_charging).publish_state(vbus && (chg == 1));
          }

          // Priority 4: Configurable Inactivity Auto-Descent to Deep Sleep
          uint32_t sleep_timeout_ms = 300000;
          std::string st_opt = std::string(id(sleep_timeout_mode).current_option().c_str());
          bool auto_sleep_enabled = true;
          if (st_opt == "10 min") sleep_timeout_ms = 600000;
          else if (st_opt == "15 min") sleep_timeout_ms = 900000;
          else if (st_opt == "30 min") sleep_timeout_ms = 1800000;
          else if (st_opt == "Disabled") auto_sleep_enabled = false;

          if (auto_sleep_enabled &&
              !id(prevent_deep_sleep_switch).state &&
              !id(display_brightness).current_values.is_on() &&
              !id(usb_connected).state &&
              !id(ota_in_progress) &&
              (id(pocket_music_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) &&
              !id(va).is_running() &&
              !id(va_tts_received) &&
              !id(announcement_mixing_input).is_running() &&
              (id(active_game) == 0) &&
              id(sleep_start_time) > 0 &&
              (millis() - id(sleep_start_time) >= sleep_timeout_ms)) {
            ESP_LOGI("power", "Inactivity with screen off exceeded %s: starting hibernation countdown", st_opt.c_str());
            id(start_hibernation_countdown).execute();
          }

  - interval: 100ms
    then:
      - lambda: |-
          // Active Update Check animation refresh
          if (id(gui_page) == 4 && id(system_menu_mode) == 5 && id(update_check_state) > 0) {
            id(disp1).update();
          }

          // Read AXP2101 IRQ status for top button (PWR / PEK)
          uint8_t irq_reg = 0x49;
          uint8_t irq_val = 0;
          if (id(bus_internal).write_readv(0x34, &irq_reg, 1, &irq_val, 1) == esphome::i2c::ERROR_OK) {
            if (irq_val & 0x0C) {
              if (id(is_hibernating)) {
                // Crown press aborts hibernation countdown immediately!
                id(is_hibernating) = false;
                id(hibernate_countdown_val) = 0;
                id(sleep_start_time) = millis();
                id(screen_sleep_timer).execute();
                id(disp1).update();
                uint8_t clr[2] = {0x49, uint8_t(irq_val & 0x0C)};
                id(bus_internal).write(0x34, clr, 2);
                return;
              }
              bool is_long = (irq_val & 0x04) != 0;
              uint8_t clr[2] = {0x49, uint8_t(irq_val & 0x0C)};
              id(bus_internal).write(0x34, clr, 2);

              // ---------------------------------------------
              // POCKET LOCK MANAGEMENT (HOLD CROWN 1.5s)
              // ---------------------------------------------
              if (id(is_locked)) {
                if (is_long) {
                  id(unlock_device).execute();
                }
                return; // Ignore all short clicks in locked state
              }

              // Long press (1.5s hold) initiates hibernation countdown
              if (is_long) {
                id(start_hibernation_countdown).execute();
                return;
              }

              if (!id(display_brightness).current_values.is_on()) {
                if (id(sleep_start_time) > 0 && (millis() - id(sleep_start_time) >= 30000)) {
                  id(apply_default_start_page).execute();
                }
                id(sleep_start_time) = 0;
                id(display_brightness).turn_on().perform();
                id(disp1).update();
                return;
              }

              id(screen_sleep_timer).execute();

              if (id(gui_page) == 0) {
                // Main Clock Face -> quick screen off (Tier 2 Screen Standby)
                id(sleep_start_time) = millis();
                id(display_brightness).turn_off().perform();
                return;
              } else if (id(gui_page) == 1) {
                if (!id(stopwatch_running)) {
                  id(stopwatch_running) = true;
                  id(stopwatch_start_time) = millis() - id(stopwatch_elapsed_ms);
                  id(sleep_start_time) = 0;
                  id(display_brightness).turn_on().perform();
                } else {
                  id(stopwatch_running) = false;
                  // The AXP2101 PMIC PEK short-press IRQ is inherently a key-RELEASE event.
                  // By the time the release IRQ is raised and polled over I2C, approximately
                  // 200ms of physical human thumb hold + PMIC debounce qualification has elapsed.
                  // Compensate for this key-down dwell time so the stopped time reflects when the crown was pressed down!
                  uint32_t now_stop = millis();
                  uint32_t press_dwell_compensation = 200; // ms
                  if (now_stop - id(stopwatch_start_time) > press_dwell_compensation) {
                    id(stopwatch_elapsed_ms) = (now_stop - id(stopwatch_start_time)) - press_dwell_compensation;
                  } else {
                    id(stopwatch_elapsed_ms) = now_stop - id(stopwatch_start_time);
                  }
                }
                id(disp1).update();
              } else if (id(gui_page) == 2) {
                // Top Crown Button on Page 2: Toggle Category Menu Overlay
                if (id(music_overlay_mode) == 0) {
                  id(music_overlay_mode) = 1; // Open Level 1 Categories Menu
                } else {
                  id(music_overlay_mode) = 0; // Close overlay back to Now Playing player
                }
                id(disp1).update();
              } else if (id(gui_page) == 3) {
                // Page 3: Games -> click top button exits active game or exits menu to Watch Face
                if (id(active_game) > 0) {
                  id(active_game) = 0; // Exit game back to Games Menu
                } else {
                  id(apply_default_start_page).execute();
                }
                id(disp1).update();
              } else if (id(gui_page) == 4) {
                // Page 4: System -> click top button cycles brightness preset
                std::string cur = std::string(id(display_brightness_preset).current_option().c_str());
                std::string nxt = "90%";
                if (cur == "60%") nxt = "70%";
                else if (cur == "70%") nxt = "80%";
                else if (cur == "80%") nxt = "90%";
                else if (cur == "90%") nxt = "100%";
                else nxt = "60%";
                auto call = id(display_brightness_preset).make_call();
                call.set_option(nxt);
                call.perform();
              }
            }
          }

          // Dynamic display update for Stopwatch (150ms = ~6.7 FPS: smooth mechanical sweep, 77% CPU idle window for touch)
          if (id(display_brightness).current_values.is_on()) {
            if (id(gui_page) == 1 && id(stopwatch_running)) {
              // Priority 0: Touch Interrupt Yielding
              // If user is currently touching the screen (GPIO11 active LOW), yield immediately!
              // This guarantees the touch controller and gesture processing get instantaneous priority without display lag.
              if (gpio_get_level(GPIO_NUM_11) == 0) {
                return;
              }

              static uint32_t last_chrono_disp_update = 0;
              uint32_t now_chrono_ms = millis();
              if (now_chrono_ms - last_chrono_disp_update >= 150) {
                last_chrono_disp_update = now_chrono_ms;
                id(disp1).update();
              }
            }
            // Priority 3: Asymmetric Animation Cadence with Collision Protection
            // While Listening/Thinking: 150ms (~6.7 FPS) fluid breathing (speaker is silent, zero audio contention)
            // While Speaking (TTS): throttled to va_speech_anim_interval (default 800ms) to guarantee 100% clean audio
            if (id(va_active) || !id(va_status_text).empty()) {
              static uint32_t last_va_anim_time = 0;
              static bool prev_tts_active = false;
              uint32_t now_ms = millis();

              // Smooth state transition: When speech starts, reserve quiet bus air for DAC unmute and first syllables
              if (id(va_tts_received) != prev_tts_active) {
                prev_tts_active = id(va_tts_received);
                last_va_anim_time = now_ms; // Resets timer so first speaking frame waits for cadence
                return; // Do NOT blit immediately; let initial audio packets and DAC soft-ramp stabilize cleanly
              }

              uint32_t cadence = 150;
              if (id(va_tts_received)) {
                cadence = (uint32_t)id(va_speech_anim_interval).state;
                if (cadence < 150) cadence = 350;
              }
              if (now_ms - last_va_anim_time >= cadence) {
                last_va_anim_time = now_ms;
                id(disp1).update();
              }
            }
          }

  - interval: 50ms
    then:
      - lambda: |-
          // 20 FPS high-refresh physics loop exclusively for active games
          if (id(display_brightness).current_values.is_on() && id(gui_page) == 3 && id(active_game) > 0) {
            id(disp1).update();
          }


sensor:
  - platform: homeassistant
    id: ha_media_duration
    entity_id: ${target_dur_sensor}

  - platform: homeassistant
    id: ha_media_position
    entity_id: ${target_pos_sensor}
    on_value:
      then:
        - lambda: |-
            id(music_pos_base) = x;
            id(music_pos_sync_time) = millis();
            id(disp1).update();

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: pocket_wifi_signal
    update_interval: 60s

  - platform: template
    name: "Battery Level"
    id: batt_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      uint8_t reg = 0xA4;
      uint8_t pct = 0;
      if (id(bus_internal).write_readv(0x34, &reg, 1, &pct, 1) == esphome::i2c::ERROR_OK) {
        if (pct <= 100) return pct;
      }
      return NAN;
    update_interval: 15s

  - platform: template
    name: "Battery Voltage"
    id: batt_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    lambda: |-
      uint8_t reg = 0x34;
      uint8_t buf[2] = {0};
      if (id(bus_internal).write_readv(0x34, &reg, 1, buf, 2) == esphome::i2c::ERROR_OK) {
        uint16_t mv = ((buf[0] & 0x3F) << 8) | buf[1];
        return mv / 1000.0f;
      }
      return NAN;
    update_interval: 15s

  - platform: motion
    motion_id: imu
    type: acceleration_x
    name: "Accel X"
    id: accel_x
  - platform: motion
    motion_id: imu
    type: acceleration_y
    name: "Accel Y"
    id: accel_y
  - platform: motion
    motion_id: imu
    type: acceleration_z
    name: "Accel Z"
    id: accel_z
  - platform: motion
    motion_id: imu
    type: roll
    name: "Roll"
    id: imu_roll
  - platform: motion
    motion_id: imu
    type: pitch
    name: "Pitch"
    id: imu_pitch

  - platform: qmi8658
    name: "IMU Temperature"
    id: imu_temp
    entity_category: diagnostic

  - platform: template
    name: "Dynamic Motion Delta"
    id: motion_mag
    unit_of_measurement: "g"
    accuracy_decimals: 3
    update_interval: 200ms
    lambda: |-
      if (id(is_locked)) return 0.0f;
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;
      if (isnan(x) || isnan(y) || isnan(z)) return NAN;

      static float grav_x = 0.0f;
      static float grav_y = 0.0f;
      static float grav_z = 1.0f;
      const float alpha = 0.08f;
      grav_x = (1.0f - alpha) * grav_x + alpha * x;
      grav_y = (1.0f - alpha) * grav_y + alpha * y;
      grav_z = (1.0f - alpha) * grav_z + alpha * z;

      float dx = x - grav_x;
      float dy = y - grav_y;
      float dz = z - grav_z;
      return sqrtf(dx*dx + dy*dy + dz*dz);


binary_sensor:
  - platform: template
    name: "Battery Charging"
    id: batt_charging
    device_class: battery_charging
    entity_category: diagnostic

  - platform: template
    name: "USB Power Connected"
    id: usb_connected
    device_class: power
    entity_category: diagnostic

  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    name: "Boot Button"
    id: boot_button
    on_press:
      then:
        - lambda: |-
            id(boot_hold_triggered) = false;
            if (id(is_locked)) return;
            if (!id(display_brightness).current_values.is_on()) {
              if (id(sleep_start_time) > 0 && (millis() - id(sleep_start_time) >= 30000)) {
                id(apply_default_start_page).execute();
              }
              id(sleep_start_time) = 0;
            }
        - if:
            condition:
              lambda: 'return !id(is_locked);'
            then:
              - script.stop: screen_sleep_timer
              - light.turn_on: display_brightness
              - script.execute: boot_button_hold_timer
    on_release:
      then:
        - script.stop: boot_button_hold_timer
    on_click:
      - min_length: 50ms
        max_length: 990ms
        then:
          - if:
              condition:
                lambda: 'return !id(is_locked) && !id(boot_hold_triggered);'
              then:
                - lambda: |-
                    static uint32_t last_btn_click = 0;
                    uint32_t now = millis();
                    if (now - last_btn_click < 300) return;
                    last_btn_click = now;
                - script.stop: screen_sleep_timer
                - if:
                    condition:
                      lambda: 'return id(active_game) > 0;'
                    then:
                      - lambda: 'id(game_btn_pressed) = true;'
                    else:
                      - if:
                          condition:
                            lambda: |-
                              return !id(va_status_text).empty() || id(va).is_running() || id(va_tts_received) || id(announcement_mixing_input).is_running() ;
                          then:
                            - script.execute: cancel_voice_assistant
                          else:
                            - if:
                                condition:
                                  media_player.is_playing: pocket_music_player
                                then:
                                  - media_player.pause: pocket_music_player
                                  - delay: 200ms
                            - script.execute: route_i2s_to_mic
                            - light.turn_on: display_brightness
                            - lambda: 'id(va_tts_received) = false;'
                            - voice_assistant.start:

  - platform: template
    name: "Pickup Detected"
    id: pickup_detected
    device_class: motion
    lambda: |-
      float dyn = id(motion_mag).state;
      if (isnan(dyn)) return false;

      const float thresh = 0.16f; // Responsive pickup detection
      const uint32_t active_ms = 5000;
      static uint32_t last_active_time = 0;
      static bool is_active = false;
      uint32_t now_ms = millis();

      if (dyn > thresh) {
        is_active = true;
        last_active_time = now_ms;
      } else if (is_active) {
        if (now_ms - last_active_time >= active_ms) {
          is_active = false;
        }
      }
      return is_active;
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                if (id(is_locked)) return false;
                std::string mode = std::string(id(pickup_wake_mode).current_option().c_str());
                if (mode == "Disabled") return false;
                if (mode == "Docked Only" && !id(usb_connected).state) return false;
                return true;
            then:
              - if:
                  condition:
                    lambda: 'return id(display_power_state) != 0 || !id(display_brightness).current_values.is_on();'
                  then:
                    - script.execute: wake_to_active_state
                  else:
                    - script.execute: screen_sleep_timer
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(display_power_state) == 0;'
            then:
              - script.execute: screen_sleep_timer


script:
  - id: pause_all_music
    mode: restart
    then:
      - lambda: |-
          bool local_active = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool remote_active = (!id(active_speaker_entity).empty() && (id(active_speaker_entity) != "${local_player_id}") && (id(ha_target_state).state == "playing"));
          if (local_active || remote_active) {
            id(va_resume_music_after) = true;
          }
          ESP_LOGI("audio", "pause_all_music: local=%d, remote=%d -> va_resume_music_after=%d", local_active, remote_active, id(va_resume_music_after));
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - media_player.pause: pocket_music_player
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - if:
                condition:
                  lambda: 'return !id(active_speaker_entity).empty();'
                then:
                  - homeassistant.action:
                      action: media_player.media_pause
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'

  - id: resume_music_after_va
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - lambda: |-
                id(va_resume_music_after) = false;
                ESP_LOGI("audio", "resume_music_after_va: restoring playback for %s", id(active_speaker_entity).c_str());
            - if:
                condition:
                  lambda: 'return !id(active_speaker_entity).empty() && (id(active_speaker_entity) != "${local_player_id}");'
                then:
                  - homeassistant.action:
                      action: media_player.media_play
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'
                  - audio_dac.mute_on: es8311_dac
                  - script.execute: route_i2s_to_mic
                else:
                  - script.execute: route_i2s_to_spk
                  - audio_dac.mute_off: es8311_dac
                  - switch.turn_on: speaker_enable
                  - mixer_speaker.apply_ducking:
                      id: media_mixing_input
                      decibel_reduction: 10
                      duration: 0.5s
                  - mixer_speaker.apply_ducking:
                      id: announcement_mixing_input
                      decibel_reduction: 50
                      duration: 0.1s
                  - if:
                      condition:
                        lambda: 'return !id(active_speaker_entity).empty();'
                      then:
                        - homeassistant.action:
                            action: media_player.media_play
                            data:
                              entity_id: !lambda 'return id(active_speaker_entity).c_str();'
                  - media_player.play: pocket_music_player
          else:
            - audio_dac.mute_on: es8311_dac
            - script.execute: route_i2s_to_mic
  - id: fetch_remote_art_debounced
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: |-
              return (id(active_speaker_entity) != "${local_player_id}") &&
                     !id(ha_target_art_url).state.empty() &&
                     (id(ha_target_art_url).state != "none") &&
                     (id(ha_target_art_url).state != "unknown") &&
                     (id(ha_target_art_url).state != "unavailable") &&
                     (id(ha_target_art_url).state != id(current_loaded_art_url));
          then:
            - online_image.set_url:
                id: remote_album_art
                url: !lambda 'return id(ha_target_art_url).state;'

  - id: throttled_disp_update
    mode: restart
    then:
      - delay: 35ms
      - if:
          condition:
            lambda: |-
              static uint32_t last_throttled_draw = 0;
              uint32_t now = millis();
              if (now - last_throttled_draw < 200) return false;
              if (id(display_power_state) == 0 && id(gui_page) == 2) {
                last_throttled_draw = now;
                return true;
              }
              return false;
          then:
            - component.update: disp1

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          std::string p = std::string(id(theme_palette_select).current_option().c_str());
          if (p == "Pink & Gray") {
            id(theme_primary) = Color(168, 120, 132);  // Muted Ash Pink #A87884 (faint, gray undertones)
            id(theme_secondary) = Color(192, 192, 192);// Brushed Silver / Gray #C0C0C0
          } else if (p == "Green & Gold") {
            id(theme_primary) = Color(66, 116, 83);    // Heritage Sage Green #427453
            id(theme_secondary) = Color(197, 155, 39); // Chrono Mustard Gold #C59B27
          } else if (p == "Blue & Gold" || p == "Default Classic") {
            id(theme_primary) = Color(69, 110, 138);   // #456E8A Steel Cyan
            id(theme_secondary) = Color(197, 155, 39); // #C59B27 Vintage Gold
          } else {
            // Steel & Silver (Default for New Installs): Soft Steel Ice Blue + Brushed Silver
            id(theme_primary) = Color(107, 142, 158);  // Soft Steel Ice Blue #6B8E9E
            id(theme_secondary) = Color(192, 192, 192);// Brushed Silver #C0C0C0
          }
          if (id(display_power_state) == 0) id(disp1).update();

  - id: rebuild_active_deck
    mode: restart
    then:
      - lambda: |-
          struct AppEntry {
            int page_id;
            float rank;
            bool enabled;
          };

          AppEntry pool[7] = {
            {0, id(app_order_clock).state, id(show_clock_switch).state},
            {2, id(app_order_music).state, id(show_music_switch).state},
            {3, id(app_order_games).state, id(show_games_switch).state},
            {5, id(app_order_weather).state, id(show_weather_switch).state},
            {7, id(app_order_remote).state, id(show_remote_switch).state},
            {8, id(app_order_stuff).state, id(show_stuff_switch).state},
            {4, id(app_order_system).state, id(show_system_switch).state}
          };

          // Stable bubble sort by user-configured position rank (1..10)
          for (int i = 0; i < 6; i++) {
            for (int j = 0; j < 6 - i; j++) {
              if (pool[j].rank > pool[j + 1].rank) {
                AppEntry tmp = pool[j];
                pool[j] = pool[j + 1];
                pool[j + 1] = tmp;
              }
            }
          }

          int count = 0;
          for (int i = 0; i < 7; i++) {
            if (pool[i].enabled) {
              if (count == 0) id(deck_slot_0) = pool[i].page_id;
              else if (count == 1) id(deck_slot_1) = pool[i].page_id;
              else if (count == 2) id(deck_slot_2) = pool[i].page_id;
              else if (count == 3) id(deck_slot_3) = pool[i].page_id;
              else if (count == 4) id(deck_slot_4) = pool[i].page_id;
              else if (count == 5) id(deck_slot_5) = pool[i].page_id;
              else if (count == 6) id(deck_slot_6) = pool[i].page_id;
              count++;
            }
          }

          if (count == 0) {
            id(deck_slot_0) = 0;
            count = 1;
          }
          id(active_deck_size) = count;

          auto get_slot = [](int idx) -> int {
            if (idx == 0) return id(deck_slot_0);
            if (idx == 1) return id(deck_slot_1);
            if (idx == 2) return id(deck_slot_2);
            if (idx == 3) return id(deck_slot_3);
            if (idx == 4) return id(deck_slot_4);
            if (idx == 5) return id(deck_slot_5);
            if (idx == 6) return id(deck_slot_6);
            if (idx == 7) return id(deck_slot_7);
            if (idx == 8) return id(deck_slot_8);
            return 0;
          };

          // Preserve active page if still enabled, else snap to first slot
          bool found = false;
          for (int i = 0; i < count; i++) {
            if (get_slot(i) == id(gui_page)) {
              found = true;
              id(current_deck_index) = i;
              break;
            }
          }
          if (!found) {
            id(current_deck_index) = 0;
            id(gui_page) = id(deck_slot_0);
            id(disp1).update();
          }
  - id: sync_display_brightness
    mode: restart
    then:
      - lambda: |-
          auto parse_bri = [](const std::string& opt) -> float {
            if (opt == "60%") return 0.60f;
            if (opt == "70%") return 0.70f;
            if (opt == "80%") return 0.80f;
            if (opt == "90%") return 0.90f;
            if (opt == "100%") return 1.00f;
            return 0.90f;
          };

          float b_target = 0.90f;
          std::string mode = std::string(id(auto_brightness_mode).current_option().c_str());

          if (mode == "Sun Synchronized") {
            std::string sun = id(ha_sun_state).state;
            bool is_night = (sun == "below_horizon");
            std::string opt = is_night ? std::string(id(night_brightness_preset).current_option().c_str())
                                       : std::string(id(day_brightness_preset).current_option().c_str());
            b_target = parse_bri(opt);
          } else if (mode == "Time Schedule") {
            auto now = id(ha_time).now();
            int day_h = (int)id(day_start_hour).state;
            int night_h = (int)id(night_start_hour).state;
            bool is_day = true;
            if (now.is_valid()) {
              if (day_h < night_h) {
                is_day = (now.hour >= day_h && now.hour < night_h);
              } else {
                is_day = (now.hour >= day_h || now.hour < night_h);
              }
            }
            std::string opt = is_day ? std::string(id(day_brightness_preset).current_option().c_str())
                                     : std::string(id(night_brightness_preset).current_option().c_str());
            b_target = parse_bri(opt);
          } else {
            std::string opt = std::string(id(display_brightness_preset).current_option().c_str());
            b_target = parse_bri(opt);
          }

          // CENTRAL POWER ARBITRATION INVARIANT:
          if (id(display_power_state) == 0) { // ACTIVE
            id(display_brightness).turn_on().set_brightness(b_target).perform();
          } else if (id(display_power_state) == 1) { // SCREENSAVER
            id(display_brightness).turn_on().set_brightness(0.60f).perform(); // Screensaver locked at 60%
          }

  - id: apply_default_start_page
    then:
      - lambda: |-
          std::string def_app = std::string(id(default_start_app).current_option().c_str());
          int init_p = 0;
          if (def_app == "Stopwatch") init_p = 1;
          else if (def_app == "Music") init_p = 2;
          else if (def_app == "Games") init_p = 3;
          else if (def_app == "System") init_p = 4;
          else if (def_app == "Sky & Weather" || def_app == "Sky and Weather") init_p = 5;
          else if (def_app == "Timer & Alarm" || def_app == "Timer and Alarm") init_p = 6;
          else if (def_app == "Remote" || def_app == "TV Remote") init_p = 7;
          else if (def_app == "Stuff") init_p = 8;

          auto is_app_enabled = [](int p) -> bool {
            if (p == 0) return id(show_clock_switch).state;
            if (p == 1) return id(show_stopwatch_switch).state;
            if (p == 2) return id(show_music_switch).state;
            if (p == 3) return id(show_games_switch).state;
            if (p == 4) return id(show_system_switch).state;
            if (p == 5) return id(show_weather_switch).state;
            if (p == 6) return id(show_timer_switch).state;
            if (p == 7) return id(show_remote_switch).state;
            if (p == 8) return id(show_stuff_switch).state;
            return false;
          };

          if (!is_app_enabled(init_p)) {
            for (int p = 0; p < 8; p++) {
              if (is_app_enabled(p)) { init_p = p; break; }
            }
          }
          id(gui_page) = init_p;

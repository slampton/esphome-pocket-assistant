                          id(selected_category_mode) = "album_tracks";
                          id(selected_category_title) = s_name;
                          id(music_browse_page) = 1;
                          id(fetch_music_browse).execute();
                        }
                      } else {
                        id(play_music_slot).execute(slot_num);
                      }
                    }
                  }
                  return;
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Level 2 Categories
                if (is_back_button(touch)) {
                  if (now_item - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_item;
                    if (id(selected_category_mode) == "album_tracks" || id(selected_category_mode) == "podcast_episodes") {
                      id(selected_category_mode) = id(drilldown_parent_mode).empty() ? "album" : id(drilldown_parent_mode);
                      id(selected_category_title) = (id(selected_category_mode) == "podcast") ? "PODCASTS" : ((id(selected_category_mode) == "artist_albums") ? id(drilldown_artist_name) : "ALBUMS");
                      id(music_browse_page) = std::max(1, id(drilldown_album_page));
                      id(fetch_music_browse).execute();
                    } else if (id(selected_category_mode) == "artist_albums") {
                      id(selected_category_mode) = "artist";
                      id(selected_category_title) = "ARTISTS";
                      id(music_browse_page) = std::max(1, id(drilldown_artist_page));
                      id(fetch_music_browse).execute();
                    } else {
                      id(drilldown_artist_page) = 1;
                      id(drilldown_album_page) = 1;
                      // Preserve active music_category_page scroll position across category visits
                      id(menu_scroll_active) = false;
                      id(menu_scroll_step) = 0;
                      id(music_overlay_mode) = 2; // Return to Library Categories Submenu
                    }
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 4) {
                // ----------------------------------------------------
                // LEVEL 4: SPEAKER ACTION SHEET TOUCH HANDLERS
                // ----------------------------------------------------
                static uint32_t last_sheet_tap = 0;
                uint32_t now_sheet = millis();
                bool is_current = (id(target_speaker_id) == id(active_speaker_entity));
                if (!is_current) {
                  // Pill 1: TRANSFER QUEUE (y: 100..159, x: 85..370, center y = 130)
                  if (touch.y >= 100 && touch.y <= 159 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_transfer_to_target).execute();
                    }
                    return;
                  // Pill 2: CONTROL ONLY (y: 160..217, x: 85..370, center y = 188)
                  } else if (touch.y >= 160 && touch.y <= 217 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_control_target).execute();
                    }
                    return;
                  // Pill 3: JOIN AUDIO (y: 218..275, x: 85..370, center y = 246)
                  } else if (touch.y >= 218 && touch.y <= 275 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_join_target).execute();
                    }
                    return;
                  // Pill 4: UNJOIN / DETACH (y: 276..350, x: 85..370, center y = 304)
                  } else if (touch.y >= 276 && touch.y <= 350 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_unjoin_target).execute();
                    }
                    return;
                  }
                } else {
                  bool is_remote = (id(target_speaker_id) != "${local_player_id}");
                  if (is_remote) {
                    // Pill 1: TRANSFER TO LOCAL (y: 110..170, x: 85..370, center y = 142)
                    if (touch.y >= 110 && touch.y <= 170 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(target_speaker_id) = "${local_player_id}";
                        id(target_speaker_name) = "${friendly_name}";
                        id(speaker_transfer_to_target).execute();
                      }
                      return;
                    // Pill 2: UNJOIN AUDIO (y: 171..228, x: 85..370, center y = 200)
                    } else if (touch.y >= 171 && touch.y <= 228 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(speaker_unjoin_target).execute();
                      }
                      return;
                    // Pill 3: STOP PLAYBACK (y: 229..295, x: 85..370, center y = 258)
                    } else if (touch.y >= 229 && touch.y <= 295 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(stop_ha_music).execute();
                      }
                      return;
                    }
                  } else {
                    // Pill 1: UNJOIN AUDIO (y: 120..194, x: 85..370, center y = 160)
                    if (touch.y >= 120 && touch.y <= 194 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(speaker_unjoin_target).execute();
                      }
                      return;
                    // Pill 2: STOP PLAYBACK (y: 195..275, x: 85..370, center y = 230)
                    } else if (touch.y >= 195 && touch.y <= 275 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(stop_ha_music).execute();
                      }
                      return;
                    }
                  }
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Speakers Browser
                if (is_back_button(touch)) {
                  if (now_sheet - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_sheet;
                    id(music_overlay_mode) = 1;
                    id(disp1).update();
                  }
                  return;
                }
              }
            // Page 3: Games Menu Launcher or Active Game Touch Action
            } else if (id(gui_page) == 3) {
              if (id(active_game) == 0) {
                if (id(menu_scroll_active)) {
                  ESP_LOGI("touch", "Page 3 Tap dropped: carousel animating (step=%d)", id(menu_scroll_step));
                  return;
                }

                // 1. Right-Flank Navigation Chevrons: Edge tap for Carousel (x >= 375, y: 70..365)
                if (is_right_chevron_zone(touch)) {
                  static uint32_t last_game_scroll = 0;
                  uint32_t now_gs = millis();
                  if (now_gs - last_game_scroll > TOUCH_DEBOUNCE_SCROLL) {
                    last_game_scroll = now_gs;
                    int dir = (touch.y < 220) ? -1 : 1;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = dir;
                    id(menu_scroll_target_page) = step_wrap(id(game_carousel_idx), dir, 5);
                    id(menu_scroll_step) = 0;
                    ESP_LOGI("touch", "Page 3 Game Chevron: x=%d y=%d dir=%d target=%d", touch.x, touch.y, dir, id(menu_scroll_target_page));
                    id(menu_scroll_transition).execute();
                  }
                  return;
                }

                // 2. Left flank grip discard
                if (touch.x < 75) {
                  return;
                }

                // 3. Center Card & PLAY Button Tap: Launch Selected Game (x: 75..374, y: 140..390)
                if (touch.x >= 75 && touch.x < 375 && touch.y >= 140 && touch.y <= 390) {
                  static uint32_t last_game_launch_tap = 0;
                  uint32_t now_gl = millis();
                  if (now_gl - last_game_launch_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_game_launch_tap = now_gl;
                    id(active_game) = id(game_carousel_idx) + 1; // 0->1 (Marbles), 1->2 (Archery), 2->3 (Breakout), 3->4 (Chomp), 4->5 (Asteroids)
                    ESP_LOGI("touch", "Page 3 Launch Game: x=%d y=%d game=%d", touch.x, touch.y, id(active_game));
                    if (id(active_game) > 0) {
                      // Pause background music, mute DAC, and power down amp for dedicated 20 FPS game performance
                      if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
                        auto call = id(pocket_music_player).make_call();
                        call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_PAUSE);
                        call.perform();
                        id(toggle_ha_music).execute();
                        id(es8311_dac).set_mute_on();
                        id(speaker_enable).turn_off();
                      }
                    }
                    id(disp1).update();
                  }
                  return;
                }
              } else {
                // Active game touch action (paced cleanly by the 20 FPS 50ms game loop)
                id(marble_touch_x) = touch.x;
                id(marble_touch_y) = touch.y;
                id(game_btn_pressed) = true;
              }
            // Page 4: System Settings & Diagnostics
            } else if (id(gui_page) == 4) {
              static uint32_t last_sys_action_tap = 0;
              uint32_t now_sys = millis();

              if (id(system_menu_mode) == 0) {
                if (id(menu_scroll_active)) return;

                // Right Flank Navigation (▲ Up on Page 2, ▼ Down on Page 1)
                if (is_right_chevron_zone(touch)) {
                  static uint32_t last_dash_scroll_tap = 0;
                  uint32_t now_s = millis();
                  if (now_s - last_dash_scroll_tap > TOUCH_DEBOUNCE_SCROLL) {
                    last_dash_scroll_tap = now_s;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = (id(system_dashboard_page) == 1) ? 1 : -1;
                    id(menu_scroll_target_page) = (id(system_dashboard_page) == 1) ? 2 : 1;
                    id(menu_scroll_step) = 0;
                    id(menu_scroll_transition).execute();
                  }
                  return;
                }
                if (touch.x < 75 && touch.y >= 70 && touch.y <= 365) return;

                if (now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                  // Tap Update Ready badge at y: 65..94 -> open Software Update screen
                  if (touch.y >= 65 && touch.y <= 94 && touch.x >= 100 && touch.x <= 366 &&
                      pocket_ui::is_newer_semver(id(ha_firmware_latest_version).state, "${version}")) {
                    last_sys_action_tap = now_sys;
                    id(system_menu_mode) = 5;
                    id(disp1).update();
                    return;
                  }

                  // Central 4 Category Slots (y = 132, 190, 248, 306)
                  if (touch.x >= 100 && touch.x <= 366) {
                    int slot = -1;
                    if (touch.y >= 105 && touch.y < 161) slot = 0;
                    else if (touch.y >= 161 && touch.y < 219) slot = 1;
                    else if (touch.y >= 219 && touch.y < 277) slot = 2;
                    else if (touch.y >= 277 && touch.y <= 340) slot = 3;

                    if (slot >= 0) {
                      last_sys_action_tap = now_sys;
                      int item_idx = (id(system_dashboard_page) == 1) ? slot : (slot + 4);
                      id(menu_scroll_active) = false;
                      if (item_idx == 0) {
                        id(system_menu_mode) = 2; // Display
                        id(display_menu_page) = 1;
                      } else if (item_idx == 1) {
                        id(system_menu_mode) = 1; // Sleep & Wake
                        id(sleep_menu_page) = 1;
                      } else if (item_idx == 2) {
                        id(system_menu_mode) = 7; // Sound
                      } else if (item_idx == 3) {
                        id(system_menu_mode) = 11; // Voice
                      } else if (item_idx == 4) {
                        id(system_menu_mode) = 9; // Music
                        id(audio_menu_parent_page) = 4;
                      } else if (item_idx == 5) {
                        id(system_menu_mode) = 10; // App Deck
                        id(deck_menu_page) = 1;
                      } else if (item_idx == 6) {
                        id(system_menu_mode) = 8; // Info
                      } else if (item_idx == 7) {
                        id(system_menu_mode) = 3; // Actions
                      }
                      id(disp1).update();
                      return;
                    }
                  }
                }
              } else if (id(system_menu_mode) == 1) {
                // Mode 1: Sleep & Wake Submenu (9 Items across 2 Pages, slot_idx + 4 on Page 2)
                if (id(menu_scroll_active)) return;
                if (is_right_chevron_zone(touch)) {
                  static uint32_t last_scroll_tap = 0;
                  uint32_t now_s = millis();
                  if (now_s - last_scroll_tap > TOUCH_DEBOUNCE_SCROLL) {
                    last_scroll_tap = now_s;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = (id(sleep_menu_page) == 1) ? 1 : -1;
                    id(menu_scroll_target_page) = (id(sleep_menu_page) == 1) ? 2 : 1;
                    id(menu_scroll_step) = 0;
                    id(menu_scroll_transition).execute();
                  }
                  return;
                }
                if (touch.x < 75 && touch.y >= 70 && touch.y <= 375) return;

                int slot_idx = get_5slot_index(touch, 88, 371);
                if (slot_idx >= 0) {
                  if (now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sys_action_tap = now_sys;
                    int idx = (id(sleep_menu_page) == 1) ? slot_idx : (slot_idx + 4);
                    if (idx == 0) {
                      auto call = id(pickup_wake_mode).make_call();
                      call.set_option(cycle_option(id(pickup_wake_mode).current_option(), {"Always On", "Docked Only", "Disabled"}));
                      call.perform();
                    } else if (idx == 1) {
                      auto call = id(tap_wake_mode).make_call();
                      call.set_option(cycle_option(id(tap_wake_mode).current_option(), {"Always On", "Docked Only", "Disabled"}));
                      call.perform();
                    } else if (idx == 2) {
                      auto call = id(display_off_timeout).make_call();
                      call.set_option(cycle_option(id(display_off_timeout).current_option(), {"10s", "15s", "30s", "1 min", "2 min", "Never"}));
                      call.perform();
                    } else if (idx == 3) {
                      id(docked_screensaver_switch).toggle();
                    } else if (idx == 4) {
                      auto call = id(screensaver_style_select).make_call();
                      call.set_option(cycle_option(id(screensaver_style_select).current_option(), {"Ambient Clock", "Aurora Borealis", "Starfield", "Matrix Rain", "Fireworks", "Screen Off"}));
                      call.perform();
                    } else if (idx == 5) {
                      auto call = id(screensaver_docked_timeout).make_call();
                      call.set_option(cycle_option(id(screensaver_docked_timeout).current_option(), {"10s", "15s", "30s", "1 min", "5 min", "Never"}));
                      call.perform();
                    } else if (idx == 6) {
                      auto call = id(hibernate_timeout_mode).make_call();
                      call.set_option(cycle_option(id(hibernate_timeout_mode).current_option(), {"5 min", "10 min", "15 min", "30 min", "Disabled"}));
                      call.perform();
                    } else if (idx == 7) {
                      id(instant_crown_hibernate_switch).toggle();
                    } else if (idx == 8) {
                      id(prevent_deep_sleep_switch).toggle();
                    }
                    id(disp1).update();
                  }
                  return;
                }
                if (is_back_button(touch)) {
                  if (now_sys - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_sys;
                    id(system_menu_mode) = 0;
                    id(sleep_menu_page) = 1;
                    id(menu_scroll_active) = false;
                    id(menu_scroll_step) = 0;
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(system_menu_mode) == 2) {
                // Mode 2: Display Submenu (9 Items across 2 Pages, slot_idx + 4 on Page 2)
                if (id(menu_scroll_active)) return;
                if (is_right_chevron_zone(touch)) {
                  static uint32_t last_disp_scroll_tap = 0;
                  uint32_t now_s = millis();
                  if (now_s - last_disp_scroll_tap > TOUCH_DEBOUNCE_SCROLL) {
                    last_disp_scroll_tap = now_s;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = (id(display_menu_page) == 1) ? 1 : -1;
                    id(menu_scroll_target_page) = (id(display_menu_page) == 1) ? 2 : 1;
                    id(menu_scroll_step) = 0;
                    id(menu_scroll_transition).execute();
                  }
                  return;
                }
                if (touch.x < 75 && touch.y >= 70 && touch.y <= 375) return;

                int slot_idx = get_5slot_index(touch, 88, 371);
                if (slot_idx >= 0) {
                  if (now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sys_action_tap = now_sys;
                    int item_idx = (id(display_menu_page) == 1) ? slot_idx : (slot_idx + 4);
                    std::string ab = id(auto_brightness_mode).current_option();
                    if (item_idx == 0) {
                      id(clock_face_digital) = !id(clock_face_digital);
                      auto call = id(clock_face_style).make_call();
                      call.set_option(id(clock_face_digital) ? "Modern Digital (Bold)" : "Modern Roman (Analog)");
                      call.perform();
                    } else if (item_idx == 1) {
                      id(is_24h_format) = !id(is_24h_format);
                      auto call = id(time_format_select).make_call();
                      call.set_option(id(is_24h_format) ? "24-Hour" : "12-Hour (AM/PM)");
                      call.perform();
                    } else if (item_idx == 2) {
                      auto call = id(theme_palette_select).make_call();
                      call.set_option(cycle_option(id(theme_palette_select).current_option(), {"Steel & Silver", "Pink & Gray", "Blue & Gold", "Green & Gold"}));
                      call.perform();
                    } else if (item_idx == 3) {
                      auto call = id(page_counter_mode).make_call();
                      call.set_option(cycle_option(id(page_counter_mode).current_option(), {"Always", "Never"}));
                      call.perform();
                    } else if (item_idx == 4) {
                      std::string next_m = cycle_option(ab, {"Disabled", "Sun Synchronized", "Time Schedule"});
                      auto call = id(auto_brightness_mode).make_call();
                      call.set_option(next_m);
                      call.perform();
                      id(auto_brightness_mode).publish_state(next_m);
                      id(sync_display_brightness).execute();
                    } else if (item_idx == 5) {
                      if (ab == "Disabled") {
                        std::string next_b = cycle_option(id(display_brightness_preset).current_option(), {"60%", "70%", "80%", "90%", "100%"});
                        auto call = id(display_brightness_preset).make_call();
                        call.set_option(next_b);
                        call.perform();
                        id(display_brightness_preset).publish_state(next_b);
                        id(sync_display_brightness).execute();
                      }
                    } else if (item_idx == 6) {
                      if (ab == "Time Schedule") {
                        int dh = (int)id(day_start_hour).state;
                        int nh = (int)id(night_start_hour).state;
                        int nxt_dh = 7, nxt_nh = 22;
                        if (dh == 7 && nh == 22) { nxt_dh = 6; nxt_nh = 23; }
                        else if (dh == 6 && nh == 23) { nxt_dh = 8; nxt_nh = 22; }
                        else if (dh == 8 && nh == 22) { nxt_dh = 7; nxt_nh = 21; }
                        id(day_start_hour).make_call().set_value((float)nxt_dh).perform();
                        id(night_start_hour).make_call().set_value((float)nxt_nh).perform();
                        id(sync_display_brightness).execute();
                      }
                    } else if (item_idx == 7) {
                      if (ab != "Disabled") {
                        std::string next_db = cycle_option(id(day_brightness_preset).current_option(), {"60%", "70%", "80%", "90%", "100%"});
                        auto call = id(day_brightness_preset).make_call();
                        call.set_option(next_db);
                        call.perform();
                        id(day_brightness_preset).publish_state(next_db);
                        id(sync_display_brightness).execute();
                      }
                    } else if (item_idx == 8) {
                      if (ab != "Disabled") {
                        std::string next_nb = cycle_option(id(night_brightness_preset).current_option(), {"60%", "70%", "80%", "90%", "100%"});
                        auto call = id(night_brightness_preset).make_call();
                        call.set_option(next_nb);
                        call.perform();
                        id(night_brightness_preset).publish_state(next_nb);
                        id(sync_display_brightness).execute();
                      }
                    }
                    id(disp1).update();
                  }
                  return;
                }
                if (is_back_button(touch)) {
                  if (now_sys - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_sys;
                    id(system_menu_mode) = 0;
                    id(display_menu_page) = 1;
                    id(menu_scroll_active) = false;
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(system_menu_mode) == 3) {
                // Mode 3: Actions Submenu (5 Items on 1 Page)
                int slot = get_5slot_index(touch, 88, 371);
                if (slot >= 0 && slot <= 4 && now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_sys_action_tap = now_sys;
                  if (slot == 0) {
                    id(trigger_screensaver_now).execute();
                    return;
                  } else if (slot == 1) {
                    id(start_hibernation_countdown).execute();
                    return;
                  } else if (slot == 2) {
                    id(system_menu_mode) = 5;
                    id(disp1).update();
                    return;
                  } else if (slot == 3) {
                    if (id(ble_ctrl).is_active()) {
                      id(ble_ctrl).disable();
                    } else {
                      id(ble_ctrl).enable();
                    }
                    id(disp1).update();
                    return;
                  } else if (slot == 4) {
                    id(system_menu_mode) = 4;
                    id(disp1).update();
                    return;
                  }
                }
                if (is_back_button(touch)) {
                  if (now_sys - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_sys;
                    id(system_menu_mode) = 0;
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(system_menu_mode) == 4) {
                // Mode 4: Restart Confirmation Dialog
                if (touch.y >= 195 && touch.y <= 265 && now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                  if (touch.x >= 90 && touch.x <= 225) {
                    last_sys_action_tap = now_sys;
                    id(system_menu_mode) = 3;
                    id(disp1).update();
                    return;
                  } else if (touch.x >= 240 && touch.x <= 375) {
                    last_sys_action_tap = now_sys;
                    id(restart_button).press();
                    return;
                  }
                }
              } else if (id(system_menu_mode) == 5) {
                // Mode 5: Software Update Screen
                if (touch.y >= 190 && touch.y <= 240 && touch.x >= 100 && touch.x <= 366) {
                  if (now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_sys_action_tap = now_sys;
                    bool has_update = pocket_ui::is_newer_semver(id(ha_firmware_latest_version).state, "${version}");
                    if (has_update) {
                      id(system_menu_mode) = 6;
                      id(disp1).update();
                    } else if (id(update_check_state) == 0) {
                      id(update_check_state) = 1;
                      id(update_check_timer) = millis();
                      id(check_firmware_update).execute();
                      id(disp1).update();
                    }
                  }
                  return;
                } else if (is_back_button(touch)) {
                  if (now_sys - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_sys;
                    id(update_check_state) = 0;
                    id(system_menu_mode) = 0;
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(system_menu_mode) == 6) {
                // Mode 6: Update Confirmation Dialog
                if (touch.y >= 210 && touch.y <= 270 && now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                  if (touch.x >= 90 && touch.x <= 225) {
                    last_sys_action_tap = now_sys;
                    id(system_menu_mode) = 5;
                    id(disp1).update();
                    return;
                  } else if (touch.x >= 240 && touch.x <= 375) {
                    last_sys_action_tap = now_sys;
                    id(trigger_firmware_update).execute();
                    return;

                        id(remote_action_feedback) = "";
                        id(remote_subpage) = 0;
                        id(disp1).update();
                      }
                      return;
                    }
                    // 2B. Per-Device Override Power Button on Secondary Devices (row > 0, centered at 356, outer edges 338..374)
                    if (row > 0 && touch.x >= 332 && touch.x <= 384) {
                      if (now_rem - last_remote_btn_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_remote_btn_tap = now_rem;
                        id(remote_send_key).execute(9, s_idx);
                        id(disp1).update();
                      }
                      return;
                    }

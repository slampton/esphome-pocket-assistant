            - audio_dac.mute_on: es8311_dac
            - switch.turn_off: speaker_enable
            - script.execute: route_i2s_to_mic

  - id: toggle_voice_assistant
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va_active) || !id(va_status_text).empty();'
          then:
            - script.execute: cancel_voice_assistant
          else:
            - lambda: |-
                // If waking from screen-off or standby, honor Assist Screen Wake preference
                if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
                  if (id(va_wake_screen_switch).state) {
                    id(wake_to_active_state).execute();
                  }
                } else {
                  id(screen_sleep_timer).execute();
                }
            - script.execute: pause_all_music
            - if:
                condition:
                  lambda: 'return id(va_resume_music_after);'
                then:
                  - delay: 150ms
            - script.execute: route_i2s_to_mic
            - lambda: 'id(va_tts_received) = false;'
            - voice_assistant.start:

  - id: cancel_voice_assistant
    mode: restart
    then:
      - script.stop: va_tts_drain_and_finish
      - audio_dac.mute_on: es8311_dac
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 50
          duration: 0.1s
      - speaker.stop: announcement_mixing_input
      - voice_assistant.stop:
      - lambda: |-
          esphome::voice_assistant::abort_voice_assistant(id(va));
          id(va_was_cancelled) = true;
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_vad_active) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
      - delay: 15ms
      - component.update: disp1
      - delay: 160ms
      - script.execute: resume_music_after_va
      - if:
          condition:
            binary_sensor.is_off: pickup_detected
          then:
            - script.execute: screen_sleep_timer
  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: update_pocket_assistant
      - lambda: |-
          id(system_menu_mode) = 5;
          id(disp1).update();

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: update_pocket_assistant


  - id: menu_scroll_transition
    mode: restart
    then:
      - lambda: |-
          // Frame 1: Render 50% eased midpoint frame (SHARED_SCROLL_EASE_*[2])
          id(menu_scroll_step) = 2;
          id(disp1).update();
      - delay: 12ms
      - lambda: |-
          // Frame 2: Commit target page, release touch lock, and render final settled frame
          id(menu_scroll_active) = false;
          if (id(gui_page) == 4 && id(system_menu_mode) == 1) {
            id(sleep_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 4 && id(system_menu_mode) == 2) {
            id(display_menu_page) = id(menu_scroll_target_page);

          } else if (id(gui_page) == 4 && id(system_menu_mode) == 10) {
            id(deck_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 4 && id(system_menu_mode) == 0) {
            id(system_dashboard_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 2 && id(music_overlay_mode) == 2) {
            id(music_category_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 3 && id(active_game) == 0) {
            id(game_carousel_idx) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 8 && id(stuff_subpage) == 0) {
            id(stuff_menu_page) = id(menu_scroll_target_page);
          }
          id(menu_scroll_step) = 0;
          id(disp1).update();

  # ==============================================================================
  # 📺 UNIVERSAL TV & MEDIA REMOTE COMMAND SCRIPTS (MULTI-DEVICE & MULTI-PROTOCOL)
  # ==============================================================================
  - id: remote_send_key
    mode: restart
    parameters:
      key_idx: int
      target_slot: int
    then:
      - delay: 0ms
      - lambda: |-
          const std::string ents[4] = {
            "${tv_remote_entity}", "${tv_remote_entity_2}",
            "${tv_remote_entity_3}", "${tv_remote_entity_4}"
          };
          const std::string names[4] = {
            id(remote_slot_0_name), id(remote_slot_1_name),
            id(remote_slot_2_name), id(remote_slot_3_name)
          };
          const pocket_ui::RemoteCustomCmds custom_cmds = {
            "${remote_cmd_up}", "${remote_cmd_down}", "${remote_cmd_left}", "${remote_cmd_right}",
            "${remote_cmd_select}", "${remote_cmd_back}", "${remote_cmd_home}",
            "${remote_cmd_vol_up}", "${remote_cmd_vol_down}", "${remote_cmd_power}"
          };
          pocket_ui::resolve_remote_dispatch(
              key_idx, target_slot, id(active_remote_slot), id(remote_profile_user_set),
              id(tv_remote_profile).current_option(), "${tv_remote_profile}",
              ents, names, custom_cmds,
              id(remote_target_ent), id(remote_target_prof),
              id(remote_target_cmd), id(remote_action_feedback));
          id(remote_feedback_timer) = millis();
      - if:
          condition:
            lambda: |-
              bool is_mp = (id(remote_target_ent).rfind("media_player.", 0) == 0) ||
                           (id(remote_target_prof) == "Denon / Marantz AVR") ||
                           (id(remote_target_prof) == "LG webOS");
              return is_mp && (key_idx >= 7 && key_idx <= 9);
          then:
            - if:
                condition:
                  lambda: 'return key_idx == 7;'
                then:
                  - homeassistant.action:
                      action: media_player.volume_up
                      data:
                        entity_id: !lambda 'return id(remote_target_ent);'
                else:
                  - if:
                      condition:
                        lambda: 'return key_idx == 8;'
                      then:
                        - homeassistant.action:
                            action: media_player.volume_down
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
                      else:
                        - homeassistant.action:
                            action: media_player.toggle
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
          else:
            - if:
                condition:
                  lambda: 'return id(remote_target_prof) == "Denon / Marantz AVR";'
                then:
                  - homeassistant.action:
                      action: denonavr.get_command
                      data:
                        entity_id: !lambda 'return id(remote_target_ent);'
                        command: !lambda 'return id(remote_target_cmd);'
                else:
                  - if:
                      condition:
                        lambda: 'return id(remote_target_prof) == "LG webOS";'
                      then:
                        - homeassistant.action:
                            action: webostv.button
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
                              button: !lambda 'return id(remote_target_cmd);'
                      else:
                        - homeassistant.action:
                            action: remote.send_command
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
                              command: !lambda 'return id(remote_target_cmd);'

display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    spi_id: display_qspi
    bus_mode: quad
    data_rate: 80MHz
    reset_pin: GPIO1
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6
      offset_height: 0
    brightness: 200
    update_interval: 1s
    lambda: |-
      const int cx = 233;
      const int cy = 233;
      // ======================================================================
      // 🎨 Centralized Standard UI & Theme Color Tokens (LUTs & Primitives in ui_toolkit.h)
      // ======================================================================
      const Color C_WHITE = id(col_white);
      const Color C_BLACK = id(col_black);
      const Color C_SILVER = id(col_silver);
      const Color C_GRAY = id(col_gray);
      const Color C_DARK_GRAY = id(col_dark_gray);
      const Color C_PRIMARY = id(theme_primary);
      const Color C_SECONDARY = id(theme_secondary);
      const Color C_RED = id(col_red);
      const Color C_GREEN = id(col_green);
      const Color C_GOLD = id(col_gold);
      const Color C_CYAN = id(col_cyan);
      const Color C_ORANGE = id(col_orange);
      const Color C_SOLARIS_GOLD = id(col_solaris_gold);
      const Color C_ACCENT_CYAN = id(col_accent_cyan);

      // Thin Display Context Bindings -> Delegating to ui_toolkit.h
      auto draw_hero_button = [&](int x1, int x2, int y_mid, int r, Color border_c, Color bg_c, const char* label, Color text_c) {
        render_pill_button(it, x1, x2, y_mid, r, border_c, bg_c, label, text_c, id(font_btn_bold));
      };
      auto draw_right_flank_chevrons = [&](bool show_up, bool show_down, Color c = id(theme_secondary), bool with_bg = true) {
        if (!show_up && !show_down) return;
        if (with_bg) it.filled_rectangle(395, 140, 71, 160, id(col_bg));
        if (show_up) render_scroll_chevron(it, 415, 162, true, c, id(col_black), !with_bg);
        if (show_down) render_scroll_chevron(it, 415, 278, false, c, id(col_black), !with_bg);
      };
      auto draw_deck_chevrons = [&](Color chevron_col, bool with_shadow = true) {
        render_deck_chevrons(it, chevron_col, id(col_black), with_shadow);
      };
      auto fit_text_to_width = [&](const std::string &str, int max_w) -> std::string {
        return fit_text_to_width_font(str, max_w, id(font_small));
      };
      auto calculate_moon_phase = [&](double &out_cycle, int *out_illum = nullptr, std::string *out_label = nullptr) {
        auto now_m = id(ha_time).now();
        compute_synodic_moon_phase(now_m.is_valid(), now_m.is_valid() ? (int64_t)now_m.timestamp : 0LL, id(ha_moon_phase).state, out_cycle, out_illum, out_label);
      };
      auto draw_lunar_disc = [&](int moon_cx, int moon_cy, int moon_r, double cycle, bool with_tycho = true) {
        render_lunar_disc(it, moon_cx, moon_cy, moon_r, cycle, with_tycho);
      };

      // ==========================================
      // GLOBAL OVERLAY: OTA FIRMWARE UPDATE IN PROGRESS (Always renders even if screen was off)
      // ==========================================
      if (id(ota_in_progress)) {
        it.fill(id(col_bg));

        // Perimeter Progress Indicator Only (r = 220..228, Zero Outer Ring, Zero Static Dial Markers)
        int pct = id(ota_progress_pct);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        for (int i = 0; i <= pct; i++) {
          float rad = ((float)i / 100.0f) * 2.0f * 3.14159265f - 1.5707963f; // 12 o'clock top is -pi/2
          float c = cosf(rad);
          float s = sinf(rad);
          it.line(cx + (int)(220.0f * c), cy + (int)(220.0f * s), cx + (int)(228.0f * c), cy + (int)(228.0f * s), id(theme_secondary));
        }

        it.print(cx, cy - 60, id(font_date), id(theme_primary), TextAlign::CENTER, "FIRMWARE UPDATE");

        char prog_buf[32];
        snprintf(prog_buf, sizeof(prog_buf), "%d%%", pct);
        it.print(cx, cy + 8, id(font_time), id(col_white), TextAlign::CENTER, prog_buf);

        // Dynamic stage messaging
        const char* status_msg = "Preparing flash...";
        if (pct >= 99) {
          status_msg = "Rebooting device...";
        } else if (pct >= 85) {
          status_msg = "Verifying image...";
        } else if (pct >= 10) {
          status_msg = "Writing flash memory...";
        }
        it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, status_msg);
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: HIBERNATION SHUTDOWN (Zero Outer Rings, Minimalist Dark Canvas)
      // Top priority: Always render countdown & confirmation even if screen was previously asleep
      // ==========================================
      if (id(is_hibernating)) {
        it.fill(id(col_bg));

        if (id(hibernate_countdown_val) > 0) {
          it.print(cx, cy - 65, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");
          char c_buf[16];
          snprintf(c_buf, sizeof(c_buf), "%d", id(hibernate_countdown_val));
          it.print(cx, cy + 5, id(font_chrono_time), id(theme_secondary), TextAlign::CENTER, c_buf);
          it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, "Tap screen to stay awake");
        } else {
          it.print(cx, cy - 10, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");
          it.print(cx, cy + 30, id(font_small), id(col_slate), TextAlign::CENTER, "Shutting down...");
        }
        return;
      }

      if (!id(display_brightness).current_values.is_on() || id(display_power_state) == 2) {
        it.fill(id(col_bg));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: VOICE ASSISTANT TAKEOVER
      // Rendered above Docked Screensaver so VA sessions always display over standby animations
      // ==========================================
      if (id(va_active) || !id(va_status_text).empty()) {
        uint32_t now_ms = millis();
        bool is_speaking = id(va_tts_received);
        bool is_thinking = (!is_speaking && id(va_status_text) == "Thinking...");
        render_voice_assistant_overlay(
            it, cx, cy, now_ms, is_speaking, is_thinking, id(va_vad_active),
            id(va_visual_profile).current_option(), id(va_status_text),
            id(font_small), C_WHITE, C_DARK_GRAY, C_CYAN, id(col_light_blue),
             id(col_purple), id(col_magenta), C_SOLARIS_GOLD);
        return;
      }

      auto now = id(ha_time).now();

      // ==========================================
      // GLOBAL OVERLAY: ALARM / TIMER RINGING TAKEOVER
      // Rendered above Docked Screensaver & all pages without hijacking gui_page
      // ==========================================
      if (id(alarm_ringing) || id(timer_ringing)) {
        render_alert_ringing_overlay(
            it, cx, cy, millis(), id(alarm_ringing), id(alarm_ringing_idx),
            id(alarm1_recurrence), id(alarm2_recurrence), now, id(is_24h_format),
            id(font_time), id(font_date), id(font_small), id(font_micro),
            id(theme_primary), id(theme_secondary), id(col_bg), id(col_black),
            id(col_white), id(col_gray), id(col_red));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: DOCKED SCREENSAVER (Mode 1)
      // ==========================================
      if (id(display_power_state) == 1) {
        it.fill(id(col_bg));
        render_docked_screensaver(
            it, cx, cy, millis(), now, id(is_24h_format),
            id(screensaver_style_select).current_option(),
            id(font_time), id(font_small), id(col_slate), id(col_dark_gray));
        return;
      }

      float batt = id(batt_level).state;



      // ==========================================
      // PAGE 0: WATCH FACE (HIGH-CONTRAST MODERN DIAL — SECTION 16 OF ui_toolkit.h)
      // ==========================================
      if (id(gui_page) == 0) {
        render_clock_page(
            it, cx, cy, now, id(clock_face_digital), id(is_24h_format),
            batt, id(batt_charging).state,
            id(font_time), id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_white), id(col_slate), id(col_gray), id(col_dark_gray),
            id(col_red), id(col_gold), id(col_green));
      } else if (id(gui_page) == 2) {
        uint32_t now_p2_ms = millis();
        pocket_ui::last_page2_draw_ms() = now_p2_ms;
        if (id(music_overlay_mode) == 0) {
          bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
          bool local_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool is_playing = pocket_ui::is_music_playing_effective(
              is_remote, local_playing, id(ha_target_state).state, now_p2_ms);
          render_music_now_playing(
              it, cx, cy, now_p2_ms,
              id(music_fullscreen_art_mode).current_option().c_str(),
              id(music_overlay_style).current_option().c_str(),
              id(music_hud_active), is_remote, is_playing,
              id(album_art), id(remote_album_art),
              id(ha_target_art_url).state, id(current_loaded_art_url),
              id(active_speaker_name), "${friendly_name}",
              id(music_action_feedback), id(music_feedback_timer),
              id(active_playback_media_type),
              id(music_show_speaker_shortcut).state, id(music_show_library_shortcut).state,
              id(ha_media_duration).state, id(music_pos_base), id(music_pos_sync_time),
              id(track_title).state, id(track_artist).state, id(track_album).state,
              id(ha_track_title).state, id(ha_track_artist).state, id(ha_track_album).state,
              id(font_small), id(font_micro), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_black), id(col_white), id(col_gray), id(col_dark_gray));
        } else {
          render_music_menus(
              it, cx, id(music_overlay_mode),
              id(active_speaker_entity), id(active_speaker_name), "${local_player_id}",
              id(selected_category_mode), id(selected_category_title),
              id(music_category_page), id(music_browse_page), id(music_browse_total_pages),
              id(menu_scroll_active), id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
              id(slot_1_name), id(slot_1_id), id(slot_1_type), id(slot_1_active),
              id(slot_2_name), id(slot_2_id), id(slot_2_type), id(slot_2_active),
              id(slot_3_name), id(slot_3_id), id(slot_3_type), id(slot_3_active),
              id(slot_4_name), id(slot_4_id), id(slot_4_type), id(slot_4_active),
              id(slot_5_name), id(slot_5_id), id(slot_5_type), id(slot_5_active),
              id(target_speaker_id), id(target_speaker_name),
              id(font_date), id(font_small), id(font_micro),
              id(theme_primary), id(theme_secondary), id(col_bg), id(col_black),
              id(col_white), id(col_slate), id(col_dark_gray));
        }

      // ==========================================
      // PAGE 3: GAMES SUITE (LAUNCHER & 3 GAMES)
      // ==========================================
      } else if (id(gui_page) == 3) {
        // Read real-time accelerometer / gyroscope tilt angles
        float roll = id(imu_roll).state;
        float raw_pitch = id(imu_pitch).state;
        if (isnan(roll)) roll = 0.0f;
        if (isnan(raw_pitch)) raw_pitch = 0.0f;

        // Dynamic Tare / Auto-Zero on Game Launch:
        // Whatever angle the user is holding the device at when launching the game is calibrated as neutral flat.
        static float zero_pitch = -45.0f;
        static float zero_roll = 0.0f;

        // Clean Game Reset and Calibration on State Entry
        static int prev_game_state = 0;
        bool game_just_entered = false;
        if (id(active_game) != prev_game_state) {
          prev_game_state = id(active_game);
          game_just_entered = true;
          if (id(active_game) > 0) {
            zero_pitch = raw_pitch;
            zero_roll = roll;
          }
        }

        // Relative tilt deltas from dynamic calibrated starting posture:
        float pitch_delta = raw_pitch - zero_pitch;
        float roll_delta = roll - zero_roll;

        // ----------------------------------------------------
        // STATE 0: GAMES MENU LAUNCHER (Vertical Slot Machine Carousel)
        // ----------------------------------------------------
        if (id(active_game) == 0) {

          // Individual Game Icon Renderer (Position-Independent)
          auto draw_game_icon = [&](int g_idx, int icon_x, int icon_y) {
            if (g_idx == 0) {
              // ------------------------------------------------------------------
              // GAME 0: MARBLES
              // ------------------------------------------------------------------
              it.filled_circle(icon_x, icon_y, 52, Color(18, 24, 28));
              it.circle(icon_x, icon_y, 52, id(col_slate));
              it.circle(icon_x, icon_y, 51, id(col_slate));
              it.circle(icon_x, icon_y, 46, Color(30, 40, 48));

              it.filled_circle(icon_x, icon_y, 15, id(col_black));
              it.circle(icon_x, icon_y, 15, Color(45, 55, 65));
              it.circle(icon_x, icon_y, 14, Color(45, 55, 65));

              for (int a = 0; a < 4; a++) {
                float sa = a * 1.570796f;
                it.line(icon_x + (int)(fast_cos(sa) * 18.0f), icon_y + (int)(fast_sin(sa) * 18.0f),
                        icon_x + (int)(fast_cos(sa + 0.8f) * 40.0f), icon_y + (int)(fast_sin(sa + 0.8f) * 40.0f), Color(35, 45, 55));
              }
              render_glass_marble(it, icon_x - 24, icon_y - 18, 13, id(col_red), Color(255, 138, 128));
              render_glass_marble(it, icon_x + 22, icon_y - 22, 12, id(col_cyan), Color(180, 255, 255));
              render_glass_marble(it, icon_x - 20, icon_y + 22, 11, id(col_green), Color(185, 246, 202));
              render_glass_marble(it, icon_x + 24, icon_y + 18, 13, id(col_gold), Color(255, 245, 157));
              render_glass_marble(it, icon_x + 2, icon_y - 31, 10, id(col_magenta), Color(248, 187, 208));

            } else if (g_idx == 1) {
              // ------------------------------------------------------------------
              // GAME 1: ARCHERY — Centered 5-ring target + bold arrow in bullseye
              // ------------------------------------------------------------------
              render_archery_target(it, icon_x, icon_y, 46, id(col_white), id(col_black),
                                    id(col_cyan), id(col_red), id(col_gold), id(col_slate), id(col_dark_gray));
              // Drop shadow cast by the arrow shaft across the target face
              int tip_x = icon_x + 2, tip_y = icon_y + 2;
              int tail_x = icon_x + 56, tail_y = icon_y - 36;
              it.line(tip_x, tip_y + 5, tail_x - 8, tail_y + 10, Color(15, 18, 24));
              it.line(tip_x, tip_y + 6, tail_x - 8, tail_y + 11, Color(15, 18, 24));
              // Embedded broadhead steel tip + golden impact ring in the bullseye
              it.circle(tip_x, tip_y, 5, Color(180, 110, 0));
              it.filled_triangle(tip_x - 3, tip_y + 2, tip_x + 9, tip_y - 9, tip_x + 12, tip_y - 2, id(col_white));
              // Thick 3px wooden arrow shaft sticking out at a crisp 35-degree angle
              it.line(tip_x, tip_y, tail_x, tail_y, Color(238, 206, 148));
              it.line(tip_x, tip_y - 1, tail_x, tail_y - 1, Color(250, 228, 178));
              it.line(tip_x, tip_y + 1, tail_x, tail_y + 1, Color(182, 138, 76));
              // Bright crimson & gold-crested fletching feathers at the tail
              for (int f = 0; f < 9; f++) {
                int fx = tail_x - 3 - f;
                int fy = tail_y + 2 + (f * 2) / 3;
                it.line(fx, fy - 1, fx + 3, fy - 11, Color(255, 52, 52));
                it.line(fx, fy + 1, fx + 10, fy + 4, Color(220, 32, 32));
              }
              // Silver nock at the very end of the shaft
              it.filled_circle(tail_x + 1, tail_y - 1, 2, id(col_white));

            } else if (g_idx == 2) {
              // ------------------------------------------------------------------
              // GAME 2: BREAKOUT — 3D Beveled Bricks, Shattering Hit & Compact Paddle
              // ------------------------------------------------------------------
              int b_w = 26, b_h = 11, gap_x = 4, gap_y = 5;
              int start_bx = icon_x - (int)(2.0f * b_w + 1.5f * gap_x) + b_w / 2;
              int start_by = icon_y - 36;
              Color row_c[3] = {id(col_gold), id(col_cyan), id(col_orange)};
              Color row_hi[3] = {Color(255, 245, 165), Color(185, 255, 255), Color(255, 195, 100)};
              for (int r = 0; r < 3; r++) {

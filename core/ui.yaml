  - platform: motion
    motion_id: imu
    type: acceleration_z
    name: "Accel Z"
    id: accel_z
    internal: true
  - platform: motion
    motion_id: imu
    type: roll
    name: "Roll"
    id: imu_roll
    internal: true
  - platform: motion
    motion_id: imu
    type: pitch
    name: "Pitch"
    id: imu_pitch
    internal: true

  - platform: qmi8658
    name: "IMU Temperature"
    id: imu_temp
    entity_category: diagnostic
    filters:
      - delta: 0.5

  - platform: template
    name: "Dynamic Motion Delta"
    id: motion_mag
    unit_of_measurement: "g"
    accuracy_decimals: 3
    update_interval: 200ms
    internal: true
    lambda: |-
      if (id(is_locked)) return 0.0f;
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;
      if (isnan(x) || isnan(y) || isnan(z)) return NAN;

      static float grav_x = 0.0f;
      static float grav_y = 0.0f;
      static float grav_z = 1.0f;
      const float alpha = 0.08f;
      grav_x = (1.0f - alpha) * grav_x + alpha * x;
      grav_y = (1.0f - alpha) * grav_y + alpha * y;
      grav_z = (1.0f - alpha) * grav_z + alpha * z;

      float dx = x - grav_x;
      float dy = y - grav_y;
      float dz = z - grav_z;
      return sqrtf(dx*dx + dy*dy + dz*dz);


binary_sensor:
  - platform: template
    name: "Timer Active"

  - platform: template
    name: "Pickup Detected"
    id: pickup_detected
    device_class: motion
    lambda: |-
      float dyn = id(motion_mag).state;
      if (isnan(dyn)) return false;

      const float thresh = 0.22f;
      const uint32_t active_ms = 8000;
      static uint32_t last_active_time = 0;
      static uint32_t last_hit_time = 0;
      static bool is_active = false;
      uint32_t now_ms = millis();

      if (dyn > thresh) {
        if (now_ms - last_hit_time < 600) {
          is_active = true;
          last_active_time = now_ms;
        }
        last_hit_time = now_ms;
      } else if (is_active) {
        if (dyn > 0.03f) {
          last_active_time = now_ms;
        }
        if (now_ms - last_active_time >= active_ms) {
          is_active = false;
        }
      }
      return is_active;
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(is_locked);'
            then:
              - script.stop: screen_sleep_timer
              - lambda: |-
                  if (!id(display_brightness).current_values.is_on()) {
                    if (id(sleep_start_time) > 0 && (millis() - id(sleep_start_time) >= 30000)) {
                      id(apply_default_start_page).execute();
                    }
                    id(sleep_start_time) = 0;
                  }
              - light.turn_on: display_brightness
              - component.update: disp1
    on_release:
      then:
        - script.execute: screen_sleep_timer


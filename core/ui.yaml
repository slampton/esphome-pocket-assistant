      // Generalized dynamic text truncation with custom font measurement (Global Display Scope)
      auto fit_text_to_width_font = [&](const std::string &str, int max_w, auto font) -> std::string {
        if (str.empty() || font == nullptr) return "";
        int w = 0, x_off = 0, base = 0, text_h = 0;
        font->measure(str.c_str(), &w, &x_off, &base, &text_h);
        if (w <= max_w) return str;

        std::string cur = str;
        if (cur.length() > 32) {
          while (cur.length() > 30) {
            while (!cur.empty() && (static_cast<unsigned char>(cur.back()) & 0xC0) == 0x80) cur.pop_back();
            if (!cur.empty()) cur.pop_back();
          }
        }
        while (!cur.empty()) {
          std::string test_str = cur + "..";
          font->measure(test_str.c_str(), &w, &x_off, &base, &text_h);
          if (w <= max_w) return test_str;
          while (!cur.empty() && (static_cast<unsigned char>(cur.back()) & 0xC0) == 0x80) cur.pop_back();
          if (!cur.empty()) cur.pop_back();
        }
        return "..";
      };

      // Shared fit_text_to_width for pill bodies using font_small
      auto fit_text_to_width = [&](const std::string &str, int max_w) -> std::string {
        return fit_text_to_width_font(str, max_w, id(font_small));
      };


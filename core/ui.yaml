                }

                // 3. Standardized Centered < BACK Button at y = 410 (or Top Header Tap y <= 72)
                if (is_back_button(touch) || touch.y <= 72) {
                  if (now_rem - last_remote_btn_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_remote_btn_tap = now_rem;
                    id(remote_action_feedback) = "";
                    id(remote_subpage) = 0;
                    id(disp1).update();
                  }
                  return;
                }
                return;
              }

              // Subpage 0: Main Remote Interface
              int act_slot = pocket_ui::resolve_active_remote_slot(id(active_remote_slot), rem_ents);
              id(active_remote_slot) = act_slot;

              // Interactive Header: Tap Title (y: 25..80, x: 110..356) to open SETTINGS Subpage
              if (touch.x >= 110 && touch.x <= 356 && touch.y >= 25 && touch.y <= 80) {
                if (now_rem - last_remote_btn_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_remote_btn_tap = now_rem;
                  id(remote_action_feedback) = "";
                  id(remote_subpage) = 1;
                  id(disp1).update();
                }
                return;
              }

              // 1. CONCENTRIC D-PAD (Center at cx=233, cy=233, visual r_out=132, radial boundary r=146 -> r^2=21316)
              // Evaluated before corner buttons so LEFT/RIGHT D-Pad sectors (x=101..115 and 351..365) never collide with corners!
              int dx = touch.x - 233;
              int dy = touch.y - 233;
              int dist_sq = dx * dx + dy * dy;

              // Center OK Button (r <= 52 px, r^2 <= 2704)
              if (dist_sq <= 2704) {
                if (now_rem - last_remote_btn_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_remote_btn_tap = now_rem;
                  id(remote_send_key).execute(4, act_slot);
                  id(disp1).update();
                }
                return;
              }

              // Directional Ring (52 px < r <= 146 px, 2704 < r^2 <= 21316)
              if (dist_sq > 2704 && dist_sq <= 21316) {
                if (now_rem - last_remote_btn_tap > TOUCH_DEBOUNCE_RAPID) {
                  last_remote_btn_tap = now_rem;
                  int k_dir = (abs(dy) >= abs(dx)) ? ((dy < 0) ? 0 : 1) : ((dx < 0) ? 2 : 3);
                  id(remote_send_key).execute(k_dir, act_slot);
                  id(disp1).update();
                }
                return;
              }

              // 2. FOUR CORNER FLANK BUTTONS (Outside r > 146 px, centered at (71,140), (395,140), (71,326), (395,326))
              // HOME: Top-Left Quadrant (x <= 135, y: 80..195)
              if (touch.x <= 135 && touch.y >= 80 && touch.y <= 195) {
                if (now_rem - last_remote_btn_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_remote_btn_tap = now_rem;
                  id(remote_send_key).execute(6, act_slot);
                  id(disp1).update();
                }

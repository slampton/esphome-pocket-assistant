script:
  - id: pause_all_music
    mode: restart
    then:
      - lambda: |-
          bool local_active = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool remote_active = (!id(active_speaker_entity).empty() && (id(active_speaker_entity) != "${local_player_id}") && (id(ha_target_state).state == "playing"));
          if (local_active || remote_active) {
            id(va_resume_music_after) = true;
          }
          ESP_LOGI("audio", "pause_all_music: local=%d, remote=%d -> va_resume_music_after=%d", local_active, remote_active, id(va_resume_music_after));
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - media_player.pause: pocket_music_player
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
            - if:
                condition:
                  lambda: 'return !id(active_speaker_entity).empty();'
                then:
                  - homeassistant.action:
                      action: media_player.media_pause
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'

  - id: resume_music_after_va
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va_resume_music_after);'
          then:
            - lambda: |-
                id(va_resume_music_after) = false;
                ESP_LOGI("audio", "resume_music_after_va: restoring playback for %s (cancelled=%d)", id(active_speaker_entity).c_str(), id(va_was_cancelled));
            - if:
                condition:
                  lambda: 'return !id(active_speaker_entity).empty() && (id(active_speaker_entity) != "${local_player_id}");'
                then:
                  - lambda: 'id(va_was_cancelled) = false;'
                  - homeassistant.action:
                      action: media_player.media_play
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'
                  - audio_dac.mute_on: es8311_dac
                  - script.execute: route_i2s_to_mic
                else:
                  - script.execute: route_i2s_to_spk
                  - switch.turn_on: speaker_enable
                  - mixer_speaker.apply_ducking:
                      id: media_mixing_input
                      decibel_reduction: 10
                      duration: 0.8s
                  - mixer_speaker.apply_ducking:
                      id: announcement_mixing_input
                      decibel_reduction: 50
                      duration: 0.1s
                  # Dispatch media_play immediately so Home Assistant / Sendspin reconnects in parallel
                  - if:
                      condition:
                        lambda: 'return !id(active_speaker_entity).empty();'
                      then:
                        - homeassistant.action:
                            action: media_player.media_play
                            data:
                              entity_id: !lambda 'return id(active_speaker_entity).c_str();'
                      else:
                        - media_player.play: pocket_music_player
                  # If VA was terminated early, keep es8311_dac muted for 700ms while Sendspin
                  # handshakes so any residual TTS audio inside physical_speaker's 1000ms buffer
                  # drains completely silently instead of playing a 0.4s burst before music starts
                  - if:
                      condition:
                        lambda: 'return id(va_was_cancelled);'
                      then:
                        - lambda: 'id(va_was_cancelled) = false;'
                        - delay: 700ms
                  - audio_dac.mute_off: es8311_dac
          else:
            - lambda: 'id(va_was_cancelled) = false;'
            - audio_dac.mute_on: es8311_dac
            - script.execute: route_i2s_to_mic
  - id: fetch_remote_art_debounced
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: |-
              return (id(active_speaker_entity) != "${local_player_id}") &&
                     !id(ha_target_art_url).state.empty() &&
                     (id(ha_target_art_url).state != "none") &&
                     (id(ha_target_art_url).state != "unknown") &&
                     (id(ha_target_art_url).state != "unavailable") &&
                     (id(ha_target_art_url).state != id(current_loaded_art_url));
          then:
            - online_image.set_url:
                id: remote_album_art
                url: !lambda 'return id(ha_target_art_url).state;'

  - id: throttled_disp_update
    mode: restart
    then:
      - delay: 220ms
      - if:
          condition:
            lambda: |-
              static uint32_t last_throttled_draw = 0;
              uint32_t now = millis();
              if (now - last_throttled_draw < 350) return false;
              if (now - pocket_ui::last_page2_draw_ms() < 950) return false;
              if (id(display_power_state) == 0 && id(gui_page) == 2 && !id(va_active)) {
                last_throttled_draw = now;
                return true;
              }
              return false;
          then:
            - component.update: disp1

  - id: apply_theme_preset
    mode: restart
    then:
      - lambda: |-
          std::string p = id(theme_palette_select).current_option();
          if (p == "Pink & Gray") {
            id(theme_primary) = Color(168, 120, 132);  // Muted Ash Pink #A87884 (faint, gray undertones)
            id(theme_secondary) = Color(192, 192, 192);// Brushed Silver / Gray #C0C0C0
          } else if (p == "Green & Gold") {
            id(theme_primary) = Color(66, 116, 83);    // Heritage Sage Green #427453
            id(theme_secondary) = Color(197, 155, 39); // Chrono Mustard Gold #C59B27
          } else if (p == "Blue & Gold" || p == "Default Classic") {
            id(theme_primary) = Color(69, 110, 138);   // #456E8A Steel Cyan
            id(theme_secondary) = Color(197, 155, 39); // #C59B27 Vintage Gold
          } else {
            // Steel & Silver (Default for New Installs): Soft Steel Ice Blue + Brushed Silver
            id(theme_primary) = Color(107, 142, 158);  // Soft Steel Ice Blue #6B8E9E
            id(theme_secondary) = Color(192, 192, 192);// Brushed Silver #C0C0C0
          }
          if (id(display_power_state) == 0) id(disp1).update();

  - id: rebuild_active_deck
    mode: restart
    then:
      - lambda: |-
          struct AppEntry {
            int page_id;
            float rank;
            bool enabled;
          };

          AppEntry pool[7] = {
            {0, id(app_order_clock).state, id(show_clock_switch).state},
            {2, id(app_order_music).state, id(show_music_switch).state},
            {3, id(app_order_games).state, id(show_games_switch).state},
            {5, id(app_order_weather).state, id(show_weather_switch).state},
            {7, id(app_order_remote).state, id(show_remote_switch).state},
            {8, id(app_order_stuff).state, id(show_stuff_switch).state},
            {4, id(app_order_system).state, id(show_system_switch).state}
          };

          // Stable bubble sort by user-configured position rank (1..10)
          for (int i = 0; i < 6; i++) {
            for (int j = 0; j < 6 - i; j++) {
              if (pool[j].rank > pool[j + 1].rank) {
                AppEntry tmp = pool[j];
                pool[j] = pool[j + 1];
                pool[j + 1] = tmp;
              }
            }
          }

          int count = 0;
          for (int i = 0; i < 7; i++) {
            if (pool[i].enabled) {
              if (count == 0) id(deck_slot_0) = pool[i].page_id;
              else if (count == 1) id(deck_slot_1) = pool[i].page_id;
              else if (count == 2) id(deck_slot_2) = pool[i].page_id;
              else if (count == 3) id(deck_slot_3) = pool[i].page_id;
              else if (count == 4) id(deck_slot_4) = pool[i].page_id;
              else if (count == 5) id(deck_slot_5) = pool[i].page_id;
              else if (count == 6) id(deck_slot_6) = pool[i].page_id;
              count++;
            }
          }

          if (count == 0) {
            id(deck_slot_0) = 0;
            count = 1;
          }
          id(active_deck_size) = count;

          auto get_slot = [](int idx) -> int {
            if (idx == 0) return id(deck_slot_0);
            if (idx == 1) return id(deck_slot_1);
            if (idx == 2) return id(deck_slot_2);
            if (idx == 3) return id(deck_slot_3);
            if (idx == 4) return id(deck_slot_4);
            if (idx == 5) return id(deck_slot_5);
            if (idx == 6) return id(deck_slot_6);
            return 0;
          };

          // Preserve active page if still enabled, else snap to first slot
          bool found = false;
          for (int i = 0; i < count; i++) {
            if (get_slot(i) == id(gui_page)) {
              found = true;
              id(current_deck_index) = i;
              break;
            }
          }
          if (!found) {
            id(current_deck_index) = 0;
            id(gui_page) = id(deck_slot_0);
            id(disp1).update();
          }
  - id: sync_display_brightness
    mode: restart
    then:
      - lambda: |-
          auto parse_bri = [](const std::string& opt) -> float {
            if (opt == "60%") return 0.60f;
            if (opt == "70%") return 0.70f;
            if (opt == "80%") return 0.80f;
            if (opt == "90%") return 0.90f;
            if (opt == "100%") return 1.00f;
            return 0.90f;
          };

          float b_target = 0.90f;
          std::string mode = id(auto_brightness_mode).current_option();

          if (mode == "Sun Synchronized") {
            std::string sun = id(ha_sun_state).state;
            bool is_night = (sun == "below_horizon");
            std::string opt = is_night ? id(night_brightness_preset).current_option()
                                       : id(day_brightness_preset).current_option();
            b_target = parse_bri(opt);
          } else if (mode == "Time Schedule") {
            auto now = id(ha_time).now();
            int day_h = (int)id(day_start_hour).state;
            int night_h = (int)id(night_start_hour).state;
            bool is_day = true;
            if (now.is_valid()) {
              if (day_h < night_h) {
                is_day = (now.hour >= day_h && now.hour < night_h);
              } else {
                is_day = (now.hour >= day_h || now.hour < night_h);
              }
            }
            std::string opt = is_day ? id(day_brightness_preset).current_option()
                                     : id(night_brightness_preset).current_option();
            b_target = parse_bri(opt);
          } else {
            std::string opt = id(display_brightness_preset).current_option();
            b_target = parse_bri(opt);
          }

          // Flashlight Torch (Page 8, Subpage 5) & Find My Device always lock active brightness at 100%
          if ((id(gui_page) == 8 && id(stuff_subpage) == 5) || id(find_my_active)) {
            b_target = 1.00f;
          }

          // CENTRAL POWER ARBITRATION INVARIANT:
          if (id(display_power_state) == 0) { // ACTIVE
            id(display_brightness).turn_on().set_brightness(b_target).perform();
          } else if (id(display_power_state) == 1) { // SCREENSAVER
            id(display_brightness).turn_on().set_brightness(0.60f).perform(); // Screensaver locked at 60%
          }

  - id: apply_default_start_page
    then:
      - lambda: |-
          auto def_app = id(default_start_app).current_option();
          int init_p = 0;
          if (def_app == "Music") init_p = 2;
          else if (def_app == "Games") init_p = 3;
          else if (def_app == "System") init_p = 4;
          else if (def_app == "Sky & Weather" || def_app == "Sky and Weather") init_p = 5;
          else if (def_app == "Remote" || def_app == "TV Remote") init_p = 7;
          else if (def_app == "Tools" || def_app == "Stuff") init_p = 8;

          auto is_app_enabled = [](int p) -> bool {
            if (p == 0) return id(show_clock_switch).state;
            if (p == 2) return id(show_music_switch).state;
            if (p == 3) return id(show_games_switch).state;
            if (p == 4) return id(show_system_switch).state;
            if (p == 5) return id(show_weather_switch).state;
            if (p == 7) return id(show_remote_switch).state;
            if (p == 8) return id(show_stuff_switch).state;
            return false;
          };

          if (!is_app_enabled(init_p)) {
            const int canonical_pages[7] = {0, 2, 7, 5, 3, 8, 4};
            for (int p : canonical_pages) {
              if (is_app_enabled(p)) { init_p = p; break; }
            }
          }
          id(gui_page) = init_p;
          // Sync current_deck_index with the active deck slots
          const int slots[7] = {
            id(deck_slot_0), id(deck_slot_1), id(deck_slot_2),
            id(deck_slot_3), id(deck_slot_4), id(deck_slot_5), id(deck_slot_6)
          };
          for (int i = 0; i < id(active_deck_size) && i < 7; i++) {
            if (slots[i] == init_p) {
              id(current_deck_index) = i;
              break;
            }
          }
  - id: music_vol_up
    mode: restart
    then:
      - delay: 0ms
      - if:
          condition:
            lambda: 'return id(active_speaker_entity) == "${local_player_id}";'
          then:
            - lambda: |-
                float step = id(volume_step_size).state / 100.0f;
                if (std::isnan(step) || step <= 0.0f) step = 0.02f;
                float cur = id(pocket_music_player).volume;
                if (std::isnan(cur) || cur <= 0.0f) cur = 0.70f;
                float new_vol = std::min(1.00f, cur + step);
                id(pocket_music_player).volume = new_vol;
                id(pocket_music_player).make_call().set_volume(new_vol).perform();
          else:
            - if:
                condition:
                  lambda: |-
                    float sf = id(ha_target_supported_features).state;
                    return !std::isnan(sf) && ((static_cast<int>(sf) & 4) != 0);
                then:
                  - lambda: |-
                      char b[16];
                      snprintf(b, sizeof(b), "%.2f", pocket_ui::remote_vol_pct() / 100.0f);
                      id(remote_vol_level_str) = b;
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'
                        volume_level: !lambda 'return id(remote_vol_level_str);'
                else:
                  - homeassistant.action:
                      action: media_player.volume_up
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'

  - id: music_vol_down
    mode: restart
    then:
      - delay: 0ms
      - if:
          condition:
            lambda: 'return id(active_speaker_entity) == "${local_player_id}";'
          then:
            - lambda: |-
                float step = id(volume_step_size).state / 100.0f;
                if (std::isnan(step) || step <= 0.0f) step = 0.02f;
                float cur = id(pocket_music_player).volume;
                if (std::isnan(cur) || cur <= 0.0f) cur = 0.70f;
                float new_vol = std::max(0.00f, cur - step);
                id(pocket_music_player).volume = new_vol;
                id(pocket_music_player).make_call().set_volume(new_vol).perform();
          else:
            - if:
                condition:
                  lambda: |-
                    float sf = id(ha_target_supported_features).state;
                    return !std::isnan(sf) && ((static_cast<int>(sf) & 4) != 0);
                then:
                  - lambda: |-
                      char b[16];
                      snprintf(b, sizeof(b), "%.2f", pocket_ui::remote_vol_pct() / 100.0f);
                      id(remote_vol_level_str) = b;
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'
                        volume_level: !lambda 'return id(remote_vol_level_str);'
                else:
                  - homeassistant.action:
                      action: media_player.volume_down
                      data:
                        entity_id: !lambda 'return id(active_speaker_entity).c_str();'

  - id: toggle_ha_music
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
              bool local_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
              return pocket_ui::is_music_playing_effective(is_remote, local_playing, id(ha_target_state).state, millis());
          then:
            - lambda: 'pocket_ui::set_remote_play_override(false, millis());'
            - if:
                condition:
                  lambda: 'return (id(active_speaker_entity) == "${local_player_id}");'
                then:
                  - media_player.pause: pocket_music_player
            - homeassistant.action:
                action: media_player.media_pause
                data:
                  entity_id: !lambda 'return id(active_speaker_entity).c_str();'
          else:
            - lambda: 'pocket_ui::set_remote_play_override(true, millis());'
            - homeassistant.action:
                action: media_player.media_play
                data:
                  entity_id: !lambda 'return id(active_speaker_entity).c_str();'
            - if:
                condition:
                  lambda: 'return (id(active_speaker_entity) == "${local_player_id}");'
                then:
                  - media_player.play: pocket_music_player

  - id: stop_ha_music
    mode: restart
    then:
      - lambda: |-
          pocket_ui::set_remote_play_override(false, millis());
          id(music_action_feedback) = "Playback Stopped";
          id(music_feedback_timer) = millis();
          id(music_overlay_mode) = 0;
          id(music_hud_active) = true;
          id(music_hud_timer) = millis();
      - if:
          condition:
            lambda: 'return (id(active_speaker_entity) == "${local_player_id}");'
          then:
            - media_player.pause: pocket_music_player
      - homeassistant.action:
          action: media_player.media_pause
          data:
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'
      - component.update: disp1

  - id: music_next_track
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          id(music_action_feedback) = "Next Track >>";
          id(music_feedback_timer) = millis();
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'

  - id: music_prev_track
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          id(music_action_feedback) = "<< Prev Track";
          id(music_feedback_timer) = millis();
          id(music_pos_base) = 0.0f;
          id(music_pos_sync_time) = millis();
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'

  - id: music_seek_relative
    mode: restart
    parameters:
      dir: int
    then:
      - delay: 0ms
      - lambda: |-
          uint32_t now_ms = millis();
          if (now_ms - id(music_skip_last_tap_ms) < 1000) {
            id(music_skip_burst_count)++;
          } else {
            id(music_skip_burst_count) = 1;
          }
          id(music_skip_last_tap_ms) = now_ms;

          float step_sec = 10.0f;
          const char *label = "-10s Replay";
          if (dir < 0) {
            switch (id(music_skip_burst_count)) {
              case 1: step_sec = 10.0f; label = "-10s Replay"; break;
              case 2: step_sec = 30.0f; label = "-30s Replay"; break;
              case 3: step_sec = 60.0f; label = "-1m Replay"; break;
              case 4: step_sec = 120.0f; label = "-2m Replay"; break;
              default: step_sec = 300.0f; label = "-5m Replay"; break;
            }
          } else {
            switch (id(music_skip_burst_count)) {
              case 1: step_sec = 30.0f; label = "+30s Skip"; break;
              case 2: step_sec = 60.0f; label = "+1m Skip"; break;
              case 3: step_sec = 120.0f; label = "+2m Skip"; break;
              case 4: step_sec = 300.0f; label = "+5m Skip"; break;
              default: step_sec = 600.0f; label = "+10m Skip"; break;
            }
          }

          id(music_action_feedback) = label;
          id(music_feedback_timer) = now_ms;

          float cur_pos = id(music_pos_base);
          if (id(music_pos_sync_time) > 0) {
            cur_pos += (float)(now_ms - id(music_pos_sync_time)) / 1000.0f;
          }
          float new_pos = 0.0f;
          if (dir < 0) {
            new_pos = std::max(0.0f, cur_pos - step_sec);
          } else {
            float dur = id(ha_media_duration).state;
            new_pos = (!std::isnan(dur) && dur > 0.0f) ? std::min(dur, cur_pos + step_sec) : (cur_pos + step_sec);
          }
          id(music_pos_base) = new_pos;
          id(music_pos_sync_time) = now_ms;
      - homeassistant.action:
          action: media_player.media_seek
          data:
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'
            seek_position: !lambda |-
              float cur_pos = id(music_pos_base);
              return to_string((int)std::max(0.0f, cur_pos));

  - id: music_seek_absolute
    mode: restart
    then:
      - delay: 0ms
      - homeassistant.action:
          action: media_player.media_seek
          data:
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'
            seek_position: !lambda |-
              float cur_pos = id(music_pos_base);
              return to_string((int)std::max(0.0f, cur_pos));

  - id: fetch_music_browse
    mode: restart
    then:
      - homeassistant.action:
          action: ${browse_script}
          data:
            mode: !lambda 'return id(selected_category_mode).c_str();'
            page: !lambda 'return to_string(id(music_browse_page));'
            page_size: "5"
            search: !lambda |-
              if (id(selected_category_mode) == "artist_albums") {
                return id(drilldown_artist_name).c_str();
              } else if (id(selected_category_mode) == "current_album_tracks" || id(selected_category_mode) == "album_tracks" || id(selected_category_mode) == "podcast_episodes") {
                return id(drilldown_album_id).c_str();
              }
              return "";
            speaker: !lambda 'return id(active_speaker_entity).c_str();'
            last_speaker: !lambda 'return id(last_speaker_entity).c_str();'
            album_sort: !lambda |-
              auto sort = id(music_album_sort_order).current_option();
              if (sort == "Newest on Top") return "year_desc";
              if (sort == "Oldest on Top") return "year";
              return "name";
            artist_album_sort: !lambda |-
              auto sort = id(music_artist_album_sort_order).current_option();
              if (sort == "Alphabetical") return "name";
              if (sort == "Newest on Top") return "year_desc";
              return "year";
            podcast_sort: !lambda |-
              auto sort = id(music_podcast_sort_order).current_option();
              if (sort == "Oldest on Top") return "oldest";
              return "newest";

  - id: activate_selected_speaker
    mode: restart
    parameters:
      prefix: string
    then:
      - lambda: |-
          if (id(target_speaker_id).rfind("media_player.", 0) == 0) {
            if (id(active_speaker_entity) != id(target_speaker_id) && !id(active_speaker_entity).empty()) {
              id(last_speaker_entity) = id(active_speaker_entity);
            }
            id(active_speaker_entity) = id(target_speaker_id);
            id(active_speaker_name) = id(target_speaker_name);
            id(music_action_feedback) = prefix + id(target_speaker_name);
          } else {
            ESP_LOGW("ui", "Rejecting non-media_player target: %s", id(target_speaker_id).c_str());
            id(music_action_feedback) = "Invalid Speaker";
          }
          id(music_feedback_timer) = millis();
          id(current_loaded_art_url) = "";
          id(music_overlay_mode) = 0;
          id(music_direct_nav) = false;
          id(music_hud_active) = true;
          id(music_hud_timer) = millis();
      - homeassistant.action:
          action: input_text.set_value
          data:
            entity_id: ${active_speaker_helper}
            value: !lambda 'return id(active_speaker_entity).c_str();'
      - online_image.release: remote_album_art
      - if:
          condition:
            lambda: 'return (id(active_speaker_entity) != "${local_player_id}");'
          then:
            - script.execute: fetch_remote_art_debounced
      - component.update: disp1

  - id: speaker_transfer_to_target
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          id(music_action_feedback) = "Transferring -> " + id(target_speaker_name);
          id(music_feedback_timer) = millis();
          if (id(active_speaker_entity) == "${local_player_id}" && id(target_speaker_id) != "${local_player_id}") {
            if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
              auto call = id(pocket_music_player).make_call();
              call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_PAUSE);
              call.perform();
            }
          }
      - homeassistant.action:
          action: music_assistant.transfer_queue
          data:
            entity_id: !lambda 'return id(target_speaker_id).c_str();'
            source_player: !lambda 'return id(active_speaker_entity).c_str();'
            auto_play: !lambda |-
              bool source_playing = (id(active_speaker_entity) == "${local_player_id}")
                                        ? (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING)
                                        : (id(ha_target_state).state == "playing");
              return source_playing ? "true" : "false";
      - script.execute:
          id: activate_selected_speaker
          prefix: "Active: "

  - id: speaker_control_target
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
            auto call = id(pocket_music_player).make_call();
            call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_PAUSE);
            call.perform();
          }
      - script.execute:
          id: activate_selected_speaker
          prefix: "Controlling: "

  - id: speaker_join_target
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          id(music_action_feedback) = "Joining -> " + id(target_speaker_name);
          id(music_feedback_timer) = millis();
          id(music_overlay_mode) = 0;
          id(music_hud_active) = true;
          id(music_hud_timer) = millis();
      - homeassistant.action:
          action: media_player.join
          data:
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'
            group_members: !lambda 'return id(target_speaker_id).c_str();'
      - component.update: disp1

  - id: speaker_unjoin_target
    mode: restart
    then:
      - delay: 0ms
      - lambda: |-
          id(music_action_feedback) = "Unjoining -> " + id(target_speaker_name);
          id(music_feedback_timer) = millis();
      - homeassistant.action:
          action: media_player.unjoin
          data:
            entity_id: !lambda 'return id(target_speaker_id).c_str();'
      - lambda: |-
          if (id(target_speaker_id) == id(active_speaker_entity) || id(target_speaker_id) == "${local_player_id}") {
            id(active_speaker_entity) = "${local_player_id}";
            id(active_speaker_name) = "${friendly_name}";
            id(current_loaded_art_url) = "";
          }
          id(music_overlay_mode) = 0;
      - homeassistant.action:
          action: input_text.set_value
          data:
            entity_id: ${active_speaker_helper}
            value: !lambda 'return id(active_speaker_entity).c_str();'
      - online_image.release: remote_album_art
      - component.update: disp1

  - id: play_music_slot
    mode: restart
    parameters:
      slot: int
    then:
      - delay: 0ms
      - lambda: |-
          if (slot == 1) {
            id(selected_slot_name) = id(slot_1_name);
            id(selected_slot_id)   = id(slot_1_id);
            id(selected_slot_type) = id(slot_1_type);
          } else if (slot == 2) {
            id(selected_slot_name) = id(slot_2_name);
            id(selected_slot_id)   = id(slot_2_id);
            id(selected_slot_type) = id(slot_2_type);
          } else if (slot == 3) {
            id(selected_slot_name) = id(slot_3_name);
            id(selected_slot_id)   = id(slot_3_id);
            id(selected_slot_type) = id(slot_3_type);
          } else if (slot == 4) {
            id(selected_slot_name) = id(slot_4_name);
            id(selected_slot_id)   = id(slot_4_id);
            id(selected_slot_type) = id(slot_4_type);
          } else {
            id(selected_slot_name) = id(slot_5_name);
            id(selected_slot_id)   = id(slot_5_id);
            id(selected_slot_type) = id(slot_5_type);
          }
          if (id(active_speaker_entity).empty() || id(active_speaker_entity) == "None") {
            id(active_speaker_entity) = "${local_player_id}";
          }
          if (id(selected_category_mode) == "artist") {
            id(selected_slot_type) = "artist";
          } else if (id(selected_category_mode) == "album" || id(selected_category_mode) == "artist_albums") {
            id(selected_slot_type) = "album";
          } else if (id(selected_category_mode) == "podcast_episodes") {
            id(selected_slot_type) = "podcast_episode";
          } else if (id(selected_slot_type).empty()) {
            id(selected_slot_type) = "music";
          }
          id(music_action_feedback) = "Playing: " + id(selected_slot_name);
          id(music_feedback_timer) = millis();
          pocket_ui::set_remote_play_override(true, millis());
          if (id(selected_category_mode) == "podcast_episodes") {
            id(active_playback_media_type) = "podcast";
          } else if (id(selected_category_mode) == "audiobook") {
            id(active_playback_media_type) = "audiobook";
          } else {
            id(active_playback_media_type) = "music";
          }
          if (!id(active_speaker_entity).empty()) {
            id(current_loaded_art_url) = "";
          }
          id(music_overlay_mode) = 0;
          id(music_hud_active) = true;
          id(music_hud_timer) = millis();
      - homeassistant.action:
          action: music_assistant.play_media
          data:
            entity_id: !lambda 'return id(active_speaker_entity).c_str();'
            media_id: !lambda 'return id(selected_slot_id).c_str();'
            media_type: !lambda 'return id(selected_slot_type).c_str();'
            enqueue: "play"
      - component.update: disp1

  - id: mp_idle_debounce
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: |-
              return (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_IDLE) && 
                     !id(va).is_running() && 
                     !id(va_tts_received) && 
                     !id(announcement_mixing_input).is_running() &&
                     !id(alarm_ringing) &&
                     !id(timer_ringing) &&
                     !id(find_my_active);
          then:
            - audio_dac.mute_on: es8311_dac
            - switch.turn_off: speaker_enable
            - script.execute: route_i2s_to_mic

  - id: toggle_voice_assistant
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(va_active) || !id(va_status_text).empty();'
          then:
            - script.execute: cancel_voice_assistant
          else:
            - lambda: |-
                // If waking from screen-off or standby, honor Assist Screen Wake preference
                if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
                  if (id(va_wake_screen_switch).state) {
                    id(wake_to_active_state).execute();
                  }
                } else {
                  id(screen_sleep_timer).execute();
                }
                id(va_tts_received) = false;
            - if:
                condition:
                  micro_wake_word.is_running:
                then:
                  - micro_wake_word.stop:
                  - delay: 20ms
            - script.execute: route_i2s_to_mic
            - voice_assistant.start:

  - id: cancel_voice_assistant
    mode: restart
    then:
      - script.stop: va_tts_drain_and_finish
      - audio_dac.mute_on: es8311_dac
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 50
          duration: 0.1s
      - if:
          condition:
            media_player.is_announcing: pocket_music_player
          then:
            - media_player.stop:
                id: pocket_music_player
                announcement: true
      - speaker.stop: announcement_mixing_input
      - voice_assistant.stop:
      - lambda: |-
          esphome::voice_assistant::abort_voice_assistant(id(va));
          id(va_was_cancelled) = true;
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_vad_active) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
          if (id(display_power_state) == 2 && !id(usb_connected).state &&
              id(pocket_music_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING) {
            extern int esp_wifi_set_ps(int type) __asm__("esp_wifi_set_ps");
            esp_wifi_set_ps(1);
          }
      - delay: 15ms
      - component.update: disp1
      - delay: 160ms
      - script.execute: resume_music_after_va
      - if:
          condition:
            binary_sensor.is_off: pickup_detected
          then:
            - script.execute: screen_sleep_timer
  - id: trigger_firmware_update
    mode: restart
    then:
      - update.perform:
          id: update_pocket_assistant
      - lambda: |-
          id(system_menu_mode) = 5;
          id(disp1).update();

  - id: check_firmware_update
    mode: restart
    then:
      - update.check:
          id: update_pocket_assistant


  - id: menu_scroll_transition
    mode: restart
    then:
      - lambda: |-
          // Frame 1: Render 50% eased midpoint frame (SHARED_SCROLL_EASE_*[2])
          id(menu_scroll_step) = 2;
          id(disp1).update();
      - delay: 12ms
      - lambda: |-
          // Frame 2: Commit target page, release touch lock, and render final settled frame
          id(menu_scroll_active) = false;
          if (id(gui_page) == 4 && id(system_menu_mode) == 1) {
            id(sleep_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 4 && id(system_menu_mode) == 2) {
            id(display_menu_page) = id(menu_scroll_target_page);

          } else if (id(gui_page) == 4 && id(system_menu_mode) == 10) {
            id(deck_menu_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 4 && id(system_menu_mode) == 0) {
            id(system_dashboard_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 2 && id(music_overlay_mode) == 2) {
            id(music_category_page) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 3 && id(active_game) == 0) {
            id(game_carousel_idx) = id(menu_scroll_target_page);
          } else if (id(gui_page) == 8 && id(stuff_subpage) == 0) {
            id(stuff_menu_page) = id(menu_scroll_target_page);
          }
          id(menu_scroll_step) = 0;
          id(disp1).update();

  # ==============================================================================
  # 📺 UNIVERSAL TV & MEDIA REMOTE COMMAND SCRIPTS (MULTI-DEVICE & MULTI-PROTOCOL)
  # ==============================================================================
  - id: remote_send_key
    mode: restart
    parameters:
      key_idx: int
      target_slot: int
    then:
      - delay: 0ms
      - lambda: |-
          const std::string ents[4] = {
            "${tv_remote_entity}", "${tv_remote_entity_2}",
            "${tv_remote_entity_3}", "${tv_remote_entity_4}"
          };
          const std::string names[4] = {
            id(remote_slot_0_name), id(remote_slot_1_name),
            id(remote_slot_2_name), id(remote_slot_3_name)
          };
          const pocket_ui::RemoteCustomCmds custom_cmds = {
            "${remote_cmd_up}", "${remote_cmd_down}", "${remote_cmd_left}", "${remote_cmd_right}",
            "${remote_cmd_select}", "${remote_cmd_back}", "${remote_cmd_home}",
            "${remote_cmd_vol_up}", "${remote_cmd_vol_down}", "${remote_cmd_power}"
          };
          pocket_ui::resolve_remote_dispatch(
              key_idx, target_slot, id(active_remote_slot), id(remote_profile_user_set),
              id(tv_remote_profile).current_option(), "${tv_remote_profile}",
              ents, names, custom_cmds,
              id(remote_target_ent), id(remote_target_prof),
              id(remote_target_cmd), id(remote_action_feedback));
          id(remote_feedback_timer) = millis();
      - if:
          condition:
            lambda: |-
              bool is_mp = (id(remote_target_ent).rfind("media_player.", 0) == 0) ||
                           (id(remote_target_prof) == "Denon / Marantz AVR") ||
                           (id(remote_target_prof) == "LG webOS");
              return is_mp && (key_idx >= 7 && key_idx <= 9);
          then:
            - if:
                condition:
                  lambda: 'return key_idx == 7;'
                then:
                  - homeassistant.action:
                      action: media_player.volume_up
                      data:
                        entity_id: !lambda 'return id(remote_target_ent);'
                else:
                  - if:
                      condition:
                        lambda: 'return key_idx == 8;'
                      then:
                        - homeassistant.action:
                            action: media_player.volume_down
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
                      else:
                        - homeassistant.action:
                            action: media_player.toggle
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
          else:
            - if:
                condition:
                  lambda: 'return id(remote_target_prof) == "Denon / Marantz AVR";'
                then:
                  - homeassistant.action:
                      action: denonavr.get_command
                      data:
                        entity_id: !lambda 'return id(remote_target_ent);'
                        command: !lambda 'return id(remote_target_cmd);'
                else:
                  - if:
                      condition:
                        lambda: 'return id(remote_target_prof) == "LG webOS";'
                      then:
                        - homeassistant.action:
                            action: webostv.button
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
                              button: !lambda 'return id(remote_target_cmd);'
                      else:
                        - homeassistant.action:
                            action: remote.send_command
                            data:
                              entity_id: !lambda 'return id(remote_target_ent);'
                              command: !lambda 'return id(remote_target_cmd);'

display:
  - id: !extend disp1
    lambda: |-
      const int cx = pocket_ui::SCREEN_CX;
      const int cy = pocket_ui::SCREEN_CY;
      // ======================================================================
      // 🎨 Centralized Standard UI & Theme Color Tokens (LUTs & Primitives in ui_toolkit.h)
      // ======================================================================
      const Color C_WHITE = id(col_white);
      const Color C_DARK_GRAY = id(col_dark_gray);
      const Color C_CYAN = id(col_cyan);
      const Color C_SOLARIS_GOLD = id(col_solaris_gold);

      // ==========================================
      // GLOBAL OVERLAY: OTA FIRMWARE UPDATE IN PROGRESS (Always renders even if screen was off)
      // ==========================================
      if (id(ota_in_progress)) {
        it.fill(id(col_bg));

        // Perimeter Progress Indicator Only (r = 220..228, LUT-accelerated via fast_sincos)
        int pct = id(ota_progress_pct);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        for (int i = 0; i <= pct; i++) {
          float rad = (static_cast<float>(i) / 100.0f) * 2.0f * PI_F - HALF_PI_F;
          float s = 0.0f, c = 1.0f;
          fast_sincos(rad, s, c);
          it.line(cx + static_cast<int>(220.0f * c), cy + static_cast<int>(220.0f * s),
                  cx + static_cast<int>(228.0f * c), cy + static_cast<int>(228.0f * s), id(theme_secondary));
        }

        it.print(cx, cy - 60, id(font_date), id(theme_primary), TextAlign::CENTER, "FIRMWARE UPDATE");

        char prog_buf[32];
        snprintf(prog_buf, sizeof(prog_buf), "%d%%", pct);
        it.print(cx, cy + 8, id(font_time), id(col_white), TextAlign::CENTER, prog_buf);

        // Dynamic stage messaging
        const char* status_msg = "Preparing flash...";
        if (pct >= 99) {
          status_msg = "Rebooting device...";
        } else if (pct >= 85) {
          status_msg = "Verifying image...";
        } else if (pct >= 10) {
          status_msg = "Writing flash memory...";
        }
        it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, status_msg);
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: HIBERNATION SHUTDOWN (Zero Outer Rings, Minimalist Dark Canvas)
      // Top priority: Always render countdown & confirmation even if screen was previously asleep
      // ==========================================
      if (id(is_hibernating)) {
        it.fill(id(col_bg));

        if (id(hibernate_countdown_val) > 0) {
          it.print(cx, cy - 65, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");
          char c_buf[16];
          snprintf(c_buf, sizeof(c_buf), "%d", id(hibernate_countdown_val));
          it.print(cx, cy + 5, id(font_chrono_time), id(theme_secondary), TextAlign::CENTER, c_buf);
          it.print(cx, cy + 65, id(font_small), id(col_slate), TextAlign::CENTER, "Tap screen to stay awake");
        } else {
          it.print(cx, cy - 10, id(font_date), id(theme_primary), TextAlign::CENTER, "HIBERNATING");
          it.print(cx, cy + 30, id(font_small), id(col_slate), TextAlign::CENTER, "Shutting down...");
        }
        return;
      }

      if (!id(display_brightness).current_values.is_on() || id(display_power_state) == 2) {
        it.fill(id(col_bg));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: VOICE ASSISTANT TAKEOVER
      // Rendered above Docked Screensaver so VA sessions always display over standby animations
      // ==========================================
      if (id(va_active) || !id(va_status_text).empty()) {
        uint32_t now_ms = millis();
        bool is_speaking = id(va_tts_received);
        bool is_thinking = (!is_speaking && id(va_status_text) == "Thinking...");
        render_voice_assistant_overlay(
            it, cx, cy, now_ms, is_speaking, is_thinking, id(va_vad_active),
            id(va_visual_profile).current_option(), id(va_status_text),
            id(font_small), C_WHITE, C_DARK_GRAY, C_CYAN, id(col_light_blue),
             id(col_purple), id(col_magenta), C_SOLARIS_GOLD);
        return;
      }

      auto now = id(ha_time).now();

      // ==========================================
      // GLOBAL OVERLAY: ALARM / TIMER RINGING TAKEOVER
      // Rendered above Docked Screensaver & all pages without hijacking gui_page
      // ==========================================
      if (id(alarm_ringing) || id(timer_ringing) || id(find_my_active)) {
        render_alert_ringing_overlay(
            it, cx, cy, millis(), id(alarm_ringing), id(alarm_ringing_idx),
            id(alarm1_recurrence), id(alarm2_recurrence), now, id(is_24h_format),
            id(font_time), id(font_date), id(font_small), id(font_micro),
            id(theme_primary), id(theme_secondary), id(col_bg), id(col_black),
            id(col_white), id(col_gray), id(col_red),
            id(find_my_active), id(va_timer_name));
        return;
      }

      // ==========================================
      // GLOBAL OVERLAY: DOCKED SCREENSAVER (Mode 1)
      // ==========================================
      if (id(display_power_state) == 1) {
        it.fill(id(col_bg));
        render_docked_screensaver(
            it, cx, cy, millis(), now, id(is_24h_format),
            id(screensaver_style_select).current_option(),
            id(font_time), id(font_small), id(col_slate), id(col_dark_gray));
        return;
      }

      float batt = id(batt_level).state;



      // ==========================================
      // PAGE 0: WATCH FACE (HIGH-CONTRAST MODERN DIAL — SECTION 16 OF ui_toolkit.h)
      // ==========================================
      if (id(gui_page) == 0) {
        render_clock_page(
            it, cx, cy, now, id(clock_face_digital), id(is_24h_format),
            batt, id(batt_charging).state,
            id(font_time), id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_white), id(col_slate), id(col_gray), id(col_dark_gray),
            id(col_red), id(col_gold), id(col_green));
      } else if (id(gui_page) == 2) {
        uint32_t now_p2_ms = millis();
        pocket_ui::last_page2_draw_ms() = now_p2_ms;
        if (id(music_overlay_mode) == 0) {
          bool is_remote = (id(active_speaker_entity) != "${local_player_id}");
          bool local_playing = (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          bool is_playing = pocket_ui::is_music_playing_effective(
              is_remote, local_playing, id(ha_target_state).state, now_p2_ms);
          render_music_now_playing(
              it, cx, cy, now_p2_ms,
              id(music_fullscreen_art_mode).current_option().c_str(),
              id(music_overlay_style).current_option().c_str(),
              id(music_hud_active), is_remote, is_playing,
              id(album_art), id(remote_album_art),
              id(ha_target_art_url).state, id(current_loaded_art_url),
              id(active_speaker_name), "${friendly_name}",
              id(music_action_feedback), id(music_feedback_timer),
              id(active_playback_media_type),
              id(music_show_speaker_shortcut).state, id(music_show_library_shortcut).state,
              id(ha_media_duration).state, id(music_pos_base), id(music_pos_sync_time),

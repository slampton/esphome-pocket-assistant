        // ----------------------------------------------------
        const int btn_y = 332;
        const int btn_lap_x = 176;
        const int btn_rst_x = 290;
        const int btn_r = 36;

        // LAP Button (Machined steel piston: polished silver rim, dark core, metallic typography)
        it.filled_circle(btn_lap_x, btn_y, btn_r - 2, id(col_dark_gray));
        it.circle(btn_lap_x, btn_y, btn_r, id(col_silver));
        it.circle(btn_lap_x, btn_y, btn_r - 1, id(col_slate));

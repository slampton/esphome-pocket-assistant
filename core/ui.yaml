        // ----------------------------------------------------
        } else if (id(active_game) == 3) {
          render_game_breakout(
              it, cx, cy, millis(), game_just_entered, roll_delta,
              id(marble_touch_x), id(game_btn_pressed), id(high_score_breakout),
              id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_white), id(col_gold), id(col_cyan),
              id(col_orange), id(col_green), id(col_red), id(col_slate), id(col_dark_gray));

        // ----------------------------------------------------
        // GAME 4: CHOMP FOR KIDS (MUPPET MONSTER, 3 TREATS & PARTY MILESTONES)
        // ----------------------------------------------------
        } else if (id(active_game) == 4) {
          render_game_chomp(
              it, cx, cy, millis(), game_just_entered, roll_delta, pitch_delta,
              id(marble_touch_x), id(game_btn_pressed), id(high_score_chomp),
              id(font_date), id(font_small), id(col_bg), id(col_white),
              id(col_black), id(col_gold), id(col_cyan), id(col_red),
              id(col_green), id(col_magenta), id(col_orange), id(col_dark_gray));

        // ----------------------------------------------------
        // GAME 5: ASTEROIDS (TILT-AIM VECTOR COMBAT, WAVES & ALIEN UFO SAUCERS)
        // ----------------------------------------------------
        } else if (id(active_game) == 5) {
          render_game_asteroids(
              it, cx, cy, millis(), game_just_entered, roll_delta, pitch_delta,
              id(marble_touch_x), id(game_btn_pressed), id(high_score_asteroids),
              id(font_date), id(font_small), id(theme_secondary),
              id(col_bg), id(col_white), id(col_silver), id(col_slate),
              id(col_dark_gray), id(col_gold), id(col_cyan), id(col_green),
              id(col_magenta), id(col_orange), id(col_red));
        }
      // ==========================================
      // PAGE 4: SYSTEM SETTINGS & DIAGNOSTICS (SECTION 18 OF ui_toolkit.h)
      // ==========================================
      } else if (id(gui_page) == 4) {
        int spk_vol_pct = (int)std::round(id(pocket_music_player).volume * 100.0f);
        float a_st = id(alert_volume).state;
        int alert_vol_pct = (std::isnan(a_st) || a_st < 20.0f) ? 70 : (int)std::round(a_st);
        int vol_step_pct = (int)std::round(id(volume_step_size).state);
        if (vol_step_pct < 1 || vol_step_pct > 10) vol_step_pct = 5;
        uint32_t free_heap_kb = (uint32_t)(esp_get_free_heap_size() / 1024U);

        render_system_page(
            it, cx, millis(), "${version}",
            id(system_menu_mode), id(system_dashboard_page),
            id(sleep_menu_page), id(display_menu_page), id(deck_menu_page),
            id(menu_scroll_active), id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
            id(update_check_state), id(update_check_timer),
            id(ha_firmware_latest_version).state, id(ha_firmware_release_summary).state,
            batt, id(batt_charging).state, id(batt_voltage).state,
            id(pocket_wifi_signal).state, id(pocket_ip_address).state, id(imu_temp).state,
            free_heap_kb, now.is_valid(), id(ble_ctrl).is_active(),
            id(pickup_wake_mode).current_option(), id(tap_wake_mode).current_option(),
            id(display_off_timeout).current_option(), id(docked_screensaver_switch).state,
            id(screensaver_style_select).current_option(), id(screensaver_docked_timeout).current_option(),
            id(hibernate_timeout_mode).current_option(), id(instant_crown_hibernate_switch).state,
            id(prevent_deep_sleep_switch).state,
            id(clock_face_digital), id(is_24h_format),
            id(theme_palette_select).current_option(), id(page_counter_mode).current_option(),
            id(auto_brightness_mode).current_option(), id(display_brightness_preset).current_option(),
            (int)id(day_start_hour).state, (int)id(night_start_hour).state,
            id(day_brightness_preset).current_option(), id(night_brightness_preset).current_option(),
            spk_vol_pct, alert_vol_pct, vol_step_pct,
            id(music_fullscreen_art_mode).current_option(), id(music_overlay_style).current_option(),
            id(music_album_sort_order).current_option(), id(music_artist_album_sort_order).current_option(),
            id(music_podcast_sort_order).current_option(),
            id(default_start_app).current_option(),
            id(show_clock_switch).state, id(show_music_switch).state, id(show_remote_switch).state,
            id(show_weather_switch).state, id(show_games_switch).state, id(show_stuff_switch).state,
            id(va_visual_profile).current_option(), id(va_wake_screen_switch).state,
            id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_bg), id(col_black), id(col_white), id(col_slate),
            id(col_dark_gray), id(col_gold), id(col_red));
      } else if (id(gui_page) == 5) {
        // ==============================================================================
        // PAGE 5: SKY & WEATHER SUITE (v1.1 REFINEMENTS)
        // 4-View Horological Instrument:
        //   Subpage 0: Current Conditions (Hero temp at y=74 with buffer, consistent fonts)
        //   Subpage 1: Forecast (Standardized title at y=56, tight 4-day forecast, centered alignment)
        //   Subpage 2: Sun (Title "SUN" at y=56, Below/Above Horizon, lowered arc, daytime-only sun)
        //   Subpage 3: Moon (Title "MOON" at y=56, normal & full-screen modes, soft feathered terminator)
        // Navigation: 2x2 System-Sized Pill Grid at bottom [ Current | Forecast ] / [ Sun | Moon ]
        // ==============================================================================
        if (id(sky_weather_subpage) == 0) {
          float temp = id(ha_weather_temperature).state;
          std::string cond = id(ha_weather_condition).state;
          std::string s_state = id(ha_sun_state).state;
          bool is_night = (s_state == "below_horizon" || cond == "clear-night" || cond == "clearnight" || (cond.find("night") != std::string::npos));
          apply_weather_sim_override(id(weather_sim_condition).current_option(), cond, is_night);

          uint32_t now_ms = millis();
          const int cel_cx = 346;
          const int cel_cy = 91;

          // ====================================================================
          // LAYERS 0, 1 & 2: MODULAR ATMOSPHERIC, CELESTIAL & MOTION ENGINE (ui_toolkit.h)
          // Exact Z-order: Sky -> Stars -> Sun/Moon -> Shooting Star / Birds -> Clouds/Fog/Leaves
          // ====================================================================
          double moon_cycle = 0.5;
          if (is_night) {
            calculate_moon_phase(moon_cycle);
          }
          render_weather_motion_wallpaper(it, cx, cy, now_ms, cond, is_night,
                                          CLOUD_SPANS_PACKED, moon_cycle, cel_cx, cel_cy, true);

          // ====================================================================
          // LAYER 3: FOREGROUND TELEMETRY & TYPOGRAPHY (FLOATING CLEANLY)
          // ====================================================================
          // Hero Temperature moved down to y = 134 (+34px downward unit shift)
          char temp_buf[16];
          if (!isnan(temp)) snprintf(temp_buf, sizeof(temp_buf), "%.0f°", temp);
          else snprintf(temp_buf, sizeof(temp_buf), "--°");
          it.print(cx, 134, id(font_time), id(col_white), TextAlign::CENTER, temp_buf);

          std::string cond_title = format_weather_title(cond);
          Color cond_color = is_night ? id(theme_primary) : Color(255, 225, 110);
          it.print(cx, 197, id(font_date), cond_color, TextAlign::CENTER, cond_title.c_str());

          // ----------------------------------------------------
          // PRIMARY METRICS: HUMIDITY & WIND (Harmonized 26px buffer above enlarged buttons)
          // Generous natural breathing space (56px gap) below feels-like line
          // ----------------------------------------------------
          float hum = id(ha_weather_humidity).state;
          float wspd = id(ha_weather_wind_speed).state;
          float wbear = id(ha_weather_wind_bearing).state;

          Color label_c = is_night ? id(col_slate) : Color(165, 190, 215);

          // Column 1: HUMIDITY (Left x = 156, titles at y = 258, data at y = 288)
          it.print(156, 258, id(font_small), label_c, TextAlign::CENTER, "HUMIDITY");
          char hum_str[16];
          if (!isnan(hum)) snprintf(hum_str, sizeof(hum_str), "%.0f%%", hum);
          else snprintf(hum_str, sizeof(hum_str), "--");
          it.print(156, 288, id(font_small), id(col_white), TextAlign::CENTER, hum_str);

          // Subtle vertical divider between Humidity and Wind
          it.line(cx, 252, cx, 302, id(col_dark_gray));

          // Column 2: WIND (Right x = 310, titles at y = 258, data at y = 288)
          it.print(310, 258, id(font_small), label_c, TextAlign::CENTER, "WIND");
          char wind_str[32];
          if (!isnan(wspd)) {
            snprintf(wind_str, sizeof(wind_str), "%.0f mph %s", roundf(wspd), get_cardinal(wbear));
          } else {
            snprintf(wind_str, sizeof(wind_str), "--");
          }
          it.print(310, 288, id(font_small), id(col_white), TextAlign::CENTER, wind_str);

          // Standard baseline divider at y = 310 defining 26px buffer above enlarged bottom buttons
          it.line(80, 310, 386, 310, id(col_dark_gray));
        }
        // ----------------------------------------------------------------------
        // SUBPAGE 1: FORECAST (5-DAY FORECAST: TODAY + 4 MORE DAYS)
        // ----------------------------------------------------------------------
        else if (id(sky_weather_subpage) == 1) {
          // Standardized Title at y = 50
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "FORECAST");
          it.line(80, 62, 386, 62, id(col_dark_gray));

          struct DayForecast {
            std::string day;
            std::string high;
            std::string low;
            std::string cond;
          };
          std::vector<DayForecast> fc_days;

          std::string raw_fc = id(ha_weather_forecast_5d).state;
          if (!raw_fc.empty() && raw_fc != "unknown" && raw_fc != "unavailable" && raw_fc.find(':') != std::string::npos) {
            size_t start = 0;
            while (start < raw_fc.length() && fc_days.size() < 5) {
              size_t end = raw_fc.find(';', start);
              if (end == std::string::npos) end = raw_fc.length();
              std::string token = raw_fc.substr(start, end - start);
              start = end + 1;
              if (token.empty()) continue;

              size_t c1 = token.find(':');
              if (c1 != std::string::npos) {
                size_t c2 = token.find(':', c1 + 1);
                if (c2 != std::string::npos) {
                  size_t c3 = token.find(':', c2 + 1);
                  DayForecast df;
                  df.day = token.substr(0, c1);
                  df.high = token.substr(c1 + 1, c2 - c1 - 1);
                  if (c3 != std::string::npos) {
                    df.low = token.substr(c2 + 1, c3 - c2 - 1);
                    df.cond = token.substr(c3 + 1);
                  } else {
                    df.low = token.substr(c2 + 1);
                    df.cond = "sunny";
                  }
                  fc_days.push_back(df);
                }
              }
            }
          }

          // Fallback if forecast data from companion package is pending sync
          if (fc_days.empty()) {
            float cur_t = id(ha_weather_temperature).state;
            float cur_hi = id(ha_weather_high).state;
            float cur_lo = id(ha_weather_low).state;
            std::string cur_c = id(ha_weather_condition).state;
            if (cur_c.empty() || cur_c == "unknown" || cur_c == "unavailable") cur_c = "partlycloudy";

            float base_hi = !isnan(cur_hi) ? cur_hi : (!isnan(cur_t) ? cur_t + 4.0f : 82.0f);
            float base_lo = !isnan(cur_lo) ? cur_lo : (!isnan(cur_t) ? cur_t - 15.0f : 58.0f);

            auto now = id(ha_time).now();
            const char* d_names[7] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};
            int d_off[5][2] = {{0, 0}, {3, 2}, {5, 3}, {4, 2}, {2, 1}};

            for (int i = 0; i < 5; i++) {
              DayForecast df;
              if (now.is_valid()) {
                int d_idx = (now.day_of_week - 1 + i) % 7;
                if (d_idx < 0) d_idx += 7;
                df.day = (i == 0) ? "TODAY" : d_names[d_idx];
              } else {
                df.day = (i == 0) ? "TODAY" : d_names[(i + 5) % 7];
              }
              char h_buf[16], l_buf[16];
              snprintf(h_buf, sizeof(h_buf), "%.0f", base_hi + d_off[i][0]);
              snprintf(l_buf, sizeof(l_buf), "%.0f", base_lo + d_off[i][1]);
              df.high = h_buf;
              df.low = l_buf;
              df.cond = cur_c;
              fc_days.push_back(df);
            }
          }

          if (!fc_days.empty()) {
            bool dummy_night = false;
            apply_weather_sim_override(id(weather_sim_condition).current_option(), fc_days[0].cond, dummy_night);
          }
          auto draw_fc_glyph = [&](int gx, int gy, const std::string& c_name) { render_forecast_glyph(it, gx, gy, c_name); };

          // 5 Spaced Rows with 46px pitch (y = 100, 146, 192, 238, 284) - preserved exact column placement with balanced row padding
          int row_ys[5] = {100, 146, 192, 238, 284};
          for (size_t i = 0; i < fc_days.size() && i < 5; i++) {
            int ry = row_ys[i];
            const auto& d = fc_days[i];

            // 1. Day of week shifted left to x = 102
            it.print(102, ry, id(font_small), (i == 0) ? id(theme_primary) : id(col_white), TextAlign::CENTER, d.day.c_str());

            // Optical baseline alignment: glyph, condition, and high/low brought down by 2px to match days of week
            int ry_data = ry + 2;

            // 2. Weather vector glyph centered at x = 164
            draw_fc_glyph(164, ry_data, d.cond);

            // 3. Condition short text vertically aligned at x = 187
            std::string c_txt = format_forecast_short_name(d.cond);
            it.print(187, ry_data, id(font_small), id(col_slate), TextAlign::CENTER_LEFT, c_txt.c_str());

            // 4. High / Low temperatures shifted left to x = 315..335 (leaving wide buffer for right-flank chevrons)
            std::string hi_str = d.high + "°";
            std::string lo_str = d.low + "°";
            it.print(315, ry_data, id(font_small), id(col_white), TextAlign::CENTER_RIGHT, hi_str.c_str());
            it.print(325, ry_data, id(font_micro), id(col_dark_gray), TextAlign::CENTER, "/");
            it.print(335, ry_data, id(font_small), id(col_slate), TextAlign::CENTER_LEFT, lo_str.c_str());

            // Horizontal row divider
            if (i < 4) {
              it.line(70, ry + 22, 365, ry + 22, id(col_dark_gray));
            }
          }
          // Standard baseline divider at y = 308 defining 28px buffer above enlarged bottom buttons
          it.line(70, 308, 365, 308, id(col_dark_gray));
        }
        // ----------------------------------------------------------------------
        // SUBPAGE 2: SUN (ENLARGED SOLAR ARC, MIDPOINT HORIZON y=218, BUFFERED TELEMETRY)
        // ----------------------------------------------------------------------
        else if (id(sky_weather_subpage) == 2) {
          // Standardized Title at y = 50
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "SUN");

          float elev = id(ha_sun_elevation).state;
          float azim = id(ha_sun_azimuth).state;

          // Solar Arc block shifted up by 10px (reducing title-to-apex gap by 25% from 40px to 30px, apex at y = 90)
          // Horizon line at y = 208, arc radius 118px
          int arc_cy = 208;
          int arc_r = 118;

          // Horizon Line at y = 208 between arc endpoints
          for (int hx = 112; hx <= 354; hx += 8) {
            it.line(hx, arc_cy, hx + 4, arc_cy, id(col_gray));
          }
          // E and W brought inward directly adjacent to arc endpoints
          it.print(98, arc_cy, id(font_micro), id(col_slate), TextAlign::CENTER, "E");
          it.print(368, arc_cy, id(font_micro), id(col_slate), TextAlign::CENTER, "W");

          // Day Arc (Above Horizon y <= 208, top apex at y = 90 — LUT-accelerated via fast_cos/fast_sin)
          for (int a = 0; a <= 180; a += 2) {
            float rad = static_cast<float>(a) * (PI_F / 180.0f);
            int ax = cx - static_cast<int>(static_cast<float>(arc_r) * fast_cos(rad));
            int ay = arc_cy - static_cast<int>(static_cast<float>(arc_r) * fast_sin(rad));
            it.draw_pixel_at(ax, ay, Color(180, 140, 40));
            it.draw_pixel_at(ax, ay + 1, Color(100, 75, 20));
          }

          // Status Text placed UNDERNEATH the horizon line at y = 224 in font_micro
          if (!isnan(elev)) {
            const char* sol_st = (elev > 0.0f) ? "Above Horizon" : "Below Horizon";
            it.print(cx, 224, id(font_micro), elev > 0.0f ? id(col_warm_gold) : id(col_slate), TextAlign::CENTER, sol_st);
          }

          // Current Sun Position: ONLY displayed if above horizon (elev >= 0)
          if (!isnan(elev) && elev >= 0.0f) {
            float day_prog = 0.5f;
            if (!isnan(azim)) {
              if (azim >= 60.0f && azim <= 300.0f) day_prog = (azim - 60.0f) / 240.0f;
              else if (azim < 60.0f) day_prog = 0.05f;
              else day_prog = 0.95f;
            }
            float theta = day_prog * 3.14159265f;
            int sx = cx - (int)((float)arc_r * cosf(theta));
            int sy = arc_cy - (int)((float)arc_r * sinf(theta));

            it.filled_circle(sx, sy, 9, Color(245, 175, 30));
            it.filled_circle(sx, sy, 5, Color(255, 235, 140));
            it.filled_circle(sx, sy, 2, Color(255, 255, 255));
            it.line(sx - 13, sy, sx + 13, sy, Color(255, 200, 50));
            it.line(sx, sy - 13, sx, sy + 13, Color(255, 200, 50));
          }

          // Horizontal divider at y = 238
          it.line(80, 238, 386, 238, id(col_dark_gray));

          // Telemetry Row: Sunrise and Sunset (Titles at y = 264, Times at y = 290)
          std::string s_rise = format_iso_time(id(ha_sun_next_rising).state, id(is_24h_format));
          std::string s_set = format_iso_time(id(ha_sun_next_setting).state, id(is_24h_format));

          it.print(156, 264, id(font_small), id(col_slate), TextAlign::CENTER, "SUNRISE");
          it.print(156, 290, id(font_small), id(col_warm_gold), TextAlign::CENTER, s_rise.c_str());

          it.line(cx, 258, cx, 304, id(col_dark_gray));

          it.print(310, 264, id(font_small), id(col_slate), TextAlign::CENTER, "SUNSET");
          it.print(310, 290, id(font_small), id(col_warm_gold), TextAlign::CENTER, s_set.c_str());

          // Standard baseline divider at y = 310 defining 26px buffer above enlarged bottom buttons
          it.line(80, 310, 386, 310, id(col_dark_gray));
        }
        // ----------------------------------------------------------------------
        // SUBPAGE 3: MOON (MAXIMIZED LUNAR DISC r=72 & BUFFERED CENTERED TELEMETRY)
        // ----------------------------------------------------------------------
        else if (id(sky_weather_subpage) == 3) {
          double cycle = 0.5;
          int illum_pct = 50;
          std::string mp_label = "Moon";
          calculate_moon_phase(cycle, &illum_pct, &mp_label);

          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "MOON");

          // Standard Title-to-Object Gap (top apex at y = 84, matching 34px menu buffer)
          // Scaled Lunar Disc (Radius 69, diameter 138px, cy = 153, apex y = 84, bottom y = 222)
          int moon_cx = cx;
          int moon_cy = 153;
          int moon_r = 69;

          draw_lunar_disc(moon_cx, moon_cy, moon_r, cycle, true);

          // Divider below lunar disc at y = 234
          it.line(110, 234, 356, 234, id(col_dark_gray));

          // Centered Phase Name (y = 258) in col_slate and Illumination (y = 290) in col_white
          it.print(cx, 258, id(font_btn_bold), id(col_slate), TextAlign::CENTER, mp_label.c_str());

          char illum_buf[32];
          snprintf(illum_buf, sizeof(illum_buf), "%d%% Illumination", illum_pct);
          it.print(cx, 290, id(font_small), id(col_white), TextAlign::CENTER, illum_buf);

          // Standard baseline divider at y = 310 defining 26px buffer above enlarged bottom buttons
          it.line(80, 310, 386, 310, id(col_dark_gray));
        }
        // ==============================================================================
        // SUBPAGE NAVIGATION: SINGLE ROW OF 4 ENLARGED CIRCULAR ICON BUTTONS (y = 360, r = 24)
        // Scaled to match Tools Page icon dimensions (r = 24, pitch = 72px, x = {125, 197, 269, 341})
        // Standard Right-Flank Navigation Chevrons at x = 415 (Up at 162, Down at 278)
        // Seamless background integration: with_bg=false on Subpage 0 eliminates black box over sky wallpaper
        // ==============================================================================
        draw_right_flank_chevrons(true, true, id(theme_secondary), id(sky_weather_subpage) != 0);

        render_weather_subpage_icons(it, id(sky_weather_subpage), id(theme_primary), id(col_white));
        if (id(sky_weather_subpage) == 0) {
          record_ambient_frame_ms(millis());
        }
        if (id(sky_weather_subpage) == 0) {
          pocket_ui::record_ambient_frame_ms(millis());
        }
      } else if (id(gui_page) == 7) {
        // ==============================================================================
        // PAGE 7: UNIVERSAL TV & MEDIA REMOTE CONTROL (SECTION 17 OF ui_toolkit.h)
        // ==============================================================================
        const std::string rem_ents[4] = {
          "${tv_remote_entity}", "${tv_remote_entity_2}",
          "${tv_remote_entity_3}", "${tv_remote_entity_4}"
        };
        const std::string rem_names[4] = {
          id(remote_slot_0_name), id(remote_slot_1_name),
          id(remote_slot_2_name), id(remote_slot_3_name)
        };
        render_tv_remote_page(
            it, cx, cy, millis(), id(remote_subpage), id(active_remote_slot),
            rem_ents, rem_names, id(remote_action_feedback), id(remote_feedback_timer),
            id(font_date), id(font_small),
            id(theme_primary), id(theme_secondary),
            id(col_white), id(col_slate), id(col_gray), id(col_dark_gray), id(col_red));
      } else if (id(gui_page) == 8) {
        // ==============================================================================
        // PAGE 8: TOOLS SUITE (LAUNCHER, TIMER, ALARMS, STOPWATCH, DICE, FLASHLIGHT, CALC, LEVEL, COIN)
        // ==============================================================================
        if (id(stuff_subpage) == 0) {
          // --------------------------------------------------
          // SUBPAGE 0: TOOLS LAUNCHER MENU (2-Page Centered Icon Grid with 2-Step Scroll)
          // --------------------------------------------------
          render_tools_launcher(
              it, cx, id(stuff_menu_page), id(menu_scroll_active),
              id(menu_scroll_step), id(menu_scroll_dir), id(menu_scroll_target_page),
              id(font_date), id(font_small), id(theme_primary), id(theme_secondary),
              id(col_bg), id(col_black), id(col_white), id(col_silver),
              id(col_slate), id(col_gold), id(col_cyan), id(col_green),
              id(col_orange), id(col_red));

        } else if (id(stuff_subpage) == 1) {
          // --------------------------------------------------
          // SUBPAGE 1: TIMER (COUNTDOWN TIMER)
          // --------------------------------------------------
          render_tool_timer(
              it, cx, cy, id(timer_running), id(timer_paused),
              id(timer_remaining_sec), id(timer_duration_sec),
              id(font_time), id(font_date), id(font_btn_bold), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_black),
              id(col_white), id(col_slate), id(col_dark_gray), id(col_red));

        } else if (id(stuff_subpage) == 2) {
          // --------------------------------------------------
          // SUBPAGE 2: ALARMS (MULTI-ALARM MANAGER)
          // --------------------------------------------------
          render_tool_alarms(
              it, cx, now, id(is_24h_format), id(alarm_edit_idx),
              id(alarm_snooze_until), id(alarm_ringing_idx),
              id(alarm1_hour), id(alarm1_minute), id(alarm1_enabled), id(alarm1_recurrence),
              id(alarm2_hour), id(alarm2_minute), id(alarm2_enabled), id(alarm2_recurrence),
              id(font_time), id(font_chrono_time), id(font_date), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_black),
              id(col_white), id(col_gray), id(col_dark_gray), id(col_gold));

        } else if (id(stuff_subpage) == 3) {
          // --------------------------------------------------
          // SUBPAGE 3: STOPWATCH (20 FPS HIGH-BEAT HEUER CHRONOGRAPH)
          // --------------------------------------------------
          render_tool_stopwatch(
              it, cx, cy, millis(), id(stopwatch_running),
              id(stopwatch_start_time), id(stopwatch_elapsed_ms), id(stopwatch_lap_ms),
              id(font_date), id(font_small), id(col_white), id(col_silver),
              id(col_slate), id(col_dark_gray), id(col_red));

        } else if (id(stuff_subpage) == 4) {
          // --------------------------------------------------
          // SUBPAGE 4: DICE ROLL (3D ROUNDED IVORY DICE WITH PARABOLIC HOP & OBSIDIAN PIPS)
          // --------------------------------------------------
          render_tool_dice_roll(
              it, cx, millis(), id(dice_anim_active), id(dice_anim_start_ms),
              id(dice_val_d6), id(dice_val_d6_2), id(font_date), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_white), id(col_dark_gray));

        } else if (id(stuff_subpage) == 5) {
          // --------------------------------------------------
          // SUBPAGE 5: FULL-SCREEN OLED FLASHLIGHT (WHITE TORCH ONLY)
          // --------------------------------------------------
          // Pure 100% full-screen AMOLED white illumination
          it.filled_circle(cx, cy, 233, id(col_white));

        } else if (id(stuff_subpage) == 6) {
          // --------------------------------------------------
          // SUBPAGE 6: CALCULATOR WITH PERCENT SUPPORT & OPERATOR HIGHLIGHT
          // --------------------------------------------------
          render_tool_calculator(
              it, id(calc_history), id(calc_entry), id(calc_op), id(calc_new_entry),
              id(font_date), id(font_btn_bold), id(font_small),
              id(theme_primary), id(col_white), id(col_slate), id(col_dark_gray));

        } else if (id(stuff_subpage) == 7) {
          // --------------------------------------------------
          // SUBPAGE 7: LEVEL (20 FPS EMA-SMOOTHED 3D BUBBLE SPIRIT LEVEL)
          // --------------------------------------------------
          render_tool_bubble_level(
              it, cx, id(accel_x).state, id(accel_y).state, id(accel_z).state,
              id(font_date), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_white),
              id(col_gray), id(col_slate), id(col_dark_gray), id(col_green));

        } else if (id(stuff_subpage) == 8) {
          // --------------------------------------------------
          // SUBPAGE 8: COIN FLIP (ZERO-TRIG 3D MILLED-EDGE HOME ASSISTANT MEDALLION)
          // --------------------------------------------------
          render_tool_coin_flip(
              it, cx, millis(), id(coin_anim_active), id(coin_anim_start_ms),
              id(coin_side), id(font_date), id(font_small),
              id(theme_primary), id(theme_secondary), id(col_white), id(col_dark_gray));
        }
      }
      // UNIVERSAL GLOBAL BOTTOM NAVIGATION BAR (Rendered at Top of Z-Order)
      // Guaranteed visibility over any page: stopwatch parchment, full-screen album art, etc.
      // ==============================================================================
      auto current_overlay_mode = id(music_overlay_style).current_option();

      // On Music Player (Page 2), deck navigation chevrons are visible in:
      // - "Always Visible" overlay
      // - "Art + Metadata" overlay
      // - "Art Only" when HUD overlay is actively awakened (music_hud_active == true)
      // Chevrons are solely suppressed during dormant clean art in "Art Only" mode.
      bool music_clean_art = (id(gui_page) == 2 && (current_overlay_mode.empty() || current_overlay_mode == "Art Only") && !id(music_hud_active));

      if (id(active_deck_size) > 1 && !id(is_hibernating) && !id(ota_in_progress) && !id(va_active) && id(va_status_text).empty() && id(display_power_state) == 0 && !(id(gui_page) == 4 && id(system_menu_mode) > 0) && !(id(gui_page) == 3 && id(active_game) > 0) && !(id(gui_page) == 2 && id(music_overlay_mode) > 0) && !music_clean_art && !(id(gui_page) == 7 && id(remote_subpage) > 0) && !(id(gui_page) == 8 && id(stuff_subpage) > 0) && !(id(alarm_ringing) || id(timer_ringing))) {
        Color chevron_col = id(col_white);

        // Master App Deck Navigation Chevrons (< at x=165, > at x=301, y=424)
        draw_deck_chevrons(chevron_col, true);

        bool show_in_deck = (id(page_counter_mode).current_option() != "Never");

        char pg_buf[16] = {0};
        bool draw_pg = false;

        if (show_in_deck) {
          int total = id(active_deck_size);
          int cur = id(current_deck_index);
          snprintf(pg_buf, sizeof(pg_buf), "%d / %d", cur + 1, total);
          draw_pg = true;
        }

        if (draw_pg && pg_buf[0] != '\0') {
          it.print(cx + 1, 424 + 1, id(font_small), id(col_black), TextAlign::CENTER, pg_buf);
          it.print(cx, 424, id(font_small), id(col_white), TextAlign::CENTER, pg_buf);
        }
      }




touchscreen:
  - platform: cst9220
    id: touch_screen
    display: disp1
    i2c_id: bus_internal
    address: 0x5A
    interrupt_pin:
      number: GPIO11
      mode: INPUT_PULLUP
    reset_pin: GPIO2
    touch_timeout: 50ms
    update_interval: 33ms
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            ESP_LOGI("touch", ">>> Touch Down: x=%d y=%d page=%d", touch.x, touch.y, id(gui_page));
            if (id(is_hibernating)) {
              if (id(hibernate_countdown_val) > 0) {
                // Touch on glass aborts 5-second countdown only (instant hibernate is unabortable)
                id(is_hibernating) = false;
                id(hibernate_countdown_val) = 0;
                id(wake_to_active_state).execute();
              }
              return;
            }
            uint32_t now_touch = millis();

            // Standby Wake Handling: Guarded by tap_wake_mode (Always On, Docked Only, Disabled)
            if (id(display_power_state) != 0 || !id(display_brightness).current_values.is_on()) {
              auto tw_mode = id(tap_wake_mode).current_option();
              if (tw_mode == "Disabled") return;
              if (tw_mode == "Docked Only" && !id(usb_connected).state) return;

              id(wake_to_active_state).execute();
              return;
            }

            // Global Post-Wake Touch Settling Guard (TOUCH_DEBOUNCE_WAKE = 180ms):
            // Prevents lingering finger contact from a tap/motion/Crown wake from leaking into page buttons
            if (now_touch - pocket_ui::last_screen_wake_ms() < TOUCH_DEBOUNCE_WAKE) {
              return;
            }

            // Rate-limit sleep timer reset to avoid restarting script 30x/sec during active touches
            static uint32_t last_touch_activity = 0;
            if (now_touch - last_touch_activity > 1000U) {
              last_touch_activity = now_touch;
              id(screen_sleep_timer).execute();
            }

            // Voice Assistant Modal Takeover Interception & Tap to Cancel
            // Completely blocks touch events from leaking through to underlying page (e.g. media play/pause)
            if (id(va_active) || !id(va_status_text).empty()) {
              pocket_ui::last_screen_wake_ms() = now_touch;
              id(cancel_voice_assistant).execute();
              return;
            }

            // Alarm / Timer Ringing Takeover Interception: Dismiss / Snooze
            if (id(alarm_ringing) || id(timer_ringing)) {
              if (id(alarm_ringing)) {
                // SNOOZE button: y in [268..324], x in [100..366]
                if (touch.y >= 268 && touch.y <= 324 && touch.x >= 100 && touch.x <= 366) {
                  auto now = id(ha_time).now();
                  if (now.is_valid()) {
                    id(alarm_snooze_until) = now.timestamp + 300;
                  } else {
                    id(alarm_snooze_until) = (now_touch / 1000) + 300;
                  }
                  id(alarm_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  id(disp1).update();
                  return;
                }
                // DISMISS button: y in [342..398], x in [110..356]
                if (touch.y >= 342 && touch.y <= 398 && touch.x >= 110 && touch.x <= 356) {
                  id(alarm_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  id(disp1).update();
                  return;
                }
              } else if (id(timer_ringing)) {
                // DISMISS button: y in [302..358], x in [100..366]
                if (touch.y >= 302 && touch.y <= 358 && touch.x >= 100 && touch.x <= 366) {
                  id(timer_ringing) = false;
                  pocket_ui::last_screen_wake_ms() = now_touch;
                  id(stop_alarm_sound).execute();
                  id(disp1).update();
                  return;
                }
              }
              return;
            }

            // Standardized Touch Timing, Hit-Testers & Steppers provided by ui_toolkit.h

            static uint32_t last_back_tap = 0;

            // Helper lambda resolving active app slot indices from user deck configuration
            auto get_slot = [](int idx) -> int {
              if (idx == 0) return id(deck_slot_0);
              if (idx == 1) return id(deck_slot_1);
              if (idx == 2) return id(deck_slot_2);
              if (idx == 3) return id(deck_slot_3);
              if (idx == 4) return id(deck_slot_4);
              if (idx == 5) return id(deck_slot_5);
              if (idx == 6) return id(deck_slot_6);
              return 0;
            };

            // ==========================================
            // UNIVERSAL BOTTOM NAVIGATION TOUCH HANDLER
            // Paged submenus: y >= 399 with zero dead zone (x < 233 is Left, x >= 233 is Right).
            //   The < BACK button occupies y <= 398, eliminating all cross-talk!
            // Main App Deck: y >= 400 universally across all primary pages (0..6),
            //   establishing a clean 66px deck navigation hit zone (y: 400..465) around chevrons at y=424.
            // ==========================================
            auto cur_music_ov = id(music_overlay_style).current_option();
            bool music_dormant_art_only = (id(gui_page) == 2 && (cur_music_ov.empty() || cur_music_ov == "Art Only") && !id(music_hud_active));

            bool is_deck_nav = !(id(gui_page) == 4 && id(system_menu_mode) > 0) &&
                               !(id(gui_page) == 3 && id(active_game) > 0) &&
                               !(id(gui_page) == 2 && (id(music_overlay_mode) > 0 || music_dormant_art_only)) &&
                               !(id(gui_page) == 7 && id(remote_subpage) > 0) &&
                               !(id(gui_page) == 8 && id(stuff_subpage) > 0) &&
                               !(id(alarm_ringing) || id(timer_ringing));

            if (is_deck_nav) {
              int deck_y_thresh = 400;
              if (touch.y >= deck_y_thresh) {
                // App Deck Navigation: Full-width zero-deadzone deck flip with TOUCH_DEBOUNCE_BUTTON debounce
                static uint32_t last_deck_flip = 0;
                uint32_t now_flip = millis();
                if (now_flip - last_deck_flip > TOUCH_DEBOUNCE_BUTTON) {
                  last_deck_flip = now_flip;
                  int total = id(active_deck_size);
                  if (total > 1) {
                    if (touch.x < 233) {
                      int prev_idx = (id(current_deck_index) - 1 + total) % total;
                      id(current_deck_index) = prev_idx;
                      id(gui_page) = get_slot(prev_idx);
                    } else {
                      int next_idx = (id(current_deck_index) + 1) % total;
                      id(current_deck_index) = next_idx;
                      id(gui_page) = get_slot(next_idx);
                    }
                    ESP_LOGI("touch", "Deck Navigation: x=%d y=%d new_page=%d", touch.x, touch.y, id(gui_page));
                    id(music_overlay_mode) = 0; id(system_menu_mode) = 0; id(active_game) = 0; id(music_direct_nav) = false;
                    id(sleep_menu_page) = 1; id(display_menu_page) = 1; id(deck_menu_page) = 1; id(system_dashboard_page) = 1; id(menu_scroll_active) = false;
                    id(music_hud_active) = false; id(remote_subpage) = 0; id(stuff_subpage) = 0; id(stuff_menu_page) = 0;
                    id(sky_weather_subpage) = 0;
                    id(disp1).update();
                  }
                }
                return;
              }
            }

            // Edge tap support for one-handed navigation in Browse Library, Speakers & Item Browser (Right-Flank Chevrons)
            if (id(gui_page) == 2 && id(music_overlay_mode) >= 1 && id(music_overlay_mode) <= 3 && touch.y >= 70 && touch.y <= 375) {
              if (touch.x < 75) {
                return; // Left flank has no chevrons in vertical navigation
              } else if (is_right_chevron_zone(touch)) {
                if (id(music_overlay_mode) == 2) {
                  if (id(menu_scroll_active)) return;
                  static uint32_t last_cat_scroll = 0;
                  uint32_t now_s = millis();
                  if (now_s - last_cat_scroll > TOUCH_DEBOUNCE_SCROLL) {
                    last_cat_scroll = now_s;
                    if (id(music_category_page) == 1) {
                      // Page 1: Scroll Down by 2 items (116px) to reveal Page 2
                      id(menu_scroll_active) = true;
                      id(menu_scroll_dir) = 1;
                      id(menu_scroll_target_page) = 2;
                      id(menu_scroll_step) = 0;
                      id(menu_scroll_transition).execute();
                    } else if (id(music_category_page) == 2) {
                      // Page 2: Scroll Up by 2 items (116px) to reveal Page 1
                      id(menu_scroll_active) = true;
                      id(menu_scroll_dir) = -1;
                      id(menu_scroll_target_page) = 1;
                      id(menu_scroll_step) = 0;
                      id(menu_scroll_transition).execute();
                    }
                  }
                  return;
                } else if (id(music_overlay_mode) == 1 || id(music_overlay_mode) == 3) {
                  if (id(music_browse_total_pages) > 1) {
                    static uint32_t last_browse_scroll = 0;
                    uint32_t now_s = millis();
                    if (now_s - last_browse_scroll > TOUCH_DEBOUNCE_SCROLL) {
                      last_browse_scroll = now_s;
                      id(music_browse_page) = step_wrap_1based(id(music_browse_page), (touch.y < 220) ? -1 : 1, id(music_browse_total_pages));

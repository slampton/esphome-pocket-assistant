            // Page 3: Games Menu Launcher or Active Game Touch Action
            } else if (id(gui_page) == 3) {
              if (id(active_game) == 0) {
                // Games Menu card selection
                if (touch.y >= 120 && touch.y < 195) {
                  id(active_game) = 1; // Marbles
                } else if (touch.y >= 200 && touch.y < 275) {
                  id(active_game) = 2; // Archery
                } else if (touch.y >= 280 && touch.y < 355) {
                  id(active_game) = 3; // Treat Catcher
                }
                if (id(active_game) > 0) {
                  // Pause background music and mute DAC for dedicated game resources
                  if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
                    auto call = id(pocket_music_player).make_call();
                    call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_PAUSE);
                    call.perform();
                    id(toggle_ha_music).execute();
                    id(es8311_dac).set_mute_on();
                  }
                }
                id(disp1).update();
              } else {
                // Active game touch action (pop marble / fire arrow / pop treat)
                id(marble_touch_x) = touch.x;
                id(marble_touch_y) = touch.y;
                id(game_btn_pressed) = true;
                id(disp1).update();
              }
            // Page 4: System (Brightness & Restart buttons)
            } else if (id(gui_page) == 4) {
              if (touch.y >= 220 && touch.y <= 270 && touch.x >= 100 && touch.x <= 366) {
                // Brightness preset cycler (40% -> 50% -> 60% -> 70% -> 80% -> 90% -> 100% -> 40%)
                std::string cur = std::string(id(display_brightness_preset).current_option().c_str());
                std::string nxt = "90%";
                if (cur == "40%") nxt = "50%";
                else if (cur == "50%") nxt = "60%";
                else if (cur == "60%") nxt = "70%";
                else if (cur == "70%") nxt = "80%";
                else if (cur == "80%") nxt = "90%";
                else if (cur == "90%") nxt = "100%";
                else if (cur == "100%") nxt = "40%";
                auto call = id(display_brightness_preset).make_call();
                call.set_option(nxt);
                call.perform();
              } else if (touch.y >= 295 && touch.y <= 345 && touch.x >= 100 && touch.x <= 366) {
                // Default Start App cycler (Clock -> Stopwatch -> Music -> Games -> System -> Clock)
                std::string cur = std::string(id(default_start_app).current_option().c_str());
                std::string nxt = "Clock";
                if (cur == "Clock") nxt = "Stopwatch";
                else if (cur == "Stopwatch") nxt = "Music";
                else if (cur == "Music") nxt = "Games";
                else if (cur == "Games") nxt = "System";
                else if (cur == "System") nxt = "Clock";
                auto call = id(default_start_app).make_call();
                call.set_option(nxt);
                call.perform();
              } else if (touch.y >= 370 && touch.y <= 420 && touch.x >= 100 && touch.x <= 366) {
                id(restart_button).press();
              }

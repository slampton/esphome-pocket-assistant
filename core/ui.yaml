                  }
                  return;
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Player View
                if (is_back_button(touch)) {
                  if (now_spk - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_spk;
                    if (id(music_direct_nav)) {
                      id(music_overlay_mode) = 0; // Return directly to Player View
                      id(music_direct_nav) = false;
                    } else {
                      id(music_overlay_mode) = 5; // Return to Music Hub
                    }
                    id(music_hud_active) = true;
                    id(music_hud_timer) = millis();
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 2) {
                // ----------------------------------------------------
                // LEVEL 2: LIBRARY CATEGORIES SUBMENU (Continuous 7-Item Vertical Scroll Architecture)
                // ----------------------------------------------------
                if (id(menu_scroll_active)) return;

                // Reusable Item Action Dispatcher for all 7 library categories
                auto trigger_library_item = [&](int idx) {
                  if (idx == 0) {
                    id(selected_category_mode) = "favorites";
                    id(selected_category_title) = "FAVORITES";
                  } else if (idx == 1) {
                    id(selected_category_mode) = "playlist";
                    id(selected_category_title) = "PLAYLISTS";
                  } else if (idx == 2) {
                    id(selected_category_mode) = "artist";
                    id(selected_category_title) = "ARTISTS";
                    id(drilldown_artist_page) = 1;
                  } else if (idx == 3) {
                    id(selected_category_mode) = "album";
                    id(selected_category_title) = "ALBUMS";
                    id(drilldown_album_page) = 1;
                  } else if (idx == 4) {
                    id(selected_category_mode) = "podcast";
                    id(selected_category_title) = "PODCASTS";
                  } else if (idx == 5) {
                    id(selected_category_mode) = "radio";
                    id(selected_category_title) = "RADIO";
                  } else if (idx == 6) {
                    id(selected_category_mode) = "audiobook";
                    id(selected_category_title) = "AUDIOBOOKS";
                  }
                  id(slot_1_name) = "Loading...";
                  id(slot_1_id) = "";
                  id(slot_2_name) = "";
                  id(slot_2_id) = "";
                  id(slot_3_name) = "";
                  id(slot_3_id) = "";
                  id(slot_4_name) = "";
                  id(slot_4_id) = "";
                  id(slot_5_name) = "";
                  id(slot_5_id) = "";
                  id(music_browse_page) = 1;
                  id(music_overlay_mode) = 3; // Open Level 3 Item Browser
                  id(fetch_music_browse).execute();
                };

                // Central Button Hit-Testing (x: 85..370 across Slots 1-5, narrowed pills)
                static uint32_t last_cat_slot_tap = 0;
                uint32_t now_cat = millis();
                int slot_idx = get_5slot_index(touch, 88, 371);
                if (slot_idx >= 0) {
                  if (now_cat - last_cat_slot_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_cat_slot_tap = now_cat;
                    // Page 1: item_idx = slot_idx (items 0..4: Favorites, Playlists, Artists, Albums, Podcasts)
                    // Page 2: item_idx = slot_idx + 2 (items 2..6: Artists, Albums, Podcasts, Radio, Audiobooks)
                    int item_idx = (id(music_category_page) == 1) ? slot_idx : (slot_idx + 2);
                    trigger_library_item(item_idx);
                  }
                  return;
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Player View
                if (is_back_button(touch)) {
                  if (now_cat - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_cat;
                    if (id(music_direct_nav)) {
                      id(music_overlay_mode) = 0; // Return directly to Player View
                      id(music_direct_nav) = false;
                    } else {
                      id(music_overlay_mode) = 5; // Return to Music Hub
                    }
                    id(music_category_page) = 1;
                    id(menu_scroll_active) = false;
                    id(menu_scroll_step) = 0;
                    id(music_hud_active) = true;
                    id(music_hud_timer) = millis();
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 3) {
                // ----------------------------------------------------
                // LEVEL 3: ITEM BROWSER (Standardized 58px Pitch, 5 Slots)
                // ----------------------------------------------------
                bool is_drill = (id(selected_category_mode) == "artist" || id(selected_category_mode) == "album" || id(selected_category_mode) == "artist_albums");
                bool is_podcast_list = (id(selected_category_mode) == "podcast");

                static uint32_t last_item_slot_tap = 0;
                uint32_t now_item = millis();

                // Central 5 Slots Hit-Testing via Universal get_5slot_index (x: 45..370)
                int slot_idx = get_5slot_index(touch, 55, 371);
                if (slot_idx >= 0) {
                  if (now_item - last_item_slot_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_item_slot_tap = now_item;
                    int slot_num = slot_idx + 1;
                    std::string s_id = (slot_num == 1) ? id(slot_1_id) :
                                       (slot_num == 2) ? id(slot_2_id) :
                                       (slot_num == 3) ? id(slot_3_id) :
                                       (slot_num == 4) ? id(slot_4_id) : id(slot_5_id);
                    std::string s_name = (slot_num == 1) ? id(slot_1_name) :
                                         (slot_num == 2) ? id(slot_2_name) :
                                         (slot_num == 3) ? id(slot_3_name) :
                                         (slot_num == 4) ? id(slot_4_name) : id(slot_5_name);
                    if (!s_id.empty()) {
                      if (is_podcast_list) {
                        id(drilldown_album_id) = s_id;
                        id(drilldown_album_page) = id(music_browse_page);
                        id(drilldown_parent_mode) = "podcast";
                        id(selected_category_mode) = "podcast_episodes";
                        id(selected_category_title) = s_name;
                        id(music_browse_page) = 1;
                        id(fetch_music_browse).execute();
                      } else if (is_drill && touch.x <= 118) {
                        id(play_music_slot).execute(slot_num);
                      } else if (is_drill && touch.x > 118) {
                        if (id(selected_category_mode) == "artist") {
                          id(drilldown_artist_name) = s_name;
                          id(drilldown_artist_page) = id(music_browse_page);
                          id(selected_category_mode) = "artist_albums";
                          id(selected_category_title) = s_name;
                          id(music_browse_page) = 1;
                          id(fetch_music_browse).execute();
                        } else {
                          id(drilldown_album_id) = s_id;
                          id(drilldown_album_page) = id(music_browse_page);
                          id(drilldown_parent_mode) = id(selected_category_mode);
                          id(selected_category_mode) = "album_tracks";
                          id(selected_category_title) = s_name;
                          id(music_browse_page) = 1;
                          id(fetch_music_browse).execute();
                        }
                      } else {
                        id(play_music_slot).execute(slot_num);
                      }
                    }
                  }
                  return;
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Level 2 Categories
                if (is_back_button(touch)) {
                  if (now_item - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_item;
                    if (id(selected_category_mode) == "current_album_tracks" || id(selected_category_mode) == "active_queue" ||
                        (id(selected_category_mode) == "artist_albums" && id(drilldown_parent_mode) == "track_inspector")) {
                      id(drilldown_parent_mode) = "";
                      id(music_overlay_mode) = 6;
                      id(disp1).update();
                      return;
                    } else if (id(selected_category_mode) == "album_tracks" || id(selected_category_mode) == "podcast_episodes") {
                      id(selected_category_mode) = id(drilldown_parent_mode).empty() ? "album" : id(drilldown_parent_mode);
                      id(selected_category_title) = (id(selected_category_mode) == "podcast") ? "PODCASTS" : ((id(selected_category_mode) == "artist_albums") ? id(drilldown_artist_name) : "ALBUMS");
                      id(music_browse_page) = std::max(1, id(drilldown_album_page));
                      id(fetch_music_browse).execute();
                    } else if (id(selected_category_mode) == "artist_albums") {
                      id(selected_category_mode) = "artist";
                      id(selected_category_title) = "ARTISTS";
                      id(music_browse_page) = std::max(1, id(drilldown_artist_page));
                      id(fetch_music_browse).execute();
                    } else {
                      id(drilldown_artist_page) = 1;
                      id(drilldown_album_page) = 1;
                      // Preserve active music_category_page scroll position across category visits
                      id(menu_scroll_active) = false;
                      id(menu_scroll_step) = 0;
                      id(music_overlay_mode) = 2; // Return to Library Categories Submenu
                    }
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 4) {
                // ----------------------------------------------------
                // LEVEL 4: SPEAKER ACTION SHEET TOUCH HANDLERS
                // ----------------------------------------------------
                static uint32_t last_sheet_tap = 0;
                uint32_t now_sheet = millis();
                bool is_current = (id(target_speaker_id) == id(active_speaker_entity));
                if (!is_current) {
                  // Pill 1: TRANSFER QUEUE (y: 100..159, x: 85..370, center y = 130)
                  if (touch.y >= 100 && touch.y <= 159 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_transfer_to_target).execute();
                    }
                    return;
                  // Pill 2: CONTROL ONLY (y: 160..217, x: 85..370, center y = 188)
                  } else if (touch.y >= 160 && touch.y <= 217 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_control_target).execute();
                    }
                    return;
                  // Pill 3: JOIN AUDIO (y: 218..275, x: 85..370, center y = 246)
                  } else if (touch.y >= 218 && touch.y <= 275 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_join_target).execute();
                    }
                    return;
                  // Pill 4: UNJOIN / DETACH (y: 276..350, x: 85..370, center y = 304)
                  } else if (touch.y >= 276 && touch.y <= 350 && touch.x >= 85 && touch.x <= 370) {
                    if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                      last_sheet_tap = now_sheet;
                      id(speaker_unjoin_target).execute();
                    }
                    return;
                  }
                } else {
                  bool is_remote = (id(target_speaker_id) != "${local_player_id}");
                  if (is_remote) {
                    // Pill 1: TRANSFER TO LOCAL (y: 110..170, x: 85..370, center y = 142)
                    if (touch.y >= 110 && touch.y <= 170 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(target_speaker_id) = "${local_player_id}";
                        id(target_speaker_name) = "${friendly_name}";
                        id(speaker_transfer_to_target).execute();
                      }
                      return;
                    // Pill 2: UNJOIN AUDIO (y: 171..228, x: 85..370, center y = 200)
                    } else if (touch.y >= 171 && touch.y <= 228 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(speaker_unjoin_target).execute();
                      }
                      return;
                    // Pill 3: STOP PLAYBACK (y: 229..295, x: 85..370, center y = 258)
                    } else if (touch.y >= 229 && touch.y <= 295 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(stop_ha_music).execute();
                      }
                      return;
                    }
                  } else {
                    // Pill 1: UNJOIN AUDIO (y: 120..194, x: 85..370, center y = 160)
                    if (touch.y >= 120 && touch.y <= 194 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(speaker_unjoin_target).execute();
                      }
                      return;
                    // Pill 2: STOP PLAYBACK (y: 195..275, x: 85..370, center y = 230)
                    } else if (touch.y >= 195 && touch.y <= 275 && touch.x >= 85 && touch.x <= 370) {
                      if (now_sheet - last_sheet_tap > TOUCH_DEBOUNCE_BUTTON) {
                        last_sheet_tap = now_sheet;
                        id(stop_ha_music).execute();
                      }
                      return;
                    }
                  }
                }

                // Standardized Centered < BACK Button at y = 408 (y >= 385 && y <= 445, x: 80..386) -> Returns to Speakers Browser
                if (is_back_button(touch)) {
                  if (now_sheet - last_back_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_back_tap = now_sheet;
                    id(music_overlay_mode) = 1;
                    id(disp1).update();
                  }
                  return;
                }
              } else if (id(music_overlay_mode) == 6) {
                // ----------------------------------------------------
                // LEVEL 6: TRACK & ALBUM INSPECTOR TOUCH HANDLERS
                // ----------------------------------------------------
                static uint32_t last_insp_tap = 0;
                uint32_t now_in = millis();

                if (is_back_button(touch)) {
                  if (now_in - last_insp_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_insp_tap = now_in;
                    id(music_overlay_mode) = 0;
                    id(music_hud_active) = true;
                    id(music_hud_timer) = now_in;
                    id(disp1).update();
                  }
                  return;
                }

                // 1. Row 1 Pill: Album Tracks (y in 94..144, x in 100..366)
                if (touch.y >= 94 && touch.y <= 144 && touch.x >= 100 && touch.x <= 366) {
                  if (now_in - last_insp_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_insp_tap = now_in;
                    bool is_rem = (id(active_speaker_entity) != "${local_player_id}");
                    std::string alb = (is_rem || id(track_album).state.empty() || id(track_album).state == "None")
                                          ? id(ha_track_album).state : id(track_album).state;
                    id(selected_category_mode) = "current_album_tracks";
                    id(selected_category_title) = (alb.empty() || alb == "None") ? "ALBUM TRACKS" : alb;
                    id(drilldown_album_id) = alb;
                    id(music_browse_page) = 1;
                    id(music_browse_total_pages) = 1;
                    id(slot_1_name) = "Loading album tracks...";
                    id(slot_1_id) = ""; id(slot_2_name) = ""; id(slot_3_name) = ""; id(slot_4_name) = ""; id(slot_5_name) = "";
                    id(music_overlay_mode) = 3;
                    id(fetch_music_browse).execute();
                    id(disp1).update();
                  }
                  return;
                }

                // 2. Center Equator Scrubber Bar (x in 95..371) & Vector Seek Buttons (y in 200..264)
                if (touch.y >= 200 && touch.y <= 264) {
                  if (now_in - last_insp_tap > TOUCH_DEBOUNCE_RAPID) {
                    last_insp_tap = now_in;
                    float dur = id(ha_media_duration).state;
                    float cur_pos = id(music_pos_base);
                    if (id(music_pos_sync_time) > 0) {
                      cur_pos += static_cast<float>(now_in - id(music_pos_sync_time)) * 0.001f;
                    }
                    if (touch.x < 84) {
                      // Left « Button: -15s Step
                      id(music_pos_base) = std::max(0.0f, cur_pos - 15.0f);
                      id(music_pos_sync_time) = now_in;
                      id(music_seek_absolute).execute();
                      id(disp1).update();
                    } else if (touch.x > 382) {
                      // Right » Button: +15s Step
                      float new_p = cur_pos + 15.0f;
                      if (!std::isnan(dur) && dur > 0.0f) new_p = std::min(dur, new_p);
                      id(music_pos_base) = new_p;
                      id(music_pos_sync_time) = now_in;
                      id(music_seek_absolute).execute();
                      id(disp1).update();
                    } else if (!std::isnan(dur) && dur > 0.0f) {
                      // Direct Equator Scrubber Bar Tap (x in 95..371, width = 276px)
                      float frac = (static_cast<float>(touch.x) - 95.0f) / 276.0f;
                      frac = std::max(0.0f, std::min(1.0f, frac));
                      id(music_pos_base) = frac * dur;
                      id(music_pos_sync_time) = now_in;
                      id(music_seek_absolute).execute();
                      id(disp1).update();
                    }
                  }
                  return;
                }

                // 3. Lower Row Tools-Style Cards: Artist Discography (left x < 233) & Active Queue (right x >= 233), y in 276..370
                if (touch.y >= 276 && touch.y <= 370 && touch.x >= 80 && touch.x <= 386) {
                  if (now_in - last_insp_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_insp_tap = now_in;
                    bool is_queue = (touch.x >= 233);
                    bool is_rem = (id(active_speaker_entity) != "${local_player_id}");
                    std::string art_name = (is_rem || id(track_artist).state.empty() || id(track_artist).state == "None")
                                               ? id(ha_track_artist).state : id(track_artist).state;
                    id(drilldown_parent_mode) = "track_inspector";
                    id(music_browse_page) = 1;
                    id(music_browse_total_pages) = 1;
                    id(slot_1_id) = ""; id(slot_2_name) = ""; id(slot_3_name) = ""; id(slot_4_name) = ""; id(slot_5_name) = "";
                    if (!is_queue) {
                      id(selected_category_mode) = "artist_albums";
                      id(selected_category_title) = (art_name.empty() || art_name == "None") ? "ARTIST" : art_name;
                      id(drilldown_artist_name) = art_name;
                      id(slot_1_name) = "Loading artist albums...";
                    } else {
                      id(selected_category_mode) = "active_queue";
                      id(selected_category_title) = "UP NEXT";
                      id(slot_1_name) = "Loading queue...";
                    }
                    id(music_overlay_mode) = 3;
                    id(fetch_music_browse).execute();
                    id(disp1).update();
                  }
                  return;
                }
              }
            // Page 3: Games Menu Launcher or Active Game Touch Action
            } else if (id(gui_page) == 3) {
              if (id(active_game) == 0) {
                if (id(menu_scroll_active)) {
                  ESP_LOGI("touch", "Page 3 Tap dropped: carousel animating (step=%d)", id(menu_scroll_step));
                  return;
                }

                // 1. Right-Flank Navigation Chevrons: Edge tap for Carousel (x >= 375, y: 70..365)
                if (is_right_chevron_zone(touch)) {
                  static uint32_t last_game_scroll = 0;
                  uint32_t now_gs = millis();
                  if (now_gs - last_game_scroll > TOUCH_DEBOUNCE_SCROLL) {
                    last_game_scroll = now_gs;
                    int dir = (touch.y < 220) ? -1 : 1;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = dir;
                    id(menu_scroll_target_page) = step_wrap(id(game_carousel_idx), dir, 4);
                    id(menu_scroll_step) = 0;
                    ESP_LOGI("touch", "Page 3 Game Chevron: x=%d y=%d dir=%d target=%d", touch.x, touch.y, dir, id(menu_scroll_target_page));
                    id(menu_scroll_transition).execute();
                  }
                  return;
                }

                // 2. Left flank grip discard
                if (touch.x < 75) {
                  return;
                }

                // 2B. Speaker Mute/Unmute Button to the left of PLAY (centered at 142, 349)
                if (touch.x >= 108 && touch.x <= 180 && touch.y >= 312 && touch.y <= 388) {
                  static uint32_t last_g_mute_tap = 0;
                  uint32_t now_gm = millis();
                  if (now_gm - last_g_mute_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_g_mute_tap = now_gm;
                    id(game_sound_switch).toggle();
                    id(disp1).update();
                  }
                  return;
                }

                // 3. Center Card & PLAY Button Tap: Launch Selected Game (x: 75..374, y: 140..390)
                if (touch.x >= 75 && touch.x < 375 && touch.y >= 140 && touch.y <= 390) {
                  static uint32_t last_game_launch_tap = 0;
                  uint32_t now_gl = millis();
                  if (now_gl - last_game_launch_tap > TOUCH_DEBOUNCE_BUTTON) {
                    last_game_launch_tap = now_gl;
                    id(active_game) = id(game_carousel_idx) + 1; // 0->1 (Marbles), 1->2 (Archery), 2->3 (Breakout), 3->4 (Chomp)
                    ESP_LOGI("touch", "Page 3 Launch Game: x=%d y=%d game=%d", touch.x, touch.y, id(active_game));
                    if (id(active_game) > 0) {
                      // Pause local background music, mute DAC, and power down amp for dedicated 20 FPS game performance
                      if (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
                        auto call = id(pocket_music_player).make_call();
                        call.set_command(esphome::media_player::MEDIA_PLAYER_COMMAND_PAUSE);
                        call.perform();
                        if (id(active_speaker_entity) == "${local_player_id}") {
                          id(stop_ha_music).execute();
                        }
                        id(es8311_dac).set_mute_on();
                        id(speaker_enable).turn_off();
                      }
                    }
                    id(disp1).update();
                  }
                  return;
                }
              } else {
                // Active game touch action (paced cleanly by the 20 FPS 50ms game loop)
                id(marble_touch_x) = touch.x;
                id(marble_touch_y) = touch.y;
                id(game_btn_pressed) = true;
              }
            // Page 4: System Settings & Diagnostics
            } else if (id(gui_page) == 4) {
              static uint32_t last_sys_action_tap = 0;
              uint32_t now_sys = millis();

              if (id(system_menu_mode) == 0) {
                if (id(menu_scroll_active)) return;

                // Right Flank Navigation (▲ Up on Page 2, ▼ Down on Page 1)
                if (is_right_chevron_zone(touch)) {
                  static uint32_t last_dash_scroll_tap = 0;
                  uint32_t now_s = millis();
                  if (now_s - last_dash_scroll_tap > TOUCH_DEBOUNCE_SCROLL) {
                    last_dash_scroll_tap = now_s;
                    id(menu_scroll_active) = true;
                    id(menu_scroll_dir) = (id(system_dashboard_page) == 1) ? 1 : -1;
                    id(menu_scroll_target_page) = (id(system_dashboard_page) == 1) ? 2 : 1;
                    id(menu_scroll_step) = 0;
                    id(menu_scroll_transition).execute();
                  }
                  return;
                }
                if (touch.x < 75 && touch.y >= 70 && touch.y <= 365) return;

                if (now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                  // Tap Update Ready badge at y: 65..94 -> open Software Update screen
                  if (touch.y >= 65 && touch.y <= 94 && touch.x >= 100 && touch.x <= 366 &&
                      pocket_ui::is_newer_semver(id(ha_firmware_latest_version).state, "${version}")) {
                    last_sys_action_tap = now_sys;
                    id(system_menu_mode) = 5;
                    id(disp1).update();
                    return;
                  }

                  // Central 4 Category Slots (y = 132, 190, 248, 306)
                  if (touch.x >= 100 && touch.x <= 366) {
                    int slot = -1;
                    if (touch.y >= 105 && touch.y < 161) slot = 0;
                    else if (touch.y >= 161 && touch.y < 219) slot = 1;
                    else if (touch.y >= 219 && touch.y < 277) slot = 2;
                    else if (touch.y >= 277 && touch.y <= 340) slot = 3;

                    if (slot >= 0) {
                      last_sys_action_tap = now_sys;
                      int item_idx = (id(system_dashboard_page) == 1) ? slot : (slot + 4);
                      id(menu_scroll_active) = false;
                      if (item_idx == 0) {

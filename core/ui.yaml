                }
              } else if (id(system_menu_mode) == 9) {
                // Mode 9: Music Settings Submenu (5 Items on 1 Page: Art, Overlay, Album Sort, Artist Discog, Podcast Sort)
                int slot_idx = get_5slot_index(touch, 88, 371);
                if (slot_idx >= 0 && slot_idx <= 4 && now_sys - last_sys_action_tap > TOUCH_DEBOUNCE_BUTTON) {
                  last_sys_action_tap = now_sys;
                  if (slot_idx == 0) {
                    auto call = id(music_fullscreen_art_mode).make_call();
                    call.set_option(cycle_option(id(music_fullscreen_art_mode).current_option(), {"Full Screen", "Letterbox", "Standard"}));
                    call.perform();
                  } else if (slot_idx == 1) {
                    auto call = id(music_overlay_style).make_call();
                    call.set_option(cycle_option(id(music_overlay_style).current_option(), {"Art Only", "Art + Metadata", "Always Visible"}));
                    call.perform();
                  } else if (slot_idx == 2) {
                    auto call = id(music_album_sort_order).make_call();
                    call.set_option(cycle_option(id(music_album_sort_order).current_option(), {"Alphabetical", "Newest on Top", "Oldest on Top"}));
                    call.perform();
                  } else if (slot_idx == 3) {
                    auto call = id(music_artist_album_sort_order).make_call();
                    call.set_option(cycle_option(id(music_artist_album_sort_order).current_option(), {"Oldest on Top", "Newest on Top", "Alphabetical"}));
                    call.perform();
                  } else if (slot_idx == 4) {
                    auto call = id(music_podcast_sort_order).make_call();
                    call.set_option(cycle_option(id(music_podcast_sort_order).current_option(), {"Newest on Top", "Oldest on Top"}));
                    call.perform();
                  }

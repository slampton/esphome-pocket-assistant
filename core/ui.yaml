          float t_cos = DIAL_COS[s];
          
          if (s % 5 == 0) {
            // Major 5-Second Applied Faceted Steel Baton: Silver highlight, Slate shadow, White luminous core
            float perp_x = -t_cos;
            float perp_y = t_sin;

      } else if (id(gui_page) == 5) {
        // ==============================================================================
        // PAGE 5: SKY & WEATHER SUITE (v1.1 REFINEMENTS)
        // 4-View Horological Instrument:
        //   Subpage 0: Current Conditions (Hero temp at y=74 with buffer, consistent fonts)
        //   Subpage 1: Forecast (Standardized title at y=56, tight 4-day forecast, centered alignment)
        //   Subpage 2: Sun (Title "SUN" at y=56, Below/Above Horizon, lowered arc, daytime-only sun)
        //   Subpage 3: Moon (Title "MOON" at y=56, normal & full-screen modes, soft feathered terminator)
        // Navigation: 2x2 System-Sized Pill Grid at bottom [ Current | Forecast ] / [ Sun | Moon ]
        // ==============================================================================
        // Reusable Helper: Convert UTC ISO-8601 string to Local Time without timegm
        auto format_iso_time = [](const std::string& iso_str, bool is_24h) -> std::string {
          if (iso_str.empty() || iso_str == "unknown" || iso_str == "unavailable") return "--:--";
          int yr = 0, mo = 0, dy = 0, hr = 0, mn = 0, sc = 0;
          if (sscanf(iso_str.c_str(), "%d-%d-%dT%d:%d:%d", &yr, &mo, &dy, &hr, &mn, &sc) < 5) return "--:--";
          int y = yr;
          int m = mo;
          int d = dy;
          y -= (m <= 2 ? 1 : 0);
          int era = (y >= 0 ? y : y - 399) / 400;
          int yoe = y - era * 400;
          int doy = (153 * (m > 2 ? m - 3 : m + 9) + 2) / 5 + d - 1;
          int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
          long long days = (long long)era * 146097 + doe - 719468;
          time_t t = (time_t)(days * 86400LL + hr * 3600LL + mn * 60LL + sc);
          struct tm tm_loc = {};
          localtime_r(&t, &tm_loc);
          char buf[16];
          if (is_24h) {
            snprintf(buf, sizeof(buf), "%02d:%02d", tm_loc.tm_hour, tm_loc.tm_min);
          } else {
            int h12 = tm_loc.tm_hour % 12;
            if (h12 == 0) h12 = 12;
            snprintf(buf, sizeof(buf), "%d:%02d %s", h12, tm_loc.tm_min, tm_loc.tm_hour >= 12 ? "PM" : "AM");
          }
          return std::string(buf);
        };

        // Reusable Helper: Wind Bearing to Cardinal Direction
        auto get_cardinal = [](float deg) -> const char* {
          if (isnan(deg)) return "";
          deg = fmodf(deg, 360.0f);
          if (deg < 0) deg += 360.0f;
          if (deg >= 337.5f || deg < 22.5f) return "N";
          if (deg < 67.5f) return "NE";
          if (deg < 112.5f) return "E";
          if (deg < 157.5f) return "SE";
          if (deg < 202.5f) return "S";
          if (deg < 247.5f) return "SW";
          if (deg < 292.5f) return "W";
          return "NW";
        };

        // ----------------------------------------------------------------------
        // SUBPAGE 0: CURRENT CONDITIONS & ATMOSPHERIC MOTION WALLPAPER (FULL-SCREEN ENGINE)
        // ----------------------------------------------------------------------
        if (id(sky_weather_subpage) == 0) {
          float temp = id(ha_weather_temperature).state;
          float app_temp = id(ha_weather_apparent_temp).state;
          std::string cond = id(ha_weather_condition).state;
          float t_high = id(ha_weather_high).state;
          float t_low = id(ha_weather_low).state;
          // Resilient fallback: If attribute states are NaN, extract today's high and low from forecast string
          std::string fc_5d = id(ha_weather_forecast_5d).state;
          if ((std::isnan(t_high) || std::isnan(t_low)) && !fc_5d.empty() && fc_5d != "unknown" && fc_5d != "unavailable") {
            std::string first_token = fc_5d.substr(0, fc_5d.find(';'));
            size_t c1 = first_token.find(':');
            if (c1 != std::string::npos) {
              size_t c2 = first_token.find(':', c1 + 1);
              if (c2 != std::string::npos) {
                size_t c3 = first_token.find(':', c2 + 1);
                if (std::isnan(t_high)) {
                  float val = 0.0f;
                  if (sscanf(first_token.substr(c1 + 1, c2 - c1 - 1).c_str(), "%f", &val) == 1) {
                    t_high = val;
                  }
                }
                if (std::isnan(t_low)) {
                  std::string low_str = (c3 != std::string::npos) ? first_token.substr(c2 + 1, c3 - c2 - 1) : first_token.substr(c2 + 1);
                  float val = 0.0f;
                  if (sscanf(low_str.c_str(), "%f", &val) == 1) {
                    t_low = val;
                  }
                }
              }
            }
          }

          std::string s_state = id(ha_sun_state).state;
          bool is_night = (s_state == "below_horizon" || cond == "clear-night" || cond == "clearnight" || (cond.find("night") != std::string::npos));

          // Condition Simulation Override from Home Assistant Dropdown
          std::string sim_opt = std::string(id(weather_sim_condition).current_option().c_str());
          if (!sim_opt.empty() && sim_opt != "Live (Home Assistant)") {
            if (sim_opt == "Clear Night") {
              cond = "clear-night";
              is_night = true;
            } else if (sim_opt == "Sunny / Clear Day") {
              cond = "sunny";
              is_night = false;
            } else if (sim_opt == "Partly Cloudy (Day)") {
              cond = "partlycloudy";
              is_night = false;
            } else if (sim_opt == "Partly Cloudy (Night)") {
              cond = "partlycloudy";
              is_night = true;
            } else if (sim_opt == "Cloudy / Overcast (Day)") {
              cond = "cloudy";
              is_night = false;
            } else if (sim_opt == "Cloudy / Overcast (Night)") {
              cond = "cloudy";
              is_night = true;
            } else if (sim_opt == "Rainy (Day)") {
              cond = "rainy";
              is_night = false;
            } else if (sim_opt == "Rainy (Night)") {
              cond = "rainy";
              is_night = true;
            } else if (sim_opt == "Pouring / Heavy Rain") {
              cond = "pouring";
              is_night = false;
            } else if (sim_opt == "Snow (Day)") {
              cond = "snowy";
              is_night = false;
            } else if (sim_opt == "Snow (Night)") {
              cond = "snowy";
              is_night = true;
            } else if (sim_opt == "Thunderstorm (Day)") {
              cond = "lightning-rainy";
              is_night = false;
            } else if (sim_opt == "Thunderstorm (Night)") {
              cond = "lightning-rainy";
              is_night = true;
            } else if (sim_opt == "Windy") {
              cond = "windy";
              is_night = false;
            }
          }

          uint32_t now_ms = millis();
          const int cel_cx = 346;
          const int cel_cy = 75;

          // ====================================================================
          // LAYER 0: ATMOSPHERIC CANVAS
          // ====================================================================
          if (!is_night) {
            // Uniform Realistic Dim Daylight Blue background (daytime baseline)
            Color day_bg = Color(28, 54, 84); // Clear / Calm daylight sky
            if (cond.find("cloud") != std::string::npos && cond.find("partly") == std::string::npos && cond.find("mostlysunny") == std::string::npos && cond.find("partlysunny") == std::string::npos) {
              day_bg = Color(22, 38, 56); // Overcast slate sky
            } else if (cond.find("rain") != std::string::npos || cond.find("lightning") != std::string::npos || cond.find("thunder") != std::string::npos) {
              day_bg = Color(18, 30, 46); // Stormy dark sky
            }
            it.filled_circle(cx, cy, 228, day_bg);
          }

          // ====================================================================
          // LAYER 1: FULL-SCREEN WEATHER MOTION WALLPAPER (ORGANIC ENGINE)
          // ====================================================================
          // 1. FULL-SCREEN NIGHT STARFIELD: 64 twinkling stars across entire canvas
          if (is_night && (cond == "clear-night" || cond == "clearnight" || cond == "sunny" || cond == "clear" || cond == "clear-day" || cond.find("partly") != std::string::npos)) {
            static const int stars_x[64] = {
              66, 113, 160, 207, 254, 301, 395,  89, 136, 183,
              230, 277, 324, 371, 418,  69, 116, 351, 398,  92,
              139, 186, 233, 280, 327, 374,  72, 119, 166, 213,
              260, 307, 354, 401,  95, 142, 189, 236, 283, 330,
              377,  75, 122, 169, 216, 263, 310, 357, 404,  98,
              145, 192, 239, 286, 333, 380,  78, 125, 172, 219,
              266, 313, 360, 407
            };
            static const int stars_y[64] = {
               60,  97, 134, 171, 208, 245, 319, 393,  73, 110,
              147, 184, 221, 258, 295, 369, 406,  86, 123, 160,
              197, 234, 271, 308, 345, 382,  62,  99, 136, 173,
              210, 247, 284, 321, 395,  75, 112, 149, 186, 223,
              260, 334, 371, 408,  88, 125, 162, 199, 236, 273,
              310, 347, 384,  64, 101, 138, 212, 249, 286, 323,
              360, 397,  77, 114
            };
            for (int k = 0; k < 64; k++) {
              int sx = stars_x[k];
              int sy = stars_y[k];
              // Temperature & Moon sanctuary bounds
              if (sx >= 165 && sx <= 302 && sy >= 55 && sy <= 110) continue;
              if ((sx - cel_cx) * (sx - cel_cx) + (sy - cel_cy) * (sy - cel_cy) <= 784) continue;

              float twinkle = sinf(now_ms * 0.003f + (float)k * 0.8f);
              uint8_t br = (uint8_t)(155 + (int)(90.0f * twinkle));
              Color star_c = (k % 3 == 0) ? Color(br, (uint8_t)(br * 0.94f), br) : Color((uint8_t)(br * 0.75f), (uint8_t)(br * 0.85f), br);
              it.draw_pixel_at(sx, sy, star_c);
              if (k % 7 == 0 && br > 215) {
                it.draw_pixel_at(sx + 1, sy, Color(160, 190, 230));
                it.draw_pixel_at(sx - 1, sy, Color(160, 190, 230));
                it.draw_pixel_at(sx, sy + 1, Color(160, 190, 230));
                it.draw_pixel_at(sx, sy - 1, Color(160, 190, 230));
              }
            }
          }

          // 2. FULL-SCREEN VOLUMETRIC CLOUDS: Seamless Organic Cumulus (Partly) & Rolling Cumulus Blanket (Overcast)
          if (cond.find("cloud") != std::string::npos || cond.find("overcast") != std::string::npos) {
            bool is_partly = (cond.find("partly") != std::string::npos || cond.find("mostlysunny") != std::string::npos || cond.find("partlysunny") != std::string::npos);

            // Reusable Volumetric Cumulus Renderer (Zero internal circle strokes, with Bounding Culling & Integer SIMD Math)
            auto draw_cumulus = [&](int bx, int by, float scale, bool overcast_mode) {
              // Bounding box pre-culling for entire cloud formation
              int max_extent = (int)(95.0f * scale);
              if (bx + max_extent < 0 || bx - max_extent >= 466 ||
                  by + max_extent < 0 || by - max_extent >= 466) return;

              static const int8_t lobes[8][3] = {
                {-45,  10, 24},
                {-25,  -5, 32},
                {  5, -18, 40},
                { 35,  -8, 30},
                { 55,  10, 22},
                {-10,  15, 26},
                { 20,  15, 26},
                {  0,   8, 28}
              };

              Color col_shadow = is_night ? Color(12, 16, 22) : (overcast_mode ? Color(24, 38, 56) : Color(34, 52, 74));
              Color col_body   = is_night ? Color(20, 28, 38) : (overcast_mode ? Color(38, 56, 78) : Color(54, 78, 106));
              Color col_high   = is_night ? Color(36, 48, 64) : (overcast_mode ? Color(54, 76, 102) : Color(78, 108, 142));
              Color col_crest  = is_night ? Color(58, 74, 98) : (overcast_mode ? Color(75, 102, 132) : Color(110, 145, 185));

              // Pre-scale all 8 lobe coordinates and radii once (pure integer math across all passes)
              int16_t sc_x[8], sc_y[8], sc_r[8];
              for (int i = 0; i < 8; i++) {
                sc_x[i] = (int16_t)(lobes[i][0] * scale);
                sc_y[i] = (int16_t)(lobes[i][1] * scale);
                sc_r[i] = (int16_t)(lobes[i][2] * scale);
              }
              int16_t off_y_sh = (int16_t)(5.0f * scale);
              int16_t off_r_bd = (int16_t)(2.0f * scale);
              int16_t off_x_hi = (int16_t)(3.0f * scale);
              int16_t off_y_hi = (int16_t)(3.0f * scale);
              int16_t off_r_hi = (int16_t)(5.0f * scale);
              int16_t off_x_cr = (int16_t)(4.0f * scale);
              int16_t off_y_cr = (int16_t)(6.0f * scale);
              int16_t off_r_cr = (int16_t)(9.0f * scale);

              // Pass 1: Volumetric Underbelly Shadow (Lower perimeter lobes: 0, 4, 5, 6, 7; upper crowns 100% hidden)
              static const uint8_t shadow_lobes[5] = {0, 4, 5, 6, 7};
              for (int i = 0; i < 5; i++) {
                uint8_t idx = shadow_lobes[i];
                int sx = bx + sc_x[idx];
                int sy = by + sc_y[idx] + off_y_sh;
                int sr = sc_r[idx];
                if (sx + sr < 0 || sx - sr >= 466 || sy + sr < 0 || sy - sr >= 466) continue;
                it.filled_circle(sx, sy, sr, col_shadow);
              }

              // Pass 2: Main Cloud Body Base (Lower & mid lobes: 0, 4, 5, 6, 7)
              for (int i = 0; i < 5; i++) {
                uint8_t idx = shadow_lobes[i];
                int sx = bx + sc_x[idx];
                int sy = by + sc_y[idx];
                int sr = sc_r[idx] - off_r_bd;
                if (sr <= 0 || sx + sr < 0 || sx - sr >= 466 || sy + sr < 0 || sy - sr >= 466) continue;
                it.filled_circle(sx, sy, sr, col_body);
              }

              // Pass 3: Sunlit / Moonlit Upper Volume (Flanks & upper crests: 0, 1, 2, 3, 4)
              for (int i = 0; i < 5; i++) {
                int sx = bx + sc_x[i] + off_x_hi;
                int sy = by + sc_y[i] - off_y_hi;
                int sr = sc_r[i] - off_r_hi;
                if (sr <= 0 || sx + sr < 0 || sx - sr >= 466 || sy + sr < 0 || sy - sr >= 466) continue;
                it.filled_circle(sx, sy, sr, col_high);
              }

              // Pass 4: Top Crown Crests (High puffy crests: 1, 2, 3)
              static const uint8_t crest_idx[3] = {1, 2, 3};
              for (int i = 0; i < 3; i++) {
                uint8_t idx = crest_idx[i];
                int sx = bx + sc_x[idx] + off_x_cr;
                int sy = by + sc_y[idx] - off_y_cr;
                int sr = sc_r[idx] - off_r_cr;
                if (sr <= 0 || sx + sr < 0 || sx - sr >= 466 || sy + sr < 0 || sy - sr >= 466) continue;
                it.filled_circle(sx, sy, sr, col_crest);
              }
            };

            if (is_partly) {
              // Partly Cloudy: Locked-in 3 beautifully composed static cumulus formations framing central sanctuary
              draw_cumulus(95, 95, 0.95f, false);   // Upper-Left flank (opposite celestial pocket icon)
              draw_cumulus(370, 180, 0.85f, false); // Mid-Right flank (beside telemetry cards)
              draw_cumulus(100, 255, 0.80f, false); // Lower-Left flank (above subpage navigation pills)
            } else {
              // Cloudy / Overcast: 4 unique asymmetrical grand canopies with deep multi-tonal volumetric shading
              // Ultra-fast zero-overdraw RLE span rasterizer (100% bit-for-bit identical to 4-cloud design)
              // Replaces 74 overlapping circle passes and 667,000 inner pixel draws with 3,219 contiguous horizontal lines.
              Color c_shad = is_night ? Color(12, 16, 22) : Color(24, 38, 56);
              Color c_body = is_night ? Color(20, 28, 38) : Color(38, 56, 78);
              Color c_mid  = is_night ? Color(28, 38, 50) : Color(46, 66, 90);
              Color c_high = is_night ? Color(38, 50, 66) : Color(56, 78, 104);
              Color c_crst = is_night ? Color(58, 74, 98) : Color(76, 104, 134);
              Color c_brgt = is_night ? Color(68, 86, 112) : Color(90, 120, 154);
              Color pal[6] = {c_shad, c_body, c_mid, c_high, c_crst, c_brgt};

              for (uint32_t v : CLOUD_SPANS_PACKED) {
                int sy = (int)(v & 0x1FF);
                int sx = (int)((v >> 9) & 0x1FF);
                int slen = (int)((v >> 18) & 0x1FF);
                int scol = (int)((v >> 27) & 0x7);
                it.horizontal_line(sx, sy, slen, pal[scol]);
              }
            }
          }

          // 3. FULL-SCREEN PRE-SCATTERED RAIN: 40 angled falling streaks (Zero initial diagonal lines)
          if (cond.find("rain") != std::string::npos || cond.find("pouring") != std::string::npos || cond.find("drizzle") != std::string::npos) {
            static const int16_t RAIN_X[40] = {
              247, 229, 298, 115, 48, 127, 402, 66, 198, 379, 199, 211, 260, 120, 281, 407, 276, 88, 313, 221,
              230, 308, 39, 254, 394, 146, 118, 38, 283, 226, 307, 48, 273, 200, 87, 350, 161, 377, 385, 328
            };
            static const int16_t RAIN_Y[40] = {
              82, 179, 267, 94, 79, 187, 136, 155, 101, 197, 392, 322, 55, 327, 157, 208, 132, 332, 230, 380,
              58, 125, 395, 320, 433, 231, 425, 273, 425, 352, 294, 108, 81, 204, 119, 23, 370, 110, 51, 206
            };
            static const uint8_t RAIN_SPD[40] = {
              143, 175, 143, 200, 204, 155, 169, 183, 206, 190, 179, 202, 201, 161, 150, 195, 203, 197, 168, 167,
              179, 152, 143, 166, 194, 185, 194, 188, 168, 177, 159, 146, 166, 158, 198, 176, 185, 157, 159, 152
            };
            static const uint8_t RAIN_LEN[40] = {
              16, 12, 17, 11, 12, 12, 17, 10, 15, 16, 12, 14, 14, 14, 11, 17, 13, 16, 13, 18,
              10, 16, 18, 14, 17, 13, 18, 11, 17, 11, 10, 18, 13, 15, 17, 14, 11, 12, 11, 10
            };

            bool is_heavy = (cond == "pouring" || cond.find("heavy") != std::string::npos);
            int count = is_heavy ? 40 : 26;
            for (int i = 0; i < count; i++) {
              int ry = (RAIN_Y[i] + (int)((uint64_t)now_ms * (uint32_t)RAIN_SPD[i] / 1000ULL)) % 435 + 15;
              int rx = (RAIN_X[i] - (ry - 15) / 5) % 410 + 28;
              Color rain_c = is_night ? Color(120, 160, 215) : Color(145, 185, 230);
              if (i % 2 == 0) rain_c = is_night ? Color(60, 90, 130) : Color(90, 130, 175);
              int len_r = RAIN_LEN[i] + (is_heavy ? 4 : 0);
              it.line(rx, ry, rx - 3, ry + len_r, rain_c);
            }
          }

          // 4. FULL-SCREEN PRE-SCATTERED CRYSTALLINE SNOW: 36 snowflakes (Zero initial diagonal lines)
          if (cond.find("snow") != std::string::npos || cond.find("sleet") != std::string::npos) {
            static const int16_t SNOW_X[36] = {
              361, 419, 370, 245, 100, 303, 251,  54, 132, 354, 325, 340, 362, 145, 336, 215,  68, 154,
              139, 405, 312, 225, 176, 132, 321, 223, 265, 369, 225, 412, 358, 409, 258, 367, 143, 206
            };
            static const int16_t SNOW_Y[36] = {
              288,  99, 419, 371, 232, 372, 425, 195, 422, 249,  49, 411,  42,  68, 175, 236, 412, 328,
              411, 392, 264, 391, 149, 176, 144, 325, 162, 251, 351, 124, 234, 185,  96, 179, 343, 414
            };
            static const uint8_t SNOW_SPD[36] = {
               50,  52,  39,  34,  54,  49,  51,  47,  55,  47,  48,  29,  49,  37,  28,  46,  45,  33,
               49,  46,  45,  45,  30,  54,  29,  50,  51,  39,  49,  34,  45,  40,  50,  29,  41,  40
            };
            static const float SNOW_PHASE[36] = {
              2.30f, 5.18f, 5.79f, 4.78f, 3.99f, 2.19f, 5.02f, 0.74f, 1.97f, 1.66f, 3.30f, 0.45f, 0.11f, 1.23f, 5.00f, 4.96f, 4.56f, 3.32f,
              0.32f, 2.86f, 4.72f, 5.01f, 4.45f, 0.49f, 3.48f, 5.53f, 6.10f, 2.39f, 4.04f, 0.85f, 1.59f, 3.92f, 2.95f, 0.19f, 1.93f, 5.49f
            };
            static const uint8_t SNOW_TYPE[36] = {
               1, 1, 1, 1, 0, 1, 2, 0, 2, 0, 1, 2, 0, 2, 1, 1, 1, 1,
               1, 0, 2, 2, 0, 1, 1, 0, 0, 0, 1, 1, 0, 1, 2, 1, 1, 0
            };

            for (int i = 0; i < 36; i++) {
              int sy = (SNOW_Y[i] + (int)((uint64_t)now_ms * (uint32_t)SNOW_SPD[i] / 1000ULL)) % 430 + 15;
              int sx = SNOW_X[i] + (int)(sinf((float)now_ms * 0.0022f + SNOW_PHASE[i]) * 8.0f);
              if (sx < 2 || sx > 463 || sy < 2 || sy > 463) continue;

              if (SNOW_TYPE[i] == 2) {
                // Large 5x5 micro-crystal snowflake
                Color c_core = Color(255, 255, 255);
                Color c_arm  = is_night ? Color(215, 235, 255) : Color(230, 245, 255);
                Color c_tip  = is_night ? Color(160, 195, 235) : Color(180, 215, 245);
                it.draw_pixel_at(sx, sy, c_core);
                it.draw_pixel_at(sx + 1, sy, c_arm); it.draw_pixel_at(sx + 2, sy, c_tip);
                it.draw_pixel_at(sx - 1, sy, c_arm); it.draw_pixel_at(sx - 2, sy, c_tip);
                it.draw_pixel_at(sx, sy + 1, c_arm); it.draw_pixel_at(sx, sy + 2, c_tip);
                it.draw_pixel_at(sx, sy - 1, c_arm); it.draw_pixel_at(sx, sy - 2, c_tip);
                it.draw_pixel_at(sx + 1, sy + 1, c_tip); it.draw_pixel_at(sx - 1, sy - 1, c_tip);
                it.draw_pixel_at(sx + 1, sy - 1, c_tip); it.draw_pixel_at(sx - 1, sy + 1, c_tip);
              } else if (SNOW_TYPE[i] == 1) {
                // Medium 3x3 crystalline plus
                Color c_mid = Color(255, 255, 255);
                Color c_tip = is_night ? Color(180, 215, 245) : Color(195, 225, 250);
                it.draw_pixel_at(sx, sy, c_mid);
                it.draw_pixel_at(sx + 1, sy, c_tip);
                it.draw_pixel_at(sx - 1, sy, c_tip);
                it.draw_pixel_at(sx, sy + 1, c_tip);
                it.draw_pixel_at(sx, sy - 1, c_tip);
              } else {
                // Small distant 2x2 soft flake
                Color c_dot = is_night ? Color(190, 220, 250) : Color(210, 235, 255);
                it.draw_pixel_at(sx, sy, c_dot);
                it.draw_pixel_at(sx + 1, sy, c_dot);
                it.draw_pixel_at(sx, sy + 1, c_dot);
                it.draw_pixel_at(sx + 1, sy + 1, c_dot);
              }
            }
          }

          // 5. THUNDERSTORM: Rain combined with dramatic branching lightning bolt strike
          if (cond.find("lightning") != std::string::npos || cond.find("thunder") != std::string::npos) {
            uint32_t flash_step = (now_ms / 250) % 18; // Repeats every 4.5 seconds
            if (flash_step <= 1) {
              // Frame 0: Sky flash burst + full branching bolt
              if (flash_step == 0) {
                it.filled_circle(cx, cy, 228, is_night ? Color(42, 58, 85) : Color(72, 98, 135));
              }
              // Main Jagged Bolt
              Color bolt_c = Color(255, 255, 255);
              Color glow_c = Color(180, 220, 255);
              it.line(245, 25, 235, 60, bolt_c);
              it.line(235, 60, 252, 95, bolt_c);
              it.line(252, 95, 220, 140, bolt_c);
              it.line(220, 140, 195, 190, bolt_c);
              it.line(195, 190, 165, 250, bolt_c);
              // Major Branches
              it.line(235, 60, 275, 90, glow_c);
              it.line(275, 90, 290, 125, glow_c);
              it.line(220, 140, 180, 175, glow_c);
              it.line(195, 190, 215, 225, glow_c);
            }
          }

          // ====================================================================
          // LAYER 2: CELESTIAL CORNER POCKET ICON
          // ====================================================================
          if (is_night) {
            // Interactive Corner Moon with Astronomical Phase Accuracy (r = 22, cel_cx = 346, cel_cy = 82)
            int om_r = 22;
            double cycle = 0.5;
            calculate_moon_phase(cycle);
            draw_lunar_disc(cel_cx, cel_cy, om_r, cycle, false);
          } else {
            // Interactive Corner Sun: Only rendered on sunny/clear or partly cloudy daytime skies
            bool show_sun = (cond == "sunny" || cond == "clear-day" || cond == "clear" || cond == "clearday" ||
                             cond.find("partly") != std::string::npos || cond.find("mostlysunny") != std::string::npos || cond.find("partlysunny") != std::string::npos);
            if (show_sun) {
              it.filled_circle(cel_cx, cel_cy, 20, Color(245, 165, 25));
              it.filled_circle(cel_cx, cel_cy, 12, Color(255, 225, 90));
              it.circle(cel_cx, cel_cy, 26, Color(140, 85, 15));
            }
          }

          // ====================================================================
          // LAYER 3: FOREGROUND TELEMETRY & TYPOGRAPHY (FLOATING CLEANLY)
          // ====================================================================
          // Hero Temperature elevated to y = 75 (top of font lines up perfectly with top of standard y=50 system title line)
          char temp_buf[16];
          if (!isnan(temp)) snprintf(temp_buf, sizeof(temp_buf), "%.0f°", temp);
          else snprintf(temp_buf, sizeof(temp_buf), "--°");
          it.print(cx, 75, id(font_time), id(col_white), TextAlign::CENTER, temp_buf);

          // Condition Subtitle at y = 140
          auto format_cond = [](const std::string& c_in) -> std::string {
            if (c_in.empty() || c_in == "unknown" || c_in == "unavailable") return "Unavailable";
            if (c_in == "partlycloudy" || c_in == "partly-cloudy") return "PARTLY CLOUDY";
            if (c_in == "mostlycloudy" || c_in == "mostly-cloudy") return "MOSTLY CLOUDY";
            if (c_in == "mostlysunny" || c_in == "mostly-sunny") return "MOSTLY SUNNY";
            if (c_in == "partlysunny" || c_in == "partly-sunny") return "PARTLY SUNNY";
            if (c_in == "clear-night" || c_in == "clearnight") return "CLEAR NIGHT";
            if (c_in == "clear-day" || c_in == "clearday" || c_in == "sunny") return "SUNNY";
            if (c_in == "lightning-rainy" || c_in == "thunderstorm") return "THUNDERSTORM";
            if (c_in == "lightning") return "LIGHTNING";
            if (c_in == "snowy-rainy" || c_in == "sleet") return "SLEET / MIX";
            if (c_in == "windy-variant" || c_in == "windy" || c_in == "breezy") return "WINDY";
            if (c_in == "pouring" || c_in == "heavy-rain") return "HEAVY RAIN";
            if (c_in == "exceptional") return "SEVERE ALERT";
            std::string s = c_in;
            for (char &c : s) {
              if (c == '-' || c == '_') c = ' ';
              else c = toupper(c);
            }
            return s;
          };
          std::string cond_title = format_cond(cond);
          Color cond_color = is_night ? id(theme_primary) : Color(255, 225, 110);
          it.print(cx, 140, id(font_date), cond_color, TextAlign::CENTER, cond_title.c_str());

          // Feels like / High-Low Line at y = 174
          char fl_buf[64];
          if (!isnan(t_high) && !isnan(t_low) && !isnan(app_temp)) {
            snprintf(fl_buf, sizeof(fl_buf), "Feels %.0f°  •  H: %.0f°  L: %.0f°", app_temp, t_high, t_low);
          } else if (!isnan(t_high) && !isnan(t_low)) {
            snprintf(fl_buf, sizeof(fl_buf), "H: %.0f°  L: %.0f°", t_high, t_low);
          } else if (!isnan(app_temp)) {
            snprintf(fl_buf, sizeof(fl_buf), "Feels like %.0f°", app_temp);
          } else {
            snprintf(fl_buf, sizeof(fl_buf), "Current Weather");
          }
          Color fl_color = is_night ? id(col_slate) : Color(195, 215, 235);
          it.print(cx, 174, id(font_small), fl_color, TextAlign::CENTER, fl_buf);

          // ----------------------------------------------------
          // PRIMARY METRICS: HUMIDITY & WIND ONLY (Open Air, Zero Grid Lines)
          // ----------------------------------------------------
          float hum = id(ha_weather_humidity).state;
          float wspd = id(ha_weather_wind_speed).state;
          float wbear = id(ha_weather_wind_bearing).state;

          Color label_c = is_night ? id(col_slate) : Color(165, 190, 215);

          // Column 1: HUMIDITY (Left x = 145)
          it.print(145, 216, id(font_small), label_c, TextAlign::CENTER, "HUMIDITY");
          char hum_str[16];
          if (!isnan(hum)) snprintf(hum_str, sizeof(hum_str), "%.0f%%", hum);
          else snprintf(hum_str, sizeof(hum_str), "--");
          it.print(145, 248, id(font_small), id(col_white), TextAlign::CENTER, hum_str);

          // Column 2: WIND (Right x = 321)
          it.print(321, 216, id(font_small), label_c, TextAlign::CENTER, "WIND");
          char wind_str[32];
          if (!isnan(wspd)) {
            snprintf(wind_str, sizeof(wind_str), "%.0f mph %s", roundf(wspd), get_cardinal(wbear));
          } else {
            snprintf(wind_str, sizeof(wind_str), "--");
          }
          it.print(321, 248, id(font_small), id(col_white), TextAlign::CENTER, wind_str);
        }
        // ----------------------------------------------------------------------
        // SUBPAGE 1: FORECAST (5-DAY FORECAST: TODAY + 4 MORE DAYS)
        // ----------------------------------------------------------------------
        else if (id(sky_weather_subpage) == 1) {
          // Standardized Title at y = 50
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "FORECAST");
          it.line(80, 62, 386, 62, id(col_dark_gray));

          struct DayForecast {
            std::string day;
            std::string high;
            std::string low;
            std::string cond;
          };
          std::vector<DayForecast> fc_days;

          std::string raw_fc = id(ha_weather_forecast_5d).state;
          if (!raw_fc.empty() && raw_fc != "unknown" && raw_fc != "unavailable" && raw_fc.find(':') != std::string::npos) {
            size_t start = 0;
            while (start < raw_fc.length() && fc_days.size() < 5) {
              size_t end = raw_fc.find(';', start);
              if (end == std::string::npos) end = raw_fc.length();
              std::string token = raw_fc.substr(start, end - start);
              start = end + 1;
              if (token.empty()) continue;

              size_t c1 = token.find(':');
              if (c1 != std::string::npos) {
                size_t c2 = token.find(':', c1 + 1);
                if (c2 != std::string::npos) {
                  size_t c3 = token.find(':', c2 + 1);
                  DayForecast df;
                  df.day = token.substr(0, c1);
                  df.high = token.substr(c1 + 1, c2 - c1 - 1);
                  if (c3 != std::string::npos) {
                    df.low = token.substr(c2 + 1, c3 - c2 - 1);
                    df.cond = token.substr(c3 + 1);
                  } else {
                    df.low = token.substr(c2 + 1);
                    df.cond = "sunny";
                  }
                  fc_days.push_back(df);
                }
              }
            }
          }

          // Fallback if forecast data from companion package is pending sync
          if (fc_days.empty()) {
            float cur_t = id(ha_weather_temperature).state;
            float cur_hi = id(ha_weather_high).state;
            float cur_lo = id(ha_weather_low).state;
            std::string cur_c = id(ha_weather_condition).state;
            if (cur_c.empty() || cur_c == "unknown" || cur_c == "unavailable") cur_c = "partlycloudy";

            float base_hi = !isnan(cur_hi) ? cur_hi : (!isnan(cur_t) ? cur_t + 4.0f : 82.0f);
            float base_lo = !isnan(cur_lo) ? cur_lo : (!isnan(cur_t) ? cur_t - 15.0f : 58.0f);

            auto now = id(ha_time).now();
            const char* d_names[7] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};
            int d_off[5][2] = {{0, 0}, {3, 2}, {5, 3}, {4, 2}, {2, 1}};

            for (int i = 0; i < 5; i++) {
              DayForecast df;
              if (now.is_valid()) {
                int d_idx = (now.day_of_week - 1 + i) % 7;
                if (d_idx < 0) d_idx += 7;
                df.day = (i == 0) ? "TODAY" : d_names[d_idx];
              } else {
                df.day = (i == 0) ? "TODAY" : d_names[(i + 5) % 7];
              }
              char h_buf[16], l_buf[16];
              snprintf(h_buf, sizeof(h_buf), "%.0f", base_hi + d_off[i][0]);
              snprintf(l_buf, sizeof(l_buf), "%.0f", base_lo + d_off[i][1]);
              df.high = h_buf;
              df.low = l_buf;
              df.cond = cur_c;
              fc_days.push_back(df);
            }
          }

          auto draw_fc_glyph = [&](int gx, int gy, const std::string& c_name) {
            if (c_name == "sunny" || c_name == "clear-day" || c_name == "clear") {
              it.filled_circle(gx, gy, 8, Color(250, 185, 30));
              it.circle(gx, gy, 11, Color(255, 215, 80));
            } else if (c_name == "clear-night") {
              it.filled_circle(gx + 2, gy, 8, Color(225, 235, 250));
              it.filled_circle(gx, gy, 7, Color(0, 0, 0));
            } else if (c_name == "partlycloudy" || c_name == "partly-cloudy" || c_name == "mostlycloudy" || c_name == "mostlysunny" || c_name == "partlysunny") {
              it.filled_circle(gx - 4, gy - 4, 6, Color(245, 175, 30));
              it.filled_circle(gx + 2, gy + 1, 6, Color(175, 190, 210));
              it.filled_circle(gx - 3, gy + 2, 5, Color(155, 170, 190));
              it.filled_circle(gx + 7, gy + 3, 4, Color(145, 160, 180));
            } else if (c_name == "rainy" || c_name == "pouring") {
              it.filled_circle(gx, gy - 2, 6, Color(130, 145, 170));
              it.filled_circle(gx - 5, gy - 1, 5, Color(115, 130, 155));
              it.filled_circle(gx + 5, gy, 4, Color(115, 130, 155));
              it.line(gx - 4, gy + 6, gx - 6, gy + 10, Color(70, 170, 245));
              it.line(gx + 2, gy + 6, gx, gy + 10, Color(70, 170, 245));
            } else if (c_name == "snowy" || c_name == "snowy-rainy") {
              it.filled_circle(gx, gy - 2, 6, Color(160, 175, 195));
              it.draw_pixel_at(gx - 3, gy + 7, Color(255, 255, 255));
              it.draw_pixel_at(gx + 3, gy + 7, Color(255, 255, 255));
              it.draw_pixel_at(gx, gy + 9, Color(255, 255, 255));
            } else if (c_name == "lightning" || c_name == "lightning-rainy") {
              it.filled_circle(gx, gy - 3, 6, Color(110, 120, 140));
              it.line(gx - 1, gy + 3, gx - 3, gy + 7, Color(255, 220, 40));
              it.line(gx - 3, gy + 7, gx + 1, gy + 7, Color(255, 220, 40));
              it.line(gx + 1, gy + 7, gx - 1, gy + 11, Color(255, 220, 40));
            } else if (c_name == "windy" || c_name == "windy-variant") {
              it.line(gx - 8, gy - 2, gx + 6, gy - 2, Color(160, 185, 210));
              it.line(gx - 6, gy + 2, gx + 8, gy + 2, Color(160, 185, 210));
              it.line(gx - 4, gy + 6, gx + 4, gy + 6, Color(140, 165, 190));
            } else {
              it.filled_circle(gx, gy - 1, 7, Color(165, 180, 200));
              it.filled_circle(gx - 5, gy + 1, 5, Color(145, 160, 180));
              it.filled_circle(gx + 5, gy + 1, 5, Color(145, 160, 180));
            }
          };

          auto format_fc_name = [](const std::string& c) -> std::string {
            if (c == "partlycloudy" || c == "partly-cloudy") return "P.Cloudy";
            if (c == "mostlycloudy" || c == "mostly-cloudy") return "M.Cloudy";
            if (c == "mostlysunny" || c == "mostly-sunny") return "M.Sunny";
            if (c == "partlysunny" || c == "partly-sunny") return "P.Sunny";
            if (c == "clear-night" || c == "clearnight") return "Clear";
            if (c == "sunny" || c == "clear-day" || c == "clearday" || c == "clear") return "Sunny";
            if (c == "rainy" || c == "pouring" || c == "heavy-rain") return "Rain";
            if (c == "cloudy") return "Cloudy";
            if (c == "snowy") return "Snow";
            if (c == "lightning" || c == "lightning-rainy" || c == "thunderstorm") return "Storm";
            if (c == "snowy-rainy" || c == "sleet") return "Sleet";
            if (c == "windy" || c == "windy-variant" || c == "breezy") return "Windy";
            if (c == "fog") return "Fog";
            if (c == "hail") return "Hail";
            if (c.empty()) return "Fair";
            std::string s = c;
            for (char &ch : s) {
              if (ch == '-' || ch == '_') ch = ' ';
            }
            s[0] = toupper(s[0]);
            return s;
          };

          // 5 Spaced Rows (y = 92, 128, 164, 200, 236) elevated together by 10px to match standard title buffer
          int row_ys[5] = {92, 128, 164, 200, 236};
          for (size_t i = 0; i < fc_days.size() && i < 5; i++) {
            int ry = row_ys[i];
            const auto& d = fc_days[i];

            // 1. Day of week shifted right to x = 114 (equalized circular bezel buffer on both sides)
            it.print(114, ry, id(font_small), (i == 0) ? id(theme_primary) : id(col_white), TextAlign::CENTER, d.day.c_str());

            // Optical baseline alignment: glyph, condition, and high/low brought down by 2px to match days of week
            int ry_data = ry + 2;

            // 2. Weather vector glyph centered at x = 178, y = ry_data
            draw_fc_glyph(178, ry_data, d.cond);

            // 3. Condition short text vertically aligned at x = 201, y = ry_data
            std::string c_txt = format_fc_name(d.cond);
            it.print(201, ry_data, id(font_small), id(col_slate), TextAlign::CENTER_LEFT, c_txt.c_str());

            // 4. High / Low temperatures vertically aligned at x = 331..351, y = ry_data
            std::string hi_str = d.high + "°";
            std::string lo_str = d.low + "°";
            it.print(331, ry_data, id(font_small), id(col_white), TextAlign::CENTER_RIGHT, hi_str.c_str());
            it.print(341, ry_data, id(font_micro), id(col_dark_gray), TextAlign::CENTER, "/");
            it.print(351, ry_data, id(font_small), id(col_slate), TextAlign::CENTER_LEFT, lo_str.c_str());

            // Horizontal row divider
            if (i < 4) {
              it.line(80, ry + 18, 386, ry + 18, id(col_dark_gray));
            }
          }
          it.line(80, 254, 386, 254, id(col_dark_gray));
        }
        // ----------------------------------------------------------------------
        // SUBPAGE 2: SUN (TITLE "SUN", BUFFERED LOWER ARC, DAYTIME-ONLY SUN)
        // ----------------------------------------------------------------------
        else if (id(sky_weather_subpage) == 2) {
          // Standardized Title at y = 50
          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "SUN");

          float elev = id(ha_sun_elevation).state;
          float azim = id(ha_sun_azimuth).state;

          // Scaled Celestial Solar Arc elevated by 10px (arc_cy = 158, Radius 79, top apex at y = 79)
          // Center cx = 233, cy = 158, Radius = 79
          int arc_cy = 158;
          int arc_r = 79;

          // Horizon Line at y = 158
          for (int hx = 140; hx <= 326; hx += 8) {
            it.line(hx, arc_cy, hx + 4, arc_cy, id(col_gray));
          }
          it.print(124, arc_cy, id(font_micro), id(col_slate), TextAlign::CENTER, "E");
          it.print(342, arc_cy, id(font_micro), id(col_slate), TextAlign::CENTER, "W");

          // Day Arc (Above Horizon y <= 158, top apex at y = 79, standardized title buffer)
          for (int a = 0; a <= 180; a += 2) {
            float rad = (float)a * 3.14159265f / 180.0f;
            int ax = cx - (int)((float)arc_r * cosf(rad));
            int ay = arc_cy - (int)((float)arc_r * sinf(rad));
            it.draw_pixel_at(ax, ay, Color(180, 140, 40));
            it.draw_pixel_at(ax, ay + 1, Color(100, 75, 20));
          }

          // Status Text placed UNDERNEATH the horizon line at y = 175 in font_micro
          if (!isnan(elev)) {
            const char* sol_st = (elev > 0.0f) ? "Above Horizon" : "Below Horizon";
            it.print(cx, 175, id(font_micro), elev > 0.0f ? id(col_warm_gold) : id(col_slate), TextAlign::CENTER, sol_st);
          }

          // Current Sun Position: ONLY displayed if above horizon (elev >= 0)
          if (!isnan(elev) && elev >= 0.0f) {
            float day_prog = 0.5f;
            if (!isnan(azim)) {
              if (azim >= 60.0f && azim <= 300.0f) day_prog = (azim - 60.0f) / 240.0f;
              else if (azim < 60.0f) day_prog = 0.05f;
              else day_prog = 0.95f;
            }
            float theta = day_prog * 3.14159265f;
            int sx = cx - (int)((float)arc_r * cosf(theta));
            int sy = arc_cy - (int)((float)arc_r * sinf(theta));

            it.filled_circle(sx, sy, 9, Color(245, 175, 30));
            it.filled_circle(sx, sy, 5, Color(255, 235, 140));
            it.filled_circle(sx, sy, 2, Color(255, 255, 255));
            it.line(sx - 13, sy, sx + 13, sy, Color(255, 200, 50));
            it.line(sx, sy - 13, sx, sy + 13, Color(255, 200, 50));
          }

          // Horizontal divider elevated to y = 186
          it.line(80, 186, 386, 186, id(col_dark_gray));

          // Telemetry Row: Sunrise and Sunset (Titles at y = 206, Times at y = 238, elevated by 10px)
          std::string s_rise = format_iso_time(id(ha_sun_next_rising).state, id(is_24h_format));
          std::string s_set = format_iso_time(id(ha_sun_next_setting).state, id(is_24h_format));

          it.print(145, 206, id(font_small), id(col_slate), TextAlign::CENTER, "SUNRISE");
          it.print(145, 238, id(font_small), id(col_warm_gold), TextAlign::CENTER, s_rise.c_str());

          it.line(cx, 194, cx, 250, id(col_dark_gray));

          it.print(321, 206, id(font_small), id(col_slate), TextAlign::CENTER, "SUNSET");
          it.print(321, 238, id(font_small), id(col_warm_gold), TextAlign::CENTER, s_set.c_str());

          // Divider at y = 256 above bottom 2x2 buttons (generous 20px gap above buttons)
          it.line(80, 256, 386, 256, id(col_dark_gray));
        }
        // ----------------------------------------------------------------------
        // SUBPAGE 3: MOON (DEFAULT LUNAR TELEMETRY VIEW ONLY)
        // ----------------------------------------------------------------------
        else if (id(sky_weather_subpage) == 3) {
          double cycle = 0.5;
          int illum_pct = 50;
          std::string mp_label = "Moon";
          calculate_moon_phase(cycle, &illum_pct, &mp_label);

          it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, "MOON");

          int moon_cx = cx;
          int moon_cy = 131;
          int moon_r = 52;

          draw_lunar_disc(moon_cx, moon_cy, moon_r, cycle, true);

          // Horizontal divider elevated to y = 186 (standardized to Sun page)
          it.line(80, 186, 386, 186, id(col_dark_gray));

          // Telemetry Row: Titles in font_small at y = 206, Data in font_small at y = 238 (elevated by 10px)
          it.print(145, 206, id(font_small), id(col_slate), TextAlign::CENTER, "ILLUMINATION");
          char illum_buf[16];
          snprintf(illum_buf, sizeof(illum_buf), "%d%%", illum_pct);
          it.print(145, 238, id(font_small), id(col_white), TextAlign::CENTER, illum_buf);

          // Center Divider between columns (y = 194..250, elevated by 10px)
          it.line(cx, 194, cx, 250, id(col_dark_gray));

          it.print(321, 206, id(font_small), id(col_slate), TextAlign::CENTER, "PHASE");
          it.print(321, 238, id(font_small), id(col_white), TextAlign::CENTER, mp_label.c_str());

          // Divider at y = 256 above bottom 2x2 buttons (generous 20px gap above buttons)
          it.line(80, 256, 386, 256, id(col_dark_gray));
        }
        // ==============================================================================
        // SUBPAGE BUTTONS: STANDARDIZED 2x2 SYSTEM PILL GRID (y = 296, 356, r = 20)
        // Standardized to match System Menu 2x3 grid pill height (40px, r=20) and 20px gap (60px pitch)
        // ==============================================================================
        auto draw_sub_pill = [&](int x1, int x2, int y_mid, const char* label, bool is_act) {
          Color border_c = is_act ? id(theme_primary) : id(theme_secondary);
          Color bg_c = is_act ? id(theme_primary) : id(col_dark_gray);
          Color text_c = id(col_white);
          draw_pill_button(x1, x2, y_mid, 20, border_c, bg_c, label, text_c, false);
        };

        // Row 1: Current & Forecast (ymid = 296, spans y: 276..316)
        draw_sub_pill(89, 201, 296, "Current", id(sky_weather_subpage) == 0);
        draw_sub_pill(265, 377, 296, "Forecast", id(sky_weather_subpage) == 1);

        // Row 2: Sun & Moon (ymid = 356, spans y: 336..376)
        draw_sub_pill(89, 201, 356, "Sun", id(sky_weather_subpage) == 2);
        draw_sub_pill(265, 377, 356, "Moon", id(sky_weather_subpage) == 3);
      // ==============================================================================
      // PAGE 6: TIMER & ALARM APP (v1.1 OVERHAUL)
      // ==============================================================================
      } else if (id(gui_page) == 6) {
        id(gui_page) = 8;
        id(stuff_subpage) = 1;
        id(disp1).update();
        return;
      } else if (id(gui_page) == 7) {
        // ==============================================================================
        // PAGE 7: UNIVERSAL TV & MEDIA REMOTE CONTROL (DEVICE TITLE & SETTINGS SUBPAGE)
        // ==============================================================================
        std::string rem_name = id(remote_target_name);
        if (rem_name.empty()) {
          if (id(ha_remote_friendly_name).has_state() && !id(ha_remote_friendly_name).state.empty() &&
              id(ha_remote_friendly_name).state != "unknown" && id(ha_remote_friendly_name).state != "unavailable") {
            rem_name = id(ha_remote_friendly_name).state;
            id(remote_target_name) = rem_name;
          } else {
            std::string s = "${tv_remote_entity}";
            size_t dot = s.find('.');
            if (dot != std::string::npos) s = s.substr(dot + 1);
            bool cap = true;
            for (size_t i = 0; i < s.length(); i++) {
              if (s[i] == '_') { s[i] = ' '; cap = true; }
              else if (cap) { s[i] = toupper(s[i]); cap = false; }
            }
            if (s == "Tv") s = "TV";
            else if (s.length() >= 2 && s.substr(s.length() - 2) == "Tv") {
              s.replace(s.length() - 2, 2, "TV");
            }
            rem_name = s;
          }
        }

        if (id(remote_subpage) == 1) {
          // --------------------------------------------------
          // SUBPAGE 1: REMOTE & DEVICE SETTINGS (DIRECT POWER TOGGLE)
          // Modeled after System Dashboard (y=46 Title, y=78 Subtitle buffer of 32px)
          // --------------------------------------------------
          it.print(cx, 46, id(font_date), id(theme_primary), TextAlign::CENTER, "DEVICE SETTINGS");

          // Active target device name (y = 78, font_small, col_white, matching System page buffer of 32px)
          std::string upper_sub = rem_name;
          for (char &c : upper_sub) c = (char)toupper((unsigned char)c);
          std::string rem_sub = fit_text_to_width(upper_sub, 260);
          it.print(cx, 78, id(font_small), id(col_white), TextAlign::CENTER, rem_sub.c_str());

          // Active remote profile badge (y = 114, font_micro, theme_secondary)
          std::string prof_label = "Profile: " + id(tv_remote_profile).current_option();
          it.print(cx, 114, id(font_micro), id(theme_secondary), TextAlign::CENTER, prof_label.c_str());

          // Clean Pill Button: Toggle Power at y = 200 (h = 44, r = 22, span: 120..346)
          // Rendered using standard draw_pill_button for clean continuous geometry with zero internal artifacts
          draw_pill_button(120, 346, 200, 22, id(col_red), id(col_dark_gray), "Toggle Power", id(col_white), false);

          // Standardized Centered < BACK Button at y = 408 (Matching OS Subpage Standard)
          draw_back_button();
        } else {
          // --------------------------------------------------
          // MAIN REMOTE CONTROL INTERFACE (SUBPAGE 0)
          // Unified Title: Active Entity Name displayed as Title at y = 50
          // Tapping Title opens Remote Settings Subpage
          // --------------------------------------------------
          bool is_fb = (millis() - id(remote_feedback_timer) < 1500 && !id(remote_action_feedback).empty());
          if (is_fb) {
            std::string fb_str = id(remote_action_feedback);
            for (char &c : fb_str) c = (char)toupper((unsigned char)c);
            it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, fb_str.c_str());
          } else {
            std::string upper_name = rem_name;
            for (char &c : upper_name) c = (char)toupper((unsigned char)c);
            std::string disp_title = fit_text_to_width_font(upper_name, 246, id(font_date));
            it.print(cx, 50, id(font_date), id(theme_primary), TextAlign::CENTER, disp_title.c_str());
          }

          // Flank Buttons Symmetrical Coordinates (dy = +/- 93 from cy = 233)
          // Upper Pair: y = 140. Lower Pair: y = 326. Left: x = 71. Right: x = 395.
          const int left_fx = 71;
          const int right_fx = 395;
          const int top_fy = 140;
          const int btm_fy = 326;
          const int f_r = 18;

          // 1. HOME: Top-Left (71, 140)
          it.filled_circle(left_fx, top_fy, f_r, id(col_dark_gray));
          it.circle(left_fx, top_fy, f_r, id(col_gray));
          it.filled_triangle(left_fx, top_fy - 8, left_fx - 9, top_fy - 1, left_fx + 9, top_fy - 1, id(col_white));
          it.filled_rectangle(left_fx - 6, top_fy - 1, 13, 8, id(col_white));
          it.filled_rectangle(left_fx - 2, top_fy + 2, 5, 5, id(col_dark_gray));

          // 2. VOL UP: Top-Right (395, 140)
          it.filled_circle(right_fx, top_fy, f_r, id(col_dark_gray));
          it.circle(right_fx, top_fy, f_r, id(col_gray));
          it.filled_rectangle(right_fx - 7, top_fy - 1, 15, 3, id(col_white));
          it.filled_rectangle(right_fx - 1, top_fy - 7, 3, 15, id(col_white));

          // 3. BACK: Bottom-Left (71, 326) - LOWERED FOR RADIAL SYMMETRY
          it.filled_circle(left_fx, btm_fy, f_r, id(col_dark_gray));
          it.circle(left_fx, btm_fy, f_r, id(col_gray));
          it.line(left_fx + 3, btm_fy - 7, left_fx - 4, btm_fy, id(col_white));
          it.line(left_fx + 4, btm_fy - 7, left_fx - 3, btm_fy, id(col_white));
          it.line(left_fx - 4, btm_fy, left_fx + 3, btm_fy + 7, id(col_white));
          it.line(left_fx - 3, btm_fy, left_fx + 4, btm_fy + 7, id(col_white));

          // 4. VOL DOWN: Bottom-Right (395, 326) - LOWERED FOR RADIAL SYMMETRY
          it.filled_circle(right_fx, btm_fy, f_r, id(col_dark_gray));
          it.circle(right_fx, btm_fy, f_r, id(col_gray));
          it.filled_rectangle(right_fx - 7, btm_fy - 1, 15, 3, id(col_white));

          // Concentric D-Pad with Expanded Outer Radius (r_out = 132 for generous Left/Right reach)
          const int dpad_r_in = 48;
          const int dpad_r_out = 132;

          // Outer directional ring
          it.circle(cx, cy, dpad_r_out, id(col_gray));
          it.circle(cx, cy, dpad_r_in, id(col_gray));

          // 45-degree sector dividers (cos 45 = sin 45 = 0.7071)
          const int d_in = 34;   // 48 * 0.7071
          const int d_out = 93;  // 132 * 0.7071
          it.line(cx + d_in, cy + d_in, cx + d_out, cy + d_out, id(col_gray));
          it.line(cx - d_in, cy + d_in, cx - d_out, cy + d_out, id(col_gray));
          it.line(cx + d_in, cy - d_in, cx + d_out, cy - d_out, id(col_gray));
          it.line(cx - d_in, cy - d_in, cx - d_out, cy - d_out, id(col_gray));

          // Directional Arrows centered at radius ~90px
          // UP Arrow
          it.filled_triangle(cx, cy - 97, cx - 10, cy - 82, cx + 10, cy - 82, id(col_white));
          // DOWN Arrow
          it.filled_triangle(cx, cy + 97, cx - 10, cy + 82, cx + 10, cy + 82, id(col_white));
          // LEFT Arrow
          it.filled_triangle(cx - 97, cy, cx - 82, cy - 10, cx - 82, cy + 10, id(col_white));
          // RIGHT Arrow
          it.filled_triangle(cx + 97, cy, cx + 82, cy - 10, cx + 82, cy + 10, id(col_white));

          // Center OK Button (Radius 40)
          it.filled_circle(cx, cy, 40, id(col_dark_gray));
          it.circle(cx, cy, 40, id(theme_primary));
          it.print(cx, cy, id(font_date), id(col_white), TextAlign::CENTER, "OK");
        }
      } else if (id(gui_page) == 8) {
        // ==============================================================================
        // PAGE 8: STUFF SUITE (LAUNCHER, TIMER, ALARMS, STOPWATCH, DICE, FLASHLIGHT, CALC, LEVEL, COIN)
        // ==============================================================================
        // ----------------------------------------------------------------------
        // ALERT / RINGING OVERLAY: FULL-SCREEN TAKEOVER
        // ----------------------------------------------------------------------
        if (id(alarm_ringing) || id(timer_ringing)) {
          // Dynamic pulsing perimeter alert ring (r = 223..226)
          uint8_t pulse = (millis() / 250) % 2;
          Color alert_color = id(alarm_ringing) ? id(col_red) : id(theme_secondary);
          Color ring_c = pulse ? alert_color : Color(20, 20, 20);
          it.circle(cx, cy, 223, ring_c);
          it.circle(cx, cy, 224, ring_c);
          it.circle(cx, cy, 225, ring_c);
          it.circle(cx, cy, 226, ring_c);

          if (id(alarm_ringing)) {
            // Header
            it.print(cx, 75, id(font_small), pulse ? id(col_red) : id(col_white), TextAlign::CENTER, "ALARM RINGING");

            // Large Current Time
            auto now = id(ha_time).now();
            char cur_t_buf[16] = "--:--";
            char ampm_buf[8] = "";
            if (now.is_valid()) {
              format_time_hhmm(now.hour, now.minute, id(is_24h_format), cur_t_buf, sizeof(cur_t_buf), ampm_buf);
            }
            it.print(cx, 160, id(font_time), id(col_white), TextAlign::CENTER, cur_t_buf);
            if (!id(is_24h_format) && ampm_buf[0] != 0) {
              it.print(cx + 120, 175, id(font_date), id(theme_secondary), TextAlign::LEFT, ampm_buf);
            }

            // Recurrence info
            int r_idx = (id(alarm_ringing_idx) == 2) ? id(alarm2_recurrence) : id(alarm1_recurrence);
            const char* rec_names[4] = {"DAILY", "WEEKDAYS", "WEEKENDS", "ONCE"};
            it.print(cx, 225, id(font_small), id(theme_primary), TextAlign::CENTER, rec_names[r_idx % 4]);

            // SNOOZE (+5m) Button: y = 295, r = 20, 200px wide
            draw_pill_button(133, 333, 295, 20, id(theme_secondary), id(theme_secondary), "SNOOZE (+5m)", id(col_black), false);
            it.print(cx, 326, id(font_micro), id(col_gray), TextAlign::CENTER, "(or press Top Crown button)");

            // DISMISS Button: y = 370, r = 18, 180px wide
            draw_pill_button(143, 323, 370, 18, id(col_red), id(col_red), "DISMISS", id(col_white), false);
          } else {
            // Timer expired
            it.print(cx, 75, id(font_small), pulse ? id(theme_secondary) : id(col_white), TextAlign::CENTER, "TIMER EXPIRED");
            it.print(cx, 170, id(font_time), id(col_white), TextAlign::CENTER, "00:00");
            it.print(cx, 230, id(font_small), id(theme_secondary), TextAlign::CENTER, "TIME IS UP!");

            // DISMISS Button: y = 330, r = 22, 200px wide
            draw_pill_button(133, 333, 330, 22, id(theme_primary), id(theme_primary), "DISMISS", id(col_white), false);
            it.print(cx, 372, id(font_micro), id(col_gray), TextAlign::CENTER, "(or press Top Crown button)");
          }
          return;
        }

        if (id(stuff_subpage) == 0) {
          // --------------------------------------------------
          // SUBPAGE 0: STUFF LAUNCHER MENU (2-Page 6+2 Scaled Icon Card Grid)
          // Row 0 (y = 118), Row 1 (y = 214), Row 2 (y = 310)
          // Left Column (x = 140), Right Column (x = 264)
          // Standard Right-Flank Navigation Chevrons at x = 415 (Up at 162, Down at 278)
          // --------------------------------------------------
          draw_menu_header(46, "STUFF");

          // Standardized Right-Flank Navigation Chevrons
          draw_right_flank_chevrons(id(stuff_menu_page) == 1, id(stuff_menu_page) == 0);

          auto draw_icon_card = [&](int cx_card, int cy_card, int app_id, const char* label) {
            const int cw = 114;
            const int ch = 84;
            const int cr = 14;
            int x0 = cx_card - cw / 2;
            int y0 = cy_card - ch / 2;

            it.filled_rectangle(x0 + cr, y0, cw - 2 * cr, ch, Color(22, 27, 36));
            it.filled_rectangle(x0, y0 + cr, cw, ch - 2 * cr, Color(22, 27, 36));
            it.filled_circle(x0 + cr, y0 + cr, cr, Color(22, 27, 36));
            it.filled_circle(x0 + cw - cr, y0 + cr, cr, Color(22, 27, 36));
            it.filled_circle(x0 + cr, y0 + ch - cr, cr, Color(22, 27, 36));
            it.filled_circle(x0 + cw - cr, y0 + ch - cr, cr, Color(22, 27, 36));

            it.line(x0 + cr, y0, x0 + cw - cr, y0, Color(48, 56, 70));
            it.line(x0 + cr, y0 + ch - 1, x0 + cw - cr, y0 + ch - 1, Color(48, 56, 70));
            it.line(x0, y0 + cr, x0, y0 + ch - cr, Color(48, 56, 70));
            it.line(x0 + cw - 1, y0 + cr, x0 + cw - 1, y0 + ch - cr, Color(48, 56, 70));

            int ix = cx_card;
            int iy = cy_card - 14;

            if (app_id == 1) {
              // Timer Icon: Hourglass with sand
              it.line(ix - 10, iy - 12, ix + 10, iy - 12, id(col_white));
              it.line(ix - 10, iy + 12, ix + 10, iy + 12, id(col_white));
              it.line(ix - 9, iy - 11, ix - 2, iy, id(col_white));
              it.line(ix + 9, iy - 11, ix + 2, iy, id(col_white));
              it.line(ix - 2, iy, ix - 9, iy + 11, id(col_white));
              it.line(ix + 2, iy, ix + 9, iy + 11, id(col_white));
              it.filled_triangle(ix - 6, iy + 10, ix + 6, iy + 10, ix, iy + 3, id(col_white));
              it.line(ix, iy - 2, ix, iy + 2, id(col_white));
              it.filled_triangle(ix - 5, iy - 6, ix + 5, iy - 6, ix, iy - 1, id(col_white));
            } else if (app_id == 2) {
              // Alarms Icon: Classic twin-bell alarm clock
              it.circle(ix, iy + 1, 12, id(col_white));

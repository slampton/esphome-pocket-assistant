        - if:
            condition:
              lambda: 'return (x.empty() || x == "none" || x == "unknown" || x == "unavailable");'
            then:
              - script.stop: fetch_remote_art_debounced
              - lambda: 'id(current_loaded_art_url) = "";'
              - online_image.release: remote_album_art
              - script.execute: throttled_disp_update
            else:
              - if:
                  condition:
                    lambda: 'return (id(active_speaker_entity) != "${local_player_id}");'
                  then:
                    - script.execute: fetch_remote_art_debounced


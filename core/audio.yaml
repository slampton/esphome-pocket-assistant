# Core Subsystem: Audio & Voice Assistant

i2s_audio:
  - id: i2s_input_bus
    i2s_lrclk_pin:
      number: GPIO45
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO9
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO16
      allow_other_uses: true

  - id: i2s_output_bus
    i2s_lrclk_pin:
      number: GPIO45
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO9
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO16
      allow_other_uses: true


audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_internal
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 37.5dB


microphone:
  - platform: i2s_audio
    id: pocket_mic
    adc_type: external
    i2s_audio_id: i2s_input_bus
    i2s_din_pin: GPIO10
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    pdm: false


audio:
  codecs:
    flac:
      buffer_memory: psram


audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_internal
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true


speaker:
  - platform: i2s_audio
    id: physical_speaker
    i2s_audio_id: i2s_output_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    buffer_duration: 1000ms
    timeout: 10s

  - id: mixing_speaker
    platform: mixer
    output_speaker: physical_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: 250ms
      - id: media_mixing_input
        timeout: 1500ms

  - platform: resampler
    id: music_resampler
    output_speaker: media_mixing_input
    sample_rate: 16000
    bits_per_sample: 16
    task_stack_in_psram: true


rtttl:
  id: alarm_rtttl
  speaker: announcement_mixing_input

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false


media_source:
  - platform: sendspin
    id: sendspin_source
    task_stack_in_psram: true
    decode_memory: psram
    buffer_size: 500000


media_player:
  - platform: sendspin
    id: sendspin_group_media_player

  - platform: speaker_source
    id: pocket_music_player
    name: "Music"
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: music_resampler
      sources:
        - sendspin_source
    volume_initial: 70%
    volume_increment: 2%
    volume_min: 10%
    volume_max: 90%
    on_play:
      then:
        - lambda: |-
            id(music_pos_sync_time) = millis();
            id(gui_page) = 2; // Auto-switch to Music Player screen on playback start
            id(sleep_start_time) = 0;
            id(active_game) = 0;
        - script.stop: mp_idle_debounce
        - script.stop: screen_sleep_timer
        - mixer_speaker.apply_ducking:
            id: media_mixing_input
            decibel_reduction: 0
            duration: 0.1s
        - mixer_speaker.apply_ducking:
            id: announcement_mixing_input
            decibel_reduction: 50
            duration: 0.1s
        - script.execute: route_i2s_to_spk
        - switch.turn_on: speaker_enable
        - audio_dac.mute_off: es8311_dac
        - light.turn_on: display_brightness
        - script.execute: throttled_disp_update
    on_pause:
      then:
        - lambda: |-
            if (id(music_pos_sync_time) > 0) {
              id(music_pos_base) += (millis() - id(music_pos_sync_time)) / 1000.0f;
              id(music_pos_sync_time) = 0;
            }
        - script.execute: screen_sleep_timer
        - script.execute: mp_idle_debounce
    on_idle:
      then:
        - script.execute: mp_idle_debounce

voice_assistant:
  id: va
  microphone: pocket_mic
  speaker: announcement_mixing_input
  noise_suppression_level: 2
  auto_gain: 31dBFS
  on_listening:
    then:
      - if:
          condition:
            media_player.is_playing: pocket_music_player
          then:
            - script.execute: pause_all_music
            - delay: 150ms
      - script.stop: mp_idle_debounce
      - script.stop: screen_sleep_timer
      - script.execute: route_i2s_to_mic
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.1s
      - lambda: |-
          if (!id(va_active)) {
            id(return_page) = id(gui_page);
            id(va_active) = true;
          }
          id(va_vad_active) = false;
          id(va_tts_received) = false;
          id(va_status_text) = "Listening...";
          ESP_LOGI("va", "Status: Listening...");
      - light.turn_on: display_brightness
      - component.update: disp1
  on_stt_vad_start:
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          id(va_vad_active) = true;
          id(va_status_text) = "Listening...";
          ESP_LOGI("va", "Status: Listening (VAD active)...");
      - component.update: disp1
  on_stt_vad_end:
    then:
      - script.stop: screen_sleep_timer
      - lambda: |-
          id(va_vad_active) = false;
          id(va_status_text) = "Thinking...";
          ESP_LOGI("va", "Status: Thinking...");
      - component.update: disp1
  on_stt_end:
    then:
      - script.stop: screen_sleep_timer
      - script.execute: route_i2s_to_spk
      - lambda: |-
          id(va_vad_active) = false;
          id(va_status_text) = "Thinking...";
          ESP_LOGI("va", "STT End (hidden): %s", x.c_str());
  on_tts_start:
    then:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 50
          duration: 0.1s
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.1s
      - script.stop: screen_sleep_timer
      - script.execute: route_i2s_to_spk
      - audio_dac.mute_off: es8311_dac
      - lambda: |-
          id(va_vad_active) = false;
          id(va_tts_received) = true;
          id(va_status_text) = "Responding...";
          ESP_LOGI("va", "Status: Responding (TTS)...");
  on_tts_stream_end:
    then:
      - lambda: |-
          ESP_LOGI("va", "TTS stream received from server, waiting for audio hardware playback to complete");
      - script.execute: va_tts_drain_and_finish
  on_error:
    then:
      - script.execute: route_i2s_to_mic
      - lambda: |-
          id(va_vad_active) = false;
          id(va_tts_received) = false;
          id(va_active) = false;
          id(va_status_text) = code.substr(0, 24);
          ESP_LOGE("va", "Error: %s - %s", code.c_str(), message.c_str());
      - component.update: disp1
      - delay: 2s
      - lambda: |-
          id(va_status_text) = "";
          id(gui_page) = id(return_page);
      - component.update: disp1
      - if:
          condition:
            binary_sensor.is_off: pickup_detected
          then:
            - script.execute: screen_sleep_timer
  on_timer_started:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer started via Assist: %s (%lu sec)", timer.name.c_str(), (unsigned long)timer.total_seconds);
          id(timer_duration_sec) = timer.total_seconds;
          id(timer_remaining_sec) = timer.seconds_left;
          id(timer_target_ms) = millis() + (timer.seconds_left * 1000ULL);
          id(timer_running) = timer.is_active;
          id(timer_paused) = !timer.is_active;
          id(timer_ringing) = false;
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 6 && id(timer_alarm_subpage) == 0 && id(display_power_state) == 0) {
              id(disp1).update();
            }
          }
  on_timer_updated:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer updated via Assist: %s (left: %lu sec, active: %d)", timer.name.c_str(), (unsigned long)timer.seconds_left, timer.is_active);
          id(timer_remaining_sec) = timer.seconds_left;
          id(timer_target_ms) = millis() + (timer.seconds_left * 1000ULL);
          id(timer_running) = timer.is_active;
          id(timer_paused) = !timer.is_active;
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 6 && id(timer_alarm_subpage) == 0 && id(display_power_state) == 0) {
              id(disp1).update();
            }
          }
  on_timer_cancelled:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer cancelled via Assist: %s", timer.name.c_str());
          id(timer_running) = false;
          id(timer_paused) = false;
          id(timer_ringing) = false;
          id(timer_remaining_sec) = id(timer_duration_sec);
          if (!id(va_active) && id(va_status_text).empty()) {
            if (id(gui_page) == 6 && id(timer_alarm_subpage) == 0 && id(display_power_state) == 0) {
              id(disp1).update();
            }
          }
      - script.execute: stop_alarm_sound
  on_timer_finished:
    then:
      - lambda: |-
          ESP_LOGI("va_timer", "Timer finished via Assist: %s", timer.name.c_str());
          if (id(timer_running) && !id(timer_paused) && !id(timer_ringing)) {
            id(timer_running) = false;
            id(timer_paused) = false;
            id(timer_remaining_sec) = 0;
            id(timer_ringing) = true;
            id(gui_page) = 6;
            id(timer_alarm_subpage) = 0;
            id(wake_to_active_state).execute();
            id(play_alarm_sound).execute();
            id(disp1).update();
          }
  on_end:
    then:
      - if:
          condition:
            lambda: 'return !id(va_tts_received);'
          then:
            - script.execute: va_tts_drain_and_finish


script:
  - id: va_tts_drain_and_finish
    mode: restart
    then:
      # Wait for any trailing mixer samples to drain before switching clocks/restoring UI
      - if:
          condition:
            lambda: 'return id(announcement_mixing_input).is_running();'
          then:
            - wait_until:
                condition:
                  lambda: 'return !id(announcement_mixing_input).is_running();'
                timeout: 3s
            - delay: 100ms
      - if:
          condition:
            media_player.is_playing: pocket_music_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
          else:
            - audio_dac.mute_on: es8311_dac
            - script.execute: route_i2s_to_mic
      - lambda: |-
          id(va_vad_active) = false;
          id(va_status_text) = "";
          id(va_tts_received) = false;
          id(va_active) = false;
          id(gui_page) = id(return_page);
      - component.update: disp1
      - if:
          condition:
            binary_sensor.is_off: pickup_detected
          then:
            - script.execute: screen_sleep_timer
  - id: play_alarm_sound
    mode: restart
    then:
      - script.execute: route_i2s_to_spk
      - audio_dac.mute_off: es8311_dac
      - mixer_speaker.apply_ducking:
          id: announcement_mixing_input
          decibel_reduction: 0
          duration: 0.1s
      - if:
          condition:
            media_player.is_playing: pocket_music_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 50
                duration: 0.1s
      - while:
          condition:
            lambda: "return id(alarm_ringing) || id(timer_ringing);"
          then:
            - rtttl.play:
                id: alarm_rtttl
                rtttl: "alarm:d=16,o=6,b=160:c,e,g,c7,p,c,e,g,c7,p,c,e,g,c7"
            - wait_until:
                condition:
                  not:
                    rtttl.is_playing:
                timeout: 5s
            - delay: 800ms

  - id: stop_alarm_sound
    mode: restart
    then:
      - rtttl.stop:
          id: alarm_rtttl
      - script.stop: play_alarm_sound
      - if:
          condition:
            lambda: |-
              return (id(pocket_music_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) ||
                     (id(ha_target_state).state == "playing");
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 0.1s
            - mixer_speaker.apply_ducking:
                id: announcement_mixing_input
                decibel_reduction: 50
                duration: 0.1s
          else:
            - audio_dac.mute_on: es8311_dac
            - script.execute: route_i2s_to_mic

number:
  - platform: template
    name: "Audio: Volume Step Size"
    id: volume_step_size
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 2
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    icon: "mdi:volume-step"
    entity_category: config

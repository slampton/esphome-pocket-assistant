blueprint:
  name: Music Assistant Browse & Discovery for ESPHome Devices
  description: Fetches paged lists of Music Assistant speakers, favorites, playlists,
    artists, albums, radio, podcasts, audiobooks, or tracks, and syncs them to an
    ESPHome display.
  domain: script
  input:
    target_esphome_device:
      name: Target ESPHome Device Name
      description: The name of your ESPHome device as defined in its YAML substitution
        (e.g. pocket-assistant).
      default: pocket-assistant
      selector:
        text:
          multiline: false
          multiple: false
    active_speaker_helper:
      name: Active Speaker Helper (Optional)
      description: Optional input_text helper storing the currently active speaker
        entity ID.
      default: input_text.pocket_assistant_active_speaker
      selector:
        entity:
          domain:
          - input_text
          multiple: false
          reorder: false
    default_album_sort:
      name: Default Album Sort Order
      description: Preferred sort order for albums and artist discographies (name for alphabetical, year_desc for chronological newest-first, year for oldest-first).
      default: name
      selector:
        select:
          options:
            - label: Alphabetical
              value: name
            - label: Chronological (Newest First)
              value: year_desc
            - label: Chronological (Oldest First)
              value: year
          multiple: false
          custom_value: false
          sort: false
    default_podcast_sort:
      name: Default Podcast Sort Order
      description: Preferred sort order for podcast episodes (newest on top or oldest on top).
      default: newest
      selector:
        select:
          options:
            - label: Newest on Top
              value: newest
            - label: Oldest on Top
              value: oldest
          multiple: false
          custom_value: false
          sort: false
mode: restart
fields:
  mode:
    description: 'Category mode: speakers, favorites, playlist, artist, album, radio,
      podcast, audiobook, podcast_audiobook, track, artist_albums, album_tracks, podcast_episodes'
    example: speakers
    required: true
    selector:
      text:
  page:
    description: Page number (1-based)
    example: 1
    default: 1
    selector:
      number:
        min: 1
        max: 500
  page_size:
    description: Number of items per page
    example: 5
    default: 5
    selector:
      number:
        min: 1
        max: 10
  search:
    description: Search term or URI for sub-queries (e.g. artist name for artist_albums,
      album URI for album_tracks, podcast URI for podcast_episodes)
    example: Cloud Nothings
    default: ''
    selector:
      text:
  speaker:
    description: Currently active speaker entity ID to highlight in speaker list
    example: media_player.pocket_assistant
    default: ''
    selector:
      text:
  last_speaker:
    description: Previously used speaker entity ID (optional)
    example: media_player.garage_hifi
    default: ''
    selector:
      text:
  album_sort:
    description: Preferred sort order for albums (e.g. name, year_desc, year)
    example: name
    default: ''
    selector:
      text:
  podcast_sort:
    description: Preferred sort order for podcast episodes (newest or oldest)
    example: newest
    default: ''
    selector:
      text:
sequence:
- variables:
    dev_input: !input target_esphome_device
    helper_entity: !input active_speaker_helper
    input_album_sort: !input default_album_sort
    input_podcast_sort: !input default_podcast_sort
    album_sort_order: '{{ album_sort if (album_sort | default("") != "") else input_album_sort }}'
    podcast_sort_order: '{{ podcast_sort if (podcast_sort | default("") != "") else input_podcast_sort }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ mode == "speakers" }}'
    sequence:
    - variables:
        raw_items: >-
          {% set all_mass_players = integration_entities("music_assistant") | select("match", "^media_player") | reject("match", ".*_tablet$") | reject("match", ".*_announcement$") | list %}
          {% set helper_val = states(helper_entity) if helper_entity and states(helper_entity) not in ["unknown", "unavailable", ""] else "" %}
          {% set local_spk = "media_player." ~ (dev_input | replace("-", "_")) %}
          {% set mobile_spk = "media_player.mobile_speaker" %}
          {% if speaker | default("") != "" and speaker in all_mass_players %}
            {% set act_spk = speaker %}
          {% elif helper_val in all_mass_players %}
            {% set act_spk = helper_val %}
          {% else %}
            {% set act_spk = local_spk %}
          {% endif %}
          {% set mut = namespace(ordered=[]) %}
          {% if act_spk in all_mass_players %}
            {% set mut.ordered = mut.ordered + [act_spk] %}
          {% endif %}
          {% if local_spk in all_mass_players and local_spk not in mut.ordered %}
            {% set mut.ordered = mut.ordered + [local_spk] %}
          {% endif %}
          {% if last_speaker | default("") != "" and last_speaker in all_mass_players and last_speaker not in mut.ordered %}
            {% set mut.ordered = mut.ordered + [last_speaker] %}
          {% endif %}
          {% if mobile_spk in all_mass_players and mobile_spk not in mut.ordered %}
            {% set mut.ordered = mut.ordered + [mobile_spk] %}
          {% endif %}
          {% set rem = namespace(items=[]) %}
          {% for entity in all_mass_players %}
            {% if entity not in mut.ordered %}
              {% set rem.items = rem.items + [entity] %}
            {% endif %}
          {% endfor %}
          {% set final_list = mut.ordered + (rem.items | sort) %}
          {% set ns = namespace(items=[]) %}
          {% for entity in final_list %}
            {% set fname = state_attr(entity, "friendly_name") | default(entity.split(".")[1] | replace("_", " ") | title, true) %}
            {% set is_active = (entity == act_spk) %}
            {% set ns.items = ns.items + [{
              "name": fname,
              "id": entity,
              "type": "speaker",
              "active": is_active
            }] %}
          {% endfor %}
          {{ ns.items | to_json }}
  - conditions:
    - condition: template
      value_template: '{{ mode == "favorites" }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
        media_type: track
        favorite: true
        limit: 500
        order_by: name
      response_variable: fav_tracks_resp
    - action: music_assistant.get_library
      data:
        config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
        media_type: playlist
        favorite: true
        limit: 500
        order_by: name
      response_variable: fav_playlists_resp
    - action: music_assistant.get_library
      data:
        config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
        media_type: radio
        favorite: true
        limit: 500
        order_by: name
      response_variable: fav_radios_resp
    - variables:
        raw_items: >-
          {% set all_favs = (fav_tracks_resp["items"] | default([])) + (fav_playlists_resp["items"] | default([])) + (fav_radios_resp["items"] | default([])) %}
          {% set ns = namespace(items=[]) %}
          {% for item in all_favs %}
            {% set mtype = item.media_type.value if item.media_type is mapping and item.media_type.value is defined else (item.media_type ~ "") %}
            {% set ns.items = ns.items + [{
              "name": item.name,
              "id": item.uri,
              "type": mtype,
              "active": false
            }] %}
          {% endfor %}
          {{ ns.items | to_json }}
  - conditions:
    - condition: template
      value_template: '{{ mode == "artist_albums" }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
        media_type: album
        search: '{{ search }}'
        favorite: false
        limit: 1000
        order_by: '{{ album_sort_order }}'
      response_variable: artist_albums_resp
    - variables:
        raw_items: >-
          {% set all_lib = artist_albums_resp["items"] | default([]) %}
          {% set ns = namespace(items=[]) %}
          {% for item in all_lib %}
            {% set ns.items = ns.items + [{
              "name": item.name,
              "id": item.uri,
              "type": "album",
              "active": false
            }] %}
          {% endfor %}
          {{ ns.items | to_json }}
  - conditions:
    - condition: template
      value_template: '{{ mode == "album_tracks" }}'
    sequence:
    - action: media_player.browse_media
      target:
        entity_id: '{{ integration_entities("music_assistant") | select("match", "^media_player") | first }}'
      data:
        media_content_type: "music"
        media_content_id: '{{ search }}'
      response_variable: album_tracks_resp
    - variables:
        raw_items: >-
          {% set p_resp = (album_tracks_resp.values() | list | first) if album_tracks_resp is mapping and (album_tracks_resp.values() | list | length > 0) else {} %}
          {% set children = p_resp.children | default([]) %}
          {% set ns = namespace(items=[]) %}
          {% for item in children %}
            {% set clean_name = item.title.split(" - ", 1)[1] if " - " in item.title else item.title %}
            {% set ns.items = ns.items + [{
              "name": clean_name,
              "id": item.media_content_id,
              "type": "track",
              "active": false
            }] %}
          {% endfor %}
          {{ ns.items | to_json }}
  - conditions:
    - condition: template
      value_template: '{{ mode == "podcast_episodes" }}'
    sequence:
    - action: mass_queue.get_podcast_episodes
      data:
        config_entry_id: '{{ (integration_entities("mass_queue") | map("config_entry_id") | select("defined") | first) | default("01KWT5KHS9J3CXG4PYGN26EYKS", true) }}'
        uri: '{{ search }}'
      response_variable: pod_ep_resp
    - variables:
        raw_items: >-
          {% set episodes = pod_ep_resp.episodes | default([]) %}
          {% set p_sort = podcast_sort_order | default("newest") %}
          {% set sorted_eps = episodes if p_sort == "newest" else (episodes | reverse | list) %}
          {% set ns = namespace(items=[]) %}
          {% for ep in sorted_eps %}
            {% set ns.items = ns.items + [{
              "name": ep.media_title,
              "id": ep.media_content_id,
              "type": "podcast_episode",
              "active": false
            }] %}
          {% endfor %}
          {{ ns.items | to_json }}
  - conditions:
    - condition: template
      value_template: '{{ mode == "podcast_audiobook" }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
        media_type: podcast
        favorite: false
        limit: 500
        order_by: name
      response_variable: mass_pod
    - action: music_assistant.get_library
      data:
        config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
        media_type: audiobook
        favorite: false
        limit: 500
        order_by: name
      response_variable: mass_ab
    - variables:
        raw_items: >-
          {% set pod_items = mass_pod["items"] if mass_pod is mapping and "items" in mass_pod else [] %}
          {% set ab_items = mass_ab["items"] if mass_ab is mapping and "items" in mass_ab else [] %}
          {% set ns = namespace(items=[]) %}
          {% for item in (pod_items + ab_items) %}
            {% set mtype = item.media_type.value if item.media_type is mapping and item.media_type.value is defined else (item.media_type ~ "") %}
            {% set ns.items = ns.items + [{
              "name": item.name,
              "id": item.uri,
              "type": mtype if mtype != "" else "podcast",
              "active": false
            }] %}
          {% endfor %}
          {{ ns.items | to_json }}
  - conditions:
    - condition: template
      value_template: '{{ mode in ["playlist", "artist", "album", "radio", "track", "podcast", "audiobook"] }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
        media_type: '{{ mode }}'
        favorite: false
        limit: 1000
        order_by: '{{ album_sort_order if mode == "album" else "name" }}'
      response_variable: lib_resp
    - variables:
        raw_items: >-
          {% set all_lib = lib_resp["items"] | default([]) %}
          {% set ns = namespace(items=[]) %}
          {% for item in all_lib %}
            {% set mtype = item.media_type.value if item.media_type is mapping and item.media_type.value is defined else (item.media_type ~ "") %}
            {% set ns.items = ns.items + [{
              "name": item.name,
              "id": item.uri,
              "type": mtype if mtype != "" else mode,
              "active": false
            }] %}
          {% endfor %}
          {{ ns.items | to_json }}
- variables:
    parsed_items: '{{ (raw_items | from_json) if raw_items is string else (raw_items | default([])) }}'
- variables:
    pg_num: '{{ [1, (page | default(1) | int)] | max }}'
    pg_size: '{{ [1, (page_size | default(5) | int)] | max }}'
    total_items: '{{ (parsed_items | default([])) | length }}'
- variables:
    total_pages: '{{ [1, ((total_items + pg_size - 1) // pg_size)] | max }}'
- variables:
    current_page: '{{ [pg_num, total_pages] | min }}'
- variables:
    start_idx: '{{ (current_page - 1) * pg_size }}'
    end_idx: '{{ current_page * pg_size }}'
    has_prev: '{{ total_pages > 1 }}'
    has_next: '{{ total_pages > 1 }}'
- variables:
    page_items: '{{ (parsed_items | default([]))[start_idx:end_idx] }}'
- variables:
    target_action: 'esphome.{{ (dev_input | replace("-", "_")) }}_set_browse_slots'
- action: '{{ target_action }}'
  continue_on_error: true
  data:
    mode: '{{ mode }}'
    page: '{{ current_page }}'
    total_pages: '{{ total_pages }}'
    has_prev: '{{ has_prev }}'
    has_next: '{{ has_next }}'
    s1_name: '{{ page_items[0].name if page_items | length > 0 else "" }}'
    s1_id: '{{ page_items[0].id if page_items | length > 0 else "" }}'
    s1_type: '{{ page_items[0].type if page_items | length > 0 else "" }}'
    s1_active: '{{ (page_items[0].active | bool) if page_items | length > 0 else false }}'
    s2_name: '{{ page_items[1].name if page_items | length > 1 else "" }}'
    s2_id: '{{ page_items[1].id if page_items | length > 1 else "" }}'
    s2_type: '{{ page_items[1].type if page_items | length > 1 else "" }}'
    s2_active: '{{ (page_items[1].active | bool) if page_items | length > 1 else false }}'
    s3_name: '{{ page_items[2].name if page_items | length > 2 else "" }}'
    s3_id: '{{ page_items[2].id if page_items | length > 2 else "" }}'
    s3_type: '{{ page_items[2].type if page_items | length > 2 else "" }}'
    s3_active: '{{ (page_items[2].active | bool) if page_items | length > 2 else false }}'
    s4_name: '{{ page_items[3].name if page_items | length > 3 else "" }}'
    s4_id: '{{ page_items[3].id if page_items | length > 3 else "" }}'
    s4_type: '{{ page_items[3].type if page_items | length > 3 else "" }}'
    s4_active: '{{ (page_items[3].active | bool) if page_items | length > 3 else false }}'
    s5_name: '{{ page_items[4].name if page_items | length > 4 else "" }}'
    s5_id: '{{ page_items[4].id if page_items | length > 4 else "" }}'
    s5_type: '{{ page_items[4].type if page_items | length > 4 else "" }}'
    s5_active: '{{ (page_items[4].active | bool) if page_items | length > 4 else false }}'

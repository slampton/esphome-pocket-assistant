alias: 'Pocket Assistant: Browse & Discovery'
description: Fetches paged lists of Music Assistant speakers, favorites, playlists,
  artists, albums, radio, podcasts, or tracks, and syncs them to the Pocket Assistant
  display.
mode: restart
fields:
  mode:
    description: 'Category mode: speakers, favorites, playlist, artist, album, radio,
      podcast_audiobook, track'
    example: speakers
    required: true
    selector:
      text: null
  page:
    description: Page number (1-based)
    example: 1
    default: 1
    selector:
      number:
        min: 1
        max: 500
  page_size:
    description: Number of items per page
    example: 3
    default: 3
    selector:
      number:
        min: 1
        max: 10
  search:
    description: Optional search query or parent filter (e.g. artist name or album
      name)
    example: Pink Floyd
    required: false
    selector:
      text: null
sequence:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ mode == ''speakers'' }}'
    sequence:
    - variables:
        active_speaker: '{{ states(''sensor.pocket_assistant_active_speaker'') | default(''media_player.pocket_assistant'',
          true) }}'
        all_mass_players: "{{ states.media_player\n   | selectattr('attributes.source_list',\
          \ 'defined')\n   | rejectattr('entity_id', 'in', ['media_player.pocket_assistant_pocket_assistant_assist',\
          \ 'media_player.pocket_assistant_pocket_assistant_music'])\n   | list }}\n"
        raw_items: "{% set ns = namespace(items=[]) %} {% for p in all_mass_players\
          \ %}\n  {% set ns.items = ns.items + [{\n    'name': p.attributes.friendly_name\
          \ | default(p.entity_id),\n    'id': p.entity_id,\n    'type': 'speaker',\n\
          \    'active': (p.entity_id == active_speaker or p.state in ['playing',\
          \ 'paused'])\n  }] %}\n{% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''favorites'' }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: "{{ config_entry_id(integration_entities('music_assistant') | select('match', '^media_player\\.') | first) }}"
        favorite: true
        limit: 500
      response_variable: mass_favs
    - variables:
        raw_favs: '{% set p_items = mass_favs.playlists.items if mass_favs.playlists
          is defined and mass_favs.playlists.items is defined else [] %} {% set r_items
          = mass_favs.radios.items if mass_favs.radios is defined and mass_favs.radios.items
          is defined else [] %} {% set t_items = mass_favs.tracks.items if mass_favs.tracks
          is defined and mass_favs.tracks.items is defined else [] %} {{ p_items +
          r_items + t_items }}

          '
        raw_items: "{% set ns = namespace(items=[]) %} {% for item in raw_favs %}\n\
          \  {% set mtype = item.media_type.value if item.media_type.value is defined\
          \ else (item.media_type ~ '') %}\n  {% set ns.items = ns.items + [{\n  \
          \  'name': item.name,\n    'id': item.uri,\n    'type': mtype,\n    'active':\
          \ false\n  }] %}\n{% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''playlist'' }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: "{{ config_entry_id(integration_entities('music_assistant') | select('match', '^media_player\\.') | first) }}"
        media_type: playlist
        limit: 500
      response_variable: mass_data
    - variables:
        raw_items: "{% set items = mass_data.playlists.items if mass_data.playlists\
          \ is defined and mass_data.playlists.items is defined else (mass_data.items\
          \ if mass_data.items is defined else []) %} {% set ns = namespace(items=[])\
          \ %} {% for item in items %}\n  {% set ns.items = ns.items + [{\n    'name':\
          \ item.name,\n    'id': item.uri,\n    'type': 'playlist',\n    'active':\
          \ false\n  }] %}\n{% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''artist'' }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: "{{ config_entry_id(integration_entities('music_assistant') | select('match', '^media_player\\.') | first) }}"
        media_type: artist
        limit: 500
      response_variable: mass_data
    - variables:
        raw_items: "{% set items = mass_data.artists.items if mass_data.artists is\
          \ defined and mass_data.artists.items is defined else (mass_data.items if\
          \ mass_data.items is defined else []) %} {% set ns = namespace(items=[])\
          \ %} {% for item in items %}\n  {% set ns.items = ns.items + [{\n    'name':\
          \ item.name,\n    'id': item.uri,\n    'type': 'artist',\n    'active':\
          \ false\n  }] %}\n{% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''album'' }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: "{{ config_entry_id(integration_entities('music_assistant') | select('match', '^media_player\\.') | first) }}"
        media_type: album
        limit: 500
      response_variable: mass_data
    - variables:
        raw_items: "{% set items = mass_data.albums.items if mass_data.albums is defined\
          \ and mass_data.albums.items is defined else (mass_data.items if mass_data.items\
          \ is defined else []) %} {% set ns = namespace(items=[]) %} {% for item\
          \ in items %}\n  {% set ns.items = ns.items + [{\n    'name': item.name,\n\
          \    'id': item.uri,\n    'type': 'album',\n    'active': false\n  }] %}\n\
          {% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''radio'' }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: "{{ config_entry_id(integration_entities('music_assistant') | select('match', '^media_player\\.') | first) }}"
        media_type: radio
        limit: 500
      response_variable: mass_data
    - variables:
        raw_items: "{% set items = mass_data.radios.items if mass_data.radios is defined\
          \ and mass_data.radios.items is defined else (mass_data.items if mass_data.items\
          \ is defined else []) %} {% set ns = namespace(items=[]) %} {% for item\
          \ in items %}\n  {% set ns.items = ns.items + [{\n    'name': item.name,\n\
          \    'id': item.uri,\n    'type': 'radio',\n    'active': false\n  }] %}\n\
          {% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''podcast_audiobook'' }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: "{{ config_entry_id(integration_entities('music_assistant') | select('match', '^media_player\\.') | first) }}"
        media_type: podcast
        limit: 500
      response_variable: mass_podcasts
    - action: music_assistant.get_library
      data:
        config_entry_id: "{{ config_entry_id(integration_entities('music_assistant') | select('match', '^media_player\\.') | first) }}"
        media_type: audiobook
        limit: 500
      response_variable: mass_audiobooks
    - variables:
        raw_items: "{% set pod_items = mass_podcasts.podcasts.items if mass_podcasts.podcasts\
          \ is defined and mass_podcasts.podcasts.items is defined else [] %} {% set\
          \ book_items = mass_audiobooks.audiobooks.items if mass_audiobooks.audiobooks\
          \ is defined and mass_audiobooks.audiobooks.items is defined else [] %}\
          \ {% set ns = namespace(items=[]) %} {% for item in (pod_items + book_items)\
          \ %}\n  {% set mtype = item.media_type.value if item.media_type.value is\
          \ defined else (item.media_type ~ '') %}\n  {% set ns.items = ns.items +\
          \ [{\n    'name': item.name,\n    'id': item.uri,\n    'type': mtype,\n\
          \    'active': false\n  }] %}\n{% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''track'' }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: "{{ config_entry_id(integration_entities('music_assistant') | select('match', '^media_player\\.') | first) }}"
        media_type: track
        limit: 500
      response_variable: mass_data
    - variables:
        raw_items: "{% set items = mass_data.tracks.items if mass_data.tracks is defined\
          \ and mass_data.tracks.items is defined else (mass_data.items if mass_data.items\
          \ is defined else []) %} {% set ns = namespace(items=[]) %} {% for item\
          \ in items %}\n  {% set ns.items = ns.items + [{\n    'name': item.name,\n\
          \    'id': item.uri,\n    'type': 'track',\n    'active': false\n  }] %}\n\
          {% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''artist_albums'' }}'
    sequence:
    - action: music_assistant.get_library
      data:
        config_entry_id: '{{ config_entry_id(integration_entities(''music_assistant'')
          | select(''match'', ''^media_player\.'') | first) }}'
        media_type: album
        search: '{{ search }}'
        limit: 500
      response_variable: mass_data
    - variables:
        raw_items: "{% set items = mass_data.albums.items if mass_data.albums is defined\
          \ and mass_data.albums.items is defined else (mass_data.items if mass_data.items\
          \ is defined else []) %} {% set ns = namespace(items=[]) %} {% for item\
          \ in items %}\n  {% set ns.items = ns.items + [{\n    'name': item.name,\n\
          \    'id': item.uri,\n    'type': 'album',\n    'active': false\n  }] %}\n\
          {% endfor %} {{ ns.items }}\n"
  - conditions:
    - condition: template
      value_template: '{{ mode == ''album_tracks'' }}'
    sequence:
    - action: media_player.browse_media
      target:
        entity_id: media_player.pocket_assistant
      data:
        media_content_type: music
        media_content_id: '{{ search }}'
      response_variable: album_tracks_resp
    - variables:
        raw_items: "{% set p_resp = album_tracks_resp['media_player.pocket_assistant']\
          \ | default({}) %}\n{% set children = p_resp.children | default([]) %}\n\
          {% set ns = namespace(items=[]) %}\n{% for item in children %}\n  {% set\
          \ clean_name = item.title.split(' - ', 1)[1] if ' - ' in item.title else\
          \ item.title %}\n  {% set ns.items = ns.items + [{\n    'name': clean_name,\n\
          \    'id': item.media_content_id,\n    'type': 'track',\n    'active': false\n\
          \  }] %}\n{% endfor %}\n{{ ns.items }}"
- variables:
    pg_num: '{{ [1, (page | default(1) | int)] | max }}'
    pg_size: '{{ [1, (page_size | default(3) | int)] | max }}'
    total_items: '{{ (raw_items | default([])) | length }}'
    total_pages: '{{ [1, ((total_items + pg_size - 1) // pg_size)] | max }}'
    current_page: '{{ [pg_num, total_pages] | min }}'
    start_idx: '{{ (current_page - 1) * pg_size }}'
    end_idx: '{{ current_page * pg_size }}'
    page_items: '{{ (raw_items | default([]))[start_idx:end_idx] }}'
    has_prev: '{{ current_page > 1 }}'
    has_next: '{{ current_page < total_pages }}'
- action: esphome.pocket_assistant_set_browse_slots
  continue_on_error: true
  data:
    mode: '{{ mode }}'
    page: '{{ current_page }}'
    total_pages: '{{ total_pages }}'
    has_prev: '{{ has_prev }}'
    has_next: '{{ has_next }}'
    s1_name: '{{ page_items[0].name if page_items | length > 0 else '''' }}'
    s1_id: '{{ page_items[0].id if page_items | length > 0 else '''' }}'
    s1_type: '{{ page_items[0].type if page_items | length > 0 else '''' }}'
    s1_active: '{{ page_items[0].active if page_items | length > 0 else false }}'
    s2_name: '{{ page_items[1].name if page_items | length > 1 else '''' }}'
    s2_id: '{{ page_items[1].id if page_items | length > 1 else '''' }}'
    s2_type: '{{ page_items[1].type if page_items | length > 1 else '''' }}'
    s2_active: '{{ page_items[1].active if page_items | length > 1 else false }}'
    s3_name: '{{ page_items[2].name if page_items | length > 2 else '''' }}'
    s3_id: '{{ page_items[2].id if page_items | length > 2 else '''' }}'
    s3_type: '{{ page_items[2].type if page_items | length > 2 else '''' }}'
    s3_active: '{{ page_items[2].active if page_items | length > 2 else false }}'
- stop: Done
  response_variable:
    mode: '{{ mode }}'
    page: '{{ current_page }}'
    total_pages: '{{ total_pages }}'
    total_items: '{{ total_items }}'
    has_prev: '{{ has_prev }}'
    has_next: '{{ has_next }}'
    items: '{{ page_items }}'

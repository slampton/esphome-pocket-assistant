# ==============================================================================
# 🌟 Home Assistant Companion Package: Pocket Assistant All-in-One Backend (v2.0)
# Single-File Drop-In Package (/config/packages/pocket_assistant_companion.yaml)
# Provides all 6 companion entities (Zero Blueprints Required):
#   1. input_text.pocket_assistant_active_speaker
#   2. input_text.pocket_assistant_weather_entity
#   3. input_text.pocket_assistant_base_url
#   4. sensor.pocket_assistant_active_media
#   5. sensor.pocket_assistant_weather_forecast
#   6. script.pocket_assistant_music_browse
# ==============================================================================

input_text:
  pocket_assistant_active_speaker:
    name: "Pocket Assistant Active Speaker"
    icon: mdi:speaker
    initial: "media_player.pocket_assistant"
  pocket_assistant_weather_entity:
    name: "Pocket Assistant Weather Entity"
    icon: mdi:weather-partly-cloudy
    initial: "weather.forecast_home" # Auto-falls back to your first Home Assistant weather.* entity if weather.forecast_home is not present
  pocket_assistant_base_url:
    name: "Pocket Assistant Home Assistant Base URL"
    icon: mdi:web
    initial: "" # Optional override for custom ports (e.g. http://192.168.1.10:8123). Defaults to http://homeassistant.local:8123 if blank.

template:
  # ----------------------------------------------------------------------------
  # 1. Active Media Mirror Sensor (Idle-guarded; 9 attributes on a single sensor)
  # ----------------------------------------------------------------------------
  - trigger:
      - trigger: state
        entity_id: input_text.pocket_assistant_active_speaker
        id: speaker_changed
      - trigger: homeassistant
        event: start
        id: ha_start
      - trigger: time_pattern
        seconds: "/2"
        id: poll_tick
    condition:
      - condition: template
        value_template: >-
          {% if trigger.id in ['speaker_changed', 'ha_start'] %}
            true
          {% else %}
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {{ target not in ['unknown', 'unavailable', ''] and (
               states(target) in ['playing', 'buffering']
               or states(target) != states('sensor.pocket_assistant_active_media')
               or (state_attr(target, 'media_title') | default('Idle', true)) != (state_attr('sensor.pocket_assistant_active_media', 'title') | default('Idle', true))
               or (state_attr(target, 'volume_level') | default(0.7, true) | round(2)) != (state_attr('sensor.pocket_assistant_active_media', 'volume') | default(0.7, true) | round(2))
            ) }}
          {% endif %}
    sensor:
      - name: "Pocket Assistant Active Media"
        unique_id: pocket_assistant_active_media
        icon: mdi:music
        state: >-
          {% set target = states('input_text.pocket_assistant_active_speaker') %}
          {% if not target or target in ['unknown', 'unavailable', ''] %}
            idle
          {% else %}
            {{ states(target) | default('idle', true) }}
          {% endif %}
        attributes:
          title: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', ''] %}
              Idle
            {% else %}
              {{ state_attr(target, 'media_title') | default('Idle', true) }}
            {% endif %}
          artist: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', ''] %}
              None
            {% else %}
              {{ state_attr(target, 'media_artist') | default('None', true) }}
            {% endif %}
          album: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', ''] %}
              None
            {% else %}
              {{ state_attr(target, 'media_album_name') | default('None', true) }}
            {% endif %}
          duration: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', ''] %}
              0
            {% else %}
              {{ state_attr(target, 'media_duration') | default(0, true) }}
            {% endif %}
          position: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', ''] %}
              0
            {% else %}
              {{ state_attr(target, 'media_position') | default(0, true) }}
            {% endif %}
          volume: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', ''] %}
              0.7
            {% else %}
              {{ state_attr(target, 'volume_level') | default(0.7, true) }}
            {% endif %}
          media_type: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', ''] %}
              music
            {% else %}
              {% set cid = state_attr(target, 'media_content_id') | default('', true) %}
              {% set ctype = state_attr(target, 'media_content_type') | default('', true) %}
              {% if 'podcast' in cid or 'podcast' in ctype %}
                podcast
              {% elif 'audiobook' in cid or 'audiobook' in ctype %}
                audiobook
              {% else %}
                music
              {% endif %}
            {% endif %}
          supported_features: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', ''] %}
              0
            {% else %}
              {{ state_attr(target, 'supported_features') | default(0, true) | int(0) }}
            {% endif %}
          art_url: >-
            {% set target = states('input_text.pocket_assistant_active_speaker') %}
            {% if not target or target in ['unknown', 'unavailable', '', 'media_player.pocket_assistant'] %}
              none
            {% else %}
              {% set pic = state_attr(target, 'entity_picture') or state_attr(target, 'media_image_url') %}
              {% if pic and pic not in ['none', 'unknown', 'unavailable'] %}
                {% if pic.startswith('http') %}
                  {{ pic }}
                {% elif pic.startswith('/') %}
                  {% set custom_base = states('input_text.pocket_assistant_base_url') %}
                  {% set base = custom_base if custom_base and custom_base not in ['unknown', 'unavailable', ''] else 'http://homeassistant.local:8123' %}
                  {{ base.rstrip('/') ~ pic }}
                {% else %}
                  none
                {% endif %}
              {% else %}
                none
              {% endif %}
            {% endif %}

  # ----------------------------------------------------------------------------
  # 2. Daily & 5-Day Weather Forecast Sensor (Auto-discovers weather.* fallback)
  # ----------------------------------------------------------------------------
  - trigger:
      - trigger: time_pattern
        hours: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_text.pocket_assistant_weather_entity
    action:
      - variables:
          target_weather: >-
            {% set w = states("input_text.pocket_assistant_weather_entity") %}
            {% if w and w not in ["unknown", "unavailable", ""] and states(w) not in ["unknown", "unavailable"] %}
              {{ w }}
            {% elif states("weather.forecast_home") not in ["unknown", "unavailable"] %}
              weather.forecast_home
            {% elif states("weather.home") not in ["unknown", "unavailable"] %}
              weather.home
            {% else %}
              {{ states.weather | map(attribute='entity_id') | first | default("weather.forecast_home", true) }}
            {% endif %}
      - action: weather.get_forecasts
        target:
          entity_id: "{{ target_weather }}"
        data:
          type: daily
        response_variable: daily_forecast
    sensor:
      - name: "Pocket Assistant Weather Forecast"
        unique_id: pocket_assistant_weather_forecast
        icon: mdi:weather-partly-cloudy
        state: >-
          {% set w_cfg = states("input_text.pocket_assistant_weather_entity") %}
          {% set target_weather = w_cfg if (w_cfg and states(w_cfg) not in ["unknown", "unavailable"]) else (states.weather | map(attribute="entity_id") | first | default("weather.forecast_home", true)) %}
          {% set ns = namespace(items=[]) %}
          {% set fc_list = [] %}
          {% if daily_forecast is defined and target_weather in daily_forecast and daily_forecast[target_weather]["forecast"] %}
            {% set fc_list = daily_forecast[target_weather]["forecast"] %}
          {% elif state_attr(target_weather, "forecast") %}
            {% set fc_list = state_attr(target_weather, "forecast") %}
          {% endif %}
          {% if fc_list %}
            {% for item in fc_list[:5] %}
              {% set day_name = as_timestamp(item.datetime) | timestamp_custom("%a", true) | upper %}
              {% set high = item.temperature | round(0) %}
              {% set low = item.templow | default(item.temperature, true) | round(0) %}
              {% set cond = item.condition | default("sunny") %}
              {% set ns.items = ns.items + [day_name ~ ":" ~ high ~ ":" ~ low ~ ":" ~ cond] %}
            {% endfor %}
            {{ ns.items | join(";") }}
          {% else %}
            Unavailable
          {% endif %}
        attributes:
          high: >-
            {% set w_cfg = states("input_text.pocket_assistant_weather_entity") %}
            {% set target_weather = w_cfg if (w_cfg and states(w_cfg) not in ["unknown", "unavailable"]) else (states.weather | map(attribute="entity_id") | first | default("weather.forecast_home", true)) %}
            {% if daily_forecast is defined and target_weather in daily_forecast and daily_forecast[target_weather]["forecast"] %}
              {{ daily_forecast[target_weather]["forecast"][0]["temperature"] | default(70, true) }}
            {% elif state_attr(target_weather, "forecast") %}
              {{ state_attr(target_weather, "forecast")[0]["temperature"] | default(70, true) }}
            {% else %}
              70
            {% endif %}
          low: >-
            {% set w_cfg = states("input_text.pocket_assistant_weather_entity") %}
            {% set target_weather = w_cfg if (w_cfg and states(w_cfg) not in ["unknown", "unavailable"]) else (states.weather | map(attribute="entity_id") | first | default("weather.forecast_home", true)) %}
            {% if daily_forecast is defined and target_weather in daily_forecast and daily_forecast[target_weather]["forecast"] %}
              {{ daily_forecast[target_weather]["forecast"][0]["templow"] | default(daily_forecast[target_weather]["forecast"][0]["temperature"], true) }}
            {% elif state_attr(target_weather, "forecast") %}
              {{ state_attr(target_weather, "forecast")[0]["templow"] | default(state_attr(target_weather, "forecast")[0]["temperature"], true) }}
            {% else %}
              50
            {% endif %}

# ------------------------------------------------------------------------------
# 3. Embedded Music Assistant 5-Slot Browse & Discovery Script
#    Entity ID: script.pocket_assistant_music_browse
# ------------------------------------------------------------------------------
script:
  pocket_assistant_music_browse:
    alias: "Pocket Assistant Music Browse"
    description: "Fetches paged Music Assistant speakers, favorites, playlists, artists, albums, radio, podcasts, audiobooks, tracks, and queues, and pushes them to Pocket Assistant."
    icon: mdi:bookshelf
    mode: restart
    fields:
      target_device:
        description: "Target ESPHome device name (defaults to pocket-assistant)"
        default: "pocket-assistant"
      mode:
        description: "Category mode: speakers, favorites, playlist, artist, album, radio, podcast, audiobook, track, artist_albums, album_tracks, current_album_tracks, active_queue, podcast_episodes"
        default: "speakers"
      page:
        description: "Page number (1-based)"
        default: 1
      page_size:
        description: "Number of items per page"
        default: 5
      search:
        description: "Search term or URI for sub-queries"
        default: ""
      speaker:
        description: "Currently active speaker entity ID"
        default: ""
      last_speaker:
        description: "Previously used speaker entity ID"
        default: ""
      album_sort:
        description: "Preferred sort order for library albums (name, year_desc, year)"
        default: "name"
      artist_album_sort:
        description: "Preferred sort order for artist discographies (year, year_desc, name)"
        default: "year"
      podcast_sort:
        description: "Preferred sort order for podcast episodes (newest, oldest)"
        default: "newest"
      mass_queue_entry:
        description: "Optional mass_queue Config Entry ID (passed from mass_queue_config_entry substitution)"
        default: ""
    sequence:
      - variables:
          dev_input: '{{ target_device if (target_device | default("") != "") else "pocket-assistant" }}'
          helper_entity: "input_text.pocket_assistant_active_speaker"
          album_sort_order: '{{ album_sort if (album_sort | default("") != "") else "name" }}'
          artist_album_sort_order: '{{ artist_album_sort if (artist_album_sort | default("") != "") else "year" }}'
          podcast_sort_order: '{{ podcast_sort if (podcast_sort | default("") != "") else "newest" }}'
          resolved_mass_queue_entry: >-
            {% if mass_queue_entry is defined and (mass_queue_entry | default("", true) | trim) != "" %}
              {{ mass_queue_entry | trim }}
            {% else %}
              {% set mq_ents = integration_entities("mass_queue") %}
              {{ config_entry_id(mq_ents | first) if mq_ents | length > 0 else "" }}
            {% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: '{{ mode == "speakers" }}'
            sequence:
              - variables:
                  raw_items: >-
                    {% set all_mass_players = integration_entities("music_assistant") | select("match", "^media_player") | reject("match", ".*_tablet$") | reject("match", ".*_announcement$") | list %}
                    {% set helper_val = states(helper_entity) if helper_entity and states(helper_entity) not in ["unknown", "unavailable", ""] else "" %}
                    {% set local_spk = "media_player." ~ (dev_input | replace("-", "_")) %}
                    {% if speaker | default("") != "" and speaker in all_mass_players %}
                      {% set act_spk = speaker %}
                    {% elif helper_val in all_mass_players %}
                      {% set act_spk = helper_val %}
                    {% else %}
                      {% set act_spk = local_spk %}
                    {% endif %}
                    {% set mut = namespace(ordered=[]) %}
                    {% if act_spk in all_mass_players %}
                      {% set mut.ordered = mut.ordered + [act_spk] %}
                    {% endif %}
                    {% if local_spk in all_mass_players and local_spk not in mut.ordered %}
                      {% set mut.ordered = mut.ordered + [local_spk] %}
                    {% endif %}
                    {% if last_speaker | default("") != "" and last_speaker in all_mass_players and last_speaker not in mut.ordered %}
                      {% set mut.ordered = mut.ordered + [last_speaker] %}
                    {% endif %}
                    {% set rem = namespace(items=[]) %}
                    {% for entity in all_mass_players %}
                      {% if entity not in mut.ordered %}
                        {% set rem.items = rem.items + [entity] %}
                      {% endif %}
                    {% endfor %}
                    {% set final_list = mut.ordered + (rem.items | sort) %}
                    {% set ns = namespace(items=[]) %}
                    {% for entity in final_list %}
                      {% set fname = state_attr(entity, "friendly_name") | default(entity.split(".")[1] | replace("_", " ") | title, true) %}
                      {% set is_active = (entity == act_spk) %}
                      {% set ns.items = ns.items + [{
                        "name": fname,
                        "id": entity,
                        "type": "speaker",
                        "active": is_active
                      }] %}
                    {% endfor %}
                    {{ ns.items | to_json }}
          - conditions:
              - condition: template
                value_template: '{{ mode == "favorites" }}'
            sequence:
              - action: music_assistant.get_library
                data:
                  config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
                  media_type: track
                  favorite: true
                  limit: 500
                  order_by: name
                response_variable: fav_tracks_resp
              - action: music_assistant.get_library
                data:
                  config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
                  media_type: playlist
                  favorite: true
                  limit: 500
                  order_by: name
                response_variable: fav_playlists_resp
              - action: music_assistant.get_library
                data:
                  config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
                  media_type: artist
                  favorite: true
                  limit: 500
                  order_by: name
                response_variable: fav_artists_resp
              - action: music_assistant.get_library
                data:
                  config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
                  media_type: album
                  favorite: true
                  limit: 500
                  order_by: name
                response_variable: fav_albums_resp
              - action: music_assistant.get_library
                data:
                  config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
                  media_type: radio
                  favorite: true
                  limit: 500
                  order_by: name
                response_variable: fav_radios_resp
              - variables:
                  raw_items: >-
                    {% set all_favs = (fav_tracks_resp["items"] | default([])) + (fav_playlists_resp["items"] | default([])) + (fav_artists_resp["items"] | default([])) + (fav_albums_resp["items"] | default([])) + (fav_radios_resp["items"] | default([])) %}
                    {% set ns = namespace(items=[]) %}
                    {% for item in all_favs %}
                      {% set mtype = item.media_type.value if item.media_type is mapping and item.media_type.value is defined else (item.media_type ~ "") %}
                      {% set ns.items = ns.items + [{
                        "name": item.name,
                        "id": item.uri,
                        "type": mtype if mtype != "" else "track",
                        "active": false
                      }] %}
                    {% endfor %}
                    {{ ns.items | sort(attribute="name") | to_json }}
          - conditions:
              - condition: template
                value_template: '{{ mode == "artist_albums" }}'
            sequence:
              - action: music_assistant.get_library
                data:
                  config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
                  media_type: album
                  search: '{{ search }}'
                  favorite: false
                  limit: 1000
                  order_by: '{{ artist_album_sort_order }}'
                response_variable: artist_albums_resp
              - variables:
                  raw_items: >-
                    {% set all_lib = artist_albums_resp["items"] | default([]) %}
                    {% set ns = namespace(items=[]) %}
                    {% for item in all_lib %}
                      {% set ns.items = ns.items + [{
                        "name": item.name,
                        "id": item.uri,
                        "type": "album",
                        "active": false
                      }] %}
                    {% endfor %}
                    {{ ns.items | to_json }}
          - conditions:
              - condition: template
                value_template: '{{ mode == "current_album_tracks" }}'
            sequence:
              - variables:
                  all_mass_players: '{{ integration_entities("music_assistant") | select("match", "^media_player") | list }}'
                  helper_val: '{{ states(helper_entity) if helper_entity and states(helper_entity) not in ["unknown", "unavailable", ""] else "" }}'
                  local_spk: '{{ "media_player." ~ (dev_input | replace("-", "_")) }}'
                  target_spk: >-
                    {% if speaker | default("") != "" and speaker in all_mass_players %}
                      {{ speaker }}
                    {% elif helper_val in all_mass_players %}
                      {{ helper_val }}
                    {% elif local_spk in all_mass_players %}
                      {{ local_spk }}
                    {% else %}
                      {{ all_mass_players | first | default(local_spk, true) }}
                    {% endif %}
                  raw_alb_query: '{{ search if (search | default("") != "" and search not in ["None", "Idle"]) else (state_attr(target_spk, "media_album_name") | default("", true)) }}'
                  clean_alb_query: '{{ raw_alb_query | regex_replace("\\s*[\\(\\[].*?[\\)\\]]", "") | trim }}'
              - action: music_assistant.get_queue
                continue_on_error: true
                target:
                  entity_id: '{{ target_spk }}'
                response_variable: q_alb_resp
              - variables:
                  queue_alb_uri: >-
                    {% set q_data = (q_alb_resp.values() | list | first) if q_alb_resp is defined and q_alb_resp is mapping and (q_alb_resp.values() | list | length > 0) else {} %}
                    {% set cur_item = q_data.current_item if q_data is mapping and q_data.current_item is defined and q_data.current_item is mapping else {} %}
                    {% set m_item = cur_item.media_item if cur_item is mapping and cur_item.media_item is defined and cur_item.media_item is mapping else {} %}
                    {% set alb_obj = m_item.album if m_item is mapping and m_item.album is defined and m_item.album is mapping else {} %}
                    {{ alb_obj.uri | default("", true) }}
              - if:
                  - condition: template
                    value_template: '{{ queue_alb_uri == "" and clean_alb_query != "" }}'
                then:
                  - action: music_assistant.get_library
                    continue_on_error: true
                    data:
                      config_entry_id: '{{ config_entry_id(all_mass_players | first) }}'
                      media_type: album
                      search: '{{ clean_alb_query }}'
                      limit: 5
                    response_variable: cur_alb_resp
              - variables:
                  resolved_alb_uri: >-
                    {% if queue_alb_uri != "" %}
                      {{ queue_alb_uri }}
                    {% else %}
                      {% set items = cur_alb_resp["items"] | default([]) if cur_alb_resp is defined and cur_alb_resp is mapping else [] %}
                      {{ items[0].uri if items | length > 0 else "" }}
                    {% endif %}
              - if:
                  - condition: template
                    value_template: '{{ resolved_alb_uri != "" }}'
                then:
                  - action: media_player.browse_media
                    continue_on_error: true
                    target:
                      entity_id: '{{ target_spk }}'
                    data:
                      media_content_type: "music"
                      media_content_id: '{{ resolved_alb_uri }}'
                    response_variable: cur_alb_tracks_resp
              - variables:
                  raw_items: >-
                    {% set p_resp = (cur_alb_tracks_resp.values() | list | first) if cur_alb_tracks_resp is defined and cur_alb_tracks_resp is mapping and (cur_alb_tracks_resp.values() | list | length > 0) else {} %}
                    {% set children = p_resp.children | default([]) %}
                    {% set cur_title = state_attr(target_spk, "media_title") | default("", true) %}
                    {% set ns = namespace(items=[]) %}
                    {% for item in children %}
                      {% set clean_name = item.title.split(" - ", 1)[1] if " - " in item.title else item.title %}
                      {% set numbered_name = loop.index ~ ". " ~ clean_name %}
                      {% set ns.items = ns.items + [{
                        "name": numbered_name,
                        "id": item.media_content_id,
                        "type": "track",
                        "active": (cur_title != "" and (clean_name | lower) == (cur_title | lower))
                      }] %}
                    {% endfor %}
                    {% if ns.items | length == 0 %}
                      {% set ns.items = [{"name": "No album tracks found", "id": "", "type": "text", "active": false}] %}
                    {% endif %}
                    {{ ns.items | to_json }}
          - conditions:
              - condition: template
                value_template: '{{ mode == "active_queue" }}'
            sequence:
              - variables:
                  all_mass_players: '{{ integration_entities("music_assistant") | select("match", "^media_player") | list }}'
                  helper_val: '{{ states(helper_entity) if helper_entity and states(helper_entity) not in ["unknown", "unavailable", ""] else "" }}'
                  local_spk: '{{ "media_player." ~ (dev_input | replace("-", "_")) }}'
                  target_spk: >-
                    {% if speaker | default("") != "" and speaker in all_mass_players %}
                      {{ speaker }}
                    {% elif helper_val in all_mass_players %}
                      {{ helper_val }}
                    {% elif local_spk in all_mass_players %}
                      {{ local_spk }}
                    {% else %}
                      {{ all_mass_players | first | default(local_spk, true) }}
                    {% endif %}
              - if:
                  - condition: template
                    value_template: '{{ resolved_mass_queue_entry != "" }}'
                then:
                  - action: mass_queue.get_queue_items
                    continue_on_error: true
                    data:
                      entity: '{{ target_spk }}'
                      limit_before: 1
                      limit_after: 50
                    response_variable: mq_items_resp
              - action: music_assistant.get_queue
                continue_on_error: true
                target:
                  entity_id: '{{ target_spk }}'
                response_variable: ma_q_resp
              - variables:
                  raw_items: >-
                    {% set cur_title = state_attr(target_spk, "media_title") | default("", true) %}
                    {% set q_list = (mq_items_resp[target_spk] if mq_items_resp is defined and mq_items_resp is mapping and target_spk in mq_items_resp else []) %}
                    {% set ns = namespace(items=[]) %}
                    {% if q_list is iterable and (q_list | length > 0) %}
                      {% for ep in q_list %}
                        {% set t_name = ep.media_title | default(ep.name | default("Track", true), true) %}
                        {% set t_id = ep.media_content_id | default(ep.uri | default("", true), true) %}
                        {% if t_id != "" %}
                          {% set idx = (ns.items | length) + 1 %}
                          {% set ns.items = ns.items + [{
                            "name": idx ~ ". " ~ t_name,
                            "id": t_id,
                            "type": "track",
                            "active": (cur_title != "" and (t_name | lower) == (cur_title | lower))
                          }] %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                    {% if ns.items | length == 0 %}
                      {% set q_data = (ma_q_resp.values() | list | first) if ma_q_resp is defined and ma_q_resp is mapping and (ma_q_resp.values() | list | length > 0) else {} %}
                      {% set c_it = q_data.current_item if q_data is mapping and q_data.current_item is defined and q_data.current_item is mapping else {} %}
                      {% set n_it = q_data.next_item if q_data is mapping and q_data.next_item is defined and q_data.next_item is mapping else {} %}
                      {% if c_it.media_item is defined and c_it.media_item is mapping %}
                        {% set ns.items = ns.items + [{
                          "name": "1. " ~ (c_it.media_item.name | default(c_it.name, true)),
                          "id": c_it.media_item.uri | default("", true),
                          "type": "track",
                          "active": true
                        }] %}
                      {% endif %}
                      {% if n_it.media_item is defined and n_it.media_item is mapping %}
                        {% set ns.items = ns.items + [{
                          "name": "2. " ~ (n_it.media_item.name | default(n_it.name, true)),
                          "id": n_it.media_item.uri | default("", true),
                          "type": "track",
                          "active": false
                        }] %}
                      {% endif %}
                    {% endif %}
                    {% if ns.items | length == 0 %}
                      {% set ns.items = [{"name": "Queue is empty", "id": "", "type": "text", "active": false}] %}
                    {% endif %}
                    {{ ns.items | to_json }}
          - conditions:
              - condition: template
                value_template: '{{ mode == "album_tracks" }}'
            sequence:
              - action: media_player.browse_media
                target:
                  entity_id: '{{ integration_entities("music_assistant") | select("match", "^media_player") | first }}'
                data:
                  media_content_type: "music"
                  media_content_id: '{{ search }}'
                response_variable: album_tracks_resp
              - variables:
                  raw_items: >-
                    {% set p_resp = (album_tracks_resp.values() | list | first) if album_tracks_resp is mapping and (album_tracks_resp.values() | list | length > 0) else {} %}
                    {% set children = p_resp.children | default([]) %}
                    {% set ns = namespace(items=[]) %}
                    {% for item in children %}
                      {% set clean_name = item.title.split(" - ", 1)[1] if " - " in item.title else item.title %}
                      {% set numbered_name = loop.index ~ ". " ~ clean_name %}
                      {% set ns.items = ns.items + [{
                        "name": numbered_name,
                        "id": item.media_content_id,
                        "type": "track",
                        "active": false
                      }] %}
                    {% endfor %}
                    {{ ns.items | to_json }}
          - conditions:
              - condition: template
                value_template: '{{ mode == "podcast_episodes" }}'
            sequence:
              - if:
                  - condition: template
                    value_template: '{{ resolved_mass_queue_entry != "" }}'
                then:
                  - action: mass_queue.get_podcast_episodes
                    continue_on_error: true
                    data:
                      config_entry_id: '{{ resolved_mass_queue_entry }}'
                      uri: '{{ search }}'
                    response_variable: pod_ep_resp
              - variables:
                  raw_items: >-
                    {% set episodes = (pod_ep_resp.episodes if pod_ep_resp is defined and pod_ep_resp is mapping and 'episodes' in pod_ep_resp else []) %}
                    {% set p_sort = podcast_sort_order | default("newest") %}
                    {% set sorted_eps = episodes if p_sort == "newest" else (episodes | reverse | list) %}
                    {% set ns = namespace(items=[]) %}
                    {% for ep in sorted_eps %}
                      {% set ns.items = ns.items + [{
                        "name": ep.media_title,
                        "id": ep.media_content_id,
                        "type": "podcast_episode",
                        "active": false
                      }] %}
                    {% endfor %}
                    {% if ns.items | length == 0 %}
                      {% set msg = "Set mass_queue_config_entry" if resolved_mass_queue_entry == "" else "No episodes found" %}
                      {% set ns.items = [{"name": msg, "id": "", "type": "text", "active": false}] %}
                    {% endif %}
                    {{ ns.items | to_json }}
          - conditions:
              - condition: template
                value_template: >-
                  {{ mode in ['playlist', 'artist', 'album', 'radio', 'track', 'podcast', 'audiobook'] }}
            sequence:
              - action: music_assistant.get_library
                data:
                  config_entry_id: '{{ config_entry_id(integration_entities("music_assistant") | select("match", "^media_player") | first) }}'
                  media_type: '{{ mode }}'
                  favorite: false
                  limit: 1000
                  order_by: '{{ album_sort_order if mode == "album" else "name" }}'
                response_variable: lib_resp
              - variables:
                  raw_items: >-
                    {% set all_lib = lib_resp["items"] | default([]) %}
                    {% set ns = namespace(items=[]) %}
                    {% for item in all_lib %}
                      {% set mtype = item.media_type.value if item.media_type is mapping and item.media_type.value is defined else (item.media_type ~ "") %}
                      {% set ns.items = ns.items + [{
                        "name": item.name,
                        "id": item.uri,
                        "type": mtype if mtype != "" else mode,
                        "active": false
                      }] %}
                    {% endfor %}
                    {{ ns.items | to_json }}
      - variables:
          parsed_items: '{{ (raw_items | from_json) if raw_items is string else (raw_items | default([])) }}'
      - variables:
          pg_num: '{{ [1, (page | default(1) | int)] | max }}'
          pg_size: '{{ [1, (page_size | default(5) | int)] | max }}'
          total_items: '{{ (parsed_items | default([])) | length }}'
      - variables:
          total_pages: '{{ [1, ((total_items + pg_size - 1) // pg_size)] | max }}'
      - variables:
          current_page: '{{ [pg_num, total_pages] | min }}'
      - variables:
          start_idx: '{{ (current_page - 1) * pg_size }}'
          end_idx: '{{ current_page * pg_size }}'
          has_prev: '{{ total_pages > 1 }}'
          has_next: '{{ total_pages > 1 }}'
      - variables:
          page_items: '{{ (parsed_items | default([]))[start_idx:end_idx] }}'
      - variables:
          target_action: 'esphome.{{ (dev_input | replace("-", "_")) }}_set_browse_slots'
      - action: '{{ target_action }}'
        continue_on_error: true
        data:
          mode: '{{ mode }}'
          page: '{{ current_page }}'
          total_pages: '{{ total_pages }}'
          has_prev: '{{ has_prev }}'
          has_next: '{{ has_next }}'
          s1_name: '{{ page_items[0].name if page_items | length > 0 else "" }}'
          s1_id: '{{ page_items[0].id if page_items | length > 0 else "" }}'
          s1_type: '{{ page_items[0].type if page_items | length > 0 else "" }}'
          s1_active: '{{ (page_items[0].active | bool) if page_items | length > 0 else false }}'
          s2_name: '{{ page_items[1].name if page_items | length > 1 else "" }}'
          s2_id: '{{ page_items[1].id if page_items | length > 1 else "" }}'
          s2_type: '{{ page_items[1].type if page_items | length > 1 else "" }}'
          s2_active: '{{ (page_items[1].active | bool) if page_items | length > 1 else false }}'
          s3_name: '{{ page_items[2].name if page_items | length > 2 else "" }}'
          s3_id: '{{ page_items[2].id if page_items | length > 2 else "" }}'
          s3_type: '{{ page_items[2].type if page_items | length > 2 else "" }}'
          s3_active: '{{ (page_items[2].active | bool) if page_items | length > 2 else false }}'
          s4_name: '{{ page_items[3].name if page_items | length > 3 else "" }}'
          s4_id: '{{ page_items[3].id if page_items | length > 3 else "" }}'
          s4_type: '{{ page_items[3].type if page_items | length > 3 else "" }}'
          s4_active: '{{ (page_items[3].active | bool) if page_items | length > 3 else false }}'
          s5_name: '{{ page_items[4].name if page_items | length > 4 else "" }}'
          s5_id: '{{ page_items[4].id if page_items | length > 4 else "" }}'
          s5_type: '{{ page_items[4].type if page_items | length > 4 else "" }}'
          s5_active: '{{ (page_items[4].active | bool) if page_items | length > 4 else false }}'

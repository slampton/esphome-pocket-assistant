# ==============================================================================
# ⛅ Home Assistant Companion Package: Pocket Assistant Weather Mirror Sensors
# Extracts daily high/low and serialized forecast for Pocket Assistant ESPHome
#
# NOTE: If your local weather entity is not 'weather.oakland', replace all
# occurrences of 'weather.oakland' in this file with your entity ID (e.g., 'weather.home').
# ==============================================================================

template:
  - trigger:
      - platform: time_pattern
        hours: "/1"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: weather.oakland
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.oakland
        data:
          type: daily
        response_variable: daily_forecast
    sensor:
      - name: "Pocket Assistant Weather High"
        unique_id: pocket_assistant_weather_high
        state: >-
          {% if daily_forecast is defined and "weather.oakland" in daily_forecast and daily_forecast["weather.oakland"]["forecast"] %}
            {{ daily_forecast["weather.oakland"]["forecast"][0]["temperature"] }}
          {% elif state_attr("weather.oakland", "forecast") %}
            {{ state_attr("weather.oakland", "forecast")[0]["temperature"] }}
          {% else %}
            {{ states("sensor.pocket_assistant_weather_high") }}
          {% endif %}
        unit_of_measurement: "°F"

      - name: "Pocket Assistant Weather Low"
        unique_id: pocket_assistant_weather_low
        state: >-
          {% if daily_forecast is defined and "weather.oakland" in daily_forecast and daily_forecast["weather.oakland"]["forecast"] %}
            {{ daily_forecast["weather.oakland"]["forecast"][0]["templow"] }}
          {% elif state_attr("weather.oakland", "forecast") %}
            {{ state_attr("weather.oakland", "forecast")[0]["templow"] }}
          {% else %}
            {{ states("sensor.pocket_assistant_weather_low") }}
          {% endif %}
        unit_of_measurement: "°F"

      - name: "Pocket Assistant Weather Forecast 5D"
        unique_id: pocket_assistant_weather_forecast_5d
        state: >-
          {% set ns = namespace(items=[]) %}
          {% set fc_list = [] %}
          {% if daily_forecast is defined and "weather.oakland" in daily_forecast and daily_forecast["weather.oakland"]["forecast"] %}
            {% set fc_list = daily_forecast["weather.oakland"]["forecast"] %}
          {% elif state_attr("weather.oakland", "forecast") %}
            {% set fc_list = state_attr("weather.oakland", "forecast") %}
          {% endif %}
          {% if fc_list %}
            {% for item in fc_list[:5] %}
              {% set day_name = as_timestamp(item.datetime) | timestamp_custom("%a", true) | upper %}
              {% set high = item.temperature | round(0) %}
              {% set low = item.templow | default(item.temperature, true) | round(0) %}
              {% set cond = item.condition | default("sunny") %}
              {% set ns.items = ns.items + [day_name ~ ":" ~ high ~ ":" ~ low ~ ":" ~ cond] %}
            {% endfor %}
            {{ ns.items | join(";") }}
          {% else %}
            Unavailable
          {% endif %}

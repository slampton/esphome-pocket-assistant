# ==============================================================================
# ⛅ Home Assistant Companion Package: Pocket Assistant Weather Mirror Sensors
# Extracts daily high/low and serialized forecast for Pocket Assistant ESPHome
# ==============================================================================

input_text:
  pocket_assistant_weather_entity:
    name: "Pocket Assistant Weather Entity"
    icon: mdi:weather-partly-cloudy
    initial: "weather.forecast_home" # Set to your primary Home Assistant weather entity (e.g. weather.home, weather.forecast_home)

template:
  - trigger:
      - trigger: time_pattern
        hours: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_text.pocket_assistant_weather_entity
    action:
      - variables:
          target_weather: >-
            {% set w = states("input_text.pocket_assistant_weather_entity") %}
            {{ w if w and w not in ["unknown", "unavailable", ""] else "weather.forecast_home" }}
      - action: weather.get_forecasts
        target:
          entity_id: "{{ target_weather }}"
        data:
          type: daily
        response_variable: daily_forecast
    sensor:
      - name: "Pocket Assistant Weather High"
        unique_id: pocket_assistant_weather_high
        state: >-
          {% set target_weather = states("input_text.pocket_assistant_weather_entity") | default("weather.forecast_home", true) %}
          {% if daily_forecast is defined and target_weather in daily_forecast and daily_forecast[target_weather]["forecast"] %}
            {{ daily_forecast[target_weather]["forecast"][0]["temperature"] }}
          {% elif state_attr(target_weather, "forecast") %}
            {{ state_attr(target_weather, "forecast")[0]["temperature"] }}
          {% else %}
            {{ states("sensor.pocket_assistant_weather_high") }}
          {% endif %}
        unit_of_measurement: "°F"

      - name: "Pocket Assistant Weather Low"
        unique_id: pocket_assistant_weather_low
        state: >-
          {% set target_weather = states("input_text.pocket_assistant_weather_entity") | default("weather.forecast_home", true) %}
          {% if daily_forecast is defined and target_weather in daily_forecast and daily_forecast[target_weather]["forecast"] %}
            {{ daily_forecast[target_weather]["forecast"][0]["templow"] }}
          {% elif state_attr(target_weather, "forecast") %}
            {{ state_attr(target_weather, "forecast")[0]["templow"] }}
          {% else %}
            {{ states("sensor.pocket_assistant_weather_low") }}
          {% endif %}
        unit_of_measurement: "°F"

      - name: "Pocket Assistant Weather Forecast 5D"
        unique_id: pocket_assistant_weather_forecast_5d
        state: >-
          {% set target_weather = states("input_text.pocket_assistant_weather_entity") | default("weather.forecast_home", true) %}
          {% set ns = namespace(items=[]) %}
          {% set fc_list = [] %}
          {% if daily_forecast is defined and target_weather in daily_forecast and daily_forecast[target_weather]["forecast"] %}
            {% set fc_list = daily_forecast[target_weather]["forecast"] %}
          {% elif state_attr(target_weather, "forecast") %}
            {% set fc_list = state_attr(target_weather, "forecast") %}
          {% endif %}
          {% if fc_list %}
            {% for item in fc_list[:5] %}
              {% set day_name = as_timestamp(item.datetime) | timestamp_custom("%a", true) | upper %}
              {% set high = item.temperature | round(0) %}
              {% set low = item.templow | default(item.temperature, true) | round(0) %}
              {% set cond = item.condition | default("sunny") %}
              {% set ns.items = ns.items + [day_name ~ ":" ~ high ~ ":" ~ low ~ ":" ~ cond] %}
            {% endfor %}
            {{ ns.items | join(";") }}
          {% else %}
            Unavailable
          {% endif %}

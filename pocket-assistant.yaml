# Build-Stamp: 2026-10-23 16:36:00
# ==============================================================================
# Pocket Assistant (v2.1 Modular Architecture)
# Target: Waveshare ESP32-S3-Touch-AMOLED-1.75C
# Framework: ESPHome 2026.10.0+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-pocket-assistant
# ==============================================================================

substitutions:
  name: "pocket-assistant"
  friendly_name: "Pocket Assistant"
  version: "2.1.0"
  default_start_app: "Home"
  default_art_mode: "Full Screen"
  default_screensaver_style: "Aurora Borealis"
  default_album_sort: "Alphabetical"
  default_artist_album_sort: "Oldest on Top"
  default_podcast_sort: "Newest on Top"
  # Latter Companion Integration Entities (Zero-YAML Auto-Discovered)
  active_media_sensor: "sensor.pocket_assistant_active_media"
  weather_forecast_sensor: "sensor.pocket_assistant_weather_forecast"
  room_context_sensor: "sensor.pocket_assistant_room_context"
  calendar_agenda_sensor: "sensor.pocket_assistant_calendar_agenda"
  remote_config_sensor: "sensor.pocket_assistant_remote_config"

  # Initial Boot Placeholder Art (Overridden dynamically on track playback)
  initial_art_url: "http://homeassistant.local:8123/static/icons/favicon-192x192.png"

  # Local Media Player Identity
  local_player_id: "media_player.pocket_assistant"

  # Sky & Weather Entities (Auto-falls back to Latter weather_forecast_sensor)
  weather_entity: "weather.forecast_home"
  sun_entity: "sun.sun"
  moon_entity: "sensor.moon_phase"


dashboard_import:
  package_import_url: github://slampton/esphome-pocket-assistant/pocket-assistant-1.75c.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: "slampton.pocket-assistant-175c"
    version: "${version}"
  includes:
    - va_cancel_helper.h
    - ui_core.h
    - ui_ambient_va.h
    - ui_weather_sky.h
    - ui_games.h
    - ui_tools_apps.h
    - ui_toolkit.h
  on_boot:
    - priority: 800
      then:
      - lambda: |-
          // Calibrate internal RTC slow clock against 40MHz crystal
          extern uint32_t rtc_clk_cal(int cal_clk, uint32_t slow_clk_cycles) __asm__("rtc_clk_cal");
          uint32_t cal_val = rtc_clk_cal(0, 1024);
          ESP_LOGI("rtc_cal", "ESP32-S3 Hardware RTC slow clock calibrated: %lu (Q19.12)", (unsigned long)cal_val);

          // Release all deep sleep pad holds immediately via board HAL (2026-10-23 16:36:00)
          id(hal_release_deep_sleep_holds).execute();

          id(sleep_start_time) = millis();
          id(is_hibernating) = false;
          id(display_power_state) = 0; // ACTIVE
          esphome::voice_assistant::ensure_wake_words_restored(id(va));

    - priority: -100
      then:
        - safe_mode.mark_successful:
        - script.execute: hal_init_pmu_irq
        - lambda: 'esphome::voice_assistant::install_sendspin_mono_downmixer(id(sendspin_source));'
        - media_player.pause: pocket_music_player
        - online_image.release: remote_album_art
        - lambda: 'id(current_loaded_art_url) = "";'
        - audio_dac.set_volume:
            id: es8311_dac
            volume: 90%
        - audio_dac.mute_on: es8311_dac
        - script.execute: route_i2s_to_mic
        - switch.turn_off: speaker_enable
        - script.execute: apply_default_start_page
        - script.execute: apply_theme_preset
        - lambda: |-
            id(clock_face_digital) = (id(clock_face_style).current_option() == "Modern Digital (Bold)");
            id(is_24h_format) = (id(time_format_select).current_option() == "24-Hour");
            // Remote slots are populated dynamically from sensor.pocket_assistant_remote_config (Latter v1.0.3+)
            if (id(remote_slot_0_name).empty()) id(remote_slot_0_name) = "TV Remote";
            // Seed AXP2101 USB/charging status immediately at boot so Frame 1 shows live battery telemetry
            uint8_t reg0 = 0x00, stat0 = 0, reg1 = 0x01, stat1 = 0;
            bool vbus = false;
            if (id(bus_internal).write_readv(0x34, &reg0, 1, &stat0, 1) == esphome::i2c::ERROR_OK) {
              vbus = (stat0 & 0x20) != 0;
              id(usb_connected).publish_state(vbus);
            }
            if (id(bus_internal).write_readv(0x34, &reg1, 1, &stat1, 1) == esphome::i2c::ERROR_OK) {
              bool is_chg = vbus && (((stat1 >> 5) & 0x03) == 1) && ((stat1 & 0x07) < 4);
              id(batt_charging).publish_state(is_chg);
            }
        - component.update: batt_level
        - if:
            condition:
              lambda: 'return !id(wifi_ctrl).has_sta() || id(ble_room_beacon_switch).state;'
            then:
              - logger.log: "Enabling BLE radio (Improv setup or BLE Room Presence Beacon active)"
              - ble.enable:
        - lambda: |-
            esphome::voice_assistant::ensure_wake_words_restored(id(va), true);
            id(va_active_wake_word).publish_state(
                esphome::voice_assistant::wake_word_id_to_label(esphome::voice_assistant::last_persisted_ww1()));
            auto cur_vp = id(va_visual_profile).current_option();
            if (cur_vp == "Google" || cur_vp == "Original") {
              id(va_visual_profile).publish_state(cur_vp == "Google" ? "Gemini" : "Nebula");
            }
        - script.execute: apply_wake_word_sensitivities
        - script.execute: sync_display_brightness
        - script.execute: screen_sleep_timer

logger:
  level: INFO

api:
  encryption:
  outgoing_connection:
  on_client_connected:
    then:
      - lambda: |-
          esphome::voice_assistant::on_api_client_authenticated(id(va), client_info, client_address);
  actions:
    - action: set_browse_slots
      variables:
        mode: string
        page: int
        total_pages: int
        has_prev: bool
        has_next: bool
        s1_name: string
        s1_id: string
        s1_type: string
        s1_active: bool
        s2_name: string
        s2_id: string
        s2_type: string
        s2_active: bool
        s3_name: string
        s3_id: string
        s3_type: string
        s3_active: bool
        s4_name: string
        s4_id: string
        s4_type: string
        s4_active: bool
        s5_name: string
        s5_id: string
        s5_type: string
        s5_active: bool
      then:
        - lambda: |-
            id(music_browse_page) = page;
            id(music_browse_total_pages) = total_pages;
            id(slot_1_name) = s1_name;
            id(slot_1_id) = s1_id;
            id(slot_1_type) = s1_type;
            id(slot_1_active) = s1_active;
            id(slot_2_name) = s2_name;
            id(slot_2_id) = s2_id;
            id(slot_2_type) = s2_type;
            id(slot_2_active) = s2_active;
            id(slot_3_name) = s3_name;
            id(slot_3_id) = s3_id;
            id(slot_3_type) = s3_type;
            id(slot_3_active) = s3_active;
            id(slot_4_name) = s4_name;
            id(slot_4_id) = s4_id;
            id(slot_4_type) = s4_type;
            id(slot_4_active) = s4_active;
            id(slot_5_name) = s5_name;
            id(slot_5_id) = s5_id;
            id(slot_5_type) = s5_type;
            id(slot_5_active) = s5_active;
            if (mode == "areas" || mode == "entities") {
              id(room_browse_mode) = mode;
              id(room_browse_page) = page;
              id(room_browse_total_pages) = total_pages;
              id(room_slot_1_name) = s1_name; id(room_slot_1_id) = s1_id; id(room_slot_1_type) = s1_type; id(room_slot_1_active) = s1_active;
              id(room_slot_2_name) = s2_name; id(room_slot_2_id) = s2_id; id(room_slot_2_type) = s2_type; id(room_slot_2_active) = s2_active;
              id(room_slot_3_name) = s3_name; id(room_slot_3_id) = s3_id; id(room_slot_3_type) = s3_type; id(room_slot_3_active) = s3_active;
              id(room_slot_4_name) = s4_name; id(room_slot_4_id) = s4_id; id(room_slot_4_type) = s4_type; id(room_slot_4_active) = s4_active;
              id(room_slot_5_name) = s5_name; id(room_slot_5_id) = s5_id; id(room_slot_5_type) = s5_type; id(room_slot_5_active) = s5_active;
            }
            pocket_ui::schedule_disp_update(&id(disp1));

    - action: set_room_slots
      variables:
        mode: string
        page: int
        total_pages: int
        has_prev: bool
        has_next: bool
        s1_name: string
        s1_id: string
        s1_type: string
        s1_active: bool
        s1_level: int
        s2_name: string
        s2_id: string
        s2_type: string
        s2_active: bool
        s2_level: int
        s3_name: string
        s3_id: string
        s3_type: string
        s3_active: bool
        s3_level: int
        s4_name: string
        s4_id: string
        s4_type: string
        s4_active: bool
        s4_level: int
        s5_name: string
        s5_id: string
        s5_type: string
        s5_active: bool
        s5_level: int
      then:
        - lambda: |-
            (void)has_prev; (void)has_next;
            id(room_browse_mode) = mode;
            id(room_browse_page) = page;
            id(room_browse_total_pages) = total_pages;
            id(room_slot_1_name) = s1_name; id(room_slot_1_id) = s1_id; id(room_slot_1_type) = s1_type; id(room_slot_1_active) = s1_active; id(room_slot_1_level) = s1_level;
            id(room_slot_2_name) = s2_name; id(room_slot_2_id) = s2_id; id(room_slot_2_type) = s2_type; id(room_slot_2_active) = s2_active; id(room_slot_2_level) = s2_level;
            id(room_slot_3_name) = s3_name; id(room_slot_3_id) = s3_id; id(room_slot_3_type) = s3_type; id(room_slot_3_active) = s3_active; id(room_slot_3_level) = s3_level;
            id(room_slot_4_name) = s4_name; id(room_slot_4_id) = s4_id; id(room_slot_4_type) = s4_type; id(room_slot_4_active) = s4_active; id(room_slot_4_level) = s4_level;
            id(room_slot_5_name) = s5_name; id(room_slot_5_id) = s5_id; id(room_slot_5_type) = s5_type; id(room_slot_5_active) = s5_active; id(room_slot_5_level) = s5_level;
            pocket_ui::schedule_disp_update(&id(disp1));

    - action: set_timer
      variables:
        seconds: int
      then:
        - lambda: |-
            if (seconds > 0) {
              uint32_t now_t = millis();
              int slot = pocket_ui::upsert_voice_timer_slot("ha_action", "", seconds, seconds, true, now_t);
              pocket_ui::timer_view_slot() = slot + 1;
              pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
              id(timer_ringing) = false;
              id(gui_page) = 8;
              id(stuff_subpage) = 1;
              id(wake_to_active_state).execute();
              pocket_ui::schedule_disp_update(&id(disp1));
              ESP_LOGI("timer", "Voice/HA Timer started for %d seconds in slot %d", (int)seconds, slot + 1);
            }

    - action: cancel_timer
      then:
        - lambda: |-
            auto *slots = pocket_ui::timer_slots();
            for (int i = 0; i < 3; i++) {
              slots[i].running = false;
              slots[i].paused = false;
              slots[i].remaining_sec = slots[i].duration_sec;
            }
            pocket_ui::sync_multi_timer_globals(id(timer_running), id(timer_paused), id(timer_remaining_sec), id(timer_duration_sec), id(timer_target_ms));
            id(timer_ringing) = false;
            id(stop_alarm_sound).execute();
            pocket_ui::schedule_disp_update(&id(disp1));
            ESP_LOGI("timer", "Voice/HA Timers cancelled");

ota:
  - platform: esphome
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        - lambda: |-
            id(ota_in_progress) = true;
            id(ota_progress_pct) = 0;
            id(sleep_start_time) = 0; // Inhibit auto-deep sleep during OTA!
            // Ensure hardware pads are unheld and display is awake for OTA progress
            pocket_ui::screen_is_off_standby() = false;
            id(display_power_state) = 0;
            id(disp1).start_poller();
            id(hal_release_deep_sleep_holds).execute();
            id(disp1).set_brightness(230);
        - light.turn_on:
            id: display_brightness
            brightness: 90%
        - component.update: disp1
    on_progress:
      then:
        - lambda: |-
            int pct = static_cast<int>(x);
            if (pct != id(ota_progress_pct) && (pct == 100 || pct - id(ota_progress_pct) >= 2 || pct < id(ota_progress_pct))) {
              id(ota_progress_pct) = pct;
              id(disp1).update();
            }
    on_end:
      then:
        - lambda: |-
            id(ota_progress_pct) = 100;
            id(disp1).update();
            id(ota_in_progress) = false;

  - platform: http_request
    id: ota_http
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        - lambda: |-
            id(ota_in_progress) = true;
            id(ota_progress_pct) = 0;
            id(sleep_start_time) = 0;
            pocket_ui::screen_is_off_standby() = false;
            id(display_power_state) = 0;
            id(disp1).start_poller();
            id(hal_release_deep_sleep_holds).execute();
            id(disp1).set_brightness(230);
        - light.turn_on:
            id: display_brightness
            brightness: 90%
        - component.update: disp1
    on_progress:
      then:
        - lambda: |-
            int pct = static_cast<int>(x);
            if (pct != id(ota_progress_pct) && (pct == 100 || pct - id(ota_progress_pct) >= 2 || pct < id(ota_progress_pct))) {
              id(ota_progress_pct) = pct;
              id(disp1).update();
            }
    on_end:
      then:
        - lambda: |-
            id(ota_progress_pct) = 100;
            id(disp1).update();
            id(ota_in_progress) = false;

update:
  - platform: http_request
    id: update_pocket_assistant
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-pocket-assistant/manifest.json"
    update_interval: never

wifi:
  id: wifi_ctrl
  fast_connect: true
  power_save_mode: NONE
  on_connect:
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(ble_ctrl).is_active() && !id(ble_room_beacon_switch).state;'
          then:
            - logger.log: "Wi-Fi connected & BLE Room Beacon off: disabling BLE radio"
            - ble.disable:

esp32_ble:
  id: ble_ctrl
  enable_on_boot: false
  use_psram: true
  max_connections: 1

esp32_ble_beacon:
  type: iBeacon
  uuid: "504F434B-4554-4153-5354-000000000210"
  major: 1
  minor: 1
  measured_power: -59
  tx_power: 3dBm
  min_interval: 500ms
  max_interval: 1000ms

improv_ble:
  authorizer: none
  wifi_timeout: 5s

safe_mode:
  boot_is_good_after: 5s

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lambda: |-
            if (id(display_power_state) == 0 && !id(is_hibernating)) {
              pocket_ui::record_ambient_frame_ms(0);
            }

# ==============================================================================
# MODULAR PACKAGES
# ==============================================================================
packages:
  # Hardware Abstraction Layer (HAL)
  hal: !include boards/waveshare_175c.yaml

  # Core System Engines
  audio: !include core/audio.yaml
  power: !include core/power.yaml
  ui: !include core/ui.yaml

# ==============================================================================
# 🧭 Pocket Assistant (v3.4.8 Modular Architecture)
# Target: Waveshare ESP32-S3-Touch-AMOLED-1.75C
# Framework: ESPHome 2026.9.0+ (ESP-IDF 5.5+)
# Repository: https://github.com/slampton/esphome-pocket-assistant
# ==============================================================================

substitutions:
  name: "pocket-assistant"
  friendly_name: "Pocket Assistant"
  version: "3.7.6"
  pickup_threshold: "0.22"
  active_seconds: "8" 
  default_start_app: "Clock"
  browse_script: "script.music_assistant_browse"
  active_speaker_helper: "input_text.pocket_assistant_active_speaker"
  target_title_sensor: "sensor.pocket_assistant_target_title"
  target_artist_sensor: "sensor.pocket_assistant_target_artist"
  target_album_sensor: "sensor.pocket_assistant_target_album"
  target_state_sensor: "sensor.pocket_assistant_target_state"
  target_pos_sensor: "sensor.pocket_assistant_target_position"
  target_dur_sensor: "sensor.pocket_assistant_target_duration"
  target_art_url_sensor: "sensor.pocket_assistant_target_art_url"

  # Initial Boot Placeholder Art (Overridden dynamically on track playback)
  initial_art_url: "http://homeassistant.local:8123/static/icons/favicon-192x192.png"

  # Local Media Player Identity
  local_player_id: "media_player.pocket_assistant"


dashboard_import:
  package_import_url: github://slampton/esphome-pocket-assistant/pocket-assistant-1.75c.yaml@main
  import_full_config: false

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: "slampton.pocket-assistant-175c"
    version: "${version}"
  includes:
    - va_cancel_helper.h
  on_boot:
    - priority: 800
      then:
      - lambda: |-
          // Calibrate internal RTC slow clock against 40MHz crystal
          extern uint32_t rtc_clk_cal(int cal_clk, uint32_t slow_clk_cycles) __asm__("rtc_clk_cal");
          uint32_t cal_val = rtc_clk_cal(0, 1024);
          ESP_LOGI("rtc_cal", "ESP32-S3 Hardware RTC slow clock calibrated: %lu (Q19.12)", (unsigned long)cal_val);

          // Accidental Pocket Bump Rejection on Deep Sleep Wakeup
          id(abort_boot) = false;
          esp_sleep_wakeup_cause_t cause = esp_sleep_get_wakeup_cause();
          if (cause == ESP_SLEEP_WAKEUP_EXT0 || cause == ESP_SLEEP_WAKEUP_GPIO) {
            int held_count = 0;
            for (int k = 0; k < 6; k++) {
              esp_rom_delay_us(50000); // 50ms per check = 300ms total
              if (gpio_get_level(GPIO_NUM_0) == 0) {
                held_count++;
              }
            }
            if (held_count < 4) { // Not held continuously for at least ~200ms -> accidental pocket bump
              ESP_LOGI("power", "Pocket bump detected (<200ms). Returning immediately to deep sleep.");
              id(abort_boot) = true;
            } else {
              ESP_LOGI("power", "Deliberate wake button hold confirmed! Resuming watch.");
              int wake_guard = 0;
              while (gpio_get_level(GPIO_NUM_0) == 0 && wake_guard < 150) {
                esp_rom_delay_us(10000);
                wake_guard++;
              }
            }
          }

          // USB Charging Safety: Deep sleep is completely inhibited while docked on USB power
          uint8_t r0 = 0x00, s0 = 0;
          if (id(bus_internal).write_readv(0x34, &r0, 1, &s0, 1) == esphome::i2c::ERROR_OK) {
            bool vbus = (s0 & 0x20) != 0;
            id(usb_connected).publish_state(vbus);
            if (vbus) {
              id(abort_boot) = false;
              ESP_LOGI("power", "USB power detected on boot: deep sleep abort inhibited.");
            }
          }

          // If deliberate boot confirmed, release all deep sleep pad holds so peripherals initialize
          if (!id(abort_boot)) {
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_1);
            gpio_hold_dis(GPIO_NUM_2);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_hold_dis(GPIO_NUM_12);
          }
      - if:
          condition:
            lambda: 'return id(abort_boot);'
          then:
            - deep_sleep.enter: deep_sleep_ctrl
          else:
            - lambda: |-
                id(sleep_start_time) = millis();
                id(is_locked) = false;
                id(is_hibernating) = false;
                id(display_power_state) = 0; // ACTIVE
            - script.execute: route_i2s_to_mic
            - switch.turn_on: speaker_enable

    - priority: -100
      then:
        - audio_dac.set_volume:
            id: es8311_dac
            volume: 70%
        - audio_dac.mute_on: es8311_dac
        - script.execute: apply_default_start_page
        - script.execute: rebuild_active_deck
        - script.execute: apply_theme_preset
        - lambda: |-
            id(clock_face_digital) = (id(clock_face_style).current_option() == "Modern Digital (Bold)");
            id(is_24h_format) = (id(time_format_select).current_option() == "24-Hour");
        - script.execute: sync_display_brightness

logger:
  level: INFO

api:
  actions:
    - action: set_browse_slots
      variables:
        mode: string
        page: int
        total_pages: int
        has_prev: bool
        has_next: bool
        s1_name: string
        s1_id: string
        s1_type: string
        s1_active: bool
        s2_name: string
        s2_id: string
        s2_type: string
        s2_active: bool
        s3_name: string
        s3_id: string
        s3_type: string
        s3_active: bool
      then:
        - lambda: |-
            id(music_browse_page) = page;
            id(music_browse_total_pages) = total_pages;
            id(music_browse_has_prev) = has_prev;
            id(music_browse_has_next) = has_next;
            id(slot_1_name) = s1_name;
            id(slot_1_id) = s1_id;
            id(slot_1_type) = s1_type;
            id(slot_1_active) = s1_active;
            id(slot_2_name) = s2_name;
            id(slot_2_id) = s2_id;
            id(slot_2_type) = s2_type;
            id(slot_2_active) = s2_active;
            id(slot_3_name) = s3_name;
            id(slot_3_id) = s3_id;
            id(slot_3_type) = s3_type;
            id(slot_3_active) = s3_active;
            id(disp1).update();

ota:
  - platform: esphome
    on_begin:
      then:
        - script.stop: screen_sleep_timer
        - lambda: |-
            id(ota_in_progress) = true;
            id(ota_progress_pct) = 0;
            id(ota_display_pct) = 0.0f;
            id(sleep_start_time) = 0; // Inhibit auto-deep sleep during OTA!
            // Ensure hardware pads are unheld and display is awake for OTA progress
            gpio_deep_sleep_hold_dis();
            gpio_hold_dis(GPIO_NUM_1);
            gpio_hold_dis(GPIO_NUM_2);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_hold_dis(GPIO_NUM_12);
            id(disp1).set_brightness(230);
        - light.turn_on:
            id: display_brightness
            brightness: 90%
        - component.update: disp1
    on_progress:
      then:
        - lambda: |-
            id(ota_progress_pct) = (uint8_t)x;
            id(disp1).update();
    on_end:
      then:
        - lambda: |-
            id(ota_in_progress) = false;
            id(disp1).update();

  - platform: http_request
    id: ota_http

update:
  - platform: http_request
    id: update_pocket_assistant
    name: "Project Firmware"
    icon: "mdi:cellphone-arrow-down"
    source: "https://slampton.github.io/esphome-pocket-assistant/manifest.json"
    update_interval: 6h

wifi:
  fast_connect: true
  power_save_mode: LIGHT
  ap:
    ssid: "Pocket Assistant Fallback"

time:
  - platform: homeassistant
    id: ha_time

# ==============================================================================
# 🧩 MODULAR PACKAGES
# ==============================================================================
packages:
  # Hardware Abstraction Layer (HAL)
  hal: !include boards/waveshare_175c.yaml

  # Core System Engines
  audio: !include core/audio.yaml
  power: !include core/power.yaml
  ui: !include core/ui.yaml
